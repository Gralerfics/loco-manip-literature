<!doctype html>
<html lang="zh-CN">

<title>移动操作文献关系图</title>
<style>
:root{--ink:#182d36;--muted:#60727a;--line:#d8e2e5;--bg:#f5f8f8;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
main{max-width:1920px;margin:auto;padding:20px 24px 24px}
h1{font-size:25px;line-height:1.25;margin:0 0 5px;font-weight:650}
p{margin:5px 0}
.intro{max-width:1110px;color:var(--muted)}
.site-nav{display:flex;gap:22px;margin-bottom:14px;font-size:14px}
.site-nav a{text-decoration:none}.site-nav .current{color:var(--ink);font-weight:650}
.controls{display:flex;align-items:end;flex-wrap:wrap;gap:10px 12px;margin:17px 0 10px}
.field{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.field input,.field select{min-width:155px;height:35px;padding:5px 8px;border:1px solid #b9c9ce;border-radius:4px;background:#fff;color:var(--ink);font:14px system-ui}
.field.search input{width:min(300px,75vw)}
button{font:inherit;cursor:pointer}
.switch{height:35px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:0 7px;color:var(--ink)}
.switch input{accent-color:#2b6874}
.plain-button{height:35px;padding:5px 11px;background:#fff;border:1px solid #b9c9ce;border-radius:4px;color:var(--ink)}
.plain-button:hover,.plain-button:focus-visible{background:#edf5f6;border-color:#7ba2a9}
.status{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;color:var(--muted);font-size:12px}
.graph-shell{position:relative;height:clamp(700px,80vh,980px);border:1px solid var(--line);background:#fff;overflow:hidden;touch-action:none}
svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}
.node{cursor:pointer}
.node rect{filter:drop-shadow(0 1px 2px rgba(22,53,63,.07))}
.node:hover rect,.node:focus-visible rect{stroke-width:2.5}
.node:focus-visible{outline:none}
.edge-hit{cursor:pointer}
.edge-hit:hover+path{stroke-width:3.4}
.map-tools{position:absolute;top:12px;right:12px;display:flex;gap:5px;background:rgba(255,255,255,.92);padding:5px;border:1px solid var(--line);border-radius:5px}
.map-tools button{height:30px;min-width:31px;padding:2px 7px;background:#fff;border:1px solid var(--line);border-radius:3px}
.map-tools button:hover{background:#edf5f6}
.legend{background:#fff;padding:8px 11px;border:1px solid var(--line);border-top:0;color:#4b626a;font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.legend div+div{margin-top:3px}
.swatch{width:24px;height:0;border-top:2px solid #336e79}
.swatch.compare{border-top:2px dashed #8b9fa8}
.swatch.lab{border-top:2px dotted #807894}
.swatch.survey{border-top:2px dotted #b3bec2}
.swatch.background{border-top:2px dashed #c2b79e}
.hint{margin:8px 0 0;color:var(--muted);font-size:12px}
footer{margin:15px 0 0;color:var(--muted);font-size:12px}
a{color:#245f78;text-underline-offset:2px}
a:hover{color:#113f54}
.drawer{position:fixed;z-index:30;right:0;top:0;bottom:0;width:min(460px,100vw);overflow-y:auto;background:#fff;border-left:1px solid #c7d6db;box-shadow:-12px 0 32px rgba(26,50,59,.17);transform:translateX(103%);transition:transform .19s ease;padding:20px 22px 25px}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-kicker{font-size:12px;color:var(--accent,#446875);font-weight:650}
.close{height:32px;width:32px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:20px;line-height:1}
.drawer h2{font-size:21px;line-height:1.28;margin:13px 0 8px}
.drawer .meta{font-size:12px;color:var(--muted);margin-bottom:13px}
.drawer .links{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 20px}
.drawer .links a{border:1px solid var(--line);border-radius:4px;padding:5px 8px;text-decoration:none;font-size:12px}
.drawer .links a:hover{background:#eef5f6}
.fact{margin:0 0 17px}
.fact h3{font-size:12px;color:#526773;margin:0 0 4px;font-weight:650}
.fact p{margin:0;font-size:14px}
.related-title{border-top:1px solid var(--line);padding-top:16px;margin-top:5px;font-size:14px}
.related-item{border-bottom:1px solid #e7edef;padding:9px 0}
.related-item:last-child{border-bottom:0}
.related-item button,.edge-endpoint{border:0;background:none;color:#245f78;text-align:left;padding:0;text-decoration:underline;text-underline-offset:2px}
.related-item small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.backdrop{display:none;position:fixed;z-index:25;inset:0;background:rgba(15,37,47,.31)}
.backdrop.open{display:block}
@media(min-width:801px){.backdrop{display:none!important}}
@media(max-width:800px){main{padding:15px}.graph-shell{height:70vh;min-height:520px}.drawer{width:min(460px,100vw)}}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="site-header"><nav data-site-nav></nav></div><script src="assets/site-nav.js"></script>
<main>



<div class="controls">
 <label class="field search">搜索论文或问题<input id="search" type="search" placeholder="例如接触力、柜门、RoLoMa"></label>

  <button id="zoom-out" type="button" title="缩小" aria-label="缩小">－</button>

 </div>

<div class="legend"><div><i class="swatch"></i>原文承接 <i class="swatch background"></i>背景引用 <i class="swatch compare"></i>问题比较 <i class="swatch lab"></i>同作者群 <i class="swatch survey"></i>综述收录</div><div>背景与比较线不表示后作采用前作方法。</div></div>


</main>
<div id="backdrop" class="backdrop"></div>

<script id="data" type="application/json">{"papers": [{"id": "2203.01446", "title": "RoLoMa: Robust Loco-Manipulation for Quadruped Robots with Arms", "label": "RoLoMa", "year": "2022", "date": "2022-03", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "全身控制器能纠正一定的执行偏差，但如果规划的姿态本来就几乎承受不了额外作用力，执行时再补救的余地很小。", "method": "从动力学、关节力矩和摩擦等约束计算轨迹在最不利方向上还能承受多大外力，用这个抗扰裕量作为轨迹优化目标；允许足接触位置在给定阶段内调整。接触何时建立或断开仍需预先指定。", "interface": "输入机器人、手臂及接触的模型，给定操作任务和预设的接触切换顺序；输出身体、关节、手端与足端的整段运动轨迹，交给现有控制器同步执行。", "improvement": "论文明确扩展作者 2020 年只处理站立姿态鲁棒性的工作，把抗扰裕量用于带接触切换的移动操作。它是在**规划时**留出抗扰余量，与受扰动后重新抓取或在线调整示范进度的 Guided RL 解决不同环节；两者之间不能写成直接方法继承。", "experiment": "ANYmal＋Kinova 真机在工业平台模拟环境转手轮、拉杆、推门，并在后退迈步时拉绳提桶；比较不同轨迹承受外力的能力。论文报告其优化轨迹在所测方向上的最小不可抵抗外力约 60 N，比对照轨迹高约 33%。", "limit": "工业任务中的远距离移动仍由人遥控；机器人到目标附近才离线规划并执行操作。物体动力学未纳入规划，极端作用力仍可能超过反馈控制能补偿的范围；实测承受力阈值比模型预测低约 21–22%，不能把规划裕量当作任意实际扰动下的安全保证。", "url": "https://doi.org/10.1007/s10514-023-10146-0", "pdf": "papers/2203.01446_RoLoMa_Robust_Loco-Manipulation_for_Quadruped_Robots_with_Arms.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K11", "title": "抗扰裕量是在扰动发生前保留余地"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "2308.09179", "title": "Versatile Multi-Contact Planning and Control for Legged Loco-Manipulation", "label": "ETH Multi-Contact", "year": "2023", "date": "2023-08", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "打开带回弹力的门时，不能只规划手臂；还要决定站在哪里、用手还是脚顶住、何时松开。", "method": "在接触状态树中搜索候选接触切换，每次扩展都用短期轨迹优化检查几何和动力学可行性；交替使用目标方向与随机方向扩展。找到接触序列后固定它，重新优化整段连续运动。", "interface": "输入：机器人和物体的几何、动力学模型，允许接触的部位，初始状态和任务目标，例如把门打开并通过。 输出：先生成身体、关节、物体的运动计划，以及接触位置、接触顺序和作用力；执行时由两层控制器跟踪计划。", "improvement": "相较预先写好的动作步骤，接触顺序和全身运动可以共同求解。它扩大了可规划任务的种类；不是一个从图像自动理解任意任务的系统。", "experiment": "真机开关重洗碗机、通过弹簧门；也有阀门等仿真任务。", "limit": "要事先提供物体模型和可接触区域，步态模板及接触建立／释放的短时结构仍有预设。在线 MPC 主要调整已有计划的连续运动，并为计算速度去掉物体状态；接触大幅偏离后，整套接触顺序不会自动重算。", "url": "https://arxiv.org/abs/2308.09179", "pdf": "papers/2308.09179_Versatile_Multi-Contact_Planning_and_Control_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K24", "title": "机构约束与在线交互辨识"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "2410.13817", "title": "Guided Reinforcement Learning for Robust Multi-Contact Loco-Manipulation", "label": "Guided RL", "year": "2024", "date": "2024-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "上一类规划算出的动作可行，但物体参数不准、手滑或机器人被推时，照着原计划执行容易失败。", "method": "跟踪偏差大时自动降低示范进度的推进速度，让策略先追赶；另由策略输出进度残差，必要时倒退重抓。训练改变摩擦、门的弹簧参数等，按当前接触模式启用身体、物体和抓取关系的跟踪目标。", "interface": "输入：机器人和物体的当前状态、与示范的偏差、抓取端的位置和速度、当前动作进度。训练另需每个任务的一条规划示范。 输出：全身关节角度目标，以及示范进度的调整量；可以放慢、加快或倒退到前面的阶段。", "improvement": "明确承接 Multi-Contact 的示范生成方法，增加受扰动后的反馈执行；学到示范中没有的重新抓住把手、滑移恢复。", "experiment": "四种门／洗碗机任务，各 4096 个仿真测试，比较固定时钟、最近参考搜索、自适应进度及消融。拉门任务的固定时钟与完整方法成功率为 15.38%／96.33%，定义为完成示范进度超过 95%；主要增益来自自适应推进，进度残差的平均增益较小。ANYmal 真机每项任务完成六次连续测试。", "limit": "部署时通过动捕等获取物体状态。恢复主要围绕给定示范；需要换一整套接触计划时仍需重规划。附录 D.1 把门把手视为固定物体链接，加入锁机构后的尝试成功率低，不能据此认定“转把手解锁再穿门”已完整解决。", "url": "https://arxiv.org/abs/2410.13817", "pdf": "papers/2410.13817_Guided_Reinforcement_Learning_for_Robust_Multi-Contact_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K24", "title": "机构约束与在线交互辨识"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}]}, {"id": "2504.06662", "title": "RAMBO: RL-Augmented Model-Based Whole-Body Control for Loco-Manipulation", "label": "RAMBO", "year": "2025", "date": "2025-04", "group": "模型规划／显式控制", "platform": "四足足端／无臂", "problem": "模型控制能明确计算施力，但怕模型不准；单靠学习又不容易精确控制接触力。", "method": "用单刚体模型解接触力分配 QP，再通过足端 Jacobian 得到前馈力矩；强化学习分别纠正身体加速度参考和关节位置参考。它的 QP 不等同于完整关节逆动力学的全身控制器。", "interface": "输入：期望身体速度、操作足端的位置和施力，机器人自身状态、步态信息及近期历史。 输出：最终关节力矩。其中模型计算基础力矩，学习模块修正身体加速度和关节角度目标，再形成反馈力矩。", "improvement": "相较仅输出关节角度的学习控制器，保留显式施力计算；相较纯模型控制，增加对扰动和模型误差的适应。不能简化成网络直接加一组力矩。", "experiment": "Go2 真机用前腿推购物车、保持托盘平衡、持软物体，包含三腿支撑行走和后两腿行走；仿真比较无前馈、不同残差通道等设置。力目标训练施加反向虚拟外力，主要量化末端位置误差，不能把该表直接当作腕部力传感器的力跟踪误差。", "limit": "仍需模型和在线求解器；自身状态估计漂移会影响精度。高层任务和施力目标由外部提供。降低操作腿的 PD 增益可产生柔顺交互，但没有一般接触安全证明。", "url": "https://arxiv.org/abs/2504.06662", "pdf": "papers/2504.06662_RAMBO_RL-Augmented_Model-Based_Whole-Body_Control_for_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2507.22042", "title": "A Nonlinear MPC Framework for Loco-Manipulation of Quadrupedal Robots with Non-Negligible Manipulator Dynamics", "label": "Arm-dynamics NMPC", "year": "2025", "date": "2025-07", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "小机器狗背上较重的臂时，把臂当成固定附加重量，会漏掉臂运动对身体平衡的影响。", "method": "将身体单刚体模型与浮动机械臂模型分开，以安装点刚性约束和交互力／力矩保持动态一致性；同时优化身体运动、足底力和臂力矩。实际求解每个预测时域内冻结臂惯量、忽略臂的科里奥利项，每周期更新惯量，仍有计算近似。", "interface": "输入：身体和臂的状态、模型、接触条件，以及操作者给出的身体速度、朝向和臂关节目标。 输出：规划层输出未来身体运动和机械臂力矩；腿的下层控制器把身体运动计划转成腿部力矩，臂力矩直接执行。", "improvement": "相较质心动力学＋完整运动学的规划，进一步预测臂关节动力学并直接优化臂力矩；对照还改变了臂的力矩优化／PD 跟踪方式，不能把全部收益归于单个惯性项。未研究视觉或语言选动作。", "experiment": "Go2 约 15 kg、Kinova 臂约 4.4 kg；规划约 60 Hz，腿部控制约 500 Hz。真机验证负载、扰动、地形及开门／抽屉等遥操作；200 个随机地形中走完 10 m 的仿真稳定通过率为 86%／28%，这是移动稳定性，非操作任务成功率。", "limit": "需要力矩接口、准确模型和实时求解；真机规划使用外部电脑，不能直接当作轻量现成控制器。", "url": "https://arxiv.org/abs/2507.22042", "pdf": "papers/2507.22042_A_Nonlinear_MPC_Framework_for_Loco-Manipulation_of_Quadrupedal_Robots_with_Non-Negligible_Manipulator_Dynamics.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "2603.02443", "title": "Safe Whole-Body Loco-Manipulation via Combined Model and Learning-based Control", "label": "Safe Whole-Body Loco-Manipul", "year": "2026", "date": "2026-03", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "人推拉夹爪时，既要顺着作用力移动，也要避免身体或臂进入不允许的状态。", "method": "以设定的刚度、阻尼把测得外力转换为末端速度，并扣除身体运动来计算臂速度；参考管理器调整可能违反位置、速度、力及运动学边界的目标，另用状态估计改善身体速度反馈。", "interface": "输入：腕部力和力矩测量，机器人状态、估计的身体速度、允许的运动约束。 输出：先把外力换算成末端移动速度，再分配给臂和身体；臂由模型控制，腿由学习控制器输出关节角度。", "improvement": "相较只学目标跟踪的控制器，加入明确的受力响应和参考约束处理；模型模块也放进腿部策略训练过程。", "experiment": "Go2＋六自由度臂和腕部六维力传感器，仿真与真机验证人与机器人共同搬运等受力交互。", "limit": "需要腕部力传感器，与当前无力传感器的平台条件不同。安全集的实现采用离散采样、按轴计算和近邻查询；实验支持指定模型／约束下的参考过滤，不能外推为完整四足接触系统的任意碰撞安全保证。", "url": "https://arxiv.org/abs/2603.02443", "pdf": "papers/2603.02443_Safe_Whole-Body_Loco-Manipulation_via_Combined_Model_and_Learning-based_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2604.08508", "title": "Sumo: Dynamic and Generalizable Whole-Body Loco-Manipulation", "label": "Sumo", "year": "2026", "date": "2026-04", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "重物抬不起来时，要推、拖或翻转；每换一种物体就重新训练完整任务策略，成本很高。", "method": "运行时在仿真里尝试多组候选命令，每组都经过低层控制器执行预测；选评分好的方案，执行一小段后重算。", "interface": "输入：机器人和物体的状态估计、物体模型、任务评分规则，例如轮胎离直立状态还有多远。 输出：短期身体速度、臂关节目标等命令；已有的低层控制器把这些命令转成全身关节目标。", "improvement": "相较直接搜索所有关节动作，搜索范围更小、身体更容易稳定；相较每任务单独训练，只需运行时换物体模型或评分规则。", "experiment": "Spot 真机八种任务各十次，包括扶正／叠放重轮胎、拖围栏等；使用已有 ReLIC 控制器，部分任务借助脚和身体接触。G1 人形任务只在仿真中验证；对照中的通用三项成本用于受控仿真，完整真机任务另有任务专用成本。", "limit": "真机依赖外部动捕和离机计算；需对象模型、在线仿真及评分规则。物体坐标中的抓取／接近位置仍由任务设置给定；论文重点是上层规划，低层控制器不是其新贡献。", "url": "https://arxiv.org/abs/2604.08508", "pdf": "papers/2604.08508_Sumo_Dynamic_and_Generalizable_Whole-Body_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}]}, {"id": "2608.12063", "title": "Learning Loco-Manipulation From SMPC Demonstrations With Sparse Offline-to-Online RL", "label": "Learning Loco-Manipulation F", "year": "2026", "date": "2026-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "只在任务完成时给奖励，机器人随机练习很难碰巧成功；手工设计很多中间奖励又费时。", "method": "以采样式 MPC 自动生成经验，早期 TD3 训练约一半批数据来自规划器；达到成功率阈值后逐步去掉旧数据，用稀疏任务奖励继续学习。动作以命令增量表示，评价网络输出被限制在理论回报范围；数据规划器仍使用需调节的稠密成本。", "interface": "输入：有噪声的机器人和物体状态及任务目标；真机结合机载传感与外部运动捕捉获得状态。训练时先用仿真规划器生成成功经验。 输出：上层输出身体速度和臂关节目标的变化量；已有低层策略生成全身关节角度。Spot 实验不额外调整身体高度和俯仰。", "improvement": "相较纯模仿规划器，后续学习能找到更快的动作并超过老师；相较从零开始学习，减少寻找首次成功的困难。", "experiment": "Spot 推箱子、轮胎扶正／滚动及 G1 推箱子均有真机演示；完成时间、数据量／质量及多模态示范消融主要在仿真中量化。Spot 推理离机，G1 推理机载；两者使用外部动捕辅助状态估计。", "limit": "需要任务仿真、成功数据和状态估计。冻结的低层控制器不能针对新任务继续适应；示范引导的改进主要在数据覆盖附近。某轮胎任务的多模态数据训练失败，只说明该数据与 TD3 设置的兼容性问题，不能推广成多模态示范普遍无效。", "url": "https://arxiv.org/abs/2608.12063", "pdf": "papers/2608.12063_Learning_Loco-Manipulation_From_SMPC_Demonstrations_With_Sparse_Offline-to-Online_RL.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}]}, {"id": "2608.28140", "title": "Contact-Guided Exploration for Non-Prehensile Locomanipulation with Multi-Critic RL", "label": "Contact-Guided Exploration f", "year": "2026", "date": "2026-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "推椅子时，如果一直碰不到合适位置，学习几乎收不到有用奖励；一直奖励靠近某个点又会妨碍真正移动椅子。", "method": "用三个价值估计头分别评价任务完成、接近接触点和动作规范程度，再按权重合并各组优势来更新动作策略。接触探索权重按训练迭代从 0.1 降到 0.01，动作规范权重从 0.15 升到 0.24；它不是每次碰到物体就触发的在线切换。", "interface": "输入：身体和臂的关节状态、重力方向、身体速度，以及物体位置、朝向和到目标的误差。接触候选点和物体速度是训练评价网络的额外信息。 输出：上层输出臂关节角度、身体高度和身体速度；固定的行走策略输出腿部关节角度。", "improvement": "相较把所有奖励固定相加，能从“先找到接触”过渡到“把任务做好”；相较 Guided RL，不需要一条完整动作示范，但需要接触提示。", "experiment": "推箱子、移椅子仿真比较单价值网络／多价值网络与有无权重调度；主要对照均使用接触引导奖励。真机四种未见 IKEA 物体合计 40/58 次成功（约 69%），其中两种是少量边界案例。另有洗碗机门的接触切换分析。", "limit": "真机物体姿态由外部运动捕捉系统测量；训练依赖物体几何和接触候选。移椅子的仿真成功率约 94%，不能当成真机结果；洗碗机接触切换部分没有明确的真机验证记录。", "url": "https://arxiv.org/abs/2608.28140", "pdf": "papers/2608.28140_Contact-Guided_Exploration_for_Non-Prehensile_Locomanipulation_with_Multi-Critic_RL.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K22", "title": "可操作区域、接触目标与动作参数"}]}, {"id": "2210.10044", "title": "Deep Whole-Body Control: Learning a Unified Policy for Manipulation and Locomotion", "label": "Deep WBC", "year": "2022", "date": "2022-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "腿和臂分别控制时，臂够不到地面目标，身体也不知道应该蹲下或倾斜来帮忙。", "method": "在仿真里联合训练腿和臂；初期将操作优势主要用于臂动作、移动优势主要用于腿动作，再逐渐混入交叉影响。历史网络拟合环境编码，环境编码也被约束到历史可预测的表示，降低训练时特权信息与部署观测之间的差距。", "interface": "输入：身体姿态与角速度、腿和臂的关节状态、脚接触信息、上一动作、期望身体速度和末端位置／朝向。 输出：腿和臂的关节角度目标；每个关节的底层控制器再把角度误差变成力矩。", "improvement": "相较不交流的腿臂策略，身体会主动帮助扩大末端可达范围；同时研究了高维联合训练和仿真到真机的适应。", "experiment": "低成本 Go1＋臂，展示擦白板、取放、按按钮和抛物等；目标可来自遥控、视觉模块或示范回放。", "limit": "核心解决给定命令的执行；展示任务不等于同一个策略能自行理解和规划这些任务。采样参考系不随身体高度、侧倾和俯仰改变，但仍随身体水平位置和朝向变化，不能等同于完整固定的世界坐标目标。", "url": "https://arxiv.org/abs/2210.10044", "pdf": "papers/2210.10044_Deep_Whole-Body_Control_Learning_a_Unified_Policy_for_Manipulation_and_Locomotion.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2403.17367", "title": "RoboDuet: Learning a Cooperative Policy for Whole-body Legged Loco-Manipulation", "label": "RoboDuet", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "联合策略的精确末端姿态跟踪仍困难；又希望保留已经练好的走路能力。", "method": "先训练稳定行走，再启用臂与操作目标，让两策略协作。臂不只管自己的关节，还能请求身体改变姿态。", "interface": "输入：期望身体速度、末端位置和朝向，身体和关节状态、近期动作；两策略共享必要状态。 输出：臂策略输出臂关节角度，以及期望身体俯仰／侧倾；腿策略执行身体速度和姿态，输出腿关节角度。", "improvement": "相较完全独立的腿臂控制，明确建立姿态协作接口；相较 Deep WBC，采用分工结构，着重扩大六维末端姿态跟踪范围。", "experiment": "仿真和真机比较跟踪、工作空间与任务表现，并测试相近 Go1／Go2 平台之间的迁移。", "limit": "主要输入仍是外部给出的移动和末端命令；跨相似硬件迁移不等于跨任意机器人或任务。消融中两阶段训练主要改善抗扰存活率，合作分工主要改善姿态跟踪，不能将两个组件的收益混为一项。", "url": "https://arxiv.org/abs/2403.17367", "pdf": "papers/2403.17367_RoboDuet_Learning_a_Cooperative_Policy_for_Whole-body_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K46", "title": "用可调行为保留同一任务的多种运动解"}]}, {"id": "2407.10353", "title": "UMI on Legs: Making Manipulation Policies Mobile with Manipulation-Centric Whole-body Controllers", "label": "UMI on Legs", "year": "2024", "date": "2024-07", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "用真机器狗收集示范贵且危险；固定臂上学到的操作动作也难直接用于会移动的身体。", "method": "人拿手持夹爪收集示范，训练图像到轨迹的策略；另外在仿真中只练习全身跟踪轨迹。轨迹在不随身体晃动的任务坐标中表达，下层提前看到后续动作。", "interface": "输入：上层看腕部图像；下层看身体和关节状态，以及上层预测的一小段未来末端轨迹。 输出：上层输出夹爪未来的位置、朝向和开合；下层输出腿和臂的关节角度目标。", "improvement": "相较逐时刻给身体坐标中的末端目标，减少身体运动对任务轨迹的干扰；操作示范不必包含腿动作，也不必由机器人采集。", "experiment": "真机杯子重排、推壶铃和投球，每种主要条件 20 次；投球从人工放入球的预抓取状态开始。仿真分别移除预览、任务坐标和真实操作轨迹；文中 Deep WBC 风格基线由同时移除这三个组件构造。原固定臂的杯子操作策略直接部署到四足上。", "limit": "上层给出轨迹，未显式收到下层能力反馈；未来目标超出身体能力时仍会出问题。附录报告约 140 ms 的 iPhone 位姿延迟、需要校正臂惯量以及关节过热。推物成功不等于精确调节接触力；其低层训练没有物体或力跟踪任务。", "url": "https://arxiv.org/abs/2407.10353", "pdf": "papers/2407.10353_UMI_on_Legs_Making_Manipulation_Policies_Mobile_with_Manipulation-Centric_Whole-body_Controllers.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2507.08656", "title": "Multi-critic Learning for Whole-body End-effector Twist Tracking", "label": "Multi-critic Learning for Wh", "year": "2025", "date": "2025-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "只给一连串末端位置，不能直接要求移动速度；走路希望身体平稳，伸手又可能需要倾斜，两者训练目标冲突。", "method": "一个动作网络控制全身，走路、操作和脚接触时序各有价值估计网络；各组优势分别归一化后求和，用于更新同一策略。训练混合局部与全局参考轨迹，目标不是只在最后时刻到达终点。", "interface": "输入：身体运动命令、末端终点位姿和线速度／转动速度、抬脚高度，以及近期机器人状态。 输出：相对当前腿和臂关节角度的修正量，经截断后交给底层关节控制器执行。", "improvement": "相较只跟踪姿态的控制器，增加明确的速度要求；相较把奖励混在一起，分组评价使目标冲突和调参更容易处理。", "experiment": "ANYmal D＋Dynaarm 真机跟踪多速度直线、圆和半圆，记录位置与速度误差；仿真比较不同腿部策略和全身控制器。站立比较中的 Portela [8] 是 2025 年末端姿态跟踪论文，与 2024 年力控制论文不是同一篇；部分对照复用本文臂动作再替换腿策略。", "limit": "论文只覆盖中等粗糙地面；极限伸手有时仍触发肩关节保护。任务轨迹由外部提供。", "url": "https://arxiv.org/abs/2507.08656", "pdf": "papers/2507.08656_Multi-critic_Learning_for_Whole-body_End-effector_Twist_Tracking.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2508.10538", "title": "MLM: Learning Multi-task Loco-Manipulation Whole-Body Control for Quadruped Robot with Arm", "label": "MLM", "year": "2025", "date": "2025-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "控制器在某类轨迹上练得好，换空间范围不同的操作就变差；遥控时也拿不到未来轨迹。", "method": "建立真实轨迹库，按各任务的学习情况调整抽样难度；用轨迹历史预测未来目标，用自身状态历史估计身体速度，再训练全身跟踪。", "interface": "输入：身体和臂的近期状态、上一动作、末端轨迹历史；自动操作时也可以直接输入未来轨迹。 输出：十二个腿关节和六个臂关节的角度修正量。", "improvement": "相较 UMI on Legs 的轨迹接口，进一步处理多类轨迹之间的训练平衡，以及缺少未来轨迹的遥控情形。", "experiment": "Go2＋AIRBOT 真机演示遥控和图像扩散策略驱动的操作；轨迹抽样、预测网络及误差比较主要在仿真中完成。文中的 DeepWBC 式基线同时移除了未来轨迹预测、轨迹输入和任务坐标系，差异不能只归于网络结构。", "limit": "这里的“多任务”主要指同一个执行器跟踪多种操作轨迹；它不等于学会任意语言任务。", "url": "https://arxiv.org/abs/2508.10538", "pdf": "papers/2508.10538_MLM_Learning_Multi-task_Loco-Manipulation_Whole-Body_Control_for_Quadruped_Robot_with_Arm.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}]}, {"id": "2405.01402", "title": "Learning Force Control for Legged Manipulation", "label": "Force Control", "year": "2024", "date": "2024-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "强化学习机器人能推东西，但通常只是碰巧用了足够的力，不能明确要求“保持某个力”。", "method": "仿真中用虚拟弹簧／阻尼产生接触力，以真实仿真力计算力跟踪奖励，并监督从自身状态历史估计外力的网络。位置和力模式交替训练；部署时用位置误差与速度反馈生成力命令，实现可调柔顺交互。", "interface": "输入：近期身体和关节状态、动作历史，以及期望移动／末端目标或施力命令；不输入实测腕部力。 输出：腿和臂的关节角度目标；同时估计夹爪外力等状态供控制使用。", "improvement": "相较只按位置训练，明确学习力跟踪，支持人推拉夹爪时身体自动配合；位置模式与力模式在训练中切换。", "experiment": "B1＋Z1 真机在五个末端位置测量施力，误差约 5–10 N；展示柔顺示教、拉物体及移动中操作。控制器明确接收身体速度命令，包含行走能力，并非仅固定底盘的力控制。", "limit": "估计误差可能大于控制误差，作者指出策略可能没有强依赖估计力反馈。约 5 cm 的位置误差和约 5 N 的力误差不足以证明精细按钮或插接能力。分开的位置／力模式也是后续 Unified 要改进的地方。", "url": "https://arxiv.org/abs/2405.01402", "pdf": "papers/2405.01402_Learning_Force_Control_for_Legged_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2505.20829", "title": "Learning a Unified Policy for Position and Force Control in Legged Loco-Manipulation", "label": "Position + Force RL", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "接触操作不能只追位置，或只追力；操作策略也需要知道是否已经碰上、推紧或受阻。", "method": "仿真中同时改变位置、力命令和外部扰动，依据准静态阻抗关系将净力转成目标位移补偿，再奖励控制器跟踪补偿后的目标。示教时记录估计力，把它与视觉／运动信息一起用于后续操作学习。", "interface": "输入：身体和关节历史、动作、步态时序，以及身体速度、末端位置、末端／身体力命令；不依赖实测腕部力。 输出：全身关节角度目标，以及外力、末端位置和身体速度的估计。另一个模仿学习模块使用估计力生成操作动作。", "improvement": "明确针对 Force Control 的位置／力分开控制限制；进一步让力信息进入操作学习，而不只用于底层响应。", "experiment": "B2＋Z1 上擦白板、开／关按压式柜门和遮挡下拉抽屉四任务，每个设置 50 次，比较带力信息的操作学习与位置基线。G1 人形实验只验证身体力交互和移动，不包含这四个臂操作任务。", "limit": "控制推导省略末端惯性和阻尼，适用于较慢的操作；精细力估计仍受限制。操作基线同时移除力观测与力动作，因此约 39.5% 的成功率提升支持整套力信息方案，不能单独归因于力估计器；任务接触计划也仍由上层给出。", "url": "https://arxiv.org/abs/2505.20829", "pdf": "papers/2505.20829_Learning_a_Unified_Policy_for_Position_and_Force_Control_in_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}]}, {"id": "2604.27224", "title": "Learning Tactile-Aware Quadrupedal Loco-Manipulation Policies", "label": "Learning Tactile-Aware Quadr", "year": "2026", "date": "2026-04", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "视觉看不清夹持是否稳定、是否已经插入或夹得过紧；只复制夹爪路径容易损伤或操作失败。", "method": "用带触觉的手持夹爪收集示范，训练上层同时预测运动和接触变化；下层先练稳定行走，再在接触任务仿真中练配合这些目标。", "interface": "输入：上层看图像、夹爪姿态／开口和触觉历史；下层看机器人状态、触觉反馈以及期望运动与触觉目标。 输出：上层预测末端轨迹、夹爪开口和接触面积／方向／质心目标。第一阶段臂跟踪采用逆运动学；部署的低层策略输出腿和臂关节目标，分别降采样到 50 Hz 和 10 Hz 执行。", "improvement": "相较 UMI on Legs 只传轨迹，把“期望怎样接触”也传给执行层；同时区别于只把触觉接到上层的做法。", "experiment": "真机物体重定向与插入、拧紧阀门、轻柔抓取，每个任务设置 20 次。对照分别增加触觉观测、触觉预测和低层触觉跟踪；薯片任务的三个触觉版本均 100% 成功，不能据它单独证明低层触觉目标必要。", "limit": "精细接触阶段身体前向／侧向速度设为零，以姿态调整支持操作，未验证持续跨步中的精细接触。多数位置曲线以臂基座为原点，不计身体倾斜带来的位移；水果损伤缺乏仪器定量测量，定量轻柔抓取结果针对薯片。", "url": "https://arxiv.org/abs/2604.27224", "pdf": "papers/2604.27224_Learning_Tactile-Aware_Quadrupedal_Loco-Manipulation_Policies.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}, {"id": "K39", "title": "触觉、握力与接触释放"}]}, {"id": "2607.10132", "title": "TAC-LOCO: Unified Whole-Body Control for Quadrupedal TACtile-Informed LOCO-Manipulation", "label": "TAC-LOCO", "year": "2026", "date": "2026-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "手里物体被外力拉扯时，一直夹得很紧会损伤物体；夹得太松又会滑落。外部负载突然消失也会扰乱身体。", "method": "把各触觉点压缩成少量接触特征；仿真中随机改变物体负载，包含突然释放，奖励稳定抓持和不过度用力。", "interface": "输入：身体和关节状态、动作历史、身体速度和末端轨迹命令，以及两指触觉阵列测量。 输出：同一个策略输出腿、臂和夹爪的关节角度目标，在线调整夹持程度。", "improvement": "相较只从自身状态间接估计力，直接读取夹爪内部接触；相较高低层触觉系统，重点是同一控制器协调动态抓持与身体运动。", "experiment": "Go2＋WidowX 和触觉夹爪，真机用弹簧与磁铁制造负载变化／突然释放，动态移动操作成功 9/10 次。约 47% 的夹持力降低来自仿真奖励消融；低于 1% 的掉落率也来自大规模仿真，不能当成真机统计。", "limit": "从已经抓住物体的状态开始，不涉及自主找物、初始抓取或任务规划。逐帧归一化触觉保留相对接触图案，不能据此保证绝对握力阈值。真机基线同时采用固定夹爪且没有触觉，不能把成功率差单独归因于触觉输入。", "url": "https://arxiv.org/abs/2607.10132", "pdf": "papers/2607.10132_TAC-LOCO_Unified_Whole-Body_Control_for_Quadrupedal_TACtile-Informed_LOCO-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K39", "title": "触觉、握力与接触释放"}]}, {"id": "2609.03889", "title": "FWBC-VLA: Force-Aware Whole-Body Compensation for Contact-Rich Loco-Manipulation（轮足邻接）", "label": "FWBC-VLA", "year": "2026", "date": "2026-09", "group": "VLA 动作模型", "platform": "轮足", "problem": "视觉语言动作模型不易知道手是否受阻；底层稳住身体，也未必知道该抵消什么接触影响。", "method": "两个自由运动力矩预测器分别使用历史和当前状态；历史较低噪但可能吸收持续接触，状态分支较保留负载变化，由 gate 混合残差。六关节残差的强度／变化编码成 force tokens 输入动作专家；残差经阻尼 Jacobian 逆和力臂变换形成机身负载线索，供限幅／低通的速度补偿。", "interface": "M20S 轮足＋CM1 臂。输入图像、语言、本体状态及 200 Hz 实测臂关节力矩；π0.5 动作专家生成操作／基座指令，较快的小型残差网络另修正基座速度。无腕部力传感器仍需要实际关节力矩测量。", "improvement": "把力相关线索分别接入较慢的 VLA 动作生成和较快的身体反馈；力估计、动作条件化与身体补偿是三个可分开的改动。attention 是特征条件化，不是 Bayesian 外力估计。", "experiment": "超过 5,000 段示范；真机擦白板、开带闭门器的门各 25 次，最终 64%／52%，F/T 对照 60%／48%，各只差一次成功。已知 0.36／0.72 kg 负载主要验证重力大小，不能代替任意六维接触力标定。", "limit": "力矩残差还含摩擦、模型和执行误差，无闭环被动性／稳定性证明。正文与部分表中的任务、消融数字不一致，引用须指出表位置；不能将 sensorless 结果概括成比 F/T 更准确。", "url": "https://arxiv.org/abs/2609.03889", "pdf": "papers/2609.03889_FWBC-VLA_Force-Aware_Whole-Body_Compensation_for_Contact-Rich_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}]}, {"id": "2609.13779", "title": "Force-Aware Reinforcement Learning with Hybrid Sensorless Force Estimation for Wheeled-Legged Loco-Manipulation（轮足邻接）", "label": "Force-Aware Reinforcement Le", "year": "2026", "date": "2026-09", "group": "RL／全身执行", "platform": "轮足", "problem": "机器人运动造成的力矩变化里，混有地面支撑、手部接触和模型误差，直接把它当手部外力会控制错。", "method": "先用动力学估计总扰动，再利用支撑接触约束分出末端力，网络纠正剩余时变误差；学习策略按方向选择跟踪位置或力。", "interface": "输入：关节和身体状态、关节力矩命令、模型及支撑接触条件；控制器还接收位置／力目标和每个方向的控制选择。 输出：估计末端作用力；策略输出腿和臂的关节角度、轮子速度。", "improvement": "相较完全由历史网络猜力，加入物理分解；相较只做力估计，继续验证估计怎样改善全身接触控制。", "experiment": "仿真在相同轨迹上比较无约束分解、接触约束分解、单独时序网络与组合估计器，并比较箱子拖动的力误差和实际位移。轮足真机转阀门、擦拭使用仅用于评价的 F/T 传感器作定量参照，开门和人拖动引导提供整套系统的行为验证。", "limit": "支撑力、末端力和模型误差可能混淆；约束分解提供物理一致估计，不保证唯一恢复。±20% 惯量偏差也包含在估计网络的训练数据中，不能称为未见惯量泛化；控制无末端力传感输入仍依赖力矩相关信息。", "url": "https://arxiv.org/abs/2609.13779", "pdf": "papers/2609.13779_Force-Aware_Reinforcement_Learning_with_Hybrid_Sensorless_Force_Estimation_for_Wheeled-Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}]}, {"id": "2403.16967", "title": "Visual Whole-Body Control for Legged Loco-Manipulation", "label": "Visual WBC", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "给定末端目标的控制器不会自己找物体，也不会决定应该走近还是倾斜身体来抓取。", "method": "先用物体形状／姿态教师训练抓取，再通过 DAgger 把双分割深度学生带到其实际访问状态纠正。腿部策略看臂状态和末端目标，臂用 Jacobian 逆运动学；目标参考系随身体水平位置和 yaw 变化，但固定高度及 roll/pitch，使身体升降能扩展可操作空间。", "interface": "输入：上层看分割后的深度图和自身状态；下层接收身体速度、末端姿态目标及机器人状态。 输出：上层给身体速度和末端目标；下层学习策略输出腿关节角度，臂关节角度由几何求解得到。", "improvement": "相较只执行遥控命令，加入自主视觉动作选择；相较 Deep WBC 的全关节联合学习，臂采用几何求解以改善精确姿态跟踪。", "experiment": "真机 14 个物体×3 高度×5 次重置，每轮允许连续五次尝试，因此不是 one-shot 成功率。附录 E 行走位置误差 0.029 m 对 Deep WBC 0.414 m 来自仿真，不是真机接触精度。", "limit": "真机每轮开始人工点击目标，至少一相机需要看见目标；分割深度丢失很多颜色语义。抓取闭合时训练要求基座停止；部分固定的参考系并非完整世界固定接触控制，更未给出换步中接触力安全保证。", "url": "https://arxiv.org/abs/2403.16967", "pdf": "papers/2403.16967_Visual_Whole-Body_Control_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "2411.06782", "title": "QuadWBG: Generalizable Quadrupedal Whole-Body Grasping", "label": "QuadWBG", "year": "2024", "date": "2024-11", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "相机看到了物体，也算出了抓取点，但机器人当前站位可能够不到或朝向不合适。", "method": "离线计算不同臂目标下哪些身体站位可达、哪些更好；训练上层朝较好的站位移动，再用现有抓取求解和底层策略执行。", "interface": "输入：相机得到的候选抓取姿态、自身状态，以及预计算的可达信息；低层接收身体平面速度、高度和俯仰命令。 输出：上层选择身体移动／姿态命令，臂执行抓取姿态；行走策略输出腿部关节动作。", "improvement": "相较 Visual WBC 直接从图像学动作，显式加入抓取姿态和身体可达关系，减少学习负担，扩大抓取高度范围。", "experiment": "真机透明等多类物体抓取，作者报告一次抓取准确率 89%；比较可达信息有无带来的差别。", "limit": "系统比较还包含感知和执行差异。到达可抓取站位，不等于全段柜门接触轨迹可行；不提供持续换步时的接触力安全证明。", "url": "https://arxiv.org/abs/2411.06782", "pdf": "papers/2411.06782_QuadWBG_Generalizable_Quadrupedal_Whole-Body_Grasping.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K23", "title": "导航终点应满足后续操作条件"}]}, {"id": "2411.15131", "title": "WildLMa: Long Horizon Loco-Manipulation in the Wild", "label": "WildLMa", "year": "2024", "date": "2024-11", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "单次抓取不能解决清理走廊、操作柜子再摆放物品等多步骤任务，也难覆盖真实环境变化。", "method": "明确复用 VBC 全身低层收集 VR 示范，每技能单独训练 ACT；加入 CLIP 文本／像素余弦相关图提供目标定位。演示末尾监督技能终止，部署连续十次终止预测超过 0.8 后结束；LLM 通过人工导航 waypoint／连通关系调用技能。", "interface": "输入：语言任务、头部／腕部图像、机器人状态；训练时由人用 VR 遥控机器狗收集全身示范。 输出：任务规划器输出技能顺序；各技能策略产生末端等控制目标，下层生成身体和臂的关节命令。", "improvement": "相较只展示单次动作，把示教、可泛化技能与长程组合连起来；与 UMI on Legs 不同，示范涉及真实机器人全身和多相机观测。", "experiment": "技能均值 71.2%，ACT 40.8%，OpenTV 64.4%；垃圾长任务 7/10、货架 3/10。开门双相机 70% 对头／腕单视角 30%／10%，按钮单腕 85% 略高于双相机 80%，视角收益依任务而定。", "limit": "每技能 30–60 示范、独立权重；长任务比较同时改了技能分解、表征和终止，不能只归因 LLM。终止标签表示专家结束技能，不是按钮物理成功确认；语言选技能也不是连续动作 VLA。", "url": "https://arxiv.org/abs/2411.15131", "pdf": "papers/2411.15131_WildLMa_Long_Horizon_Loco-Manipulation_in_the_Wild.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K23", "title": "导航终点应满足后续操作条件"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K42", "title": "观察目标与操作目标可以分别控制"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "2501.09905", "title": "SLIM: Sim-to-Real Legged Instructive Manipulation via Long-Horizon Visuomotor Learning", "label": "SLIM", "year": "2025", "date": "2025-01", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "真机示教长任务费时；直接从相机图像练习长任务，学习很难找到成功动作。", "method": "分阶段 SAC 教师解决长任务探索，教师物体信息限制在相机视场内；学生不观察阶段真值，以蒸馏＋RL 学单一策略。学生由 RGB／语言预测任务相关 mask/depth 作视觉瓶颈，部署无需深度输入；另学 stationary bit 在抓取／放置时强制基座速度为零。", "interface": "输入：部署时输入腕部 RGB 图像、任务指令和关节等自身状态；仿真老师额外知道物体位置和当前子任务。 输出：高层输出臂／夹爪动作及身体速度；固定的低层行走策略输出腿关节动作。", "improvement": "相较 WildLMa 的真实示教路线，重点改为纯仿真训练和低成本硬件；相较单次视觉抓取，覆盖寻找到投放的连续过程。", "experiment": "Go1＋WidowX＋单腕 RGB，相机观察颜色方块／篮子。360 次主比较＋40 次新场景，完整 78.3% ±5.8%，仅蒸馏 50% ±35.5%；低层十个种子中选最稳定三个实机部署。仿真为 MuJoCo，学生训练约四 GPU 两周。", "limit": "明确停止移动来稳定抓放，未验证接触中换步。低层行走不看臂目标，关节 PID 并非力／柔顺控制；颜色对象指令策略不等于开放任务 VLA。模拟资产与任务分解仍需设计。", "url": "https://arxiv.org/abs/2501.09905", "pdf": "papers/2501.09905_SLIM_Sim-to-Real_Legged_Instructive_Manipulation_via_Long-Horizon_Visuomotor_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}, {"id": "K42", "title": "观察目标与操作目标可以分别控制"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2508.08240", "title": "ODYSSEY: Open-World Quadrupeds Exploration and Manipulation for Long-Horizon Tasks", "label": "ODYSSEY", "year": "2025", "date": "2025-08", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "长程指令需要先找目标、走到附近，再完成操作；仅看桌面图像的规划难处理移动中的视野和地形。", "method": "GPT-4.1 以语义实例图拆原子任务，Qwen2.5-VL 以腕 RGB-D 生成接触点／姿态并加几何约束。Go2＋Arx5 统一策略输出 18 关节目标：先固定臂训练行走，再训练全身；末端采样高度在世界固定后转到机身坐标，加入地形高度图。", "interface": "输入：语言、头部 RGB、激光雷达及地图、腕部深度图；低层接收身体速度、末端目标、地形高度和自身状态。 输出：全局规划输出子任务和导航目标；局部模块输出末端姿态；全身策略输出腿和臂关节角度。", "improvement": "相较单技能视觉方法，增加地图支持的任务分解与局部操作；相较仅按语言串技能，进一步处理移动视角、空间目标和地形执行。", "experiment": "8 类长期任务 41.0%–69.8% 是仿真，304 种室内外变化；真机为两个任务、五对象定性展示。Table 3 主要改善基座速度，末端位置／姿态与 RoboDuet 大体相当；不能写末端精度显著领先。", "limit": "Appendix C.1 短任务含固定观察、10 cm 预对齐、线性夹取、任务运动序列，不能泛称无需动作规则。地图 waypoint 无碰撞不保证后续臂可达；小物体仍会因跟踪／视觉误差失败。VLM 规划不是直接生成连续关节的 VLA。", "url": "https://arxiv.org/abs/2508.08240", "pdf": "papers/2508.08240_ODYSSEY_Open-World_Quadrupeds_Exploration_and_Manipulation_for_Long-Horizon_Tasks.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K23", "title": "导航终点应满足后续操作条件"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}]}, {"id": "2605.03846", "title": "SigLoMa: Learning Open-World Quadrupedal Loco-Manipulation from Ego-Centric Vision", "label": "SigLoMa", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋固定夹爪", "problem": "相机识别物体慢且会丢失目标，身体却一直在动；直接使用旧位置，容易走错站位或抓空。", "method": "加权 PCA 中心＋三轴正负端点共七点表示目标；各点的 Kalman filter 结合视觉里程计更新 ego-motion，遮挡历史训练模拟视野外漂移。这里的 sigma points 是几何点，不是 UKF 的统计传播点。", "interface": "Go2 身体直接固定低成本夹爪，没有机械臂。上游 VLM 提供语义 pick/place 锚点；策略以目标几何、本体与历史输入，输出前后／侧向速度、yaw 和 body pitch，通过整个身体对准夹爪。", "improvement": "相较直接把图像送给控制网络，显式解决视觉更新慢、坐标随身体移动和暂时看不见的问题，减少外部定位依赖。", "experiment": "真机三类 pick/place 各十次，检测约 5 Hz／200 ms；比较 KF、遮挡噪声训练和人工。仿真成功判据主要是身体到理想对准姿态并停下，与物理夹取需区分。", "limit": "Appendix A 先遥控扫描全局目标坐标，再朝目标转动进入视场触发局部策略；不具通用长距导航，主要平地。应列四足无臂邻接，不能作为机械臂持续接触补偿或完整四足＋臂 VLA 的证据。", "url": "https://arxiv.org/abs/2605.03846", "pdf": "papers/2605.03846_SigLoMa_Learning_Open-World_Quadrupedal_Loco-Manipulation_from_Ego-Centric_Vision.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "2608.20114", "title": "DECOWAM: Decoupled Whole-Body World-Action Model for Legged Mobile Manipulation（轮足邻接）", "label": "DECOWAM", "year": "2026", "date": "2026-08", "group": "示范／视觉／VLM", "platform": "轮足", "problem": "身体移动会改变相机画面；把画面变化都当成臂操作效果，会使动作和未来画面预测混淆。", "method": "复用 FastWAM 的视频／动作模型；未来视频教师监督只看当前状态的因果学生，base／arm 两个 latent 用自己的预测头保留动作、交叉梯度反转减少混杂。基座速度 token 帮视频分支解释镜头运动，不是显式 KF 或 SE(3) 对齐。", "interface": "输入：当前图像、语言和机器人状态，包括身体速度；训练时另用真实后续图像作监督，部署不读取未来图像。 输出：一段未来动作和未来图像；动作的有效部分是六个臂目标、夹爪开口和三个身体速度，另四个维度只是数据接口补位。", "improvement": "相较固定底座模型，把身体、臂和相机移动的不同作用显式分开；着重减少适配参数并改善预测和全身配合。", "experiment": "23 episodes replay 中动作 MSE 较 FastWAM 改善 21.7%，X-VLA 的动作误差仍更低。真机每方法 79 次，本方法 46/79、FastWAM 45/79，仅差一次成功；其他协调指标改善不能代替任务率的统计显著性。", "limit": "轮足邻接，14 维含四个补位维度；表示解耦不取消物理耦合。未通过未来视频实施显式在线 MPC 搜索，数据统计又含不同子集范围；预测误差降低不能自动推成接触更安全或任务成功显著更高。", "url": "https://arxiv.org/abs/2608.20114", "pdf": "papers/2608.20114_DECOWAM_Decoupled_Whole-Body_World-Action_Model_for_Legged_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2604.07457", "title": "CMP: Robust Whole-Body Tracking for Loco-Manipulation via Competence Manifold Projection", "label": "CMP", "year": "2026", "date": "2026-04", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "传感器漂移或用户给出极端轨迹时，原本稳定的全身控制器可能做出危险动作。", "method": "用训练经验学习哪些目标在当前状态下较可靠；把复杂轨迹压缩成少量数值，遇到高风险目标时把这些数值拉回较可靠区域，再继续跟踪。", "interface": "输入：机器人状态和期望的一段末端轨迹。先编码为任务意图，再限制编码向量的长度，最后由全身策略输出关节动作。安全估计器用于训练时塑造编码空间，部署投影不需要再调用估计器。", "improvement": "明确使用 UMI on Legs 的数据和训练设置，增加目标执行前的能力判断与修正；保留尽量向原目标推进的行为。", "experiment": "极端目标和定位噪声下的仿真、真机跟踪，显著提高文中定义的存活率，同时保留大部分跟踪表现。", "limit": "安全概率与编码空间的对应关系依赖学习近似；45 次真机试验仍有 3 次失败，不能视为无条件的持续安全保证。投影可能牺牲原目标的跟踪精度，“不摔倒”与“完成物体操作”也须分别评价。", "url": "https://arxiv.org/abs/2604.07457", "pdf": "papers/2604.07457_CMP_Robust_Whole-Body_Tracking_for_Loco-Manipulation_via_Competence_Manifold_Projection.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}]}, {"id": "2605.31343", "title": "Learning Terrain-Aware Whole-Body Control for Perceptive Legged Loco-Manipulation", "label": "Terrain-Aware WBC", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "身体会随坡面和台阶改变高度、俯仰；目标若只跟着身体坐标采样，容易把地形变化错误传给手的任务。", "method": "从脚边地形提取信息，按脚的支撑面生成训练目标；合并擅长大范围身体动作和擅长地形适应的两个训练策略。", "interface": "输入：身体和关节历史、身体速度／末端目标，以及机载感知得到的脚周和局部地形高度。 输出：学习策略仅输出十二个腿关节的角度目标；六个臂关节目标由末端目标经过逆运动学求解。", "improvement": "相较不感知地形的全身跟踪，身体能提前适应落脚环境；相较只按身体高度采样末端目标，降低地形与操作目标的耦合。", "experiment": "仿真比较地形通过、工作空间、跟踪及模块消融；明确报告走动时可达范围小于站立时。B2＋Z1 真机由 VR 遥控，在操作手臂的同时登上五级、每级 17 cm 的台阶，并连续完成五次组合任务；该演示不等于自主长程任务，也不是各基线的真机对照。", "limit": "机械臂仍由几何求解控制，不能理解为 RL 联合输出所有关节。主要研究给定目标的地形执行，而非高层接触任务选择。", "url": "https://arxiv.org/abs/2605.31343", "pdf": "papers/2605.31343_Learning_Terrain-Aware_Whole-Body_Control_for_Perceptive_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2606.24466", "title": "FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation", "label": "FT-WBC", "year": "2026", "date": "2026-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "臂希望身体倾斜以够到目标，但某条腿已无力，继续执行同样姿态会让机器人倒下。", "method": "在仿真中降低执行器可用力矩，学习故障识别；将臂提出的身体姿态改成更适合当前支撑能力的姿态，再联合执行。附录规定训练主要削弱同一条腿的三个关节，单关节削弱与锁止是后续评价条件。", "interface": "输入：腿和臂的自身状态历史、期望速度／末端姿态，以及从腿状态估计出的关节故障信息。 输出：臂关节目标和期望身体姿态；姿态调整模块根据故障修正身体要求，腿策略输出补偿步态的关节目标。", "improvement": "相较 RoboDuet 式分工接口，增加故障驱动的身体请求调整；相较只保走路的容错方法，还考虑臂可达范围。", "experiment": "仿真比较故障下的跟踪与工作空间；真机从地面取物，放到 50、75、90 cm 高的桌面，每个高度、每种故障做 20 次。最难的 90 cm 锁止条件下存活 14/20 次、放置成功 9/20 次，表明维持稳定与完成原任务确有取舍。", "limit": "真机主要为站立操作或先移动、再操作，尚未验证边走边保持接触的容错。原文 §4 说 w/o FE 使用真实故障标签，后面的结果解释却称其缺少故障感知，定义存在不一致，不能据此单独确定估计器的增益。能保住身体和工作空间，也不代表完整任务恢复或高层重规划。", "url": "https://arxiv.org/abs/2606.24466", "pdf": "papers/2606.24466_FT-WBC_Learning_Fault-Tolerant_Whole-Body_Control_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2610.23548", "title": "Reinforcement Learning Based Multi-Terrain Adaptive Whole-Body Control for a Quadruped Manipulator", "label": "Reinforcement Learning Based", "year": "2026", "date": "2026-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "小机器狗走坡面、台阶或软地面时，追求手的精度与维持身体稳定容易冲突。", "method": "位置目标附着身体，末端朝向保持重力方向；身体状态／速度跟踪表现门控低优先级操作奖励。无需actor读取地形，高度图仅训练critic。", "interface": "输入：身体和关节状态、上一动作、身体速度和末端目标。局部地形高度图仅用于训练的评价网络，不输入部署动作网络。 输出：同一个学习策略输出十二个腿关节和六个臂关节的角度目标。", "improvement": "相较把各项奖励固定混合，按当前稳定和行走表现调整操作权重；与 TA-WBC 相比，部署策略不用显式地形图，臂也由策略输出。", "experiment": "仿真每条件1024，模型／质量／速度／载荷比较；真机坡与台阶跟踪，40次完整粗糙地形导航抓取32次成功。分开8次失败原因。", "limit": "抓取进入工作空间后速度设零。台阶1.6cm位置误差为身体坐标FK，不是固定世界接触误差；奖励门控是软优先级。", "url": "https://arxiv.org/abs/2610.23548", "pdf": "papers/2610.23548_Reinforcement_Learning_Based_Multi-Terrain_Adaptive_Whole-Body_Control_for_a_Quadruped_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}]}, {"id": "2311.00112", "title": "Hierarchical Optimization-based Control for Whole-body Loco-manipulation of Heavy Objects", "label": "Hierarchical Optimization-ba", "year": "2023", "date": "2023-11", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "搬重物、开门时臂给身体的反作用力不能再当小扰动。输入是物体任务、机器人状态及接触估计；输出是物体运动、机械臂力与身体运动参考，再交给低层控制。", "method": "在线操作规划先算物体轨迹和所需力；姿态优化检查机器人能否到达；线性 MPC 将臂施加的力写进身体预测模型。这比仅让走路 MPC 抵抗未知扰动更早考虑操作任务。", "interface": "", "improvement": "", "experiment": "Aliengo＋自制一自由度臂真机举起／搬运最高 8 kg 载荷；门任务及 10 kg 物体快速起升测试为仿真。对照分别移除操作力预测或改变姿态优化，适合重载分支，不宜拿其结果推断轻触电气面板性能。", "limit": "", "url": "https://arxiv.org/abs/2311.00112", "pdf": "papers/2311.00112_Hierarchical_Optimization-based_Control_for_Whole-body_Loco-manipulation_of_Heavy_Objects.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "paper-32", "title": "Design and Control Co-Optimization for Dynamic Loco-Manipulation With a Robotic Arm on a Quadruped Robot", "label": "Design and Control Co-Optimi", "year": "2024", "date": "2024", "group": "形态／系统", "platform": "四足＋臂", "problem": "背载六自由度臂增加重量、挤占负载；若身体本身会移动，某些任务不一定需要完整的六个臂自由度。", "method": "把机械臂结构选择与全身控制一起设计，研究少自由度臂如何利用四足底盘移动补足工作空间，而不只在固定六自由度硬件上调控制参数。", "interface": "", "improvement": "", "experiment": "出版摘要称 Aliengo 上比较其一自由度臂与六自由度臂，最大载荷为 8 kg 对 2 kg；具体任务、重复次数和控制消融尚待全文核对。对当前 Piper 臂不能直接类推为“自由度越少越好”。", "limit": "", "url": "https://doi.org/10.1115/1.4066852", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}]}, {"id": "2403.18197", "title": "LocoMan: Advancing Versatile Quadrupedal Dexterity with Lightweight Loco-Manipulators", "label": "LocoMan", "year": "2024", "date": "2024-03", "group": "形态／系统", "platform": "四足＋腿部小臂", "problem": "背载单臂难进窄空间，直接用腿操作又损失支撑。Go1 两前小腿各加 3 自由度／147 g 操纵模块，与腿三关节合成 6DoF 操作肢；输入身体／手目标，由模式化 WBC 输出关节／力指令。", "method": "运动学 nullspace 优先级与动力学 QP 按单手、双手、行走和移动操作切换；切换含停稳、移开机身等规则。贡献首先是形态、可达性及模式执行，控制不是从零训练的全身 RL。", "interface": "", "improvement": "", "experiment": "真机遥操作充电器插入、柜门／抽屉、倒饮料、狭窄取物和双手提物。单／双 workspace 0.34→0.68、0.38→0.83 m³ 来自运动学采样；原地五组任务的8秒末端轨迹平均 1.89 mm／0.047 rad 由自身估计与运动学计算，没有独立世界测量。", "limit": "行走示例为以 0.15 m/s 前行、0.05 m/s 侧移时保持手电筒世界朝向，不是完整六维接触位置追踪。运动学 workspace 不等于动态接触可行域，毫米原地误差也不能与其他论文的世界坐标行走误差横比。", "url": "https://arxiv.org/abs/2403.18197", "pdf": "papers/2403.18197_LocoMan_Advancing_Versatile_Quadrupedal_Dexterity_with_Lightweight_Loco-Manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2403.20328", "title": "Learning Visual Quadrupedal Loco-Manipulation from Demonstrations", "label": "Learning Visual Quadrupedal ", "year": "2024", "date": "2024-03", "group": "示范／视觉／VLM", "platform": "四足足端／无臂", "problem": "单纯位置指令难把远距离移动与可变场景中的腿部操作串起。方法从人示范和图像学习任务策略，下层用 RL 全身控制把目标足端动作落实到步态和身体。", "method": "视觉扩散策略生成参数化 Bézier 足端轨迹／身体指令，低层接收当前及未来足端目标执行；分层使少量视觉示范不用学全部关节反馈。", "interface": "", "improvement": "", "experiment": "真机足端交互与轨迹跟踪；视觉规划、未来点及策略接口的实验。", "limit": "轨迹接口和任务示范给出较强先验；视觉与低层参考系不完全相同，不能仅写端到端视觉全身策略。", "url": "https://arxiv.org/abs/2403.20328", "pdf": "papers/2403.20328_Learning_Visual_Quadrupedal_Loco-Manipulation_from_Demonstrations.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}]}, {"id": "2402.10837", "title": "Pedipulate: Enabling Manipulation Skills using a Quadruped Robot’s Leg", "label": "Pedipulate", "year": "2024", "date": "2024-02", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "不加专用机械臂，能否让一条前腿既准确触物又在目标远离时主动迈步扩大工作空间？输入足端目标位置，RL 控制器输出全身运动；走步从追踪远端目标的策略中出现。", "method": "训练面向单足末端位置目标的策略，要求同时抵抗足端相互作用力、身体扰动和滑动接触。与普通抬腿触物相比，任务空间指令可持续驱动机器人移动到目标附近。", "interface": "", "improvement": "", "experiment": "真机遥操作开门、按按钮、取样、推障碍，并用足端悬挂搬运 2.0 kg 背包；论文还测了可达空间、跟踪及扰动。它训练时施加交互扰动，但原文明确说没有显式建模或跟踪操作力；不能把抗扰能力写成受控施力能力。其工作空间与支撑也不同于背载 Piper 臂。", "limit": "", "url": "https://arxiv.org/abs/2402.10837", "pdf": "papers/2402.10837_Pedipulate_Enabling_Manipulation_Skills_using_a_Quadruped_Robots_Leg.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2407.06584", "title": "HiLMa-Res: A General Hierarchical Framework via Residual RL for Combining Quadrupedal Locomotion and Manipulation", "label": "HiLMa-Res", "year": "2024", "date": "2024-07", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "持续走动时，能否利用摆动腿操作，而不为每个任务重新训练全部走路能力？底层输入身体移动指令和摆动足轨迹参数，输出关节角度目标；高层根据任务状态或视觉决定这些指令与参数。", "method": "固定采用对角小跑，先训练底层跟踪由步态发生器生成的正常足轨迹与 Bézier 残差之和；残差只加在摆动足，支撑足参考不变。高层任务策略再选择残差曲线的控制点。这里的残差是足端轨迹修正，并非关节力矩补偿，也非任意支撑模式下的足端控制。", "interface": "", "improvement": "", "experiment": "真机运送载荷、踢／带球和避开散布石块，涵盖仿真训练与实机学习，并与单层、轨迹跟踪及其他分层方法比较。石块任务主要验证走路避障；论文没有专用机械臂，适合理解分层轨迹接口，非柜门轻接触的直接基线。", "limit": "", "url": "https://arxiv.org/abs/2407.06584", "pdf": "papers/2407.06584_HiLMa-Res_A_General_Hierarchical_Framework_via_Residual_RL_for_Combining_Quadrupedal_Locomotion_and_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2411.07104", "title": "Learning Multi-Agent Loco-Manipulation for Long-Horizon Quadrupedal Pushing", "label": "Learning Multi-Agent Loco-Ma", "year": "2024", "date": "2024-11", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "多个四足推大物体绕障时，单个机器人局部推进会相互妨碍。输入地图、物体目标和各机器人状态；输出子目标与每台机器人的移动指令。", "method": "RRT提供物体路径，中央高层调物体子目标，去中心中层策略各自输出速度，底层走路；凸包内法向与子目标方向的奖励帮助找推物侧。", "interface": "", "improvement": "", "experiment": "仿真中相对最优基线成功率高 36 个百分点、时间少 24.5%；真机展示不同形状物体的协同推送。无机械臂，纳入是为覆盖非抓取式四足操作，不是用户当前设备的主路线。", "limit": "仿真≥10m任务终点容差1m，与轻操作精度不同；动捕对象状态；真机与仿真底层不同，但作者专门拟合其行为。", "url": "https://arxiv.org/abs/2411.07104", "pdf": "papers/2411.07104_Learning_Multi-Agent_Loco-Manipulation_for_Long-Horizon_Quadrupedal_Pushing.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}]}, {"id": "paper-38", "title": "Env-Mani: Quadrupedal Robot Loco-Manipulation with Environment-in-the-Loop", "label": "Env-Mani", "year": "2025", "date": "2025", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "四足若只靠地面四点支撑，够不到较高目标。方法让机器人利用桌沿等外部环境承重，扩展操作工作空间。", "method": "统一策略以有限机载传感和自身状态生成全身动作，用奖励处理感知误差与重心转移，并以课程训练教师和学生策略。与多接触规划分支讨论相同物理机会，但不能由此断言继承了 ETH 的算法。", "interface": "", "improvement": "", "experiment": "摘要称仿真训练和扩展实验，未明确说明真机与数量；全文 PDF 未取得，因此仅保留摘要层面的判断。", "limit": "", "url": "https://doi.org/10.1109/IROS60139.2025.11246108", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K11", "title": "抗扰裕量是在扰动发生前保留余地"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2511.14756", "title": "HMC: Learning Heterogeneous Meta-Control for Contact-Rich Loco-Manipulation", "label": "HMC", "year": "2025", "date": "2025-11", "group": "示范／视觉／VLM", "platform": "人形", "problem": "同一任务的靠近、插入、拉出需要不同刚度；固定位置控制会碰撞，始终柔顺又拉不动。输入视觉和自身状态，策略同时给出运动与控制模式权重，控制器在力矩层连续混合位置、阻抗和力／位混合控制。", "method": "先用大量只有位置标签的数据训练共同表征，再用较少的带力感示范学习模式路由；软混合避免模式硬切换引起的力突变。这是“学习策略怎样调用柔顺控制”的有价值接口例子，不是四足 VLA。", "interface": "", "improvement": "", "experiment": "Unitree G1 真机擦拭、拿瓶、开抽屉，每种设置 15 次；表中擦拭成功率 93% 对位置基线 33%。实验主要是接触操作，未把持续行走接触作为核心量化结果，故不放严格的四足核心短名单。", "limit": "", "url": "https://arxiv.org/abs/2511.14756", "pdf": "papers/2511.14756_HMC_Learning_Heterogeneous_Meta-Control_for_Contact-Rich_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}]}, {"id": "2510.09221", "title": "HANDO: Hierarchical Autonomous Navigation and Dexterous Omni-loco-manipulation", "label": "HANDO", "year": "2025", "date": "2025-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "未知环境里先找到目标、再在操作位完成接触。方法将目标条件自主探索与全身操作策略分层；接口上导航给目标区域，操作层协调臂和腿。", "method": "方法将目标条件自主探索与全身操作策略分层；接口上导航给目标区域，操作层协调臂和腿。", "interface": "", "improvement": "", "experiment": "作者只报告导航模块的初步真机部署；精细实机操作仍是后续工作。", "limit": "摘要明确称“initial deployment of the navigation module”，并说精细的实机操作部署仍是后续工作；不能把系统示意或仿真操作当成完整真机 loco-manipulation 成功率。对当前 Go1/Piper 类设备有工程借鉴，论文验证强度尚不足以作推荐主文献。", "url": "https://arxiv.org/abs/2510.09221", "pdf": "papers/2510.09221_HANDO_Hierarchical_Autonomous_Navigation_and_Dexterous_Omni-loco-manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K23", "title": "导航终点应满足后续操作条件"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}]}, {"id": "2607.06186", "title": "Calf-Integrated Arms for Bimanual Quadruped Loco-Manipulation", "label": "Calf-Integrated Arms for Bim", "year": "2026", "date": "2026-07", "group": "形态／系统", "platform": "四足＋腿部小臂", "problem": "四足双手操作通常要立起身体或牺牲前腿支撑。每条前小腿嵌入滑动关节、旋转关节和夹爪，四足着地时即可双臂操作。", "method": "底层全身控制按技能执行，VLM 仅在技能边界依据图像／任务状态选择预定义技能；它不是连续输出全身动作的 VLA。", "interface": "", "improvement": "", "experiment": "仿真柜门任务、双手举起与两手交接。缺真机验证，价值主要在形态方案和“语言选技能／控制器执行”的分层接口。", "limit": "区域中心不等于把手接触点；VLM 不生成未定义技能；执行延迟与无真机验证限制结论。", "url": "https://arxiv.org/abs/2607.06186", "pdf": "papers/2607.06186_Calf-Integrated_Arms_for_Bimanual_Quadruped_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2607.11041", "title": "PAKE: Learning Whole-Body Loco-Manipulation with Partial Kinematic Embeddings", "label": "PAKE", "year": "2026", "date": "2026-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "给定手的目标位置和移动速度，常有许多可行身体／臂姿态；直接 RL 在高维关节空间寻找精确解很难。输入手六维目标和底盘速度，输出连续关节控制。", "method": "采样身体高度、横滚、俯仰和六个臂关节，用正运动学生成训练数据；条件流模型据此生成同一末端目标对应的多种身体／臂参考。高层策略选择流模型的潜变量，低层 RL 控制腿去实现身体参考，臂由 PD 控制跟踪关节参考；完整 PAKE 还加入教师引导的高层优化以减小参考突变。运动学采样省略腿的约束，因此生成参考不自动保证动态可行。", "interface": "", "improvement": "", "experiment": "RaiSim 中用 4000 个目标比较精度与工作空间；真机实际部署简化版 PAKE-S，8 类任务共 24 次，含拉车、扫地、插充电器、挂衣架。动捕测得平均末端位置误差约 4.5 cm、姿态误差约 0.14 rad；完整 PAKE 相对 PAKE-S 的进一步增益来自仿真。UMI on Legs 基线改用随机轨迹和身体坐标跟踪，不能当作原方法完整接口的直接排名。它仍是任务空间跟踪器，不直接解决语义决策或接触力安全。", "limit": "", "url": "https://arxiv.org/abs/2607.11041", "pdf": "papers/2607.11041_PAKE_Learning_Whole-Body_Loco-Manipulation_with_Partial_Kinematic_Embeddings.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}]}, {"id": "2608.22296", "title": "TONAV: Task-Oriented Navigation and Action-Velocity Chunk Learning for Articulated Object Quadrupedal Mobile Manipulation", "label": "TONAV", "year": "2026", "date": "2026-08", "group": "示范／视觉／VLM", "platform": "轮足", "problem": "导航到物体附近还需调整朝向／距离才能进入操作策略的起始分布；示范又会因主从伺服延迟及动作块跳变产生误差。输入语言、RGB-D、本体与示范，输出导航目标、近场对齐及臂动作块。", "method": "语言拆子目标后用 SAM2 mask／深度反投影和 ego-motion KF 更新目标，AAM 使目标居中并维持工作空间 stand-off。220 Hz 主从 MIT 控制记录从臂目标轨迹／速度；ACT 同时预测位置、速度，加入有限差分一致性损失。", "interface": "", "improvement": "", "experiment": "关抽屉、开灯、放马桶盖，各五次导航共 9/15＝60%。操作从统一准备姿态单独开始，12/15＝80%；这是条件操作率，不是完整导航后操作的端到端成功。相同小样本下，position+velocity ACT 46.67%，完整80%。", "limit": "近场距离／朝向规则不是完整操纵度或接触路径优化；导航与操作分阶段，未验证接触中移动／换步。velocity head 部署是否进入实际控制描述不充分，无校准力或安全实验。", "url": "https://arxiv.org/abs/2608.22296", "pdf": "papers/2608.22296_TONAV_Task-Oriented_Navigation_and_Action-Velocity_Chunk_Learning_for_Articulated_Object_Quadrupedal_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K23", "title": "导航终点应满足后续操作条件"}, {"id": "K24", "title": "机构约束与在线交互辨识"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2609.22278", "title": "DeViGrasp: Robust Visual Mobile Grasping for Quadruped Manipulators under Degraded Perception", "label": "DeViGrasp", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "遮挡、深度噪声和目标抖动使学生难以复制物体真值教师；用双视角的有效帧与时间可靠性信息形成较稳定的抓取动作。", "method": "教师聚合候选抓取特征，学生以双相机缓存、时间／来源编码、可靠性与 GRU 保存近期目标；输出 9 维末端／基座／夹爪目标，低层为腿 RL＋臂 IK。它记近期感知，不记录“按钮已按成功”等任务事件。", "interface": "", "improvement": "", "experiment": "主文定量为 Isaac Gym 中 B1＋Z1，33 已见／6 未见物体、四级退化、500 episodes×3 seeds。Difficult 62.3% 对 VBC46.2%、DQ58%；DQ 在成功 episode 上更快。Go2 补充示范不能替代定量真机证据；descriptor 融合也不是两个相机三维测量注册后的物理平均。", "limit": "", "url": "https://arxiv.org/abs/2609.22278", "pdf": "papers/2609.22278_DeViGrasp_Robust_Visual_Mobile_Grasping_for_Quadruped_Manipulators_under_Degraded_Perception.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}]}, {"id": "2609.30140", "title": "Contact as a Decision Variable: Capability-Tradeoff Contact Selection for Legged Loco-Manipulation", "label": "Contact as a Decision Variab", "year": "2026", "date": "2026-09", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "机器人可把身体靠住环境增加承受外力能力，但靠错地方会挡住手或妨碍走路。输入候选环境接触和任务所需末端位姿／力，输出支撑接触点及身体配置。", "method": "以剩余可承受力、末端可达性、底盘移动能力与建立接触成本来评估候选；先筛不可行项，再用相近接触分组及局部敏感度近似减少反复优化。它把“要不要靠、靠哪里”作为显式决策，与预设额外接触的控制方法有区别。", "interface": "", "improvement": "", "experiment": "仿真大规模候选比较；Go2＋NERO 臂另装身体侧面平面支撑架，真机持续支持接触并行走承载，5 次行走试验的末端位置 RMSE 为 14.97 mm。候选选择约需 39／62 秒，执行控制器为 10 Hz；不能称为实时完整接触序列规划。场景几何及摩擦需预建模，具体约束还引用 PDF 外的补充材料。", "limit": "", "url": "https://arxiv.org/abs/2609.30140", "pdf": "papers/2609.30140_Contact_as_a_Decision_Variable_Capability-Tradeoff_Contact_Selection_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K11", "title": "抗扰裕量是在扰动发生前保留余地"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2610.20968", "title": "SOMA: Stack-of-Objects Manipulation using a Quadruped Robot", "label": "SOMA", "year": "2026", "date": "2026-10", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "推叠放的箱子时，上层可能滑落；底盘高度也是影响施力位置的变量。高层用时间历史预测物体推进目标，低层步行策略按目标调节身体高度和步态。", "method": "给高层速度接口增加身体高度，改变推力作用点；S5历史编码、Beta有界命令、单箱→双箱课程及堆物滑移／倾倒惩罚。", "interface": "", "improvement": "", "experiment": "125形状／质量网格仿真；MLP/GRU/S5、单形状／多形状训练比较；双箱九条件，最优90.1%；真机五配置，图4四次轨迹。", "limit": "90.1%是最佳条件，不是全部堆物平均。真机姿态容差5°，仿真部分1°；Fig.2正文0.1m、摘要／其他部分0.05m，需按各实验区分。", "url": "https://arxiv.org/abs/2610.20968", "pdf": "papers/2610.20968_SOMA_Stack-of-Objects_Manipulation_using_a_Quadruped_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2609.18869", "title": "KINO: A Keyframe Interface for VLM Planning and Whole-Body Control in Humanoid Loco-Manipulation", "label": "KINO", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "人形", "problem": "抽象任务步骤缺少动态控制目标；VLM 从人工关键帧库选标签，再按现场物体重定位，由 RL 控制器追踪，形成有限目标空间的高低层接口。", "method": "物体相对重定位加 IK 修正全身姿态，tracker 以关键帧历史和多 critic 训练；提高抓取／释放等稀疏事件的 goal sampling，使训练目标更符合规划器部署分布。规划器接收目标误差与停稳反馈重新选目标。", "interface": "", "improvement": "", "experiment": "仿真 100 trials 的消融 44%→92%；Unitree G1 真机取放主要定性，物体位姿用 MoCap。放置容差约 0.3 m，不能作精细面板操作的精度证据。", "limit": "关键帧库由人提供，VLM 不直接生成连续关节动作。某些 reference error 本方法反而较大，任务成功与姿态误差需分别衡量；弧线／Dubins 路径是设计限制，不说明人形本体等同差速车 non-holonomic 约束。", "url": "https://arxiv.org/abs/2609.18869", "pdf": "papers/2609.18869_KINO_A_Keyframe_Interface_for_VLM_Planning_and_Whole-Body_Control_in_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}]}, {"id": "2609.23968", "title": "Opt2VLA: Force-Aware Vision-Language-Action for Contact-Rich Humanoid Whole-Body Manipulation", "label": "Opt2VLA", "year": "2026", "date": "2026-09", "group": "VLA 动作模型", "platform": "人形", "problem": "只输出位姿的 VLA 无法表达“轻擦”或“用力推”的期望力。模型联合输出运动和接触力目标，底层力控执行；语言指令可以指定力级别。", "method": "GR00T-N1.7输出手／足几何目标和独立法向力命令；TO提供关节力矩监督训练任务专用RL力控制器，再用rollout训练VLA。独立力矩token与未来力矩辅助损失。", "interface": "", "improvement": "", "experiment": "MO/FC/FCT对照；9种VLA消融，每任务30次仿真，整体joint成功82.2%；真机低层每任务30次，端到端45次。", "limit": "82.2%为仿真完成＋力指令＋测得力联合标准；真机报告趋势与误差，擦拭MAE7N，不是力目标精确实现。示例不能证明持续行走接触；三任务使用各自FCT。", "url": "https://arxiv.org/abs/2609.23968", "pdf": "papers/2609.23968_Opt2VLA_Force-Aware_Vision-Language-Action_for_Contact-Rich_Humanoid_Whole-Body_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K31", "title": "力信息进入 VLA 的位置决定它能改什么"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}]}, {"id": "2610.24847", "title": "DiPLO: Self-distilled Diffusion Planning for Loco-manipulation", "label": "DiPLO", "year": "2026", "date": "2026-10", "group": "模型规划／显式控制", "platform": "人形", "problem": "全身接触行为样本少，直接从头 RL 难学。先用人类动作重定向训练扩散规划器，RL 训练低层追踪；再用自蒸馏与策略优化减少规划器对强任务条件的依赖。", "method": "SBTO生成可动态执行示范；扩散生成全身＋物体轨迹，参考条件教师在闭环上下文指导无参考学生；冻结RL跟踪器，用DA:PPO优化扩散规划。旋转单独用SO(3)扩散。", "interface": "", "improvement": "", "experiment": "数据扩增、SO(3)、直接动作扩散、教师条件移除、规划／跟踪器微调消融；pick/place、kick、push/pull仿真；真机搬运同目标10/10、不同目标5/5。", "limit": "Task success 在存活轨迹上计算，必须与survival同时看。DPPO-style删去部分原算法技巧，非完整公平复现；真机只15次且动捕；多技能主要分任务训练。", "url": "https://arxiv.org/abs/2610.24847", "pdf": "papers/2610.24847_DiPLO_Self-distilled_Diffusion_Planning_for_Loco-manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K41", "title": "物体相对示范扩增与接触阶段的锚点"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2409.04882", "title": "Learning to Open and Traverse Doors with a Legged Manipulator", "label": "Learning to Open and Travers", "year": "2024", "date": "2024-09", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "门可能推开或拉开，铰链、闭门力和开门方向事先不全知道，机器人还得在门打开后穿过狭窄门口。", "method": "仿真教师知道四种推拉／左右门真值，循环学生只从本体历史与门／把手位置推断响应，输出臂关节目标与基座速度，复用已有行走低层。去掉 recurrence 无法有效模仿，去掉辅助门类型分类损失影响很小，应把历史机制与显式分类分开评价。", "interface": "", "improvement": "", "experiment": "40 真机 trials，拉门20/20、推门18/20＝95%；所有门都打开，失败在突出门口通过。MoCap 或外部相机 AprilTag 提供门／把手位置，95% 不代表纯机载自然视觉结果。", "limit": "关节 PD 目标裁剪仅限制名义关节作用，不是末端接触力上界。未解锁把手时可重复推拉并误把自身转动当操作成功，是完成事件缺少可观测证据的明确失败例；人工阶段奖励与门模型仍需要。", "url": "https://arxiv.org/abs/2409.04882", "pdf": "papers/2409.04882_Learning_to_Open_and_Traverse_Doors_with_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K24", "title": "机构约束与在线交互辨识"}]}, {"id": "2506.16475", "title": "Human2LocoMan: Learning Versatile Quadrupedal Manipulation with Human Pretraining", "label": "Human2LocoMan", "year": "2025", "date": "2025-06", "group": "示范／视觉／VLM", "platform": "四足＋腿部小臂", "problem": "四足双手技能的机器人数据少，人类操作示范量大但动作结构不同。输入人类示范和少量全身机器人遥操作数据，输出视觉条件的四足操作策略。", "method": "明确复用 LocoMan 小腿操纵模块及 nullspace IK／动力学 QP。人 VR 示范先映射到共享头／腕任务空间，身体、末端与夹爪用独立 stems 编解码，共享 Transformer；换机器人时重建形态特定 stems 并 mask 缺失模态，迁移的是表征结构而非人关节控制。", "interface": "", "improvement": "", "experiment": "单／双手玩具、鞋、scoop 和 pour 六任务，ID 每条件24次、OOD12次；人预训练改善20–40条机器人示范的条件。41.9%／79.7% 为相对增益，不是成功率百分点差。对 HPT 还同时改变视觉微调，MXT-Agg 消融更能分离模块化收益。", "limit": "VR 位姿示范不等于任意人视频；前腿和坐姿双手操作未验证全范围行走接触。作者也提醒 validation action L1 不总对应部署表现。", "url": "https://arxiv.org/abs/2506.16475", "pdf": "papers/2506.16475_Human2LocoMan_Learning_Versatile_Quadrupedal_Manipulation_with_Human_Pretraining.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2507.19652", "title": "RAKOMO: Reachability-Aware K-Order Markov Path Optimization for Quadrupedal Loco-Manipulation", "label": "RAKOMO", "year": "2025", "date": "2025-07", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "简化成身体＋臂的轨迹优化可能忽略腿关节极限，使机身抬得过高或压得过低；显式纳入全部腿关节会增加求解开销。", "method": "学习给定足端与机身姿态下，到腿可达区域边界的距离及其梯度，作为 KOMO 的约束／成本；规划机身和臂轨迹后由完整动力学 WBC 跟踪。", "interface": "", "improvement": "", "experiment": "HyQReal＋Kinova 臂在 Gazebo 中低处抓取、高架放置，并与普通 KOMO 比较；全程四脚固定接触，动态步态和接触序列优化留作后续。它验证姿态的腿运动学可行性，不验证行走时的臂操作精度；与 CMP 无已核实直接承接。", "limit": "", "url": "https://arxiv.org/abs/2507.19652", "pdf": "papers/2507.19652_RAKOMO_Reachability-Aware_K-Order_Markov_Path_Optimization_for_Quadrupedal_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}]}, {"id": "2509.17582", "title": "GeCCo: A Generalist Contact-Conditioned Policy for Loco-Manipulation Skills on Legged Robots", "label": "GeCCo", "year": "2025", "date": "2025-09", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "每换一种地形或足端操作都从头定义奖励训练策略，效率低。输入规划器指定的接触位置和机器人自身状态，输出跟踪接触计划的腿关节动作。", "method": "随机采样足端目标区域、持续时间及步态组合，训练跟踪给定接触计划的策略；通过接触事件奖励和对称数据增强提高复用性。上层仍负责给出计划，策略本身不发现完整物体操作序列。", "interface": "", "improvement": "", "experiment": "多地形仿真统计；真机演示步态、地形通过、足按按钮／翻箱／推桶。操作目标容差半径为 0.1 m，且其操作目标满足判据不要求实际物体接触；主要量化结果是地形通过率，不足以作为精确按钮或背载臂控制证据。", "limit": "", "url": "https://arxiv.org/abs/2509.17582", "pdf": "papers/2509.17582_GeCCo_--_a_Generalist_Contact-Conditioned_Policy_for_Loco-Manipulation_Skills_on_Legged_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2512.11047", "title": "WholeBodyVLA: Towards Unified Latent VLA for Whole-Body Loco-Manipulation Control", "label": "WholeBodyVLA", "year": "2025", "date": "2025-12", "group": "VLA 动作模型", "platform": "人形", "problem": "上身操作策略与下身走路控制分开，语言视觉任务难驱动全身移动。输入图像、文字和机器人状态；模型用全身潜动作表示生成运动与操作指令。", "method": "机器人操作视频与人移动视频分别训练两套 VQ-VAE latent action models，VLM 预测两种 codes 后由机器人 decoder 输出双臂目标、离散移动及高度。低层 LMO 先学行走，再以臂运动扰动、精准停止及站稳要求适配操作。", "interface": "", "improvement": "", "experiment": "Agibot X2 真机搬袋／箱与推 50 kg 车。Table 2 的78%为六个子目标均值；最终袋13/25、箱17/25、车22/25，不能混成整体78%端到端成功率。连续速度对照还改变课程／奖励，不能只归因离散动作。", "limit": "人形／低层行走策略不是四足证据，无明确力／触觉安全闭环。潜表示分开不取消物理耦合；印刷平滑公式存在恒定输入趋零的问题，复现须核对代码。", "url": "https://arxiv.org/abs/2512.11047", "pdf": "papers/2512.11047_WholeBodyVLA_Towards_Unified_Latent_VLA_for_Whole-Body_Loco-Manipulation_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}]}, {"id": "2603.05830", "title": "OpenHEART: Opening Heterogeneous Articulated Objects with a Legged Manipulator", "label": "OpenHEART", "year": "2026", "date": "2026-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "门、抽屉和柜体机构不同，直接把大图像送入 RL 难以充分利用少量数据。输入把手与面板的简化几何、自身状态和交互历史；输出全身开门／拉抽屉动作。", "method": "Go2＋ViperX300＋hook。SAFE 在把手／面板包围盒内部采样保留尺寸关系；ArtIEst 视觉几何分支预测把手到铰链方向，本体历史分支仅在对象已运动时监督，再按交互历史 gate 融合。初始世界包围盒由外部提供、LiDAR 更新相对位姿，不是已验证的自主视觉识别。", "interface": "", "improvement": "", "experiment": "41 异构资产仿真 train79.35%、test79.02%；真机柜门／抽屉为定性展示，无41对象真机成功统计。全程方向误差融合较好，contact-only 本体单支 0.0606 反低于完整 0.0687，不是各阶段统一胜出。", "limit": "KL 数据处理不等式只说处理不增加分布可区分性，不能证明任务信息保留或泛化必改善。几何／本体交互历史不等于实测力，非语言 VLA，也未解决按钮成功事件记忆。", "url": "https://arxiv.org/abs/2603.05830", "pdf": "papers/2603.05830_OpenHEART_Opening_Heterogeneous_Articulated_Objects_with_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K24", "title": "机构约束与在线交互辨识"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "2610.01612", "title": "ReCo: Response-Consistent Locomotion with Policy-Aware MPC for Legged Manipulation", "label": "ReCo", "year": "2026", "date": "2026-10", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "MPC 假设下层走路策略会按指令移动，但真实响应随步态相位、足接触和载荷而变；即使规划器同时算底盘与手，手的世界坐标仍会偏。", "method": "训练时让走路策略对相同指令有更一致的响应；对固定策略辨识闭环指令响应模型；MPC 再用这个模型共同规划移动指令和臂轨迹。关键不是给臂加更强的跟踪增益，而是让底盘成为规划器可预测的受控对象。", "interface": "", "improvement": "", "experiment": "仿真末端位置／姿态 RMSE 比相应最佳基线低 28.7%／27.4%，另有响应训练／模型辨识的 2×2 消融及留出命令的预测测试。真机 8 条动捕轨迹的位置 RMSE 为 7.60 cm、姿态为 9.93°；无动捕任务的误差由机载里程计重建，未独立测量世界坐标漂移。部分基线另配外部底盘路径跟踪器，接口不同；论文未量化接触力或安全事件。", "limit": "", "url": "https://arxiv.org/abs/2610.01612", "pdf": "papers/2610.01612_ReCo_Response-Consistent_Locomotion_with_Policy-Aware_MPC_for_Legged_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}]}, {"id": "2609.17832", "title": "Adaptive-MHE: A Sampling-Based Adaptive MPC for Legged Loco-Manipulation via Moving Horizon Estimation", "label": "Adaptive-MHE", "year": "2026", "date": "2026-09", "group": "模型规划／显式控制", "platform": "四足足端／无臂", "problem": "推物过程中物体质量或地面摩擦改变，固定模型的 MPC 预测会偏，可能持续按原力度推而无法到达目标。", "method": "用近期执行轨迹与并行仿真滚动比较，在线估计未知物理参数，再把估计送回采样式 MPC；它从模型不确定性入手，和 ReCo 的“学习控制器的指令响应”是不同建模对象。", "interface": "", "improvement": "", "experiment": "仿真比较真实参数、固定先验和在线估计；真机 Go1 无外挂臂，以身体推物，测试篮子从 3 kg 加到 4 kg 及从混凝土地面到草皮垫。它验证在线动力学适应，不验证机械臂接触操作；任务改善也不等于质量和摩擦分别被准确辨识。", "limit": "", "url": "https://arxiv.org/abs/2609.17832", "pdf": "papers/2609.17832_Adaptive-MHE_A_Sampling-Based_Adaptive_MPC_for_Legged_Loco-Manipulation_via_Moving_Horizon_Estimation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "paper-58", "title": "QLIMB: End-to-End Whole-Body Control for Quadruped Loco-Manipulation and Balance on Complex Terrains", "label": "QLIMB", "year": "2026", "date": "2026", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "小型平台力矩余量少，复杂地形晃动使操作策略看到的状态不断扰动；只在平地练手又无法走到任务点。", "method": "摘要称用统一策略及“潜在信念混合”机制，在行走和操作两种状态表征之间自适应融合，使身体、腿与臂在模式转换时共同调整。具体网络输入、动作输出与损失函数未见全文，不作推断。", "interface": "", "improvement": "", "experiment": "摘要声称在复杂地形上有大量真机试验，但未给出任务种类、次数或量化对照。它是地形＋操作方向不可忽视的 2026 正式发表工作，验证强度须读全文后再判。", "limit": "", "url": "https://doi.org/10.1109/LRA.2026.3712638", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}]}, {"id": "paper-59", "title": "From Policy Actions to Whole-Body Dynamics: A Unified Projection-Based Framework for Versatile Legged Loco-Manipulation", "label": "From Policy Actions to Whole", "year": "2026", "date": "2026", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "已有 RL 行走策略给的是关节指令，而 WBC 要求的是满足动力学和接触约束的加速度、地面力与力矩；两者难以直接组合。", "method": "PADP 用优化将预训练步态策略的关节动作映射到满足动力学／接触条件的全身变量，再通过一个统一 QP 加入操作任务；目标是不重训底层策略也能保留模型控制的显式约束。", "interface": "", "improvement": "", "experiment": "摘要称点足、轮足四足平台都有仿真和真机，并相较传统 WBC 改善灵活性与精度；没有全文，暂不能核对具体任务、指标及是否边移动边接触物体。对“RL 底盘＋模型操作”接口很相关，待全文优先核实。", "limit": "", "url": "https://doi.org/10.1109/LRA.2026.3734869", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}]}, {"id": "2403.16535", "title": "Arm-Constrained Curriculum Learning for Loco-Manipulation of a Wheel-Legged Robot", "label": "Arm-Constrained Curriculum L", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "轮足", "problem": "轮足底盘移动较快，臂的动作会影响平衡；把腿／轮和臂的奖励简单合在一起，训练时容易只顾其中一端。输入自身状态和任务目标，输出六个底盘关节力矩与六个臂关节位置目标，后者再由低层控制器转成力矩。", "method": "先行为克隆模型式全身控制器以初始化策略，再用带约束评价网络的 P3O 训练，惩罚臂关节越界、臂与底盘质心间距及碰撞。课程从接近目标的初始状态开始，随跟踪奖励改善扩大初始距离；不是先后分别训练走路、抓取两种技能。", "interface": "", "improvement": "", "experiment": "Isaac Gym 中比较课程与约束模块，真机演示开门、触碰风扇、接取移动物体等。约束降低了多数臂关节的越界次数，但 J6 反而增加，因此不是硬约束安全保证。轮足底盘结果也不能直接移到抬腿行走的四足。", "limit": "", "url": "https://arxiv.org/abs/2403.16535", "pdf": "papers/2403.16535_Arm-Constrained_Curriculum_Learning_for_Loco-Manipulation_of_a_Wheel-Legged_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}]}, {"id": "2502.00835", "title": "CAIMAN: Causal Action Influence Detection for Sample-Efficient Loco-Manipulation", "label": "CAIMAN", "year": "2025", "date": "2025-02", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "只给“把箱子推到目标”的稀疏奖励，机器人很难先探索出碰箱子的有效动作。上层策略输出底盘速度目标，下层已训练走路策略负责执行。", "method": "训练一个带简化运动学先验的物体动力学模型，再从“机器人动作能否明显改变物体后续状态”形成内在探索奖励；学习到的数据继续修正这个模型。与人为设计靠近／推箱奖励相比，奖励来自物体受到动作影响的程度。", "interface": "", "improvement": "", "experiment": "仿真单箱、绕一面墙、绕多面墙三类任务，在相同稀疏任务奖励下比较物体状态新颖度、整体状态新颖度、人工接近提示及不同动力学模型构造的探索奖励；Go2 真机推 5.5 kg 箱子，展示直推和绕障。真机物体位置来自外部动捕，论文未报告系统化的真机成功率，不能把仿真曲线当成现场鲁棒性证据。", "limit": "", "url": "https://arxiv.org/abs/2502.00835", "pdf": "papers/2502.00835_CAIMAN_Causal_Action_Influence_Detection_for_Sample-Efficient_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}]}, {"id": "2506.07876", "title": "ReLIC: Versatile Loco-Manipulation through Flexible Interlimb Coordination", "label": "ReLIC", "year": "2025", "date": "2025-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "臂够不到或推不稳时，有时应让一条前腿临时触物，其他腿维持走动；预先固定“腿只走、臂只操作”限制了能力。输入任务目标及各肢体当前分工，输出所有腿与臂关节动作。", "method": "任务层指定各肢体的操作／走路掩码，模型控制模块追踪操作肢体目标，RL 控制其余肢体保持移动与稳定，再按掩码合成动作。论文框架允许逆运动学或阻抗控制，但实际真机实现使用逆运动学。接触接口由用户指定接触点、方向与分工；语言接口用 GPT-4o＋SAM2 选接触点，方向仍按任务预设。肢体分工不是底层策略自主发现的。", "interface": "", "improvement": "", "experiment": "Spot＋Spot Arm 在 12 类真机任务中每类做 10 次随机化试验，论文报告平均 78.9% 成功率，并比较直接目标、接触点、语言接口及 MPC／端到端 RL 基线。任务含用腿辅助抽屉／箱体操作、持续推靠等；外部 PC 参与计算。MPC 基线原本不支持三腿走路和肢体操作，不能将其失败推广为适配这些接触模式的模型控制都无效。该工作提供可指定肢体角色的接口，但不等于 Piper 背载臂系统有同样可行的足端接触点。", "limit": "", "url": "https://arxiv.org/abs/2506.07876", "pdf": "papers/2506.07876_ReLIC_Versatile_Loco-Manipulation_through_Flexible_Interlimb_Coordination.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "paper-63", "title": "Bridging the Sim-to-Real Gap for Athletic Loco-Manipulation", "label": "Athletic Loco-Manipulation", "year": "2025", "date": "2025", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "投掷、举重、拖拽需要动作目标奖励，而只靠末端轨迹模仿限制爆发力；但任务奖励又可能让 RL 利用仿真器的电机误差取巧。", "method": "用实机状态转移监督仿真执行器残差模型；预训练 WBC 后对任务奖励微调，突破冻结低层的权限。对低质量球重复投掷加计时阶段变量。", "interface": "", "improvement": "", "experiment": "真机约20m投球、10lb举升、113N拉车10m；230N只拉0.5m。执行器网络、冻结与微调低层比较。", "limit": "执行器消融固定臂以避免腿失稳，不能作为完整全身所有模块消融；参考与对象任务由人工设计；计时只表示执行过，不验证投球成功。", "url": "https://arxiv.org/abs/2502.10894", "pdf": "papers/RSS_2025_Bridging_the_Sim-to-Real_Gap_for_Athletic_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2510.11258", "title": "DemoHLM: From One Demonstration to Generalizable Humanoid Loco-Manipulation", "label": "DemoHLM", "year": "2025", "date": "2025-10", "group": "示范／视觉／VLM", "platform": "人形", "problem": "一次仿真全身示范难覆盖新的起点和物体位姿。输入示范、已知物体模型／位姿与变化的初始场景，生成仿真动作数据，再训练依赖 FoundationPose 位姿与本体的任务策略。", "method": "明确扩展 MimicGen：移动／接近段按物体相对位姿变换，接触后改用接触时刻锚点，插值连接，由复用的 AMO 执行并过滤成功轨迹。它增加动态全身数据生成，不是原始 RGB／语言 VLA，也不是首次物体相对示范扩增。", "interface": "", "improvement": "", "experiment": "10 类仿真任务扩增至5000轨迹；真机 Table 4 实际为7类各5次，成功为 lift5、press5、push4、handover4、grasp3、cabinet2、erase2。正文／结论任务数不一致，不能把10个仿真任务写成10个真机任务。", "limit": "附录 PressCube 成功只是手距 cube <5 cm，EraseBoard 为抓橡皮左移>0.2 m，PushCart 主要检测抓住横梁；分别不是电气按钮激活、擦净面积或推车到目的地。代理指标对所测子技能有效，但不能代替实用任务完成率；未知物体网格和机构泛化未证明。", "url": "https://arxiv.org/abs/2510.11258", "pdf": "papers/2510.11258_DemoHLM_From_One_Demonstration_to_Generalizable_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K41", "title": "物体相对示范扩增与接触阶段的锚点"}]}, {"id": "2602.10106", "title": "EgoHumanoid: Unlocking In-the-Wild Loco-Manipulation with Robot-Free Egocentric Demonstration", "label": "EgoHumanoid", "year": "2026", "date": "2026-02", "group": "VLA 动作模型", "platform": "人形", "problem": "机器人遥操作数据集中在实验室；人类第一视角视频覆盖多场景，却与人形机器人在视点和动作尺度上不一致。输入人类第一视角视频与少量机器人示范，输出视觉语言条件的全身动作块。", "method": "MoGe 深度将人眼图像重投影到机器人视高，再补缺失图像；以相对末端动作、离散移动和夹爪统一表示，人／机器人数据共同训练 π0.5。移除本体减少域差，但作者同时指出精细朝向变得模糊；补洞也可能产生错误几何。", "interface": "", "improvement": "", "experiment": "四类真机任务每类100机器人＋300人示范，移动约1–5 m。78 对59、82 对31为子任务归一化分数，不是端到端成功率；所谓新机器人场景在部分人训练数据中覆盖，体现跨数据来源场景迁移。", "limit": "Robot-Free 指人示范采集，不是整个训练无机器人数据。人数据更易迁移导航而非精细接触；human-only cart grasp仅5，对robot15、共同训练60。不能泛称完全未见场景或任意形态已解决。", "url": "https://doi.org/10.15607/RSS.2026.XXII.204", "pdf": "papers/2602.10106_EgoHumanoid_Unlocking_In-the-Wild_Loco-Manipulation_with_Robot-Free_Egocentric_Demonstration.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}]}, {"id": "paper-66", "title": "Ψ₀: An Open Foundation Model Towards Universal Humanoid Loco-Manipulation", "label": "Ψ₀", "year": "2026", "date": "2026", "group": "VLA 动作模型", "platform": "人形", "problem": "人类视频和机器人关节动作差异较大，直接共同训练一个动作模型可能学不好精细控制。与 EgoHumanoid 的对齐后共同训练形成两种并行数据路线；它们同届发表，不能画成前后继承。", "method": "先训练 next task-space action 的 VLM 表征，再冻结骨干，以机器人数据训练 joint-space flow action expert，最后任务微调。阶段一实际同时使用 EgoDex 与 Humanoid Everyday，不是仅人数据。复用 AMO 低层，VLA 输出臂／手／torso／height／移动36维命令；RTC 用已提交动作前缀对齐异步推理。", "interface": "", "improvement": "", "experiment": "约829小时人数据、31小时机器人数据，8类各10次。子任务评价允许失败后人工干预继续，以测后续子目标，overall仍要求全程成功；不可将干预后的子目标均值当完全自主整体率。单任务消融最后 RTC 与前一步同为9/10，主要改善连续性。", "limit": "zero-shot背景2/10、对象4/10、空间2/10，通用鲁棒性有限；基线预训练量和RTC执行配置不同，不能只归因架构优越。结构化人位姿数据及机器人任务微调是必要条件，规模远超单个MSc项目。", "url": "https://doi.org/10.15607/RSS.2026.XXII.021", "pdf": "papers/RSS_2026_Psi0_An_Open_Foundation_Model_Towards_Universal_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2607.18016", "title": "POT-VLA: Closing the Loop in Humanoid VLA with Persistent 3D Object Tokens", "label": "POT-VLA", "year": "2026", "date": "2026-07", "group": "VLA 动作模型", "platform": "人形", "problem": "机器人走近、拿起、搬运、放下物体后，短动作块的模型可能忘记“同一个物体现在在哪里”；另一个独立监控器也可能用与动作模型不同的状态判断成功。", "method": "从 RGB-D 保存固定角色的8个对象槽，跨动作块刷新位置／尺度／可见性／关系，tokens 输入 GR00T N1.7 action expert。配置的 typed subtask 与稳定窗口几何谓词共享这些对象信息，将状态分为进行、完成、受阻、失败、不确定；不确定时重观察，避免仅凭已尝试认定成功。", "interface": "", "improvement": "", "experiment": "Unitree G1 八类合计80次，直接基线39/80、完整71/80；四任务消融direct15/40、verifier22/40、tokens31/40、both34/40。Being-0来自不同论文suite，不能排名。对象身份保持、短感知记忆与已完成事件应分开；回弹按钮无持久视觉变化时仍需过程／电气等结果证据，几何tokens不能自动确认。", "limit": "", "url": "https://arxiv.org/abs/2607.18016", "pdf": "papers/2607.18016_POT-VLA_Closing_the_Loop_in_Humanoid_VLA.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}]}, {"id": "paper-68", "title": "HoMMI: Learning Whole-Body Mobile Manipulation from Human Demonstrations", "label": "HoMMI", "year": "2026", "date": "2026", "group": "示范／视觉／VLM", "platform": "轮式双臂", "problem": "腕相机缺全局视野；人的六维头pose又不适合机器人两自由度neck。输入UMI头／腕图像与任务空间示范，输出双手轨迹和3D look-at point，而非要求机器人复制完整人头pose。", "method": "明确扩展UMI，以ARKit共享头／腕SE(3)。头图像DINOv3＋深度位置特征转到左夹爪坐标，腕图像保留局部细节；双手由Mink差分IK/QP追踪，头look-at单独控制避免抢占手目标，timestamp对齐并丢弃已过期动作。不是UMI on Legs的直接后续算法。", "interface": "", "improvement": "", "experiment": "RB-Y1全向轮式双臂，laundry／delivery／table各20次成功90%／85%／80%；去neck为75%／55%／55%，单腕或单头更低。示范约200／166／115条、同款夹爪及精确人位姿，支持整体／局部视野与主动观察互补。", "limit": "轮式运动学QP不是浮动基腿接触动力学WBC，未证明四足换步接触安全。视觉接触细节不是力触觉；任务空间、位姿采集和同夹爪条件也不能省略后泛称任意人视频迁移。", "url": "https://doi.org/10.15607/RSS.2026.XXII.205", "pdf": "papers/RSS_2026_HoMMI_Learning_Whole-Body_Mobile_Manipulation_from_Human_Demonstrations.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "ti
