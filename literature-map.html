tle": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K42", "title": "观察目标与操作目标可以分别控制"}]}, {"id": "2505.06776", "title": "FALCON: Learning Force-Adaptive Humanoid Loco-Manipulation", "label": "FALCON", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "人形", "problem": "开门、拉车、搬重物时，末端受到未知三维外力，臂若一味追位置会把失衡扰动传给腿。输入身体／臂状态及任务运动目标，控制器要同时输出抗扰步态与臂动作。", "method": "下半身 RL 策略学习外力下稳定行走，上半身策略学习末端位置追踪与隐式施力补偿；联合训练时逐步增加三维末端外力，并检查关节力矩限制。重点在控制策略对未知力的适应，不是语义任务选择。", "interface": "", "improvement": "", "experiment": "论文在 Unitree G1 与 Booster T1 真机展示负载搬运、拉车与开门，分别标注约 0–20 N、0–100 N、0–40 N 的交互范围；仿真与基线比较臂跟踪和抗扰。力级别、身体形态都与轻型 Piper 不同，不能把其大力性能直接当作轻接触安全保证。", "limit": "真机开门为 stance；主要外力训练不含任意外部力矩。接触点／准静态补偿有限制；附录报告执行器热约束。", "url": "https://arxiv.org/abs/2505.06776", "pdf": "papers/2505.06776_FALCON_Learning_Force-Adaptive_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}]}, {"id": "2409.16048", "title": "Whole-body End-Effector Pose Tracking", "label": "Whole-body Pose Tracking", "year": "2024", "date": "2024-09", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "已有末端跟踪方法或只跟踪位置，或主要覆盖身体前方、平地。本文研究如何站在不平地面上，利用身体与臂的冗余运动准确达到较大工作空间内的六维末端位姿。", "method": "先以臂正运动学采集10000个无自碰位姿，再加随机身体变换扩大目标范围，并利用粗地形图排除低于地面的目标。末端位姿用固定在工具上的三个不共线点表示，位置和转动统一成点距离。每4秒换目标，仅最后2秒启用到达奖励，并按超过历史最佳距离的进展补充稀疏奖励；以误差推动地形课程。复用行走策略产生的稳定初始配置，减少切换跳动。", "interface": "输入本体状态、上一动作和当前／目标三个末端关键点在身体坐标中的位置差；不读取地形图。输出12腿＋6臂关节位置目标。行走由另一策略执行，操作策略鼓励四足接触和少量足移动。", "improvement": "将完整位姿表示、目标采样和不平地形初态一起纳入训练；对照四种位姿表示，以及同机器人MPC。不是把自由行走和接触操作合成一个持续执行策略。", "experiment": "【真机＋仿真】ANYmal-D＋DynaArm。真机动捕20个平地目标：平均2.03 cm／2.86°；楼梯测试平均2.64 cm／3.64°。仿真10000目标检验表示与附加载荷，35目标比较MPC。MPC与RL的中位误差相近，MPC均值较差主要来自少数跨身体的卡住情况。", "limit": "§III-G明确不包含locomotion，切换到独立行走策略后再换楼梯朝向。不能用楼梯位姿跟踪证明边走边保持物体接触。地形图仅用于训练采样；没做楼梯MPC公平对照。关键点立方体尺寸仍隐含位置／朝向权重；不是完全没有权衡。", "url": "https://arxiv.org/abs/2409.16048", "pdf": "papers/2409.16048_Whole-body_End-Effector_Pose_Tracking.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2507.04229", "title": "Efficient Learning of A Unified Policy For Whole-body Manipulation and Locomotion Skills", "label": "PFG Unified Policy", "year": "2025", "date": "2025-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "只奖励最终末端误差时，RL早期难发现身体姿态改变能让臂够到目标；之后行走奖励变强，还可能放弃已学到的身体／臂配合。本文用显式运动学提示这种配合。", "method": "把目标转到当前身体坐标，以带关节限位的阻尼最小二乘IK判断该身体姿态能否让臂达到目标。IK有解时给予可行姿态奖励，并依据解出的臂关节配置提供训练指导，使策略在到达目标之前也能从有利身体姿态获得反馈。再用三次插值生成平滑末端参考，结合速度、位姿和运动正则项训练非对称PPO。", "interface": "输入身体速度和末端位姿目标、本体与臂状态、上一动作；统一输出18关节位置目标。IK求解主要用于训练期可达性奖励及critic信息，不是在部署时替代臂动作头。", "improvement": "与Deep WBC的ROA／advantage mixing对照，主要改动是运动学可达性塑形，不是新的RL优化器。相对于只用最终误差，它把“身体已使目标可达”与“末端已到达”分开。", "experiment": "【真机＋仿真】仿真比较AAC、AAC＋PFG、ROA、ROA＋AM；5000位姿用第60百分位误差，1000速度指令测速度跟踪。PFG位置误差8.7 cm、转动0.18 rad，不能当平均误差。真机X20＋Z1展示移动时末端升降及身体俯仰补偿，另有拾取与拖车案例。", "limit": "所谓工作空间扩大34%基于IK有解率，不是几何体积增加34%。参考坐标随水平身体移动，不能直接理解为固定世界接触。真机没有大样本接触力／任务成功率；IK数值失败也不严格等于目标不可达。", "url": "https://arxiv.org/abs/2507.04229", "pdf": "papers/2507.04229_Efficient_Learning_of_A_Unified_Policy_For_Whole-body_Manipulation_and_Locomotion_Skills.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K16", "title": "多目标奖励与多评价网络不等于多个物理机制"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}]}, {"id": "2505.22974", "title": "Learning coordinated badminton skills for legged manipulators", "label": "Badminton", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "打羽毛球要求在有限剩余时间内移动到击球位置、准确挥拍，并在准备动作中持续看清飞行物体。身体转动影响相机测量，感知误差又改变应当执行的击球目标。", "method": "从实机移动相机数据拟合检测概率与位置误差对距离、角速度的依赖，在训练中使用该模型并运行与真机相同的EKF。策略奖励准确、按时击球，同时惩罚预测误差，使身体动作既服务击球也服务观测。非对称critic额外读取剩余击球次数等未来信息；N-P3O处理臂总电流预算，执行器模型与CMA-ES辨识改善迁移。", "interface": "输入本体状态及EKF／飞行模型给出的击球位置、速度、时间等目标，统一输出腿和臂的18关节位置命令。策略100 Hz，机载视觉与预测异步60 Hz；不是RGB直接到关节的VLA。", "improvement": "把动作引起的感知质量变化纳入学习闭环；与直接鼓励目标留在视野内的奖励比较。相比仅规定末端轨迹，策略还要决定移动、时序和主动观察行为。", "experiment": "【真机＋仿真；强实验】机载系统在实验室、室内大厅及户外与人对打，记录10拍连续回合；真机速度最高12.06 m/s。仿真分开到点、含感知误差的截击、能耗、critic信息和电流约束消融；部分击球成功区域在真机验证。Fig.7主要约束与学习曲线来自仿真，不能全部当真机统计。", "limit": "橙色羽毛球以HSV检测，背景／光照影响感知模型；实测视觉延迟60–160 ms。主要平地与特定球拍／运动模型，不是通用物体操作。电流预算的训练约束和任务中的人身安全保证不同，不能以无超流证实任意接触安全。", "url": "https://arxiv.org/abs/2505.22974", "pdf": "papers/2505.22974_Learning_coordinated_badminton_skills_for_legged_manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2506.16986", "title": "Learning Accurate Whole-body Throwing with High-frequency Residual Policy and Pullback Tube Acceleration", "label": "Accurate Throwing", "year": "2025", "date": "2025-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "高速投掷不仅需要末端在释放时具有正确位置与速度，还要处理夹爪张开后物体究竟何时脱离的不确定性。单次准确跟踪目标时刻，不能保证整个可能释放窗口都能命中。", "method": "先学定时全身末端状态跟踪，再冻结名义策略训练高频臂残差。模型模块用抛体落点映射求当前释放状态的落点偏差，并在速度／加速度边界下求修正，让100 ms释放窗口内的末端状态接近能到达目标的状态集合。以CVXPYgen编译参数化求解，部署每2.5 ms更新；不是只在投掷之前离线规划一次。", "interface": "输入本体状态、投掷末端位置／速度／朝向、计时与上一动作；100 Hz策略输出18关节参考，400 Hz残差只修正臂关节位置。优化器由当前末端状态计算释放窗口内的竖向加速度参考。", "improvement": "原tube acceleration先假设已在有效释放状态集合内且能精确跟踪；本文根据当前跟踪误差闭环修正。相对Athletic追求投远，重点变成给定目标的落点精度；两文不是已核实的直接继承。", "experiment": "【真机＋仿真；强实验】真机4/6 m各含两种横向偏置、每目标10次，总40次，名义基线另重复；6 m平均落点误差0.276 m，名义基线0.685 m。仿真500次组件消融及1500初态×5种子的释放窗口分析。另与25位学生比较，机器人71/125、人19/125。", "limit": "人对比和雪团测试使用部分实现／较早训练checkpoint，不能当最终全系统消融。实机残差改善弱于仿真，作者指出可能过拟合动力学。只给竖向加速度残差；依赖近似飞行模型与对象相对末端惯量较小的假设。未证明持续行走接触。", "url": "https://arxiv.org/abs/2506.16986", "pdf": "papers/2506.16986_Learning_Accurate_Whole-body_Throwing_with_High-frequency_Residual_Policy_and_Pullback_Tube_Acceleration.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}, {"id": "K45", "title": "释放时刻不确定时，怎样仍命中目标"}]}, {"id": "2503.01474", "title": "Interactive Navigation for Legged Manipulators with Learned Arm-Pushing Controller", "label": "Interactive Arm-Pushing", "year": "2025", "date": "2025-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "导航遇到可移动障碍时，绕行可能很远；身体推物在狭窄空间里难以找到接触位置。本文让机械臂从身体进不去的位置推开障碍，并将推物成本计入路径选择。", "method": "Hybrid A*把预计推物时间加入路径代价，QP平滑路径；采样不会继续挡路的物体目标，靠近后调用推物。RL先奖励进入物体相对目标的背侧圆柱区域，再开启向目标推送和防倾倒奖励；分段距离课程与LSTM帮助学习不同质量／摩擦的推物。推不动时把障碍重分类为静态并重规划。", "interface": "导航输入预建地图、已知可移动障碍及目标位置；推物策略读取物体／目标／末端状态和历史，原始输出6个臂关节增量。扩展全身执行时，由该动作产生末端参考，再交给按Visual WBC训练的低层跟踪器。", "improvement": "相对于用身体推物，新增主动臂接触与适合推送的接触区域；相对于单一任务奖励，先指导找正确一侧，再奖励移物。导航、推物、重规划是模块系统，不是统一端到端导航RL。", "experiment": "【真机＋仿真】Gazebo物体尺寸、摩擦、质量、圆柱迁移，每条件50次，成功率76–92%；两阶段奖励与两个基线比较。B2＋Z1 Pro真机8×6.8 m场景，平均58.20 s／5.42 m，对绕行113.50 s／10.70 m；演示推不动时恢复路径。", "limit": "预先知道哪些障碍可移动，真机物体与机器人状态来自动捕；不代表开放环境自主识别可推动性。无力峰值安全统计。正文25 Hz、100步与“10秒”时长说明不一致，不据此换算成功速度；全身版本缺单独量化消融。", "url": "https://arxiv.org/abs/2503.01474", "pdf": "papers/2503.01474_Interactive_Navigation_for_Legged_Manipulators_with_Learned_Arm-Pushing_Controller.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K23", "title": "导航终点应满足后续操作条件"}, {"id": "K29", "title": "世界模型与搜索必须预测实际闭环执行"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "2508.08328", "title": "Whole-Body Coordination for Dynamic Object Grasping with Legged Manipulators", "label": "DQ-Net / DQ-Bench", "year": "2025", "date": "2025-08", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "已有视觉抓取主要针对静止对象。持续移动的目标使当前抓取位姿很快过期，逐帧运行大型抓取网络又有计算与时序代价；需要视觉历史与稳定抓取候选共同指导接近。", "method": "先用Contact-GraspNet生成候选，在对象坐标中保存top-30抓取。教师将候选随当前对象位姿变换，并用点云／位姿query与候选key/value注意力生成抓取表示，再以RL学任务动作。冻结教师，在学生自身到达状态上用DAgger取教师标签；两视角共享CNN后分别进行时序Transformer编码，再融合动作。基准用移动小平台承载对象，分速度和2D/3D随机运动4级。", "interface": "特权教师读取对象位姿、速度、点云与抓取候选；部署目标学生只读腕／身体两视角各3帧mask＋depth、本体状态。高层输出末端位置／朝向增量与底盘速度命令；腿低层RL，臂由IK执行。", "improvement": "明确以Visual WBC为共享低层和高层基线，新增动态对象的候选融合与视觉时序学生；不是仅把静态抓取任务改名。GFM记忆是对象几何候选库，不是已完成任务事件的记忆。", "experiment": "【仅仿真】43类YCB：30训练、13未见。共享低层，比较VBC、适应后的VBC-D、去候选融合、去速度、CNN学生。最难L4完整教师74.3%、学生41.0%，VBC-D学生16.0%；完成步数34.32对41.56。附录保留未见对象与学生架构对照。", "limit": "结论明确把真机部署列为未来工作，B1＋Z1是仿真形态。74.3%不是可部署视觉学生成功率。固定抓取候选与特权教师到学生的信息缺口明显；附录某些未见物体上去速度更好，不能宣称动态信息总有益。", "url": "https://arxiv.org/abs/2508.08328", "pdf": "papers/2508.08328_Whole-Body_Coordination_for_Dynamic_Object_Grasping_with_Legged_Manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K21", "title": "视觉策略可以学控制，也可以只学操作参考"}, {"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}, {"id": "K42", "title": "观察目标与操作目标可以分别控制"}, {"id": "K44", "title": "示范监督与闭环数据分布"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2512.04381", "title": "FALCON: Actively Decoupled Visuomotor Policies for Loco-Manipulation with Foundation-Model-Based Coordination", "label": "FALCON (quadruped)", "year": "2025", "date": "2025-12", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "移动底盘需要全局视野和速度控制，机械臂需要局部视觉与准确位置控制。把这些输入和目标全部交给一个示范策略，可能难以同时学好；拆开后又需要协调身体站位与臂操作。", "method": "冻结CLIP编码多视角与文字，用可训练投影／浅Transformer融合为两策略共享上下文。ongoing/done阶段文字与图像相似度给出阶段概率及进度，作为动作条件。训练时以匹配示范臂／底盘动作作为正样本，打乱两子系统动作构造负样本，InfoNCE正则使共享表示包含协作关系；高层从同一批遥操作示范学习。", "interface": "输入腕／头／身体RGB、本体与任务文字、人工编写的阶段提示。两个扩散策略分别输出底盘速度／高度／pitch与末端目标；低层腿RL、臂IK。动作模型10 Hz离板4090，腿RL50 Hz、内环200 Hz，臂100 Hz。", "improvement": "不是把CLIP直接当控制器；区别于集中式扩散／ACT，是专用动作流加共享语义和阶段条件。论文明确受LatentToM启发并将其作基线。属于语言条件视觉动作学习邻接，不能等同π0式大规模预训练VLA或语言规划器选固定技能。", "experiment": "【真机】两类抽屉任务：走近→开抽屉→取玩具→放入，以及携物→走近→放入→关抽屉。同50条示范，CDP／ACT／LatentToM及阶段／对比损失消融，每任务15次（3初始区域各5）。正文报告Task2完整15/15，并另有子系统人工接管试验。", "limit": "只有两任务，主要改变初始位置；阶段文字由人工构造，不是无需任务先验。对比损失有时降低OOD导航指标，并非所有环节有益。Task2的到位与整体完成判据不同；human-in-loop正文100%表述与Table III局部80/90%不一致，分开记录，不能统一称全自主100%。无接触力安全统计。", "url": "https://arxiv.org/abs/2512.04381", "pdf": "papers/2512.04381_FALCON_Actively_Decoupled_Visuomotor_Policies_for_Loco-Manipulation_with_Foundation-Model-Based_Coordination.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K25", "title": "低频观测、高频反馈与时间戳"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}, {"id": "K42", "title": "观察目标与操作目标可以分别控制"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2511.19709", "title": "Whole-Body Inverse Dynamics MPC for Legged Loco-Manipulation", "label": "Whole-Body ID-MPC", "year": "2025", "date": "2025-11", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "简化身体模型规划、再由WBC执行，可能在臂重、施力大或关节接近力矩上限时产生不一致。本文研究能否把关节级动力学与接触力直接放进同一个实时预测优化。", "method": "用RNEA逆动力学作每个预测节点的路径约束，同时约束浮动基六维受力平衡、足不滑移、摩擦锥与关节运动范围。末端力／速度是给定等式条件；步态时序固定，横向落脚点可优化。Pinocchio＋CasADi建立稀疏符号问题，Fatrop利用阶段结构求解，热启动与编译加速；前细后粗的几何时间网格延长预测。", "interface": "输入估计的配置／速度、底盘速度、末端速度／力与固定步态接触时序。优化全身配置、速度、加速度、接触力及近端关节力矩，输出轨迹经500 Hz插值加PD执行；没有额外QP-WBC，不表示没有关节反馈。", "improvement": "与同框架的前向动力学／质心模型比较，说明问题表达和求解器结构可使全阶模型实时运行，而非必然需要降阶。它与ETH多接触规划关注层次不同：这里不搜索接触顺序，也不建模对象。", "experiment": "【真机＋仿真；重要边界】15节点0.56 s时域，编译后平均12.5 ms；前向模型34.2 ms，具体求解器与表达匹配不能泛称所有全阶MPC更快。B2＋Z1真机边走边拉10 kg、行走推箱、站立擦白板及低增益人机柔顺。仿真检验0.8 m/s扰动与力矩饱和，非均匀网格漂移0.4对1.2 cm/s。", "limit": "末两臂关节锁定；力矩限位仅约束前两个时间步，远端未同样约束。真机无设备测实际末端力，不能验证力目标精确跟踪。没有对象动力学或碰撞约束；离板计算、实机有20 ms求解尖峰及质量分布／执行器模型偏差。", "url": "https://arxiv.org/abs/2511.19709", "pdf": "papers/2511.19709_Whole-Body_Inverse_Dynamics_MPC_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K07", "title": "位置准确、保持接触与力准确分别是什么"}, {"id": "K08", "title": "柔顺控制规定受力后怎样运动"}, {"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}, {"id": "K11", "title": "抗扰裕量是在扰动发生前保留余地"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}, {"id": "K36", "title": "物体反作用力的预测与反馈"}]}, {"id": "2512.18938", "title": "A Framework for Deploying Learning-based Quadruped Loco-Manipulation", "label": "Deployment Framework", "year": "2025", "date": "2025-12", "group": "形态／系统", "platform": "四足＋臂", "problem": "同一个训练策略跨模拟器或部署真机时，观测索引、控制时序和接触模型不同会使表现改变；不少已有框架缺完整可复用部署链。本文重建同一B1＋Z1接口，检查这些差异。", "method": "基于Visual WBC的部分开源实现扩展Isaac Gym训练→MuJoCo验证→实机ROS接口。脚接触用关节力矩经Jacobian伪逆转成粗力估计再阈值化；实机与仿真共用FSM、目标管理与PD。显式比较MuJoCo默认与高impratio接触设置，区分画面更平滑与真实抓地鲁棒性。", "interface": "命令是底盘速度与末端位姿；腿RL加ROA式适应，臂阻尼IK。同ROS控制节点通过MujocoHW或QmHW接模拟器／SDK，保持接口与观测排列；遥操作给高层目标。", "improvement": "贡献是部署接口与跨模拟器诊断，不是新的全身RL算法。body-assisted reach与固定身体默认控制器比较，强调可重复工程基线。", "experiment": "【真机＋仿真】低／中／高末端目标配23秒速度序列，跨模拟器报告vx／yaw RMSE。真机3种YCB物体、4高度，表4每物共10次，合计30次：WBC 26/30、默认15/30（从表计数），是遥操作取物，不是视觉自主成功。", "limit": "原文称代码尚未公开、计划发布，不能仅据题名把它当现成可下载baseline。接触伪逆公式未完整区分重力／惯性偏差，不是精确外力估计证据。高impratio改善可能来自不现实的摩擦阻抗；每条件3次或地面1次，样本小。", "url": "https://arxiv.org/abs/2512.18938", "pdf": "papers/2512.18938_A_Framework_for_Deploying_Learning-based_Quadruped_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K09", "title": "无力传感器时，估计到的到底是什么"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K37", "title": "训练可预测的步态，再辨识闭环响应"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2605.15713", "title": "Learning Dynamic Pick-and-Place for a Legged Manipulator", "label": "Dynamic Pick-and-Place", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "分段抓取和搬运会产生停顿，并可能在抓取时选择不利于后续放置的身体／臂配置。本文研究移动不中断时的抓取、搬运、直立放置与撤离，并适应不同对象质量。", "method": "先以异步随机关节臂运动和负载训练抗扰步态，避免只覆盖平滑末端插值；再把抓取、搬运、放置与撤臂放在单个episode中训练任务策略。六阶段奖励给当前子目标，同时保留后续回报；同步各子任务成功率驱动距离／质量／放置容差课程。历史估计器以仿真质量和接触真值监督，其输出直接给任务actor。", "interface": "输入机器人／对象状态历史、抓取／放置位置、对象尺寸／类型与显式任务阶段。高层输出底盘vx/vy/yaw、height/pitch及6臂关节／二值夹爪；低层腿策略冻结。LSTM估对象质量及夹爪接触状态；真机对象／台面状态由Vicon取得。", "improvement": "相比分段策略，一起优化完整任务；相对只域随机化加入执行中的质量／接触估计。与潜变量适应对照效果相近，但显式小维度输出训练更省。不是无任务阶段记忆，也不是VLA。", "experiment": "【真机＋仿真；强实验】仿真5种子各10000任务：86.05%对无估计81.88%、分段78.40%、潜变量85.82%；完成时间2.071 s对分段2.572 s。真机6条件各10次，总44/60=73.3%，平均4.06 s；质量最高1.3 kg，地面到1.1 m台面条件6/10。真机名义任务换VBC低层为3/10，完整9/10。", "limit": "所谓比旧方法快10倍跨论文任务／观测／平台不同，不能作严格同条件排名。真机依赖Vicon，物体形态主要盒／圆柱；2.3 kg为训练范围，实机因夹爪安全限制只测到1.3 kg。主要失败是抓取滑落／弹出，二值夹爪不能连续调力，棱角接触仿真差异明显。", "url": "https://arxiv.org/abs/2605.15713", "pdf": "papers/2605.15713_Learning_Dynamic_Pick-and-Place_for_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K06", "title": "模型精度、算力与执行偏差的取舍"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K18", "title": "跟踪示范、调节进度与任务优化"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}, {"id": "K38", "title": "肢体角色分配与给定角色的执行"}]}, {"id": "2212.03238", "title": "Walk These Ways: Tuning Robot Control for Generalization with Multiplicity of Behavior", "label": "Walk These Ways", "year": "2022", "date": "2022-12", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "仅以平地速度跟踪定义任务，存在很多同样有效的行走方式。RL常收敛到其中一种；这种方式在新环境不合适时，往往要修改环境／奖励再训练。本文保留多种受控行为，使部署者能在不更新网络权重的情况下选择更合适的行走方式。", "method": "训练一个行为条件PPO策略，同一速度命令下按行为参数跟踪不同接触节律、姿态和抬脚轨迹。奖励分为速度任务、固定稳定／平滑项及依行为参数变化的辅助项；接触时序决定摆动时应少受力、支撑时应少滑动，Raibert启发式让足落点随速度和站宽变化，避免站宽奖励妨碍转弯。训练中途重采样命令和行为以学习切换；用四类对称步态为采样基础和速度网格课程。地形始终平坦，但随机质量、摩擦、执行器等；另用执行器网络和约20 ms动作延迟缩小sim-to-real差距。", "interface": "任务指令是身体坐标下vx、vy、yaw速度；行为向量有8维：三组足间相位、步频、身体高度、身体pitch、站宽、抬脚高度。正文§3.2报告30步关节状态、身体重力方向、命令／行为、过去动作和四足时钟历史；另从历史监督估计身体速度与摩擦。输出12关节位置偏移，经PD（kp=20、kd=0.5）执行；Go1 Edu＋Jetson TX2 NX，50 Hz。没有机械臂、末端目标、相机／地形图或接触力操作目标。", "improvement": "贡献是可解释的行为空间及“不重新训练、改行为输入”的迁移路线，不是首次提出步态参数、PPO、课程、系统辨识或域随机化；也不是无监督自动发现技能。论文明确借鉴双足接触奖励、Raibert和既有执行器／适应方法。它保留了一个任务的多种解，可将高层任务接到已有行为接口上。", "experiment": "【真机＋仿真，行走为主】Go1真机切换trot／pace／bound／pronk及2–4 Hz节律；有人调参数通过台阶／路沿、灌木和22 cm低横杆，并提前加宽站姿抗推；身体倾斜倾倒所携球属于简单身体载荷操作。平台地形和能耗对照主要为仿真：最高16 cm随机平台，三种seed，报告episode存活时间比例，trot 0.88、pace 0.87、gait-free 0.83。Table 3在1 m/s时trot机械功率24、gait-free 35，不能当作真机电池续航。Table 5也显示gait-free平地高速组合性能更好。前跳和舞蹈为预设参数序列演示，不是自动规划。", "limit": "新环境的行为选择主要由人完成；没有证明策略能自动识别并选择最优行为。MoB有效依赖“学到的行为中至少有一个适合目标环境”，不是任意OOD保证；行为约束可能降低平地最高速度／转弯组合性能。正文平台测试10 s、Appendix C图8为20 s设置，需分别保留。站宽／相位影响姿态稳定不等于保证手端轨迹或接触力安全；换上机械臂需要额外训练／验证。", "url": "https://proceedings.mlr.press/v205/margolis23a.html", "pdf": "papers/2212.03238_Walk_These_Ways_Tuning_Robot_Control_for_Generalization_with_Multiplicity_of_Behavior.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "关节角度、速度与力矩是不同的动作接口"}, {"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K17", "title": "首次成功、接触探索与奖励塑形"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K46", "title": "用可调行为保留同一任务的多种运动解"}]}, {"id": "1707.06347", "title": "Proximal Policy Optimization Algorithms", "label": "PPO", "year": "2017", "date": "2017-07", "group": "RL 训练基础", "platform": "通用方法", "problem": "策略梯度每批数据只更新一次，样本利用率低；大步更新又容易破坏已有策略。", "method": "采集当前策略的轨迹后，以新旧策略动作概率比构造替代目标，并把该比值裁剪在邻近1的区间；同一批数据做多轮小批量更新。裁剪是抑制过大的策略变化，并非严格的安全约束。", "interface": "输入当前观测及采样动作的概率比、优势估计；输出更新后的策略参数，不规定机器人传感器或动作空间。", "improvement": "", "experiment": "【仿真基准】连续控制和Atari；原论文没有四足＋臂真机。", "limit": "大量四足论文用PPO优化策略，但其全身协调、奖励和sim-to-real机制不是PPO自带。", "url": "https://arxiv.org/abs/1707.06347", "pdf": "papers/1707.06347_Proximal_Policy_Optimization_Algorithms.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "1011.0686", "title": "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning", "label": "DAgger", "year": "2010", "date": "2010-11", "group": "示范学习基础", "platform": "通用方法", "problem": "只在专家轨迹上模仿会遇到分布偏移：学生一次动作失误后进入训练集未覆盖的状态。", "method": "反复让当前学生运行，把其实际访问的状态及专家纠正动作汇入训练集，再做监督学习。核心是训练状态分布逐步接近部署分布，而非只增加原始示范量。", "interface": "学生在环境中运行产生状态；专家给这些状态标注目标动作；输出更新后的学生策略。", "improvement": "", "experiment": "【模拟与结构化预测】原文比较两个模仿学习任务及序列标注；未做四足真机。", "limit": "需要可随时查询的专家，机器人上可能需要昂贵的遥操作或仿真教师；不自动提供安全访问状态的机制。", "url": "https://arxiv.org/abs/1011.0686", "pdf": "papers/1011.0686_A_Reduction_of_Imitation_Learning_and_Structured_Prediction_to_No-Regret_Online_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K44", "title": "示范监督与闭环数据分布"}, {"id": "K15", "title": "特权训练、历史估计与视觉学生"}]}, {"id": "2108.10470", "title": "Isaac Gym: High Performance GPU-Based Physics Simulation For Robot Learning", "label": "Isaac Gym", "year": "2021", "date": "2021-08", "group": "RL 训练基础", "platform": "跨平台仿真工具", "problem": "CPU物理仿真与GPU神经网络往返传输限制大批量机器人RL训练速度。", "method": "把物理仿真、张量表示及RL流水线放在GPU，批量并行模拟机器人；这是训练基础设施，不是步态奖励或操作算法。", "interface": "并行环境在GPU上推进，直接向GPU策略／优化器提供状态、奖励和训练数据。", "improvement": "", "experiment": "【仿真基准＋真机迁移例证】大规模并行仿真与训练吞吐；§6.1.4还报告ANYmal崎岖地形行走实机迁移，另有TriFinger迁移。没有四足＋臂操作实机对比。", "limit": "仿真吞吐提升不保证动力学逼真或实机成功；具体仿真平台和接触模型仍需逐篇核查。", "url": "https://arxiv.org/abs/2108.10470", "pdf": "papers/2108.10470_Isaac_Gym_High_Performance_GPU-Based_Physics_Simulation_For_Robot_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2107.04034", "title": "RMA: Rapid Motor Adaptation for Legged Robots", "label": "RMA", "year": "2021", "date": "2021-07", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "只在仿真训练的腿式策略到真实地形后，摩擦、载荷、地面软硬无法直接观测且会变化。", "method": "先在随机环境参数和地形中联合训练环境编码器与行走策略；再冻结它们，用仿真标签监督历史适应器模仿z。部署时适应器从过去动作和反馈实时更新潜表示，不再读取特权环境参数。", "interface": "第一阶段策略输入本体状态、速度指令和由特权环境因素编码的z；第二阶段适应器以机器人近期本体历史预测z，真机只使用历史预测值。策略输出关节目标。", "improvement": "", "experiment": "【真机＋仿真】Unitree A1在沙、泥、碎石、草地和楼梯等条件行走；正文报告部分任务的成功率，且无实机微调。", "limit": "原作没有机械臂或物体操作；两阶段适应训练的目标与后续Deep WBC的联合ROA安排不同。", "url": "https://arxiv.org/abs/2107.04034", "pdf": "papers/2107.04034_RMA_Rapid_Motor_Adaptation_for_Legged_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K19", "title": "域随机化、模型校准与在线补偿"}]}, {"id": "2109.11978", "title": "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning", "label": "Learning to Walk in Minutes", "year": "2021", "date": "2021-09", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "传统CPU串行训练四足RL过慢，地形难度课程与大量并行机器人训练不易配合。", "method": "把数千环境并行推进，调整PPO在大批量数据下的实现，并引入按机器人表现升降的地形课程；公开legged_gym训练配置。", "interface": "大规模GPU模拟ANYmal环境，PPO学习本体观测和速度指令到关节动作的策略。", "improvement": "", "experiment": "【真机＋仿真】平地约4分钟、复杂地形约20分钟训练ANYmal策略并迁移真机；训练时长是所述硬件和任务设置，不可外推到带臂任务。", "limit": "行走训练速度突破不等于本文设计了loco-manipulation的奖励、接触安排或手端控制。", "url": "https://arxiv.org/abs/2109.11978", "pdf": "papers/2109.11978_Learning_to_Walk_in_Minutes_Using_Massively_Parallel_Deep_Reinforcement_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2010.11251", "title": "Learning Quadrupedal Locomotion over Challenging Terrain", "label": "Challenging Terrain", "year": "2020", "date": "2020-10", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "盲走控制器在真实崎岖、松软地形上既要避免足滑移，也要跨仿真到真实的执行器误差。", "method": "用多难度地形课程、执行器模型及动力学随机化训练本体感知策略；课程逐步暴露台阶、斜坡和不规则足支撑。", "interface": "ANYmal的关节与惯性本体观测和速度指令进入策略，输出关节动作；原作部署策略不依赖前向视觉图。", "improvement": "", "experiment": "【真机＋仿真】ANYmal在泥、雪、碎石等真实地形行走；Science Robotics 2020。", "limit": "经常被后作当作腿式地形背景引用，不能据此画成它们的具体策略、奖励或地形编码直接继承。", "url": "https://arxiv.org/abs/2010.11251", "pdf": "papers/2010.11251_Learning_Quadrupedal_Locomotion_over_Challenging_Terrain.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "域随机化、模型校准与在线补偿"}]}, {"id": "2201.08117", "title": "Learning robust perceptive locomotion for quadrupedal robots in the wild", "label": "Perceptive Locomotion", "year": "2022", "date": "2022-01", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "仅靠足接触之后才知道障碍的本体行走，难以提前选择落脚和调整身体；高度图也可能噪声大或过时。", "method": "端到端训练注意力式循环编码器融合本体与外感地形信息，让策略在地形视觉失准时更多依靠身体反馈，而非手工规定两种传感的固定权重；训练包含感知退化与复杂地形。", "interface": "本体历史与外感地形测量进入注意力式循环编码器，再条件化行走策略；输出腿动作，无臂末端操作目标。", "improvement": "", "experiment": "【真机＋仿真】ANYmal在户外多季节复杂地形行走，并报告阿尔卑斯山区长时徒步；Science Robotics 2022。", "limit": "高频被四足操作论文引用作地形感知背景，但不等于它们复用了相同视觉融合器。", "url": "https://arxiv.org/abs/2201.08117", "pdf": "papers/2201.08117_Learning_robust_perceptive_locomotion_for_quadrupedal_robots_in_the_wild.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "2103.00946", "title": "A Unified MPC Framework for Whole-Body Dynamic Locomotion and Manipulation", "label": "Unified MPC 2021", "year": "2021", "date": "2021-03", "group": "模型控制方法基础", "platform": "四足＋臂", "problem": "行走与臂操作若分别规划，难同时处理身体、足、手与被操作物体的动力学耦合。", "method": "把机器人质心动力学与被操作物体动力学放入同一多接触最优控制问题，接触时序由预设切换约束编码；在线反复求解有限时域。与2023 ETH工作相比，本文不搜索离散接触顺序。", "interface": "给定步态／手接触时序及操作目标，MPC滚动优化身体、足、手和物体运动；低层全身控制跟踪优化结果。", "improvement": "", "experiment": "【四足＋臂真机】ANYmal带臂完成身体／手端位姿跟踪和阻力较大的门推拉；RA-L 2021。", "limit": "预定义接触模式和物体模型限制新场景；MPC实时性不等于未知机构、摩擦、抓取点均可自动估计。", "url": "https://arxiv.org/abs/2103.00946", "pdf": "papers/2103.00946_A_Unified_MPC_Framework_for_Whole-Body_Dynamic_Locomotion_and_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "浮动基、足接触与手端运动的耦合"}, {"id": "K05", "title": "轨迹规划、MPC 与 WBC 的决策范围"}, {"id": "K10", "title": "离散接触模式与连续运动需要共同安排"}]}, {"id": "2402.10329", "title": "Universal Manipulation Interface: In-The-Wild Robot Teaching Without In-The-Wild Robots", "label": "Original UMI", "year": "2024", "date": "2024-02", "group": "示范学习基础", "platform": "固定臂操作／数据接口", "problem": "在实际机器人上逐任务遥操作采集数据昂贵，纯人类视频与机器人动作空间又不一致。", "method": "用便携夹爪收集原环境示范，配广角腕视角、姿态追踪和动作过滤；以相对轨迹及推理延迟匹配降低跨本体偏差，训练视觉动作策略。UMI本身是数据／动作接口体系，不是四足全身控制器。", "interface": "人手持带相机和夹爪的工具采示范；从图像与追踪估计手端相对轨迹、夹爪动作，部署时给机器人同类相机观察和相对动作接口。", "improvement": "", "experiment": "【真机】在不同机器人上做动态、双手、精细和长时操作并测试未见环境／物体；RSS 2024。", "limit": "部署默认已有可追踪手端目标的机器人；足支撑和身体补偿由后续UMI on Legs处理。", "url": "https://arxiv.org/abs/2402.10329", "pdf": "papers/2402.10329_Universal_Manipulation_Interface_In-The-Wild_Robot_Teaching_Without_In-The-Wild_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "参考坐标系决定控制器究竟在保持什么"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}]}, {"id": "2303.04137", "title": "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion", "label": "Diffusion Policy", "year": "2023", "date": "2023-03", "group": "示范学习基础", "platform": "固定臂操作／动作生成", "problem": "示范数据中同一观察可能对应多种合理动作，单点回归容易给出不合适的平均动作。", "method": "将动作轨迹看成条件扩散生成变量，用示范轨迹训练去噪网络；时间序列动作预测与滚动执行保持闭环。论文比较卷积和Transformer去噪结构。", "interface": "视觉与本体观察条件化多步动作序列；推理时迭代去噪生成序列，执行前一段并重新观察。", "improvement": "", "experiment": "【多任务仿真＋真机操作】15类操作基准，含多模态动作和视觉反馈任务；其汇总提升应保留基线与任务口径。", "limit": "原论文没有四足运动、足接触和手端跟踪控制；动作生成质量与低层执行能力须分别衡量。", "url": "https://arxiv.org/abs/2303.04137", "pdf": "papers/2303.04137_Diffusion_Policy_Visuomotor_Policy_Learning_via_Action_Diffusion.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2304.13705", "title": "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware", "label": "ACT / ALOHA", "year": "2023", "date": "2023-04", "group": "示范学习基础", "platform": "固定双臂操作", "problem": "低成本双臂的细操作会因单步模仿误差不断积累，演示中的停顿也使单步监督不稳定。", "method": "ACT用条件潜变量模型预测动作块而非单步动作，并使用时间集成平滑当前动作；论文同时提供可遥操作的低成本双臂ALOHA硬件。", "interface": "多相机与关节状态输入Transformer，输出未来一段双臂关节目标；执行时可对相邻动作块做时间集成。", "improvement": "", "experiment": "【真机】六类精细双臂任务，含开调味杯和插电池；文中在两个任务报告约80–90%成功率，依各任务训练数据量而异；RSS 2023。", "limit": "原作固定双臂；单独引用ACT不表示已经解决底盘同步移动和接触稳定性。", "url": "https://arxiv.org/abs/2304.13705", "pdf": "papers/2304.13705_Learning_Fine-Grained_Bimanual_Manipulation_with_Low-Cost_Hardware.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2401.02117", "title": "Mobile ALOHA: Learning Bimanual Mobile Manipulation with Low-Cost Whole-Body Teleoperation", "label": "Mobile ALOHA", "year": "2024", "date": "2024-01", "group": "移动示范方法基础", "platform": "轮式双臂", "problem": "固定桌面示范不能直接覆盖开柜、进电梯、搬运等需底盘与双臂同时运动的任务。", "method": "把ALOHA双臂遥操作装到移动底盘，收集50段／任务左右的全身示范；用静态ALOHA数据协同训练移动任务，检验固定操作数据能否提高数据效率。", "interface": "全身遥操作采相机、双臂状态、底盘运动；模仿策略联合输出双臂关节与底盘线／角速度。", "improvement": "", "experiment": "【轮式真机】开双门壁柜、把锅放入柜中、使用电梯及厨房任务；部分任务协同训练成功率明显改善，原文“up to 90%”是相对具体设置。", "limit": "轮式底盘没有四足起步抬腿与足接触切换；多数本库后作将其作系统／数据背景引用，未核到直接沿用其整套训练。", "url": "https://arxiv.org/abs/2401.02117", "pdf": "papers/2401.02117_Mobile_ALOHA_Learning_Bimanual_Mobile_Manipulation_with_Low-Cost_Whole-Body_Teleoperation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "统一策略、协作策略与模型分工"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K44", "title": "示范监督与闭环数据分布"}]}, {"id": "2204.01691", "title": "Do As I Can, Not As I Say: Grounding Language in Robotic Affordances", "label": "SayCan", "year": "2022", "date": "2022-04", "group": "视觉语言方法基础", "platform": "轮式移动机械臂", "problem": "语言模型知道步骤名称，却不知道机器人当前是否能实际完成某一步。", "method": "逐步给每个候选技能计算“语言上合理”和“当前可执行”的组合分数，由低层已训练技能执行；失败或状态改变后可重新评分。它是技能选择接口，不输出连续四足关节动作。", "interface": "输入用户语言命令及当前候选技能；语言模型提供任务相关性，技能价值函数估计可行性，选技能循环执行。", "improvement": "", "experiment": "【移动机械臂真机】长程家居式语言指令，展示可行性评分对任务完成的影响；CoRL 2022论文集2023。", "limit": "技能库的覆盖范围决定可执行步骤；本库多数引用仅作语言规划背景，WildLMa未证实直接采用SayCan的评分公式。", "url": "https://arxiv.org/abs/2204.01691", "pdf": "papers/2204.01691_Do_As_I_Can_Not_As_I_Say_Grounding_Language_in_Robotic_Affordances.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}]}, {"id": "2103.14127", "title": "Contact-GraspNet: Efficient 6-DoF Grasp Generation in Cluttered Scenes", "label": "Contact-GraspNet", "year": "2021", "date": "2021-03", "group": "视觉抓取方法基础", "platform": "通用机械臂", "problem": "杂乱场景中直接从深度图找有效六自由度抓取姿态，传统逐候选采样和验证较慢。", "method": "把局部接触位置和抓取姿态预测结合，在点云中密集产生并筛选6D抓取；它给出候选物体接触位姿，不控制移动底盘。", "interface": "输入场景深度点云，输出多个候选夹爪抓取位姿和评分；下游再选择与机器人可达性兼容的抓取。", "improvement": "", "experiment": "【抓取基准＋真机夹爪】在杂乱物体场景比较抓取候选质量与执行；ICRA 2021。", "limit": "检测到好抓取不等于四足全身能在运动中稳定达到；底盘站位和身体姿态须另规划。", "url": "https://arxiv.org/abs/2103.14127", "pdf": "papers/2103.14127_Contact-GraspNet_Efficient_6-DoF_Grasp_Generation_in_Cluttered_Scenes.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "title": "可操作区域、接触目标与动作参数"}]}, {"id": "2406.09246", "title": "OpenVLA: An Open-Source Vision-Language-Action Model", "label": "OpenVLA", "year": "2024", "date": "2024-06", "group": "VLA 模型基础", "platform": "固定臂操作／通用模型", "problem": "操作策略依赖单任务／单机器人的数据，视觉语言模型又不能直接输出可执行动作。", "method": "在预训练视觉语言骨干上用Open X-Embodiment的大量机器人轨迹训练动作预测，公开模型权重／代码与适配流程。动作token化是其接口特点，未解决四足足接触调度。", "interface": "输入图像和语言指令，输出离散化后的机器人动作token；微调后适配不同机械臂。", "improvement": "", "experiment": "【多机器人实机操作】原论文跨多个操纵平台评测新指令及适配；不是四足＋臂边走边接触实验。", "limit": "本库WholeBodyVLA主要把OpenVLA-OFT作为改造后的基线；背景引用不表示采用原OpenVLA架构。", "url": "https://arxiv.org/abs/2406.09246", "pdf": "papers/2406.09246_OpenVLA_An_Open-Source_Vision-Language-Action_Model.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2410.24164", "title": "π0: A Vision-Language-Action Flow Model for General Robot Control", "label": "π0", "year": "2024", "date": "2024-10", "group": "VLA 模型基础", "platform": "多形态机械臂／移动机械臂", "problem": "跨任务机器人策略要同时接受语义指令与连续、高维、可能多峰的低层动作。", "method": "在视觉语言骨干旁训练连续动作专家，用flow matching预测动作块，并用机器人数据训练／微调跨形态控制。", "interface": "图像、语言和本体状态条件化未来连续动作块；流匹配模块生成动作，而非逐token输出关节命令。", "improvement": "", "experiment": "【多平台真机操作】包括单臂、双臂和移动机械臂任务，原作报告折衣等跨任务操作；RSS 2025。需按任务查看每个成功率，不能把泛化概括成四足能力。", "limit": "本库若干2026全身VLA只引用π0作模型背景；当前未证实直接采用原论文权重或流动作头。", "url": "https://arxiv.org/abs/2410.24164", "pdf": "papers/2410.24164_Pi0_A_Vision-Language-Action_Flow_Model_for_General_Robot_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2103.00020", "title": "Learning Transferable Visual Models From Natural Language Supervision", "label": "CLIP", "year": "2021", "date": "2021-03", "group": "视觉语言方法基础", "platform": "通用视觉语言模型", "problem": "封闭标签的视觉分类器难根据自由文本寻找新物体／语义区域。", "method": "以大量图文对做对比学习，将匹配的图像文本向量拉近、非匹配样本分开；下游以文本查询视觉内容。", "interface": "分别编码图像与文本，用共同向量空间中的相似度关联两者；不直接输出接触位姿、力或关节动作。", "improvement": "", "experiment": "【视觉基准】零样本图像识别等；原作不做四足操作实机。ICML 2021。", "limit": "语义相似度不等于可抓取性、可达性或接触稳定性。", "url": "https://arxiv.org/abs/2103.00020", "pdf": "papers/2103.00020_Learning_Transferable_Visual_Models_From_Natural_Language_Supervision.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K40", "title": "视觉表示要丢掉什么、保留什么"}]}, {"id": "1710.06542", "title": "Asymmetric Actor Critic for Image-Based Robot Learning", "label": "Asymmetric Actor-Critic", "year": "2017", "date": "2017-10", "group": "RL 训练基础", "platform": "通用方法／机械臂", "problem": "仿真训练能知道完整状态，但真实策略部署时只有图像等局部观测；让策略在训练时依赖完整状态会造成部署信息落差。", "method": "让价值函数利用仿真真值降低强化学习的价值估计难度，同时限制actor仅用真实可获得的观察；再配域随机化缩小视觉和动力学差距。它改变训练信息分配，不决定任务奖励或全身动作接口。", "interface": "训练时actor读取部署可得的RGB-D观察，critic读取仿真的完整状态；只有actor用于真机动作生成。", "improvement": "", "experiment": "【仿真＋机械臂真机】多类模拟任务与实机抓取、推物、移动方块；RSS 2018，没有四足操作。", "limit": "特权critic不能直接部署；仿真真值若与现实偏差太大也未必帮得上忙。", "url": "https://arxiv.org/abs/1710.06542", "pdf": "papers/1710.06542_Asymmetric_Actor_Critic_for_Image-Based_Robot_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "特权训练、历史估计与视觉学生"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}]}, {"id": "2212.06817", "title": "RT-1: Robotics Transformer for Real-World Control at Scale", "label": "RT-1", "year": "2022", "date": "2022-12", "group": "VLA 模型基础", "platform": "固定／移动机械臂数据", "problem": "机器人技能数据分散，单任务小模型难同时保持多任务覆盖和训练规模效益。", "method": "以真实机器人多任务数据训练Robotics Transformer，用token化视觉及动作表示和高容量序列模型吸收任务多样性；研究数据量、模型容量与泛化关系。", "interface": "图像历史与语言任务进入Transformer，输出离散化的低层动作token。", "improvement": "", "experiment": "【真实机器人】Google机械臂平台的多任务执行与未见场景泛化；RSS 2023。", "limit": "原作重点是大规模真实机器人控制，并未直接学习四足足接触或底盘—手臂接触补偿。", "url": "https://arxiv.org/abs/2212.06817", "pdf": "papers/2212.06817_RT-1_Robotics_Transformer_for_Real-World_Control_at_Scale.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2307.15818", "title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "label": "RT-2", "year": "2023", "date": "2023-07", "group": "VLA 模型基础", "platform": "固定／移动机械臂数据", "problem": "机器人轨迹数据量有限，传统动作策略不易利用互联网视觉语言知识识别未见对象和指令。", "method": "把机器人动作表示成与语言token兼容的序列，将机器人轨迹和互联网视觉问答等任务共同微调预训练视觉语言模型；此处明确提出VLA范式。", "interface": "输入相机图像和语言指令；将机器人动作编码为文本形式token，由视觉语言模型联合预测。", "improvement": "", "experiment": "【真实机器人】约6000次评价试验，检验未见物体与语义指令；CoRL 2023。实验不含四足边走边操作。", "limit": "网络知识有助于语义泛化，不直接约束动作可达性、接触力或足支撑安全。", "url": "https://arxiv.org/abs/2307.15818", "pdf": "papers/2307.15818_RT-2_Vision-Language-Action_Models_Transfer_Web_Knowledge_to_Robotic_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}]}, {"id": "2310.08864", "title": "Open X-Embodiment: Robotic Learning Datasets and RT-X Models", "label": "Open X-Embodiment", "year": "2023", "date": "2023-10", "group": "VLA 模型基础", "platform": "跨机器人数据／模型", "problem": "每个机器人单独采集、训练策略限制了跨形态知识迁移；异构轨迹格式也妨碍合并训练。", "method": "21机构汇集22种机器人数据，统一格式并用RT-X模型测试跨机器人训练的正迁移；贡献同时在数据整理和跨本体预训练，不是一个单一的底盘控制器。", "interface": "统一多机构机器人轨迹的观察、动作和任务信息，训练RT-X跨机器人策略供下游适配。", "improvement": "", "experiment": "【多真实机器人数据和评估】论文报告527种技能及跨机器人测试；ICRA 2024。具体机器人与任务分布不等同于四足移动操作覆盖。", "limit": "多机器人数据集有明显平台与任务偏差；把新四足平台加入后仍需接口适配和实机验证。", "url": "https://arxiv.org/abs/2310.08864", "pdf": "papers/2310.08864_Open_X-Embodiment_Robotic_Learning_Datasets_and_RT-X_Models.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}]}, {"id": "2405.12213", "title": "Octo: An Open-Source Generalist Robot Policy", "label": "Octo", "year": "2024", "date": "2024-05", "group": "VLA 模型基础", "platform": "跨机器人策略", "problem": "大规模机器人策略若绑定固定相机、任务格式和动作维数，很难低成本迁移到新设备。", "method": "在Open X-Embodiment约800k轨迹上预训练开源Transformer策略，按新相机、动作空间与任务条件微调；重点验证通用初始化和接口可扩展性。", "interface": "接受语言或目标图像条件及不同观察token，输出可适配目标机器人的动作序列。", "improvement": "", "experiment": "【九种机器人平台实机适配】比较少量新域数据微调与模型设计消融；RSS 2024。不是四足全身控制实验。", "limit": "跨平台动作适配与身体动力学稳定是不同问题；本库引用多数为背景，未核到四足＋臂论文直接使用Octo权重。", "url": "https://arxiv.org/abs/2405.12213", "pdf": "papers/2405.12213_Octo_An_Open-Source_Generalist_Robot_Policy.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}]}, {"id": "2503.13446", "title": "MoManipVLA: Transferring Vision-Language-Action Models for General Mobile Manipulation", "label": "MoManipVLA", "year": "2025", "date": "2025-03", "group": "VLA 动作模型", "platform": "轮式＋臂", "problem": "固定底座 VLA 预测的手端路径点移到移动平台后可能不可达、碰撞或使机械臂靠近关节极限；希望沿用预训练模型的视觉语言能力，而由执行层处理底盘站位。", "method": "上层优化选择底盘路径点，为手端目标留出可操作空间；下层在连续末端路径点之间选择臂轨迹。目标函数检查逆运动学可达性、关节和底盘轨迹平滑性、碰撞；臂关节用 Pinocchio IK 求解。先有独立导航／注视模块把平台带到目标附近，再执行该移动操作规划。", "interface": "输入图像、语言和当前移动平台状态；OpenVLA 预测末端路径点。后续规划同时输出轮式底盘移动路径和机械臂轨迹；VLA 本身不直接输出底盘速度。", "improvement": "展示「高层只给手端意图，执行层再分配底盘和臂」可以接 VLA；与 UMI on Legs 的 RL 全身跟踪器并行，不能因为接口相似就说它移植了 UMI 的控制器。", "experiment": "OVMM 仿真整体成功率 15.8%，表中最佳对照 11.6%（高 4.2 个百分点）。Hexman Echo Plus 轮式底盘＋RM65 臂真机 Stack Block 3/10、Open Drawer 1/10、Put in Bowl 4/10；实机适配使用 50 条专家示范。", "limit": "移动底盘不是四足，执行器是轨迹优化而非 RL WBC；真机样本和成功率都不足以推断复杂接触任务已可靠解决。论文没有同硬件比较「只给手端」与「显式给底盘命令」。", "url": "https://arxiv.org/abs/2503.13446", "pdf": "papers/2503.13446_MoManipVLA_Transferring_Vision-Language-Action_Models_for_General_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K12", "title": "运动学可达、动力学可行与策略能力"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}]}, {"id": "2609.22829", "title": "Whole-Body UMI: Transferring UMI Manipulation Skills to Humanoid Whole-Body Manipulation via Real-Time Motion Generation", "label": "Whole-Body UMI", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "人形", "problem": "单条手端轨迹通常对应多种身体姿态、落脚位置和步态，仅做末端跟踪可能达标却产生不自然或不稳的全身动作。UMI 人手示范没有机器人身体与足轨迹，不能直接监督这些变量。", "method": "用人体动作捕捉学习自回归的条件全身生成器，并在生成时看手端轨迹的未来窗口；生成的全身参考交由 WBC 跟踪。与直接从手端目标求一个局部逆运动学解相比，增加了数据驱动的身体和足运动先验。", "interface": "视觉 Diffusion Policy 给未来手端轨迹；全身运动生成器利用手端目标和已有全身运动先验补足身体、足与关节参考；全身跟踪器执行。高层仍只输出手端轨迹，并未给底盘速度或把 VLA 接入。", "improvement": "保留 UMI on Legs 的操作策略／执行器分层思想，专门处理末端目标欠约束的身体动作；证明「只给末端」也能在下游增加全身决策能力，而不是必须扩大 VLA 动作维度。", "experiment": "G1 真机四任务各 10 次：关抽屉 9/10、架上取放 8/10、投球 3/10、移动取放 4/10；另比较有无手端预览和提供真值身体／足参考的 oracle 条件，并评估动作重建、足滑与末端误差。", "limit": "全身运动质量依赖人形 mocap 先验；真机高动态和移动取放成功率较低。不能把人形实验直接外推到四足＋轻臂，也不能称其为 VLA 验证。", "url": "https://arxiv.org/abs/2609.22829", "pdf": "papers/2609.22829_Whole-Body_UMI_Transferring_UMI_Manipulation_Skills_to_Humanoid_Whole-Body_Manipulation_via_Real-Time_Motion_Generation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "冗余运动：同一个手端目标不只一个全身姿态"}, {"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K20", "title": "未来末端轨迹预览与时间一致性"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}]}, {"id": "2610.32271", "title": "From Tabletop to Walking Bot: Deploying a VLA Model on a Legged Manipulator Robot", "label": "Walking Bot VLA", "year": "2026", "date": "2026-10", "group": "VLA 动作模型", "platform": "四足＋臂", "problem": "固定臂 VLA 的动作空间没有底盘移动和身体俯仰；部署到四足时要决定这些动作由模型还是既有控制器负责，并让示教标签和执行命令一致。", "method": "同一操作者用领从臂和手持控制器同时示教底盘、姿态、机械臂与夹爪。采集和部署都经过同一机器人侧命令接口，使动作标签直接对应部署量。微调 MolmoAct2 家族的视觉语言骨干和动作头；采用十步动作块，臂作为连续轨迹执行，底盘以较高频线程维持命令。", "interface": "VLA 输出 11 维命令：机体坐标底盘速度 vx、vy、yaw 速度、身体 pitch、六个臂关节绝对角目标及夹爪开合。臂感知的 BinWalker 衍生 RL 行走控制器执行底盘命令，关节轨迹控制器执行臂命令；不是 VLA 只给末端轨迹的接口。", "improvement": "提出与 UMI on Legs 不同的分工：高层明确决定底盘运动，低层主要保证行走执行。文章没有直接测试两种接口何者更准确或更省数据。", "experiment": "Go2＋Piper 真机给出抓取搬运和推物定性片段，**没有真机成功率表**。131、233、258 条示教的离线留出集上，抓取动作预测的末端误差为 68.7、48.2、47.8 mm；这是根据预测关节前向运动学计算的离线误差，不是真机闭环跟踪误差。", "limit": "短篇初步结果，任务和示教范围有限；无法据此认定显式速度输出优于末端轨迹输出，也不能证明持续接触时的精度与安全性。", "url": "https://arxiv.org/abs/2610.32271", "pdf": "papers/2610.32271_From_Tabletop_to_Walking_Bot_Deploying_a_VLA_Model_on_a_Legged_Manipulator_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "分层接口把学习任务限制在某个动作空间"}, {"id": "K26", "title": "语言规划、技能选择与 VLA 动作生成"}, {"id": "K27", "title": "动作块、重规划与平滑的精度—效率取舍"}, {"id": "K28", "title": "示范迁移必须处理坐标、形态与动作差异"}, {"id": "K47", "title": "高层只给手端目标，还是同时指定身体动作？"}]}, {"id": "2610.28480", "title": "SuperMimic: Scaling Humanoid Whole-Body Control with One Differentiable World Model", "label": "SuperMimic", "year": "2026", "date": "2026-10", "group": "RL 训练基础", "platform": "人形（移动操作邻接训练方法）", "problem": "大型人形动作库中的不同参考动作共享同一机器人动力学，逐段训练专门策略再蒸馏，或用 PPO 在仿真中对所有动作反复采样，都很耗算力。作者研究能否用一套共享的动力学模型加速全身跟踪策略训练，而不是设计新的视觉任务策略。", "method": "每轮先由当前策略在 MuJoCo Warp 采集状态转移，存进 replay buffer；以记录动作作八步自回归训练，拟合共享的可微状态转移模型，并计算／拟合观测、奖励与终止。再从真实仿真轨迹的状态起步，在冻结的模型中想象 32 步，通过模型对动作和状态的导数反向传播更新策略；critic 估计 32 步之后的回报，避免短视。模型每轮随新数据更新。它不要求物理仿真器本身可微，也不在推理时对世界模型求解 MPC。", "interface": "训练时，策略看最近 10 帧关节角／速度、IMU 角速度、重力方向和上一步动作，以及未来 10 帧参考动作；输出归一化关节位置设定值，经低增益 PD 形成力矩。世界模型还看仿真状态、动作和随机化参数，用于**训练时**预测；真机部署运行跟踪策略，不运行在线世界模型规划器。文中只实测了完整动作参考和速度命令两类接口；手端位姿等在附录中作为可扩展接口举例，尚未报告实测。", "improvement": "主要承接作者此前 BeyondMimic 的动作跟踪问题和奖励形式，比较 SONIC 的大规模 PPO；此前 ControlVAE、SuperTrack、SuperDyno 等已用过学习的可微动力学，故创新不能概括为“首次用世界模型训练全身控制”。本文把单模型训练扩大到大规模人形动作集，展示模型梯度的算力收益与 G1 真机迁移，并初测任务专用速度接口。与 UMI on Legs 的区别是**训练优化器 vs. 高层手端轨迹—全身执行接口**，二者可组合，但本文没有这样做。", "experiment": "【仿真＋G1 真机】共享的 129,514 条 BONES-SEED **训练动作**上，单 H100 训练 3 h 后失败 25 条；双 H100 训练 9.8 h 后失败 0 条；SONIC 公开权重失败 179 条。单 H100 约 3 h 超过 SONIC 公开权重的归一化回报；后者报告 128 张 L40 训练约 168 h。较公平的 LAFAN1 40 条动作控制对照中，SuperMimic 单卡约 1.2 h 达到评估回报 0.82，PPO-Sim 在 18 h／至多 8 卡预算内未达到；PPO-on-world-model 对照支持模型梯度收益，critic／短时域消融支持扰动恢复。真机仅展示跳跃、侧滚和翻转；另有仿真速度阶跃测试，RL 速度编码器在 672 种命令中 650 种稳态误差较小。", "limit": "训练动作覆盖率不等于未见任务泛化率；SONIC 对照的训练数据量、GPU 型号和动作设定不同，论文另做了较小规模受控 PPO 对照。论文主动过滤涉及楼梯、箱子、椅子等物体／地形接触的动作，作者在 §6 明确称“无地形或物体交互”。因此**既未证明四足／轮足动力学可照搬，也未证明按钮、旋钮、柜门任务的接触精度或安全**。训练模型只用仿真数据；对硬接触峰值的预测、模型利用错误和真实机构反作用力还需另测。", "url": "https://arxiv.org/abs/2610.28480", "pdf": "papers/2610.28480_SuperMimic_Scaling_Humanoid_Whole-Body_Control_with_One_Differentiable_World_Model.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "域随机化、模型校准与在线补偿"}, {"id": "K43", "title": "策略、回报、评价网络与信用分配"}, {"id": "K48", "title": "可微动力学代理用于训练全身跟踪策略"}]}, {"id": "survey-contact", "title": "A Survey of Robot Manipulation in Contact", "year": "2021", "date": "2021-12", "group": "综述", "platform": "跨平台", "problem": "把持续接触任务中的力控制、阻抗、导纳、状态表示与学习方法分开。", "method": "按接触任务、执行控制、接触表示以及学习／规划组织。", "interface": "", "improvement": "用于明确接触力与末端位置误差不是同一指标。", "experiment": "综述，不提供新的四足真机实验。", "limit": "不覆盖四足移动稳定性与足端接触分配。", "url": "https://doi.org/10.1016/j.robot.2022.104224", "pdf": "papers/2112.01942_A_Survey_of_Robot_Manipulation_in_Contact.pdf", "notes": "literature/surveys.md", "label": "接触操作综述", "knowledge": [{"id": "K08", "title": "柔顺控制规定受力后怎样运动"}]}, {"id": "survey-legged", "title": "Legged Robots for Object Manipulation: A Review", "year": "2023", "date": "2023-03", "group": "综述", "platform": "跨平台", "problem": "区分腿式机器人到底用身体、行走腿、专用臂还是多机器人协作来移动物体。", "method": "按物体交互形式和机器人形态组织已有工作，并比较被操作物体与机器人的尺寸关系。", "interface": "", "improvement": "用于防止把足端、无臂推物和背载臂实验直接并列。", "experiment": "综述，不提供新的四足真机算法实验。", "limit": "发表于 2023 年，缺少大量 2024–2026 工作。", "url": "https://doi.org/10.3389/fmech.2023.1142421", "pdf": "papers/2303.16865_Legged_Robots_for_Object_Manipulation_A_Review.pdf", "notes": "literature/surveys.md", "label": "腿式操作综述", "knowledge": []}, {"id": "survey-tamp", "title": "A Survey of Optimization-Based Task and Motion Planning", "year": "2024", "date": "2024-04", "group": tion With Quadruped Robots: Modeling, Task Taxonomy, and Control Methods—A Critical Review", "year": "2026", "date": "2026", "group": "综述", "platform": "四足＋臂", "problem": "在四足任务中对应建模假设、任务条件和 WBC/MPC/RL/IL 控制方法。", "method": "全文按建模、任务分类和控制方法组织，讨论 WBC、MPC、RL/IL 及混合阻抗／力控制，并考虑地形、载荷、接触和感知延迟。", "interface": "", "improvement": "用于四足任务组合的漏检检查。", "experiment": "综述，不提供新的控制器实验；全文和参考文献已可本地核查。", "limit": "新发表论文引用积累很少；具体性能比较应回原论文验证任务和实验条件。", "url": "https://doi.org/10.1109/ACCESS.2026.3672605", "pdf": "papers/IEEE_Access_2026_Loco-Manipulation_With_Quadruped_Robots_Critical_Review.pdf", "notes": "literature/surveys.md", "label": "四足移动操作综述", "knowledge": []}, {"id": "survey-affordance", "title": "From Passive Perception to Active Interaction: A Survey of Affordance Learning for Embodied AI", "year": "2026", "date": "2026-10", "group": "综述", "platform": "跨平台", "problem": "怎样从视觉场景找出可交互位置，结合任务与机器人状态选定目标，再把目标交给可执行动作。", "method": "全文以 affordance 感知、任务相关推理、指导动作为三段；把预测结果分成动作类型、目标区域和可选执行参数，再比较交给规划器／技能与融入策略输入、隐式特征或奖励的不同接口。", "interface": "输入可为图像、语言与交互上下文；输出可为动作类型、接触区域、姿态、方向或接触后轨迹。综述没有统一运行时控制器。", "improvement": "为移动操作的目标选择与动作接口提供分类，提出比较显式／隐式信息、闭环更新和实机评测的待验证问题。", "experiment": "35 页预印本综述，已核对全文和参考文献；没有新的四足真机实验。", "limit": "Preprints.org 2026-10-07，尚未查到同行评审正式版；方法表主要是夹爪、灵巧手和双臂，不提供四足移动操作性能对照。", "url": "https://doi.org/10.20944/preprints202610.0392.v1", "pdf": "papers/Preprints_202610.0392_v1_From_Passive_Perception_to_Active_Interaction_A_Survey_of_Affordance_Learning_for_Embodied_AI.pdf", "notes": "literature/surveys.md", "label": "可操作性综述（预印本）", "knowledge": [{"id": "K22", "title": "可操作区域、接触目标与动作参数"}, {"id": "K30", "title": "执行过、完成了与记忆可观测性"}]}], "edges": [["2308.09179", "2410.13817", "原文承接", "Guided RL 明确使用前作多接触规划生成的示范训练反馈执行。"], ["2407.10353", "2604.07457", "原文承接", "CMP 使用 UMI on Legs 的数据／训练设置，并对超出能力的目标做投影。"], ["2407.10353", "2503.13446", "问题比较", "两者都让高层给末端意图、执行层分配身体运动；MoManipVLA 是轮式 VLA＋轨迹优化，UMI on Legs 是四足视觉扩散策略＋RL 全身跟踪，并无已核实的算法继承。"], ["2407.10353", "2609.22829", "问题比较", "Whole-Body UMI 保留手端轨迹 <script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const nodes=data.papers, byId=new Map(nodes.map(n=>[n.id,n]));
const svg=document.getElementById('graph'), shell=document.getElementById('graph-shell');

const NS='http://www.w3.org/2000/svg';
const groups=['行走方法基础','模型控制方法基础','RL 训练基础','示范学习基础','移动示范方法基础','视觉抓取方法基础','视觉语言方法基础','VLA 模型基础','模型规划／显式控制','RL／全身执行','示范／视觉／VLM','VLA 动作模型','形态／系统','综述'];

const colors={'行走方法基础':'#8a784e','模型控制方法基础':'#805d91','RL 训练基础':'#678698','示范学习基础':'#387a6e','移动示范方法基础':'#387a6e','视觉抓取方法基础':'#669481','视觉语言方法基础':'#a47555','VLA 模型基础':'#b0714e','模型规划／显式控制':'#805d91','RL／全身执行':'#36728d','示范／视觉／VLM':'#387a6e','VLA 动作模型':'#b0714e','形态／系统':'#837859','综述':'#516977'};
const shortGroup={'行走方法基础':'行走基础','模型控制方法基础':'模型基础','RL 训练基础':'RL基础','示范学习基础':'示范基础','移动示范方法基础':'移动示范','视觉抓取方法基础':'抓取基础','视觉语言方法基础':'视觉语言基础','VLA 模型基础':'VLA基础','模型规划／显式控制':'模型／规划','RL／全身执行':'RL／全身','示范／视觉／VLM':'示范／视觉','VLA 动作模型':'VLA','形态／系统':'形态／系统','综述':'综述'};
const edgeStyle={'原文承接':{color:'#336e79',dash:'',width:2.3},'背景引用':{color:'#c2b79e',dash:'4 7',width:1.3},'问题比较':{color:'#9aabb2',dash:'6 5',width:1.5},'同作者群':{color:'#807894',dash:'2 5',width:1.8},'综述收录':{color:'#b3bec2',dash:'2 5',width:1.4}};
const W=186,H=66;
let selected=null, view={x:0,y:0,s:1}, positions=new Map(), nodeEls=new Map(), edgeEls=[], worldWidth=1800, worldHeight=900, world=null, visibleIds=new Set(), pinned=new Set(), pan=null;
function html(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function svgEl(tag,attrs,content){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(content!==undefined)e.textContent=content;return e}
function match(n,q){return [n.title,n.label,n.id,n.problem,n.method,n.experiment,n.platform].join(' ').toLocaleLowerCase().includes(q)}
function visibleNodes(){
 const q=document.getElementById('search').value.trim().toLocaleLowerCase();
 const group=document.getElementById('group').value,platform=document.getElementById('platform').value;
 const surveys=document.getElementById('surveys').checked;
 return nodes.filter(n=>pinned.has(n.id)||((n.group!=='综述'||surveys||group==='综述')&&(!group||n.group===group)&&(!platform||n.platform===platform)&&(!q||match(n,q))));
}
function timeX(n){const yr=Number(n.date.slice(0,4)),mo=Number(n.date.slice(5,7))||6;return yr<=2017?90+(yr-2010)*36:350+(yr-2017)*170+(mo-1)*13}
function layout(list){
 positions=new Map();const bands=[];
 if(list.length<=5){const sorted=list.slice().sort((a,b)=>a.date.localeCompare(b.date));sorted.forEach((n,i)=>positions.set(n.id,{x:100+i*255,y:145}));worldWidth=Math.max(620,100+sorted.length*255);worldHeight=440;bands.push({name:'筛选结果',color:'#657c84',y:98,height:200});return {bands:bands,mode:'filtered'}}
 let y=80;
 for(const g of groups){
  const row=list.filter(n=>n.group===g).sort((a,b)=>a.date.localeCompare(b.date)||a.label.localeCompare(b.label));
  if(!row.length)continue;
  const ends=[];
  for(const n of row){
   const x=timeX(n);let track=ends.findIndex(end=>end+15<=x);
   if(track<0){track=ends.length;ends.push(0)}
   ends[track]=x+W;positions.set(n.id,{x:x,y:y+34+track*76});
  }
  const height=56+ends.length*76;bands.push({name:g,color:colors[g],y:y,height:height});y+=height+9;
 }
 worldWidth=Math.max(1790,...Array.from(positions.values(),p=>p.x+W+40));worldHeight=Math.max(420,y+35);
 return {bands:bands,mode:'timeline'};
}
function edgePath(e){
 const a=positions.get(e[0]),b=positions.get(e[1]);if(!a||!b)return '';
 const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;
 const sameRow=Math.abs(a.y-b.y)<8;
 const between=sameRow&&Array.from(positions.entries()).some(([id,p])=>id!==e[0]&&id!==e[1]&&Math.abs(p.y-a.y)<8&&p.x>a.x&&p.x<b.x);
 if(between){const sx=a.x+W/2,tx=b.x+W/2,top=Math.min(a.y,b.y)-35;return 'M '+sx+' '+a.y+' C '+sx+' '+top+' '+tx+' '+top+' '+tx+' '+b.y}
 if(x2>x1+45)return 'M '+x1+' '+y1+' C '+(x1+Math.min(110,(x2-x1)/2))+' '+y1+' '+(x2-Math.min(110,(x2-x1)/2))+' '+y2+' '+x2+' '+y2;
 const sx=a.x+W/2,sy=a.y+H,tx=b.x+W/2,ty=b.y;
 return 'M '+sx+' '+sy+' C '+sx+' '+(sy+55)+' '+tx+' '+(ty-55)+' '+tx+' '+ty;
}
function applyView(){if(world)world.setAttribute('transform','translate('+view.x+' '+view.y+') scale('+view.s+')')}
function minimumZoom(){return Math.min(.05,Math.max(1,shell.clientWidth-72)/worldWidth/4,Math.max(1,shell.clientHeight-72)/worldHeight/4)}
function fit(){
 const vw=shell.clientWidth,vh=shell.clientHeight,pad=36;
 const ideal=Math.min((vw-pad*2)/worldWidth,(vh-pad*2)/worldHeight,1.25);
 view.s=Math.max(minimumZoom(),ideal);view.x=(vw-worldWidth*view.s)/2;view.y=(vh-worldHeight*view.s)/2;applyView();
}
function zoom(factor,px,py){
 const rect=svg.getBoundingClientRect();px=px===undefined?rect.width/2:px;py=py===undefined?rect.height/2:py;
 const wx=(px-view.x)/view.s,wy=(py-view.y)/view.s;
 view.s=Math.max(minimumZoom(),Math.min(2.6,view.s*factor));view.x=px-wx*view.s;view.y=py-wy*view.s;applyView();
}
function focus(id){
 const p=positions.get(id);if(!p)return;
 const reserved=drawer.classList.contains('open')?Math.min(460,shell.clientWidth*.38):0;
 const tx=(shell.clientWidth-reserved)/2,ty=shell.clientHeight/2;
 view.x=tx-(p.x+W/2)*view.s;view.y=ty-(p.y+H/2)*view.s;applyView();
}
function updateHighlights(){
 const related=new Set(data.edges.filter(e=>e[0]===selected||e[1]===selected).flatMap(e=>[e[0],e[1]]));
 for(const [id,g] of nodeEls){const active=!selected||id===selected||related.has(id);g.setAttribute('opacity',active?1:.35);const r=g.querySelector('rect');r.setAttribute('stroke-width',id===selected?3:1.4)}
 for(const item of edgeEls){const e=item.edge,active=!selected||e[0]===selected||e[1]===selected;item.line.setAttribute('opacity',active?(e[2]==='原文承接'?.92:.75):.16)}
}
function draw(){
 const list=visibleNodes(),result=layout(list),bands=result.bands;visibleIds=new Set(list.map(n=>n.id));
 const selectedType=document.getElementById('edge-type').value;
 const edges=data.edges.filter(e=>visibleIds.has(e[0])&&visibleIds.has(e[1])&&(!selectedType||e[2]===selectedType));
 document.getElementById('count').textContent=list.length+' / '+nodes.length+' 项 · '+edges.length+' 条可见关系';
 svg.replaceChildren();const defs=svgEl('defs');
 const marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});
 marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#336e79'}));defs.append(marker);svg.append(defs);
 svg.setAttribute('viewBox','0 0 '+shell.clientWidth+' '+shell.clientHeight);
 world=svgEl('g',{id:'world'});svg.append(world);
 world.append(svgEl('rect',{x:0,y:0,width:worldWidth,height:worldHeight,fill:'#fff'}));
 if(result.mode==='timeline')for(let year=2021;year<=2026;year++){const x=timeX({date:String(year)+'-01'});world.append(svgEl('line',{x1:x,y1:43,x2:x,y2:worldHeight-15,stroke:'#e8eef0','stroke-width':1}));world.append(svgEl('text',{x:x+6,y:30,fill:'#617780','font-size':14,'font-weight':600},String(year)))}
 else world.append(svgEl('text',{x:24,y:39,fill:'#6a7f87','font-size':13},'筛选结果按首次公开时间排列。'));
 for(const b of bands){world.append(svgEl('rect',{x:12,y:b.y,width:worldWidth-24,height:b.height,rx:6,fill:b.color,'fill-opacity':.045}));world.append(svgEl('text',{x:23,y:b.y+25,fill:b.color,'font-size':13,'font-weight':650},b.name))}
 const eg=svgEl('g');world.append(eg);edgeEls=[];
 for(const e of edges){const style=edgeStyle[e[2]],path=edgePath(e);const hit=svgEl('path',{d:path,fill:'none',stroke:'transparent','stroke-width':16,class:'edge-hit'});const line=svgEl('path',{d:path,fill:'none',stroke:style.color,'stroke-width':style.width,'stroke-dasharray':style.dash,'marker-end':e[2]==='原文承接'?'url(#arrow)':'','pointer-events':'none'});hit.append(svgEl('title',{},e[2]+'：'+e[3]));hit.addEventListener('click',event=>{event.stopPropagation();openRelation(e)});eg.append(hit,line);edgeEls.push({edge:e,hit:hit,line:line})}
 const ng=svgEl('g');world.append(ng);nodeEls=new Map();
 for(const n of list){const p=positions.get(n.id),g=svgEl('g',{class:'node',transform:'translate('+p.x+' '+p.y+')',tabindex:0,role:'button','aria-label':n.title,'data-node':n.id});
  g.append(svgEl('rect',{x:0,y:0,width:W,height:H,rx:6,fill:'#fff',stroke:colors[n.group],'stroke-width':1.4}));
  g.append(svgEl('rect',{x:0,y:0,width:5,height:H,rx:3,fill:colors[n.group]}));
  g.append(svgEl('text',{x:13,y:17,fill:colors[n.group],'font-size':11,'font-weight':650},shortGroup[n.group]));
  g.append(svgEl('text',{x:W-10,y:17,fill:'#73858c','font-size':10,'text-anchor':'end'},n.date));
  const label=n.label.length>25?n.label.slice(0,24)+'…':n.label;
  g.append(svgEl('text',{x:13,y:37,fill:'#192f38','font-size':13,'font-weight':650},label));
  g.append(svgEl('text',{x:13,y:55,fill:'#647780','font-size':10},n.platform));
  g.append(svgEl('title',{},n.title+'\n'+n.problem));
  g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openNode(n.id)}});
  let drag=null;
  g.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();event.stopPropagation();g.setPointerCapture(event.pointerId);drag={x:event.clientX,y:event.clientY,ox:p.x,oy:p.y,moved:false}});
  g.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;p.x=drag.ox+dx/view.s;p.y=drag.oy+dy/view.s;g.setAttribute('transform','translate('+p.x+' '+p.y+')');for(const item of edgeEls)if(item.edge[0]===n.id||item.edge[1]===n.id){const d=edgePath(item.edge);item.hit.setAttribute('d',d);item.line.setAttribute('d',d)}});
  g.addEventListener('pointerup',event=>{if(!drag)return;const moved=drag.moved;drag=null;g.releasePointerCapture(event.pointerId);if(!moved)openNode(n.id)});
  g.addEventListener('pointercancel',()=>{drag=null});
  ng.append(g);nodeEls.set(n.id,g)
 }
 if(!list.length)world.append(svgEl('text',{x:140,y:170,fill:'#6d7e85','font-size':18},'没有匹配的论文。'));
 fit();updateHighlights();
}
function fact(label,value){if(!value)return null;const d=html('div','fact');d.append(html('h3','',label),html('p','',value));return d}
function showDrawer(kind){document.getElementById('drawer-kicker').textContent=kind;drawer.style.setProperty('--accent',kind==='关系说明'?'#336e79':colors[byId.get(selected)?.group]||'#516977');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');document.getElementById('backdrop').classList.add('open')}
function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.getElementById('backdrop').classList.remove('open')}
function linkButton(id){const n=byId.get(id),b=html('button','',n.label+' · '+n.date);b.type='button';b.addEventListener('click',()=>openNode(id));return b}
function openNode(id){
 if(!byId.has(id))return;pinned.add(id);if(!visibleIds.has(id))draw();selected=id;updateHighlights();
 history.replaceState(null,'','#paper='+encodeURIComponent(id));
 const n=byId.get(id);drawerContent.replaceChildren();showDrawer(n.group);
 drawerContent.append(html('h2','',n.title),html('p','meta',n.platform+' · 首次公开 '+n.date));
 if(n.importance){drawerContent.append(fact('承接证据范围',n.importance.evidence));if(n.importance.downstream.length)drawerContent.append(fact('已核实的直接下游',n.importance.downstream.map(u=>byId.get(u.id).label+'：'+u.detail).join('；')))}
 const links=html('div','links');
 for(const item of [['期刊／原文',n.url],['本地 PDF',n.pdf],['文字卡片',n.notes]]){if(!item[1])continue;const a=html('a','',item[0]);a.href=item[1];if(item[1].startsWith('http')){a.target='_blank';a.rel='noopener noreferrer'}links.append(a)}drawerContent.append(links);
 for(const pair of [['研究问题',n.problem],['运行接口',n.interface],['方法',n.method],['相较同类方法',n.improvement],['实验与证据',n.experiment],['边界',n.limit]]){const f=fact(pair[0],pair[1]);if(f)drawerContent.append(f)}
 if(n.knowledge?.length){drawerContent.append(html('h3','related-title','机制、问题比较与来源用途'));const row=html('div','links');for(const k of n.knowledge){const a=html('a','',k.id+' '+k.title);a.href='knowledge-network.html#view=graph&concept='+k.id;row.append(a)}drawerContent.append(row)}
 const rr=data.edges.filter(e=>e[0]===id||e[1]===id);
 if(rr.length){drawerContent.append(html('h3','related-title','相关工作'));for(const e of rr){const d=html('div','related-item');d.append(linkButton(e[0]===id?e[1]:e[0]),html('small','',e[2]+'：'+e[3]));drawerContent.append(d)}}
 focus(id);
}
function openRelation(e){
 selected=null;updateHighlights();drawerContent.replaceChildren();showDrawer('关系说明');
 const a=byId.get(e[0]),b=byId.get(e[1]);
 drawerContent.append(html('h2','',e[2]),html('p','',e[3]));
 const d=html('div','related-item');d.append(html('p','meta','起点'),linkButton(a.id),html('p','meta','终点'),linkButton(b.id));drawerContent.append(d);
 if(e[2]!=='原文承接')drawerContent.append(html('p','meta',e[2]==='背景引用'?'仅作为背景引用；尚无本文方法被直接复用的证据。':'这条线用于比较或标注收录关系，不表示算法直接继承。'));
}
function reset(){document.getElementById('search').value='';document.getElementById('group').value='';document.getElementById('platform').value='';document.getElementById('edge-type').value='';document.getElementById('surveys').checked=true;pinned.clear();selected=null;closeDrawer();draw()}
for(const g of groups){const o=html('option','',g);o.value=g;document.getElementById('group').append(o)}
for(const p of platforms){const o=html('option','',p);o.value=p;document.getElementById('platform').append(o)}
for(const id of ['group','platform','edge-type','surveys'])document.getElementById(id).addEventListener('change',()=>{pinned.clear();selected=null;closeDrawer();draw()});
document.getElementById('search').addEventListener('input',()=>{pinned.clear();selected=null;closeDrawer();draw()});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('close').addEventListener('click',closeDrawer);
document.getElementById('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
document.getElementById('zoom-in').addEventListener('click',()=>zoom(1.2));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(1/1.2));
document.getElementById('fit').addEventListener('click',fit);
svg.addEventListener('wheel',event=>{event.preventDefault();const r=svg.getBoundingClientRect();zoom(event.deltaY<0?1.13:1/1.13,event.clientX-r.left,event.clientY-r.top)},{passive:false});
svg.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();if(event.target.closest('.node')||event.target.closest('.edge-hit'))return;svg.setPointerCapture(event.pointerId);pan={x:event.clientX,y:event.clientY,ox:view.x,oy:view.y};svg.classList.add('dragging')});
svg.addEventListener('pointermove',event=>{if(!pan)return;view.x=pan.ox+event.clientX-pan.x;view.y=pan.oy+event.clientY-pan.y;applyView()});
svg.addEventListener('pointerup',event=>{if(!pan)return;pan=null;svg.classList.remove('dragging');svg.releasePointerCapture(event.pointerId)});
svg.addEventListener('pointercancel',()=>{pan=null;svg.classList.remove('dragging')});
new ResizeObserver(()=>{svg.setAttribute('viewBox','0 0 '+shell.clientWidth+' '+shell.clientHeight);fit()}).observe(shell);
draw();
document.getElementById('english-link').addEventListener('click',event=>{event.currentTarget.href='literature-map-en.html'+location.hash});
function openHash(){const id=new URLSearchParams(location.hash.slice(1)).get('paper');if(id&&byId.has(id))openNode(id)}
window.addEventListener('hashchange',openHash);openHash();
</script>
</body>
