t, and then optimizes the chassis and arms; the latter four-legged VLA directly outputs the chassis speed, body pitch and arm joint targets. The two texts do not have the same platform action interface.", "重物抬不起来时，要推、拖或翻转；每换一种物体就重新训练完整任务策略，成本很高。": "When heavy objects cannot be lifted, they have to be pushed, dragged or turned over; the cost of retraining the complete task strategy every time a different object is changed is very high.", "接触条件": "Contact conditions", "示范基础": "Demo basics", "单／双手玩具、鞋、scoop 和 pour 六任务，ID 每条件24次、OOD12次；人预训练改善20–40条机器人示范的条件。41.9%／79.7% 为相对增益，不是成功率百分点差。对 HPT 还同时改变视觉微调，MXT-Agg 消融更能分离模块化收益。": "One/two-handed toys, shoes, scoop and pour Six tasks, ID 24 times per condition, OOD 12 times; human pre-training improves 20-40 conditions for robot demonstration. 41.9%/79.7% is a relative gain, not a percentage point difference in success rate. For HPT which also simultaneously changes visual fine-tuning, MXT-Agg ablation is more capable of isolating modular gains.", "如果高层慢、低层快，未来轨迹必须按时间戳一致地执行。预测轨迹被替换时，旧动作和新动作的连续性也要处理。UMI on Legs 的预览、视觉足端示范的后续点、MLM 缺少未来目标时的训练设计都属于这个接口问题，具体信息供给不同。": "If the high layer is slow and the low layer is fast, future trajectories must be executed consistently by timestamp. When the predicted trajectory is replaced, the continuity of the old action and the new action must also be handled. The preview of UMI on Legs, the follow-up points of the visual foot demonstration, and the training design when MLM lacks future goals all belong to this interface problem, and the specific information supply is different.", "Spot＋臂与 Unitree G1 均有真机；OptiTrack 观测物体／机器人，Spot 外部计算，G1 机载计算。": "Both the Spot+ arm and Unitree G1 have real robots; OptiTrack observes objects/robots, Spot external calculations, and G1 onboard calculations.", "都保留臂对身体的动力学影响；前者NMPC＋WBC，后者全身逆动力学路径约束MPC直接给轨迹／力矩。不是同硬件基线比较。": "Both retain the dynamic influence of the arm on the body; the former is NMPC+WBC, and the latter uses the whole body inverse dynamic path constraint MPC to directly give trajectory/moment. Not compared to hardware baseline.", "仿真中同时改变位置、力命令和外部扰动，依据准静态阻抗关系将净力转成目标位移补偿，再奖励控制器跟踪补偿后的目标。示教时记录估计力，把它与视觉／运动信息一起用于后续操作学习。": "In the simulation, the position, force command and external disturbance are changed simultaneously, and the net force is converted into target displacement compensation based on the quasi-static impedance relationship, and then the controller is rewarded for tracking the compensated target. The estimated force is recorded during teaching and used together with visual/motor information for subsequent operational learning.", "DeepWBC目标定义、PPO/PD/DR、concurrent state estimation": "DeepWBC target definition, PPO/PD/DR, concurrent state estimation", "Appendix E/Figure 10：原子任务规划 prompt": "Appendix E/Figure 10: Atomic mission planning prompt", "高速投掷不仅需要末端在释放时具有正确位置与速度，还要处理夹爪张开后物体究竟何时脱离的不确定性。单次准确跟踪目标时刻，不能保证整个可能释放窗口都能命中。": "High-speed throwing not only requires the end to have the correct position and speed when released, but also deals with the uncertainty of when the object will break away after the jaws are opened. Accurately tracking the target moment at a single time cannot guarantee that the entire possible release window can be hit.", "大规模机器人策略若绑定固定相机、任务格式和动作维数，很难低成本迁移到新设备。": "If a large-scale robot strategy is bound to fixed cameras, task formats and action dimensions, it is difficult to migrate to new devices at low cost.", "与姿态请求，腿策略根据请求输出腿动作。": "With pose requests, the leg strategy outputs leg movements based on the request.", "起点": "Source", "Unitree Aliengo＋自制单自由度臂；真机举起／搬运，门任务与快速起升在仿真中验证。": "Unitree Aliengo＋ self-made single degree of freedom arm; real robot lifting/carrying, door task and rapid lifting verified in simulation.", "动态优化扩增并蒸馏强参考教师，再微调规划。": "Dynamically optimize, amplify and distill strong reference teachers, and then fine-tune the plan.", "把控制结构、训练先验、视觉动作与执行调度接成可实现接口。": "Connect the control structure, training prior, visual action and execution scheduling into an implementable interface.", "四足轨迹驱动全身 RL": "Quadruped track driven whole body RL", "腿上小臂通过预定义 FSM 和动作库执行；VLM 选择语义目标／步骤，模块化验证特定形态。": "The upper and lower arms are executed through predefined FSM and action libraries; VLM selects semantic goals/steps and modularly verifies specific forms.", "本地 PDF 标题核对；主文完整，包括数据/控制接口、导航、AAM、ACT 损失、全部结果及讨论。": "Local PDF title check; main text is complete, including data/control interface, navigation, AAM, ACT loss, all results and discussion.", "方法／跨平台微调": "Method/Cross-platform fine-tuning", "是归一化统计量，": "is a normalized statistic,", "RAMBO修正执行加速度及关节参考；Guided RL修正参考与phase；Athletic在仿真中校准执行器；CAIMAN修正对象转移预测。前两类是部署时的闭环执行反馈，后两类修改仿真或预测模型。": "RAMBO corrects execution acceleration and joint reference; Guided RL corrects reference and phase; Athletic calibrates the actuator in simulation; CAIMAN corrects object transfer prediction. The first two categories are closed-loop execution feedback at deployment time, and the latter two categories modify simulation or predictive models.", "语义相似度不等于可抓取性、可达性或接触稳定性。": "Semantic similarity does not equal grabability, reachability, or contact stability.", "完整参考轨迹给出了可行起点，但机器人受到扰动后可能不在正确阶段；只按钟表推进会在未抓牢时继续拉动。": "The complete reference trajectory gives a feasible starting point, but the robot may not be in the correct stage after being perturbed; simply pushing by the clock will continue to pull without a good grip.", "要求的姿态、接触时序和足轨迹。原文辅助项为负、": "Required posture, contact timing and foot trajectory. The original auxiliary term is negative,", "论文关系": "Paper relationships", "形态／系统": "Robot / system", "任务层指定各肢体的操作／走路掩码，模型控制模块追踪操作肢体目标，RL 控制其余肢体保持移动与稳定，再按掩码合成动作。论文框架允许逆运动学或阻抗控制，但实际真机实现使用逆运动学。接触接口由用户指定接触点、方向与分工；语言接口用 GPT-4o＋SAM2 选接触点，方向仍按任务预设。肢体分工不是底层策略自主发现的。": "The task layer specifies the operation/walking mask of each limb. The model control module tracks the target of operating the limbs. RL controls the remaining limbs to keep moving and stable, and then synthesizes actions according to the mask. The thesis framework allows inverse kinematics or impedance control, but the actual real-machine implementation uses inverse kinematics. For the contact interface, the user specifies the contact point, direction and division of labor; for the language interface, GPT-4o+SAM2 is used to select the contact point, and the direction is still preset according to the task. The division of limb labor was not discovered autonomously by underlying strategies.", "未来轨迹条件": "Future trajectory conditions", "用RNEA逆动力学作每个预测节点的路径约束，同时约束浮动基六维受力平衡、足不滑移、摩擦锥与关节运动范围。末端力／速度是给定等式条件；步态时序固定，横向落脚点可优化。Pinocchio＋CasADi建立稀疏符号问题，Fatrop利用阶段结构求解，热启动与编译加速；前细后粗的几何时间网格延长预测。": "Use RNEA inverse dynamics to constrain the path of each prediction node, and at the same time constrain the six-dimensional force balance of the floating base, foot non-slip, friction cone and joint motion range. The terminal force/velocity is a given equation condition; the gait timing is fixed and the lateral foothold can be optimized. Pinocchio+CasADi creates a sparse symbol problem, and Fatrop uses the stage structure to solve it, hot start and compile acceleration; the geometric time grid is extended by thinning first and then coarsening.", "在Open X-Embodiment约800k轨迹上预训练开源Transformer策略，按新相机、动作空间与任务条件微调；重点验证通用初始化和接口可扩展性。": "Pre-train the open source Transformer strategy on about 800k trajectories of Open X-Embodiment, and fine-tune it according to new cameras, action spaces and task conditions; focusing on verifying universal initialization and interface scalability.", "重复投掷与计时进度": "Repeat throwing and timing progress", "固定桌面示范不能直接覆盖开柜、进电梯、搬运等需底盘与双臂同时运动的任务。": "The fixed desktop demonstration cannot directly cover tasks that require simultaneous movement of the chassis and arms, such as opening cabinets, entering elevators, and carrying.", "§III 控制与示教；§IV-A/B 学习；§V 实验": "§III Control and Teaching; §IV-A/B Learning; §V Experiment", "分别表示高、低层，": "means high and low floors respectively,", "同机器人、同观测、同示教预算、同任务与成功定义比较动作空间，再测可行性、足移动、跟踪误差和接触安全；现有跨论文数字不可直接排名。": "Compare action spaces on the same robot, observations, demonstration budget, task, and success definition; then measure feasibility, stepping, tracking error, and contact safety. Existing cross-paper numbers do not provide this comparison.", "DQ-Net主文及Appendix B复用Visual WBC低层／奖励，并作动态抓取基线；新增抓取候选融合和双视角时序学生。": "DQ-Net main text and Appendix B reuse Visual WBC low-level/reward and make dynamic capture baseline; new capture candidate fusion and dual-view timing students are added.", "显示综述": "Show surveys", "ICLR2026全身VLA代表：视觉语言到全身潜动作；人形邻接。提供明确架构，但尚不足以判断其动作接口已被广泛沿用。": "ICLR2026 Full Body VLA Representative: Visual Language to Full Body Latent Action; Humanoid Adjacency. A clear architecture is provided, but it is not enough to judge that its action interface has been widely used.", "可操作性信息可以包括动作类型、可交互区域，以及姿态、接近方向或接触后轨迹等执行参数。": "Operability information can include action type, interactable area, and execution parameters such as posture, approach direction, or post-contact trajectory.", "作者全文核心方法、主要实验与限制核读；§III-A/B，尤其III-B.6；§IV-A/B；Tables III/IV；Fig.7；未运行代码／观看视频，附录覆盖按定位记录": "The author's core methods, main experiments and restricted readings of the full text; §III-A/B, especially III-B.6; §IV-A/B; Tables III/IV; Fig.7; Code not run/video watched, appendix covering records by positioning", "正文 §III–V 完整方法、训练和实验审读；无另附录；intro/related work未逐段登记全文精读": "Text §III–V Complete method, training and experimental review; no additional appendices; intro/related work has not been registered paragraph by paragraph for intensive reading of the full text", "§4，Tables 1–4：仿真与实机区分": "§4, Tables 1–4: Difference between simulation and real robot", "§IV：六任务real-ID/OOD": "§IV: Six tasks real-ID/OOD", "‘接触代理’是替代直接力测量、供任务使用的接触提示信号。例如电流突然变化、关节没有到达指令位置，或者网络把力矩残差编码成一个接触强度特征。它可以帮助策略判断是否碰到物体、是否被顶住或是否应放慢动作；但没有经过物理标定时，不能把它的数值直接解释成若干牛顿。": "The 'Contact Proxy' is a contact cue signal used by the task in place of direct force measurement. For example, the current suddenly changes, the joint does not reach the commanded position, or the network encodes the torque residual into a contact strength feature. It can help the strategy determine whether it has hit an object, whether it is being held up, or whether it should slow down; but without physical calibration, its value cannot be directly interpreted as a number of Newtons.", "Method 的 partial kinematic embedding": "Partial kinematic embedding of Method", "身体与控制接口": "Body and control interfaces", "是它们经同一映射得到的分布。第二式是 KL 散度的数据处理不等式；处理不增加该分布差异，但不保证任务信息被保留或成功率提高。": "is their distribution obtained by the same mapping. The second formula is the data processing inequality of KL divergence; processing does not increase the distribution difference, but does not guarantee that task information is retained or the success rate is improved.", "arm residual→EE wrench→body-origin wrench 与速度补偿": "arm residual→EE wrench→body-origin wrench and speed compensation", "本地 PDF 标题核对；主文完整核心方法与实验已读；附录 A/B/C 部分配置核对，未逐项覆盖全部长附录。": "Local PDF title verification; the complete core methods and experiments of the main text have been read; some configurations of appendices A/B/C have been verified, and all long appendices have not been covered item by item.", "知识节点图": "Concept graph", "DQ-Net正文明确用预训练Contact-GraspNet生成抓取候选，再做全身动态抓取选择。": "The text of DQ-Net clearly uses pre-trained Contact-GraspNet to generate grabbing candidates, and then makes whole-body dynamic grabbing selection.", "长程指令需要先找目标、走到附近，再完成操作；仅看桌面图像的规划难处理移动中的视野和地形。": "Long-range instructions need to find the target first, walk nearby, and then complete the operation; planning based on desktop images is difficult to handle the moving field of view and terrain.", "视觉操作策略＋可复用的全身执行器": "Vision operation strategy + reusable whole-body actuator", "主要是人形；2026 年发表不等于已覆盖所有 2026 年预印本。": "Mainly humanoid; publishing in 2026 does not mean that all 2026 preprints have been covered.", "已阅读稀疏 RL、教师数据收集、实验 Q1–Q4、限制，以及附录示范退出／训练／critic 界限／SMPC／真机实现。": "Read Sparse RL, Teacher Data Collection, Experiments Q1–Q4, Limitations, and Appendix Demonstration Exit/Training/Critic Bounds/SMPC/real robot Implementation.", "输入腕／头／身体RGB、本体与任务文字、人工编写的阶段提示。两个扩散策略分别输出底盘速度／高度／pitch与末端目标；低层腿RL、臂IK。动作模型10 Hz离板4090，腿RL50 Hz、内环200 Hz，臂100 Hz。": "Enter wrist/head/body RGB, body and task text, and manually written stage prompts. The two diffusion strategies output chassis speed/height/pitch and end target respectively; low-level leg RL and arm IK. Action model 10 Hz off-board 4090, leg RL50 Hz, inner ring 200 Hz, arm 100 Hz.", "是带齐次坐标的位置，": "is a position with homogeneous coordinates,", "选择约需 39／62 秒，执行控制器 10 Hz；有限采样候选不代表全局最优。能力是局部的，且指定了 trot 阶段；需要专用支撑硬件。完整约束／控制器细节依赖本地缺失的外链补充材料。": "Selection takes approximately 39/62 seconds, executing controller 10 Hz; limited sampling candidates do not represent global optimality. Capability is local and trot stage specified; requires dedicated supporting hardware. Complete constraint/controller details rely on locally missing external supplementary material.", "先选可重复出现的失败，写清条件和指标；沿知识链找已有答案，再比较这些答案没有覆盖的条件。若现有方法已能解决，课题可转为实现与条件验证；若明确的接口／信息缺失导致失败，再提出最小必要改动。": "First select a repeatable failure and write down the conditions and indicators; look for existing answers along the knowledge chain, and then compare the conditions not covered by these answers. If the existing method can be solved, the topic can be transferred to implementation and condition verification; if a clear interface/lack of information leads to failure, then the minimum necessary changes are proposed.", "SOMA的S5历史和CAIMAN的因果作用探索不能仅因都有latent归为Bayesian参数辨识：前者未显式输出标定参数，后者衡量动作与对象变化的作用。": "SOMA's S5 history and CAIMAN's causal effect exploration cannot be classified as Bayesian parameter identification just because they both have latent: the former does not explicitly output calibration parameters, while the latter measures the effects of actions and object changes.", "离散动作预测对照": "Discrete action prediction comparison", "把目标条件化的视觉策略、抓取检测和广义可达图 GORM 组合：站位筛选考虑臂与身体姿态，低层执行抓取轨迹；教师动作与潜变量同时蒸馏到学生。": "Combining target-conditioned visual strategies, grasp detection and generalized reachability graph GORM: position screening considers arm and body posture, and low-level execution of grasp trajectories; teacher actions and latent variables are simultaneously distilled to students.", "将相机坐标变换到世界坐标。": "Transform camera coordinates to world coordinates.", "同一四足＋臂仿真、目标轨迹、奖励和训练算力下比较PPO与可微模型训练；同时报告未见轨迹误差、换步扰动、接触峰值，以及模型对足地和手物接触的分项多步预测误差。": "Under the same quadruped-plus-arm simulator, reference trajectories, reward, and compute budget, compare PPO with model-gradient training. Measure unseen-trajectory tracking, end-effector disturbance during support changes, contact peaks, and separate multi-step prediction errors for foot–ground and hand–object contacts.", "提出把语义导航、分层任务和四足操作接成系统的架构。": "Proposes an architecture that connects semantic navigation, hierarchical tasks and four-legged operation into a system.", "视觉与本体信息融合的行走场景": "Walking scene where visual and ontology information are integrated", "是第": "is the", "M20S 轮足底盘＋CM1 六自由度臂；需实测关节力矩，轮足邻接": "M20S wheel base chassis + CM1 six-degree-of-freedom arm; actual measured joint torque is required, and the wheel base is adjacent", "离散接触模式与连续运动需要共同安排": "Plan discrete contact modes and continuous motion together", "训练响应更一致与辨识响应后预测补偿是不同改动；更换策略、步态、延迟或载荷后需复核模型。": "Making training responses more consistent and predicting compensation after identifying responses are different changes; the model needs to be reviewed after changing strategies, gaits, delays or loads.", "没有height通道独立消融，不能将全部收益归给高度；S5历史有用不证明物理参数被显式准确估计。": "Without independent ablation of the height channel, all gains cannot be attributed to the height; S5 historical usefulness does not prove that the physical parameters are explicitly and accurately estimated.", "真机以Table4七任务为准，不将10个仿真任务写为10个真机任务；按钮/擦除/推车演示应按真正测量的子目标描述；几何数据扩增是MimicGen扩展，不是全新generalimitationprinciple；one demonstration是在仿真VR采集，并非一次自然真机视频即可部署": "The real robot is based on the seven tasks in Table 4, and the 10 simulation tasks are not written as 10 real robot tasks; the button/erase/cart demonstration should be described as the sub-goal of the real measurement; the geometric data amplification is a MimicGen extension, not a new generalimitation principle; the one demonstration is simulating VR collection, not a natural real robot video can be deployed", "剩余条件：": "Remaining conditions:", "抓取基础": "Grasping", "触觉、握力与接触释放": "Tactile feedback, grip force, and contact release", "DQ-Net只有仿真；ID-MPC接触真机没有独立末端力测量；Dynamic Pick-and-Place真机依赖动捕。应分别标注算法可运行、物理任务完成与观测／力标定条件。": "DQ-Net only has simulation; ID-MPC contacts the real robot without independent end force measurement; Dynamic Pick-and-Place real robot relies on motion capture. The conditions for algorithm operation, physical task completion, and observation/force calibration should be marked separately.", "视觉看不清夹持是否稳定、是否已经插入或夹得过紧；只复制夹爪路径容易损伤或操作失败。": "It is not clear visually whether the clamping is stable, whether it has been inserted or the clamping is too tight; simply copying the path of the clamping jaw is prone to damage or operation failure.", "Affordance 表示对象与机器人可做的交互关系，可拆成动作类型、区域和执行参数。一个物体 mask 不一定就是手能抓的区域；区域中心也不一定是接触点。对柜门需要把手位置、铰链或运动方向，对旋钮还需要旋转轴和适合接触的姿态。": "Affordance represents the interactive relationship between the object and the robot, which can be split into action types, regions and execution parameters. An object mask is not necessarily the area that can be grasped by the hand; the center of the area is not necessarily the contact point. For cabinet doors, the handle position, hinge or movement direction is required, and for knobs, the rotation axis and suitable contact posture are required.", "接触序列搜索＋轨迹优化＋反馈执行": "Contact sequence search + trajectory optimization + feedback execution", "Whole-Body UMI 保留手端轨迹接口，另用人形运动先验补足身体和足动作；高层不是 VLA，不能据名称认定直接复用 UMI on Legs 代码。": "Whole-Body UMI retains the hand trajectory interface, and uses humanoid motion a priori to supplement the body and foot movements; the upper level is not VLA, and cannot directly reuse UMI on Legs code according to the name.", "方法与接口节": "Method and Interface Section", "观察目标与操作目标可以分别控制": "Separate observation goals from manipulation goals", "VLA新路线：下游采用尚待积累": "Emerging VLA approaches: downstream use still limited", "论文在 Unitree G1 与 Booster T1 真机展示负载搬运、拉车与开门，分别标注约 0–20 N、0–100 N、0–40 N 的交互范围；仿真与基线比较臂跟踪和抗扰。力级别、身体形态都与轻型 Piper 不同，不能把其大力性能直接当作轻接触安全保证。": "The paper demonstrates load handling, pulling carts and opening doors on Unitree G1 and Booster T1 real robots, marking the interaction ranges of approximately 0–20 N, 0–100 N, and 0–40 N respectively; the simulation and baseline compare arm tracking and interference immunity. The force level and body shape are different from the lightweight Piper, so its high-power performance cannot be directly used as a guarantee of light contact safety.", "统一策略以有限机载传感和自身状态生成全身动作，用奖励处理感知误差与重心转移，并以课程训练教师和学生策略。与多接触规划分支讨论相同物理机会，但不能由此断言继承了 ETH 的算法。": "The unified strategy uses limited onboard sensing and self-state to generate whole-body movements, uses rewards to handle perception errors and center of gravity shifts, and uses courses to train teachers and students on strategies. The same physical opportunities are discussed with the multi-contact planning branch, but one cannot claim to have inherited the algorithm from ETH.", "$q_0$ 是默认关节配置，$\\Delta q_\\pi$ 是策略给出的角度偏移；$K_p,K_d$ 是比例和微分增益，$\\tau_{\\mathrm{ff}}$ 是可选前馈力矩。": "$q_0$ is the default joint configuration, $\\Delta q_\\pi$ is the angular offset given by the strategy; $K_p,K_d$ are the proportional and differential gains, and $\\tau_{\\mathrm{ff}}$ is the optional feedforward moment.", "来自训练期特权编码器，": "From the privileged encoder during training,", "接触操作综述": "Overview of contact operations", "变换需使用一致的时间戳与外参；世界坐标表示不能自动消除世界定位的漂移。": "Transformation needs to use consistent timestamps and external parameters; world coordinate representation cannot automatically eliminate world positioning drift.", "给定接触阶段，优化足位与抗扰力裕量。": "Optimize foot position and immunity margin for a given contact phase.", "网络知识有助于语义泛化，不直接约束动作可达性、接触力或足支撑安全。": "Network knowledge facilitates semantic generalization and does not directly constrain motion accessibility, contact force, or foot support safety.", "作者全文核心方法、主要实验与限制核读；§III-A–H；§IV-A/B；Figs.3–6；Table I；未运行代码／观看视频，附录覆盖按定位记录": "The author’s full text core methods, main experiments and restricted reading; §III-A–H; §IV-A/B; Figs.3–6; Table I; Code not run/video watched, appendix covering records by location", "OpenVLA明确在Open X-Embodiment的约970k机器人轨迹上训练；Octo明确使用约800k条该库轨迹。": "OpenVLA explicitly trains on ~970k robot trajectories from Open X-Embodiment; Octo explicitly uses ~800k trajectories from this library.", "相较纯模仿规划器，后续学习能找到更快的动作并超过老师；相较从零开始学习，减少寻找首次成功的困难。": "Compared with pure imitation planners, subsequent learning can find faster actions and surpass the teacher; compared with learning from scratch, it reduces the difficulty of finding the first success.", "是特征。若两个场景映成相同特征且策略只读取该特征，其动作分布相同，不能据此区分两个需要不同动作的场景。": "is a feature. If two scenes are mapped to the same feature and the strategy only reads this feature, their action distribution will be the same, and two scenarios that require different actions cannot be distinguished based on this.", "在线状态分布聚合的教师查询方法": "Teacher query method for online status distribution aggregation", "同一机器人要跟踪很多参考动作时，每段动作都靠物理仿真采样估计策略更新，计算成本会随动作库扩大。能否把共享的机器人动力学学一次，并用于更有效的训练？": "A controller must track many reference motions, all governed by the same robot dynamics. Repeatedly estimating policy updates from physics-simulator samples for each motion is costly. Can a shared learned dynamics model make training more efficient?", "数据审计与训练分阶段描述": "Phased description of data audit and training", "少量示范怎样覆盖新状态": "Covering new states with limited demonstrations", "Multi-Terrain WBC把位置目标留在身体坐标，只使朝向对齐重力；因此适合端物体过坡，不能将其身体坐标位置误差当成固定面板上的世界接触误差。此时看起来都是“task-consistent”，任务定义却不同。": "Multi-Terrain WBC leaves the position target in body coordinates and only aligns the orientation with gravity; therefore, it is suitable for end objects crossing slopes, and its body coordinate position error cannot be regarded as the world contact error on the fixed panel. At this point they all look \"task-consistent\", but the task definitions are different.", "主文80trials及40trial分解消融": "Main text 80trials and 40trial decomposition and ablation", "3. 扩展到四足全身：从运动所需的总作用中，扣掉电机和已知接触，剩余部分用于分析未知外部作用。": "3. Expand to the four-legged whole body: From the total action required for movement, the motor and known contacts are deducted, and the remaining part is used to analyze the unknown external action.", "同一个‘手端位置不变’，可能指相对身体不变，也可能指相对柜门或世界不变。身体开始俯仰或迈步时，这些要求不再等价。": "The same 'hand position remains unchanged' may mean that it remains unchanged relative to the body, or it may mean that it remains unchanged relative to the cabinet door or the world. When the body begins to pitch or step, these requirements are no longer equivalent.", "成功示范初始化": "Successful demonstration initialization", "§V-A/C：head/wrist特征与gripper-centric三维编码": "§V-A/C: head/wrist features and gripper-centric three-dimensional encoding", "47%force reduction来自sim rewardablation，不是全面真机损伤测量；hardware baseline同时固定gripper、无tactile、不同interactiontraining，不能单独归因sensor": "47% force reduction comes from sim rewardablation, not a comprehensive real robot damage measurement; the hardware baseline also fixes the gripper, no tactile, and different interaction training, and cannot be attributed to the sensor alone.", "探索权重变化": "Explore weight changes", "是目标动作，": "is the target action,", "论文明确扩展作者 2020 年只处理站立姿态鲁棒性的工作，把抗扰裕量用于带接触切换的移动操作。它是在**规划时**留出抗扰余量，与受扰动后重新抓取或在线调整示范进度的 Guided RL 解决不同环节；两者之间不能写成直接方法继承。": "The paper explicitly extends the author's 2020 work that only dealt with standing posture robustness, applying the immunity margin to mobile operations with contact switching. It is to leave an anti-disturbance margin during **planning**, and to solve different aspects of Guided RL that re-grabs after being disturbed or adjusts the demonstration progress online; the two cannot be written as direct method inheritance.", "是把加速度换算成所需作用的惯量矩阵；": "is the inertia matrix that converts acceleration into required action;", "主文实验与局限": "Main article experiments and limitations", "输入图像、语言和当前移动平台状态；OpenVLA 预测末端路径点。后续规划同时输出轮式底盘移动路径和机械臂轨迹；VLA 本身不直接输出底盘速度。": "Input image, language, and current mobile platform status; OpenVLA predicts end waypoint. Subsequent planning simultaneously outputs the movement path of the wheeled chassis and the trajectory of the robotic arm; VLA itself does not directly output the chassis speed.", "直出torque是chassis，arm仍position；J6violationincrease原文承认；不能写strictguarantee或所有jointsafer": "The straight out torque is chassis, and the arm is still in position; J6violationincrease is recognized in the original text; strictguarantee or all jointsafer cannot be written", "人拿手持夹爪收集示范，训练图像到轨迹的策略；另外在仿真中只练习全身跟踪轨迹。轨迹在不随身体晃动的任务坐标中表达，下层提前看到后续动作。": "A person holds a hand-held gripper collection demonstration to train the image-to-trajectory strategy; in addition, only the whole body tracking trajectory is practiced in the simulation. The trajectory is expressed in task coordinates that do not sway with the body, and the lower layer can see the subsequent actions in advance.", "固定臂 VLA 的动作空间没有底盘移动和身体俯仰；部署到四足时要决定这些动作由模型还是既有控制器负责，并让示教标签和执行命令一致。": "The action space of the fixed-arm VLA does not have chassis movement and body pitching; when deploying to a quadruped, it is necessary to decide whether these actions are responsible for the model or the existing controller, and make the teaching labels and execution commands consistent.", "同一策略兼顾位置、力和柔顺行为，跨四足／人形实验，是力控制分支的重要方法对照；触觉后作讨论它不等于采用其统一公式／训练方案。": "The same strategy takes into account position, force and compliance behavior, across quadruped/humanoid experiments, and is an important method comparison for the force control branch; it will be discussed later on tactile sensation, which is not equivalent to adopting its unified formula/training plan.", "这里只列出无其他约束的局部运动学关系。足端固定、关节限位、碰撞和动力学约束会进一步限制可用解。": "Only local kinematic relationships without other constraints are listed here. Foot fixation, joint limits, collisions, and dynamic constraints further limit the available solutions.", "Spot＋臂有实机，Unitree G1 仅仿真。": "Spot+ arm has a real robot, Unitree G1 is only simulated.", "WildLMa 主要把示教技能与语言任务规划组合；KINO 选择关键姿态给控制器；WholeBodyVLA 学全身潜动作。把高层规划器改成大模型不自动改变低层接触能力。VLA 输出是否包含底盘动作、是否真正参与移动物体，必须从运行接口与实验核查。": "WildLMa mainly combines teaching skills and language task planning; KINO selects key postures for the controller; WholeBodyVLA learns whole-body submersible movements. Changing the high-level planner to a large model does not automatically change the low-level exposure capabilities. Whether the VLA output contains chassis movements and whether it actually participates in moving objects must be verified from the running interface and experiments.", "模块化系统在抓取上获益可能来自感知模型、站位筛选与停步执行共同作用，不能把最终增益全部归给一个新指标。": "The benefits of the modular system in grabbing may come from the combination of perception model, position screening and stop execution. The final gain cannot be attributed entirely to a new indicator.", "控制动作改变测量质量，EKF复用进入训练": "Control actions to change the measurement quality, and EKF is reused to enter training", "作者全文核心方法、主要实验与限制核读；§IV-A–D，尤其IV-D.1/2；§V-B–E；Table II/III；§VI；未运行代码／观看视频，附录覆盖按定位记录": "The author's core methods, main experiments and restricted readings of the full text; §IV-A–D, especially IV-D.1/2; §V-B–E; Table II/III; §VI; not running the code/watching the video, the appendix covers records by positioning", "需要可靠时间戳和相机／身体变换。预测模型、目标遮挡和接触引起的非匀速运动会改变误差。": "Requires reliable timestamps and camera/body transformations. Non-uniform motion caused by prediction models, target occlusion and contact can change the error.", "机器人导航到了柜子附近，臂却够不到把手，或开门之后身体没有空间继续移动。导航成功不等于操作准备成功。": "The robot navigated to the vicinity of the cabinet, but its arms could not reach the handle, or there was no room for the body to continue moving after opening the door. Successful navigation does not equal successful operation preparation.", "力估计输入、期望力输出、触觉区域目标、握力控制和身体补偿可独立存在。FWBC的残差tokens不等于标定的六维力；Opt2VLA显式给目标力；TAC主要控制已抓住后的握持。": "Force estimation input, desired force output, haptic area targets, grip control and body compensation can exist independently. The residual tokens of FWBC are not equal to the calibrated six-dimensional force; Opt2VLA explicitly gives the target force; TAC mainly controls the grip after grasping.", "第二行表示一种实际的优势归一化后混合：": "The second line represents an actual dominant normalized mixture:", "本库WholeBodyVLA主要把OpenVLA-OFT作为改造后的基线；背景引用不表示采用原OpenVLA架构。": "This library WholeBodyVLA mainly uses OpenVLA-OFT as the modified baseline; background references do not imply the adoption of the original OpenVLA architecture.", "原tube acceleration先假设已在有效释放状态集合内且能精确跟踪；本文根据当前跟踪误差闭环修正。相对Athletic追求投远，重点变成给定目标的落点精度；两文不是已核实的直接继承。": "The original tube acceleration is first assumed to be within the effective release state set and can be accurately tracked; this article makes closed-loop corrections based on the current tracking error. Compared with Athletic's pursuit of long throws, the focus becomes the accuracy of the landing point for a given target; the two texts are not a direct inheritance that has been verified.", "更高检测成功率、滤波更平滑和预测更及时是三个不同指标；不可用名字相同的 Sigma Points 认定贝叶斯算法继承。": "Higher detection success rate, smoother filtering and more timely prediction are three different indicators; Sigma Points with the same name cannot be used to identify Bayesian algorithm inheritance.", "必须从四足＋臂主类移到四足无臂邻接：<$20 gripper 直接固定在身体；输出 vx/vy/yaw/bodypitch，不是机械臂关节或末端动作；sigma points 不应解释为 unscented Kalman filter；主文 open-world claim 需附上预扫描与平地范围": "Must be moved from the quadruped + arm main class to the quadruped armless adjacency: <$20 The gripper is directly fixed to the body; the output vx/vy/yaw/bodypitch is not the robot arm joint or end motion; sigma points should not be interpreted as unscented Kalman filter; the main text open-world claim needs to be attached with pre-scan and flat ground range", "一套系统同时出现规划、模型预测控制和全身控制时，应先判断每层决定什么，不能把整套系统当成一个不可拆的方法。": "When planning, model predictive control and whole-body control appear in a system at the same time, you should first determine what each layer decides, and the entire system cannot be regarded as an inseparable method.", "实验：replay action errors、真机79 trials、结构消融": "Experiments: replay action errors, real robot 79 trials, structure ablation", "显式身体接口需要可用的同时底盘／臂示教与稳定低层；力目标还要有能执行和测量力的控制通道。": "An explicit body-command interface needs simultaneous base-and-arm demonstrations and a stable low-level controller. Force targets additionally require a controllable and measurable force channel.", "目标仍随水平位置与yaw，难直接复现固定对象轨迹。": "The target still follows the horizontal position and yaw, and it is difficult to directly reproduce the fixed object trajectory.", "学习末端目标对应的多种可行全身姿态，并选择执行；新的分层接口值得观察，尚无已核实的多支复用。": "Learn a variety of feasible whole-body postures corresponding to the end target, and choose to execute; the new layered interface is worth observing, and there is no verified multi-branch reuse.", "附录：state estimation": "Appendix: state estimation", "低成本 Go1＋臂，展示擦白板、取放、按按钮和抛物等；目标可来自遥控、视觉模块或示范回放。": "Low-cost Go1+ arm, demonstrates whiteboard wiping, picking and placing, button pressing and throwing; targets can come from remote control, visual module or demonstration playback.", "仅作为背景引用；尚无本文方法被直接复用的证据。": "Referenced as background only; there is no evidence that the method in this article has been directly reused.", "35 页预印本综述，已核对全文和参考文献；没有新的四足真机实验。": "35 pages of preprint review, full text and references checked; no new quadruped real-life experiments.", "是绕该轴的旋转；": "is the rotation about the axis;", "力追踪训练施加反向虚拟力，主要报告末端位置误差，没有经标定的直接 F/T 力追踪误差表。机载状态会漂移，因操作表面不确定而省略操作接触摩擦检查；最终关节 PD 残差力矩也不由 QP 保证可行。": "Force tracking training applies reverse virtual forces and primarily reports end position errors, without a calibrated direct F/T force tracking error table. The onboard state will drift, and the operating contact friction check is omitted due to the uncertainty of the operating surface; the final joint PD residual torque is not guaranteed to be feasible by QP.", "设计视觉相同的成功／失败、动作中断、对象重新闭合和重复指令；测重复操作、漏操作、错误宣布完成与恢复时间。": "Design visually identical success/failure, action interruption, object re-closure and repeated instructions; measure repeated operations, missed operations, error announcement completion and recovery time.", "封闭标签的视觉分类器难根据自由文本寻找新物体／语义区域。": "It is difficult for closed-label visual classifiers to find new objects/semantic regions based on free text.", "两个姿态都能完成当前操作，但一个接近关节力矩极限或足滑动边界，受到额外外力时更容易失败。": "Both postures can complete the current operation, but one is close to the joint torque limit or foot sliding boundary and is more likely to fail when subjected to additional external force.", "force和position二选一，不能同轴独立同时跟踪；低频policy及模糊force估计；大量interaction teleoperation": "Select one of force and position, cannot be tracked coaxially and independently at the same time; low-frequency policy and fuzzy force estimation; large amount of interaction teleoperation", "较早将抗外力余量写进四足＋臂轨迹优化，建立模型分支的重要参照；当前没有核到多支后作默认采用该特定目标／求解器，和ETH多接触规划也不是直接继承。": "The external force resistance margin was earlier written into the quadruped + arm trajectory optimization, establishing an important reference for the model branch; currently, there is no specific target/solver that is used by default after multiple branches are verified, and it is not directly inherited from the ETH multi-contact planning.", "以真实机器人多任务数据训练Robotics Transformer，用token化视觉及动作表示和高容量序列模型吸收任务多样性；研究数据量、模型容量与泛化关系。": "Train Robotics Transformer with real robot multi-task data, use tokenized visual and action representation and high-capacity sequence model to absorb task diversity; study the relationship between data volume, model capacity and generalization.", "带语言指令的系统可能只是在已有技能里选一个，也可能直接生成动作。二者训练数据、失败类型和控制权限不同。": "The system with language commands may just select one of the existing skills, or it may directly generate actions. The training data, failure types and control permissions of the two are different.", "【仿真基准＋真机迁移例证】大规模并行仿真与训练吞吐；§6.1.4还报告ANYmal崎岖地形行走实机迁移，另有TriFinger迁移。没有四足＋臂操作实机对比。": "[Simulation benchmark + real robot migration example] Large-scale parallel simulation and training throughput; §6.1.4 also reports the real robot migration of ANYmal for rough terrain walking, and TriFinger migration. There is no actual comparison of four-legged + arm operation.", "移动示范方法基础": "Mobile demonstration foundations", "输入：上层看腕部图像；下层看身体和关节状态，以及上层预测的一小段未来末端轨迹。 输出：上层输出夹爪未来的位置、朝向和开合；下层输出腿和臂的关节角度目标。": "Input: The upper layer looks at the wrist image; the lower layer looks at the body and joint status, as well as a short segment of the future end-effector trajectory predicted by the upper layer. Output: The upper layer outputs the future position, orientation, and opening and closing of the gripper; the lower layer outputs the joint angle targets of the legs and arms.", "按钮按下后外观恢复原样，单帧图像可能无法区分‘没按过’和‘已经按成’；记住动作发生过也不代表真的触发成功。": "After the button is pressed, the appearance returns to its original state. The single-frame image may not be able to distinguish between ‘not pressed’ and ‘already pressed’; remembering that the action occurred does not mean that the trigger was actually successful.", "轨迹规划求一段未来动作，可能包含接触顺序和物体状态。模型预测控制（MPC）反复优化有限时域，只执行开头一段，再根据观测重算。全身控制（WBC）通常把当前身体／手／足目标转成满足动力学与执行器约束的加速度、接触力和力矩。": "Trajectory planning seeks a future action, which may include contact sequence and object status. Model predictive control (MPC) repeatedly optimizes a limited time domain, executing only the first section and then recalculating based on observations. Whole Body Control (WBC) typically converts current body/hand/foot targets into accelerations, contact forces, and moments that satisfy dynamics and actuator constraints.", "人机数据对齐": "Human-machine data alignment", "视觉策略可以学控制，也可以只学操作参考": "Vision can predict controls or task-space targets", "主文 §3.1–3.3，p.3–5": "Main text §3.1–3.3, p.3–5", "正文 §3/4/6全文核心审读；附录A policyinputs/adaptation、C faultdefinition/curriculum、D部分hyperparameters": "Text §3/4/6 Full text core reading; Appendix A policyinputs/adaptation, C faultdefinition/curriculum, Part D hyperparameters", "综述；引用了 Sleiman、RoLoMa、Visual WBC 等四足工作。": "Review; citing four-legged work by Sleiman, RoLoMa, Visual WBC, and others.", "终点": "Target", "是力估计或接触代理，": "is a force estimate or contact agent,", "附录A：阶段奖励与推拉路径": "Appendix A: Stage rewards and push-pull paths", "底层全身控制按技能执行，VLM 仅在技能边界依据图像／任务状态选择预定义技能；它不是连续输出全身动作的 VLA。": "The underlying whole-body control is performed by skill, and VLM only selects predefined skills at the skill boundary based on image/task status; it is not a VLA that continuously outputs whole-body movements.", "UMI on Legs §3将原始UMI的手持示范与相对末端轨迹接口接到四足全身跟踪器。": "UMI on Legs §3 Connect the handheld demonstration and relative end-effector trajectory interface of the original UMI to a quadruped whole-body tracker.", "背载六自由度臂增加重量、挤占负载；若身体本身会移动，某些任务不一定需要完整的六个臂自由度。": "Carrying a six-degree-of-freedom arm increases weight and squeezes the load; if the body itself can move, some tasks may not necessarily require a complete six-degree-of-freedom arm.", "UMI on Legs明确采用该手持示范数据与任务坐标轨迹；HoMMI等扩展采集接口。": "UMI on Legs clearly uses this handheld demonstration data and mission coordinate trajectory; HoMMI and other extended acquisition interfaces.", "必须保留共享方法之外的训练、表示和实验差别；直接继承还需原文说明复用。": "Training, representation and experimental differences other than shared methods must be retained; direct inheritance requires reuse of the original text description.", "【真机】六类精细双臂任务，含开调味杯和插电池；文中在两个任务报告约80–90%成功率，依各任务训练数据量而异；RSS 2023。": "[real robot] Six types of precise dual-arm tasks, including opening a condiment cup and inserting a battery; the article reports about 80–90% success rate in two tasks, which varies depending on the amount of training data for each task; RSS 2023.", "B2＋Z1，末两臂关节锁定；优化80 Hz，执行500 Hz": "B2＋Z1, the joints of the last two arms are locked; optimize 80 Hz, execute 500 Hz", "输入：身体姿态与角速度、腿和臂的关节状态、脚接触信息、上一动作、期望身体速度和末端位置／朝向。 输出：腿和臂的关节角度目标；每个关节的底层控制器再把角度误差变成力矩。": "Input: body posture and angular velocity, joint status of legs and arms, foot contact information, previous movement, desired body speed and end position/orientation. Output: Joint angle targets for the legs and arms; the underlying controller for each joint then converts the angle error into a torque.", "用便携夹爪收集原环境示范，配广角腕视角、姿态追踪和动作过滤；以相对轨迹及推理延迟匹配降低跨本体偏差，训练视觉动作策略。UMI本身是数据／动作接口体系，不是四足全身控制器。": "Use a portable gripper to collect original environment demonstrations, equipped with wide-angle wrist perspective, posture tracking and action filtering; use relative trajectory and inference delay matching to reduce cross-body bias and train visual action strategies. UMI itself is a data/action interface system, not a quadruped whole-body controller.", "用三个价值估计头分别评价任务完成、接近接触点和动作规范程度，再按权重合并各组优势来更新动作策略。接触探索权重按训练迭代从 0.1 降到 0.01，动作规范权重从 0.15 升到 0.24；它不是每次碰到物体就触发的在线切换。": "Use three value estimation heads to evaluate task completion, proximity to contact points, and action standardization, and then combine the advantages of each group according to weight to update the action strategy. The contact exploration weight decreases from 0.1 to 0.01 per training iteration, and the action specification weight increases from 0.15 to 0.24; it is not an online switch triggered every time an object is encountered.", "这条线用于比较或标注收录关系，不表示算法直接继承。": "This line is used to compare or mark the inclusion relationship, and does not mean that the algorithm is directly inherited.", "分别制造隐藏载荷、短遮挡、对象混淆与视觉相同的成功／失败，检验保存的信息。": "Create success/failure of hidden load, short occlusion, object confusion and visual identity respectively, and check the saved information.", "当前较具体的候选是：低成本臂上，身体换足与接触突然释放时的手端误差、力峰值和任务时间能否同时改善；以及视觉无持久变化时，如何分清动作执行与真实触发。每项都需补充针对性检索与基线复现，本文献库只能支持缺口假设，不能宣布全球无人做过。": "The current more specific candidates are: on a low-cost arm, whether the hand-end error, force peak and task time can be simultaneously improved when the body changes feet and when contact is suddenly released; and how to distinguish action execution from real triggering when there is no permanent change in vision. Each item needs to be supplemented with targeted searches and baseline replications. This library can only support the gap hypothesis and cannot declare that no one has done it in the world.", "§III：人/机器人task-space预训练与robot joint-space flow expert": "§III: Human/robot task-space pre-training and robot joint-space flow expert", "摘要": "Summary", "长程任务从示范技能组合扩展到带地图的探索、导航与局部操作；未核直接算法继承。": "Long-range tasks are expanded from demonstration skill sets to exploration, navigation and local operations with maps; direct algorithm inheritance is not verified.", "是物体可能脱离夹爪的时间范围。这个集合写法是原文机制的简化说明，不是其优化问题的逐字复写。": "is the time range during which the object may escape the gripper. This set writing method is a simplified explanation of the original mechanism, not a word-for-word reproduction of its optimization problem.", "可由状态规则或策略调节。允许暂停或回退，改变的是参考推进，而不是重新搜索一条完整接触计划。": "Can be regulated by status rules or policies. Pause or rewind is allowed, and what changes is the reference advancement rather than re-searching for a complete contact plan.", "阅读定位与选择依据": "Reading priority and rationale", "是以弧度表达的相位，": "is the phase expressed in radians,", "多配置建模": "Multi-configuration modeling", "没有腕部力传感器，仍可能从关节电流、实际力矩反馈或运动误差中发现接触；但这些信号也受重力、摩擦和加减速影响。需要先区分：检测到接触、得到接触强弱的提示，以及估计出有方向和单位的物理力。": "Without a wrist force sensor, contact may still be detected from joint currents, actual torque feedback, or motion errors; but these signals are also affected by gravity, friction, and acceleration and deceleration. It is necessary to distinguish first: detecting contact, getting a hint of the strength of the contact, and estimating the physical force with direction and unit.", "系统贡献与独立组件贡献怎样分开": "Separate system-level and component-level contributions", "是轴方向，": "is the axis direction,", "示范阶段": "Demonstration stage", "真机包括多种步态、台阶／窄梁、足端按按钮／翻箱／推桶；仿真地形测试为 3×500 次，另消融采样／对称性／高度观测。": "The real robot includes a variety of gaits, steps/narrow beams, pressing buttons at the end of the foot/turning boxes/pushing buckets; the simulated terrain test is 3×500 times, and ablation sampling/symmetry/height observation is also included.", "模型式臂导纳提供快速局部修正，RL 行走器响应末端速度要求；改进身体速度估计并过滤参考，使共同搬运中可以柔顺协调。": "Model-style arm admittance provides fast local correction, and the RL walker responds to terminal speed requirements; improves body speed estimation and filters the reference, allowing for smooth coordination during joint handling.", "教师从候选抓取特征形成动作相关 latent，学生在双分割深度流中保存有效历史，用时间、来源、可靠性和退化程度选择近期信息，并通过 GRU 输出 9 维移动/末端/夹爪指令。": "The teacher forms action-related latents from candidate grasp features, the student saves valid history in a dual-partitioned depth stream, selects recent information with time, provenance, reliability, and degradation, and outputs 9-dimensional move/end/gripper instructions via the GRU.", "UMI→CMP为原文复用；其余按共同接口作问题比较，不声明算法继承。": "UMI→CMP is original text reuse; the rest are compared based on common interfaces, and algorithm inheritance is not declared.", "AAC＋PFG优于某些末端指标，但ROA＋AM的线速度误差更低；不是全指标胜出。": "AAC+PFG is better than some terminal indicators, but the linear speed error of ROA+AM is lower; not all indicators win.", "运行接口": "Runtime interface", "chunk后几何关系verifier与uncertain处理": "Post-chunk geometric relationship verifier and uncertainty processing", "收集释放状态，": "Collection release status,", "刚体仿真、固定技能库／FSM、VLM 任务分解。": "Rigid body simulation, fixed skill library/FSM, VLM task decomposition.", "作者全文核心方法、主要实验与限制核读；§3.1/3.2；§4.1–4.3；Tables 1–4；§5；未运行代码／观看视频，附录覆盖按定位记录": "The author's full text core methods, main experiments and restrictions; §3.1/3.2; §4.1–4.3; Tables 1–4; §5; Code not run/video viewed, appendix covers records by positioning", "手持示范到相对末端轨迹": "Handheld demonstration to relative end-effector trajectory", "轮足四足＋六自由度臂，轮足邻接": "Four legs + six degrees of freedom arm, adjacent wheels", "这是形成研究问题的工作顺序，不存在由流程箭头即可证明的研究结论。缺口仍需针对性检索、基线复现与设备验证。": "This is the work sequence for forming a research problem. There is no research conclusion that can be proved by the process arrow. Gaps still require targeted retrieval, baseline reproduction and equipment verification.", "跨机器人数据／模型": "Cross-robot data/model", "作者只报告导航模块的初步真机部署；精细实机操作仍是后续工作。": "The author only reports on the preliminary real-machine deployment of the navigation module; detailed real-machine operation is still follow-up work.", "Spot 真机八种任务各十次，包括扶正／叠放重轮胎、拖围栏等；使用已有 ReLIC 控制器，部分任务借助脚和身体接触。G1 人形任务只在仿真中验证；对照中的通用三项成本用于受控仿真，完整真机任务另有任务专用成本。": "Spot eight tasks for the real robot ten times each, including righting/stacking heavy tires, towing fences, etc.; using the existing ReLIC controller, some tasks rely on foot and body contact. The G1 humanoid mission is only verified in simulation; the generic three costs in the comparison are for controlled simulation, and the full real-life mission has mission-specific costs.", "是滑动方向，": "is the sliding direction,", "写清预测量、在线是否搜索、是否含低层、未来对象状态来自何处。": "Write down the prediction measurement, whether to search online, whether it contains low-level objects, and where the future object state comes from.", "【真机＋仿真】Unitree A1在沙、泥、碎石、草地和楼梯等条件行走；正文报告部分任务的成功率，且无实机微调。": "[real robot + simulation] Unitree A1 walks in conditions such as sand, mud, gravel, grass, and stairs; the text reports the success rate of some tasks, and there is no real robot fine-tuning.", "动态对象抓取与视觉蒸馏的专题，复用Visual WBC低层；只有仿真，尚不能作为新全身执行范式。": "The topic of dynamic object grabbing and visual distillation reuses the lower layer of Visual WBC; it only has simulation, which cannot yet be used as a new whole-body execution paradigm.", "还要核对成功定义。DemoHLM的PressCube仅要求手距cube小于5cm，EraseBoard判据是橡皮左移0.2m；它们测代理子技能，并不验证电气触发或擦净面积。DiPLO的task success在存活轨迹上计算，需要同时看survival；不能与把所有尝试计入分母的成功率直接比较。": "Also check the definition of success. DemoHLM's PressCube only requires that the hand distance from the cube is less than 5cm, and the EraseBoard criterion is that the eraser moves 0.2m to the left; they test agent sub-skills and do not verify electrical triggering or erasing area. DiPLO's task success is calculated on the survival trajectory and needs to look at survival at the same time; it cannot be directly compared with the success rate that counts all attempts in the denominator.", "这是析因实验结构，不是动力学方程；需要分别看组件作用、交互及整系统价值，不能仅凭移除多个模块后的对比归因。": "This is a factorial experimental structure, not a kinetic equation; it is necessary to look at the component effects, interactions and the value of the entire system separately, and cannot just rely on comparative attribution after removing multiple modules.", "用带触觉的手持夹爪收集示范，训练上层同时预测运动和接触变化；下层先练稳定行走，再在接触任务仿真中练配合这些目标。": "Collect demonstrations using a tactile hand-held gripper to train the upper layer to simultaneously predict movement and contact changes; the lower layer first practices stable walking, and then practices matching these goals in the contact task simulation.", "感知方法／实机地形": "Perception method/real robot terrain", "Unitree Go2 身体直接安装低成本夹爪，没有机械臂；四足无臂相邻机制": "Unitree Go2 low-cost gripper mounted directly on the body, no robotic arm; four-legged armless adjacent mechanism", "相机、目标检测和大模型更新较慢，身体与物体仍在移动。直接把旧位置当当前位置，可能使再好的控制器也追错目标。": "Camera, target detection, and large model updates are slow, and bodies and objects are still moving. Directly treating the old position as the current position may cause the controller, no matter how good it is, to pursue the wrong target.", "B1＋Z1仿真形态与真机部署证据不同": "The B1+Z1 simulation form is different from the real robot deployment evidence", "不是无力传感器控制。神经网络预测平均误差的外积并不自动是经标定的条件协方差；参考调节器证据限于建模／采样约束，不能推广到所有碰撞。": "It is not a powerless sensor control. The outer product of the neural network prediction mean error is not automatically the calibrated conditional covariance; the reference regulator evidence is limited to modeling/sampling constraints and does not generalize to all collisions.", "0 个节点": "0 nodes", "可让学生与环境交互，在自身到达的状态上重新获取教师目标，或用真实任务回报优化。SLIM联合蒸馏与RL纠正执行分布；DiPLO在闭环状态上自蒸馏规划器，再按任务奖励优化。它们与只把离线数据增加几倍不同。示范是否含力、阶段、物体真值，以及教师是否部署可用，决定监督范围。": "Allows students to interact with the environment, regain teacher goals based on the state they have reached, or optimize with real task rewards. SLIM combines distillation and RL to correct the execution distribution; DiPLO self-distills the planner in the closed-loop state, and then optimizes according to task rewards. They are not the same as just multiplying offline data several times. Whether the demonstration contains force, stage, object true value, and whether the teacher is available determines the scope of supervision.", "GPU并行仿真工具与ANYmal迁移例证": "GPU parallel simulation tool and ANYmal migration example", "轮足底盘移动较快，臂的动作会影响平衡；把腿／轮和臂的奖励简单合在一起，训练时容易只顾其中一端。输入自身状态和任务目标，输出六个底盘关节力矩与六个臂关节位置目标，后者再由低层控制器转成力矩。": "The wheel base moves faster, and the movement of the arms will affect the balance; simply combining the rewards of the legs/wheels and arms makes it easy to only focus on one end during training. It inputs its own status and task goals, and outputs six chassis joint torques and six arm joint position targets, which are then converted into torques by the low-level controller.", "按 VLA 组成、低层动作、任务规划及数据基准组织。": "Organized by VLA composition, low-level actions, task planning, and data benchmarks.", "冻结与微调低层的消融": "Freezing and fine-tuning low-level ablation", "已知机构模型": "Known mechanism model", "后两式说明 CAIMAN 的动作影响量：": "The last two equations explain the influence of CAIMAN’s actions:", "与同框架的前向动力学／质心模型比较，说明问题表达和求解器结构可使全阶模型实时运行，而非必然需要降阶。它与ETH多接触规划关注层次不同：这里不搜索接触顺序，也不建模对象。": "Compared with the forward dynamics/centroid model of the same framework, it shows that the problem expression and solver structure can enable the full-order model to run in real time, without necessarily requiring order reduction. It is different from the level of concern of ETH multi-contact planning: contact sequences are not searched here, and objects are not modeled.", "$\\lambda_i$ 是环境在第 $i$ 个已知接触处作用于机器人的力或力旋量，例如某只足的地面支撑与摩擦。$J_i^\\top\\lambda_i$ 把它换算成全身作用；$\\mathcal C_{\\mathrm{known}}$ 是本次已掌握接触作用的集合。求和项表示已经能够计入的接触贡献。": "$\\lambda_i$ is the force or force spin acting on the robot at the $i$th known contact, such as the ground support and friction of a certain foot. $J_i^\\top\\lambda_i$ converts it into a whole-body effect; $\\mathcal C_{\\mathrm{known}}$ is the set of contact effects that have been mastered this time. The summation term represents the contact contribution that has been able to be accounted for.", "摘要明确称“initial deployment of the navigation module”，并说精细的实机操作部署仍是后续工作；不能把系统示意或仿真操作当成完整真机 loco-manipulation 成功率。对当前 Go1/Piper 类设备有工程借鉴，论文验证强度尚不足以作推荐主文献。": "The abstract clearly calls \"initial deployment of the navigation module\" and says that detailed real-machine operation deployment is still follow-up work; system diagrams or simulated operations cannot be regarded as complete real-machine loco-manipulation success rates. There is engineering reference for the current Go1/Piper equipment, but the verification strength of the paper is not enough to be used as a recommended main document.", "跟踪偏差大时自动降低示范进度的推进速度，让策略先追赶；另由策略输出进度残差，必要时倒退重抓。训练改变摩擦、门的弹簧参数等，按当前接触模式启用身体、物体和抓取关系的跟踪目标。": "When the tracking deviation is large, the speed of demonstration progress will be automatically reduced, allowing the strategy to catch up first; the strategy will also output the progress residuals, and go back and catch up again if necessary. Training changes friction, door spring parameters, etc. to enable tracking targets for bodies, objects, and grasp relationships according to the current contact pattern.", "UMI on Legs §3.1明确使用预训练CLIP视觉编码器。": "UMI on Legs §3.1 Explicitly use the pretrained CLIP visual encoder.", "分别表示当前状态": "Represents the current status respectively", "观察动作可以指定“看向哪个三维点”，再由相机／颈部控制执行，而不是要求机器人复现人头部的全部位姿。HoMMI把look-at目标和手端逆运动学分开，降低低自由度头部目标与双手目标冲突。": "The observation action can specify \"which three-dimensional point to look at\" and then be executed by camera/neck control, instead of requiring the robot to reproduce all the postures of the human head. HoMMI separates the look-at target and hand-end inverse kinematics, reducing the conflict between low-degree-of-freedom head targets and both-hand targets.", "都要把视觉任务意图变成可执行的移动操作，并由更快的控制层响应机器人状态。": "Each design turns visual task intent into executable mobile manipulation and relies on a faster controller to respond to robot state.", "语言分解能力、动作策略泛化和低层控制准确性是不同贡献；不同平台的任务成功率不能直接排名。": "Language decomposition ability, action strategy generalization and low-level control accuracy are different contributions; the task success rates of different platforms cannot be directly ranked.", "力矩残差还含摩擦、模型和执行误差，无闭环被动性／稳定性证明。正文与部分表中的任务、消融数字不一致，引用须指出表位置；不能将 sensorless 结果概括成比 F/T 更准确。": "The torque residual also contains friction, model and execution errors, and there is no proof of closed-loop passivity/stability. The task and ablation numbers in the main text are inconsistent with some tables, and references must indicate the table location; sensorless results cannot be generalized to be more accurate than F/T.", "项 · ": " papers · ", "输入：机器人和物体的几何、动力学模型，允许接触的部位，初始状态和任务目标，例如把门打开并通过。 输出：先生成身体、关节、物体的运动计划，以及接触位置、接触顺序和作用力；执行时由两层控制器跟踪计划。": "Input: The geometry and dynamics model of the robot and the object, the parts that allow contact, the initial state and the task goal, such as opening and passing the door. Output: First generate the motion plan of the body, joints, and objects, as well as the contact position, contact sequence, and force; during execution, the plan is tracked by the two-layer controller.", "估计方法": "Estimation method", "精细contact阶段base forward/lateral velocity设0，约束base稳；多数position chart arm-base frame不含tilt；fruit bruising没有仪器只定性": "Set the base forward/lateral velocity to 0 in the fine contact stage to constrain the base to be stable; most position chart arm-base frames do not contain tilt; fruit bruising does not have instruments and is only qualitative.", "裁剪代理目标不严格保证概率比始终处于 $[1-\\epsilon,1+\\epsilon]$，更不约束实机每步接触力或力矩。策略可用观测与评价网络可用状态仍需分别记录。": "The tailoring agent target does not strictly ensure that the probability ratio is always $[1-\\epsilon,1+\\epsilon]$, nor does it constrain the contact force or torque of the actual machine at each step. Policy availability observation and evaluation network availability status still need to be recorded separately.", "步后再更新。": "Please update after the next step.", "平台没有臂，无法直接论证移动时臂末端接触补偿；平地、预扫描目标；无通用长距离导航；滤波依赖 VO/深度，无世界不漂移或接触力保证；对称物体 PCA 轴的稳定性不能仅凭低维表示推定": "The platform does not have an arm, and it is impossible to directly demonstrate the contact compensation of the arm end when moving; flat ground, pre-scan target; no universal long-distance navigation; filtering depends on VO/depth, and there is no world non-drift or contact force guarantee; the stability of the PCA axis of symmetrical objects cannot be inferred based on low-dimensional representation alone", "无外挂臂。定量成功率主要是地形通过率，不能当作操作任务成功率；足端追踪目标点也不等于力追踪或确认物体接触。": "No external hanging arm. The quantitative success rate is mainly the terrain passing rate and cannot be regarded as the success rate of the operation task; tracking the target point with the toe is not equivalent to force tracking or confirming object contact.", "UMI on Legs 是非语言扩散策略＋四足 RL 全身跟踪；MoManipVLA 是轮式 VLA 路径点＋优化；Whole-Body UMI 是人形非 VLA 轨迹＋运动生成；Go2＋Piper 初步工作是 VLA 显式底盘／身体／臂命令。CMP 提醒末端请求可能越过低层能力。": "UMI on Legs is a non-language diffusion policy with quadruped RL whole-body tracking. MoManipVLA is a wheeled VLA with end-effector waypoints and trajectory optimization. Whole-Body UMI is a non-VLA humanoid policy with motion generation. The Go2–Piper study uses VLA outputs for base, body, and arm commands. CMP shows that end-effector requests may exceed the tracker’s competence.", "任务层给mask/target；部分语言任务；contactinterface有manualcontact/mask；MPCbaseline不支持interlimb/3leg；未闭环在线finecontact": "The task layer provides mask/target; some language tasks; the contact interface has manualcontact/mask; MPCbaseline does not support interlimb/3leg; the loop is not closed online finecontact", "正文 §III/IV/V方法、reward、ablation、hardware审读；无另附录": "Text §III/IV/V method, reward, ablation, hardware review; no additional appendices", "是身体与关节配置，": "is the body and joint configuration,", "先用二维、无空气阻力的抛体模型计算释放后的落点。": "First use a two-dimensional, air-resistance-free projectile model to calculate the impact point after release.", "研究方法": "Research methods", "物体相对示范扩增与接触阶段的锚点": "Object-relative augmentation and contact-phase anchors", "可以包含地面的向上支撑和两个切向摩擦分量，点接触时通常是一个三维向量，单位是牛顿；它不是算法的权重或超参数。手接触面板时，面板的反作用也属于接触力。": "can include the upward support of the ground and two tangential friction components. At point contact, it is usually a three-dimensional vector in Newtons; it is not a weight or hyperparameter of the algorithm. When the hand touches the panel, the reaction of the panel is also a contact force.", "真机 3 kg 起升与忽略操作力的 MPC 对比，真机载荷最高 8 kg。仿真 10 kg 起升逐渐缩短动作时间，检验固定力与规划时变力的差别；门操作也在仿真中。": "Comparing the 3 kg lifting capacity of the real robot with the MPC that ignores the operating force, the real robot has a maximum load of 8 kg. The simulation of 10 kg lifting gradually shortens the action time to test the difference between the fixed force and the planned time-varying force; the door operation is also simulated.", "人手持带相机和夹爪的工具采示范；从图像与追踪估计手端相对轨迹、夹爪动作，部署时给机器人同类相机观察和相对动作接口。": "Demonstration of tool picking with a camera and gripper held by a person; estimating the relative trajectory of the hand and gripper movements from images and tracking, and providing the robot with similar camera observation and relative movement interfaces during deployment.", "复用低层，动态教师用候选融合，学生从双视角时间序列模仿。": "Reuse low-level, dynamic teacher-use candidate fusion, and students imitate from dual-view time series.", "方法／训练时长实验": "Method/Training Duration Experiment", "是增益，": "is the gain,", "奖励大小、折扣、优势标准化与训练预算需要匹配；稳定性惩罚不能当作硬约束。": "Reward size, discount, advantage standardization and training budget need to match; stability penalty cannot be used as a hard constraint.", "精细接触阶段身体前向／侧向速度设为零，以姿态调整支持操作，未验证持续跨步中的精细接触。多数位置曲线以臂基座为原点，不计身体倾斜带来的位移；水果损伤缺乏仪器定量测量，定量轻柔抓取结果针对薯片。": "The forward/lateral body speed is set to zero during the fine contact phase, and the operation is supported by posture adjustment. Fine contact in continuous strides has not been verified. Most position curves take the arm base as the origin, regardless of the displacement caused by body tilt; fruit damage lacks quantitative measurement with instruments, and the quantitative gentle grasping results are for potato chips.", "可扩展为六维力旋量，并匹配相应 Jacobian。多处未知接触、奇异姿态或较大的摩擦误差会使估计不唯一或不可靠。": "Can be extended to six-dimensional force spinors and match the corresponding Jacobian. Multiple unknown contacts, strange postures, or large friction errors can make the estimate ununique or unreliable.", "两式分别表示力信息改变动作生成和力反馈改变快速执行，属于可独立存在的接口。另一路线让策略输出期望力、刚度或控制器混合权重；训练力监督与部署力反馈也应分开。": "The two formulas respectively represent force information change action generation and force feedback change rapid execution, and are interfaces that can exist independently. Another route is to have the policy output the desired force, stiffness, or controller blend weight; training force supervision and deployment force feedback should also be separated.", "实验／评价节": "Experiment/Evaluation Section", "将“完成什么”与“怎样完成”分成任务指令c和行为指令b。Walk These Ways中c是平移／转向速度，b是足间相位、步频、身体高度／pitch、站宽和抬脚高度。两组输入共同条件化一个策略，b不是环境估计潜变量。": "Divide \"what to accomplish\" and \"how to accomplish it\" into task instructions c and behavior instructions b. In Walk These Ways, c is the translation/turning speed, and b is the interfoot phase, cadence, body height/pitch, stance width and foot lift height. Two sets of inputs jointly condition a policy, and b is not an environmental estimation latent variable.", "显式phase观测与阶段奖励；并非无任务状态": "Explicit phase observation and phase rewards; not a no-task state", "工业任务中的远距离移动仍由人遥控；机器人到目标附近才离线规划并执行操作。物体动力学未纳入规划，极端作用力仍可能超过反馈控制能补偿的范围；实测承受力阈值比模型预测低约 21–22%，不能把规划裕量当作任意实际扰动下的安全保证。": "Long-distance movement in industrial tasks is still controlled by humans; the robot plans and performs operations offline only when it is near the target. Object dynamics are not included in the planning, and extreme forces may still exceed the range that feedback control can compensate for; the measured endurance threshold is about 21–22% lower than the model prediction, and the planning margin cannot be regarded as a safety guarantee under any actual disturbance.", "是环境在第": "is the environment in the", "羽毛球原始HTML主文完整核读；6600/199650等为仿真统计设置，未挪作实机试验数量。": "A complete review of the original HTML main text of badminton; 6600/199650, etc. are simulation statistics settings and have not been used as actual machine test numbers.", "固定任务、网络权重和环境，分别改变行为指令、历史及臂目标，检查哪一输入引起哪类身体响应；再单独评估外部选择者。": "Fix the task, network weights, and environment, vary the behavioral instructions, history, and arm targets respectively, and examine which input causes which type of body response; then evaluate the external selector separately.", "注入固定延迟、抖动、丢帧和遮挡，测带时间对齐的目标误差及最终操作表现；分别移除补偿、预测和滤波。": "Inject fixed delay, jitter, frame loss and occlusion, measure the target error of band time alignment and final operating performance; remove compensation, prediction and filtering respectively.", "学习目录": "Study Catalog", "广义力向量的平移分量是力，转动分量是力矩，单位并不全相同。有些接触模型还允许接触处传递力矩，这时 $\\lambda_i$ 使用六维力旋量：包含三个力分量和三个力矩分量，相应 $J_i$ 也必须匹配。": "The translational component of the generalized force vector is force, and the rotational component is moment. The units are not all the same. Some contact models also allow torque to be transmitted at the contact. In this case $\\lambda_i$ uses a six-dimensional force spinor: it contains three force components and three moment components, and the corresponding $J_i$ must also match.", "关节 PD 目标裁剪仅限制名义关节作用，不是末端接触力上界。未解锁把手时可重复推拉并误把自身转动当操作成功，是完成事件缺少可观测证据的明确失败例；人工阶段奖励与门模型仍需要。": "Joint PD target clipping only limits the nominal joint action, not the end contact force upper bound. When the handle is not unlocked, it can be pushed and pulled repeatedly and mistakenly turns itself as the operation is successful. This is a clear failure example that lacks observable evidence for completing the event; the artificial stage reward and door model is still needed.", "无碰目标采样、地形课程与稳定行走初态": "No-collision target sampling, terrain courses and stable walking initial state", "坐标的齐次位姿变换。": "Homogeneous pose transformation of coordinates.", "方法：base/arm latent 对抗解耦与 ego-motion token": "Method: base/arm latent confrontation decoupling and ego-motion token", "相较 UMI on Legs 只传轨迹，把“期望怎样接触”也传给执行层；同时区别于只把触觉接到上层的做法。": "Compared with UMI on Legs, which only transmits the track, the \"expected contact\" is also transmitted to the execution layer; at the same time, it is different from the approach of only connecting the touch to the upper layer.", "投影到 Jacobian 的零空间。期望速度在": "Projected into Jacobian null space. The expected speed is", "不能把78%平均子目标成功写为全部任务端到端成功；不能把LMO结果仅归为离散动作本身天然更好；VLA不是直接输出全部腿关节；低层50Hz承担行走执行；潜动作同名不等同Psi0的分阶段表征训练": "The 78% average sub-goal success cannot be written as the end-to-end success of all tasks; the LMO results cannot be attributed only to the discrete actions themselves, which are naturally better; VLA does not directly output all leg joints; the low-level 50Hz is responsible for walking execution; the same name for latent actions is not equivalent to the staged representation training of Psi0", "视觉直接到关节承担更多目标到关节映射和全身协调；视觉到任务参考把稳定执行交给复用控制器；视觉到技能则再把动作细节交给已有技能。后两者能减少视觉示范所需覆盖的关节行为，但依赖接口和技能范围。": "Vision-to-joints take on more target-to-joint mapping and whole-body coordination; vision-to-task reference hands over stable execution to multiplexed controllers; vision-to-skills then hands over action details to existing skills. The latter two can reduce the joint behaviors that need to be covered by visual demonstrations, but depend on the interface and skill range.", "以力信号与身体补偿为例，可设置两者都关闭、只用信号、只用补偿、两者都用四种组合，固定其他数据、模型、硬件和协议。": "Taking force signal and body compensation as an example, you can set both to turn off, only use signal, only use compensation, and both to use four combinations, and fix other data, models, hardware and protocols.", "从实机移动相机数据拟合检测概率与位置误差对距离、角速度的依赖，在训练中使用该模型并运行与真机相同的EKF。策略奖励准确、按时击球，同时惩罚预测误差，使身体动作既服务击球也服务观测。非对称critic额外读取剩余击球次数等未来信息；N-P3O处理臂总电流预算，执行器模型与CMA-ES辨识改善迁移。": "Fit the dependence of detection probability and position error on distance and angular velocity from the real robot mobile camera data. Use this model in training and run the same EKF as the real robot. The strategy rewards accurate, on-time hits while penalizing prediction errors, so that body movements serve both the shot and the observation. The asymmetric critic additionally reads future information such as the number of remaining shots; the N-P3O processing arm total current budget, actuator model and CMA-ES identification are improved and migrated.", "Go1＋WidowX＋单腕 RGB，相机观察颜色方块／篮子。360 次主比较＋40 次新场景，完整 78.3% ±5.8%，仅蒸馏 50% ±35.5%；低层十个种子中选最稳定三个实机部署。仿真为 MuJoCo，学生训练约四 GPU 两周。": "Go1＋WidowX＋Single wrist RGB, camera viewing color square/basket. 360 main comparisons + 40 new scenes, complete 78.3% ±5.8%, only distilled 50% ±35.5%; the three most stable real-machine deployments were selected from the ten lower-level seeds. Simulated for MuJoCo, student training takes approximately two weeks on four GPUs.", "系统比较模型规划、MPC/WBC、RL/IL、触觉与 foundation models 怎样支持移动操作。": "System comparison model planning, MPC/WBC, RL/IL, haptics and foundation models how to support mobile operations.", "地形条件": "Terrain conditions", "记住执行过动作与确认真实成功不同。如果可得观测无法区分成功／失败，增加历史也未必足够，可能需要电气、声学、触觉或其他结果反馈。": "Remembering that an action was performed is not the same as confirming actual success. If the available observations cannot distinguish success/failure, adding history may not be sufficient, and electrical, acoustic, tactile, or other outcome feedback may be needed.", "项 ·": "Item ·", "$o$ 是部署可得观测，$s_{\\mathrm{priv}}$ 是训练期特权状态；$\\pi_\\theta$ 是动作策略，$V_\\psi$ 是评价网络。critic 看特权状态，不等于部署策略也能读取。": "$o$ is the deployment available observation, $s_{\\mathrm{priv}}$ is the privileged status during the training period; $\\pi_\\theta$ is the action strategy, and $V_\\psi$ is the evaluation network. critic looks at the privilege status, which does not mean that the deployment policy can also be read.", "分段物体相对重定向，仿真执行过滤新数据。": "Segmented objects are relatively redirected and the simulation execution filters new data.", "HPT/MXT-Agg比较": "HPT/MXT-Agg comparison", "是时间常数。": "is the time constant.", "RGB预测任务表征": "RGB prediction task characterization", "是下一物体状态，": "is the next object state,", "条学习前置": " prerequisite links", "本地 PDF": "Local PDF", "论文§6明确无地形／对象交互；训练数据过滤这些动作。没有四足、轮足、机械臂、按钮／柜门或安全接触验证。训练集回放不可当作新任务泛化。SONIC算力对照硬件和数据量不同。": "Paper §6 explicitly states that there is no terrain/object interaction; the training data filters these actions. No four legs, wheels, arms, buttons/doors or safe contact verification. Training set replays cannot be used as generalization to new tasks. SONIC computing power varies according to hardware and data volume.", "输入：身体和关节历史、动作、步态时序，以及身体速度、末端位置、末端／身体力命令；不依赖实测腕部力。 输出：全身关节角度目标，以及外力、末端位置和身体速度的估计。另一个模仿学习模块使用估计力生成操作动作。": "Input: body and joint history, movements, gait timing, and body speed, end position, end/body force commands; does not rely on measured wrist force. Output: Whole-body joint angle targets, and estimates of external forces, end positions, and body velocities. Another imitation learning module uses estimated force to generate manipulative actions.", "实际按预定线性方案由0增到1；原文先写乘子梯度上升，再报告该实际安排。不是依据表示误差自动更新权重，也不能由引用BADMM推得神经网络PPO训练的凸优化收敛保证。": "The actual increase is from 0 to 1 according to the predetermined linear plan; the original article first writes the multiplier gradient rise, and then reports the actual arrangement. The weights are not automatically updated based on the representation error, nor can the convex optimization convergence guarantee of neural network PPO training be derived by referring to BADMM.", "导航/LLM 规划与 skill termination 描述": "Navigation/LLM planning and skill termination description", "Accurate Throwing根据当前末端位置／速度反复计算修正加速度，将有误差的实际释放状态拉回有效集合。原tube acceleration假设进入窗口时已有效且能准确执行；闭环版本针对这两个假设的误差。100 Hz全身策略和400 Hz臂残差负责产生／跟踪运动，优化器负责释放状态对任务落点的关系。": "Accurate Throwing repeatedly calculates the corrected acceleration based on the current end position/velocity, and brings the actual release state with errors back to the valid set. The original tube acceleration assumes that it is valid and can be executed accurately when entering the window; the closed-loop version targets the errors of these two assumptions. The 100 Hz whole body strategy and the 400 Hz arm residual are responsible for generating/tracking motion, and the optimizer is responsible for releasing the relationship between the state and the task landing point.", "Unitree G1 八类合计80次，直接基线39/80、完整71/80；四任务消融direct15/40、verifier22/40、tokens31/40、both34/40。Being-0来自不同论文suite，不能排名。对象身份保持、短感知记忆与已完成事件应分开；回弹按钮无持久视觉变化时仍需过程／电气等结果证据，几何tokens不能自动确认。": "Unitree G1 eight categories totaled 80 times, direct baseline 39/80, complete 71/80; four tasks ablation direct15/40, verifier22/40, tokens31/40, both34/40. Being-0 is from a different paper suite and cannot be ranked. Object identity preservation, short-term perceptual memory and completed events should be separated; when the rebound button does not have lasting visual changes, process/electrical and other result evidence is still needed, and geometric tokens cannot be automatically confirmed.", "ANYmal的关节与惯性本体观测和速度指令进入策略，输出关节动作；原作部署策略不依赖前向视觉图。": "ANYmal's joint and inertial body observations and speed commands enter the strategy and output joint movements; the original deployment strategy does not rely on the forward visual map.", "新发表论文引用积累很少；具体性能比较应回原论文验证任务和实验条件。": "There is very little accumulation of citations for newly published papers; specific performance comparisons should refer to the verification tasks and experimental conditions of the original papers.", "上身操作策略与下身走路控制分开，语言视觉任务难驱动全身移动。输入图像、文字和机器人状态；模型用全身潜动作表示生成运动与操作指令。": "The upper body operation strategy is separated from the lower body walking control, making it difficult to drive whole-body movement in language-visual tasks. Input images, text and robot status; the model uses whole-body latent motion representation to generate movement and operation instructions.", "对相同任务在相同方向施加逐渐增加的扰动，记录失稳／滑移阈值；只给随机推一下的演示不足以量化裕量。": "Apply increasing perturbations in the same direction on the same task and record the instability/slip threshold; a demonstration of just a random push is not enough to quantify the margin.", "数据扩增、SO(3)、直接动作扩散、教师条件移除、规划／跟踪器微调消融；pick/place、kick、push/pull仿真；真机搬运同目标10/10、不同目标5/5。": "Data amplification, SO(3), direct action diffusion, teacher condition removal, planning/tracker fine-tuning and ablation; pick/place, kick, push/pull simulation; real robot handling with the same target 10/10, different targets 5/5.", "多肢体接触、握持约束与执行器极限需进入控制或训练；角色切换时还要处理过渡。": "Multiple body contacts, grip constraints and actuator limits need to be controlled or trained; transitions must also be processed when switching roles.", "以分阶段教师解决长序列探索，再把部署时不可见阶段压进单个视觉学生；学生同时做蒸馏与 RL。RGB/语言/本体先预测任务相关 mask/depth，StopGrad 分隔视觉监督与策略损失；学生 stationary bit 在操作时精确停止基座移动。": "Use staged teachers to solve long sequence exploration, and then push the invisible stage during deployment into a single visual student; students do distillation and RL at the same time. RGB/language/ontology first predicts task-related mask/depth, StopGrad separates visual supervision and strategy loss; student stationary bit accurately stops the base movement during operation.", "历史推断": "Historical inference", "与Deep WBC的ROA不同，b是人为／高层给定的行为要求，而z用于从部署历史获得环境适应表示。两者可共存。": "Different from Deep WBC's ROA, b is a human/high-level given behavioral requirement, while z is used to obtain an environmental adaptation representation from the deployment history. Both can coexist.", "【轮式真机】开双门壁柜、把锅放入柜中、使用电梯及厨房任务；部分任务协同训练成功率明显改善，原文“up to 90%”是相对具体设置。": "[Wheeled real robot] Opening double-door wall cabinets, putting pots in cabinets, using elevators and kitchen tasks; the success rate of collaborative training for some tasks has been significantly improved. The original text \"up to 90%\" is a relatively specific setting.", "末端轨迹的能力边界": "Capability boundary of terminal trajectory", "动作块包含未来 H 个动作，只执行前 M 个再更新；H、M 与推理／通信延迟一起决定反馈频率。相邻块可以插值、融合或重新计时，减少速度跳变，但平滑会改变轨迹和接触建立时间。": "The action block contains H actions in the future, and only the first M are executed before updating; H, M and the inference/communication delay together determine the feedback frequency. Adjacent blocks can be interpolated, blended, or retimed, reducing velocity jumps, but smoothing changes trajectory and contact establishment times.", "区域中心不是把手接触点": "The center of the area is not the handle contact point", "几何、阻力和离散锁扣状态是不同未知量；若动作不足以激励参数，估计可能不唯一。": "Geometry, resistance and discrete lock state are different unknown quantities; if the action is not enough to excite the parameters, the estimate may not be unique.", "附录 C 的任务与观测接口": "Appendix C Mission and Observation Interface", "本节点比较控制权限和示教标签，不需要把末端轨迹或11维动作写成一条通用公式。各论文的动作单位、参考系和下层控制器见逐篇卡片。": "This node compares control permissions and teaching labels. There is no need to write the end-effector trajectory or 11-dimensional action into a general formula. The action units, reference systems and underlying controllers of each paper are shown on the card for each paper.", "机械臂是 ViperX300，不是Piper；79%为仿真，不能写为跨41对象真机泛化率；融合不是每个阶段误差都最好；不能把KL下降解释成理论证明泛化改善": "The robotic arm is ViperX300, not Piper; 79% is simulation and cannot be written as the real robot generalization rate across 41 objects; fusion does not have the best error at every stage; KL decline cannot be explained as theoretically proven generalization improvement", "全关节策略": "Full joint strategy", "参考坐标系决定控制器究竟在保持什么": "What frame does the controller actually hold fixed?", "Spot＋Spot Arm 在 12 类真机任务中每类做 10 次随机化试验，论文报告平均 78.9% 成功率，并比较直接目标、接触点、语言接口及 MPC／端到端 RL 基线。任务含用腿辅助抽屉／箱体操作、持续推靠等；外部 PC 参与计算。MPC 基线原本不支持三腿走路和肢体操作，不能将其失败推广为适配这些接触模式的模型控制都无效。该工作提供可指定肢体角色的接口，但不等于 Piper 背载臂系统有同样可行的足端接触点。": "Spot+Spot Arm conducts 10 randomized trials in each of 12 categories of real robot tasks. The paper reports an average success rate of 78.9% and compares direct targets, touch points, language interfaces and MPC/end-to-end RL baselines. Tasks include using legs to assist drawer/box operations, continuous pushing, etc.; an external PC participates in the calculation. The MPC baseline does not originally support three-legged walking and limb manipulation, and its failure cannot be generalized to the fact that model controls adapted to these contact patterns are ineffective. This work provides an interface to specify limb roles, but does not equate to the same feasible foot contact points for the Piper carrier arm system.", "采样身体高度、横滚、俯仰和六个臂关节，用正运动学生成训练数据；条件流模型据此生成同一末端目标对应的多种身体／臂参考。高层策略选择流模型的潜变量，低层 RL 控制腿去实现身体参考，臂由 PD 控制跟踪关节参考；完整 PAKE 还加入教师引导的高层优化以减小参考突变。运动学采样省略腿的约束，因此生成参考不自动保证动态可行。": "Sample body height, roll, pitch and six arm joints, and use forward kinematics to generate training data; the conditional flow model generates multiple body/arm references corresponding to the same end target based on this. The high-level strategy selects the latent variables of the flow model, the low-level RL controls the legs to achieve body reference, and the arms are controlled by PD to track the joint reference; complete PAKE also adds teacher-guided high-level optimization to reduce reference mutations. Kinematic sampling omits leg constraints, so generating references does not automatically guarantee dynamic feasibility.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；原论文没有四足运动、足接触和手端跟踪控制；动作生成质量与低层执行能力须分别衡量。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; the original paper does not have quadrupedal movement, foot contact and hand tracking control; the quality of action generation and low-level execution capabilities must be measured separately.", "CAIMAN 的动作影响、Contact-guided 的接触点和 SMPC 示范都帮助首次成功；它们不能以相同‘无需专家’标签比较。": "CAIMAN's motion effects, Contact-guided touchpoints and SMPC demonstrations all contribute to first-time success; they cannot be compared with the same 'no expert required' label.", "仿真中可以知道真实速度、物体位姿和摩擦；真实机器人通常不能直接知道。训练效果只有在部署信息足够时才可转移。": "The real speed, object pose and friction can be known in simulation; real robots usually cannot know it directly. Training effects are transferable only if sufficient deployment information is available.", "移除参考条件与任务优化": "Remove reference conditions and task optimization", "角色接口标明哪些肢体操作、支撑或不可用；任务层可给定或选择角色，执行层根据角色生成动作。": "The role interface indicates which limbs are operated, supported or unavailable; the task layer can give or select roles, and the execution layer generates actions based on the roles.", "Unitree B1＋Z1，四足＋机械臂": "Unitree B1＋Z1, four legs + robotic arm", "是有效释放状态集合，": "is a valid release status set,", "分别是视觉、语言与状态条件；": "They are visual, language and status conditions respectively;", "再把能命中的释放状态收成集合，并要求可能的释放时刻都落在其中。": "Then collect the release states that can be hit, and require that the possible release moments fall into them.", "规划与在线控制架构": "Planning and online control architecture", "Isaac Gym 中比较课程与约束模块，真机演示开门、触碰风扇、接取移动物体等。约束降低了多数臂关节的越界次数，但 J6 反而增加，因此不是硬约束安全保证。轮足底盘结果也不能直接移到抬腿行走的四足。": "Comparative courses and constraint modules in Isaac Gym, real robot demonstrations of opening doors, touching fans, picking up moving objects, etc. Constraints reduce the number of out-of-bounds violations for most arm joints, but increase them for J6, so they are not a hard constraint safety guarantee. As a result, the wheel-footed chassis cannot be directly moved to a quadruped that raises its legs for walking.", "工具上三个不共线点统一位置与朝向误差": "Unified position and orientation errors of three non-collinear points on the tool", "Tactile-aware 用面积、质心与角度作触觉目标，并在精细操作时限制身体平移；TAC-LOCO 面对已抓住物体的负载变化，直接读触觉并学夹爪动作。其去掉握力惩罚时成功率未降低而平均握力增大，说明成功率本身不能评价抓握效率或物体风险。": "Tactile-aware uses area, center of mass and angle as tactile targets, and limits body translation during fine operations; TAC-LOCO directly reads the tactile sensation and learns gripper movements in the face of load changes on the grasped object. When the grip strength penalty was removed, the success rate did not decrease but the average grip strength increased, indicating that the success rate itself cannot evaluate grasping efficiency or object risk.", "PPO的约束变体N-P3O、非对称critic、EKF、羽毛球阻力动力学、域随机化、执行器辨识。": "Constrained variant of PPO N-P3O, asymmetric critic, EKF, badminton drag dynamics, domain randomization, actuator identification.", "开门、拉车、搬重物时，末端受到未知三维外力，臂若一味追位置会把失衡扰动传给腿。输入身体／臂状态及任务运动目标，控制器要同时输出抗扰步态与臂动作。": "When opening a door, pulling a car, or moving a heavy object, the end is subject to an unknown three-dimensional external force. If the arm blindly chases the position, the unbalanced disturbance will be transmitted to the leg. Input the body/arm status and task movement target, and the controller should output the anti-interference gait and arm movement at the same time.", "语义图与对象匹配借鉴现有场景图方法，使用 RAM++、GroundedSAM、MaskCLIP 等模块；RoboDuet 为文中低层比较对象；共用两阶段思路不等于每项训练/网络均直接继承；ARNOLD 短任务定义/场景用于迁移评估，局部操作含预定义执行结构": "Semantic graph and object matching draw lessons from existing scene graph methods, using modules such as RAM++, GroundedSAM, MaskCLIP; RoboDuet is the low-level comparison object in the article; sharing two-stage ideas does not mean that each training/network is directly inherited; ARNOLD short task definition/scenario is used for migration evaluation, and local operations contain predefined execution structures", "轨迹执行条件": "Track execution conditions", "表示 Moore–Penrose 伪逆；": "represents Mo
