rmation must be performed.", "DAgger的关键是让学生自己访问状态并向专家求纠正；ACT预测多步动作块并做时间集成；Diffusion Policy拟合多峰动作轨迹分布。三者分别改变训练状态分布、动作时间接口和动作分布表示，可以组合，不能相互视为同一改动。": "The key to DAgger is to allow students to access the state themselves and seek corrections from experts; ACT predicts multi-step action blocks and integrates them over time; Diffusion Policy fits multimodal action trajectory distribution. The three change the training status distribution, action time interface and action distribution representation respectively. They can be combined and cannot be regarded as the same change.", "训练响应＋辨识＋相位消融": "Training response + identification + phase ablation", "接下来可学": "Continue with", "都叫全身，决策权限不同": "Whole-body systems grant different control authority", "感知退化与特征级融合": "Perceptual degradation and feature-level fusion", "仅靠足接触之后才知道障碍的本体行走，难以提前选择落脚和调整身体；高度图也可能噪声大或过时。": "Walking on the obstacle is only known after foot contact, making it difficult to choose your footing and adjust your body in advance; the height map may also be noisy or outdated.", "复现训练／模拟器／ROS实机接口并分析接触差异。": "Reproduce the training/simulator/ROS real robot interface and analyze the contact differences.", "§6 与 App C": "§6 with App C", "8任务评价及subtask干预协议": "8 Task evaluation and subtask intervention protocol", "该条件互信息衡量动作能否使对象变化分布可区分；实际计算依赖学到的转移模型，不能自动解释为真实无混杂的干预因果效应。": "This conditional mutual information measures whether the action can make the object change distribution distinguishable; the actual calculation relies on the learned transfer model and cannot be automatically interpreted as a true unconfounded intervention causal effect.", "表征需要保持正确动作所依赖的可区分性。两个需要不同动作的场景若变成相同特征，下游控制器无法恢复丢掉的信息。数据处理不等式说明处理不增加输入分布的KL差异，却不保证任务信息被保留或成功率提高。": "Representations need to maintain the differentiability that correct actions depend on. If two scenarios requiring different actions become the same feature, the downstream controller cannot recover the lost information. The data processing inequality shows that processing does not increase the KL difference of the input distribution, but it does not guarantee that task information is retained or the success rate is improved.", "是状态转移。分母归一化且需为正；离散状态时积分改为求和。": "is a state transition. The denominator is normalized and needs to be positive; in the discrete state, the integral is changed to a summation.", "刚度可以按方向设置：沿运动切向保留精度，法向允许顺应。HMC 进一步学习不同控制模式的混合权重；Safe combined control 用导纳产生速度并加参考约束。学习刚度、混合控制器和补偿外力是三种不同设计。": "Stiffness can be set by direction: accuracy is preserved along the tangential direction of motion, and compliance is allowed in the normal direction. HMC further learns the mixing weights of different control modes; Safe combined control uses admittance to generate velocity and adds reference constraints. Learning stiffness, hybrid controller and compensation of external forces are three different designs.", "表示该接触。": "indicates this contact.", "指定足间相位、步频、身体姿态等行为；": "Specify behaviors such as foot phase, stride frequency, body posture, etc.;", "特定四足形态迁移": "Specific quadrupedal form migration", "末端轨迹迁移、视觉骨干预训练、对齐动作混训与分阶段动作专家训练的监督不同；没有一个通用的数据迁移公式能代表这些路线。": "end-effector trajectory transfer, visual bone intervention training, and aligned movement mixed training are supervised differently than staged movement expert training; there is no universal data transfer formula that can represent these routes.", "统一RL全身策略；ROA；advantage mixing": "Unified RL whole-body strategy; ROA; advantage mixing", "这是能力集合的数学定义。RoLoMa 和接触选择方法使用限定响应或保守近似来构造可行余量；论文给出的数值不必等于上式在所有反馈下的精确最大值，也不是动态碰撞安全保证。": "This is the mathematical definition of a capability set. RoLoMa and contact selection methods use bounded responses or conservative approximations to construct feasible margins; the values ​​given in the paper do not necessarily equal the exact maximum of the above equation under all feedback, nor are they a dynamic collision safety guarantee.", "【移动机械臂真机】长程家居式语言指令，展示可行性评分对任务完成的影响；CoRL 2022论文集2023。": "[Real mobile robotic arm] Long-range home-style language commands, demonstrating the impact of feasibility scoring on task completion; CoRL 2022 Proceedings 2023.", "地形条件和末端工作空间的重要扩展，并实际复用Deep WBC的ROA；作为继承实例保留，不因应用环境更复杂就自动成为方法基础。": "Important expansion of terrain conditions and terminal workspace, and actual reuse of Deep WBC's ROA; retained as an inherited instance, it does not automatically become the basis of the method as the application environment becomes more complex.", "保留 UMI on Legs 的操作策略／执行器分层思想，专门处理末端目标欠约束的身体动作；证明「只给末端」也能在下游增加全身决策能力，而不是必须扩大 VLA 动作维度。": "Retains the operation strategy/executor hierarchical idea of ​​UMI on Legs, specifically dealing with unconstrained body movements of end targets; proving that \"only for the end\" can also increase the whole-body decision-making ability downstream, rather than having to expand the VLA action dimension.", "是设定的虚拟质量、阻尼和刚度；": "is the set virtual mass, damping and stiffness;", "四足＋固定夹爪": "Four legs + fixed jaws", "已证实承接ETH规划器，把示范执行变成可反馈、可恢复的RL；是清楚的发展步骤，但尚无已核实的多支下游采用其自适应进度模块。": "It has been confirmed that it will take over the ETH planner and turn the demonstration execution into a feedbackable and recoverable RL; this is a clear development step, but there are no verified multiple downstream branches using its adaptive progress module.", "把物理仿真、张量表示及RL流水线放在GPU，批量并行模拟机器人；这是训练基础设施，不是步态奖励或操作算法。": "Put physical simulation, tensor representation and RL pipeline on the GPU to simulate robots in batches in parallel; this is the training infrastructure, not the gait reward or operation algorithm.", "个接触处的 Jacobian，描述身体和关节运动怎样传到接触点。": "Jacobian at a contact, describing how body and joint motions are transmitted to the contact point.", "例如接触力、柜门、RoLoMa": "Such as contact force, cabinet door, RoLoMa", "恢复仍围绕参考，部署需对象状态，锁扣机制没有完整覆盖。": "Recovery still revolves around the reference, deployment requires object status, and the locking mechanism is not fully covered.", "模型／规划": "Model / plan", "这是决策范围与执行时序的区分，没有一个通用公式能代表所有引用系统。应逐篇列出优化变量、预测模型、约束及更新周期。": "This is the distinction between decision-making scope and execution timing. There is no general formula that can represent all reference systems. The optimization variables, prediction models, constraints and update cycles should be listed one by one.", "模型规划接触过程与模型 WBC 加 RL 纠错处理不同层级；并非直接算法承接。": "The model planning contact process and the model WBC plus RL error correction processing are at different levels; it is not directly undertaken by the algorithm.", "模型误差可能来自惯量与载荷近似、执行器响应、接触摩擦、状态估计，以及求解和通信延迟；这些误差不能未经辨识就相加为一个具有确定物理意义的量。": "Model errors may arise from inertia and load approximations, actuator response, contact friction, state estimation, and solution and communication delays; these errors cannot be added to a quantity with definite physical meaning without identification.", "$r_{k,t}$ 是第 $k$ 项奖励，$w_k$ 是权重，$A_{r_k}^\\pi$ 是同一策略下该回报对应的真实优势。第一行的优势线性关系要求固定权重、相同策略、折扣、终止和时域。": "$r_{k,t}$ is the $k$th reward, $w_k$ is the weight, $A_{r_k}^\\pi$ is the real advantage corresponding to the return under the same strategy. The dominant linear relationship in the first row requires fixed weights, identical policies, discounts, termination, and time domain.", "是物体参数或相关状态。该式把低层响应包含在一步转移中。": "is an object parameter or related state. This formula includes the low-level response in one step transfer.", "Go2＋Piper 显式 11 维 VLA 动作": "Go2＋Piper explicit 11-dimensional VLA action", "先学定时全身末端状态跟踪，再冻结名义策略训练高频臂残差。模型模块用抛体落点映射求当前释放状态的落点偏差，并在速度／加速度边界下求修正，让100 ms释放窗口内的末端状态接近能到达目标的状态集合。以CVXPYgen编译参数化求解，部署每2.5 ms更新；不是只在投掷之前离线规划一次。": "First learn timed whole-body end state tracking, and then freeze the nominal strategy to train high-frequency arm residuals. The model module uses projectile landing point mapping to find the landing point deviation of the current release state, and seeks corrections under the speed/acceleration boundary so that the end state within the 100 ms release window is close to the set of states that can reach the target. Parametric solver compiled with CVXPYgen, deployment updated every 2.5 ms; not just planned offline once before throwing.", "输入可为图像、语言与交互上下文；输出可为动作类型、接触区域、姿态、方向或接触后轨迹。综述没有统一运行时控制器。": "The input can be images, language and interaction context; the output can be action type, contact area, posture, direction or post-contact trajectory. Overview There is no unified runtime controller.", "先用观测时的相机位姿表达目标，再用当前相机位姿表达预测后的目标。": "First use the camera pose during observation to express the target, and then use the current camera pose to express the predicted target.", "假设末端slow/quasi-static，去掉M,D；rough force误差；human forcing/teleop；position约0.1m": "Assume that the end is slow/quasi-static, remove M, D; rough force error; human forcing/teleop; position is about 0.1m", "闭环教师补数和任务回报优化是两种纠正方式；教师参考与反馈是否在学生实际到达状态仍有效，需要验证。": "Closed-loop teacher complement and task reward optimization are two correction methods; whether teacher reference and feedback is still valid when students actually arrive needs to be verified.", "仿真中用虚拟弹簧／阻尼产生接触力，以真实仿真力计算力跟踪奖励，并监督从自身状态历史估计外力的网络。位置和力模式交替训练；部署时用位置误差与速度反馈生成力命令，实现可调柔顺交互。": "Use virtual springs/dampers to generate contact forces in simulation, calculate force tracking rewards with real simulation forces, and supervise a network that estimates external forces from its own state history. Position and force modes are alternately trained; position error and speed feedback are used to generate force commands during deployment to achieve adjustable and compliant interaction.", "WildLMa引用SayCan作为语言规划背景；未证实采用其语言概率乘技能价值的评分公式。": "WildLMa cites SayCan for language planning background; unconfirmed use of its language probability times skill value scoring formula.", "Multi-Terrain WBC按身体姿态与速度表现门控操作奖励，是状态相关软优先级；它与把不同回报分别用critic估计不同，也与任务优先级QP的即时约束不同。": "Multi-Terrain WBC performs gated operation rewards according to body posture and speed, which is a state-related soft priority; it is different from using critic to estimate different rewards separately, and it is also different from the real-time constraints of task priority QP.", "2026-10-29核读19页PDF全文；重点§2–4、§6、附录A/B/E/F/G，核对作者项目页说明及arXiv元数据。": "2026-10-29 Read the 19-page PDF full text; focus on §2–4, §6, Appendix A/B/E/F/G, and check the author’s project page description and arXiv metadata.", "Go2 约 15 kg、Kinova 臂约 4.4 kg；规划约 60 Hz，腿部控制约 500 Hz。真机验证负载、扰动、地形及开门／抽屉等遥操作；200 个随机地形中走完 10 m 的仿真稳定通过率为 86%／28%，这是移动稳定性，非操作任务成功率。": "Go2 about 15 kg, Kinova arm about 4.4 kg; planning about 60 Hz, leg control about 500 Hz. The real robot verified the load, disturbance, terrain, and remote operations such as opening/drawing doors; the simulation stable pass rate of walking 10 meters in 200 random terrains was 86%/28%, which is the stability of movement and the success rate of non-operational tasks.", "超过 5,000 段示范；真机擦白板、开带闭门器的门各 25 次，最终 64%／52%，F/T 对照 60%／48%，各只差一次成功。已知 0.36／0.72 kg 负载主要验证重力大小，不能代替任意六维接触力标定。": "More than 5,000 demonstrations; the real robot wiped the whiteboard and opened the door with a door closer 25 times each, with a final score of 64%/52% and a F/T comparison of 60%/48%, each missing only one success. It is known that the 0.36/0.72 kg load mainly verifies the magnitude of gravity and cannot replace any six-dimensional contact force calibration.", "G1与Booster T1人形；上下身联合训练、分别优化策略": "G1 and Booster T1 humanoids; upper and lower body joint training, separate optimization strategies", "输入：机器人和物体的状态估计、物体模型、任务评分规则，例如轮胎离直立状态还有多远。 输出：短期身体速度、臂关节目标等命令；已有的低层控制器把这些命令转成全身关节目标。": "Inputs: robot and object state estimates, object models, task scoring rules, such as how far the tires are from upright. Output: short-term body speed, arm joint target and other commands; the existing low-level controller converts these commands into whole-body joint targets.", "没有完整物体接触力模型，需接上力与柔顺评价。": "There is no complete object contact force model, and force and compliance evaluation need to be connected.", "论文说‘策略输出动作’时，输出可能只是关节角度目标。相同神经网络结构接不同底层控制器，会产生不同接触响应。": "When the paper says ‘strategy output action’, the output may only be the joint angle target. The same neural network structure connected to different underlying controllers will produce different contact responses.", "Deep WBC参考部分不随height/roll/pitch；UMI使用任务轨迹；Multi-Terrain保持身体位置与重力朝向；ReCo预测身体运动再协调臂。不能据各自误差直接排名。": "The Deep WBC reference part does not follow height/roll/pitch; UMI uses task trajectory; Multi-Terrain maintains body position and gravity orientation; ReCo predicts body movement and then coordinates the arm. cannot be directly ranked according to their respective errors.", "Dynamic Pick-and-Place §III-C引用Pose Tracking借鉴关键点表示；这里对象中心／上下端三点共线，只描述直立轴，不是完整6D位姿或控制器复制。": "Dynamic Pick-and-Place §III-C refers to Pose Tracking and uses key point representation; here the three points of the object center/upper and lower ends are collinear, and only describe the vertical axis, not a complete 6D pose or controller copy.", "Unitree B2＋结构加强的 Unitree Z1 Pro；全身动态操作": "Unitree B2 + structurally reinforced Unitree Z1 Pro; full body dynamic operation", "fixedtrot/swinglegsnotarbitrarymask；loadlearnedrealdata；stonebranch纯障碍规避，不是物体操作；小量trials": "fixedtrot/swinglegsnotarbitrarymask; loadlearnedrealdata; stonebranch is pure obstacle avoidance, not object manipulation; small number of trials", "共同子问题": "Shared subproblem", "FWBC-VLA 将关节残差构造成接触强度 tokens 影响 π0.5，并另做身体速度补偿；HMC 以控制器模式和参数学习柔顺。前者是 VLA 接触条件与补偿接口，后者的基准策略本身不是 VLA。两者的平台为轮足与人形，均不因力通道存在而自动具备物理力标定或任意接触安全。": "FWBC-VLA constructs the joint residuals into contact strength tokens that affect π0.5, and additionally performs body speed compensation; HMC learns compliance with the controller mode and parameters. The former is a VLA contact condition and compensation interface, and the latter's baseline strategy is not VLA itself. The two platforms are wheel-footed and human-shaped, and neither of them automatically has physical force calibration or arbitrary contact safety due to the existence of force channels.", "控制模式与参数学习": "Control mode and parameter learning", "释放时刻不确定时，怎样仍命中目标": "Robust throwing under uncertain release timing", "这些名称不是严格互斥：全身逆动力学可以放进 MPC；RL 可以近似执行控制器，也可以仅给模型控制器参考。辨别方法应看被优化的变量、预测模型、重算周期和哪些约束真的进入在线求解。": "These names are not strictly mutually exclusive: whole-body inverse dynamics can be put into the MPC; RL can be used to approximate the execution controller, or it can just be used as a reference for the model controller. The identification method should look at the variables being optimized, the prediction model, the recalculation period and which constraints actually enter the online solution.", "冻结抗臂扰动步态，高层控制body姿态及臂关节": "Freeze anti-arm disturbance gait, high-level control of body posture and arm joints", "历史监督估计身体速度／摩擦，与人为行为条件不同": "History supervision estimates body speed/friction, different from human behavior conditions", "行走方法基础：控制接口与训练（非四足＋臂控制器）": "Locomotion foundations: control interfaces and training (no arm)", "跨机器人统一数据与模型": "Unify data and models across robots", "Force-aware RL 估计器、FWBC-VLA 的 contact strength tokens 和 FALCON 的隐式适应使用不同量；不能用‘都有力信息’归为同一种物理估计。": "The Force-aware RL estimator, FWBC-VLA's contact strength tokens, and FALCON's implicit adaptation use different quantities; cannot be lumped together into the same physical estimate by 'all having force information'.", "正文 §III–V 完整方法、结果、结论；附录标题/评价说明部分核对，未完整精读所有附录": "Text §III–V Complete methods, results, and conclusions; Partial verification of appendix titles/evaluation descriptions, incomplete reading of all appendices", "相较不交流的腿臂策略，身体会主动帮助扩大末端可达范围；同时研究了高维联合训练和仿真到真机的适应。": "Compared with the non-communicative leg-arm strategy, the body will actively help expand the reachable range of the terminal; at the same time, the adaptation of high-dimensional joint training and simulation to real robots was studied.", "推箱子、移椅子仿真比较单价值网络／多价值网络与有无权重调度；主要对照均使用接触引导奖励。真机四种未见 IKEA 物体合计 40/58 次成功（约 69%），其中两种是少量边界案例。另有洗碗机门的接触切换分析。": "Simulation of pushing boxes and moving chairs to compare single-value network/multi-value network with and without weight scheduling; the main comparison uses contact guidance rewards. The four unseen IKEA objects on the real robot totaled 40/58 successes (about 69%), two of which were a handful of edge cases. There is also a contact switching analysis of the dishwasher door.", "全部路线": "All approaches", "作者全文核心方法、主要实验与限制核读；§III-A–D；Algorithm 1；§IV-A–C；Tables I–III；未运行代码／观看视频，附录覆盖按定位记录": "The author’s full text core methods, main experiments and restrictions; §III-A–D; Algorithm 1; §IV-A–C; Tables I–III; not running the code/watching the video, the appendix covers recording by positioning", "是优势估计，": "is the advantage estimate,", "$\\xi$ 是参考轨迹，$\\varphi_t$ 是参考进度；$\\Delta\\varphi_t$ 可由状态规则或策略调节。允许暂停或回退，改变的是参考推进，而不是重新搜索一条完整接触计划。": "$\\xi$ is the reference trajectory, $\\varphi_t$ is the reference progress; $\\Delta\\varphi_t$ can be adjusted by state rules or policies. Pause or rewind is allowed, and what changes is the reference advancement rather than re-searching for a complete contact plan.", "ReCo 的训练参考系统和部署辨识模型不是完全相同的阶次；其中速度 lag 与步态相位摆动是不同部分。减少摆动和预测摆动后补偿也不同。它没有完整物体接触动力学，所以位置改善仍需另测力与接触表现。": "ReCo’s training reference system and deployment identification model are not of exactly the same order; the speed lag and gait phase swing are different parts. Compensation also differs between reduced swing and predicted swing post-compensation. It does not have complete object contact dynamics, so position improvement still requires additional measurement of force and contact performance.", "需要腕部力传感器，与当前无力传感器的平台条件不同。安全集的实现采用离散采样、按轴计算和近邻查询；实验支持指定模型／约束下的参考过滤，不能外推为完整四足接触系统的任意碰撞安全保证。": "Requires a wrist force sensor, which is different from the current platform conditions without force sensors. The safety set is implemented using discrete sampling, axis-wise calculations and nearest neighbor queries; the experiment supports reference filtering under specified models/constraints and cannot be extrapolated to arbitrary collision safety guarantees for a complete quadruped contact system.", "输入用户语言命令及当前候选技能；语言模型提供任务相关性，技能价值函数估计可行性，选技能循环执行。": "Input user language commands and current candidate skills; the language model provides task relevance, the skill value function estimates feasibility, and selects skills for loop execution.", "是按动作策略边缘化后的分布。离散动作时积分改为求和。": "is the distribution after marginalization according to the action strategy. For discrete actions, the integral is changed to a summation.", "通用方法／机械臂": "General Method/Robotic Arm", "OpenVLA数据配比节明确采用Octo对通过初筛的数据集的混合权重启发；未复制Octo的动作架构。": "The OpenVLA data matching section explicitly uses Octo's hybrid weight inspiration for the data sets that passed the preliminary screening; Octo's action architecture is not copied.", "固定低层时，上层无法直接纠正低层没有覆盖的姿态或接触动作。若允许任务微调低层，可突破部分限制，但需重新验证稳定性。Athletic 的 No-E2E 与完整微调比较正是这个权限区别，而不是简单比较两个网络大小。": "When the lower layer is fixed, the upper layer cannot directly correct the posture or contact action that is not covered by the lower layer. If the task is allowed to fine-tune the lower layers, some limitations can be overcome, but the stability needs to be re-verified. Athletic's No-E2E vs. full fine-tuning comparison is exactly this permissions difference, rather than simply comparing two network sizes.", "先用Contact-GraspNet生成候选，在对象坐标中保存top-30抓取。教师将候选随当前对象位姿变换，并用点云／位姿query与候选key/value注意力生成抓取表示，再以RL学任务动作。冻结教师，在学生自身到达状态上用DAgger取教师标签；两视角共享CNN后分别进行时序Transformer编码，再融合动作。基准用移动小平台承载对象，分速度和2D/3D随机运动4级。": "First use Contact-GraspNet to generate candidates and save the top-30 grabs in object coordinates. The teacher transforms the candidate with the current object pose, uses point cloud/pose query and candidate key/value attention to generate a grasp representation, and then uses RL to learn task actions. Freeze the teacher and use Dagger to get the teacher label on the student's own arrival status; the two perspectives share the CNN and perform sequential Transformer encoding respectively, and then fuse the actions. The benchmark uses a small mobile platform to carry objects, with four levels of speed and 2D/3D random motion.", "加权 PCA 中心＋三轴正负端点共七点表示目标；各点的 Kalman filter 结合视觉里程计更新 ego-motion，遮挡历史训练模拟视野外漂移。这里的 sigma points 是几何点，不是 UKF 的统计传播点。": "The weighted PCA center + the positive and negative endpoints of the three axes represent a total of seven points to represent the target; the Kalman filter at each point is combined with the visual odometry to update the ego-motion, and occlusion historical training simulates drift outside the field of view. The sigma points here are geometric points, not statistical propagation points of UKF.", "模型训练和动作策略训练是不同目标。若预测漏掉物体碰撞或接触力峰值，训练回报可能变高而真实操作变差，因此应独立核验这些事件的预测与真机结果。": "Model training and action strategy training are different goals. If predictions miss object collisions or contact force peaks, the training return may be higher and the real operation worse. Therefore, the predictions of these events should be independently verified against the real robot results.", "约39.5% improvement对应force-aware整个pipeline；baseline同时去force observation和force command，非独立force estimator消融；G1不是手臂接触任务证据": "About 39.5% improvement corresponds to the entire force-aware pipeline; the baseline removes force observation and force command at the same time, and the independent force estimator is ablated; G1 is not evidence of arm contact tasks", "RL feedback 与 low-gain PD": "RL feedback and low-gain PD", "方法／真机长程任务": "Method/real robot long-range mission", "分割、物体位姿和语义标签是否由人工、外部模型或部署传感器提供，需分别记录。": "Whether segmentation, object pose, and semantic labels are provided by humans, external models, or deployed sensors need to be recorded separately.", "未知外力适应": "Adaptation to unknown external forces", "不能写已保证持续跨步精细接触安全；chip任务不区分P2/P3/P4；28.54% summary并非每个新增模块独立收益": "Unable to write to ensure continuous step fine contact security; chip tasks do not distinguish between P2/P3/P4; 28.54% summary is not an independent income of each new module", "【真机＋仿真】ANYmal在户外多季节复杂地形行走，并报告阿尔卑斯山区长时徒步；Science Robotics 2022。": "[real robot + simulation] ANYmal walked outdoors on complex terrain in multiple seasons, and reported long-term hiking in the Alps; Science Robotics 2022.", "技能库的覆盖范围决定可执行步骤；本库多数引用仅作语言规划背景，WildLMa未证实直接采用SayCan的评分公式。": "The coverage of the skills library determines the executable steps; most of the references in this library are only for language planning background, and WildLMa has not confirmed that it directly uses SayCan's scoring formula.", "训练时让走路策略对相同指令有更一致的响应；对固定策略辨识闭环指令响应模型；MPC 再用这个模型共同规划移动指令和臂轨迹。关键不是给臂加更强的跟踪增益，而是让底盘成为规划器可预测的受控对象。": "During training, the walking strategy has a more consistent response to the same instructions; a closed-loop instruction response model is identified for the fixed strategy; MPC then uses this model to jointly plan movement instructions and arm trajectories. The key is not to add stronger tracking gain to the arms, but to make the chassis a predictable and controlled object for the planner.", "有些方法明确估计力的大小和方向；另一些只把这些信号交给策略，让策略学会使用。任务成功率提高说明这条信息通路有用；要证明估计的力准确，还需要与参考力传感器比较，并覆盖不同姿态、速度、负载和接触位置。": "Some methods explicitly estimate the magnitude and direction of the force; others simply give these signals to the strategy and let the strategy learn to use them. Improved mission success rates demonstrate the usefulness of this information pathway; proving that the estimated force is accurate requires comparison to a reference force sensor and covering different attitude, speed, load, and contact locations.", "§VI-C：异步timestamp；§VII：实机实验与消融": "§VI-C: Asynchronous timestamp; §VII: real robot experiment and ablation", "身体会随坡面和台阶改变高度、俯仰；目标若只跟着身体坐标采样，容易把地形变化错误传给手的任务。": "The body will change height and pitch along with slopes and steps; if the target only samples the body coordinates, it is easy to mistransmit terrain changes to the hand task.", "执行器消融固定臂以避免腿失稳，不能作为完整全身所有模块消融；参考与对象任务由人工设计；计时只表示执行过，不验证投球成功。": "The actuator ablates the fixed arm to avoid leg instability and cannot be used as ablation of all modules of the complete body; the reference and object tasks are manually designed; the timing only indicates execution and does not verify the success of the pitch.", "行为条件策略、足间相位时钟与步态奖励": "Behavioral conditioning strategies, interfoot phase clock and gait rewards", "Accurate Throwing依当前末端状态求加速度修正以减小落点误差；只有模型与实际跟踪足够准确、剩余时间足够时，才可能保持有效集合。不能从此推出任意物体或接触任务的硬保证。": "Accurate Throwing calculates acceleration correction based on the current terminal state to reduce the landing point error; only when the model and actual tracking are accurate enough and the remaining time is sufficient, it is possible to maintain an effective set. Hard guarantees for arbitrary objects or contact tasks cannot be derived from this.", "可操作区域、接触目标与动作参数": "Affordance regions, contact targets, and action parameters", "还有动作级信用分配：Deep WBC让移动与操作优势分别影响腿／臂动作，再逐步混合；Multi-critic twist把各目标归一化优势一起更新策略；Contact-guided按训练迭代调节相对权重。评价分解、动作分组和权重调度应分别对照。": "There is also action-level credit allocation: Deep WBC allows movement and operation advantages to affect leg/arm movements respectively, and then gradually mix them; Multi-critic twist updates the strategy together with the normalized advantages of each target; Contact-guided adjusts the relative weight according to training iterations. Evaluation decomposition, action grouping and weight scheduling should be compared separately.", "仿真闭环预测对照": "Simulation closed-loop prediction comparison", "固定采用对角小跑，先训练底层跟踪由步态发生器生成的正常足轨迹与 Bézier 残差之和；残差只加在摆动足，支撑足参考不变。高层任务策略再选择残差曲线的控制点。这里的残差是足端轨迹修正，并非关节力矩补偿，也非任意支撑模式下的足端控制。": "Fixed using diagonal trot, first train the bottom layer to track the sum of the normal foot trajectory generated by the gait generator and the Bézier residual; the residual is only added to the swing foot, and the support foot reference remains unchanged. The high-level task strategy then selects the control points of the residual curve. The residual here is the foot trajectory correction, not the joint moment compensation, nor the foot control in any support mode.", "上一类规划算出的动作可行，但物体参数不准、手滑或机器人被推时，照着原计划执行容易失败。": "The actions calculated by the previous type of planning are feasible, but when the object parameters are inaccurate, the hand slips, or the robot is pushed, the execution of the original plan is likely to fail.", "怎样给低成本臂使用力或触觉信息？": "How can a low-cost arm use force or tactile information?", "方法／真机评估": "Method/real robot evaluation", "相较把各项奖励固定混合，按当前稳定和行走表现调整操作权重；与 TA-WBC 相比，部署策略不用显式地形图，臂也由策略输出。": "Compared with a fixed mix of various rewards, the operation weight is adjusted according to the current stability and walking performance; compared with TA-WBC, the deployment strategy does not require an explicit terrain map, and the arms are also output by the strategy.", "姿态请求协作": "Gesture request for cooperation", "是监督损失；第一式表示点预测行为克隆的基本目标。概率动作模型可采用相应分布学习目标，不应把所有扩散训练都写成该点预测损失。": "is the supervision loss; the first expression represents the basic goal of point prediction behavior cloning. The probabilistic action model can adopt the corresponding distribution learning target, and all diffusion training should not be written as this point prediction loss.", "导航与操作分阶段，非接触中持续移动/换步实验；每任务五次，统计方差大；80%不是全链路表现；velocity head 是否实际进入部署低层控制描述不充分；无校准峰值接触力或触觉安全实验": "Navigation and operation are staged, continuous movement/step change experiment in non-contact; five times per task, large statistical variance; 80% is not full-link performance; insufficient description of whether the velocity head actually enters and deploys low-level control; no calibrated peak contact force or tactile safety experiment", "个接触处环境作用在机器人上的力。例如左前足的": "The force of the environment acting on the robot at the contact point. For example, the left front foot", "操作研究固定臂目标和底层增益，变化步频／相位／身体姿态，记录手端误差、接触峰值、足滑移与完成时间；不要只用生存率。": "Operate and study fixed-arm targets and underlying gain, vary cadence/phase/body posture, record hand-end error, contact peak, foot slip and completion time; don't just use survival rate.", "文本—图像相似度只给语义线索": "Text-image similarity only gives semantic clues", "已建立抓取，非navigation/reach/grasp；归一化tactile不能保证绝对graspforce threshold；servoarm限制动态范围": "The crawl has been established, not navigation/reach/grasp; the normalized tactile cannot guarantee the absolute grapeforce threshold; the servoarm limits the dynamic range", "手端在世界中的位置由身体位置、身体旋转以及臂的正运动学共同决定。若目标固定在身体坐标系，控制器可以正确跟踪这个目标，同时让手端在世界中移动。若物体固定在世界，则应把物体参考经当前身体位姿转换后交给控制器，或直接采用世界／任务坐标的跟踪误差。": "The position of the hand in the world is determined by a combination of body position, body rotation, and the forward kinematics of the arm. If the target is fixed in the body coordinate system, the controller can correctly track the target while allowing the handheld device to move in the world. If the object is fixed in the world, the object reference should be converted from the current body pose and handed to the controller, or the tracking error of the world/task coordinates should be used directly.", "轮式底盘＋双臂同步遥操作采集": "Wheeled chassis + dual-arm synchronous remote operation acquisition", "VLA 动作模型": "VLA action model", "显式质量／接触历史估计与潜变量适应对照": "Explicit mass/exposure history estimates versus latent variable adaptation", "冻结低层后辨识；变换策略、步态、延迟或负载需复核模型。不能把响应一致性训练理解成普遍消除所有扰动。": "Freeze the lower layer and then identify it; the model needs to be reviewed when changing strategy, gait, delay or load. Response consistency training cannot be understood as universally eliminating all perturbations.", "自研四足＋Unitree Z1；真机Vicon状态；100 Hz腿／50 Hz任务策略": "Self-developed quadruped + Unitree Z1; real robot Vicon status; 100 Hz legs/50 Hz mission strategy", "移动底盘需要全局视野和速度控制，机械臂需要局部视觉与准确位置控制。把这些输入和目标全部交给一个示范策略，可能难以同时学好；拆开后又需要协调身体站位与臂操作。": "The mobile chassis requires global vision and speed control, and the robotic arm requires local vision and accurate position control. Giving all these inputs and goals to a demonstration strategy may be difficult to learn at the same time; after taking them apart, you need to coordinate the body position and arm operation.", "世界模型与搜索必须预测实际闭环执行": "Planning models must predict the closed-loop robot", "行走与臂操作若分别规划，难同时处理身体、足、手与被操作物体的动力学耦合。": "If walking and arm operation are planned separately, it will be difficult to handle the dynamic coupling of the body, feet, hands and the operated object at the same time.", "是目标高度，": "is the target height,", "SAC、教师蒸馏、KL 模仿、分层行走控制与 U-Net 视觉瓶颈基于已有方法；低层本体不含臂状态/目标；实机为抑制晃动进一步去掉臂信息，并非末端感知的全身力控制": "SAC, teacher distillation, KL imitation, hierarchical walking control and U-Net visual bottleneck are based on existing methods; the low-level ontology does not contain arm status/target; the actual machine further removes arm information to suppress shaking, and is not a whole-body control of end-sensing", "使用 SRB 行走模型、非线性 WBC、力矩控制、CasADi／IPOPT 和 Raibert 落足启发式。": "Use the SRB walking model, nonlinear WBC, moment control, CasADi/IPOPT, and Raibert's landing heuristic.", "小机器狗背上较重的臂时，把臂当成固定附加重量，会漏掉臂运动对身体平衡的影响。": "When the small robot dog carries a heavier arm on its back, treating the arm as a fixed additional weight will miss the impact of arm movement on the body's balance.", "门、抽屉和柜体机构不同，直接把大图像送入 RL 难以充分利用少量数据。输入把手与面板的简化几何、自身状态和交互历史；输出全身开门／拉抽屉动作。": "Doors, drawers and cabinets have different mechanisms, so it is difficult to make full use of small amounts of data by sending large images directly to RL. Input the simplified geometry, self-state and interaction history of the handle and panel; output the whole-body door opening/pull drawer action.", "Agibot X2 真机搬袋／箱与推 50 kg 车。Table 2 的78%为六个子目标均值；最终袋13/25、箱17/25、车22/25，不能混成整体78%端到端成功率。连续速度对照还改变课程／奖励，不能只归因离散动作。": "Agibot X2 real robot moves bags/boxes and pushes 50 kg cart. The 78% in Table 2 is the average of the six sub-goals; the final bag 13/25, box 17/25, and car 22/25 cannot be mixed into the overall end-to-end success rate of 78%. Continuous speed contrast also changes the course/reward that cannot be attributed solely to discrete actions.", "DINO特征、VQ-VAE LAM、VLA/robot action decoder与低层RL行走是基础框架；潜操作与潜移动分开表示不意味着实际腿臂物理独立；低层专门训练臂扰动响应": "DINO features, VQ-VAE LAM, VLA/robot action decoder and low-level RL walking are the basic framework; separate representation of latent operations and latent movements does not mean that the actual legs and arms are physically independent; the low-level layer is dedicated to training arm disturbance response", "是释放位置的水平与竖向分量；": "are the horizontal and vertical components of the release position;", "全身式是一条受力记账关系，还不是完整的可部署估计器：直接计算需要模型、加速度、实际电机力矩和已知接触作用。WBC 算出的足力不等于独立测得的足力；使用估计值时，误差会进入残差。广义动量观测器等方法利用额外的观测器与滤波结构处理估计问题，不能把它们与直接代入公式混为一谈。": "Full body is a force accounting relationship and is not yet a complete deployable estimator: direct calculation requires model, acceleration, actual motor torque and known contact effects. The WBC-calculated full force is not equal to the independently measured full force; when estimates are used, the error enters the residuals. Methods such as generalized momentum observers use additional observers and filtering structures to handle estimation problems, and they should not be confused with direct substitution into the formula.", "在受控仿真的五种物体中共用代价，比较端到端 MPC／RL 和分层 RL；Spot 实机八种任务各十次，包括轮胎扶正／堆叠、拖障碍。G1 只有仿真。": "Compare end-to-end MPC/RL and hierarchical RL by sharing costs among five objects in controlled simulation; Spot performs eight tasks on the real robot ten times each, including tire centering/stacking and towing obstacles. G1 only emulates.", "执行过、完成了与记忆可观测性": "Attempted, completed, and observed: what memory can tell us", "每次真机试验开始人工点击目标，至少一个相机需要看见目标；分割深度去掉很多颜色语义；训练约束夹爪闭合时基座速度为零；没有证明持续接触中换步的安全；固定高度/yaw 参考系不是完整世界锁定的接触目标；低层跟踪不提供接触力上界": "Manually click on the target at the beginning of each real-machine test, and at least one camera needs to see the target; a lot of color semantics are removed from the segmentation depth; the base speed is zero when the training constraint gripper is closed; the safety of changing steps during continuous contact is not proven; the fixed height/yaw reference frame is not a complete world-locked contact target; low-level tracking does not provide an upper bound on the contact force", "沿用 BeyondMimic 的跟踪问题和主要奖励；与 SONIC 的大规模 PPO 对照。可微学习动力学本身已有 ControlVAE、SuperTrack、SuperDyno 等先例。": "Inherit BeyondMimic’s tracking issues and main rewards; compare with SONIC’s large-scale PPO. Differentiable learning dynamics itself has precedents such as ControlVAE, SuperTrack, SuperDyno, etc.", "把机械臂结构选择与全身控制一起设计，研究少自由度臂如何利用四足底盘移动补足工作空间，而不只在固定六自由度硬件上调控制参数。": "Design the robot arm structure selection together with the whole body control, and study how the low-degree-of-freedom arm can use the four-legged chassis to move to supplement the work space, instead of just adjusting the control parameters on the fixed six-degree-of-freedom hardware.", "DECOWAM联合建模未来视频与动作，但没有据预测视频作显式在线MPC搜索；生成模型和预测规划应按实际执行图区分。": "DECOWAM jointly models future videos and actions, but there is no explicit online MPC search based on the predicted videos; the generated model and predictive planning should be distinguished according to the actual execution graph.", "输入：上层看分割后的深度图和自身状态；下层接收身体速度、末端姿态目标及机器人状态。 输出：上层给身体速度和末端目标；下层学习策略输出腿关节角度，臂关节角度由几何求解得到。": "Input: The upper layer looks at the segmented depth map and its own status; the lower layer receives the body speed, end attitude target and robot status. Output: The upper layer gives the body speed and end target; the lower layer learning strategy outputs the leg joint angle, and the arm joint angle is obtained by geometric solution.", "整体成功与效率之别": "The difference between overall success and efficiency", "是状态潜在函数，": "is the state potential function,", "§III-A SAFE；其中Remark 3.1与Eq.(1)为KL数据处理论证": "§III-A SAFE; Remark 3.1 and Eq.(1) are KL data processing demonstrations", "§III-A–D；§IV；结论与参考文献": "§III-A–D; §IV; Conclusion and References", "这里强调任务分工，没有指定统一的看向约束、优先级或控制器。主动视线、固定多相机和三维位置编码应独立比较。": "The division of tasks is emphasized here, and unified looking constraints, priorities or controllers are not specified. Active line of sight, fixed multi-camera, and 3D position encoding should be compared independently.", "RB-Y1全向轮式底盘＋双臂＋6DoFtorso＋2DoFneck，轮式邻接；不是legged humanoid": "RB-Y1 omnidirectional wheeled chassis + arms + 6DoFtorso + 2DoFneck, wheeled adjacent; not legged humanoid", "论文都写PPO、critic和reward时，应知道这些是训练工具，不能把用了同一种算法当成相同控制方法，也不能把回报更高直接当成任务更可靠。": "When the paper writes about PPO, critic and reward, you should know that these are training tools. The use of the same algorithm cannot be regarded as the same control method, nor can higher returns be directly regarded as more reliable tasks.", "ANYmal＋机械臂＋hook；部署门状态来自MoCap或外部相机AprilTag": "ANYmal＋Robotic arm＋hook; Deployment door status comes from MoCap or external camera AprilTag", "固定模型比较 H／M、平滑、异步推理和反馈通道，测动作 jerk、延迟、峰值力、任务时间和成功率。": "Fixed model comparison of H/M, smooth, asynchronous inference and feedback channels, measuring action jerk, latency, peak force, task time and success rate.", "$d_{\\mathcal D}$ 是示范观测分布，$d_{\\pi_\\theta}$ 是策略自身执行产生的观测分布。二者通常不同，小误差会改变后续状态；更多离线数据不自动覆盖所有闭环偏离。": "$d_{\\mathcal D}$ is the demonstration observation distribution, and $d_{\\pi_\\theta}$ is the observation distribution generated by the execution of the strategy itself. The two are usually different in that small errors will change subsequent states; more offline data does not automatically cover all closed-loop deviations.", "后作明确把其低层控制、奖励或实现作为基础：Interactive Navigation、DQ-Net、Deployment Framework。三者分别研究推物导航、动态对象抓取和部署，说明执行器能跨任务复用。": "Later games explicitly base their low-level controls, rewards or implementations on: Interactive Navigation, DQ-Net, Deployment Framework. The three study object navigation, dynamic object grabbing and deployment respectively, indicating that actuators can be reused across tasks.", "Deep WBC 的 ROA 还限制特权表示使用历史可预测的信息，不能简化成对固定教师的普通对称拟合。学生是否覆盖自身行为产生的状态，需另行验证。": "Deep WBC's ROA also restricts the privileged representation to use historically predictable information and cannot be reduced to an ordinary symmetric fit to a fixed teacher. Whether students cover the status generated by their own behavior needs to be verified separately.", "实际力矩反馈需标定，不能直接用期望力矩代替；需确认电流换算、内部过滤和通信延迟。模型必须覆盖当前实际运动、负载与身体运动。全身残差还依赖足接触的处理：足力未知时，足底作用和手端作用可能混在一起。接触位置与力的可辨识方向必须另外确认。": "The actual torque feedback needs to be calibrated and cannot be directly replaced by the expected torque; current conversion, internal filtering and communication delay need to be confirmed. The model must cover current actual movements, loads and body movements. Whole-body residuals also depend on the treatment of foot contact: when foot strength is unknown, plantar and hand effects may be mixed. The contact position and the discernible direction of the force must be confirmed separately.", "OpenHEART 用低维机构特征和在线估计，让策略适应不同 articulated objects。本体分支仅在对象开始运动后监督，再与视觉分支按阶段门控融合；融合并非在每阶段都优于单分支。ETH 的已知物体模型与 Guided RL 的对象参数随机化提供不同假设。Guided RL 附录将把手当固定链接，完整锁扣机制训练的效果有限，所以开门演示不能自动覆盖解锁阶段。": "OpenHEART uses low-dimensional mechanism features and online estimation to adapt the strategy to different articulated objects. The proprioceptive branch is only supervised after the object starts to move, and then fused with the visual branch in a stage-gated manner; fusion is not better than a single branch at every stage. ETH's known object model and Guided RL's object parameter randomization provide different assumptions. The Guided RL appendix uses the handle as a fixed link, and the training effect of the complete locking mechanism is limited, so the door-opening demonstration cannot automatically cover the unlocking stage.", "以剩余可承受力、末端可达性、底盘移动能力与建立接触成本来评估候选；先筛不可行项，再用相近接触分组及局部敏感度近似减少反复优化。它把“要不要靠、靠哪里”作为显式决策，与预设额外接触的控制方法有区别。": "Evaluate candidates based on residual affordability, terminal accessibility, chassis mobility and cost of establishing contact; first screen infeasible items, and then use close contact grouping and local sensitivity approximate reduction to iteratively optimize. It takes \"whether and where to lean\" as an explicit decision-making, which is different from the control method that presets additional contacts.", "实验能支持什么": "What the experiments support", "相较只从自身状态间接估计力，直接读取夹爪内部接触；相较高低层触觉系统，重点是同一控制器协调动态抓持与身体运动。": "Compared with estimating force indirectly from its own state and directly reading the internal contact of the gripper; compared with higher-level tactile systems, the focus is on the same controller to coordinate dynamic grasping and body movement.", "柜门机构状态估计与底盘闭环响应建模分别处理操作准确性的不同来源。": "Cabinet door mechanism state estimation and chassis closed-loop response modeling respectively address different sources of operational accuracy.", "FT-WBC 在腿／臂协作接口上加入执行器故障感知后的身体姿态调整。": "FT-WBC adds body posture adjustment after actuator failure sensing to the leg/arm collaboration interface.", "task-space controller 与 manipulation policy": "task-space controller and manipulation policy", "使用 SRB 接触力分配、逆运动学、启发式步态、PD、PPO 与 QP 求解器。": "Use SRB contact force distribution, inverse kinematics, heuristic gait, PD, PPO and QP solvers.", "Guided RL引言“build upon ... framework from Sleiman et al.”；T-Mech综述[84]。已核实直接算法复用主要是Guided RL，不能说全领域默认使用此规划器。": "Guided RL introduction \"build upon ... framework from Sleiman et al.\"; T-Mech review [84]. It has been verified that direct algorithm reuse is mainly Guided RL, and it cannot be said that this planner is used by default in all fields.", "轮足操作导向终点": "Wheel foot operation guide end point", "mocapobject;realsharpturnodometryfailures；chairgeometrytrialcountsunequal；dishwashersection未明确truehardware": "mocapobject;realsharpturnodometryfailures;chairgeometrytrialcountsunequal;dishwashersectionunspecifiedtruehardware", "位置准确、保持接触与力准确分别是什么": "Position accuracy, contact maintenance, and force accuracy", "实际承接与仅作背景的关系分开登记在literature/foundations.md；原作固定双臂；单独引用ACT不表示已经解决底盘同步移动和接触稳定性。": "The relationship between the actual undertaking and the background only is registered separately in literature/foundations.md; the original work fixed both arms; citing ACT alone does not mean that the chassis synchronous movement and contact stability have been solved.", "人形": "Humanoid", "仿真每条件1024，模型／质量／速度／载荷比较；真机坡与台阶跟踪，40次完整粗糙地形导航抓取32次成功。分开8次失败原因。": "Simulation per condition 1024, model/mass/speed/load comparison; real robot slope and step tracking, 32 successful captures of 40 complete rough terrain navigations. Separate 8 failure reasons.", "仍需适当的目标运动预测；静止目标是其特殊情况。": "Proper target motion prediction is still required; stationary targets are a special case.", "VLA 综述": "VLA Overview", "控制输入出现几何偏差、刚度突变或物体突然释放时，测峰值力、回弹、稳态偏差、振荡和恢复时间。": "Measure peak force, rebound, steady-state deviation, oscillation and recovery time when there is a geometric deviation, stiffness mutation or sudden release of the object in the control input.", "特权教师／视觉学生、现成抓取检测、PPO、逆运动学和轨迹规划。": "Privileged Teacher/Vision Student, off-the-shelf grasp detection, PPO, inverse kinematics and trajectory planning.\nWhen", "第一式描述理想固定铰链，": "The first equation describes the ideal fixed hinge,", "区分动作历史、程序阶段和真实物理成功，不把所有 memory 合并。": "Distinguish between action history, program stage and real physical success, and do not merge all memories.", "需要说明提示是否由物体真值、几何模型、人工轨迹或在线观测提供，且是否部署仍依赖。": "It is necessary to explain whether the prompt is provided by the true value of the object, geometric model, artificial trajectory or online observation, and whether it is still dependent on deployment.", "$A_t$ 是在时刻 $t$ 生成的长度为 $H$ 的动作块，$a_{k\\mid t}$ 表示当时预测的第 $k$ 步动作；$u$ 是实际执行输入，仅执行前 $M$ 步后再更新。": "$A_t$ is an action block of length $H$ generated at time $t$, $a_{k\\mid t}$ represents the $k$th action predicted at that time; $u$ is the actual execution input, which is updated only after executing the first $M$ steps.", "Visual WBC附录的Regularized online adaptation；Terrain-Aware WBC ROA小节；TAC-LOCO §4。ROA和AM的继承不意味着照搬整套控制器。": "Regularized online adaptation of the Visual WBC appendix; Terrain-Aware WBC ROA subsection; TAC-LOCO §4. The inheritance of ROA and AM does not mean copying the entire set of controllers.", "直接沿用Open X-Embodiment数据；UMI on Legs及后续VLA论文引用作通用策略背景。": "Directly use Open X-Embodiment data; UMI on Legs and subsequent VLA papers are cited as general strategy background.", "上面两式是 CMP 的实际运行接口：$\\phi$ 根据状态和 ce. Each item represents navigation reachability, arm operability, field of view, collision and subsequent task conditions respectively;", "第一式描述理想固定铰链，$c$ 是轴上的点，$\\hat a$ 是轴方向，$\\theta$ 是转角，$R_{\\hat a}$ 是绕该轴的旋转；$p_0$ 是初始接触点位置。": "The first formula describes an ideal fixed hinge, $c$ is the point on the axis, $\\hat a$ is the axis direction, $\\theta$ is the rotation angle, $R_{\\hat a}$ is the rotation around the axis; $p_0$ is the initial contact point position.", "先固定低层控制器与任务，再比较高层结构；若联合微调低层，另列贡献和稳定性验证。": "First fix the low-level controllers and tasks, and then compare the high-level structures; if you jointly fine-tune the low-level ones, list the contributions and stability verification separately.", "机器人遥操作数据集中在实验室；人类第一视角视频覆盖多场景，却与人形机器人在视点和动作尺度上不一致。输入人类第一视角视频与少量机器人示范，输出视觉语言条件的全身动作块。": "Robot teleoperation data is concentrated in the laboratory; human first-person video covers multiple scenes, but is inconsistent with the humanoid robot in terms of viewpoint and action scale. Input human first-person video and a small number of robot demonstrations, and output visual language-conditioned whole-body action blocks.", "【仿真基准】连续控制和Atari；原论文没有四足＋臂真机。": "[Simulation benchmark] Continuous control and Atari; the original paper does not have a real four-legged + arm machine.", "综述，不提供新的控制器实验；全文和参考文献已可本地核查。": "Overview, no new controller experiments are provided; the full text and references are available for local verification.", "可解释行为条件作为高层／低层接口": "Interpretable behavioral conditions as high-level/low-level interface", "视觉轨迹规划": "Visual trajectory planning", "人形（移动操作邻接训练方法）": "Humanoid (adjacent whole-body training method)", "是任务目标，": "is the mission target,", "分别改变任务无关的材质／背景与任务相关的颜色／几何，比较真值表示、预测表示和原始图像策略；给出信息丢失的失败例。": "Change the task-independent material/background and the task-related color/geometry respectively, and compare the ground truth representation, prediction representation and original image strategy; give examples of failure of information loss.", "是实际低 ominal execution of the sliding door is 15.38%, and the adaptive phase+residual error is 96.33%. Success is defined as completing more than 95% of the demonstration progress; there are six consecutive real-machine tests for each task.", "冻结的PPO步态、分层推物、非对称critic、域随机化；历史估计思想不是新提出。": "Frozen PPO gait, hierarchical pushing, asymmetric critic, domain randomization; the idea of ​​historical estimation is not new.", "Opt2Skill的全阶轨迹优化、PPO/PD、预训练GR00T、非对称训练；力反馈参考FWBC-VLA／TA-VLA。": "Opt2Skill’s full-order trajectory optimization, PPO/PD, pre-training GR00T, asymmetric training; force feedback refers to FWBC-VLA/TA-VLA.", "预览通常来自高层模型或示范，在实时随机目标下不一定可得；错误预览会导致提前做错。": "Previews usually come from high-level models or demonstrations and are not necessarily available with real-time random targets; incorrect previews can lead to mistakes made in advance.", "不是把CLIP直接当控制器；区别于集中式扩散／ACT，是专用动作流加共享语义和阶段条件。论文明确受LatentToM启发并将其作基线。属于语言条件视觉动作学习邻接，不能等同π0式大规模预训练VLA或语言规划器选固定技能。": "It does not use CLIP directly as a controller; it is different from centralized diffusion/ACT in that it is a dedicated action stream plus shared semantics and stage conditions. The paper is explicitly inspired by LatentToM and used as a baseline. It belongs to language-conditional visual action learning adjacency and cannot be equivalent to π0-style large-scale pre-training VLA or language planner to select fixed skills.", "改变坐标表示本身不改变物理任务；但如果目标随身体重置、变换有延迟或误差定义随身体姿态改变，训练和反馈就会改变。Deep WBC 的高度／roll／pitch 不随动参考仍随水平位置与 yaw；UMI on Legs 的任务坐标轨迹有不同的保持要求，不能统称‘固定坐标系’。": "Changing the coordinate representation itself does not change the physical task; but if the target resets with the body, the transformation is delayed, or the error definition changes with the body posture, the training and feedback will change. The height/roll/pitch non-following reference of Deep WBC still follows the horizontal position and yaw; the mission coordinate trajectory of UMI on Legs has different maintenance requirements and cannot be collectively referred to as a 'fixed coordinate system'.", "是参考采样间隔。": "is the reference sampling interval.", "这些是机构几何关系，不是完整交互辨识算法。有限动作是否足以区分未知参数，需另行检验。": "These are mechanical geometric relationships, not complete interaction identification algorithms. Whether finite actions are sufficient to distinguish unknown parameters needs to be tested separately.", "§4 stationary Portela [8] 是2025 Whole-body end-effector pose tracking，不是2024 Learning Force Control（[11]）；应按题名/引用号区分同一作者的不同方法。部分比较复用本文 arm control 并替换 leg controller，不代表完整原系统直接比较。": "§4 stationary Portela [8] is 2025 Whole-body end-effector pose tracking, not 2024 Learning Force Control ([11]); different methods of the same author should be distinguished by title/citation number. Part of the comparison reuses the arm control in this article and replaces the leg controller, which does not represent a direct comparison of the complete original system.", "相对末端动作＋离散移动/夹爪的共同表示": "Relative end action + discrete movement/common representation of gripper", "跨平台动作适配与身体动力学稳定是不同问题；本库引用多数为背景，未核到四足＋臂论文直接使用Octo权重。": "Cross-platform action adaptation and body dynamics stabilization are different issues; most of the references in this library are background, and the quadruped + arm papers are not reviewed and Octo weights are used directly.", "是用于蒸馏的数据分布。潜变量监督、教师与适配器联合约束可有不同损失。": "is the data distribution used for distillation. Latent variable supervision, teacher and adapter joint constraints can have different losses.", "在线主要沿已有序列执行，偏离计划时恢复有限。": "Online execution mainly follows the existing sequence, and recovery is limited when it deviates from the plan.", "四足的身体不能像固定机械臂的底座那样被当作静止参考。手端碰到物体时，反作用力经过机械臂传到身体，再由足接触承担；抬腿也会改变可用的支撑。": "A quadrupedal body cannot be used as a static reference like the base that holds the robotic arm. When the hand touches an object, the reaction force is transmitted to the body through the robotic arm, and then borne by the foot contact; raising the leg will also change the available support.", "是转移误差损失。此式表示校准目标， edge. Click on a node to expand the sidebar; dashed lines only represent common subproblems.", "预测内含低层策略": "Forecast contains low-level strategies", "这是已经建立接触的一维线性弹性近似。$\\delta$ 定义为沿选定法向的压入量，$k_{\\mathrm{env}}$ 是环境刚度，$F_n$ 是机器人对环境的压缩力大小；机器人受到反向作用。": "This is a one-dimensional linear elastic approximation of established contact. $\\delta$ is defined as the amount of intrusion along the selected normal direction, $k_{\\mathrm{env}}$ is the environment stiffness, $F_n$ is the compression force of the robot on the environment; the robot is subject to the opposite effect.", "四足，无外挂臂；使用前足操作": "Four legs, no external arms; use front legs for operation", "同时报告未加权的跟踪、力、稳定与效率指标，比较单／多 critic 和固定／动态权重，保留多随机种子。": "Simultaneously report unweighted tracking, force, stability and efficiency metrics, compare single/multi-critic and fixed/dynamic weights, retain multiple random seeds.", "RSS2026本地正式PDF标题核对；完整主文的三阶段训练、架构、RTC、所有结果与局限已读。未运行开源实现。": "RSS2026 local official PDF title check; the three-stage training, architecture, RTC, all results and limitations of the complete main text have been read. The open source implementation is not running.", "已阅读响应训练／模型公式、策略感知 MPC、完整基准／基线设置、2×2 与预测／相位消融和真机章节。": "Read the Response Training/Model Formulation, Policy-Aware MPC, Full Benchmark/Baseline Setup, 2×2 vs. Prediction/Phase Ablation, and real robot chapters.", "示范监督与闭环数据分布": "Imitation learning and closed-loop distribution shift", "学生在环境中运行产生状态；专家给这些状态标注目标动作；输出更新后的学生策略。": "Students run in the environment to generate states; experts mark these states with target actions; and output the updated student strategy.", "近期交互参数估计": "Recent interaction parameter estimates", "需要力矩接口、准确模型和实时求解；真机规划使用外部电脑，不能直接当作轻量现成控制器。": "Requires torque interface, accurate model and real-time solution; real robot planning uses an external computer and cannot be directly used as a lightweight off-the-shelf controller.", "2026-10-23初步扩展摘要": "2026-10-23 Preliminary Extended Summary", "相较 WildLMa 的真实示教路线，重点改为纯仿真训练和低成本硬件； ing the end target in body coordinates moment by moment, the interference of body motion on the task trajectory is reduced; the operation demonstration does not need to include leg movements, nor does it need to be collected by the robot.", "本地 PDF 标题核对；主文完整，包括模型、蒸馏、数据统计、离线比较、真机与消融。未复算录像指标或运行作者实现。": "Local PDF title verification; the main text is complete, including model, distillation, data statistics, offline comparison, real robot and ablation. The recording indicators are not recalculated or implemented by the author.", "Go2＋AIRBOT（正文未说明型号）；3台RGB相机": "Go2＋AIRBOT (model not specified in the text); 3 RGB cameras", "四足背上较重机械臂时，把它当静止负载可能漏掉运动反作用；但完整模型更复杂，也不保证执行器和接触模型正确。": "When there is a heavy robotic arm on the quadruped back, treating it as a static load may miss the motion reaction; however, the complete model is more complex, and the actuator and contact models are not guaranteed to be correct.", "统一位置／力目标": "Unified position/force target", "已有 RL 行走策略给的是关节指令，而 WBC 要求的是满足动力学和接触约束的加速度、地面力与力矩；两者难以直接组合。": "The existing RL walking strategy gives joint instructions, while WBC requires acceleration, ground force and moment that meet dynamics and contact constraints; it is difficult to directly combine the two.", "RoboDuet 允许臂请求身体 roll／pitch；FALCON 的上下身策略共享观测但采用不同奖励；Terrain-aware WBC 的臂仍通过 IK 执行。它们都处理分工，但不是同一个学习结构。冻结步态后，操作层只能通过该步态已有的条件接口调节身体，不能通过重新训练扩展低层已有能力；冻结的条件策略仍可按mask／目标产生已有接触行为。": "RoboDuet allows the arm to request body roll/pitch; FALCON's upper and lower body strategies share observations but use different rewards; Terrain-aware WBC's arm still executes through IK. They both deal with division of labor, but are not the same learning structure. After freezing the gait, the operation layer can only adjust the body through the existing conditional interface of the gait, and cannot expand the existing capabilities of the lower layer through retraining; the frozen conditional strategy can still generate existing contact behaviors according to the mask/target.", "上面 of-bounds, distance between the center of mass of the arm and chassis, and collisions. The course starts from the initial state close to the target, and expands the initial distance as the tracking reward improves; instead of training walking and grabbing skills separately one after another.", "【真机＋仿真】ANYmal-D＋DynaArm。真机动捕20个平地目标：平均2.03 cm／2.86°；楼梯测试平均2.64 cm／3.64°。仿真10000目标检验表示与附加载荷，35目标比较MPC。MPC与RL的中位误差相近，MPC均值较差主要来自少数跨身体的卡住情况。": "[real robot + simulation] ANYmal-D + DynaArm. real robot captured 20 flat targets: average 2.03 cm/2.86°; staircase test average 2.64 cm/3.64°. Simulation of 10,000 targets to verify the representation with additional load, 35 targets compared to MPC. The median errors of MPC and RL are similar, and the poorer mean value of MPC mainly comes from a small number of stuck situations across the body.", "机身固定夹爪、腿上小臂、背载机械臂和足端操作具有不同权限，不能只按四足一类归并。": "The fixed gripper of the fuselage, the forearm on the leg, the carrying robot arm and the foot end operation have different permissions and cannot be classified into four categories.", "为移动操作的目标选择与动作接口提供分类，提出比较显式／隐式信息、闭环更新和实机评测的待验证问题。": "Provides classification for the target selection and action interface of mobile operations, and raises issues to be verified by comparing explicit/implicit information, closed-loop updates and real-machine evaluation.", "表示原示范与新场景。上式保持接近段的物体相对手端轨迹。": "Indicates the original demonstration and the new scene. The above formula maintains the relative hand trajectory of the object approaching the segment.", "共享全身状态与策略；按动作组混合操作/移动优势；同时学习并约束 privileged encoder 与 history adapter": "Share whole-body status and strategy; mix operation/movement advantages by action group; learn and constrain privileged encoder and history adapter at the same time", "训练随机化提高对变化的适应；在线估计显式更新当前对象；每次根据图像重算目标不一定完成物理辨识。": "Training randomization improves adaptation to changes; online estimation explicitly updates the current object; each time the target is recalculated based on the image, physical identification may not be completed.", "RL／全身执行": "RL / whole-body execution", "Appendix C.1 短任务含固定观察、10 cm 预对齐、线性夹取、任务运动序列，不能泛称无需动作规则。地图 waypoint 无碰撞不保证后续臂可达；小物体仍会因跟踪／视觉误差失败。VLM 规划不是直接生成连续关节的 VLA。": "Appendix C.1 The short task includes fixed observation, 10 cm pre-alignment, linear gripping, and task motion sequence, and cannot be generally referred to as no action rules. Collision-free map waypoints do not guarantee reachability of subsequent arms; small objects will still fail due to tracking/vision errors. VLM planning does not directly generate VLAs of continuous joints.", "跨机器人策略": "Cross-bot strategy", "推物过程中物体质量或地面摩擦改变，固定模型的 MPC 预测会偏，可能持续按原力度推而无法到达目标。": "If the object mass or ground friction changes during the pushing process, the MPC prediction of the fixed model will be biased, and the push may continue with the original force and fail to reach the target.", "$r_t$ 是奖励，$0\\leq\\gamma<1$ 是折扣，$Q^\\pi,V^\\pi$ 是动作与状态价值，$A^\\pi$ 是优势。有限回合可使用对应有限时域和终端定义。": "$r_t$ is the reward, $0\\leq\\gamma<1$ is the discount, $Q^\\pi,V^\\pi$ is the action and state value, and $A^\\pi$ is the advantage. Finite rounds can use corresponding finite time domain and terminal definitions.", "Whole-Body ID-MPC把全身逆动力学放在每个预测节点的路径约束中，通过Fatrop阶段稀疏结构达到80 Hz；同一问题的逆／前向表达会显著影响求解时间。它固定步态时序、优化落脚位置；末端力／速度由用户给定，不规划物体反应。": "Whole-Body ID-MPC puts whole-body inverse dynamics into the path constraints of each prediction node, reaching 80 Hz through the sparse structure of the Fatrop stage; the inverse/forward expression of the same problem will significantly affect the solution time. It fixes the gait sequence and optimizes the footing position; the terminal force/speed is given by the user and does not plan the object's reaction.", "真机三类 pick/place、每类十次，比较 NoKF、NoBSnoise 与人工；图中每个数未逐项复算；仿真主要成功定义为到达理想姿态并停下，非物理抓取成功；真机另做实际夹取；控制50 Hz、VO60 Hz、目标跟踪约5 Hz/200 ms，上游 Qwen API 使用离板算力；附录 A 先遥控扫描记录目标全局坐标，再转朝目标进入视野触发局部 servo；不是从零长距离自主探索": "Three types of pick/place on the real robot, ten times for each type, comparing NoKF, NoBSnoise and manual work; each number in the figure is not recalculated item by item; the simulation success is mainly defined as reaching the ideal posture and stopping, non-physical grasping success; the real robot does actual clamping; control 50 Hz, VO60 Hz, target tracking about 5 Hz/200 ms, the upstream Qwen API uses off-board computing power; Appendix A First remotely scan and record the global coordinates of the target, then turn towards the target and enter the field of view to trigger the local servo; it is not a long-distance autonomous exploration from zero.", "学习预测模型、将控制器放进仿真和辨识低阶响应是不同实现；不能仅以‘world model’名称把它们划成新旧代际。": "Learning the predictive model, putting the controller into simulation and identifying low-order responses are different implementations; they cannot be divided into old and new generations just by the name of ‘world model’.", "UMI on Legs用原始UMI示范和Diffusion Policy生成高层轨迹，用自己的四足全身跟踪执行；Visual WBC用DAgger蒸馏视觉学生，不能称DAgger本身完成了视觉四足操作；Deep WBC对照RMA并修改适应训练，不能把RMA说成背载臂控制器。": "UMI on Legs uses the original UMI demonstration and Diffusion Policy to generate high-level trajectories, and uses its own four-legged whole-body tracking to execute; Visual WBC uses DAgger to distill the visual student, and it cannot be said that DAgger itself has completed the visual quadruped operation; Deep WBC compares with RMA and modifies the adaptive training, and RMA cannot be said to be a back-mounted arm controller.", "移动底盘不是四足，执行器是轨迹优化而非 RL WBC；真机样本和成功率都不足以推断复杂接触任务已可靠解决。论文没有同硬件比较「只给手端」与「显式给底盘命令」。": "The mobile chassis is not four-legged, and the actuator is trajectory optimization rather than RL WBC; neither the real robot sample nor the success rate is sufficient to infer that the complex contact task has been reliably solved. The paper does not compare \"only for mobile devices\" and \"explicitly give chassis commands\" with hardware.", "$\\mathcal F_{\\mathrm{res}}$ 是该固定瞬时条件下仍可平衡的外力集合；$\\mathbb B(0,r)$ 是半径为 $r$ 的原点球。其内接球半径 $\\rho$ 表示方向无偏的最不利方向力余量。": "$\\mathcal F_{\\mathrm{res}}$ is the set of external forces that can still be balanced under this fixed instantaneous condition; $\\mathbb B(0,r)$ is the origin sphere with radius $r$. Its inscribed radius $\\rho$ represents the unfavorable directional force margin with no bias.", "这是固定站立时的腿运动学可行性，不是真实行走实验，也不是剩余施力能力指标。": "This is the feasibility of leg kinematics in a fixed stance, not a real walking experiment, nor an indicator of residual force application capacity.", "学习前置 → 后续": "Prerequisite → next concept", "多回报评价": "Multiple return reviews", "策略梯度每批数据只更新一次，样本利用率低；大步更新又容易破坏已有策略。": "The policy gradient is only updated once for each batch of data, resulting in low sample utilization; large-scale updates can easily destroy existing strategies.", "分别改变铰链轴、摩擦、回弹、锁扣与初始状态，报告参数／轨迹预测误差、完成率、作用力和重抓次数。": "Change the hinge axis, friction, rebound, lock and initial state respectively, and report the parameter/trajectory prediction error, completion rate, force and number of re-grasps.", "KL 数据处理不等式只说处理不增加分布可区分性，不能证明任务信息保留或泛化必改善。几何／本体交互历史不等于实测力，非语言 VLA，也未解决按钮成功事件记忆。": "The KL data processing inequality only states that processing does not increase distribution discriminability, and cannot prove that task information retention or generalization will be improved. Geometry/ontology interaction history does not equal measured force, non-linguistic VLA, and button success event memory is not addressed.", "四足双扩散策略协调与阶段语义有真机消融；目前两类抽屉任务，不宜把foundation-model命名当成基础范式证据。": "Four-legged double-diffusion strategy coordination and stage semantics have real robot ablation; currently, for the two types of drawer tasks, it is not appropriate to regard the foundation-model naming as evidence of the basic paradigm.", "移动示范": "Mobile demo", "全文按建模、任务分类和控制方法组织，讨论 WBC、MPC、RL/IL 及混合阻抗／力控制，并考虑地形、载荷、接触和感知延迟。": "The full text is organized by modeling, task classification, and control methods, discussing WBC, MPC, RL/IL, and hybrid impedance/force control, taking into account terrain, loading, contact, and sensing delays.", "正文 §3–4完整核心与discussion审读；附录 A 完整公式、C训练、D任务、E估计部分审读": "Text §3–4 Complete core and discussion review; Appendix A complete formula, C training, D task, E estimation part review", "准静态近似；整pipeline消融未隔离输入与输出贡献。": "Quasi-static approximation; full pipeline ablation does not isolate input and output contributions.", "较重臂 NMPC 的实际实现仍在预测时域内近似部分惯量并忽略某些科氏项；‘考虑臂动力学’不等于每项都完整保留。增加模型复杂度、做参数辨识和给闭环加误差补偿是不同改善途径，应通过误差来源与计算负担比较。": "Practical implementations of heavier arm NMPC still approximate partial inertia in the predicted time domain and ignore some Coriolis terms; 'considering arm dynamics' does not mean keeping everything intact. Increasing model complexity, performing parameter identification and adding error compensation to the closed loop are different ways to improve, and the error sources should be compared with the computational burden.", "包括机制实例、问题比较与反例，不声明首次发明。": "Includes mechanism examples, problem comparisons and counterexamples, without claiming first invention.", "在四足任务中对应建模假设、任务条件和 WBC/MPC/RL/IL 控制方法。": "Corresponds to modeling assumptions, mission conditions, and WBC/MPC/RL/IL control methods in a quadruped mission.", "DynaRetarget、PPO跟踪、扩散模型、SDPO自蒸馏启发、DA-MDP最大熵方法、对称数据扩增。": "DynaRetarget, PPO tracking, diffusion model, SDPO self-distillation inspiration, DA-MDP maximum entropy method, symmetric data amplification.", "$r_{\\mathrm{ext}}$ 是上述扣除后的广义力残差，不全是关节力矩。若剩下的主要只有一个未知接触，并且模型可信，才可用 $r_{\\mathrm{ext}}\\simeq J_c^\\top F_{\\mathrm{ext}}$ 近似解释它；否则它同时包含未知足力、手端作用和各种估计误差。": "$r_{\\mathrm{ext}}$ is the generalized force residual after the above deduction, not all joint moments. If there is mainly only one unknown contact left, and the model is credible, it can be approximately explained by $r_{\\mathrm{ext}}\\simeq J_c^\\top F_{\\mathrm{ext}}$; otherwise, it also contains unknown foot forces, hand effects and various estimation errors.", "身体朝向可用四元数等坐标表示，因此配置坐标与速度坐标不一定同维，不能一律写成 $v=\\dot q$。各力与 Jacobian 需使用相容坐标系。这条动力学关系本身不提供稳定性或安全保证。": "The body orientation can be expressed by coordinates such as quaternions, so the configuration coordinates and velocity coordinates are not necessarily in the same dimension and cannot be written as $v=\\dot q$. Each force and Jacobian need to use compatible coordinate systems. This dynamic relationship by itself provides no guarantee of stability or security.", "UMI手持示范与视觉Diffusion Policy思路，人体mocap全身先验；不声明复用UMI on Legs代码。": "UMI-style handheld demonstrations and visual Diffusion Policy, plus a human-mocap whole-body prior. Reuse of UMI on Legs code is not established.", "输入：当前图像、语言和机器人状态，包括身体速度；训练时另用真实后续图像作监督，部署不读取未来图像。 输出：一段未来动作和未来图像；动作的有效部分是六个臂目标、夹爪开口和三个身体速度，另四个维度只是数据接口补位。": "Input: current image, language and robot status, including body speed; real follow-up images are also used for supervision during training, and future images are not read during deployment. Output: a future action and future image; the effective parts of the action are the six arm targets, the gripper opening and the three body speeds, and the other four dimensions are just data interface fill-ins.", "本地 PDF 标题核对；主文完整，包括几何表示、机构估计、gate、策略、仿真与定性真机。": "Local PDF title check; the main text is complete, including geometric representation, mechanism estimation, gate, strategy, simulation and qualitative real robot.", "联合决策": "Joint decision-making", "ReLIC 由任务接口提供肢体 mask，操作端用 IK，其余肢体由 RL 支撑；Pedipulate 固定一条前腿操作；FT-WBC 根据故障改变姿态，但真机主要停步或先移动后操作。它们都改变可用支撑，发生原因和决策权限不同。": "ReLIC provides a limb mask from the task interface, IK is used on the operating end, and the rest of the limbs are supported by RL; Pedipulate fixes one front leg for operation; FT-WBC changes the attitude according to the fault, but the real robot mainly stops or moves first and then operates. They all change available supports, occur for different reasons and have different decision-making authority.", "相较只按位置训练，明确学习力跟踪，支持人推拉夹爪时身体自动配合；位置模式与力模式在训练中切换。": "Compared with training by position only, it clearly learns force tracking and supports the body to automatically cooperate when pushing and pulling the gripper; position mode and force mode can be switched during training.", "的原点球。其内接球半径": "’s original penalty kick. Its inner sphere radius", "未知力适应不等于期望力精确跟踪；负载行走不能证明开门时持续移动。": "Unknown force adaptation does not equal accurate tracking of expected force; load walking cannot prove continuous movement when opening the door.", "探索奖励在后期可能与真正任务冲突，例如一直靠着物体而不把它移动到目标。衰减提示权重、切换数据来源或用任务回报继续优化是不同办法。潜在函数塑形有保持最优策略的条件，任意接近奖励并没有同样保证。": "The exploration reward may conflict with the real task in the later stage, such as keeping leaning on the object without moving it to the target. Decreasing prompt weights, switching data sources, or using task rewards to continue optimization are different approaches. Potential function shaping has the condition to maintain the optimal strategy, and arbitrarily approaching the reward does not have the same guarantee.", "接触候选、靠近目标奖励、因果影响指标、已有示范和可用技能都可缩小探索空间。这些提示所提供的信息量不同：候选接触点只告诉哪里值得尝试，一条完整轨迹还告诉动作顺序与时间。比较训练效率应把这些额外信息算进去。": "Contact candidates, proximity rewards, causal impact indicators, existing demonstrations, and available skills can all narrow the exploration space. These cues differ in the amount of information they provide: a candidate contact point only tells where it's worth trying, a complete trajectory also tells the sequence and timing of actions. Comparing training efficiency should take this additional information into account.", "高频残差作用于部署臂关节参考；与Athletic作用于仿真执行器的残差不是同一变量。": "The high-frequency residual acts on the deployment arm joint reference; it is not the same variable as the residual of Athletic acting on the simulated actuator.", "相较直接搜索所有关节动作，搜索范围更小、身体更容易稳定；相较每任务单独训练，只需运行时换物体模型或评分规则。": "Compared with searching all joint movements directly, the search range is smaller and the body is easier to stabilize; compared with individual training for each task, only the object model or scoring rules need to be changed during runtime.", "前置知识": "Prerequisites", "视觉表示要丢掉什么、保留什么": "What a visual representation must retain", "。这条线不表示方法继承。": ". This line does not indicate method inheritance.", "视觉规划与低层使用不同参考系": "Visual planning and low-level use different reference systems", "DAgger学生到达状态上的专家标注": "Expert annotation on Dagger student arrival status", "相比分段策略，一起优化完整任务；相对只域随机化加入执行中的质量／接触估计。与潜变量适应对照效果相近，但显式小维度输出训练更省。不是无任务阶段记忆，也不是VLA。": "Optimize the complete task together compared to the segmented strategy; instead add domain-only randomization to the mass/contact estimation in the execution. The effect is similar to the latent variable adaptation control, but the explicit small-dimensional output training is more economical. Not task-free phase memory, nor VLA.", "【真机＋仿真】Gazebo物体尺寸、摩擦、质量、圆柱迁移，每条件50次，成功率76–92%；两阶段奖励与两个基线比较。B2＋Z1 Pro真机8×6.8 m场景，平均58.20 s／5.42 m，对绕行113.50 s／10.70 m；演示推不动时恢复路径。": "[real robot + simulation] Gazebo object size, friction, mass, cylinder migration, 50 times per condition, success rate 76–92%; two-stage rewards compared with two baselines. B2+Z1 Pro real robot 8×6.8 m scene, average 58.20 s/5.42 m, detour 113.50 s/10.70 m; demonstrate path recovery when unable to push.", "通用方法": "General method", "Appendix A：预扫描全局目标坐标": "Appendix A: Prescan global target coordinates", "稀疏几何": "Sparse geometry", "【抓取基准＋真机夹爪】在杂乱物体场景比较抓取候选质量与执行；ICRA 2021。": "[Grasping benchmark + real robot gripper] Comparing the quality and execution of grasping candidates in cluttered object scenes; ICRA 2021.", "相机识别物体慢且会丢失目标，身体却一直在动；直接使用旧位置，容易走错站位或抓空。": "The camera is slow to recognize objects and will lose the target, but the body is always moving; if you directly use the old position, it is easy to move to the wrong position or miss the target.", "CLIP条件扩散动作流，区别于语义技能选择": "CLIP conditional diffusion action flow, different from semantic skill selection", "手端目标能达到，不代表达到它的身体与关节配置适合下一步操作。臂伸到极限、身体太低或足支撑太窄，都可能让后续动作困难。": "Just because the hand-held target can be achieved does not mean that the body and joint configuration required to achieve it are suitable for the next step. Extending your arms to the limit, your body too low, or your foot support too narrow may make subsequent movements difficult.", "PartManip资产、teacher–student RL、历史估计与分层行走控制为基础；降域差的几何表示与条件交互估计是可分离机制；不把模块名视为新的理论定理": "Based on PartManip assets, teacher–student RL, historical estimation and hierarchical walking control; the geometric representation of the descending domain difference and the conditional interaction estimation are separable mechanisms; the module name is not regarded as a new theoretical theorem", "§3.1/3.2：教师/循环学生、门类型与历史": "§3.1/3.2: Teacher/Cycle Students, Door Types and History", "迁移要分别处理视觉视角、目标坐标和动作形态。末端轨迹可减少关节级形态差异，仍需机器人满足可达与动力学；人类视频可训练视觉／语言理解，机器人动作数据负责执行映射；混合动作数据则需要显式对齐或重定向。": "The migration must handle the visual perspective, target coordinates and action form separately. Terminal trajectories can reduce joint-level morphological differences, but the robot still needs to meet reachability and dynamics; human videos can train visual/language understanding, and robot action data is responsible for performing mapping; mixed action data requires explicit alignment or redirection.", "第二式描述理想直线滑动，$d$ 是滑动方向，$\\sigma$ 是位移。几何参数可以已知或待估计；摩擦、回弹与离散锁扣状态没有被这两式包含。": "The second formula describes ideal linear sliding, $d$ is the sliding direction, and $\\sigma$ is the displacement. The geometric parameters can be known or to be estimated; friction, rebound and discrete locking states are not included in these two equations.", "LLM 选择技能不等于连续动作 VLA；文中所谓 cross-attention 相关图实质为文本/像素余弦相关定位，不能当 Bayesian confidence 融合；不能把所有多相机改善概括成相机越多越好，或把 termination 描述成按钮成功事件确认": "LLM selection skills are not equal to continuous action VLA; the so-called cross-attention correlation map in the article is essentially text/pixel cosine correlation positioning, which cannot be combined with Bayesian confidence; all multi-camera improvements cannot be summarized as the more cameras the better, or termination can be described as a button success event confirmation", "Go2＋Wi e throwing phase has been executed. This addresses execution progress and does not guarantee that the ball will actually be thrown. POT-VLA's continuous 3D object recording and result verification is suitable for visible spatial changes; Guided RL's phase is suitable for demonstration progress. They are not substitutes for each other, nor do they directly demonstrate button triggering without cosmetic changes.", "G1 真机四任务各 10 次：关抽屉 9/10、架上取放 8/10、投球 3/10、移动取放 4/10；另比较有无手端预览和提供真值身体／足参考的 oracle 条件，并评估动作重建、足滑与末端误差。": "G1 real robot 10 times each of the four tasks: closing drawer 9/10, picking and placing on the shelf 8/10, pitching 3/10, moving and picking 4/10; also compared with or without mobile preview and oracle conditions that provide true body/foot reference, and evaluated motion reconstruction, foot slip and terminal errors.", "LiDAR/RGB instance graph 支持 GPT-4.1 拆解导航和操作，局部 Qwen2.5-VL 从腕 RGB-D 提出接触点和带几何约束的末端姿态；统一 18 关节 RL 以地形高度图和末端目标协调腿/臂。先静态臂训练行走，再全身训练，采样目标高度不随机身/地形倾斜而变。": "LiDAR/RGB instance graph supports GPT-4.1 disaggregated navigation and manipulation, local Qwen2.5-VL proposes contact points and end poses with geometric constraints from wrist RGB-D; unified 18-joint RL coordinates legs/arms with terrain heightmap and end targets. First perform static arm training for walking, then whole-body training. The sampling target height does not change with the inclination of the body/terrain.", "行走基础": "Locomotion", "完整库中的专题／系统工作；目前没有登记足以支持进入核心主线的跨论文模块采用证据。此标签不等于低质量，方法和实验仍以逐篇核读为准。": "Topic/systems work in the full library; there is currently no evidence of cross-thesis module adoption sufficient to support entry into the core thread. This label does not mean low quality, and methods and experiments are still subject to article-by-article review.", "用历史/当前状态两预测器估自由运动力矩，以gate减少历史吸收持续接触的问题；六维关节残差短历史作为force tokens条件化π0.5 action expert，另由较快小型MLP根据估计负载与姿态修正基座速度。": "Use two predictors of history/current state to estimate the free motion moment, and use gate to reduce the problem of continuous contact in history absorption; the short history of six-dimensional joint residuals is used as force tokens to condition π0.5 action expert, and a faster small MLP corrects the base speed according to the estimated load and attitude.", "输入：腕部力和力矩测量，机器人状态、估计的身体速度、允许的运动约束。 输出：先把外力换算成末端移动速度，再分配给臂和身体；臂由模型控制，腿由学习控制器输出关节角度。": "Input: wrist force and moment measurements, robot state, estimated body speed, allowed motion constraints. Output: First convert the external force into terminal movement speed, and then distribute it to the arm and body; the arm is controlled by the model, and the joint angle of the leg is output by the learning controller.", "是标定后的实际驱动力矩。": "is the actual driving torque after calibration.", "跟踪示范、调节进度与任务优化": "Demonstration tracking, progress adaptation, and task optimization", "已阅读控制总览、物体规划器、身体姿态优化、考虑操作力的行走 MPC、全部实验小节和结论。": "Have read the control overview, object planner, body posture optimization, walking MPC considering operating force, all experimental sections and conclusions.", "轨迹规划决定未来状态、动作及可能的接触模式；MPC 根据新状态反复重算有限时域方案，只执行当前部分；WBC 通常将当前任务参考转换成加速度、接触力和关节力矩。": "Trajectory planning determines future states, actions and possible contact patterns; MPC repeatedly recalculates the finite time domain scheme based on the new state and only executes the current part; WBC usually converts the current task reference into acceleration, contact force and joint torque.", "§III：sharedframe、modality stems/MXT与mask": "§III: sharedframe, modality stems/MXT and mask", "增加相机、控制视线、引入位置编码、保留旧观测，不是同一感知改动。": "Adding cameras, controlling line of sight, introducing position coding, and retaining old observations are not the same perceptual changes.", "仿真 100 trials 的消融 44%→92%；Unitree G1 真机取放主要定性，物体位姿用 MoCap。放置容差约 0.3 m，不能作精细面板操作的精度证据。": "The ablation of 100 trials of simulation is 44% → 92%; Unitree G1 real robot pick and place is mainly qualitative, and the object pose uses MoCap. Placement tolerance is approximately 0.3 m, no evidence of precision for fine panel operation.", "数据处理与几何表示": "Data processing and geometric representation", "离线规划包含物体状态，在线追踪 MPC 为提速删去物体状态；不能写成无先验地自动发现步态的所有细节。": "Offline planning includes object status, and online tracking MPC deletes object status to speed up; it cannot be written to automatically discover all details of gait without priori.", "遥操作冰箱／抽屉／门／推车／抓放，另测粗糙地形、载荷及外推扰动。仿真 200 个随机地形中走完 10 m 的稳定通过率为 86%，运动学—质心基线为 28%；身体 WBC 相同，但臂力矩／PD 实现也不同。": "Remotely operate refrigerator/drawer/door/cart/grab and release, and also measure rough terrain, load and extrapolation disturbance. The stable passing rate of walking 10 meters in 200 simulated random terrains is 86%, and the kinematics-center-of-mass baseline is 28%; the body WBC is the same, but the arm moment/PD implementation is also different.", "本地 PDF 标题核对；主文完整至结论；附录控制/状态估计主要段核对，硬件/参数附录未全逐项复算。": "The local PDF title is checked; the main text is complete to the conclusion; the appendix control/state estimation main sections are checked, and the hardware/parameter appendix is ​​not fully recalculated item by item.", "强化teacher-guided额外training onlysim，hardware不支持全部completePAKE独立效益；samplingfullpartialchain≠全身接触可行；§IV-A平台是RAIBO2+Z1，非ANYmal；§IV-B的UMI-on-Legs基线使用随机轨迹且body-frame tracking，已经改变其核心task-frame接口，不能无条件视为原方法比较": "Strengthen teacher-guided additional training onlysim, the hardware does not support all completePAKE independent benefits; sampling full partial chain ≠ full body contact is feasible; §IV-A platform is RAIBO2+Z1, non-ANYmal; §IV-B's UMI-on-Legs baseline uses random trajectories and body-frame tracking, its core task-frame interface has been changed, and cannot be unconditionally regarded as the original method for comparison", "肢体角色在支撑／操作间重新分配，是独立控制问题，有多类真机任务；不能仅凭新意推定形成主线。": "The redistribution of body roles between supports/operations is an independent control problem, and there are many types of real-machine tasks; the main line cannot be formed based on novelty alone.", "是策略可用观测。": "is an observation available to the strategy.", "橙色羽毛球以HSV检测，背景／光照影响感知模型；实测视觉延迟60–160 ms。主要平地与特定球拍／运动模型，不是通用物体操作。电流预算的训练约束和任务中的人身安全保证不同，不能以无超流证实任意接触安全。": "The orange badminton is detected by HSV, and the background/illumination affects the perception model; the measured visual delay is 60–160 ms. Mainly flat with specific racket/sport models, not general object manipulation. The training constraints of the current budget are different from the personal safety guarantees in the mission, and the safety of arbitrary contact cannot be proved by the absence of supercurrent.", "用真值目标替代感知输出估计控制上限，再单独替换感知模型；保持低层与任务一致才能分离贡献。": "Replace the upper limit of the perceptual output estimation control with the true value target, and then replace the perceptual model alone; only by keeping the lower layer consistent with the task can the contribution be separated.", "ANYmal＋DynaArm＋Robotiq 2f140；100 Hz全身＋400 Hz臂残差": "ANYmal＋DynaArm＋Robotiq 2f140; 100 Hz whole body + 400 Hz arm residual", "手端轨迹不唯一决定身体姿态与落脚，UMI示范也没有机器人全身动作标签。": "A single end-effector trajectory admits many body postures, foot placements, and gaits. Tracking it alone may reach the target while producing implausible or unstable whole-body motion. Human UMI demonstrations do not contain robot body or foot trajectories.", "是加速度。": "is acceleration.", "表示与评测分类": "Representation and evaluation classification", "ROA式中的$z^\\mu$来自训练期特权编码器，$z^\\phi$由近期传感历史估计；$\\operatorname{sg}$保留数值但截断梯度。第一距离项约束特权编码器，第二项训练历史估计器；原文是二范数，没有平方。": "$z^\\mu$ in the ROA formula comes from the privileged encoder during the training period, $z^\\phi$ is estimated from the recent sensing history; $\\operatorname{sg}$ retains the value but truncates the gradient. The first distance term constrains the privileged encoder, and the second term trains the history estimator; the original text is two-norm, without squaring.", "保留臂动力学的取舍": "Trade-offs for preserving arm dynamics", "单人同步采集底盘和臂示教，训练与部署共用动作接口；十步动作块、臂连续轨迹、底盘命令保持线程。": "Single-operator collection of simultaneous base-and-arm
