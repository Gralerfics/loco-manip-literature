eling does not mean that accurate force control has been achieved", "$\\tau$ 是各电机的关节力矩。$S^\\top\\tau$ 把这些力矩放到全身变量对应的位置；身体没有直接驱动自身六个自由度的电机，所以不能给它直接填入一组独立电机力矩。": "$\\tau$ is the joint torque of each motor. $S^\\top\\tau$ Put these torques at positions corresponding to the whole body variables; the body does not directly drive its own six-degree-of-freedom motor, so it cannot directly fill in a set of independent motor torques.", "力目标直接用于控制与力代理同时影响 VLA 和底盘补偿的接口对照。": "Force targets are used directly to control interface alignment with force agents that affect both VLA and chassis compensation.", "传感器漂移或用户给出极端轨迹时，原本稳定的全身控制器可能做出危险动作。": "When the sensor drifts or the user gives an extreme trajectory, the originally stable whole-body controller may make dangerous actions.", "本地 PDF 标题核对；主文完整，包括HSR、force tokens、机身残差补偿、数据、F/T对照和消融。未执行实现；正文内部数字冲突保留并说明。": "Local PDF title check; main text is complete, including HSR, force tokens, fuselage residual compensation, data, F/T comparison and ablation. Implementation not performed; numerical conflicts within the text are retained and explained.", "Sumo 直接在 rollout 运行策略，ReCo 用低阶闭环近似；二者共享预测真实执行的问题，计算成本和模型依赖不同。": "Sumo runs the policy directly in rollout, while ReCo uses low-order closed-loop approximation; both share the problem of predicting real execution, but have different computational costs and model dependencies.", "HyQReal＋Kinova 臂在 Gazebo 中低处抓取、高架放置，并与普通 KOMO 比较；全程四脚固定接触，动态步态和接触序列优化留作后续。它验证姿态的腿运动学可行性，不验证行走时的臂操作精度；与 CMP 无已核实直接承接。": "The HyQReal＋Kinova arm was grasped low in Gazebo, placed elevated, and compared with ordinary KOMO; all four legs were in fixed contact, and dynamic gait and contact sequence optimization were left for follow-up. It verifies the feasibility of leg kinematics in posture, but does not verify the accuracy of arm operation during walking; it has no verified direct connection with CMP.", "先训练 next task-space action 的 VLM 表征，再冻结骨干，以机器人数据训练 joint-space flow action expert，最后任务微调。阶段一实际同时使用 EgoDex 与 Humanoid Everyday，不是仅人数据。复用 AMO 低层，VLA 输出臂／手／torso／height／移动36维命令；RTC 用已提交动作前缀对齐异步推理。": "First train the VLM representation of the next task-space action, then freeze the backbone, train the joint-space flow action expert with robot data, and finally fine-tune the task. Phase 1 actually uses both EgoDex and Humanoid Everyday, not just human data. Reusing the AMO low-level, VLA outputs arm/hand/torso/height/move 36-dimensional commands; RTC uses submitted action prefixes to align asynchronous inference.", "本库若干2026全身VLA只引用π0作模型背景；当前未证实直接采用原论文权重或流动作头。": "Several 2026 whole-body VLAs in this library only use π0 as the model background; it is currently not confirmed that the weights or flow heads of the original paper are directly used.", "较早的四足RL力目标控制，适合建立接触操作对照；力控制这一大类并非本文首创，当前库中的直接模块复用证据不足。": "The earlier four-legged RL force target control is suitable for establishing contact operation control; this category of force control is not the first of its kind in this article, and there is insufficient evidence of direct module reuse in the current library.", "全阶逆动力学路径约束MPC及稀疏求解": "Full-order inverse dynamics path constraint MPC and sparse solution", "打羽毛球要求在有限剩余时间内移动到击球位置、准确挥拍，并在准备动作中持续看清飞行物体。身体转动影响相机测量，感知误差又改变应当执行的击球目标。": "Playing badminton requires moving to the hitting position within a limited remaining time, swinging the racket accurately, and continuously seeing flying objects clearly during preparations. Body rotation affects camera measurements, and perceptual errors change the target shot that should be executed.", "平滑需在正确参考坐标和时间基准上进行。动作被取消、重启和延迟时，应有一致的执行状态。": "Smoothing needs to be performed on the correct reference coordinates and time base. There should be consistent execution status when actions are canceled, restarted, and delayed.", "给问题记录平台与接口、部署观测、目标与物体条件、需要决定的变量、训练先验、评价协议六项。先固定其中大部分，才能把一个改动与失败机制联系起来。跨论文任务不同并不意味着完全无法比较，可以比较共同子问题的输入—输出映射与必要条件。": "Record six items for the problem: platform and interface, deployment observation, target and object conditions, variables to be determined, training priors, and evaluation protocols. Fix most of them first before you can tie a change to a failure mechanic. The fact that tasks are different across papers does not mean that they are completely incomparable. The input-output mappings and necessary conditions of common subproblems can be compared.", "persistent object memory、short perception memory与task event memory应分开；不能凭Being0引用数字做跨论文性能排名；verifier是可解释但配置依赖的反馈，不是物理成功全自动oracle；不涉及四足换步的动态安全证明": "Persistent object memory, short perception memory and task event memory should be separated; cross-paper performance rankings cannot be based on Being0 citation numbers; verifier is interpretable but configuration-dependent feedback, not a fully automatic oracle for physical success; dynamic security proof that does not involve four-legged steps", "增加速度监督是训练信号改动；降低执行 M 是调度改动；力反馈在低层修正是闭环改动。不能合并成‘轨迹更丝滑’。": "Increasing speed supervision is a training signal change; reducing execution M is a scheduling change; force feedback correction at a low level is a closed-loop change. It cannot be combined into 'the trajectory is silkier'.", "需要变换的时间戳、相机外参和身体状态一致。世界参考并不会自动消除定位漂移。": "The timestamp, camera external parameters and body status that need to be transformed are consistent. World reference does not automatically eliminate positioning drift.", "基础模型的应用": "Application of basic model", "这里用单维平移或局部笛卡尔误差说明虚拟受力响应，不能直接对两个位姿矩阵相减。参考在运动时，速度和加速度也应相对参考定义。": "Single-dimensional translation or local Cartesian error is used here to illustrate the virtual force response, and the two pose matrices cannot be directly subtracted. Reference When moving, velocity and acceleration should also be defined relative to the reference.", "缩小": "Zoom out", "表示力矩限制，": "represents torque limit,", "把方法基础与移动操作系统拆开": "Separate foundational methods from mobile manipulation systems", "本条可作为起点。": "This article can be used as a starting point.", "可微动力学代理用于训练全身跟踪策略": "A differentiable dynamics surrogate for training whole-body tracking policies", "动作块、重规划与平滑的精度—效率取舍": "Action chunks: accuracy, latency, and smoothness", "用于四足任务组合的漏检检查。": "For missed detection checks for quadruped mission combinations.", "经验初始化后优化": "Optimization after experience initialization", "先用大量只有位置标签的数据训练共同表征，再用较少的带力感示范学习模式路由；软混合避免模式硬切换引起的力突变。这是“学习策略怎样调用柔顺控制”的有价值接口例子，不是四足 VLA。": "First use a large amount of data with only position labels to train a common representation, and then use less force-sensing demonstrations to learn mode routing; soft mixing avoids force mutations caused by hard switching of modes. This is an example of a valuable interface for \"how learning policies invoke compliance control\", not a four-legged VLA.", "关节力矩接口可用，不等于机械臂也支持可靠力矩控制。当前 Piper-X 的反馈、执行模式、延迟和电流标定仍需实测。": "The joint torque interface is available, which does not mean that the robotic arm also supports reliable torque control. The current feedback, execution mode, delay and current calibration of Piper-X still need to be measured.", "把目标转到当前身体坐标，以带关节限位的阻尼最小二乘IK判断该身体姿态能否让臂达到目标。IK有解时给予可行姿态奖励，并依据解出的臂关节配置提供训练指导，使策略在到达目标之前也能从有利身体姿态获得反馈。再用三次插值生成平滑末端参考，结合速度、位姿和运动正则项训练非对称PPO。": "Move the target to the current body coordinates, and use damped least squares IK with joint limits to determine whether the body posture can allow the arm to reach the target. When IK has a solution, it will reward feasible postures and provide training guidance based on the solved arm joint configuration, so that the strategy can obtain feedback from favorable body postures before reaching the target. Cubic interpolation is then used to generate a smooth end reference, and the asymmetric PPO is trained by combining speed, pose and motion regularization terms.", "底层方法基础 · 无臂": "Locomotion foundation · no arm", "§III：硬件设计与6DoF组合": "§III: Hardware design and 6DoF combination", "策略学习": "Policy learning", "，则该关节的残差是": ", then the residual of this joint is", "应先把观测变换到一致参考，再使用机器人运动补偿和目标运动预测，把低频信息提供给高频执行。滤波可降低噪声，预测可补偿延迟，两者作用不同；强滤波也会产生额外相位滞后。": "The observations should be transformed to a consistent reference first, and then use robot motion compensation and target motion prediction to provide low-frequency information to high-frequency execution. Filtering can reduce noise, while prediction can compensate for delay. The two have different effects; strong filtering can also produce additional phase lag.", "领域基础": "Domain Basics", "稀疏奖励仅用于学到的高层任务策略，不用于示范生成器或低层控制器。多峰数据失败是特定任务／算法结果；真机演示不等于全面成功率基准。": "Sparse rewards are used only for the learned high-level task policy, not for the demonstration generator or low-level controller. Failures on multimodal data are task/algorithm specific; real-device demonstrations do not equal overall success rate benchmarks.", "AMO低层直接复用；VLA输出36维臂/手/torso/height/移动目标，而非43joint direct policy；EgoDex和HumanoidEveryday为已有数据集；RTC跟随已有动作块思路，并非首次提出；第一阶段数据同时有829hEgoDex和31hHumanoidEveryday，摘要的人/机器人完全分离叙事须按方法修正": "AMO low-level direct reuse; VLA outputs 36-dimensional arm/hand/torso/height/moving target instead of 43joint direct policy; EgoDex and HumanoidEveryday are existing data sets; RTC follows the existing action block idea and is not proposed for the first time; the first phase data includes 829hEgoDex and 31hHumanoidEveryday at the same time, and the summary’s human/robot complete separation narrative must be revised according to the method", "多控制器的力矩接口": "Torque interface of multiple controllers", "M20S 轮足＋CM1 臂。输入图像、语言、本体状态及 200 Hz 实测臂关节力矩；π0.5 动作专家生成操作／基座指令，较快的小型残差网络另修正基座速度。无腕部力传感器仍需要实际关节力矩测量。": "M20S wheel base + CM1 arm. Input image, language, body state and 200 Hz measured arm joint torque; π0.5 motion expert generates operation/base instructions, and the faster small residual network also corrects the base speed. No wrist force sensor still requires actual joint torque measurement.", "视觉语言基础": "V-L basics", "放大": "Zoom in", "远场语义导航后，AAM 用目标 mask 深度及 ego-motion KF 做近场朝向/距离对齐，使起始姿态接近操作示范；主从遥操作记录从臂跟随目标，同步关节速度，再在 ACT 加速度监督与有限差分一致性损失减少块内不连续。": "After far-field semantic navigation, AAM uses the target mask depth and ego-motion KF to perform near-field orientation/distance alignment to make the starting posture close to the operation demonstration; the master-slave teleoperation records the slave arm following the target, synchronizes the joint speed, and then ACT acceleration supervision and finite difference consistency loss reduction block discontinuity.", "原作固定双臂；单独引用ACT不表示已经解决底盘同步移动和接触稳定性。": "The original work has fixed arms; citing ACT alone does not mean that the chassis synchronous movement and contact stability have been solved.", "同一策略对无信息、预测信息、真值信息做比较，再扰动区域或方向检验因果作用；报告实际触发／开启成功。": "The same strategy compares no information, predicted information, and true value information, and then perturbs the area or direction to test the causal effect; reports the actual trigger/start success.", "OVMM整体成功15.8%对最佳表中基线11.6%；轮式真机三任务分别3/10、1/10、4/10；50条实机适配示范。": "OVMM success: 15.8% versus 11.6% for the best table baseline. Three wheeled real-robot tasks: 3/10, 1/10, and 4/10. Real-robot adaptation used 50 demonstrations.", "Task success 在存活轨迹上计算，必须与survival同时看。DPPO-style删去部分原算法技巧，非完整公平复现；真机只15次且动捕；多技能主要分任务训练。": "Task success is calculated on the survival trajectory and must be viewed at the same time as survival. DPPO-style deletes some of the original algorithm techniques, which is not a complete and fair reproduction; the real robot only has 15 times and is motion captured; multi-skill training is mainly divided into tasks.", "视觉操作执行器与长程系统": "Visual manipulation and long-horizon systems", "8任务×10＝80trials，完整71次成功，对直接VLA39次；小样本多任务结论；四任务各十次消融：direct15/40、verifieronly22、tokenonly31、both34，分离对象条件与完成验证贡献；8slots×33features包含role identity、confidence、visibility、geometry及relations，角色跨chunk保持；Being0的44/50对37/50来自另一论文不同suite引用，非同条件复现实验": "8 tasks × 10 = 80 trials, 71 complete successes, 39 direct VLA; small sample multi-task conclusion; ten ablation of each of the four tasks: direct15/40, verifieronly22, tokenonly31, both34, separation of object conditions and completion verification contribution; 8 slots × 33 features including role Identity, confidence, visibility, geometry and relations, the roles are maintained across chunks; 44/50 versus 37/50 of Being0 come from different suite references in another paper, and are not replica experiments under the same conditions.", "Guided RL、RAMBO及Terrain-aware WBC等引用；当前直接算法继承证据不足。": "Guided RL, RAMBO and Terrain-aware WBC are cited; the current evidence of direct algorithm inheritance is insufficient.", "不同论文可能给同一机制起不同名字，也可能用相似词语描述不同的决策。合并应依据计算和信息作用，而不是标题。": "Different papers may give the same mechanism different names, or they may use similar words to describe different decisions. Consolidation should be based on calculations and information effects, not titles.", "RoLoMa采用限定的接触／力矩响应构造可行余量；Contact as a Decision还使用轴向能力与保守近似。它们的数值不是所有反馈控制器下的精确最大扰动能力。": "RoLoMa uses a limited contact/moment response to construct a feasible margin; Contact as a Decision also uses axial capabilities and conservative approximations. Their values ​​are not the exact maximum disturbance capability under all feedback controllers.", "Ψ₀的RTC在训练时给模型已承诺动作前缀，部署时对齐异步推理；这与普通低通／块间插值不同。其最后一步RTC消融成功仍9/10，主要改善平顺性，未证明成功率进一步提高。": "Ψ₀'s RTC prefixes committed actions to the model during training and aligns asynchronous inference during deployment; this is different from ordinary low-pass/inter-block interpolation. The success rate of the last step of RTC ablation is still 9/10, which mainly improves ride comfort, but does not prove that the success rate will be further improved.", "人形邻接、任务专用控制器；真机力偏差与四足换步仍待检验。": "Humanoid adjacency, mission-specific controller; real mechanical deviation and quadrupedal step change still need to be tested.", "贡献是部署接口与跨模拟器诊断，不是新的全身RL算法。body-assisted reach与固定身体默认控制器比较，强调可重复工程基线。": "The contribution is a deployment interface and cross-simulator diagnostics, not a new whole-body RL algorithm. Body-assisted reach compared to fixed-body default controllers, emphasizing repeatable engineering baselines.", "轮腿自由度及contactsupport不同；costconstraints不等于hard瞬时安全；real统计较少": "Wheel and leg degrees of freedom and contact support are different; costconstraints are not equal to hard instantaneous safety; real statistics are less", "【仿真＋机械臂真机】多类模拟任务与实机抓取、推物、移动方块；RSS 2018，没有四足操作。": "[Simulation + real robot arm] Multiple simulation tasks and real robot grabbing, pushing objects, and moving blocks; RSS 2018, no four-legged operation.", "采样协方差是搜索分布协方差，不是已证明的贝叶斯后验；任务表现改善不能证明每个恢复的物理参数分别准确。": "The sampling covariance is the search distribution covariance, not the proven Bayesian posterior; task performance improvements do not prove that each recovered physical parameter is individually accurate.", "在仿真中降低执行器可用力矩，学习故障识别；将臂提出的身体姿态改成更适合当前支撑能力的姿态，再联合执行。附录规定训练主要削弱同一条腿的三个关节，单关节削弱与锁止是后续评价条件。": "Reduce the available torque of the actuator in the simulation and learn fault identification; change the body posture raised by the arm to a posture more suitable for the current support capacity, and then perform joint execution. The appendix stipulates that the training mainly weakens three joints of the same leg, and single-joint weakening and locking are subsequent evaluation conditions.", "方法／实机多任务": "Method/real robot multitasking", "需要任务仿真、成功数据和状态估计。冻结的低层控制器不能针对新任务继续适应；示范引导的改进主要在数据覆盖附近。某轮胎任务的多模态数据训练失败，只说明该数据与 TD3 设置的兼容性问题，不能推广成多模态示范普遍无效。": "Requires mission simulation, success data, and state estimation. The frozen low-level controller cannot continue to adapt to new tasks; the improvements in demonstration guidance are mainly around data coverage. The failure of multi-modal data training for a certain tire task only indicates the compatibility issue between the data and the TD3 settings, and cannot be generalized to the general ineffectiveness of multi-modal demonstrations.", "四足足端／无臂": "Four legs/armless", "WholeBodyVLA实验将公开OpenVLA-OFT模型适配为双臂动作与离散移动指令基线；这是基线复用，不是其方法起源。": "The WholeBodyVLA experiment will publicly adapt the OpenVLA-OFT model to the dual-arm action and discrete movement instruction baseline; this is baseline reuse, not the origin of its method.", "历史适应处理未知地形／载荷": "Historical adaptation to handle unknown terrain/loads", "多个 critic 的评价分解、按腿／臂动作分配优势，以及状态门控奖励是不同训练机制；这里不把它们写成同一个控制约束。": "Evaluation decomposition of multiple critics, distribution of advantages according to leg/arm actions, and state gated rewards are different training mechanisms; they are not written as the same control constraint here.", "23 episodes×16 replay batches 中 action MSE 较 FastWAM 改善21.7%；X-VLA 的绝对 action error 仍低于本方法；真机每方法79次，本方法46/79＝58.2%，FastWAM45/79＝57.0%，差一个成功；不证明统计显著 task success 提升；报告协调/位移指标44.3/30.4对34.2/12.7，但指标操作定义不足以将其直接等价精确控制或接触安全；结构消融固定 adapter 配置，有助分离因子设计在 replay 的影响；小样本离线收益不等于所有场景任务优胜": "In 23 episodes × 16 replay batches, the action MSE is 21.7% better than FastWAM; the absolute action error of X-VLA is still lower than this method; the real robot has 79 times per method, this method 46/79=58.2%, FastWAM45/79=57.0%, one short of success; it does not prove statistically significant task success Improvement; reported coordination/displacement index 44.3/30.4 vs. 34.2/12.7, but the index operation definition is not enough to directly equate it to precise control or contact safety; structure ablation fixes the adapter configuration, which helps to isolate the impact of factor design on replay; small sample offline revenue does not equal all scenario task wins", "第一阶段策略输入本体状态、速度指令和由特权环境因素编码的z；第二阶段适应器以机器人近期本体历史预测z，真机只使用历史预测值。策略输出关节目标。": "The first-stage strategy inputs the ontology state, speed command and z encoded by privileged environmental factors; the second-stage adaptor predicts z based on the recent ontology history of the robot, and the real robot only uses historical prediction values. Policy output joint target.", "仿真比较地形通过、工作空间、跟踪及模块消融；明确报告走动时可达范围小于站立时。B2＋Z1 真机由 VR 遥控，在操作手臂的同时登上五级、每级 17 cm 的台阶，并连续完成五次组合任务；该演示不等于自主长程任务，也不是各基线的真机对照。": "Simulation compares terrain passage, workspace, tracking and module ablation; clearly reports that the reachable range when walking is smaller than when standing. The B2+Z1 real robot is controlled by VR. It climbs five steps of 17 cm each while operating its arms, and completes five consecutive combination tasks; this demonstration is not equivalent to an autonomous long-range mission, nor is it a real robot comparison of each baseline.", "未知环境里先找到目标、再在操作位完成接触。方法将目标条件自主探索与全身操作策略分层；接口上导航给目标区域，操作层协调臂和腿。": "In an unknown environment, first find the target and then complete contact at the operating position. The method layers autonomous exploration of target conditions and whole-body operation strategies; the interface navigates to the target area, and the operation layer coordinates arms and legs.", "附录 PressCube 成功只是手距 cube <5 cm，EraseBoard 为抓橡皮左移>0.2 m，PushCart 主要检测抓住横梁；分别不是电气按钮激活、擦净面积或推车到目的地。代理指标对所测子技能有效，但不能代替实用任务完成率；未知物体网格和机构泛化未证明。": "Appendix PressCube is successful only when the hand distance from the cube is <5 cm, EraseBoard means grabbing the rubber and moving it to the left >0.2 m, PushCart mainly detects grabbing the beam; respectively, it is not the activation of the electrical button, wiping the area or pushing the cart to the destination. Proxy metrics are valid for measured sub-skills, but cannot replace practical task completion rates; unknown object mesh and mechanism generalization are not proven.", "真机主比较 360 episodes＝6 方法×3 seeds×20，另有 40 新场景，共 400；完整方法 78.3% ±5.8%，distillation-only 50% ±35.5%；完整方法完成时间 43.8 s，对人 65.5 s；适用于该颜色方块/篮子任务配置；教师仅在相机视场内提供目标信息，学生输入五帧腕相机 RGB 而非 depth sensor；作者从十个低层 seeds 中选择最稳定三个部署，因此三种子统计不能当无筛选策略重复性；低层 4B steps 约三日，学生四 GPU 两周、40M steps；方法有显著训练成本": "real robot host comparison 360 episodes=6 methods×3 seeds×20, and 40 new scenes, a total of 400; complete method 78.3% ±5.8%, distillation-only 50% ±35.5%; complete method completion time 43.8 s, 65.5 s for humans; applicable to this color square/basket task configuration; teacher only provides target information within the camera field of view, and students input five-frame wrist camera RGB Rather than a depth sensor; the author selects the three most stable deployments from ten low-level seeds, so the three seed statistics cannot be used as repeatability without filtering strategies; the low-level 4B steps take about three days, the student four GPUs take two weeks, and 40M steps; the method has significant training costs", "$W,B,E$ 分别表示世界、身体和末端坐标系；$q_a$ 是臂关节配置。$R_{WB}$ 将身体坐标的向量旋转到世界坐标；$T_{AB}$ 是把 $B$ 坐标变换到 $A$ 坐标的齐次位姿变换。": "$W,B,E$ represent the world, body and end coordinate systems respectively; $q_a$ is the arm joint configuration. $R_{WB}$ rotates the vector of body coordinates to world coordinates; $T_{AB}$ is a homogeneous pose transformation that transforms $B$ coordinates to $A$ coordinates.", "视觉与本体观察条件化多步动作序列；推理时迭代去噪生成序列，执行前一段并重新观察。": "Visual and ontology observation conditional multi-step action sequences; iteratively denoises the generated sequence during reasoning, executes the previous section and observes again.", "没有匹配的知识节点。": "No matching concepts.", "在低层能力范围内约束高层要求。": "Constrain high-level requirements within low-level capabilities.", "扩散动作序列滚动执行": "Rolling execution of diffusion action sequence", "关节角度、速度与力矩是不同的动作接口": "Joint position, velocity, and torque are distinct command interfaces", "§III-B ArtIEst：视觉/本体分支与belief gate": "§III-B ArtIEst: Vision/Ontology branch and belief gate", "本次未取得全文。下列沿用旧检索卡片；机制标签待全文回查。": "The full text is not available this time. The following uses the old search card; the mechanism tag is pending review of the full text.", "keyframe提取/库与object-relative重定位": "keyframe extraction/library with object-relative relocation", "任务坐标轨迹与未来目标让全身提前协调。": "The task coordinate trajectory and future goals allow the whole body to coordinate in advance.", "每轮先由当前策略在 MuJoCo Warp 采集状态转移，存进 replay buffer；以记录动作作八步自回归训练，拟合共享的可微状态转移模型，并计算／拟合观测、奖励与终止。再从真实仿真轨迹的状态起步，在冻结的模型中想象 32 步，通过模型对动作和状态的导数反向传播更新策略；critic 估计 32 步之后的回报，避免短视。模型每轮随新数据更新。它不要求物理仿真器本身可微，也不在推理时对世界模型求解 MPC。": "Each iteration collects transitions from the current policy in MuJoCo Warp, fits a 力触觉；任务空间、位姿采集和同夹爪条件也不能省略后泛称任意人视频迁移。": "The wheel kinematics QP is not the floating base leg contact dynamics WBC, and the safety of four-legged step change contact has not been proven. Visual contact details are not force haptics; task space, pose acquisition and same gripper conditions cannot be omitted and are generally referred to as arbitrary person video transfer.", "从 RGB-D 保存固定角色的8个对象槽，跨动作块刷新位置／尺度／可见性／关系，tokens 输入 GR00T N1.7 action expert。配置的 typed subtask 与稳定窗口几何谓词共享这些对象信息，将状态分为进行、完成、受阻、失败、不确定；不确定时重观察，避免仅凭已尝试认定成功。": "Save fixed character's 8 object slots from RGB-D, refresh position/scale/visibility/relations across action blocks, tokens input GR00T N1.7 action expert. The configured typed subtask shares these object information with the stable window geometry predicate, dividing the status into ongoing, completed, blocked, failed, and uncertain; re-observe when uncertain to avoid determining success based solely on attempts.", "UMI on Legs和DQ-Net等原文明确用Isaac Gym；引用它不能证明沿用同一奖励或控制器。": "The original texts such as UMI on Legs and DQ-Net clearly use Isaac Gym; citing it does not prove that the same reward or controller is used.", "RT-2 §3明确沿用RT-1提出的机器人动作协议，并与RT-1比较；新增互联网视觉语言预训练及图文任务共同微调。": "RT-2 §3 clearly follows the robot action protocol proposed by RT-1 and compares it with RT-1; new Internet visual language pre-training and joint fine-tuning of graphic and text tasks are added.", "200000 pose targets，包括结构不可达；Unified/Two-Stage/Cooperative/Full 3 seeds；真实 extreme poses 8次，跨高度每设置15次": "200000 pose targets, including structurally unreachable; Unified/Two-Stage/Cooperative/Full 3 seeds; 8 true extreme poses, 15 per set across height", "2026-09预印本": "2026-09 Preprint", "把ALOHA双臂遥操作装到移动底盘，收集50段／任务左右的全身示范；用静态ALOHA数据协同训练移动任务，检验固定操作数据能否提高数据效率。": "Install ALOHA dual-arm teleoperation on a mobile chassis and collect about 50 whole-body demonstrations per task; use static ALOHA data to collaboratively train mobile tasks and test whether fixed operation data can improve data efficiency.", "的信念。": "Faith.", "把数千环境并行推进，调整PPO在大批量数据下的实现，并引入按机器人表现升降的地形课程；公开legged_gym训练配置。": "Advance thousands of environments in parallel, adjust the implementation of PPO under large batches of data, and introduce terrain courses that increase or decrease according to robot performance; make the legged_gym training configuration public.", "输入图像和语言指令，输出离散化后的机器人动作token；微调后适配不同机械臂。": "Input images and language commands, and output the discretized robot action token; fine-tune it to adapt to different robotic arms.", "第二式是动作均值蒸馏的一般形式：": "The second formula is the general form of action mean distillation:", "防止数值问题。归一化、动态权重与近似误差会改变实际更新，不能再直接等同于原始固定加权回报。": "Prevent numerical problems. Normalization, dynamic weights, and approximation errors change the actual updates and are no longer directly equivalent to the original fixed weighted returns.", "首次成功、接触探索与奖励塑形": "First success, contact exploration, and reward shaping", "轨迹接口": "Track interface", "端到端训练注意力式循环编码器融合本体与外感地形信息，让策略在地形视觉失准时更多依靠身体反馈，而非手工规定两种传感的固定权重；训练包含感知退化与复杂地形。": "End-to-end training of the attentional loop encoder fuses ontology and extrinsic terrain information, allowing the strategy to rely more on body feedback when terrain vision is inaccurate, rather than manually specifying fixed weights of the two sensors; training includes perceptual degradation and complex terrain.", "RSS2026跨人类／机器人示范的全身VLA数据路线代表；人形邻接，后续采用情况仍需观察。": "RSS2026 whole-body VLA data route representative for cross-human/robot demonstration; humanoid adjacency, subsequent adoption still needs to be observed.", "ablation及zero-shot tests": "ablation and zero-shot tests", "肢体角色分配与给定角色的执行": "Assigning limb roles and executing a given assignment", "观测目标": "Observation and goals", "角色枚举不是角色选择算法。接受外部 mask、固定一条腿操作，以及自主比较并切换角色，应分别记录。": "Role enumeration is not a role selection algorithm. Acceptance of external masks, immobilization of one leg, and autonomous comparison and switching of roles should be recorded separately.", "仿真平台是 MuJoCo，不能写 Isaac Gym；部署使用 RGB 学出的 mask/depth，不需外部 SAM 点击或物理深度输入；不要把多阶段教师等同于部署显式阶段 FSM；学生不观察教师 stage index；不要把速度精确停零带来的稳定归为移动接触安全已解决": "The simulation platform is MuJoCo and cannot be written as Isaac Gym; deploy the mask/depth learned using RGB, without external SAM clicks or physical depth input; do not equate multi-stage teachers with deploying explicit stage FSM; students do not observe the teacher stage index; do not attribute the stability brought by the speed to precisely stop to zero as mobile contact safety has been solved", "四足若只靠地面四点支撑，够不到较高目标。方法让机器人利用桌沿等外部环境承重，扩展操作工作空间。": "If the four legs are supported only by four points on the ground, they will not be able to reach higher targets. The method allows the robot to use the external environment such as the edge of the table to bear weight and expand the operating work space.", "刚体逆动力学、直接多重射击、MPC、Fatrop、Pinocchio、CasADi、Kalman状态估计、PD。": "Rigid body inverse dynamics, direct multi-shot, MPC, Fatrop, Pinocchio, CasADi, Kalman state estimation, PD.", "相较只执行遥控命令，加入自主视觉动作选择；相较 Deep WBC 的全关节联合学习，臂采用几何求解以改善精确姿态跟踪。": "Compared with only executing remote control commands, autonomous visual action selection is added; compared with Deep WBC's full-joint joint learning, the arm uses geometric solution to improve accurate posture tracking.", "物体反作用力的预测与反馈": "Predicting and responding to object reaction forces", "有力目标和接触案例，但无独立施力测量": "Forced target and contact case, but no independent force measurement", "【真机＋仿真】ANYmal在泥、雪、碎石等真实地形行走；Science Robotics 2020。": "[real robot + simulation] ANYmal walks on real terrain such as mud, snow, gravel, etc.; Science Robotics 2020.", "用近期执行轨迹与并行仿真滚动比较，在线估计未知物理参数，再把估计送回采样式 MPC；它从模型不确定性入手，和 ReCo 的“学习控制器的指令响应”是不同建模对象。": "Use recent execution trajectories and rolling comparisons with parallel simulations to estimate unknown physical parameters online, and then send the estimates back to sampling MPC; it starts from model uncertainty and is a different modeling object from ReCo's \"learning controller's command response\".", "这是文献归并的判据，不应排成伪等价公式。直接方法继承仍需原文的复用证据。": "This is the criterion for document merging and should not be arranged into a pseudo-equivalent formula. Direct method inheritance still requires evidence of reuse from the original text.", "§III／实机实验": "§III／real robot experiment", "正文 §III/IV/V方法与结果审读；TableIII/IV reward、V/VI ablation核查；未运行 tactile simulator": "Text §III/IV/V methods and results review; TableIII/IV reward, V/VI ablation verification; tactile simulator not run", "RoboDuet保留了行为条件的腿控制思想，但将多种步态选择固定为trot等设置，再由臂输出身体姿态请求。继承了接口／奖励，不代表继承了原作全部行为多样性。": "RoboDuet retains the leg control idea of ​​behavioral conditions, but fixes multiple gait selections to settings such as trot, and then outputs body posture requests from the arms. Inheriting the interface/rewards does not mean inheriting all the behavioral diversity of the original work.", "还需核实真机是步行四足还是轮足、操作时是否停步，以及是否依赖地图／外部定位。": "It is also necessary to verify whether the real robot walks on four legs or wheels, whether it stops during operation, and whether it relies on maps/external positioning.", "输入：腿和臂的自身状态历史、期望速度／末端姿态，以及从腿状态估计出的关节故障信息。 输出：臂关节目标和期望身体姿态；姿态调整模块根据故障修正身体要求，腿策略输出补偿步态的关节目标。": "Input: The leg and arm’s own state history, expected speed/end attitude, and joint fault information estimated from the leg state. Output: arm joint target and desired body posture; the posture adjustment module corrects the body requirements according to the fault, and the leg strategy outputs the joint target to compensate for the gait.", "输入当前观测及采样动作的概率比、优势估计；输出更新后的策略参数，不规定机器人传感器或动作空间。": "Input the probability ratio and advantage estimate of the current observation and sampling action; output the updated strategy parameters, without specifying the robot sensor or action space.", "方法、实验、复用部分及证据边界见本节点卡片与论文贡献审读记录；引用出现或基线比较不独自构成模块继承。": "For methods, experiments, reuse parts and evidence boundaries, see this node card and paper contribution review record; the occurrence of references or baseline comparisons do not constitute module inheritance alone.", "这里定义 $F_{\\mathrm{ext}}$ 为环境作用于机器人的力。某些论文使用反向差值 $\\tau_{\\mathrm{act}}-\\tau_{\\mathrm{model}}$，对应符号也反向；必须检查论文定义和实际标定。符号不同不表示方法本身矛盾。": "Here $F_{\\mathrm{ext}}$ is defined as the force of the environment acting on the robot. Some papers use reversed differences $\\tau_{\\mathrm{act}}-\\tau_{\\mathrm{model}}$, with corresponding signs also reversed; one must check the paper definition and the actual calibration. Different symbols do not mean that the methods themselves are contradictory.", "WAN video backbone、Action DiT 与 FastWAM 主框架直接复用；第1阶段全量适配，第2阶段冻结主体训练约25.95M adapters；不是从零构造全部模型；语义/表示因子分离不消除机器人本体物理耦合": "WAN video backbone, Action DiT and FastWAM main framework are directly reused; the first stage is full adaptation, and the second stage freezes the subject training of about 25.95M adapters; not all models are constructed from scratch; the separation of semantic/presentation factors does not eliminate the physical coupling of the robot body", "§3：PD目标裁剪与部署观测": "§3: PD target clipping and deployment observation", "相较 RoboDuet 式分工接口，增加故障驱动的身体请求调整；相较只保走路的容错方法，还考虑臂可达范围。": "Compared with the RoboDuet-style division of labor interface, fault-driven body request adjustment is added; compared with the fault-tolerant method that only guarantees walking, the reachable range of the arm is also considered.", "§IV，Tables II/III：阶段误差与泛化消融": "§IV, Tables II/III: Stage Error and Generalization Ablation", "相较只展示单次动作，把示教、可泛化技能与长程组合连起来；与 UMI on Legs 不同，示范涉及真实机器人全身和多相机观测。": "Compared to only demonstrating a single action, it connects teaching, generalizable skills and long-range combinations; unlike UMI on Legs, the demonstration involves the whole body of the real robot and multi-camera observation.", "QuadWBG 的 GORM、CMP 的能力投影、PAKE 的多配置参考、Terrain-aware WBC 的地形条件化分别处理不同环节。": "QuadWBG's GORM, CMP's capability projection, PAKE's multi-configuration reference, and Terrain-aware WBC's terrain conditioning handle different aspects respectively.", "$\\mathcal D$ 是实机状态转移数据，$f_{\\mathrm{sim}}$ 是含待校准参数或网络 $\\theta$ 的仿真转移，$\\ell$ 是转移误差损失。此式表示校准目标，不指定所有论文都使用同一种范数。": "$\\mathcal D$ is the real robot state transfer data, $f_{\\mathrm{sim}}$ is the simulation transfer containing parameters to be calibrated or network $\\theta$, and $\\ell$ is the transfer error loss. This formula represents the calibration target and does not specify that all papers use the same norm.", "低成本双臂的细操作会因单步模仿误差不断积累，演示中的停顿也使单步监督不稳定。": "The detailed operation of low-cost double arms will continue to accumulate due to single-step simulation errors, and pauses in the demonstration also make single-step supervision unstable.", "恢复围绕原参考的范围、任务状态可观测性和可替换接触顺序要分别验证。": "Restoring scope around the original reference, task state observability, and replaceable contact sequences are to be verified separately.", "multi-critic advantage 与实验": "multi-critic advantage and experimentation", "RoboDuet §III-B.1引用[16]的行为参数、时钟和大部分奖励；Visual WBC附录Swing/Stance phase tracking引用[59]；Terrain-Aware WBC §III的步态时序输入引用[19]。三者不等于采用完整MoB方法。": "RoboDuet §III-B.1 cites [16] for behavioral parameters, clocks, and most rewards; Visual WBC appendix Swing/Stance phase tracking cites [59]; Terrain-Aware WBC §III cites gait timing input [19]. The three are not equivalent to adopting the complete MoB method.", "$q$ 是身体与关节配置，$v$ 是全身速度，$\\dot v$ 是加速度。$M(q)\\dot v+h(q,v)$ 是模型根据实际运动推算的所需广义力；$S^\\top\\tau$ 是实际电机驱动的贡献。前者含惯性、重力和运动项，后者不是期望接触力。": "$q$ is the body and joint configuration, $v$ is the whole body velocity, and $\\dot v$ is the acceleration. $M(q)\\dot v+h(q,v)$ is the required generalized force calculated by the model based on the actual motion; $S^\\top\\tau$ is the contribution of the actual motor drive. The former contains inertia, gravity and motion terms, while the latter is not the expected contact force.", "主从 MIT 控制及数据同步": "Master-slave MIT control and data synchronization", "是身体与末端条件。第二式仅示意带姿态请求的协作接口：臂策略输出臂动作": "is the body and terminal condition. The second formula only represents the collaboration interface with attitude request: the arm strategy outputs the arm action", "应分开动作历史、程序进度和物理结果状态。当前观测相同而正确后续动作不同，就需要历史或其他反馈；若成功与失败在所有可得观测中完全相同，单靠记忆也无法可靠区分，需要电气状态、声音、触觉事件或其他可观测结果。": "Action history, program progress and physical result status should be separated. If the current observation is the same but the correct subsequent action is different, historical or other feedback is needed; if success and failure are exactly the same in all available observations, memory alone cannot reliably distinguish them, requiring electrical states, sounds, tactile events, or other observable results.", "先列复用、改动、对照和指标四栏，必要时补一个仅改变目标模块的对照。报告成功次数和总次数。": "List the four columns of reuse, modification, comparison and indicator first, and if necessary, add a comparison that only changes the target module. Reports the number of successes and the total number of attempts.", "Gazebo 包含 392 种任务条件及 45000 个接触／配置候选，比较穷举、只用地面、固定支撑及消融；真机分别五次固定支撑和五次行走试验，借助额外接触保持载荷。": "Gazebo contains 392 mission conditions and 45,000 contact/configuration candidates, which is relatively exhaustive, using only the ground, fixed support and ablation; the real robot was tested five times with fixed support and five walking tests, with the help of additional contacts to maintain the load.", "TVP/noNAE/sMLP/多接口移除DeepWBC；sim torque MSD、7轨迹误差、uniform sampling；real teleop/DP": "TVP/noNAE/sMLP/multi-interface removal DeepWBC; sim torque MSD, 7 trajectory error, uniform sampling; real teleop/DP", "无本体输入与精细朝向局限": "No ontology input and fine orientation limitations", "需要物体模型／状态；真机用动捕与外部 Threadripper。完整任务演示还使用任务专用代价和固定物体坐标系接近／抓取点，试验次数少。高层学习基线没有显式新模型参数，而 MPC 获得新物理模型。": "Requires object model/state; real robot uses motion capture and external Threadripper. The full task demonstration also uses task-specific costs and fixed object coordinate system approach/grasp points, resulting in a small number of trials. The high-level learning baseline has no explicit new model parameters, while MPC acquires a new physical model.", "软权重切换没有整体稳定性证明；基准策略不是 VLA；无专门 F/T 的粗力信息和物理力标定需区别。": "There is no overall stability proof for soft weight switching; the benchmark strategy is not VLA; there is no special F/T rough force information and physical force calibration that need to be distinguished.", "两种复杂地形全身跟踪设计的并行对照；臂控制和地形输入不同。": "Side-by-side comparison of two complex terrain whole-body tracking designs; arm control and terrain input are different.", "$r,z$ 是释放位置的水平与竖向分量；$v_r,v_z$ 是相应速度；$z_{\\mathrm{land}}$ 是目标高度，$g$ 是重力加速度。$\\xi$ 收集释放状态，$\\Phi$ 给出对应水平落点。式子选下降到目标高度的飞行时间根，须满足可到达该高度。": "$r,z$ are the horizontal and vertical components of the release position; $v_r,v_z$ are the corresponding velocities; $z_{\\mathrm{land}}$ is the target height, and $g$ is the gravity acceleration. $\\xi$ collects the release status, and $\\Phi$ gives the corresponding horizontal drop point. The formula selects the root of the flight time to descend to the target altitude, which must be sufficient to reach the altitude.", "位置目标和力目标在同一约束方向可能冲突。混合位置／力控制会在自由方向跟踪位移，在受约束方向调节力；也有方法用虚拟刚度把位置与力需求联系起来。应写出哪个方向受约束、谁给期望力，以及真实反馈来自哪里。": "Position target and force target may conflict in the same constraint direction. Hybrid position/force control tracks displacement in the free direction and regulates force in the constrained direction; there are also methods that use virtual stiffness to relate position to force requirements. It should be written which direction is constrained, who gives the desired force, and where the real feedback comes from.", "ACT动作块与时间集成": "ACT action block and time integration", "手持示范跨本体相对动作与延迟匹配": "Handheld demonstration of cross-body relative motion and delay matching", "§V：双手任务、狭窄空间与手电筒行走": "§V: Two-Handed Tasks, Narrow Spaces and Flashlight Walking", "$e$ 是相对参考的位移误差，$M_d,D_d,K_d$ 是设定的虚拟质量、阻尼和刚度；$F_{\\mathrm{ext}}$ 的正方向应与误差坐标相容。": "$e$ is the displacement error relative to the reference, $M_d, D_d, K_d$ are the set virtual mass, damping and stiffness; the positive direction of $F_{\\mathrm{ext}}$ should be consistent with the error coordinate.", "异构机构的状态／参数估计有独立价值，但以机构操作为中心，尚无跨任务下游采用证据。": "State/parameter estimation for heterogeneous organizations has independent value, but centered on organization operations, there is no evidence of cross-task downstream adoption.", "轮式底盘没有四足起步抬腿与足接触切换；多数本库后作将其作系统／数据背景引用，未核到直接沿用其整套训练。": "The wheeled chassis does not have four-legged starting, leg lifting and foot contact switching; most of the later works of this library refer to it as a system/data background, and do not directly use its entire set of training.", "PP-CoT 与 AAM 方法": "PP-CoT and AAM methods", "校准数据须覆盖任务速度与负载；只拟合单步误差不必保证长时滚动正确。": "Calibration data must cover task speed and load; fitting single-step errors does not necessarily ensure correct long-term rolling.", "是其实际接触反馈。": "is its actual contact feedback.", "Mobile ALOHA将ALOHA双臂遥操作硬件／示范学习扩展到带轮式底盘的全身遥操作。": "Mobile ALOHA extends ALOHA dual-arm teleoperation hardware/demonstration learning to whole-body teleoperation on wheeled chassis.", "全身运动质量依赖人形 mocap 先验；真机高动态和移动取放成功率较低。不能把人形实验直接外推到四足＋轻臂，也不能称其为 VLA 验证。": "The quality of whole-body motion depends on the humanoid mocap prior; the real robot’s high dynamics and mobile pick-and-place success rate are low. The humanoid experiment cannot be directly extrapolated to quadrupeds + light arms, nor can it be called VLA verification.", "经常被后作当作腿式地形背景引用，不能据此画成它们的具体策略、奖励或地形编码直接继承。": "is often cited as a legged terrain background in later works, and their specific strategies, rewards, or terrain codes cannot be directly inherited based on this.", "Go1＋外挂机械臂；四足＋臂": "Go1＋ external robotic arm; four legs + arm", "40真机trials：pull20/20、push18/20＝95%；门都成功打开，失败主要在突出doorway通过；门/handle位置依赖MoCap或外部cameraAprilTag，不是纯机载自然视觉门检测；去掉recurrence无法有效imitation，去辅助door type loss对模仿loss几乎无影响；不支持分类头性能关键；未unlock时push/pull循环可把自身转动误认为handle已转，直接暴露操作效果不可观测问题；PD目标裁剪currentq±0.7τlimit/Kp以限制名义关节作用，不是实际接触力上界": "40 real robot trials: pull20/20, push18/20=95%; the doors are all opened successfully, and the failure is mainly due to the protruding doorway passing; the door/handle position relies on MoCap or external cameraAprilTag, not purely airborne natural vision door detection; removing recurrence cannot effectively imitation, to assist door type Loss has almost no impact on imitating loss; it does not support the key performance of the classification head; when it is not unlocked, the push/pull cycle can mistake its own rotation for the handle has rotated, directly exposing the problem of unobservable operating effects; PD target clipping currentq±0.7τlimit/Kp is to limit the nominal joint action, which is not the upper limit of the actual contact force", "safeprobabilityTD学习；KL塑造latent半径与生存对应；normtruncation best-effort意图投影": "safeprobabilityTD learning; KL shapes latent radius and survival correspondence; normtruncation best-effort intent projection", "第一式表示统一动作接口，": "The first formula represents the unified action interface.", "运动学可达、动力学可行与策略能力": "Kinematic reachability, dynamic feasibility, and controller competence", "是重力加速度。": "is the acceleration due to gravity.", "缩放控制": "Zoom Control", "仿真柜门任务、双手举起与两手交接。缺真机验证，价值主要在形态方案和“语言选技能／控制器执行”的分层接口。": "Simulation cabinet door task, raising both hands and handover. Lacking real robot verification, the value lies mainly in the form scheme and the hierarchical interface of \"language selection skills/controller execution\".", "是机器人作用于物体的接触力旋量。": "is the contact force spin amount of the robot acting on the object.", "动作表示／延迟匹配": "Action expression/delayed matching", "输入：身体和臂的状态、模型、接触条件，以及操作者给出的身体速度、朝向和臂关节目标。 输出：规划层输出未来身体运动和机械臂力矩；腿的下层控制器把身体运动计划转成腿部力矩，臂力矩直接执行。": "Input: body and arm status, model, contact conditions, as well as body speed, orientation and arm joint targets given by the operator. Output: The planning layer outputs future body motion and robotic arm torque; the lower-layer controller of the leg converts the body motion plan into leg torque, and the arm torque is directly executed.", "分阶段 SAC 教师解决长任务探索，教师物体信息限制在相机视场内；学生不观察阶段真值，以蒸馏＋RL 学单一策略。学生由 RGB／语言预测任务相关 mask/depth 作视觉瓶颈，部署无需深度输入；另学 stationary bit 在抓取／放置时强制基座速度为零。": "Phased SAC teachers solve long task exploration, and the teacher’s object information is limited to the camera’s field of view; students do not observe the stage true values and learn a single strategy through distillation + RL. Students use RGB/language prediction task-related mask/depth as a visual bottleneck, and deployment does not require depth input; they also learn stationary bits to force the base speed to zero during grab/placement.", "40 真机 trials，拉门20/20、推门18/20＝95%；所有门都打开，失败在突出门口通过。MoCap 或外部相机 AprilTag 提供门／把手位置，95% 不代表纯机载自然视觉结果。": "40 real robot trials, sliding door 20/20, pushing door 18/20 = 95%; all doors are open, failure passes through the protruding door. MoCap or external camera AprilTag provides door/handle position, 95% does not represent pure onboard natural vision results.", "正文方法、实验、消融和结论审读；控制器公式与真机试验数回查": "Review of text methods, experiments, ablation and conclusions; review of controller formulas and real robot test data", "全部主文定量在 Isaac Gym，33 seen/6 unseen objects，500 episodes×3 seeds，遮挡/dropout/noise/jitter四级；Difficult 成功62.3%，VBC46.2%、DQ58%；Hard54.8%对DQ44.3%；成功动作平滑性 ASL1 0.289 对0.370；DQ在已经成功的episodes上更快，故效率非各项统优；固定EMA没有稳定收益，选择性可靠性/时间记忆优于该简单平滑基线；不同相机descriptor各自归一化像素/深度，策略融合的是特征，不是注册后的物理三维点平均": "All main text quantitative in Isaac Gym, 33 seen/6 unseen objects, 5000 episodes × 3 seeds, occlusion/dropout/noise/jitter level 4; Difficult success 62.3%, VBC46.2%, DQ58%; Hard54.8% vs. DQ44.3%; Successful action smoothness ASL1 0.289 To 0.370; DQ is faster on already successful episodes, so the efficiency is not optimal in all aspects; fixed EMA has no stable income, and selective reliability/time memory is better than this simple smooth baseline; different camera descriptors each normalize pixels/depth, and the strategy fuses features, not the physical three-dimensional point average after registration", "视觉条件扩散策略表示未来多种可能动作。": "Visual conditional diffusion strategies represent multiple possible future actions.", "关抽屉、开灯、放马桶盖，各五次导航共 9/15＝60%。操作从统一准备姿态单独开始，12/15＝80%；这是条件操作率，不是完整导航后操作的端到端成功。相同小样本下，position+velocity ACT 46.67%，完整80%。": "Close the drawer, turn on the light, and put down the toilet seat, five navigations each, a total of 9/15 = 60%. The operation starts individually from the unified preparation posture, 12/15 = 80%; this is the conditional operation rate, not the end-to-end success of the operation after complete navigation. Under the same small sample, position+velocity ACT is 46.67%, complete 80%.", "复用Visual WBC解决推物导航，可展示低层跨任务使用；不是新的通用全身控制器。": "Reuse Visual WBC to solve object navigation, which can demonstrate low-level cross-task usage; it is not a new universal whole-body controller.", "接触与可行性": "Contact and feasibility", "方法贡献通常在任务接口、控制结构或训练信息，而非首次使用PPO。论文给出的critic特权状态不等于部署策略也能读到。": "Method contributions are usually in task interfaces, control structures, or training information, rather than the first use of PPO. The critic privilege status given in the paper can be read even if it is not equal to the deployment strategy.", "原始UMI与Diffusion Policy均被UMI on Legs正文明确采用；CMP继承UMI on Legs设置。阶段分工比单纯按发表时间排序更准确。": "Both the original UMI and Diffusion Policy are explicitly adopted by the UMI on Legs text; CMP inherits the UMI on Legs settings. Stage division of labor is more accurate than simply sorting by publication time.", "篇正文核读": " papers reviewed", "不因参考文献列表命中而推断方法继承；部分早期原作没有移动操作实验。": "Method inheritance is not inferred due to reference list hits; some early originals did not have mobile operation experiments.", "Visual WBC→DQ-Net／Interactive Navigation／Deployment Framework是正文明确的低层或实现复用。Dynamic Pick-and-Place把Visual WBC低层重训为对照，任务和观测不同；不是整个系统的线性排名。": "Visual WBC→DQ-Net/Interactive Navigation/Deployment Framework is a clear low-level or implementation reuse. Dynamic Pick-and-Place retrains the lower layers of Visual WBC as controls, with different tasks and observations; it is not a linear ranking of the entire system.", "单刚体、质心动量和完整关节动力学保留的变量不同。模型精度、参数校准与闭环补偿应按任务敏感性和算力分别比较。": "Single rigid body, center of mass momentum, and full joint dynamics retain different variables. Model accuracy, parameter calibration, and closed-loop compensation should be compared separately based on task sensitivity and computing power.", "π0.5、MoGe重建、图像inpainting与离散行走接口为复用组件；不是人视频直接作为机器人joint action，也不是机器人数据零需求": "π0.5, MoGe reconstruction, image inpainting, and discrete walking interfaces are reused components; human videos are not directly used as robot joint actions, nor are robot data zero requirements", "任务指令是身体坐标下vx、vy、yaw速度；行为向量有8维：三组足间相位、步频、身体高度、身体pitch、站宽、抬脚高度。正文§3.2报告30步关节状态、身体重力方向、命令／行为、过去动作和四足时钟历史；另从历史监督估计身体速度与摩擦。输出12关节位置偏移，经PD（kp=20、kd=0.5）执行；Go1 Edu＋Jetson TX2 NX，50 Hz。没有机械臂、末端目标、相机／地形图或接触力操作目标。": "The task instructions are vx, vy, and yaw speeds in body coordinates; the behavior vector has 8 dimensions: three groups of interfoot phase, stride frequency, body height, body pitch, stance width, and foot lift height. Text §3.2 reports 30-step joint status, body gravity direction, commands/behaviors, past movements and quadruped clock history; in addition, body speed and friction are estimated from historical supervision. Output 12 joint position offsets, executed by PD (kp=20, kd=0.5); Go1 Edu+Jetson TX2 NX, 50 Hz. There are no robotic arms, end targets, cameras/terrain maps, or contact force manipulation targets.", "建立真实轨迹库，按各任务的学习情况调整抽样难度；用轨迹历史预测未来目标，用自身状态历史估计身体速度，再训练全身跟踪。": "Establish a real trajectory library and adjust the sampling difficulty according to the learning situation of each task; use trajectory history to predict future targets, use own state history to estimate body speed, and then train whole-body tracking.", "本地 PDF 标题核对；主文完整，包括数据采集、策略表示、任务/导航系统、全部结果及讨论。未核查项目代码与视频。": "Local PDF title check; main text is complete, including data collection, strategy representation, task/navigation system, all results and discussion. The project code and video have not been verified.", "CPU物理仿真与GPU神经网络往返传输限制大批量机器人RL训练速度。": "The round-trip transmission between CPU physical simulation and GPU neural network limits the speed of large-scale robot RL training.", "RL／全身": "RL / whole body", "高层可以输出身体速度、末端轨迹或臂关节目标，低层负责快速稳定执行。这样高层搜索的维度和数据要求更小；高层必须在底层真正学到的能力内动作。‘解耦’不表示物理上互不影响，而表示控制权限通过一个有限接口传递。": "The high level can output body speed, terminal trajectory or arm joint target, and the low level is responsible for fast and stable execution. In this way, the dimensions and data requirements of high-level search are smaller; the high-level must act within the capabilities truly learned by the bottom. ‘Decoupled’ does not mean that they are not physically affected by each other, but that control permissions are transferred through a limited interface.", "平台": "Platform", "触觉压力分布、握力与机械臂施给物体的任务力不同。归一化触觉图可能保留局部模式，却丢失绝对力刻度；突然释放还改变全身负载。": "The tactile pressure distribution, grip force and the task force exerted by the robotic arm on the object are different. Normalized tactile maps may preserve local patterns but lose absolute force scale; sudden releases also change whole-body loading.", "仿真 B1＋Z1；四足＋机械臂。补充 Go2 示范的真实硬件属性未完整核实": "Simulation B1+Z1; four legs + robotic arm. Supplement: The real hardware attributes of the Go2 demonstration have not been fully verified.", "轮式 Hexman Echo Plus＋RM65": "Wheeled Hexman Echo Plus＋RM65", "是各电机的关节力矩。": "is the joint torque of each motor.", "【仿真＋G1 真机】共享的 129,514 条 BONES-SEED **训练动作**上，单 H100 训练 3 h 后失败 25 条；双 H100 训练 9.8 h 后失败 0 条；SONIC 公开权重失败 179 条。单 H100 约 3 h 超过 SONIC 公开权重的归一化回报；后者报告 128 张 L40 训练约 168 h。较公平的 LAFAN1 40 条动作控制对照中，SuperMimic 单卡约 1.2 h 达到评估回报 0.82，PPO-Sim 在 18 h／至多 8 卡预算内未达到；PPO-on-world-model 对照支持模型梯度收益，critic／短时域消融支持扰动恢复。真机仅展示跳跃、侧滚和翻转；另有仿真速度阶跃测试，RL 速度编码器在 672 种命令中 650 种稳态误差较小。": "Simulation and physical Unitree G1. On 129,514 training motions, the one-H100 policy fails 25 clips after 3 h; a two-H100 policy fails none after 9.8 h; SONIC’s released checkpoint fails 179. In a controlled comparison on 40 LAFAN1 clips, SuperMimic reaches evaluation return 0.82 in about 1.2 h on one H100, whereas PPO-Sim does not within 18 h using up to eight H100s. Ablations test model-gradient updates and the critic. Real-robot demonstrations show a skipping jump, side roll, and flips. A simulated velocity-step test favors the RL-trained encoder on 650 of 672 commands.", "离线规划；含抗扰目标的阀门轨迹求解约 26–38 秒。接触顺序和时间由外部给定，没有物体动力学或接触力反馈。模型余量比实测失效阈值高 21–22%，施力方向测试有限。": "Offline planning; the valve trajectory solution with anti-disturbance target takes about 26–38 seconds. Contact sequence and timing are given externally, with no object dynamics or contact force feedback. The model margin is 21–22% higher than the measured failure threshold, and testing in the direction of force application is limited.", "§5结果表及F/T对照": "§5 Result table and F/T comparison", "使用 PPO、Walk These Ways 步态接口、系统辨识与 OCS2 多重打靶／SQP。": "Using PPO, Walk These Ways gait interface, system identification and OCS2 multi-targeting/SQP.", "轮式双臂": "Wheeled Arms", "Go1，无臂；机身推双层堆物；动捕底层物体": "Go1, without arms; the body pushes double-layered objects; motion captures underlying objects", "低频观测、高频反馈与时间戳": "Slow observations, fast feedback, and timestamps", "阅读定位：": "Reading orientation:", "MolmoAct2 VLA输出11维底盘速度、身体pitch、六臂关节绝对角及夹爪；RL步态和关节轨迹控制器执行。": "The VLA emits an 11-dimensional command: body-frame base velocity, body pitch, six absolute arm joint targets, and gripper state. An arm-aware RL gait policy executes base commands; a joint-trajectory controller executes the arm. This is not an end-effector-only VLA interface.", "到达物体附近后，怎样开始并完成操作？": "How does the robot start and finish a task after approaching an object?", "示范动作的条件扩散分布": "Conditional diffusion distribution of demonstration actions", "输入：语言、头部 RGB、激光雷达及地图、腕部深度图；低层接收身体速度、末端目标、地形高度和自身状态。 输出：全局规划输出子任务和导航目标；局部模块输出末端姿态；全身策略输出腿和臂关节角度。": "Input: language, head RGB, lidar and map, wrist depth map; the lower layer receives body speed, end target, terrain height and own status. Output: The global planning outputs subtasks and navigation goals; the local module outputs the terminal posture; the whole-body strategy outputs the leg and arm joint angles.", "正文核读": "Full-text review", "低位瓶子和高架罐子任务与不含腿余量的 KOMO 对比，展示关节限位余量和可执行末端路径。规划时间由基线 104／120 ms 增至 270／285 ms。": "Comparison of low bottle and elevated can tasks with KOMO without leg margin, showing joint limit margin and executable end path. Planning time increases from baseline 104/120 ms to 270/285 ms.", "TAC-LOCO §4明确Inspired by the advantage-mixing idea in [10]并使用计划混合两个优势函数；[10]为Deep WBC。触觉表示与握持反馈是后作新增。": "TAC-LOCO §4 is clearly inspired by the advantage-mixing idea in [10] and uses a plan to mix two advantage functions; [10] is Deep WBC. Tactile display and grip feedback are new additions in later games.", "非直接language-actionVLA；非自主学任意limbrole；§6arm-support-locomotion仍future；MPCfailure不能说明matchingmulticontactMPC无效": "Indirect language-actionVLA; non-autonomous learning of arbitrary limbrole; §6arm-support-locomotion is still future; MPCfailure cannot indicate that matchingmulticontactMPC is invalid", "它提供的是训练时的动作梯度和快速模拟；真机部署只运行策略。这与K29所讨论的运行时预测／规划、视觉世界模型是不同用途。模型对地面接触成立，不代表对手端碰柜门的接触力峰值也准确；后者需要独立验证。": "The learned model supplies gradients and fast rollouts during training; the deployed robot runs only the policy. This differs from runtime prediction and planning in K29. Predicting foot–ground contact does not establish accurate predictions of hand–cabinet force peaks, which need separate tests.", "§3 Task-space WBC 与附录": "§3 Task-space WBC and Appendix", "是固定网络权重。历史估计速度／摩擦是另外的适应模块，不是": "is the fixed network weight. Historical estimated speed/friction is another adaptation module, not", "输入本体状态及EKF／飞行模型给出的击球位置、速度、时间等目标，统一输出腿和臂的18关节位置命令。策略100 Hz，机载视觉与预测异步60 Hz；不是RGB直接到关节的VLA。": "Input the body status and the hitting position, speed, time and other targets given by the EKF/flight model, and uniformly output the 18 joint position commands of the legs and arms. Strategy 100 Hz, on-board vision with prediction asynchronous 60 Hz; not RGB direct to joint VLA.", "给定接触计划怎样应对执行偏差": "Recovering from deviations in a contact plan", "核心主线依据可复用方法和正文承接证据选择，不按年份、单位或引用数单独排名。退出默认层不等于低质量；VLA近期代表尚不标作已有广泛继承的范式。": "The default mainline is selected by reusable methods and documented downstream adoption, not by year, institution, or citation count alone. Papers outside it are not necessarily lower quality; recent VLA approaches have not yet established broad downstream reuse.", "视觉扩散策略生成参数化 Bézier 足端轨迹／身体指令，低层接收当前及未来足端目标执行；分层使少量视觉示范不用学全部关节反馈。": "The visual diffusion strategy generates parameterized Bézier foot trajectories/body commands, and the lower layer receives current and future foot target execution; layering enables a small number of visual demonstrations without learning all joint feedback.", "是训练期特权状态；": "is the privileged status during the training period;", "执行器模型、课程和域随机的行走例证": "Actuator Model, Courses and Domain Random Walk Illustration", "预测和跟踪协议": "Forecasting and Tracking Protocol", "SigLoMa 以点云 PCA 的均值与主轴偏移构造七个稀疏点，再用 Kalman 预测和相机运动补偿；这里的 Sigma Points 不是无迹 Kalman 滤波的 sigma-point 机制，且平台是机身固定夹爪。UMI on Legs 的实机位姿延迟与 ROS 定时问题说明历史和预览都依赖时间一致性。DeViGrasp按相机特征与时间可靠性融合，没有实现双相机三维测量的几何注册与物理平均。": "SigLoMa constructs seven sparse points using the mean value and main axis offset of the point cloud PCA, and then uses Kalman prediction and camera motion compensation; the Sigma Points here are not the sigma-point mechanism of unscented Kalman filtering, and the platform is a fixed gripper of the fuselage. The real-machine pose delay and ROS timing issues of UMI on Legs illustrate that both history and preview rely on time consistency. DeViGrasp integrates camera characteristics and time reliability, and does not implement geometric registration and physical averaging of dual-camera three-dimensional measurements.", "人类视频和手持示范更容易收集，但人的身体、相机和动作并不等于四足＋臂。数据量增加不保证机器人可执行。": "Human videos and handheld demonstrations are easier to collect, but the human body, camera and movements are not equivalent to four legs + arms. Increased data volume does not guarantee that the robot can be executed.", "可操作性综述（预印本）": "Operability Review (Preprint)", "正文 §3–6完整审读；附录A–C latentgeometry/proof逐段、部分experiment/baseline补充；未全面独立验证proof适用性": "Text §3–6 Complete review; Appendices A–C latentgeometry/proof supplemented paragraph by paragraph and partial experiment/baseline; The applicability of the proof has not been fully and independently verified", "只给 VLA 加 history、只把 RL 与 WBC 拼起来、只更换机器人，并未自动形成独立方法贡献；仍需明确新增信息或控制能力。": "Only adding history to VLA, only combining RL and WBC, and only replacing robots do not automatically form independent method contributions; it is still necessary to clearly add new information or control capabilities.", "下的运动学可达、动力学可行及现有策略能力。这里没有为三者指定统一的精确集合模型，也不能未经条件论证就将它们视为同一个集合。": ". There is no unified precise set model specified for the three, nor can they be regarded as the same set without conditional argumentation.", "Deep WBC把ROA写成带乘子的交替优化，但实际λ按固定线性方案由0增加到1，并非根据约束违反程度自动更新。它约束特权编码器避免使用历史网络无法预测的表示；不能由两个网络交替训练就认定是标准ADMM或具有凸优化收敛保证。原文引用Levine等JMLR2016的guided policy search及Wang/Banerjee2014的BADMM，详见knowledge/deep-wbc.md。": "Deep WBC writes ROA as alternating optimization with multipliers, but the actual λ increases from 0 to 1 according to a fixed linear scheme, and is not automatically updated according to the degree of constraint violation. It constrains the privileged encoder to avoid using representations that the historical network cannot predict; it cannot be regarded as a standard ADMM or have convex optimization convergence guarantees by alternating training of two networks. The original text quotes the guided policy search of Levine et al. JMLR2016 and BADMM of Wang/Banerjee2014. For details, see knowledge/deep-wbc.md.", "CMP 使用 UMI on Legs 的数据／训练设置，并对超出能力的目标做投影。": "CMP uses data/training settings from UMI on Legs and projects beyond capabilities.", "拉开带回弹力的门后穿过去，可能需要先抓住、再用脚顶住、再松手。一个持续末端位姿目标不能描述整个过程。": "Pull open the elastic door and go through it. You may need to grab it first, then hold it with your feet, and then let go. A continuous end pose target cannot describe the entire process.", "区分2024首次公开与ICRA2025发表；摘要2.64 cm指楼梯结果。采用作者HTML v2及下载PDF回查，未观看补充视频。": "Distinguish between first publication in 2024 and publication in ICRA2025; abstract 2.64 cm refers to the staircase results. Use the author's HTML v2 and download the PDF for review, and have not watched the supplementary video.", "腿和臂分别控制时，臂够不到地面目标，身体也不知道应该蹲下或倾斜来帮忙。": "When the legs and arms are controlled separately, the arms cannot reach the target on the ground, and the body does not know where to squat or lean to help.", "把机器人质心动力学与被操作物体动力学放入同一多接触最优控制问题，接触时序由预设切换约束编码；在线反复求解有限时域。与2023 ETH工作相比，本文不搜索离散接触顺序。": "Put the dynamics of the robot's center of mass and the dynamics of the manipulated object into the same multi-contact optimal control problem, and the contact timing is encoded by preset switching constraints; solve it repeatedly online in the finite time domain. In contrast to the 2023 ETH work, this article does not search for discrete contact orders.", "GR00T-N1.7输出手／足几何目标和独立法向力命令；TO提供关节力矩监督训练任务专用RL力控制器，再用rollout训练VLA。独立力矩token与未来力矩辅助损失。": "GR00T-N1.7 outputs hand/foot geometric targets and independent normal force commands; TO provides a dedicated RL force controller for joint torque supervision training tasks, and then uses rollout to train VLA. Independent torque token and future torque auxiliary loss.", "是切向载荷，": "is the tangential load,", "简化身体模型常把机器人当单刚体，忽略内部关节动力学；更完整的模型保留臂惯量、关节力矩或多接触。在选择模型时应明确被忽略的项是否正好影响当前任务。例如慢按按钮和快速摆臂，对臂惯性的敏感性不同。": "Simplified body models often treat the robot as a single rigid body and ignore internal joint dynamics; more complete models retain arm inertia, joint moments or multiple contacts. When choosing a model, it should be clear whether the ignored items exactly affect the current task. For example, pressing a button slowly and swinging an arm quickly have different sensitivities to arm inertia.", "未来足端点": "Future foot endpoint", "当前力矩生成": "Current moment generation", "只在仿真训练的腿式策略到真实地形后，摩擦、载荷、地面软硬无法直接观测且会变化。": "Only after the leg strategy trained in simulation reaches the real terrain, friction, load, and ground softness and hardness cannot be directly observed and will change.", "真机动捕，主要抓取接触失败；跨论文十倍速度不是公平基线。": "Real-motor capture, main grab contact failure; ten times faster across papers is not a fair baseline.", "真机物体重定向与插入、拧紧阀门、轻柔抓取，每个任务设置 20 次。对照分别增加触觉观测、触觉预测和低层触觉跟踪；薯片任务的三个触觉版本均 100% 成功，不能据它单独证明低层触觉目标必要。": "Reorientation and insertion of real objects, tightening valves, and gentle grasping, 20 times per task. The controls added tactile observation, tactile prediction and low-level tactile tracking respectively; the three tactile versions of the potato chip task were all 100% successful and cannot be relied upon to alone prove that low-level tactile targets are necessary.", "全身动力学把身体、腿和臂放在同一个受力与运动关系中。‘广义配置’是把身体位姿和所有关节位置组成一个状态；‘广义力’是与这些运动对应的作用量，其中既有推动身体平移的力，也有使身体或关节转动的力矩。下面的式子记录电机和环境接触如何共同产生这些作用。": "Whole body dynamics puts the body, legs, and arms into the same force and motion relationship. ‘Generalized configuration’ is the combination of the body posture and the positions of all joints into a state; ‘generalized force’ is the amount of action corresponding to these movements, including the force that promotes the translation of the body and the torque that causes the body or joints to rotate. The equations below document how motor and environmental contacts work together to produce these effects.", "研究问题": "Research question", "握力与突然释放": "Grip strength and sudden release", "在抓取失败、接触滑脱和对象参数变化时，分别测固定时间、可调进度和重新规划；任务微调另测速度与稳定性的变化。": "When grasping fails, contact slips, and object parameters change, fixed time, adjustable progress, and re-planning are measured respectively; during task fine-tuning, changes in speed and stability are also measured.", "真机杯子重排、推壶铃和投球，每种主要条件 20 次；投球从人工放入球的预抓取状态开始。仿真分别移除预览、任务坐标和真实操作轨迹；文中 Deep WBC 风格基线由同时移除这三个组件构造。原固定臂的杯子操作策略直接部署到四足上。": "Real cup rearrangement, kettlebell press, and pitching, 20 times per main condition; pitching starts in pre-catch state with manually placed ball. The simulation removes the preview, task coordinates and real operation trajectory respectively; the Deep WBC style baseline in this article is constructed by removing these three components simultaneously. The cup-operating strategy of the original fixed arm is deployed directly onto the quadruped.", "在 FastWAM 的视频/动作联合模型上，教师看未来视频 latent、学生仅看当前输入，蒸馏可由当前状态预测的 action-equivalent representation；将 base/arm 分成两个16维 latent，用自己的预测头保留动作信息、交叉梯度反转抑制另一组信息，并给视频分支当前基座速度。": "On FastWAM's video/action joint model, the teacher looks at the future video latent, and the student only looks at the current input, distilling an action-equivalent representation that can be predicted from the current state; split the base/arm into two 16-dimensional latent, use its own prediction head to retain the action information, cross gradient reversal to suppress another set of information, and give the video branch the current base velocity.", "移除多个组件构成的 baseline、能力不支持目标任务的 controller，以及同时改变数据／网络／接口的比较，所支持的结论较窄。FWBC-VLA 有 FI／BC 消融，但正文与表格部分数字不一致；DECOWAM 的真实总成功率 46/79 与 FastWAM 45/79 接近，不能仅凭更高单项分数写成整体显著提升。": "Removing baselines composed of multiple components, controllers whose capabilities do not support the target task, and comparisons that simultaneously change data/network/interfaces support narrower conclusions. FWBC-VLA has FI/BC ablation, but the numbers in the text and tables are inconsistent; the true total success rate of DECOWAM is 46/79, which is close to FastWAM 45/79. It cannot be written as an overall significant improvement based on higher individual scores alone.", "正文方法、训练、主要实验与结论审读；提取的双栏段落逐项核对；未逐项复核所有补充图": "Review of text methods, training, main experiments and conclusions; the extracted double-column paragraphs were checked item by item; all supplementary figures were not reviewed item by item", "仿真退化分布与真机相关噪声、标定误差、光照等未充分等价验证；手动/既有分割接口和高层目标语义限制仍在；没有按钮成功事件记忆，也没有校准接触力/换步安全指标": "The simulated degradation distribution is not fully verified as equivalent to the noise, calibration error, lighting, etc. related to the real robot; the manual/existing segmentation interface and high-level target semantic restrictions are still there; there is no button success event memory, and there is no calibration contact force/step change safety indicator", "将新论文填写到对应知识节点的比较段落，若无法描述新的决策／假设／证据，再检查增量是否来自系统组合。": "Fill in the new paper into the comparison paragraph of the corresponding knowledge node. If the new decision/hypothesis/evidence cannot be described, then check whether the increment comes from the combination of the system.", "用未来信息减少只追当前误差的问题。": "Use future information to reduce the problem of only chasing current errors.", "$F_{\\mathrm{ext}}$ 是环境作用在机器人接触处的物理力；$c$ 表示该接触。$J_{c,a}$ 是接触 Jacobian 中对应机械臂关节速度的列；它根据姿态和接触位置描述关节运动与接触点运动的关系，转置则将接触力换算成关节力矩。": "$F_{\\mathrm{ext}}$ is the physical force acting on the robot at the contact point of the environment; $c$ represents the contact. $J_{c,a}$ is the column corresponding to the robot arm joint speed in the contact Jacobian; it describes the relationship between the joint motion and the contact point motion based on the attitude and contact position, and the transposition converts the contact force into a joint torque.", "Unitree G1 人形；训练动作筛掉地形和物体交互": "Unitree G1 humanoid; training actions filter out terrain and object interactions", "第二式是动作均值蒸馏的一般形式：$\\mu_S,\\mu_T$ 是学生与教师的动作预测，$\\mathcal D$ 是用于蒸馏的数据分布。潜变量监督、教师与适配器联合约束可有不同损失。": "The second formula is the general form of action mean distillation: $\\mu_S,\\mu_T$ are the action predictions of students and teachers, and $\\mathcal D$ is the data distribution used for distillation. Latent variable supervision, teacher and adapter joint constraints can have different losses.", "接触力分配 QP 计算前馈力矩，RL 同时修正期望身体加速度和逆运动学关节目标；前馈与 PD 反馈分离，使较低反馈增益下仍可支撑并柔顺交互。": "Contact force distribution QP calculates the feedforward moment, and RL simultaneously corrects the desired body acceleration and inverse kinematics joint targets; the feedforward and PD feedback are separated, so that the interaction can still be supported and compliant under low feedback gain.", "训练一个带简化运动学先验的物体动力学模型，再从“机器人动作能否明显改变物体后续状态”形成内在探索奖励；学习到的数据继续修正这个模型。与人为设计靠近／推箱奖励相比，奖励来自物体受到动作影响的程度。": "Train an object dynamics model with simplified kinematics priors, and then form an intrinsic exploration reward based on \"whether the robot's actions can significantly change the subsequent state of the object\"; the learned data continues to modify this model. In contrast to artificial approach/box pushing rewards, the reward comes from the degree to which the object is affected by the action.", "方法：未来条件教师与因果学生蒸馏": "Method: Future Conditional Teacher and Causal Student Distillation", "估计器噪声、不同通道频率、传感器时间戳、训练／部署模态缺失需单独处理。": "Estimator noise, different channel frequencies, sensor timestamps, and missing training/deployment modes need to be handled separately.", "动作与目标分解": "Decomposition of actions and goals", "真机 14 个物体×3 高度×5 次重置，每轮允许连续五次尝试，因此不是 one-shot 成功率。附录 E 行走位置误差 0.029 m 对 Deep WBC 0.414 m 来自仿真，不是真机接触精度。": "real robot 14 objects × 3 height × 5 resets, each round allows five consecutive attempts, so it is not a one-shot success rate. Appendix E Walking position error 0.029 m versus Deep WBC 0.414 m comes from simulation, not real robot contact accuracy.", "是想象轨迹长度（论文默认32步），": "is the imagined trajectory length (the paper defaults to 32 steps),", "学生 THM/TMA/recovery descriptor 与 GRU": "Student THM/TMA/recovery descriptor and GRU", "这是结构记号，不是统一策略与协作策略等价的证明，也不表示所有双策略论文都交换姿态请求。模型分工还可以让操作肢体由逆运动学或模型控制执行。": "This is structural notation, not a proof of the equivalence of unified strategy and collaborative strategy, nor does it mean that all dual-strategy papers exchange gesture requests. Model division of labor also allows operating limbs to be performed by inverse kinematics or model control.", "仿真末端位置／姿态 RMSE 比相应最佳基线低 28.7%／27.4%，另有响应训练／模型辨识的 2×2 消融及留出命令的预测测试。真机 8 条动捕轨迹的位置 RMSE 为 7.60 cm、姿态为 9.93°；无动捕任务的误差由机载里程计重建，未独立测量世界坐标漂移。部分基线另配外部底盘路径跟踪器，接口不同；论文未量化接触力或安全事件。": "The simulated end position/attitude RMSE is 28.7%/27.4% lower than the corresponding best baseline, and there is also a prediction test of 2×2 ablation and leave-out commands in response to training/model identification. The position RMSE of the eight motion capture trajectories of the real robot is 7.60 cm and the attitude is 9.93°; the error of the non-motion capture mission is reconstructed by the airborne odometry, and the world coordinate drift is not independently measured. Some baselines are equipped with external chassis path trackers with different interfaces; the paper does not quantify contact forces or safety events.", "仿真总体成功率不能外推真机；末端对准和小物体抓取仍失败；局部 Qwen 生成姿态仍需几何约束、深度和任务运动规则；论文 Table 3 单位/缩放未清晰说明，不能未经核对将数字解释为米或厘米；地图中无碰撞 waypoint 不保证后续臂工作空间与接触路径可行": "The overall success rate of simulation cannot be extrapolated to the real robot; end alignment and small object grasping still fail; local Qwen pose generation still requires geometric constraints, depth and task motion rules; the unit/zoom of the paper Table 3 is not clearly explained, and the numbers cannot be interpreted as meters or centimeters without verification; there is no collision waypoint in the map, which does not guarantee that the subsequent arm workspace and contact path are feasible", "这里只表示共享或相邻机制；具体改动与审读范围见论文贡献。": "This only marks shared or adjacent mechanisms; see Paper contributions for each paper's actual change and review scope.", "是窗口之后的价值估计。更新策略时经": "is the value estimate after the window. Update strategy time", "不优化步态／接触序列，无真机。神经网络近似没有全局保守可行性证明；文中提出可兼容商业速度接口，但未在这些商业机器人上验证。": "No gait/contact sequence optimization, no real robot. The neural network approximation has no global conservative feasibility proof; the article proposes a compatible commercial speed interface, but it has not been verified on these commercial robots.", "$r_{\\mathrm{task}}$奖励速度跟踪；固定辅助项$r_{\\mathrm{fixed}}$鼓励稳定和平滑；行为辅助项$r_{\\mathrm{behavior}}$鼓励跟踪$b_t$要求的姿态、接触时序和足轨迹。原文辅助项为负、$\\alpha=0.02$；此式强调奖励组合，不替代原文Table 1各项。": "$r_{\\mathrm{task}}$ rewards speed tracking; fixed auxiliary items $r_{\\mathrm{fixed}}$ encourage stability and smoothness; behavioral auxiliary items $r_{\\mathrm{behavior}}$ encourage tracking of posture, contact timing, and foot trajectories required by $b_t$. The original auxiliary term is negative, $\\alpha=0.02$; this formula emphasizes the reward combination and does not replace the items in Table 1 of the original text.", "RSS2026人形基础动作模型代表；人类视频与机器人动作分阶段训练。正式发表支持阅读优先级，不证明已经形成下游范式。": "Representative of RSS2026 humanoid basic action model; human video and robot action staged training. Formal publication supports reading priority and does not prove that a downstream paradigm has been formed.", "Deep WBC §2.2/实验将RMA作为两阶段teacher-student对照，并针对潜表示训练方式提出ROA。": "Deep WBC §2.2/The experiment uses RMA as a two-stage teacher-student control, and proposes ROA for the latent representation training method.", "Go1两前小腿各装3DoF/147g操纵模块；每条腿＋模块形成6DoF操作肢": "The two front legs of Go1 are each equipped with 3DoF/147g control modules; each leg + module forms a 6DoF operating limb", "keyframe/motionretargeting、IK、multi-criticPPO与VLMplanner为已有机制结合；作者库限定任务动作；VLM不是自由生成continuousjointactions；物体相对目标与数据扩增的共同坐标思想不等于直接承接DemoHLM/MimicGen": "Keyframe/motion retargeting, IK, multi-criticPPO and VLMplanner are combined with existing mechanisms; the author library limits task actions; VLM does not freely generate continuous joint actions; the common coordinate idea of object relative targets and data amplification is not equivalent to directly inheriting DemoHLM/MimicGen", "UMI on Legs §3.1明确采用U-Net diffusion policy及DDIM，延长未来动作窗口给WBC。": "UMI on Legs §3.1 explicitly adopts U-Net diffusion policy and DDIM to extend the future action window for WBC.", "小型平台力矩余量少，复杂地形晃动使操作策略看到的状态不断扰动；只在平地练手又无法走到任务点。": "The small platform has little torque margin, and the shaking of complex terrain constantly disturbs the state seen by the operation strategy; you can only practice on flat ground and cannot reach the task point.", "与人形Force-Adaptive FALCON 2505.06776分开。AIRBOT型号不凭外形认定Play；无阶段标签不等于无人工阶段描述。": "Separated from humanoid Force-Adaptive FALCON 2505.06776. AIRBOT models are not identified as Play based on appearance; no stage label does not mean no artificial stage description.", "任务特化可以是合理研究选择；需要判断特化是否隔离了可解释的困难，以及证据是否覆盖声称范围。": "Task specialization can be a reasonable research option; judgment needs to be made on whether the specialization isolates explainable difficulties and whether the evidence covers the claimed scope.", "综述，覆盖 embodied AI，不限于移动操作。": "Overview, covering embodied AI, not limited to mobile operations.", "只有两任务，主要改变初始位置；阶段文字由人工构造，不是无需任务先验。对比损失有时降低OOD导航指标，并非所有环节有益。Task2的到位与整体完成判据不同；human-in-loop正文100%表述与Table III局部80/90%不一致，分开记录，不能统一称全自主100%。无接触力安全统计。": "There are only two tasks, mainly changing the initial position; the stage text is constructed manually, and no task prior is required. Contrast loss sometimes reduces OOD navigation indicators, which is not beneficial for all links. The criteria for Task 2 being in place are different from the overall completion criteria; the 100% description in the human-in-loop text is inconsistent with the partial 80/90% in Table III. They are recorded separately and cannot be collectively referred to as 100% fully autonomous. No contact force safety statistics.", "将身体坐标的向量旋转到世界坐标；": "Rotate the vector of body coordinates to world coordinates;", "相较单技能视觉方法，增加地图支持的任务分解与局部操作；相较仅按语言串技能，进一步处理移动视角、空间目标和地形执行。": "Compared with the single-skill visual method, the task decomposition and local operations supported by the map are increased; compared with stringing skills only by language, the mobile perspective, spatial target and terrain execution are further processed.", "固定模式顺序后优化连续运动，与搜索模式顺序并检查连续可行性，是不同问题。模式序列的流程图不能替代具体接触约束或优化方程。": "Optimizing continuous motion after fixing the pattern sequence is a different problem than searching for the pattern sequence and checking the continuity feasibility. Flowcharts of pattern sequences are not a substitute for specific contact constraints or optimization equations.", "从人体mocap学习手端条件全身运动先验，自回归生成未来全身动作，再交给全身控制器。": "A human-mocap motion prior generates whole-body motion conditioned on end-effector trajectories; a whole-body controller then tracks those references.", "后作可能复用同一个底层工具、数据接口或动作模型，同时另行设计机器人全身执行。": "Later works may reuse the same underlying tools, data interfaces or action models, and at the same time design a new robot for whole-body execution.", "全身 VLA 与把接触估计送入动作模型并补偿底盘的轮足方案；平台不同。": "whole-body VLA is a different platform than a wheel-foot solution that feeds contact estimates into the motion model and compensates for the chassis;", "世界模型在训练中给策略梯度，不是部署时的视觉世界模型或在线MPC；接触地面做翻滚不等于接触物体操作；附录列手端目标为可能接口，但没有实测该接口。": "The world model gives policy gradients during training, not the visual world model or online MPC during deployment; rolling on the ground does not mean contacting the object; the appendix lists the mobile target as a possible interface, but there is no actual test of this interface.", "。这里没有指定 ReCo 训练参考与部署模型使用相同阶次或相同系数。": ". There is no specification here that the ReCo training reference uses the same order or the same coefficients as the deployed model.", "force tracking 与 position baseline": "force tracking and position baseline", "历史编码与显式辨识的区分": "The difference between historical encoding and explicit identification", "【真机＋仿真，行走为主】Go1真机切换trot／pace／bound／pronk及2–4 Hz节律；有人调参数通过台阶／路沿、灌木和22 cm低横杆，并提前加宽站姿抗推；身体倾斜倾倒所携球属于简单身体载荷操作。平台地形和能耗对照主要为仿真：最高16 cm随机平台，三种seed，报告episode存活时间比例，trot 0.88、pace 0.87、gait-free 0.83。Table 3在1 m/s时trot机械功率24、gait-free 35，不能当作真机电池续航。Table 5也显示gait-free平地高速组合性能更好。前跳和舞蹈为预设参数序列演示，不是自动规划。": "[real robot + simulation, mainly walking] Go1 real robot switches trot/pace/bound/pronk and 2-4 Hz rhythm; someone adjusts the parameters to pass steps/kerbs, shrubs and 22 cm low crossbar, and widens the stance in advance to resist push; tilting the body and dumping the ball carried are simple body load operations. The comparison of platform terrain and energy consumption is mainly simulation: random platform up to 16 cm, three kinds of seeds, reporting episode survival time ratio, trot 0.88, pace 0.87, gait-free 0.83. Table 3 shows trot mechanical power of 24 and gait-free 35 at 1 m/s, which cannot be used as a real robot battery life. Table 5 also shows that the gait-free flat ground and high-speed combination performs better. Front jump and dance are demonstrations of preset parameter sequences, not automatic planning.", "Opt2VLA进一步显式输出期望法向力，交由任务专用RL控制器执行；轨迹优化提供力矩监督仅用于训练。其消融能分别观察力条件、力矩监督及VLA编码的作用，真机擦拭误差仍约7N。它是人形邻接证据，没有证明四足持续换步接触。": "Opt2VLA further explicitly outputs the desired normal force, which is executed by the task-specific RL controller; trajectory optimization provides moment supervision only for training. Its ablation can observe the effects of force conditions, torque supervision and VLA encoding respectively, and the real robot wiping error is still about 7N. It is evidence of humanoid adjacency and does not prove that the four legs are in constant contact at each step.", "仅仿真；区域定位与操作案例，部分目标用红色标记；报告16–40秒推理。": "Simulation only; regional positioning and operation cases, some targets marked in red; 16–40 seconds of reasoning reported.", "§III-A/B，尤其III-B.6；§IV-A/B；Tables III/IV；Fig.7": "§III-A/B, especially III-B.6; §IV-A/B; Tables III/IV; Fig.7", "；此式强调奖励组合，不替代原文Table 1各项。": "; This formula emphasizes the reward combination and does not replace the items in Table 1 of the original text.", "四足移动操作综述": "Overview of quadruped mobility operations", "模型控制能明确计算施力，但怕模型不准；单靠学习又不容易精确控制接触力。": "Model control can clearly calculate the applied force, but it is afraid that the model is inaccurate; it is not easy to accurately control the contact force by learning alone.", "真机开关重洗碗机、通过弹簧门；也有阀门等仿真任务。": "The real robot switches the dishwasher on and off and passes the spring door; it also has simulation tasks such as valves.", "用专家数据预测动作误差很低，实机仍可能失败：策略的小误差会改变后续观测，而示范未包含它自己造成的偏离。": "Predicting actions with expert data has low error, and the real robot can still fail: small errors in the strategy can alter subsequent observations, and the demonstration does not include its own deviations.", "技能均值 71.2%，对 ACT 40.8%、OpenTV 64.4%；系统与表征存在多项差异，不能只归因 LLM；开门 head+wrist 70%，head 30%，wrist 10%；按钮 wrist 85%，双相机 80%，支持视角选择与任务有关；普通 DinoV2 83.3% 高于普通 CLIP 76.4%，相关图 CLIP 84.7%；不支持 CLIP 天生优于其他视觉编码；长任务垃圾收集 7/10、货架 3/10，direct ACT 为零；技能分解、终止和系统结构同时变化；四名操作员遥操作地面抓取 21.87 s 对 37.35 s，支持 WBC 在数据采集中的协调收益": "Average skill value is 71.2%, ACT 40.8%, OpenTV 64.4%; there are many differences in the system and representation, which cannot be attributed to LLM alone; door opening head+wrist 70%, head 30%, wrist 10%; button wrist 85%, dual camera 80%, support perspective selection is related to the task; ordinary DinoV2 83.3% is higher than ordinary CLIP 76.4%, correlation map CLIP 84.7%; no support for CLIP inherently better than other visual encodings; long task garbage collection 7/10, shelf 3/10, direct ACT is zero; skill decomposition, termination and system structure changes simultaneously; four operators teleoperated ground grabbing 21.87 s vs. 37.35 s, supporting WBC coordination gains in data collection", "投影改变原目标；学习边界有估计误差，不能当无条件安全。": "Projection changes the original target; the learning boundary has estimation errors and cannot be regarded as unconditionally safe.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；特权critic不能直接部署；仿真真值若与现实偏差太大也未必帮得上忙。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; privileged critic cannot be deployed directly; if the simulation true value deviates too much from reality, it may not be able to help.", "高层输出末端路径，还是同时输出身体命令？": "End-effector waypoints or explicit body commands?", "本地 PDF 标题核对；主文完整，附录 A
