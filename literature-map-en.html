e": "Affordance regions, contact targets, and action parameters"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "Vision-language foundations", "platform_en": "Universal visual language model"}, {"id": "1710.06542", "title": "Asymmetric Actor Critic for Image-Based Robot Learning", "label": "Asymmetric Actor-Critic", "year": "2017", "date": "2017-10", "group": "RL 训练基础", "platform": "通用方法／机械臂", "problem": "Simulation training can know the complete state, but only partial observations such as images are available during real strategy deployment; allowing the strategy to rely on the complete state during training will cause a gap in deployment information.", "method": "Let the value function use the true value of the simulation to reduce the difficulty of value estimation in reinforcement learning, while limiting the actor to only use real available observations; then use domain randomization to narrow the gap between vision and dynamics. It changes training information distribution and does not determine task rewards or full body motion interfaces.", "interface": "During training, the actor reads the RGB-D observations available for deployment, and the critic reads the complete status of the simulation; only the actor is used for real robot action generation.", "improvement": "", "experiment": "[Simulation + real robot arm] Multiple simulation tasks and real robot grabbing, pushing objects, and moving blocks; RSS 2018, no four-legged operation.", "limit": "Privileged critic cannot be deployed directly; if the simulation true value deviates too much from reality, it may not be able to help.", "url": "https://arxiv.org/abs/1710.06542", "pdf": "papers/1710.06542_Asymmetric_Actor_Critic_for_Image-Based_Robot_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL training foundations", "platform_en": "General Method/Robotic Arm"}, {"id": "2212.06817", "title": "RT-1: Robotics Transformer for Real-World Control at Scale", "label": "RT-1", "year": "2022", "date": "2022-12", "group": "VLA 模型基础", "platform": "固定／移动机械臂数据", "problem": "Robot skill data is scattered, and it is difficult for small single-task models to maintain multi-task coverage and training scale efficiency at the same time.", "method": "Train Robotics Transformer with real robot multi-task data, use tokenized visual and action representation and high-capacity sequence model to absorb task diversity; study the relationship between data volume, model capacity and generalization.", "interface": "Image history and language tasks enter the Transformer and output discretized low-level action tokens.", "improvement": "", "experiment": "[Real Robot] Multi-task execution and unseen scene generalization of Google Robotic Arm Platform; RSS 2023.", "limit": "The original work focused on large-scale real robot control and did not directly learn quadruped foot contact or chassis-arm contact compensation.", "url": "https://arxiv.org/abs/2212.06817", "pdf": "papers/2212.06817_RT-1_Robotics_Transformer_for_Real-World_Control_at_Scale.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "VLA model foundations", "platform_en": "Fixed/mobile robot arm data"}, {"id": "2307.15818", "title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "label": "RT-2", "year": "2023", "date": "2023-07", "group": "VLA 模型基础", "platform": "固定／移动机械臂数据", "problem": "The amount of robot trajectory data is limited, and traditional action strategies cannot easily use Internet visual language knowledge to identify unseen objects and instructions.", "method": "Represent robot actions as sequences compatible with language tokens, and fine-tune pre-trained visual language models for tasks such as robot trajectories and Internet visual question answering; the VLA paradigm is clearly proposed here.", "interface": "Input camera images and language commands; encode robot actions into text form tokens, which are jointly predicted by the visual language model.", "improvement": "", "experiment": "[Real Robot] About 6,000 evaluation tests, testing unseen objects and semantic instructions; CoRL 2023. The experiment does not include walking on four legs.", "limit": "Network knowledge facilitates semantic generalization and does not directly constrain motion accessibility, contact force, or foot support safety.", "url": "https://arxiv.org/abs/2307.15818", "pdf": "papers/2307.15818_RT-2_Vision-Language-Action_Models_Transfer_Web_Knowledge_to_Robotic_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "VLA model foundations", "platform_en": "Fixed/mobile robot arm data"}, {"id": "2310.08864", "title": "Open X-Embodiment: Robotic Learning Datasets and RT-X Models", "label": "Open X-Embodiment", "year": "2023", "date": "2023-10", "group": "VLA 模型基础", "platform": "跨机器人数据／模型", "problem": "Each robot’s separate collection and training strategy limits cross-modal knowledge transfer; heterogeneous trajectory formats also hinder combined training.", "method": "21 organizations collect 22 types of robot data, unify the format and use the RT-X model to test the positive transfer of cross-robot training; the contribution is both in data sorting and cross-ontology pre-training, not a single chassis controller.", "interface": "Unify the observation, action and task information of multi-agency robot trajectories, and train RT-X cross-robot strategies for downstream adaptation.", "improvement": "", "experiment": "[Multi-real robot data and evaluation] The paper reports 527 skills and cross-robot testing; ICRA 2024. Specific robot and task distribution are not equivalent to quadrupedal mobile operation coverage.", "limit": "The multi-robot data set has obvious platform and task deviations; after adding the new quadruped platform, interface adaptation and actual machine verification are still required.", "url": "https://arxiv.org/abs/2310.08864", "pdf": "papers/2310.08864_Open_X-Embodiment_Robotic_Learning_Datasets_and_RT-X_Models.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}], "group_en": "VLA model foundations", "platform_en": "Cross-robot data/model"}, {"id": "2405.12213", "title": "Octo: An Open-Source Generalist Robot Policy", "label": "Octo", "year": "2024", "date": "2024-05", "group": "VLA 模型基础", "platform": "跨机器人策略", "problem": "If a large-scale robot strategy is bound to fixed cameras, task formats and action dimensions, it is difficult to migrate to new devices at low cost.", "method": "Pre-train the open source Transformer strategy on about 800k trajectories of Open X-Embodiment, and fine-tune it according to new cameras, action spaces and task conditions; focusing on verifying universal initialization and interface scalability.", "interface": "Accepts language or target image conditions and different observation tokens, and outputs action sequences that can be adapted to the target robot.", "improvement": "", "experiment": "[real robot adaptation of nine types of robot platforms] Compare a small amount of new domain data fine-tuning and model design ablation; RSS 2024. Not a quadruped whole-body control experiment.", "limit": "Cross-platform action adaptation and body dynamics stabilization are different issues; most of the references in this library are background, and the quadruped + arm papers are not reviewed and Octo weights are used directly.", "url": "https://arxiv.org/abs/2405.12213", "pdf": "papers/2405.12213_Octo_An_Open-Source_Generalist_Robot_Policy.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}], "group_en": "VLA model foundations", "platform_en": "Cross-bot strategy"}, {"id": "2503.13446", "title": "MoManipVLA: Transferring Vision-Language-Action Models for General Mobile Manipulation", "label": "MoManipVLA", "year": "2025", "date": "2025-03", "group": "VLA 动作模型", "platform": "轮式＋臂", "problem": "The hand path points predicted by the fixed base VLA may be unreachable, collide, or bring the manipulator close to the joint limit after moving to the mobile platform; it is hoped that the visual language capabilities of the pre-trained model will be used, and the execution layer will handle the chassis position.", "method": "The upper layer optimizes the selection of chassis path points to leave maneuverable space for hand targets; the lower layer selects arm trajectories between consecutive end path points. The objective function checks inverse kinematics reachability, joint and chassis trajectory smoothness, and collisions; the arm joints are solved with Pinocchio IK. First, an independent navigation/gaze module brings the platform near the target, and then executes the mobile operation plan.", "interface": "Input image, language, and current mobile platform status; OpenVLA predicts end waypoint. Subsequent planning simultaneously outputs the movement path of the wheeled chassis and the trajectory of the robotic arm; VLA itself does not directly output the chassis speed.", "improvement": "Shows that \"the high-level only gives the hand-end intentions, and the execution layer redistributes the chassis and arms\" can be connected to VLA; it is parallel to the RL whole-body tracker of UMI on Legs. It cannot be said that it has transplanted UMI's controller just because the interface is similar.", "experiment": "The overall success rate of OVMM simulation is 15.8%, and the best comparison in the table is 11.6% (4.2 percentage points higher). Hexman Echo Plus wheeled chassis + RM65 arm real robot Stack Block 3/10, Open Drawer 1/10, Put in Bowl 4/10; 50 expert demonstrations on real robot adaptation and use.", "limit": "The mobile chassis is not four-legged, and the actuator is trajectory optimization rather than RL WBC; neither the real robot sample nor the success rate is sufficient to infer that the complex contact task has been reliably solved. The paper does not compare \"only for mobile devices\" and \"explicitly give chassis commands\" with hardware.", "url": "https://arxiv.org/abs/2503.13446", "pdf": "papers/2503.13446_MoManipVLA_Transferring_Vision-Language-Action_Models_for_General_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}], "group_en": "VLA action model", "platform_en": "Wheel + Arm"}, {"id": "2609.22829", "title": "Whole-Body UMI: Transferring UMI Manipulation Skills to Humanoid Whole-Body Manipulation via Real-Time Motion Generation", "label": "Whole-Body UMI", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "人形", "problem": "A single hand track usually corresponds to a variety of body postures, foot positions and gaits. Only end tracking may achieve the standard but produce unnatural or unstable whole-body movements. The UMI human hand demonstration does not have robot body and foot trajectories and cannot directly monitor these variables.", "method": "Use human motion capture to learn an autoregressive conditional whole-body generator, and look at the future window of the hand trajectory during generation; the generated whole-body reference is tracked by WBC. Compared with finding a local inverse kinematics solution directly from the hand target, data-driven body and foot motion priors are added.", "interface": "Vision Diffusion Policy gives the future hand trajectory; the whole body motion generator uses the hand target and the existing whole body motion prior to supplement the body, foot and joint references; the whole body tracker executes. The top management still only outputs the mobile trajectory, but does not give the chassis speed or connect the VLA.", "improvement": "Retains the operation strategy/executor hierarchical idea of ​​UMI on Legs, specifically dealing with unconstrained body movements of end targets; proving that \"only for the end\" can also increase the whole-body decision-making ability downstream, rather than having to expand the VLA action dimension.", "experiment": "G1 real robot 10 times each of the four tasks: closing drawer 9/10, picking and placing on the shelf 8/10, pitching 3/10, moving and picking 4/10; also compared with or without mobile preview and oracle conditions that provide true body/foot reference, and evaluated motion reconstruction, foot slip and terminal errors.", "limit": "The quality of whole-body motion depends on the humanoid mocap prior; the real robot’s high dynamics and mobile pick-and-place success rate are low. The humanoid experiment cannot be directly extrapolated to quadrupeds + light arms, nor can it be called VLA verification.", "url": "https://arxiv.org/abs/2609.22829", "pdf": "papers/2609.22829_Whole-Body_UMI_Transferring_UMI_Manipulation_Skills_to_Humanoid_Whole-Body_Manipulation_via_Real-Time_Motion_Generation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Humanoid"}, {"id": "2610.32271", "title": "From Tabletop to Walking Bot: Deploying a VLA Model on a Legged Manipulator Robot", "label": "Walking Bot VLA", "year": "2026", "date": "2026-10", "group": "VLA 动作模型", "platform": "四足＋臂", "problem": "The action space of the fixed-arm VLA does not have chassis movement and body pitching; when deploying to a quadruped, it is necessary to decide whether these actions are responsible for the model or the existing controller, and make the teaching labels and execution commands consistent.", "method": "The same operator uses the leader-slave arm and handheld controller to simultaneously teach the chassis, attitude, robotic arm and gripper. Both collection and deployment go through the same robot-side command interface, so that the action tag directly corresponds to the deployment amount. Fine-tuned the visual language backbone and action heads of the MolmoAct2 family; using ten-step action blocks, the arms execute as continuous trajectories and the chassis maintains commands in a higher frequency thread.", "interface": "VLA outputs 11-dimensional commands: body coordinates, chassis speed vx, vy, yaw speed, body pitch, six arm joint absolute angle targets and gripper opening and closing. The arm-aware BinWalker-derived RL walking controller executes chassis commands, and the joint trajectory controller executes arm commands; instead of VLA, it only gives an interface to the end-effector trajectory.", "improvement": "Proposes a different division of labor from UMI on Legs: the high level clearly determines the chassis movement, and the low level mainly ensures the walking execution. The article does not directly test which of the two interfaces is more accurate or data-saving.", "experiment": "Go2＋Piper real robot provides qualitative fragments of grabbing, transporting and pushing objects, **there is no real robot success rate table**. On the offline set aside set of 131, 233, and 258 teachings, the end errors of the grasping action prediction are 68.7, 48.2, and 47.8 mm; this is an offline error calculated based on the predicted forward kinematics of the joint, not a real robot closed-loop tracking error.", "limit": "Short preliminary results, limited task and teaching scope; it cannot be concluded that explicit speed output is better than terminal trajectory output, nor can it prove the accuracy and safety during continuous contact.", "url": "https://arxiv.org/abs/2610.32271", "pdf": "papers/2610.32271_From_Tabletop_to_Walking_Bot_Deploying_a_VLA_Model_on_a_Legged_Manipulator_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}], "group_en": "VLA action model", "platform_en": "Quadruped + arm"}, {"id": "2610.28480", "title": "SuperMimic: Scaling Humanoid Whole-Body Control with One Differentiable World Model", "label": "SuperMimic", "year": "2026", "date": "2026-10", "group": "RL 训练基础", "platform": "人形（移动操作邻接训练方法）", "problem": "A large humanoid motion library contains many reference motions but only one robot dynamics model. Training separate motion experts and distilling them, or repeatedly estimating PPO updates from simulator samples, is expensive. The paper asks whether one shared learned dynamics model can accelerate whole-body tracking policy training.", "method": "Each iteration collects transitions from the current policy in MuJoCo Warp, fits a differentiable dynamics model on eight-step replay windows, and predicts observations, rewards, and termination. Policy updates start from replayed simulator states and backpropagate through 32 imagined steps in the frozen model; a critic estimates return beyond this horizon. The model is refreshed every iteration. The physics simulator need not be differentiable, and deployment does not run model-predictive control.", "interface": "The policy observes ten recent frames of joint state, IMU angular velocity, projected gravity, and previous action, plus ten future reference frames. It outputs normalized joint setpoints executed through low-gain PD control. The learned model receives simulator state, action, and randomized dynamics parameters for training only. The paper evaluates full-motion references and a velocity-command interface; it mentions end-effector goals as a possible interface but does not test one.", "improvement": "The paper adopts BeyondMimic’s tracking setup and most of its reward, comparing against SONIC’s large-scale PPO tracker. Learned differentiable dynamics had already been explored in SuperTrack, ControlVAE, and SuperDyno. The contribution here is efficient training at large motion-library scale and transfer of the resulting tracker to a physical G1. UMI on Legs studies a different question: how end-effector trajectories drive a quadruped whole-body controller. A combination is plausible but untested.", "experiment": "Simulation and physical Unitree G1. On 129,514 training motions, the one-H100 policy fails 25 clips after 3 h; a two-H100 policy fails none after 9.8 h; SONIC’s released checkpoint fails 179. In a controlled comparison on 40 LAFAN1 clips, SuperMimic reaches evaluation return 0.82 in about 1.2 h on one H100, whereas PPO-Sim does not within 18 h using up to eight H100s. Ablations test model-gradient updates and the critic. Real-robot demonstrations show a skipping jump, side roll, and flips. A simulated velocity-step test favors the RL-trained encoder on 650 of 672 commands.", "limit": "The 129,514-clip score measures coverage of training motions, not generalization to new manipulation tasks. The SONIC comparison differs in training-data size and GPU type; the paper also provides a smaller controlled PPO comparison. Training clips involving terrain or objects are deliberately filtered out, and §6 explicitly reports no terrain or object interaction. Thus the paper does not validate quadruped or wheeled-legged dynamics, arm–object contact accuracy, or safety in button, knob, and cabinet tasks. Its world model is trained on simulator data only.", "url": "https://arxiv.org/abs/2610.28480", "pdf": "papers/2610.28480_SuperMimic_Scaling_Humanoid_Whole-Body_Control_with_One_Differentiable_World_Model.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}, {"id": "K48", "title": "A differentiable dynamics surrogate for training whole-body tracking policies"}], "group_en": "RL training foundations", "platform_en": "Humanoid (adjacent whole-body training method)"}, {"id": "survey-contact", "title": "A Survey of Robot Manipulation in Contact", "year": "2021", "date": "2021-12", "group": "综述", "platform": "跨平台", "problem": "Separate the force control, impedance, admittance, state representation and learning methods in the continuous contact task.", "method": "Organized by exposure to tasks, executive control, exposure to representation, and learning/planning.", "interface": "", "improvement": "Used to clarify that contact force and end position error are not the same index.", "experiment": "Overview, does not provide new quadruped real robot experiments.", "limit": "Does not cover quadruped movement stability and foot contact distribution.", "url": "https://doi.org/10.1016/j.robot.2022.104224", "pdf": "papers/2112.01942_A_Survey_of_Robot_Manipulation_in_Contact.pdf", "notes": "literature/surveys.md", "label": "Overview of contact operations", "knowledge": [{"id": "K08", "title": "Compliance defines motion in response to force"}], "group_en": "Survey", "platform_en": "Cross-platform"}, {"id": "survey-legged", "title": "Legged Robots for Object Manipulation: A Review", "year": "2023", "date": "2023-03", "group": "综述", "platform": "跨平台", "problem": "Distinguish whether a legged robot uses its body, walking legs, dedicated arms or multi-robot collaboration to move objects.", "method": "Organize existing work according to object interaction form and robot form, and compare the size relationship between the manipulated object and the robot.", "interface": "", "improvement": "Used to prevent the hand-to-foot, armless pushing and carrying arm experiments from being directly paralleled.", "experiment": "Overview, does not provide new quadruped real robot algorithm experiments.", "limit": "Published in 2023 and missing a large number of 2024–2026 jobs.", "url": "https://doi.org/10.3389/fmech.2023.1142421", "pdf": "papers/2303.16865_Legged_Robots_for_Object_Manipulation_A_Review.pdf", "notes": "literature/surveys.md", "label": "Overview of Leg Operation", "knowledge": [], "group_en": "Survey", "platform_en": "Cross-platform"}, {"id": "survey-tamp", "title": "A Survey of Optimization-Based Task and Motion Planning", "year": "2024", "date": "2024-04", "group": "综述", "platform": "跨平台", "problem": "How to solve task steps and motion trajectories that satisfy dynamic/geometric constraints together.", "method": "Describes the feasibility judgment and recovery of task representation, trajectory optimization, joint TAMP and learning assistance.", "interface": "", "improvement": "Used to trace the division of labor in contact sequence, re-planning and execution control.", "experiment": "A review, not a real-life comparison of four-legged controllers.", "limit": "For general TAMP, no conclusion on quadruped foot contact performance is given; the preprint will be released in 2024, and the journal issue will be in 2025.", "url": "https://doi.org/10.1109/TMECH.2024.3452509", "pdf": "papers/2404.02817_A_Survey_of_Optimization-Based_Task_and_Motion_Planning_From_Classical_to_Learning_Approaches.pdf", "notes": "literature/surveys.md", "label": "TAMP Overview", "knowledge": [], "group_en": "Survey", "platform_en": "Cross-platform"}, {"id": "survey-vla", "title": "A Survey on Vision–Language–Action Models for Embodied AI", "year": "2024", "date": "2024-05", "group": "综述", "platform": "跨平台", "problem": "Clarify the differences between visual language planners, action models, datasets, and reviews.", "method": "Organized by VLA composition, low-level actions, task planning, and data benchmarks.", "interface": "", "improvement": "VLA used to avoid equating VLM skill selection with continuous output of movement operation actions.", "experiment": "Overview, covering embodied AI, not limited to mobile operations.", "limit": "Desktop manipulation methods are not automatically evidence of quadrupedal loco-manipulation.", "url": "https://doi.org/10.1109/TNNLS.2025.3650584", "pdf": "papers/2405.14093_A_Survey_on_Vision-Language-Action_Models_for_Embodied_AI.pdf", "notes": "literature/surveys.md", "label": "VLA Overview", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}], "group_en": "Survey", "platform_en": "Cross-platform"}, {"id": "survey-humanoid", "title": "Humanoid Locomotion and Manipulation: Current Progress and Challenges in Control, Planning, and Learning", "year": "2025", "date": "2025-01", "group": "综述", "platform": "人形", "problem": "System comparison model planning, MPC/WBC, RL/IL, haptics and foundation models how to support mobile operations.", "method": "The text is divided into chapters such as multi-contact planning, model accuracy, whole-body control, learning skills, data and basic models; compares the trade-off between calculation speed and model accuracy.", "interface": "", "improvement": "As the main framework for method classification, the differences between four-legged platforms are still verified by specific papers.", "experiment": "Review; citing four-legged work by Sleiman, RoLoMa, Visual WBC, and others.", "limit": "Mainly humanoid; publishing in 2026 does not mean that all 2026 preprints have been covered.", "url": "https://doi.org/10.1109/TMECH.2025.3579247", "pdf": "papers/2501.02116_Humanoid_Locomotion_and_Manipulation_Current_Progress_and_Challenges_in_Control_Planning_and_Learning.pdf", "notes": "literature/surveys.md", "label": "Summary of Humanoid Movement Operations", "knowledge": [], "group_en": "Survey", "platform_en": "Humanoid"}, {"id": "survey-quadruped", "title": "Loco-Manipulation With Quadruped Robots: Modeling, Task Taxonomy, and Control Methods—A Critical Review", "year": "2026", "date": "2026", "group": "综述", "platform": "四足＋臂", "problem": "Corresponds to modeling assumptions, mission conditions, and WBC/MPC/RL/IL control methods in a quadruped mission.", "method": "The full text is organized by modeling, task classification, and control methods, discussing WBC, MPC, RL/IL, and hybrid impedance/force control, taking into account terrain, loading, contact, and sensing delays.", "interface": "", "improvement": "For missed detection checks for quadruped mission combinations.", "experiment": "Overview, no new controller experiments are provided; the full text and references are available for local verification.", "limit": "There is very little accumulation of citations for newly published papers; specific performance comparisons should refer to the verification tasks and experimental conditions of the original papers.", "url": "https://doi.org/10.1109/ACCESS.2026.3672605", "pdf": "papers/IEEE_Access_2026_Loco-Manipulation_With_Quadruped_Robots_Critical_Review.pdf", "notes": "literature/surveys.md", "label": "Overview of quadruped mobility operations", "knowledge": [], "group_en": "Survey", "platform_en": "Quadruped + arm"}, {"id": "survey-affordance", "title": "From Passive Perception to Active Interaction: A Survey of Affordance Learning for Embodied AI", "year": "2026", "date": "2026-10", "group": "综述", "platform": "跨平台", "problem": "How to find the interactive position from the visual scene, select the target based on the task and robot status, and then hand the target to the executable action.", "method": "The full text is divided into three sections: affordance perception, task-related reasoning, and guided actions; the prediction results are divided into action types, target areas, and optional execution parameters, and then compared to different interfaces handed over to the planner/skills and integrated into policy inputs, implicit features, or rewards.", "interface": "The input can be images, language and interaction context; the output can be action type, contact area, posture, direction or post-contact trajectory. Overview There is no unified runtime controller.", "improvement": "Provides classification for the target selection and action interface of mobile operations, and raises issues to be verified by comparing explicit/implicit information, closed-loop updates and real-machine evaluation.", "experiment": "35 pages of preprint review, full text and references checked; no new quadruped real-life experiments.", "limit": "Preprints.org 2026-10-07, the official peer-reviewed version has not yet been found; the method table mainly covers the gripper, dexterous hand and both arms, and does not provide a comparison of the four-legged mobile operation performance.", "url": "https://doi.org/10.20944/preprints202610.0392.v1", "pdf": "papers/Preprints_202610.0392_v1_From_Passive_Perception_to_Active_Interaction_A_Survey_of_Affordance_Learning_for_Embodied_AI.pdf", "notes": "literature/surveys.md", "label": "Operability Review (Preprint)", "knowledge": [{"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}], "group_en": "Survey", "platform_en": "Cross-platform"}], "edges": [["2308.09179", "2410.13817", "原文承接", "Guided RL explicitly uses the demonstration training feedback execution generated by the previous multi-contact planning."], ["2407.10353", "2604.07457", "原文承接", "CMP uses data/training settings from UMI on Legs and projects beyond capabilities."], ["2407.10353", "2503.13446", "问题比较", "Both allow the higher level to allocate body movements to the end intention and execution layer; MoManipVLA is a wheeled VLA + trajectory optimization, and UMI on Legs is a quadruped visual diffusion strategy + RL whole-body tracking, and there is no verified algorithm inheritance."], ["2407.10353", "2609.22829", "问题比较", "Whole-Body UMI retains the hand trajectory interface, and uses humanoid motion a priori to supplement the body and foot movements; the upper level is not VLA, and cannot directly reuse UMI on Legs code according to the name."], ["2503.13446", "2610.32271", "问题比较", "The former wheeled VLA gives the end path point, and then optimizes the chassis and arms; the latter four-legged VLA directly outputs the chassis speed, body pitch and arm joint targets. The two texts do not have the same platform action interface."], ["2407.10353", "2610.32271", "问题比较", "Two permission designs for the quadruped system: UMI's terminal trajectory drives the whole-body RL, and Walking Bot's VLA explicitly gives chassis and arm commands; not proven advantages or disadvantages or direct algorithm inheritance."], ["2604.07457", "2609.22829", "问题比较", "Both deal with execution-level issues when hand targets are given separately: CMP corrects targets beyond the capabilities of the controller, and Whole-Body UMI generates body/foot references with motion priors; targets are different from experiments."], ["2609.23968", "2610.32271", "问题比较", "Humanoid Opt2VLA high-level contains hand and foot targets and expected contact forces; Go2＋Piper preliminary work outputs chassis speed, body posture and joint targets, but does not specifically output forces."], ["2407.10353", "2604.27224", "原文承接", "The low-level training of Tactile-aware follows some settings of UMI on Legs."], ["2203.01446", "2308.09179", "问题比较", "RoLoMa optimizes the immunity margin for a given contact phase; Sleiman et al. also search for the contact sequence. Algorithm inheritance is not verified."], ["2210.10044", "2403.17367", "问题比较", "Interface comparison between unified RL whole-body strategy and leg/arm division of labor collaboration strategy."], ["2403.17367", "2407.10353", "问题比较", "RoboDuet studies leg/arm collaboration commands; UMI on Legs studies and demonstrates how end trajectories are tracked by whole-body controllers. The two are parallel interfaces, not algorithm inheritance."], ["2403.16967", "2411.06782", "问题比较", "After visual action selection, QuadWBG further explicitly utilizes the relationship between grasping posture and station reachability."], ["2407.10353", "2605.31343", "问题比较", "The terrain changes the station position and the reachable space of the hands; it is a follow-up issue of the task space tracking interface."], ["2407.10353", "2610.01612", "问题比较", "ReCo makes the closed-loop response of the chassis predictable, allowing the MPC to compensate for the hand trajectory while moving."], ["2403.18197", "2506.16475", "同作者群", "As for the follow-up work on the special form of LocoMan, the focus turns to human demonstration data; it does not mean a direct upgrade of the control algorithm."], ["2505.20829", "2609.03889", "问题比较", "Force information extends from contact control to VLA motion generation and chassis compensation; platform and sensing are different."], ["2308.09179", "2504.06662", "问题比较", "The model planning contact process and the model WBC plus RL error correction processing are at different levels; it is not directly undertaken by the algorithm."], ["2403.16967", "2411.15131", "问题比较", "Comparison of the task scope of single visual operation and demonstration skills plus language long-term planning; does not mean direct inheritance."], ["2411.15131", "2512.11047", "问题比较", "Language selection skills and visual language generation whole-body latent movements are different interfaces."], ["2512.11047", "2609.03889", "问题比较", "whole-body VLA is a different platform than a wheel-foot solution that feeds contact estimates into the motion model and compensates for the chassis;"], ["2512.11047", "2607.18016", "问题比较", "Different links between whole-body motion generation and continuous object state recording/result checking processing; both are humanoid adjacencies."], ["2411.15131", "2608.20114", "问题比较", "The world-action model of visual skills plus planning and body/arm decomposition are different long-range interfaces; DECOWAM is the wheel foot."], ["2603.05830", "2610.01612", "问题比较", "Cabinet door mechanism state estimation and chassis closed-loop response modeling respectively address different sources of operational accuracy."], ["2405.01402", "2609.03889", "问题比较", "Force targets are used directly to control interface alignment with force agents that affect both VLA and chassis compensation."], ["2407.10353", "2508.10538", "问题比较", "MLM handles multi-task sampling and missing future trajectories on the terminal trajectory tracking interface."], ["2403.17367", "2606.24466", "问题比较", "FT-WBC adds body posture adjustment after actuator failure sensing to the leg/arm collaboration interface."], ["2405.01402", "2505.20829", "问题比较", "From force target tracking to the same strategy taking into account both free space position and contact force targets."], ["2403.16967", "2605.03846", "问题比较", "Vision operations further face the problems of the visual angle moving with the body, slow detection and temporary loss of targets."], ["2411.15131", "2508.08240", "问题比较", "Long-range tasks are expanded from demonstration skill sets to exploration, navigation and local operations with maps; direct algorithm inheritance is not verified."], ["2605.31343", "2610.23548", "问题比较", "Side-by-side comparison of two complex terrain whole-body tracking designs; arm control and terrain input are different."], ["survey-humanoid", "2203.01446", "综述收录", "T-Mech review reference [83] included in RoLoMa."], ["survey-humanoid", "2308.09179", "综述收录", "T-Mech review reference [84] includes ETH multi-contact planning."], ["survey-humanoid", "2403.16967", "综述收录", "T-Mech review reference [86] includes Visual WBC."], ["survey-legged", "2210.10044", "综述收录", "Legged object manipulation Review reference collection Deep Whole-Body Control."], ["survey-quadruped", "2203.01446", "综述收录", "Reference metadata inclusion of IEEE Access Tetrapod Review RoLoMa."], ["survey-quadruped", "2504.06662", "综述收录", "Reference metadata collection of IEEE Access Quadruped Review RAMBO."], ["2212.03238", "2403.17367", "原文承接", "RoboDuet §III-B.1 is clearly based on Walk These Ways [16], using behavioral parameters, interfoot phase clock and most first-stage rewards; fixing trot/step frequency, etc., deleting height tracking, and replacing foot swing rewards in the second stage. Not retaining the full MoB."], ["2212.03238", "2403.16967", "原文承接", "The Visual WBC Appendix Contact Timing/Swing and Support Reward clearly cites Margolis and Agrawal [59]; reusing the gait reward structure does not mean the use of complete 8-dimensional behavioral parameter adjustment."], ["2212.03238", "2605.31343", "原文承接", "Terrain-Aware WBC gait timing input instructions Inspired by [34], [19]; [19] is Walk These Ways. Only timing design heuristics are registered, no full controller replication is claimed."], ["2210.10044", "2403.16967", "原文承接", "The Visual WBC appendix clearly adopts the Regularized Online Adaptation training paradigm and references Deep WBC; it inherits ROA, which does not mean that the high-level visuals also come from the previous work."], ["2210.10044", "2605.31343", "原文承接", "The Regularized Online Adaptation section of Terrain-Aware WBC clearly utilizes ROA [6]; refer to [6] for Deep WBC. Terrain coding is a new addition in later games."], ["2210.10044", "2607.10132", "原文承接", "TAC-LOCO §4 is clearly inspired by the advantage-mixing idea in [10] and uses a plan to mix two advantage functions; [10] is Deep WBC. Tactile display and grip feedback are new additions in later games."], ["2403.16967", "2503.01474", "原文承接", "Interactive Navigation §III-B.6 clearly follows Visual WBC to train the whole body end effector; the upper level still uses the arm pushing strategy learned."], ["2403.16967", "2508.08328", "原文承接", "DQ-Net main text and Appendix B reuse Visual WBC low-level/reward and make dynamic capture baseline; new capture candidate fusion and dual-view timing students are added."], ["2403.16967", "2512.18938", "原文承接", "Deployment Framework §3.1 uses part of the open source implementation of Visual WBC as the baseline to supplement the interface between MuJoCo and real robot ROS; algorithm innovation is not the main contribution."], ["2210.10044", "2507.04229", "问题比较", "PFG uses Deep WBC's ROA/advantage mixing for comparison; a new IK reachable posture reward is added, instead of using a new strategy optimizer."], ["1707.06347", "2610.28480", "问题比较", "SuperMimic compares the training efficiency with simulated PPO under the same LAFAN1 actions, observations and rewards; the difference is that the action gradient is back-transmitted through the learning model instead of estimated by sampling advantage. This is a method comparison, not the first time PPO is used for whole-body tracking."], ["2407.10353", "2610.28480", "问题比较", "UMI on Legs studies how hand-held trajectories can be transferred to the four-legged body for execution; SuperMimic studies how to efficiently train humanoid whole-body tracking strategies. The latter only measures full movements and speed commands, but does not measure hand target or object contact; the two can be combined but are not directly connected."], ["2407.10353", "2409.16048", "问题比较", "Pose Tracking refers to UMI's pose representation and tracking results, but the focus turns to large workspaces/uneven terrain; its operation strategy does not perform walking."], ["2409.16048", "2605.31343", "问题比较", "Standing posture arrival on uneven terrain and simultaneous walking/operating tracking under terrain conditions; the former cannot be considered as evidence of continuous moving contact."], ["2409.16048", "2605.15713", "原文承接", "Dynamic Pick-and-Place §III-C refers to Pose Tracking and uses key point representation; here the three points of the object center/upper and lower ends are collinear, and only describe the vertical axis, not a complete 6D pose or controller copy."], ["2505.22974", "2506.16986", "同作者群", "ETH Yuntao Ma/Marco Hutter's dynamic operation work; badminton handles perception-movement-hitting, throwing handles release error and high-frequency tracking, and does not claim that the latter replaces the former."], ["paper-63", "2506.16986", "问题比较", "Athletic mainly optimizes throwing distance/dynamic tasks; Accurate Throwing quantifies the error between the landing point and release time of a given target. Direct inheritance of executor networks is not verified."], ["2507.22042", "2511.19709", "问题比较", "Both retain the dynamic influence of the arm on the body; the former is NMPC+WBC, and the latter uses the whole body inverse dynamic path constraint MPC to directly give trajectory/moment. Not compared to hardware baseline."], ["2308.09179", "2511.19709", "问题比较", "ETH multi-contact work searches the contact process and models objects; ID-MPC fixes the gait timing and does not build object dynamics to solve the real-time joint-level force consistency."], ["2411.15131", "2512.04381", "问题比较", "WildLMa language task planning and FALCON's CLIP share semantics/stage conditions and belong to different decision-making layers; it is not a verified algorithm inheritance."], ["2508.08328", "2605.15713", "问题比较", "DQ-Net captures moving objects and currently simulates them; Dynamic Pick-and-Place allows the robot to continuously move, pick and place, and the real robot object status is provided by motion capture. Target dynamics and chassis dynamics should be separated."], ["2403.16967", "2605.15713", "问题比较", "Dynamic Pick-and-Place uses Visual WBC arm perturbation generation as a low-level comparison: high-level retraining of the task, and 9/10 versus 3/10 cannot be interpreted as the entire system ranking of the original paper."], ["2402.10329", "2407.10353", "原文承接", "UMI on Legs §3 Connect the handheld demonstration and relative end-effector trajectory interface of the original UMI to a quadruped whole-body tracker."], ["2303.04137", "2407.10353", "原文承接", "UMI on Legs §3.1 Explicitly use U-Net diffusion policy and DDIM according to Chi and other configurations, and extend the future trajectory window."], ["1011.0686", "2403.16967", "原文承接", "The Visual WBC visual student training section explicitly uses DAgger, and students request corrective actions from privileged teachers after accessing the status."], ["2304.13705", "2411.15131", "原文承接", "WildLMa method section clarifies building upon ACT training language condition skills; adds CLIP object query and long-term skill combination."], ["2304.13705", "2401.02117", "原文承接", "Mobile ALOHA extends ALOHA dual-arm teleoperation hardware/demonstration learning to whole-body teleoperation on wheeled chassis."], ["2103.14127", "2508.08328", "原文承接", "The main text of DQ-Net uses pre-trained Contact-GraspNet to generate grasping gesture candidates, and then combines body control and visual tracking."], ["2103.00020", "2411.15131", "原文承接", "WildLMa explicitly uses CLIP text-image representation to calculate target object probability maps for use by the skill network."], ["2103.00020", "2407.10353", "原文承接", "UMI on Legs §3.1 Explicitly use the pretrained CLIP visual encoder."], ["2103.00020", "2512.04381", "原文承接", "The text of the quadruped version of FALCON explicitly freezes CLIP features and coordinates the diffusion strategy of the separated legs and robotic arms."], ["2406.09246", "2512.11047", "原文承接", "The WholeBodyVLA experiment will publicly adapt the OpenVLA-OFT model to the dual-arm action and discrete movement instruction baseline; this is baseline reuse, not the origin of its method."], ["1710.06542", "2403.17367", "原文承接", "RoboDuet §IV-C explicitly adopts an asymmetric actor-critic training framework, where actors are read-only for deployment and observation, and critics can read the complete status of the simulation."], ["2310.08864", "2406.09246", "原文承接", "The text of OpenVLA clearly uses about 970k trajectories of Open X-Embodiment to train the visual language to action model."], ["2310.08864", "2405.12213", "原文承接", "The text of Octo clearly pre-trains about 800k trajectories in Open X-Embodiment and tests cross-platform fine-tuning."], ["2212.06817", "2307.15818", "原文承接", "RT-2 §3 clearly follows the robot action protocol proposed by RT-1 and compares it with RT-1; new Internet visual language pre-training and joint fine-tuning of graphic and text tasks are added."], ["2405.12213", "2406.09246", "原文承接", "The OpenVLA data matching section explicitly uses Octo's hybrid weight inspiration for the data sets that passed the preliminary screening; Octo's action architecture is not copied."], ["2107.04034", "2210.10044", "问题比较", "Deep WBC §2.2 and experiments use the two-stage teacher-student adaptation of RMA as the control baseline, and then propose ROA; it cannot be said that the original RMA method was directly adopted by the whole body operating system."], ["2103.00946", "2308.09179", "问题比较", "ETH is the same as the author's method line: Unify MPC preset contact timing in 2021, add discrete contact search in 2023; the questions and problem extensions have been verified, and the reuse of the same solver code has not been proven."], ["2103.00946", "2507.22042", "问题比较", "Arm-dynamics NMPC Introduction takes the early unified MPC as a precedent to study issues that cannot be ignored in arm dynamics; the specific model and solution have changed."], ["2010.11251", "2210.10044", "背景引用", "Deep WBC refers to its terrain walking results; the specific algorithm is directly used without verifying the operation controller."], ["2201.08117", "2605.31343", "背景引用", "Terrain-aware WBC cites the precedent of perceptual walking; its training plan for terrain and terminal workspace is proposed separately."], ["2109.11978", "2407.10353", "背景引用", "UMI on Legs reference parallel legged RL work; full reuse of the legged_gym configuration cannot be inferred from the reference alone."], ["2108.10470", "2407.10353", "背景引用", "UMI on Legs uses Isaac Gym simulation to train low-level whole-body strategies; this is tool reuse."], ["1707.06347", "2210.10044", "背景引用", "Deep WBC adopts PPO optimization strategy; ROA and advantage mixing are additional training designs."], ["2204.01691", "2411.15131", "背景引用", "WildLMa cites SayCan for language planning background; unconfirmed use of its language probability times skill value scoring formula."], ["2401.02117", "2608.20114", "背景引用", "DECOWAM uses Mobile ALOHA as a mobile whole-body demonstration; direct reuse of data or control algorithms has not been confirmed."], ["2410.24164", "2512.11047", "背景引用", "WholeBodyVLA lists π0 as a general VLA precedent; there is no evidence of using original motion expert weights."], ["2307.15818", "2512.11047", "背景引用", "WholeBodyVLA cites RT-2 as a precedent for VLA; its own whole-body latent motion model is trained separately."], ["2405.12213", "2407.10353", "背景引用", "UMI on Legs quotes Octo as the background of universal robot strategy; high-level people actually use Diffusion Policy."]], "date": "2026-10-29", "search_date": "2026-10-29"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const nodes=data.papers, byId=new Map(nodes.map(n=>[n.id,n]));
const svg=document.getElementById('graph'), shell=document.getElementById('graph-shell');
const drawer=document.getElementById('drawer'), drawerContent=document.getElementById('drawer-content');
const NS='http://www.w3.org/2000/svg';
const groups=['行走方法基础','模型控制方法基础','RL 训练基础','示范学习基础','移动示范方法基础','视觉抓取方法基础','视觉语言方法基础','VLA 模型基础','模型规划／显式控制','RL／全身执行','示范／视觉／VLM','VLA 动作模型','形态／系统','综述'];
const platforms=[...new Set(nodes.map(n=>n.platform))].sort((a,b)=>a.localeCompare(b,'zh'));
const colors={'行走方法基础':'#8a784e','模型控制方法基础':'#805d91','RL 训练基础':'#678698','示范学习基础':'#387a6e','移动示范方法基础':'#387a6e','视觉抓取方法基础':'#669481','视觉语言方法基础':'#a47555','VLA 模型基础':'#b0714e','模型规划／显式控制':'#805d91','RL／全身执行':'#36728d','示范／视觉／VLM':'#387a6e','VLA 动作模型':'#b0714e','形态／系统':'#837859','综述':'#516977'};
const shortGroup={'行走方法基础':'行走基础','模型控制方法基础':'模型基础','RL 训练基础':'RL基础','示范学习基础':'示范基础','移动示范方法基础':'移动示范','视觉抓取方法基础':'抓取基础','视觉语言方法基础':'视觉语言基础','VLA 模型基础':'VLA基础','模型规划／显式控制':'模型／规划','RL／全身执行':'RL／全身','示范／视觉／VLM':'示范／视觉','VLA 动作模型':'VLA','形态／系统':'形态／系统','综述':'综述'};
const edgeStyle={'原文承接':{color:'#336e79',dash:'',width:2.3},'背景引用':{color:'#c2b79e',dash:'4 7',width:1.3},'问题比较':{color:'#9aabb2',dash:'6 5',width:1.5},'同作者群':{color:'#807894',dash:'2 5',width:1.8},'综述收录':{color:'#b3bec2',dash:'2 5',width:1.4}};
const W=186,H=66;
let selected=null, view={x:0,y:0,s:1}, positions=new Map(), nodeEls=new Map(), edgeEls=[], worldWidth=1800, worldHeight=900, world=null, visibleIds=new Set(), pinned=new Set(), pan=null;
function html(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function svgEl(tag,attrs,content){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);if(content!==undefined)e.textContent=content;return e}
function match(n,q){return [n.title,n.label,n.id,n.problem,n.method,n.experiment,n.platform,n.platform_en,n.group_en].join(' ').toLocaleLowerCase().includes(q)}
function visibleNodes(){
 const q=document.getElementById('search').value.trim().toLocaleLowerCase();
 const group=document.getElementById('group').value,platform=document.getElementById('platform').value;
 const surveys=document.getElementById('surveys').checked;
 return nodes.filter(n=>pinned.has(n.id)||((n.group!=='综述'||surveys||group==='综述')&&(!group||n.group===group)&&(!platform||n.platform===platform)&&(!q||match(n,q))));
}
function timeX(n){const yr=Number(n.date.slice(0,4)),mo=Number(n.date.slice(5,7))||6;return yr<=2017?90+(yr-2010)*36:350+(yr-2017)*170+(mo-1)*13}
function layout(list){
 positions=new Map();const bands=[];
 if(list.length<=5){const sorted=list.slice().sort((a,b)=>a.date.localeCompare(b.date));sorted.forEach((n,i)=>positions.set(n.id,{x:100+i*255,y:145}));worldWidth=Math.max(620,100+sorted.length*255);worldHeight=440;bands.push({name:'筛选结果',color:'#657c84',y:98,height:200});return {bands:bands,mode:'filtered'}}
 let y=80;
 for(const g of groups){
  const row=list.filter(n=>n.group===g).sort((a,b)=>a.date.localeCompare(b.date)||a.label.localeCompare(b.label));
  if(!row.length)continue;
  const ends=[];
  for(const n of row){
   const x=timeX(n);let track=ends.findIndex(end=>end+15<=x);
   if(track<0){track=ends.length;ends.push(0)}
   ends[track]=x+W;positions.set(n.id,{x:x,y:y+34+track*76});
  }
  const height=56+ends.length*76;bands.push({name:g,color:colors[g],y:y,height:height});y+=height+9;
 }
 worldWidth=Math.max(1790,...Array.from(positions.values(),p=>p.x+W+40));worldHeight=Math.max(420,y+35);
 return {bands:bands,mode:'timeline'};
}
function edgePath(e){
 const a=positions.get(e[0]),b=positions.get(e[1]);if(!a||!b)return '';
 const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;
 const sameRow=Math.abs(a.y-b.y)<8;
 const between=sameRow&&Array.from(positions.entries()).some(([id,p])=>id!==e[0]&&id!==e[1]&&Math.abs(p.y-a.y)<8&&p.x>a.x&&p.x<b.x);
 if(between){const sx=a.x+W/2,tx=b.x+W/2,top=Math.min(a.y,b.y)-35;return 'M '+sx+' '+a.y+' C '+sx+' '+top+' '+tx+' '+top+' '+tx+' '+b.y}
 if(x2>x1+45)return 'M '+x1+' '+y1+' C '+(x1+Math.min(110,(x2-x1)/2))+' '+y1+' '+(x2-Math.min(110,(x2-x1)/2))+' '+y2+' '+x2+' '+y2;
 const sx=a.x+W/2,sy=a.y+H,tx=b.x+W/2,ty=b.y;
 return 'M '+sx+' '+sy+' C '+sx+' '+(sy+55)+' '+tx+' '+(ty-55)+' '+tx+' '+ty;
}
function applyView(){if(world)world.setAttribute('transform','translate('+view.x+' '+view.y+') scale('+view.s+')')}
function minimumZoom(){return Math.min(.05,Math.max(1,shell.clientWidth-72)/worldWidth/4,Math.max(1,shell.clientHeight-72)/worldHeight/4)}
function fit(){
 const vw=shell.clientWidth,vh=shell.clientHeight,pad=36;
 const ideal=Math.min((vw-pad*2)/worldWidth,(vh-pad*2)/worldHeight,1.25);
 view.s=Math.max(minimumZoom(),ideal);view.x=(vw-worldWidth*view.s)/2;view.y=(vh-worldHeight*view.s)/2;applyView();
}
function zoom(factor,px,py){
 const rect=svg.getBoundingClientRect();px=px===undefined?rect.width/2:px;py=py===undefined?rect.height/2:py;
 const wx=(px-view.x)/view.s,wy=(py-view.y)/view.s;
 view.s=Math.max(minimumZoom(),Math.min(2.6,view.s*factor));view.x=px-wx*view.s;view.y=py-wy*view.s;applyView();
}
function focus(id){
 const p=positions.get(id);if(!p)return;
 const reserved=drawer.classList.contains('open')?Math.min(460,shell.clientWidth*.38):0;
 const tx=(shell.clientWidth-reserved)/2,ty=shell.clientHeight/2;
 view.x=tx-(p.x+W/2)*view.s;view.y=ty-(p.y+H/2)*view.s;applyView();
}
function updateHighlights(){
 const related=new Set(data.edges.filter(e=>e[0]===selected||e[1]===selected).flatMap(e=>[e[0],e[1]]));
 for(const [id,g] of nodeEls){const active=!selected||id===selected||related.has(id);g.setAttribute('opacity',active?1:.35);const r=g.querySelector('rect');r.setAttribute('stroke-width',id===selected?3:1.4)}
 for(const item of edgeEls){const e=item.edge,active=!selected||e[0]===selected||e[1]===selected;item.line.setAttribute('opacity',active?(e[2]==='原文承接'?.92:.75):.16)}
}
function draw(){
 const list=visibleNodes(),result=layout(list),bands=result.bands;visibleIds=new Set(list.map(n=>n.id));
 const selectedType=document.getElementById('edge-type').value;
 const edges=data.edges.filter(e=>visibleIds.has(e[0])&&visibleIds.has(e[1])&&(!selectedType||e[2]===selectedType));
 document.getElementById('count').textContent=list.length+' / '+nodes.length+' 项 · '+edges.length+' 条可见关系';
 svg.replaceChildren();const defs=svgEl('defs');
 const marker=svgEl('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});
 marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#336e79'}));defs.append(marker);svg.append(defs);
 svg.setAttribute('viewBox','0 0 '+shell.clientWidth+' '+shell.clientHeight);
 world=svgEl('g',{id:'world'});svg.append(world);
 world.append(svgEl('rect',{x:0,y:0,width:worldWidth,height:worldHeight,fill:'#fff'}));
 if(result.mode==='timeline')for(let year=2021;year<=2026;year++){const x=timeX({date:String(year)+'-01'});world.append(svgEl('line',{x1:x,y1:43,x2:x,y2:worldHeight-15,stroke:'#e8eef0','stroke-width':1}));world.append(svgEl('text',{x:x+6,y:30,fill:'#617780','font-size':14,'font-weight':600},String(year)))}
 else world.append(svgEl('text',{x:24,y:39,fill:'#6a7f87','font-size':13},'筛选结果按首次公开时间排列。'));
 for(const b of bands){world.append(svgEl('rect',{x:12,y:b.y,width:worldWidth-24,height:b.height,rx:6,fill:b.color,'fill-opacity':.045}));world.append(svgEl('text',{x:23,y:b.y+25,fill:b.color,'font-size':13,'font-weight':650},b.name))}
 const eg=svgEl('g');world.append(eg);edgeEls=[];
 for(const e of edges){const style=edgeStyle[e[2]],path=edgePath(e);const hit=svgEl('path',{d:path,fill:'none',stroke:'transparent','stroke-width':16,class:'edge-hit'});const line=svgEl('path',{d:path,fill:'none',stroke:style.color,'stroke-width':style.width,'stroke-dasharray':style.dash,'marker-end':e[2]==='原文承接'?'url(#arrow)':'','pointer-events':'none'});hit.append(svgEl('title',{},e[2]+'：'+e[3]));hit.addEventListener('click',event=>{event.stopPropagation();openRelation(e)});eg.append(hit,line);edgeEls.push({edge:e,hit:hit,line:line})}
 const ng=svgEl('g');world.append(ng);nodeEls=new Map();
 for(const n of list){const p=positions.get(n.id),g=svgEl('g',{class:'node',transform:'translate('+p.x+' '+p.y+')',tabindex:0,role:'button','aria-label':n.title,'data-node':n.id});
  g.append(svgEl('rect',{x:0,y:0,width:W,height:H,rx:6,fill:'#fff',stroke:colors[n.group],'stroke-width':1.4}));
  g.append(svgEl('rect',{x:0,y:0,width:5,height:H,rx:3,fill:colors[n.group]}));
  g.append(svgEl('text',{x:13,y:17,fill:colors[n.group],'font-size':11,'font-weight':650},shortGroup[n.group]));
  g.append(svgEl('text',{x:W-10,y:17,fill:'#73858c','font-size':10,'text-anchor':'end'},n.date));
  const label=n.label.length>25?n.label.slice(0,24)+'…':n.label;
  g.append(svgEl('text',{x:13,y:37,fill:'#192f38','font-size':13,'font-weight':650},label));
  g.append(svgEl('text',{x:13,y:55,fill:'#647780','font-size':10},n.platform));
  g.append(svgEl('title',{},n.title+'\n'+n.problem));
  g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openNode(n.id)}});
  let drag=null;
  g.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();event.stopPropagation();g.setPointerCapture(event.pointerId);drag={x:event.clientX,y:event.clientY,ox:p.x,oy:p.y,moved:false}});
  g.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;p.x=drag.ox+dx/view.s;p.y=drag.oy+dy/view.s;g.setAttribute('transform','translate('+p.x+' '+p.y+')');for(const item of edgeEls)if(item.edge[0]===n.id||item.edge[1]===n.id){const d=edgePath(item.edge);item.hit.setAttribute('d',d);item.line.setAttribute('d',d)}});
  g.addEventListener('pointerup',event=>{if(!drag)return;const moved=drag.moved;drag=null;g.releasePointerCapture(event.pointerId);if(!moved)openNode(n.id)});
  g.addEventListener('pointercancel',()=>{drag=null});
  ng.append(g);nodeEls.set(n.id,g)
 }
 if(!list.length)world.append(svgEl('text',{x:140,y:170,fill:'#6d7e85','font-size':18},'没有匹配的论文。'));
 fit();updateHighlights();
}
function fact(label,value){if(!value)return null;const d=html('div','fact');d.append(html('h3','',label),html('p','',value));return d}
function showDrawer(kind){document.getElementById('drawer-kicker').textContent=kind;drawer.style.setProperty('--accent',kind==='关系说明'?'#336e79':colors[byId.get(selected)?.group]||'#516977');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');document.getElementById('backdrop').classList.add('open')}
function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.getElementById('backdrop').classList.remove('open')}
function linkButton(id){const n=byId.get(id),b=html('button','',n.label+' · '+n.date);b.type='button';b.addEventListener('click',()=>openNode(id));return b}
function openNode(id){
 if(!byId.has(id))return;pinned.add(id);if(!visibleIds.has(id))draw();selected=id;updateHighlights();
 history.replaceState(null,'','#paper='+encodeURIComponent(id));
 const n=byId.get(id);drawerContent.replaceChildren();showDrawer(n.group);
 drawerContent.append(html('h2','',n.title),html('p','meta',n.platform+' · 首次公开 '+n.date));
 if(n.importance){drawerContent.append(fact('承接证据范围',n.importance.evidence));if(n.importance.downstream.length)drawerContent.append(fact('已核实的直接下游',n.importance.downstream.map(u=>byId.get(u.id).label+'：'+u.detail).join('；')))}
 const links=html('div','links');
 for(const item of [['期刊／原文',n.url],['本地 PDF',n.pdf],['文字卡片',n.notes]]){if(!item[1])continue;const a=html('a','',item[0]);a.href=item[1];if(item[1].startsWith('http')){a.target='_blank';a.rel='noopener noreferrer'}links.append(a)}drawerContent.append(links);
 for(const pair of [['研究问题',n.problem],['运行接口',n.interface],['方法',n.method],['相较同类方法',n.improvement],['实验与证据',n.experiment],['边界',n.limit]]){const f=fact(pair[0],pair[1]);if(f)drawerContent.append(f)}
 if(n.knowledge?.length){drawerContent.append(html('h3','related-title','机制、问题比较与来源用途'));const row=html('div','links');for(const k of n.knowledge){const a=html('a','',k.id+' '+k.title);a.href='knowledge-network.html#view=graph&concept='+k.id;row.append(a)}drawerContent.append(row)}
 const rr=data.edges.filter(e=>e[0]===id||e[1]===id);
 if(rr.length){drawerContent.append(html('h3','related-title','相关工作'));for(const e of rr){const d=html('div','related-item');d.append(linkButton(e[0]===id?e[1]:e[0]),html('small','',e[2]+'：'+e[3]));drawerContent.append(d)}}
 focus(id);
}
function openRelation(e){
 selected=null;updateHighlights();drawerContent.replaceChildren();showDrawer('关系说明');
 const a=byId.get(e[0]),b=byId.get(e[1]);
 drawerContent.append(html('h2','',e[2]),html('p','',e[3]));
 const d=html('div','related-item');d.append(html('p','meta','起点'),linkButton(a.id),html('p','meta','终点'),linkButton(b.id));drawerContent.append(d);
 if(e[2]!=='原文承接')drawerContent.append(html('p','meta',e[2]==='背景引用'?'仅作为背景引用；尚无本文方法被直接复用的证据。':'这条线用于比较或标注收录关系，不表示算法直接继承。'));
}
function reset(){document.getElementById('search').value='';document.getElementById('group').value='';document.getElementById('platform').value='';document.getElementById('edge-type').value='';document.getElementById('surveys').checked=true;pinned.clear();selected=null;closeDrawer();draw()}
for(const g of groups){const o=html('option','',g);o.value=g;document.getElementById('group').append(o)}
for(const p of platforms){const o=html('option','',p);o.value=p;document.getElementById('platform').append(o)}
for(const id of ['group','platform','edge-type','surveys'])document.getElementById(id).addEventListener('change',()=>{pinned.clear();selected=null;closeDrawer();draw()});
document.getElementById('search').addEventListener('input',()=>{pinned.clear();selected=null;closeDrawer();draw()});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('close').addEventListener('click',closeDrawer);
document.getElementById('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
document.getElementById('zoom-in').addEventListener('click',()=>zoom(1.2));
document.getElementById('zoom-out').addEventListener('click',()=>zoom(1/1.2));
document.getElementById('fit').addEventListener('click',fit);
svg.addEventListener('wheel',event=>{event.preventDefault();const r=svg.getBoundingClientRect();zoom(event.deltaY<0?1.13:1/1.13,event.clientX-r.left,event.clientY-r.top)},{passive:false});
svg.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();if(event.target.closest('.node')||event.target.closest('.edge-hit'))return;svg.setPointerCapture(event.pointerId);pan={x:event.clientX,y:event.clientY,ox:view.x,oy:view.y};svg.classList.add('dragging')});
svg.addEventListener('pointermove',event=>{if(!pan)return;view.x=pan.ox+event.clientX-pan.x;view.y=pan.oy+event.clientY-pan.y;applyView()});
svg.addEventListener('pointerup',event=>{if(!pan)return;pan=null;svg.classList.remove('dragging');svg.releasePointerCapture(event.pointerId)});
svg.addEventListener('pointercancel',()=>{pan=null;svg.classList.remove('dragging')});
new ResizeObserver(()=>{svg.setAttribute('viewBox','0 0 '+shell.clientWidth+' '+shell.clientHeight);fit()}).observe(shell);
draw();
document.getElementById('english-link').addEventListener('click',event=>{event.currentTarget.href='literature-map-en.html'+location.hash});
function openHash(){const id=new URLSearchParams(location.hash.slice(1)).get('paper');if(id&&byId.has(id))openNode(id)}
window.addEventListener('hashchange',openHash);openHash();
</script>
