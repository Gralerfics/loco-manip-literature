nchronous inference.", "interface": "", "improvement": "", "experiment": "About 829 hours of human data, 31 hours of robot data, 10 times for each of 8 categories. Subtask evaluation allows manual intervention to continue after failure to measure subsequent sub-goals, but overall success is still required; the mean value of sub-goals after intervention cannot be regarded as a completely autonomous overall rate. The final RTC of single-task ablation is the same as the previous step, 9/10, which mainly improves continuity.", "limit": "Zero-shot background 2/10, object 4/10, space 2/10, general robustness is limited; the baseline pre-training amount and RTC execution configuration are different, and the superior architecture cannot only be attributed. Structured human pose data and fine-tuning of robot tasks are necessary conditions, and the scale far exceeds a single MSc project.", "url": "https://doi.org/10.15607/RSS.2026.XXII.021", "pdf": "papers/RSS_2026_Psi0_An_Open_Foundation_Model_Towards_Universal_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "VLA action model", "platform_en": "Humanoid"}, {"id": "2607.18016", "title": "POT-VLA: Closing the Loop in Humanoid VLA with Persistent 3D Object Tokens", "label": "POT-VLA", "year": "2026", "date": "2026-07", "group": "VLA 动作模型", "platform": "人形", "problem": "After the robot approaches, picks up, carries, and puts down an object, the model of the short action block may forget \"where the same object is now\"; another independent monitor may also use a different state from the action model to successfully judge.", "method": "Save fixed character's 8 object slots from RGB-D, refresh position/scale/visibility/relations across action blocks, tokens input GR00T N1.7 action expert. The configured typed subtask shares these object information with the stable window geometry predicate, dividing the status into ongoing, completed, blocked, failed, and uncertain; re-observe when uncertain to avoid determining success based solely on attempts.", "interface": "", "improvement": "", "experiment": "Unitree G1 eight categories totaled 80 times, direct baseline 39/80, complete 71/80; four tasks ablation direct15/40, verifier22/40, tokens31/40, both34/40. Being-0 is from a different paper suite and cannot be ranked. Object identity preservation, short-term perceptual memory and completed events should be separated; when the rebound button does not have lasting visual changes, process/electrical and other result evidence is still needed, and geometric tokens cannot be automatically confirmed.", "limit": "", "url": "https://arxiv.org/abs/2607.18016", "pdf": "papers/2607.18016_POT-VLA_Closing_the_Loop_in_Humanoid_VLA.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}], "group_en": "VLA action model", "platform_en": "Humanoid"}, {"id": "paper-68", "title": "HoMMI: Learning Whole-Body Mobile Manipulation from Human Demonstrations", "label": "HoMMI", "year": "2026", "date": "2026", "group": "示范／视觉／VLM", "platform": "轮式双臂", "problem": "The wrist camera lacks a global view; the human six-dimensional head pose is not suitable for the robot's two-degree-of-freedom neck. Input UMI head/wrist images and task space demonstrations, and output hand trajectories and 3D look-at points instead of requiring the robot to copy the complete human head pose.", "method": "Explicitly extend UMI to share heads/wrists with ARKit (3). The head image DINOv3+ depth position feature is transferred to the left gripper coordinates, and the wrist image retains local details; the hands are tracked by Mink differential IK/QP, the head look-at is controlled separately to avoid preempting the hand target, and the timestamp is aligned and expired actions are discarded. It is not a direct successor algorithm to UMI on Legs.", "interface": "", "improvement": "", "experiment": "RB-Y1 omnidirectional wheeled arms, 90%/85%/80% success for 20 times each of laundry/delivery/table; 75%/55%/55% for neck removal, lower for single wrist or single head. Demonstration of about 200/166/115 clips, the same style of gripper and precise human posture, supporting overall/partial vision and active observation complement each other.", "limit": "The wheel kinematics QP is not the floating base leg contact dynamics WBC, and the safety of four-legged step change contact has not been proven. Visual contact details are not force haptics; task space, pose acquisition and same gripper conditions cannot be omitted and are generally referred to as arbitrary person video transfer.", "url": "https://doi.org/10.15607/RSS.2026.XXII.205", "pdf": "papers/RSS_2026_HoMMI_Learning_Whole-Body_Mobile_Manipulation_from_Human_Demonstrations.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K42", "title": "Separate observation goals from manipulation goals"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Wheeled Arms"}, {"id": "2505.06776", "title": "FALCON: Learning Force-Adaptive Humanoid Loco-Manipulation", "label": "FALCON", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "人形", "problem": "When opening a door, pulling a car, or moving a heavy object, the end is subject to an unknown three-dimensional external force. If the arm blindly chases the position, the unbalanced disturbance will be transmitted to the leg. Input the body/arm status and task movement target, and the controller should output the anti-interference gait and arm movement at the same time.", "method": "The lower body RL strategy learns stable walking under external force, and the upper body strategy learns end position tracking and implicit force compensation; during joint training, the three-dimensional end external force is gradually increased, and joint moment limits are checked. The focus is on the adaptation of the control strategy to unknown forces, not on semantic task selection.", "interface": "", "improvement": "", "experiment": "The paper demonstrates load handling, pulling carts and opening doors on Unitree G1 and Booster T1 real robots, marking the interaction ranges of approximately 0–20 N, 0–100 N, and 0–40 N respectively; the simulation and baseline compare arm tracking and interference immunity. The force level and body shape are different from the lightweight Piper, so its high-power performance cannot be directly used as a guarantee of light contact safety.", "limit": "The real robot opens the door using stance; the main external force training does not include any external torque. Contact point/quasi-static compensation has limitations; appendix reports actuator thermal constraints.", "url": "https://arxiv.org/abs/2505.06776", "pdf": "papers/2505.06776_FALCON_Learning_Force-Adaptive_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}], "group_en": "RL / whole-body execution", "platform_en": "Humanoid"}, {"id": "2409.16048", "title": "Whole-body End-Effector Pose Tracking", "label": "Whole-body Pose Tracking", "year": "2024", "date": "2024-09", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Existing end tracking methods either only track the position, or mainly cover the front of the body and the flat ground. This article studies how to stand on uneven ground and use the redundant movements of the body and arms to accurately achieve the six-dimensional end pose in a larger work space.", "method": "First collect 10,000 self-collision-free poses using arm forward kinematics, then add random body transformation to expand the target range, and use coarse terrain maps to exclude targets below the ground. The end pose is represented by three non-collinear points fixed on the tool, and the position and rotation are unified into point distances. Change targets every 4 seconds, enable reach bonuses only for the last 2 seconds, and replenish sparse bonuses as progress exceeds the all-time best distance; drive terrain courses with error. Reuse the stable initial configuration generated by the walking strategy to reduce switching jitter.", "interface": "Enter the position difference between the body state, the previous action and the current/target three end key points in body coordinates; the terrain map is not read. Output 12 leg + 6 arm joint position targets. Walking is performed by an alternative strategy, an operational strategy that encourages quadrupedal contact and a small amount of foot movement.", "improvement": "Incorporate complete pose representation, target sampling and initial state of uneven terrain into training; compare four pose representations, and the same robot MPC. Instead of combining free walking and contact operations into a continuous execution strategy.", "experiment": "[real robot + simulation] ANYmal-D + DynaArm. real robot captured 20 flat targets: average 2.03 cm/2.86°; staircase test average 2.64 cm/3.64°. Simulation of 10,000 targets to verify the representation with additional load, 35 targets compared to MPC. The median errors of MPC and RL are similar, and the poorer mean value of MPC mainly comes from a small number of stuck situations across the body.", "limit": "§III-G clearly does not include locomotion. Switch to the independent walking strategy and then change the direction of the stairs. Stair pose tracking cannot be used to prove that objects are maintained in contact while walking. The topographic map is only used for training sampling; no fair comparison of the staircase MPC is done. Keypoint cube size still implies position/orientation weighting; not entirely without trade-offs.", "url": "https://arxiv.org/abs/2409.16048", "pdf": "papers/2409.16048_Whole-body_End-Effector_Pose_Tracking.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2507.04229", "title": "Efficient Learning of A Unified Policy For Whole-body Manipulation and Locomotion Skills", "label": "PFG Unified Policy", "year": "2025", "date": "2025-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When only the final terminal error is rewarded, it is difficult for RL to discover in the early stage that changes in body posture can allow the arm to reach the target; later, the walking reward becomes stronger, and the learned body/arm coordination may be abandoned. This article uses explicit kinematics to suggest this fit.", "method": "Move the target to the current body coordinates, and use damped least squares IK with joint limits to determine whether the body posture can allow the arm to reach the target. When IK has a solution, it will reward feasible postures and provide training guidance based on the solved arm joint configuration, so that the strategy can obtain feedback from favorable body postures before reaching the target. Cubic interpolation is then used to generate a smooth end reference, and the asymmetric PPO is trained by combining speed, pose and motion regularization terms.", "interface": "Input body speed and end pose target, body and arm status, and previous action; output 18 joint position targets uniformly. IK solution is mainly used for accessibility rewards and critic information during the training period, and is not used to replace the arm action head during deployment.", "improvement": "Compared with Deep WBC's ROA/advantage mixing, the main change is kinematic accessibility shaping, not a new RL optimizer. Instead of just using the final error, it separates \"the body has made the target reachable\" from \"the end has been reached\".", "experiment": "[real robot + simulation] Simulation comparison of AAC, AAC + PFG, ROA, ROA + AM; 5000 poses using the 60th percentile error, 1000 speed commands to measure speed tracking. The PFG position error is 8.7 cm and the rotation error is 0.18 rad, which cannot be regarded as the average error. The real robot X20+Z1 shows the terminal lifting and body pitch compensation when moving, and there are also cases of picking up and towing.", "limit": "The so-called 34% expansion of the work space is based on the IK solution rate, not a 34% increase in geometric volume. The reference coordinates move with the horizontal body and cannot be directly understood as fixed world contact. The real robot does not have a large sample of contact force/mission success rate; failure in the IK value does not strictly mean that the target is unreachable.", "url": "https://arxiv.org/abs/2507.04229", "pdf": "papers/2507.04229_Efficient_Learning_of_A_Unified_Policy_For_Whole-body_Manipulation_and_Locomotion_Skills.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2505.22974", "title": "Learning coordinated badminton skills for legged manipulators", "label": "Badminton", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Playing badminton requires moving to the hitting position within a limited remaining time, swinging the racket accurately, and continuously seeing flying objects clearly during preparations. Body rotation affects camera measurements, and perceptual errors change the target shot that should be executed.", "method": "Fit the dependence of detection probability and position error on distance and angular velocity from the real robot mobile camera data. Use this model in training and run the same EKF as the real robot. The strategy rewards accurate, on-time hits while penalizing prediction errors, so that body movements serve both the shot and the observation. The asymmetric critic additionally reads future information such as the number of remaining shots; the N-P3O processing arm total current budget, actuator model and CMA-ES identification are improved and migrated.", "interface": "Input the body status and the hitting position, speed, time and other targets given by the EKF/flight model, and uniformly output the 18 joint position commands of the legs and arms. Strategy 100 Hz, on-board vision with prediction asynchronous 60 Hz; not RGB direct to joint VLA.", "improvement": "Incorporate changes in perceptual quality caused by actions into the learning closed loop; compare with rewards that directly encourage the target to stay in the field of view. Rather than just specifying end trajectories, policies also determine movement, timing, and active observation behavior.", "experiment": "[real robot + simulation; strong experiment] The airborne system fights with people in the laboratory, indoor halls and outdoors, recording 10 consecutive rounds; the maximum speed of the real robot is 12.06 m/s. The simulation is separated to point, volley with perception error, energy consumption, critic information and current constraint ablation; some successful hitting areas are verified on the real robot. The main constraints and learning curves in Fig.7 come from simulation and cannot all be taken as real robot statistics.", "limit": "The orange badminton is detected by HSV, and the background/illumination affects the perception model; the measured visual delay is 60–160 ms. Mainly flat with specific racket/sport models, not general object manipulation. The training constraints of the current budget are different from the personal safety guarantees in the mission, and the safety of arbitrary contact cannot be proved by the absence of supercurrent.", "url": "https://arxiv.org/abs/2505.22974", "pdf": "papers/2505.22974_Learning_coordinated_badminton_skills_for_legged_manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2506.16986", "title": "Learning Accurate Whole-body Throwing with High-frequency Residual Policy and Pullback Tube Acceleration", "label": "Accurate Throwing", "year": "2025", "date": "2025-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "High-speed throwing not only requires the end to have the correct position and speed when released, but also deals with the uncertainty of when the object will break away after the jaws are opened. Accurately tracking the target moment at a single time cannot guarantee that the entire possible release window can be hit.", "method": "First learn timed whole-body end state tracking, and then freeze the nominal strategy to train high-frequency arm residuals. The model module uses projectile landing point mapping to find the landing point deviation of the current release state, and seeks corrections under the speed/acceleration boundary so that the end state within the 100 ms release window is close to the set of states that can reach the target. Parametric solver compiled with CVXPYgen, deployment updated every 2.5 ms; not just planned offline once before throwing.", "interface": "Input the body status, throwing end position/speed/orientation, timing and previous action; the 100 Hz strategy outputs 18 joint references, and the 400 Hz residual only corrects the arm joint position. The optimizer calculates the vertical acceleration reference within the release window from the current end state.", "improvement": "The original tube acceleration is first assumed to be within the effective release state set and can be accurately tracked; this article makes closed-loop corrections based on the current tracking error. Compared with Athletic's pursuit of long throws, the focus becomes the accuracy of the landing point for a given target; the two texts are not a direct inheritance that has been verified.", "experiment": "[real robot + simulation; strong experiment] The real robot 4/6 m each contains two lateral offsets, 10 times for each target, 40 times in total, and the nominal baseline is repeated; the average landing point error of 6 m is 0.276 m, and the nominal baseline is 0.685 m. Simulate 500 times of component ablation and analyze the release window of 1500 initial states × 5 seeds. In addition, compared with 25 students, 71/125 were robots and 19/125 were humans.", "limit": "Human comparison and snowball test use partial implementation/early training checkpoint, which cannot be used as the final ablation of the whole system. The real robot residual improvement is weaker than the simulation, and the authors point out that the dynamics may be overfitted. Only the vertical acceleration residual is given; it relies on the assumption of an approximate flight model and a small relative terminal inertia of the object. Sustained walking exposure has not been demonstrated.", "url": "https://arxiv.org/abs/2506.16986", "pdf": "papers/2506.16986_Learning_Accurate_Whole-body_Throwing_with_High-frequency_Residual_Policy_and_Pullback_Tube_Acceleration.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K18", "title": "Demonstration tracking, progress adaptation, and task optimization"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K45", "title": "Robust throwing under uncertain release timing"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2503.01474", "title": "Interactive Navigation for Legged Manipulators with Learned Arm-Pushing Controller", "label": "Interactive Arm-Pushing", "year": "2025", "date": "2025-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When navigation encounters movable obstacles, the detour may be very far; it is difficult to find the contact position in a narrow space when pushing objects with the body. This article allows the robotic arm to push away obstacles from a position where the body cannot enter, and the cost of pushing objects is included in the path selection.", "method": "Hybrid A* adds the estimated push time to the path cost, and QP smoothes the path; it samples objects that will not continue to block the road, and calls push when approaching. RL first rewards entering the cylindrical area on the dorsal side of the object relative to the target, and then turns on pushing to the target and preventing tipping rewards; segmented distance courses and LSTM help learn to push objects of different masses/frictions. When it cannot be pushed, the obstacles will be reclassified into static ones and focused on planning.", "interface": "Navigation inputs pre-built maps, known movable obstacles and target positions; push-object strategy reads object/target/end state and history, and original outputs 6 arm joint increments. When extending the whole body execution, the end reference is generated from the action and then handed over to the low-level tracker trained according to Visual WBC.", "improvement": "Compared with pushing objects with the body, new active arm contact and contact areas suitable for pushing are added; compared with single task rewards, first guide to find the correct side, and then reward moving objects. Navigation, push items, and re-planning are module systems, not unified end-to-end navigation RL.", "experiment": "[real robot + simulation] Gazebo object size, friction, mass, cylinder migration, 50 times per condition, success rate 76–92%; two-stage rewards compared with two baselines. B2+Z1 Pro real robot 8×6.8 m scene, average 58.20 s/5.42 m, detour 113.50 s/10.70 m; demonstrate path recovery when unable to push.", "limit": "Know in advance which obstacles can be moved, and the real robot objects and robot status are automatically captured; it does not mean that the open environment can be autonomously recognized and promoted. Powerless peak safety statistics. The description of 25 Hz, 100 steps and \"10 seconds\" in the main text is inconsistent, and the successful speed is not calculated accordingly; the whole body version lacks individual quantified ablation.", "url": "https://arxiv.org/abs/2503.01474", "pdf": "papers/2503.01474_Interactive_Navigation_for_Legged_Manipulators_with_Learned_Arm-Pushing_Controller.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K23", "title": "Choose navigation goals that permit manipulation"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2508.08328", "title": "Whole-Body Coordination for Dynamic Object Grasping with Legged Manipulators", "label": "DQ-Net / DQ-Bench", "year": "2025", "date": "2025-08", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "Existing visual grasping mainly targets stationary objects. Continuously moving targets make the current capture pose expire quickly, and running a large capture network frame by frame has computational and timing costs; visual history and stable capture candidates are required to jointly guide the approach.", "method": "First use Contact-GraspNet to generate candidates and save the top-30 grabs in object coordinates. The teacher transforms the candidate with the current object pose, uses point cloud/pose query and candidate key/value attention to generate a grasp representation, and then uses RL to learn task actions. Freeze the teacher and use Dagger to get the teacher label on the student's own arrival status; the two perspectives share the CNN and perform sequential Transformer encoding respectively, and then fuse the actions. The benchmark uses a small mobile platform to carry objects, with four levels of speed and 2D/3D random motion.", "interface": "The privileged teacher reads the object pose, speed, point cloud and grabbing candidates; the target student is deployed to read only 3 frames of mask+depth and body status from both wrist/body perspectives. The high-level outputs the end position/orientation increment and chassis speed commands; the legs are low-level RL, and the arms are executed by IK.", "improvement": "Clearly use Visual WBC as the shared low-level and high-level baseline, and add candidate fusion and visual timing students for dynamic objects; instead of just renaming the static grabbing task. GFM memory is a library of object geometry candidates, not a memory of completed task events.", "experiment": "[Simulation only] Category 43 YCB: 30 trained, 13 not seen. Shared low-level, comparison VBC, adapted VBC-D, de-candidate fusion, de-speed, CNN students. The most difficult L4 is completed by 74.3% of teachers, 41.0% of students, and 16.0% of VBC-D students; the number of steps completed is 34.32 vs. 41.56. The appendix retains the unseen objects for comparison with the student structure.", "limit": "The conclusion clearly lists real robot deployment as future work, and B1+Z1 is a simulation form. 74.3% non-deployable vision student success rate. There is an obvious information gap between fixed grab candidates and privileged teachers to students; some unseen objects in the appendix go up faster, and it cannot be claimed that dynamic information is always beneficial.", "url": "https://arxiv.org/abs/2508.08328", "pdf": "papers/2508.08328_Whole-Body_Coordination_for_Dynamic_Object_Grasping_with_Legged_Manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K40", "title": "What a visual representation must retain"}, {"id": "K42", "title": "Separate observation goals from manipulation goals"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2512.04381", "title": "FALCON: Actively Decoupled Visuomotor Policies for Loco-Manipulation with Foundation-Model-Based Coordination", "label": "FALCON (quadruped)", "year": "2025", "date": "2025-12", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "The mobile chassis requires global vision and speed control, and the robotic arm requires local vision and accurate position control. Giving all these inputs and goals to a demonstration strategy may be difficult to learn at the same time; after taking them apart, you need to coordinate the body position and arm operation.", "method": "Freeze CLIP encoding multi-view and text, and use trainable projection/shallow Transformer to fuse the two strategies to share context. The similarity between text and image in the ongoing/done stage gives the stage probability and progress as action conditions. During training, the matching demonstration arm/chassis movements are used as positive samples, and the movements of the two subsystems are disrupted to construct negative samples. InfoNCE regularizes the shared representation to include collaborative relationships; high-level learning learns from the same batch of teleoperation demonstrations.", "interface": "Enter wrist/head/body RGB, body and task text, and manually written stage prompts. The two diffusion strategies output chassis speed/height/pitch and end target respectively; low-level leg RL and arm IK. Action model 10 Hz off-board 4090, leg RL50 Hz, inner ring 200 Hz, arm 100 Hz.", "improvement": "It does not use CLIP directly as a controller; it is different from centralized diffusion/ACT in that it is a dedicated action stream plus shared semantics and stage conditions. The paper is explicitly inspired by LatentToM and used as a baseline. It belongs to language-conditional visual action learning adjacency and cannot be equivalent to π0-style large-scale pre-training VLA or language planner to select fixed skills.", "experiment": "[real robot] Two types of drawer tasks: approaching → opening the drawer → taking toys → putting them in; and carrying objects → approaching → putting them in → closing the drawer. Same as the 50-item demonstration, CDP/ACT/LatentToM and stage/contrast loss ablation, 15 times per task (5 for each of the 3 initial areas). The main text reports that Task2 is complete 15/15, and there is also a subsystem manual takeover test.", "limit": "There are only two tasks, mainly changing the initial position; the stage text is constructed manually, and no task prior is required. Contrast loss sometimes reduces OOD navigation indicators, which is not beneficial for all links. The criteria for Task 2 being in place are different from the overall completion criteria; the 100% description in the human-in-loop text is inconsistent with the partial 80/90% in Table III. They are recorded separately and cannot be collectively referred to as 100% fully autonomous. No contact force safety statistics.", "url": "https://arxiv.org/abs/2512.04381", "pdf": "papers/2512.04381_FALCON_Actively_Decoupled_Visuomotor_Policies_for_Loco-Manipulation_with_Foundation-Model-Based_Coordination.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}, {"id": "K42", "title": "Separate observation goals from manipulation goals"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2511.19709", "title": "Whole-Body Inverse Dynamics MPC for Legged Loco-Manipulation", "label": "Whole-Body ID-MPC", "year": "2025", "date": "2025-11", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "Simplifying body model planning and then executing it by WBC may cause inconsistencies when the arm is heavy, the applied force is large, or the joints are close to the upper limit of torque. This paper investigates whether joint-level dynamics and contact forces can be directly put into the same real-time prediction optimization.", "method": "Use RNEA inverse dynamics to constrain the path of each prediction node, and at the same time constrain the six-dimensional force balance of the floating base, foot non-slip, friction cone and joint motion range. The terminal force/velocity is a given equation condition; the gait timing is fixed and the lateral foothold can be optimized. Pinocchio+CasADi creates a sparse symbol problem, and Fatrop uses the stage structure to solve it, hot start and compile acceleration; the geometric time grid is extended by thinning first and then coarsening.", "interface": "Enter estimated configuration/speed, chassis speed, terminal speed/force and fixed gait contact timing. The whole body configuration, speed, acceleration, contact force and proximal joint torque are optimized, and the output trajectory is performed by 500 Hz interpolation and PD; there is no additional QP-WBC, which does not mean there is no joint feedback.", "improvement": "Compared with the forward dynamics/centroid model of the same framework, it shows that the problem expression and solver structure can enable the full-order model to run in real time, without necessarily requiring order reduction. It is different from the level of concern of ETH multi-contact planning: contact sequences are not searched here, and objects are not modeled.", "experiment": "[real robot + simulation; important boundary] 15-node 0.56 s time domain, average 12.5 ms after compilation; forward model 34.2 ms, specific solver and expression matching cannot generally be said to be faster for all full-order MPC. The B2+Z1 real robot can pull 10 kg while walking, push boxes while walking, wipe whiteboards while standing, and has low-gain human-machine suppleness. The simulation checks the 0.8 m/s disturbance and moment saturation, and the non-uniform grid drift is 0.4 vs. 1.2 cm/s.", "limit": "The joints of the last two arms are locked; the torque limit only constrains the first two time steps, and the far end is not similarly constrained. The real robot does not have the equipment to measure the actual end force and cannot verify the accurate tracking of the force target. No object dynamics or collision constraints; off-board calculations, real robot 20 ms solution spikes and mass distribution/actuator model deviations.", "url": "https://arxiv.org/abs/2511.19709", "pdf": "papers/2511.19709_Whole-Body_Inverse_Dynamics_MPC_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}, {"id": "K11", "title": "Reserve disturbance margin before the disturbance"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2512.18938", "title": "A Framework for Deploying Learning-based Quadruped Loco-Manipulation", "label": "Deployment Framework", "year": "2025", "date": "2025-12", "group": "形态／系统", "platform": "四足＋臂", "problem": "When the same training strategy is deployed across simulators or deployed on real robots, different observation indexes, control timings and contact models will change the performance; many existing frameworks lack a complete and reusable deployment chain. This article reconstructs the same B1+Z1 interface to check these differences.", "method": "Based on the partial open source implementation of Visual WBC, the Isaac Gym training→MuJoCo verification→real robot ROS interface is extended. The joint torque used for foot contact is transformed into a rough force estimate through Jacobian pseudo-inversion and then thresholded; the real robot and simulation share FSM, target management and PD. Explicitly compare MuJoCo default and high impratio contact settings to differentiate between smoother graphics and true grip robustness.", "interface": "The command is the chassis speed and end posture; leg RL plus ROA type adaptation, arm damping IK. Connect to the simulator/SDK through MujocoHW or QmHW with the ROS control node to maintain the interface and observation arrangement; remotely operate to high-level targets.", "improvement": "The contribution is a deployment interface and cross-simulator diagnostics, not a new whole-body RL algorithm. Body-assisted reach compared to fixed-body default controllers, emphasizing repeatable engineering baselines.", "experiment": "[real robot + simulation] Low/medium/high end target with 23 seconds speed sequence, vx/yaw RMSE reported across simulators. There are 3 types of YCB objects and 4 heights in the real robot. There are 10 times for each object in Table 4, a total of 30 times: WBC 26/30, default 15/30 (counted from the table), which is a remote operation to retrieve objects, not a visual independent success.", "limit": "The original text states that the code has not yet been made public and is scheduled to be released. It cannot be regarded as a ready-to-download baseline based on the title alone. The contact pseudo-inverse formula does not completely differentiate between gravity/inertia deviations and is not evidence of accurate external force estimation. High impratio improvements may come from unrealistic frictional impedance; 3 times per condition or 1 on ground, small sample size.", "url": "https://arxiv.org/abs/2512.18938", "pdf": "papers/2512.18938_A_Framework_for_Deploying_Learning-based_Quadruped_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Robot / system", "platform_en": "Quadruped + arm"}, {"id": "2605.15713", "title": "Learning Dynamic Pick-and-Place for a Legged Manipulator", "label": "Dynamic Pick-and-Place", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Segmented grasping and handling creates pauses and may select a body/arm configuration during grasping that is not conducive to subsequent placement. This paper studies grabbing, carrying, upright placement and evacuation without interruption of movement and adapting to different object masses.", "method": "First use asynchronous random joint arm motion and load to train anti-disturbance gait to avoid covering only smooth end interpolation; then put grabbing, handling, placement and arm withdrawal in a single episode to train the task strategy. The six stages reward the current sub-goal while retaining subsequent rewards; synchronizing the success rate of each sub-task drives the distance/quality/placement tolerance course. The history estimator is supervised with simulation quality and exposure to ground truth, and its output is given directly to the task actor.", "interface": "Enter robot/object state history, pick/place location, object size/type and explicit task phase. The high-level output chassis vx/vy/yaw, height/pitch and 6-arm joint/binary gripper; the low-level leg strategy is frozen. LSTM estimates the object quality and gripper contact status; the real robot object/table status is obtained by Vicon.", "improvement": "Optimize the complete task together compared to the segmented strategy; instead add domain-only randomization to the mass/contact estimation in the execution. The effect is similar to the latent variable adaptation control, but the explicit small-dimensional output training is more economical. Not task-free phase memory, nor VLA.", "experiment": "[real robot + simulation; strong experiment] Simulation of 5 sub-classes with 10,000 tasks each: 86.05% versus 81.88% for no estimate, 78.40% for segmentation, and 85.82% for latent variables; completion time 2.071 s versus 2.572 s for segmentation. real robot 6 conditions were tested 10 times each, total 44/60=73.3%, average 4.06 s; maximum mass 1.3 kg, ground to 1.1 m table condition 6/10. The nominal task of replacing the lower level of VBC with the real robot is 3/10, and the overall score is 9/10.", "limit": "It is said to be 10 times faster than the old method. The tasks/observations/platforms of different papers are different and cannot be ranked strictly under the same conditions. The real robot relies on Vicon, and the object shape is mainly box/cylinder; 2.3 kg is the training range, and the real robot only measures 1.3 kg due to the safety limit of the gripper. The main failure is that the gripper slips/pops out, the binary gripper cannot adjust the force continuously, and the simulation of edge and corner contact is obviously different.", "url": "https://arxiv.org/abs/2605.15713", "pdf": "papers/2605.15713_Learning_Dynamic_Pick-and-Place_for_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K18", "title": "Demonstration tracking, progress adaptation, and task optimization"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2212.03238", "title": "Walk These Ways: Tuning Robot Control for Generalization with Multiplicity of Behavior", "label": "Walk These Ways", "year": "2022", "date": "2022-12", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "Define the task at flat ground speed tracking only, there are many equally valid ways of walking. RL often converges to one of them; when this method is not suitable in the new environment, it is often necessary to modify the environment/reward and retrain. This paper retains a variety of controlled behaviors, allowing the deployer to choose a more appropriate walking method without updating network weights.", "method": "Train a behavioral conditional PPO strategy to track different contact rhythms, postures and foot-lifting trajectories according to behavioral parameters under the same speed command. The rewards are divided into speed tasks, fixed stability/smooth items, and auxiliary items that change according to behavioral parameters; the contact timing determines that there should be less force when swinging and less sliding when supporting. The Raibert heuristic allows the foot landing point to change with speed and stance width to avoid stance width rewards from hindering turns. Resample commands and behaviors mid-training to learn switching; use four categories of symmetrical gaits as sampling base and speed grid courses. The terrain is always flat, but with random mass, friction, actuators, etc.; additional actuator networks and ~20 ms action delays close the sim-to-real gap.", "interface": "The task instructions are vx, vy, and yaw speeds in body coordinates; the behavior vector has 8 dimensions: three groups of interfoot phase, stride frequency, body height, body pitch, stance width, and foot lift height. Text §3.2 reports 30-step joint status, body gravity direction, commands/behaviors, past movements and quadruped clock history; in addition, body speed and friction are estimated from historical supervision. Output 12 joint position offsets, executed by PD (kp=20, kd=0.5); Go1 Edu+Jetson TX2 NX, 50 Hz. There are no robotic arms, end targets, cameras/terrain maps, or contact force manipulation targets.", "improvement": "The contribution is the interpretable behavior space and the migration route of \"no retraining, changing behavioral input\". It is not the first time to propose gait parameters, PPO, courses, system identification or domain randomization; nor is it the unsupervised automatic discovery of skills. The paper explicitly draws on bipedal contact rewards, Raibert, and existing actuator/adaptation methods. It retains multiple solutions for a task and can connect high-level tasks to existing behavioral interfaces.", "experiment": "[real robot + simulation, mainly walking] Go1 real robot switches trot/pace/bound/pronk and 2-4 Hz rhythm; someone adjusts the parameters to pass steps/kerbs, shrubs and 22 cm low crossbar, and widens the stance in advance to resist push; tilting the body and dumping the ball carried are simple body load operations. The comparison of platform terrain and energy consumption is mainly simulation: random platform up to 16 cm, three kinds of seeds, reporting episode survival time ratio, trot 0.88, pace 0.87, gait-free 0.83. Table 3 shows trot mechanical power of 24 and gait-free 35 at 1 m/s, which cannot be used as a real robot battery life. Table 5 also shows that the gait-free flat ground and high-speed combination performs better. Front jump and dance are demonstrations of preset parameter sequences, not automatic planning.", "limit": "Behavior selection in new environments is mainly done by humans; there is no proven strategy that can automatically identify and select optimal behaviors. MoB effectively relies on \"at least one of the learned behaviors being suitable for the target environment\", which is not an arbitrary OOD guarantee; behavioral constraints may reduce the flat top speed/turn combination performance. The text platform test is 10 s, and Appendix C Figure 8 shows the 20 s setting, which needs to be kept separately. The impact of stance width/phase on posture stability does not mean ensuring the safety of the hand trajectory or contact force; switching to a robotic arm requires additional training/verification.", "url": "https://proceedings.mlr.press/v205/margolis23a.html", "pdf": "papers/2212.03238_Walk_These_Ways_Tuning_Robot_Control_for_Generalization_with_Multiplicity_of_Behavior.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K46", "title": "One task, multiple locomotion behaviors"}], "group_en": "Locomotion foundations", "platform_en": "Walking on four legs (without arms)"}, {"id": "1707.06347", "title": "Proximal Policy Optimization Algorithms", "label": "PPO", "year": "2017", "date": "2017-07", "group": "RL 训练基础", "platform": "通用方法", "problem": "The policy gradient is only updated once for each batch of data, resulting in low sample utilization; large-scale updates can easily destroy existing strategies.", "method": "After collecting the trajectory of the current strategy, construct an alternative target based on the action probability ratio of the old and new strategies, and clip the ratio to an interval close to 1; perform multiple rounds of small batch updates on the same batch of data. Pruning is to suppress excessive policy changes and is not a strict security constraint.", "interface": "Input the probability ratio and advantage estimate of the current observation and sampling action; output the updated strategy parameters, without specifying the robot sensor or action space.", "improvement": "", "experiment": "[Simulation benchmark] Continuous control and Atari; the original paper does not have a real four-legged + arm machine.", "limit": "A large number of four-legged papers use PPO optimization strategy, but its whole-body coordination, reward and sim-to-real mechanisms are not native to PPO.", "url": "https://arxiv.org/abs/1707.06347", "pdf": "papers/1707.06347_Proximal_Policy_Optimization_Algorithms.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL training foundations", "platform_en": "General method"}, {"id": "1011.0686", "title": "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning", "label": "DAgger", "year": "2010", "date": "2010-11", "group": "示范学习基础", "platform": "通用方法", "problem": "If you only imitate on the expert trajectory, you will encounter a distribution shift: after the student makes a mistake in one action, he will enter a state that is not covered by the training set.", "method": "Let the current student run it repeatedly, import its actual access status and expert corrective actions into the training set, and then do supervised learning. The core is that the training status distribution gradually approaches the deployment distribution, rather than just increasing the original demonstration volume.", "interface": "Students run in the environment to generate states; experts mark these states with target actions; and output the updated student strategy.", "improvement": "", "experiment": "[Simulation and Structured Prediction] The original text compares two imitation learning tasks and sequence annotation; no four-legged real robot is used.", "limit": "Requires experts who can be consulted at any time, may require expensive teleoperation or simulation teachers on the robot; does not automatically provide a mechanism for secure access to status.", "url": "https://arxiv.org/abs/1011.0686", "pdf": "papers/1011.0686_A_Reduction_of_Imitation_Learning_and_Structured_Prediction_to_No-Regret_Online_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "Imitation-learning foundations", "platform_en": "General method"}, {"id": "2108.10470", "title": "Isaac Gym: High Performance GPU-Based Physics Simulation For Robot Learning", "label": "Isaac Gym", "year": "2021", "date": "2021-08", "group": "RL 训练基础", "platform": "跨平台仿真工具", "problem": "The round-trip transmission between CPU physical simulation and GPU neural network limits the speed of large-scale robot RL training.", "method": "Put physical simulation, tensor representation and RL pipeline on the GPU to simulate robots in batches in parallel; this is the training infrastructure, not the gait reward or operation algorithm.", "interface": "The parallel environment advances on the GPU, providing status, rewards and training data directly to the GPU policy/optimizer.", "improvement": "", "experiment": "[Simulation benchmark + real robot migration example] Large-scale parallel simulation and training throughput; §6.1.4 also reports the real robot migration of ANYmal for rough terrain walking, and TriFinger migration. There is no actual comparison of four-legged + arm operation.", "limit": "The improvement of simulation throughput does not guarantee realistic dynamics or success of the actual machine; the specific simulation platform and contact model still need to be verified article by article.", "url": "https://arxiv.org/abs/2108.10470", "pdf": "papers/2108.10470_Isaac_Gym_High_Performance_GPU-Based_Physics_Simulation_For_Robot_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL training foundations", "platform_en": "Cross-platform simulation tool"}, {"id": "2107.04034", "title": "RMA: Rapid Motor Adaptation for Legged Robots", "label": "RMA", "year": "2021", "date": "2021-07", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "Only after the leg strategy trained in simulation reaches the real terrain, friction, load, and ground softness and hardness cannot be directly observed and will change.", "method": "First jointly train the environment encoder and walking policy in random environment parameters and terrain; then freeze them and use simulation labels to supervise the historical adapter to imitate z. When deployed, the adaptor updates the latent representation in real time from past actions and feedback, and no longer reads privileged environment parameters.", "interface": "The first-stage strategy inputs the ontology state, speed command and z encoded by privileged environmental factors; the second-stage adaptor predicts z based on the recent ontology history of the robot, and the real robot only uses historical prediction values. Policy output joint target.", "improvement": "", "experiment": "[real robot + simulation] Unitree A1 walks in conditions such as sand, mud, gravel, grass, and stairs; the text reports the success rate of some tasks, and there is no real robot fine-tuning.", "limit": "The original work does not have robotic arms or object operations; the goals of the two-stage adaptation training are different from the subsequent joint ROA arrangement of Deep WBC.", "url": "https://arxiv.org/abs/2107.04034", "pdf": "papers/2107.04034_RMA_Rapid_Motor_Adaptation_for_Legged_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}], "group_en": "Locomotion foundations", "platform_en": "Walking on four legs (without arms)"}, {"id": "2109.11978", "title": "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning", "label": "Learning to Walk in Minutes", "year": "2021", "date": "2021-09", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "The traditional CPU serial training of quadruped RL is too slow, and it is difficult to coordinate terrain difficulty courses with a large number of parallel robot training.", "method": "Advance thousands of environments in parallel, adjust the implementation of PPO under large batches of data, and introduce terrain courses that increase or decrease according to robot performance; make the legged_gym training configuration public.", "interface": "Large-scale GPU simulation of ANYmal environment, PPO learning strategy from ontology observation and speed command to joint action.", "improvement": "", "experiment": "[real robot + Simulation] It takes about 4 minutes on flat ground and 20 minutes on complex terrain to train the ANYmal strategy and migrate it to the real robot; the training time is based on the hardware and task settings described and cannot be extrapolated to arm-mounted tasks.", "limit": "A breakthrough in walking training speed does not mean that this article designed loco-manipulation rewards, contact arrangements or hand-held controls.", "url": "https://arxiv.org/abs/2109.11978", "pdf": "papers/2109.11978_Learning_to_Walk_in_Minutes_Using_Massively_Parallel_Deep_Reinforcement_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "Locomotion foundations", "platform_en": "Walking on four legs (without arms)"}, {"id": "2010.11251", "title": "Learning Quadrupedal Locomotion over Challenging Terrain", "label": "Challenging Terrain", "year": "2020", "date": "2020-10", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "The blind walking controller must not only avoid foot slip on real rough and soft terrain, but also achieve real actuator errors across simulations.", "method": "Use multi-difficulty terrain courses, actuator models, and dynamic randomization to train proprioception strategies; the course gradually exposes steps, slopes, and irregular foot supports.", "interface": "ANYmal's joint and inertial body observations and speed commands enter the strategy and output joint movements; the original deployment strategy does not rely on the forward visual map.", "improvement": "", "experiment": "[real robot + simulation] ANYmal walks on real terrain such as mud, snow, gravel, etc.; Science Robotics 2020.", "limit": "is often cited as a legged terrain background in later works, and their specific strategies, rewards, or terrain codes cannot be directly inherited based on this.", "url": "https://arxiv.org/abs/2010.11251", "pdf": "papers/2010.11251_Learning_Quadrupedal_Locomotion_over_Challenging_Terrain.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}], "group_en": "Locomotion foundations", "platform_en": "Walking on four legs (without arms)"}, {"id": "2201.08117", "title": "Learning robust perceptive locomotion for quadrupedal robots in the wild", "label": "Perceptive Locomotion", "year": "2022", "date": "2022-01", "group": "行走方法基础", "platform": "四足行走（无臂）", "problem": "Walking on the obstacle is only known after foot contact, making it difficult to choose your footing and adjust your body in advance; the height map may also be noisy or outdated.", "method": "End-to-end training of the attentional loop encoder fuses ontology and extrinsic terrain information, allowing the strategy to rely more on body feedback when terrain vision is inaccurate, rather than manually specifying fixed weights of the two sensors; training includes perceptual degradation and complex terrain.", "interface": "The ontology history and external sense topography measurement enter the attention loop encoder, and then condition the walking strategy; output leg movements, and operate the target without arm end.", "improvement": "", "experiment": "[real robot + simulation] ANYmal walked outdoors on complex terrain in multiple seasons, and reported long-term hiking in the Alps; Science Robotics 2022.", "limit": "High frequency is cited as the terrain perception background in quadruped operation papers, but it does not mean that they reuse the same visual fusion device.", "url": "https://arxiv.org/abs/2201.08117", "pdf": "papers/2201.08117_Learning_robust_perceptive_locomotion_for_quadrupedal_robots_in_the_wild.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "Locomotion foundations", "platform_en": "Walking on four legs (without arms)"}, {"id": "2103.00946", "title": "A Unified MPC Framework for Whole-Body Dynamic Locomotion and Manipulation", "label": "Unified MPC 2021", "year": "2021", "date": "2021-03", "group": "模型控制方法基础", "platform": "四足＋臂", "problem": "If walking and arm operation are planned separately, it will be difficult to handle the dynamic coupling of the body, feet, hands and the operated object at the same time.", "method": "Put the dynamics of the robot's center of mass and the dynamics of the manipulated object into the same multi-contact optimal control problem, and the contact timing is encoded by preset switching constraints; solve it repeatedly online in the finite time domain. In contrast to the 2023 ETH work, this article does not search for discrete contact orders.", "interface": "Given the gait/hand contact timing and operation target, MPC rolling optimizes body, foot, hand and object movements; low-level whole-body control tracks the optimization results.", "improvement": "", "experiment": "[real robot with four legs and arms] ANYmal with arms completes body/hand position tracking and door pushing and pulling with high resistance; RA-L 2021.", "limit": "Predefined contact modes and object models limit new scenarios; MPC real-time performance does not mean that unknown mechanisms, friction, and grab points can be automatically estimated.", "url": "https://arxiv.org/abs/2103.00946", "pdf": "papers/2103.00946_A_Unified_MPC_Framework_for_Whole-Body_Dynamic_Locomotion_and_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}], "group_en": "Model-control foundations", "platform_en": "Quadruped + arm"}, {"id": "2402.10329", "title": "Universal Manipulation Interface: In-The-Wild Robot Teaching Without In-The-Wild Robots", "label": "Original UMI", "year": "2024", "date": "2024-02", "group": "示范学习基础", "platform": "固定臂操作／数据接口", "problem": "It is expensive to collect data through task-by-task teleoperation on actual robots, and pure human videos are inconsistent with the robot action space.", "method": "Use a portable gripper to collect original environment demonstrations, equipped with wide-angle wrist perspective, posture tracking and action filtering; use relative trajectory and inference delay matching to reduce cross-body bias and train visual action strategies. UMI itself is a data/action interface system, not a quadruped whole-body controller.", "interface": "Demonstration of tool picking with a camera and gripper held by a person; estimating the relative trajectory of the hand and gripper movements from images and tracking, and providing the robot with similar camera observation and relative movement interfaces during deployment.", "improvement": "", "experiment": "[real robot] Perform dynamic, bimanual, fine and long-term operations on different robots and test unseen environments/objects; RSS 2024.", "limit": "By default, a robot that can track hand targets is deployed; foot support and body compensation are handled by subsequent UMI on Legs.", "url": "https://arxiv.org/abs/2402.10329", "pdf": "papers/2402.10329_Universal_Manipulation_Interface_In-The-Wild_Robot_Teaching_Without_In-The-Wild_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}], "group_en": "Imitation-learning foundations", "platform_en": "Fixed arm operation/data interface"}, {"id": "2303.04137", "title": "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion", "label": "Diffusion Policy", "year": "2023", "date": "2023-03", "group": "示范学习基础", "platform": "固定臂操作／动作生成", "problem": "The same observation in the demonstration data may correspond to multiple reasonable actions, and single-point regression easily gives inappropriate average actions.", "method": "Treat action trajectories as conditional diffusion generated variables, and use demonstration trajectories to train denoising networks; time series action prediction and rolling execution remain closed-loop. The paper compares convolution and Transformer denoising structures.", "interface": "Visual and ontology observation conditional multi-step action sequences; iteratively denoises the generated sequence during reasoning, executes the previous section and observes again.", "improvement": "", "experiment": "[Multi-task simulation + real robot operation] 15 types of operation benchmarks, including multi-modal action and visual feedback tasks; its summary improvement should retain the baseline and task caliber.", "limit": "The original paper does not include quadruped movement, foot contact and hand tracking control; the quality of motion generation and low-level execution capabilities must be measured separately.", "url": "https://arxiv.org/abs/2303.04137", "pdf": "papers/2303.04137_Diffusion_Policy_Visuomotor_Policy_Learning_via_Action_Diffusion.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Imitation-learning foundations", "platform_en": "Fixed arm operation/action generation"}, {"id": "2304.13705", "title": "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware", "label": "ACT / ALOHA", "year": "2023", "date": "2023-04", "group": "示范学习基础", "platform": "固定双臂操作", "problem": "The detailed operation of low-cost double arms will continue to accumulate due to single-step simulation errors, and pauses in the demonstration also make single-step supervision unstable.", "method": "ACT uses a conditional latent variable model to predict action blocks instead of single-step actions, and uses time integration to smooth the current action; the paper also provides low-cost, teleoperated dual-arm ALOHA hardware.", "interface": "Multi-camera and joint state input Transformer outputs the joint targets of both arms in the future; adjacent action blocks can be time-integrated during execution.", "improvement": "", "experiment": "[real robot] Six types of precise dual-arm tasks, including opening a condiment cup and inserting a battery; the article reports about 80–90% success rate in two tasks, which varies depending on the amount of training data for each task; RSS 2023.", "limit": "The original work has fixed arms; citing ACT alone does not mean that the chassis synchronous movement and contact stability have been solved.", "url": "https://arxiv.org/abs/2304.13705", "pdf": "papers/2304.13705_Learning_Fine-Grained_Bimanual_Manipulation_with_Low-Cost_Hardware.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Imitation-learning foundations", "platform_en": "Fixed arm operation"}, {"id": "2401.02117", "title": "Mobile ALOHA: Learning Bimanual Mobile Manipulation with Low-Cost Whole-Body Teleoperation", "label": "Mobile ALOHA", "year": "2024", "date": "2024-01", "group": "移动示范方法基础", "platform": "轮式双臂", "problem": "The fixed desktop demonstration cannot directly cover tasks that require simultaneous movement of the chassis and arms, such as opening cabinets, entering elevators, and carrying.", "method": "Install ALOHA dual-arm teleoperation on a mobile chassis and collect about 50 whole-body demonstrations per task; use static ALOHA data to collaboratively train mobile tasks and test whether fixed operation data can improve data efficiency.", "interface": "whole-body remote control adopts camera, arm status, and chassis motion; the imitation strategy jointly outputs the arm joints and chassis line/angular velocity.", "improvement": "", "experiment": "[Wheeled real robot] Opening double-door wall cabinets, putting pots in cabinets, using elevators and kitchen tasks; the success rate of collaborative training for some tasks has been significantly improved. The original text \"up to 90%\" is a relatively specific setting.", "limit": "The wheeled chassis does not have four-legged starting, leg lifting and foot contact switching; most of the later works of this library refer to it as a system/data background, and do not directly use its entire set of training.", "url": "https://arxiv.org/abs/2401.02117", "pdf": "papers/2401.02117_Mobile_ALOHA_Learning_Bimanual_Mobile_Manipulation_with_Low-Cost_Whole-Body_Teleoperation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Mobile demonstration foundations", "platform_en": "Wheeled Arms"}, {"id": "2204.01691", "title": "Do As I Can, Not As I Say: Grounding Language in Robotic Affordances", "label": "SayCan", "year": "2022", "date": "2022-04", "group": "视觉语言方法基础", "platform": "轮式移动机械臂", "problem": "The language model knows the step name, but does not know whether the robot can actually complete a step at this time.", "method": "Gradually calculate the combined score of \"linguistically reasonable\" and \"currently executable\" for each candidate skill, which is executed by the lower-level trained skills; it can be rescored after failure or status change. It is a skill selection interface and does not output continuous quadruped joint movements.", "interface": "Input user language commands and current candidate skills; the language model provides task relevance, the skill value function estimates feasibility, and selects skills for loop execution.", "improvement": "", "experiment": "[Real mobile robotic arm] Long-range home-style language commands, demonstrating the impact of feasibility scoring on task completion; CoRL 2022 Proceedings 2023.", "limit": "The coverage of the skills library determines the executable steps; most of the references in this library are only for language planning background, and WildLMa has not confirmed that it directly uses SayCan's scoring formula.", "url": "https://arxiv.org/abs/2204.01691", "pdf": "papers/2204.01691_Do_As_I_Can_Not_As_I_Say_Grounding_Language_in_Robotic_Affordances.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}], "group_en": "Vision-language foundations", "platform_en": "Wheeled mobile robotic arm"}, {"id": "2103.14127", "title": "Contact-GraspNet: Efficient 6-DoF Grasp Generation in Cluttered Scenes", "label": "Contact-GraspNet", "year": "2021", "date": "2021-03", "group": "视觉抓取方法基础", "platform": "通用机械臂", "problem": "In cluttered scenes, it is necessary to find effective six-degree-of-freedom capture poses directly from the depth map. Traditional candidate-by-candidate sampling and verification are slow.", "method": "Combines local contact position and grasping attitude prediction to densely generate and filter 6D grasping in point clouds; it gives candidate object contact poses and does not control the moving chassis.", "interface": "Input the scene depth point cloud and output multiple candidate gripper grasping poses and scores; downstream, the grasping compatible with the robot's accessibility is selected.", "improvement": "", "experiment": "[Grasping benchmark + real robot gripper] Comparing the quality and execution of grasping candidates in cluttered object scenes; ICRA 2021.", "limit": "Detecting good grasping does not mean that the four-legged body can be stably reached during movement; the chassis position and body posture must be planned separately.", "url": "https://arxiv.org/abs/2103.14127", "pdf": "papers/2103.14127_Contact-GraspNet_Efficient_6-DoF_Grasp_Generation_in_Cluttered_Scenes.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}], "group_en": "Visual grasping foundations", "platform_en": "Universal robotic arm"}, {"id": "2406.09246", "title": "OpenVLA: An Open-Source Vision-Language-Action Model", "label": "OpenVLA", "year": "2024", "date": "2024-06", "group": "VLA 模型基础", "platform": "固定臂操作／通用模型", "problem": "The operation strategy relies on the data of a single task/single robot, and the visual language model cannot directly output executable actions.", "method": "Use Open Action tokenization is a feature of its interface, which does not solve the problem of quadruped foot contact scheduling.", "interface": "Input images and language commands, and output the discretized robot action token; fine-tune it to adapt to different robotic arms.", "improvement": "", "experiment": "[Multi-robot real-machine operation] The original paper evaluates new instructions and adaptations across multiple control platforms; it is not a quadruped + arm contact experiment while walking.", "limit": "This library WholeBodyVLA mainly uses OpenVLA-OFT as the modified baseline; background references do not imply the adoption of the original OpenVLA architecture.", "url": "https://arxiv.org/abs/2406.09246", "pdf": "papers/2406.09246_OpenVLA_An_Open-Source_Vision-Language-Action_Model.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "VLA model foundations", "platform_en": "Fixed arm operation/general model"}, {"id": "2410.24164", "title": "π0: A Vision-Language-Action Flow Model for General Robot Control", "label": "π0", "year": "2024", "date": "2024-10", "group": "VLA 模型基础", "platform": "多形态机械臂／移动机械臂", "problem": "Cross-task robot strategies must simultaneously accept semantic instructions and continuous, high-dimensional, and possibly multimodal low-level actions.", "method": "Train continuous action experts next to the visual language backbone, use flow matching to predict action blocks, and use robot data to train/fine-tune cross-modal control.", "interface": "Image, language and ontology state conditional future continuous action blocks; the flow matching module generates actions instead of outputting joint commands token by token.", "improvement": "", "experiment": "[Multi-platform real robot operation] Including single-arm, double-arm and mobile robot arm tasks, the original report folds clothes and other cross-task operations; RSS 2025. Each success rate needs to be viewed by task, and generalizations cannot be made to four-legged abilities.", "limit": "Several 2026 whole-body VLAs in this library only use π0 as the model background; it is currently not confirmed that the weights or flow heads of the original paper are directly used.", "url": "https://arxiv.org/abs/2410.24164", "pdf": "papers/2410.24164_Pi0_A_Vision-Language-Action_Flow_Model_for_General_Robot_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "VLA model foundations", "platform_en": "Multi-shaped robotic arm/mobile robotic arm"}, {"id": "2103.00020", "title": "Learning Transferable Visual Models From Natural Language Supervision", "label": "CLIP", "year": "2021", "date": "2021-03", "group": "视觉语言方法基础", "platform": "通用视觉语言模型", "problem": "It is difficult for closed-label visual classifiers to find new objects/semantic regions based on free text.", "method": "Use a large number of image and text pairs for comparative learning to bring matching image and text vectors closer and separate non-matching samples; the downstream uses text to query visual content.", "interface": "Encode images and text separately, and associate the two with similarity in a common vector space; does not directly output contact poses, forces or joint movements.", "improvement": "", "experiment": "[Visual benchmark] Zero-sample image recognition, etc.; the original work does not have four-legged operation. ICML 2021.", "limit": "Semantic similarity does not equal grabability, reachability, or contact stability.", "url": "https://arxiv.org/abs/2103.00020", "pdf": "papers/2103.00020_Learning_Transferable_Visual_Models_From_Natural_Language_Supervision.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "titl
