<style>
:root{--ink:#182d36;--muted:#60727a;--line:#d8e2e5;--bg:#f5f8f8;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
main{max-width:1920px;margin:auto;padding:20px 24px 24px}
h1{font-size:25px;line-height:1.25;margin:0 0 5px;font-weight:650}
p{margin:5px 0}
.intro{max-width:1110px;color:var(--muted)}
.site-nav{display:flex;gap:22px;margin-bottom:14px;font-size:14px}
.site-nav a{text-decoration:none}.site-nav .current{color:var(--ink);font-weight:650}
.controls{display:flex;align-items:end;flex-wrap:wrap;gap:10px 12px;margin:17px 0 10px}
.field{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.field input,.field select{min-width:155px;height:35px;padding:5px 8px;border:1px solid #b9c9ce;border-radius:4px;background:#fff;color:var(--ink);font:14px system-ui}
.field.search input{width:min(300px,75vw)}
button{font:inherit;cursor:pointer}
.switch{height:35px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:0 7px;color:var(--ink)}
.switch input{accent-color:#2b6874}
.plain-button{height:35px;padding:5px 11px;background:#fff;border:1px solid #b9c9ce;border-radius:4px;color:var(--ink)}
.plain-button:hover,.plain-button:focus-visible{background:#edf5f6;border-color:#7ba2a9}
.status{display:flex;align-items:baseline;gap:12px;margin:0 0 8px;color:var(--muted);font-size:12px}
.graph-shell{position:relative;height:clamp(700px,80vh,980px);border:1px solid var(--line);background:#fff;overflow:hidden;touch-action:none}
svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}
.node{cursor:pointer}
.node rect{filter:drop-shadow(0 1px 2px rgba(22,53,63,.07))}
.node:hover rect,.node:focus-visible rect{stroke-width:2.5}
.node:focus-visible{outline:none}
.edge-hit{cursor:pointer}
.edge-hit:hover+path{stroke-width:3.4}
.map-tools{position:absolute;top:12px;right:12px;display:flex;gap:5px;background:rgba(255,255,255,.92);padding:5px;border:1px solid var(--line);border-radius:5px}
.map-tools button{height:30px;min-width:31px;padding:2px 7px;background:#fff;border:1px solid var(--line);border-radius:3px}
.map-tools button:hover{background:#edf5f6}
.legend{background:#fff;padding:8px 11px;border:1px solid var(--line);border-top:0;color:#4b626a;font-size:12px}
.legend div{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.legend div+div{margin-top:3px}
.swatch{width:24px;height:0;border-top:2px solid #336e79}
.swatch.compare{border-top:2px dashed #8b9fa8}
.swatch.lab{border-top:2px dotted #807894}
.swatch.survey{border-top:2px dotted #b3bec2}
.swatch.background{border-top:2px dashed #c2b79e}
.hint{margin:8px 0 0;color:var(--muted);font-size:12px}
footer{margin:15px 0 0;color:var(--muted);font-size:12px}
a{color:#245f78;text-underline-offset:2px}
a:hover{color:#113f54}
.drawer{position:fixed;z-index:30;right:0;top:0;bottom:0;width:min(460px,100vw);overflow-y:auto;background:#fff;border-left:1px solid #c7d6db;box-shadow:-12px 0 32px rgba(26,50,59,.17);transform:translateX(103%);transition:transform .19s ease;padding:20px 22px 25px}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drawer-kicker{font-size:12px;color:var(--accent,#446875);font-weight:650}
.close{height:32px;width:32px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:20px;line-height:1}
.drawer h2{font-size:21px;line-height:1.28;margin:13px 0 8px}
.drawer .meta{font-size:12px;color:var(--muted);margin-bottom:13px}
.drawer .links{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0 20px}
.drawer .links a{border:1px solid var(--line);border-radius:4px;padding:5px 8px;text-decoration:none;font-size:12px}
.drawer .links a:hover{background:#eef5f6}
.fact{margin:0 0 17px}
.fact h3{font-size:12px;color:#526773;margin:0 0 4px;font-weight:650}
.fact p{margin:0;font-size:14px}
.related-title{border-top:1px solid var(--line);padding-top:16px;margin-top:5px;font-size:14px}
.related-item{border-bottom:1px solid #e7edef;padding:9px 0}
.related-item:last-child{border-bottom:0}
.related-item button,.edge-endpoint{border:0;background:none;color:#245f78;text-align:left;padding:0;text-decoration:underline;text-underline-offset:2px}
.related-item small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.backdrop{display:none;position:fixed;z-index:25;inset:0;background:rgba(15,37,47,.31)}
.backdrop.open{display:block}
@media(min-width:801px){.backdrop{display:none!important}}
@media(max-width:800px){main{padding:15px}.graph-shell{height:70vh;min-height:520px}.drawer{width:min(460px,100vw)}}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

han the control trajectory.", "limit": "Long-distance movement in industrial tasks is still controlled by humans; the robot plans and performs operations offline only when it is near the target. Object dynamics are not included in the planning, and extreme forces may still exceed the range that feedback control can compensate for; the measured endurance threshold is about 21–22% lower than the model prediction, and the planning margin cannot be regarded as a safety guarantee under any actual disturbance.", "url": "https://doi.org/10.1007/s10514-023-10146-0", "pdf": "papers/2203.01446_RoLoMa_Robust_Loco-Manipulation_for_Quadruped_Robots_with_Arms.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}, {"id": "K11", "title": "Reserve disturbance margin before the disturbance"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2308.09179", "title": "Versatile Multi-Contact Planning and Control for Legged Loco-Manipulation", "label": "ETH Multi-Contact", "year": "2023", "date": "2023-08", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "When opening a resilient door, you don’t just have to plan your arms; you also have to decide where to stand, whether to hold it with your hands or feet, and when to release.", "method": "Search the contact state tree for candidate contact switches, using short-term trajectory optimization to check geometric and dynamic feasibility for each expansion; alternating target direction with random direction expansion. After finding the contact sequence, fix it and re-optimize the entire continuous motion.", "interface": "Input: The geometry and dynamics model of the robot and the object, the parts that allow contact, the initial state and ous type of planning are feasible, but when the object parameters are inaccurate, the hand slips, or the robot is pushed, the execution of the original plan is likely to fail.", "method": "When the tracking deviation is large, the speed of demonstration progress will be automatically reduced, allowing the strategy to catch up first; the strategy will also output the progress residuals, and go back and catch up again if necessary. Training changes friction, door spring parameters, etc. to enable tracking targets for bodies, objects, and grasp relationships according to the current contact pattern.", "interface": "Input: the current status of the robot and the object, the deviation from the demonstration, the position and speed of the grasping end, and the current action progress. The training also requires a planning demonstration for each task. Output: Full body joint angle targets, and adjustments to the demonstration progress; this can be slowed down, sped up, or regressed to previous stages.", "improvement": "Clearly inherit the demonstration generation method of Multi-Contact, and add feedback execution after being disturbed; learn to re-grasp the handle and slip recovery that are not included in the demonstration.", "experiment": "Four door/dishwasher tasks, 4096 simulation tests each, comparing fixed clock, nearest reference search, adaptive progress and ablation. The success rate of the fixed clock and complete method for the sliding door task is 15.38%/96.33%, which is defined as the completion of the demonstration progress exceeding 95%; the main gain comes from adaptive propulsion, and the average gain of the progress residual is small. The ANYmal real robot completed six consecutive tests for each task.", "limit": "Obtain the object status through motion capture, etc. during deployment. Recovery mainly revolves around given demonstrations; replanning will still be required when a complete set of contact plans needs to be changed. Appendix D.1 regards the ms the feedback torque.", "improvement": "Compared with the learning controller that only outputs joint angles, it retains explicit force calculation; compared with pure model control, it increases the adaptability to disturbances and model errors. It cannot be simplified to the network directly adding a set of moments.", "experiment": "The Go2 real robot uses its front legs to push the shopping cart, keep the pallet balanced, and hold soft objects, including three-legged support walking and rear two-legged walking; the simulation comparison has settings such as no feedforward and different residual channels. Force target training applies a reverse virtual external force and mainly quantifies the end position error. The table cannot be directly used as the force tracking error of the wrist force sensor.", "limit": "Still requires model and online solver; drift of own state estimate will affect accuracy. High-level tasks and force targets are provided externally. Reducing the PD gain of the operating leg produces a compliant interaction but has no general contact safety demonstrated.", "url": "https://arxiv.org/abs/2504.06662", "pdf": "papers/2504.06662_RAMBO_RL-Augmented_Model-Based_Whole-Body_Control_for_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Model-based planning / control", "platform_en": "Four legs/armless"}, {"id": "2507.22042", "title": "A Nonlinear MPC Framework for Loco-Manipulation of Quadrupedal Robots with Non-Negligible Manipulator Dynamics", "label": "Arm-dynamics NMPC", "year": "2025", "date": "2025-07", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "When the small robot dog carries a heavier arm on its back, treating the arm as a fixed additional weight will miss the impact of arm movement on the body's balance.", "method": "Separate the single rigid body model of the body from the floating manipulator model to maintain dynamic consistency with mounting point rigid constraints and interactive forces/moments; while optimizing body motion, plantar force and arm moment. The actual solution is to freeze the arm inertia in each prediction time domain, ignore the Coriolis term of the arm, and update the inertia every cycle, and there is still a calculation approximation.", "interface": "Input: body and arm status, model, contact conditions, as well as body speed, orientation and arm joint targets given by the operator. Output: The planning layer outputs future body motion and robotic arm torque; the lower-layer controller of the leg converts the body motion plan into leg torque, and the arm torque is directly executed.", "improvement": "Compared with the center of mass dynamics + complete kinematics planning, the arm joint dynamics is further predicted and the arm moment is directly optimized; the comparison also changes the arm moment optimization/PD tracking method, and all benefits cannot be attributed to a single inertia term. Visual or verbal action selection was not studied.", "experiment": "Go2 about 15 kg, Kinova arm about 4.4 kg; planning about 60 Hz, leg control about 500 Hz. The real robot verified the load, disturbance, terrain, and remote operations such as opening/drawing doors; the simulation stable pass rate of walking 10 meters in 200 random terrains was 86%/28%, which is the stability of movement and the success rate of non-operational tasks.", "limit": "Requires torque interface, accurate model and real-time solution; real robot planning uses an external computer and cannot be directly used as a lightweight off-the-shelf controller.", "url": "https://arxiv.org/abs/2507.22042", "pdf": "papers/2507.22042_A_Nonlinear_MPC_Framework_for_Loco-Manipulation_of_Quadrupedal_Robots_with_Non-Negligible_Manipulator_Dynamics.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2603.02443", "title": "Safe Whole-Body Loco-Manipulation via Combined Model and Learning-based Control", "label": "Safe Whole-Body Loco-Manipul", "year": "2026", "date": "2026-03", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "When a person pushes or pulls the gripper, he or she must not only move along the force but also avoid the body or arm from entering an impermissible state.", "method": "Use the set stiffness and damping to convert the measured external force into terminal velocity, and deduct the body motion to calculate the arm speed; refer to the manager to adjust targets that may violate the boundaries of position, velocity, force, and kinematics, and use state estimation to improve body velocity feedback.", "interface": "Input: wrist force and moment measurements, robot state, estimated body speed, allowed motion constraints. Output: First convert the external force into terminal movement speed, and then distribute it to the arm and body; the arm is controlled by the model, and the joint angle of the leg is output by the learning controller.", "improvement": "Compared with the controller that only learns target tracking, clear force response and reference constraint processing are added; the model module is also put into the leg strategy training process.", "experiment": "Go2＋ six-degree-of-freedom arm and six-dimensional force sensor on the wrist, simulation and real robot verify the force interaction such as joint transportation between humans and robots.", "limit": "Requires a wrist force sensor, which is different from the current platform conditions without force sensors. The safety set is implemented using discrete sampling, axis-wise calculations and nearest neighbor queries; the experiment supports reference filtering under specified models/constraints and cannot be extrapolated to arbitrary collision safety guarantees for a complete quadruped contact system.", "url": "https://arxiv.org/abs/2603.02443", "pdf": "papers/2603.02443_Safe_Whole-Body_Loco-Manipulation_via_Combined_Model_and_Learning-based_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2604.08508", "title": "Sumo: Dynamic and Generalizable Whole-Body Loco-Manipulation", "label": "Sumo", "year": "2026", "date": "2026-04", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "When heavy objects cannot be lifted, they have to be pushed, dragged or turned over; the cost of retraining the complete task strategy every time a different object is changed is very high.", "method": "During runtime, multiple sets of candidate commands are tried in the simulation, and each set is predicted by the low-level controller; select the plan with good scores, execute it for a short period and then recalculate.", "interface": "Inputs: robot and object state estimates, object models, task scoring rules, such as how far the tires are from upright. Output: short-term body speed, arm joint target and other commands; the existing low-level controller converts these commands into whole-body joint targets.", "improvement": "Compared with searching all joint movements directly, the search range is smaller and the body is easier to stabilize; compared with individual training for each task, only the object model or scoring rules need to be changed during runtime.", "experiment": "Spot eight tasks for the real robot ten times each, including righting/stacking heavy tires, towing fences, etc.; using the existing ReLIC controller, some tasks rely on foot and body contact. The G1 humanoid mission is only verified in simulation; the generic three costs in the comparison are for controlled simulation, and the full real-life mission has mission-specific costs.", "limit": "The real robot relies on external motion capture and off-machine calculation; it requires object model, online simulation and scoring rules. The grasp/approach position in object coordinates is still given by the task setting; the focus of the paper is on upper-level planning, and the low-level controller is not its new contribution.", "url": "https://arxiv.org/abs/2604.08508", "pdf": "papers/2604.08508_Sumo_Dynamic_and_Generalizable_Whole-Body_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2608.12063", "title": "Learning Loco-Manipulation From SMPC Demonstrations With Sparse Offline-to-Online RL", "label": "Learning Loco-Manipulation F", "year": "2026", "date": "2026-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Only rewards are given when the task is completed. It is difficult for the robot to succeed in random exercises; it is time-consuming to manually design many intermediate rewards.", "method": "Automatically generates experience with sampling MPC. About half of the batch data for early TD3 training comes from the planner; after reaching the success rate threshold, the old data is gradually removed, and sparse task rewards are used to continue learning. Actions are expressed in command increments, and the evaluation network output is limited to the theoretical reward range; the data planner still uses dense costs that need to be adjusted.", "interface": "Input: Noisy robot and object states and mission goals; the real robot combines onboard sensing and external motion capture to obtain the state. During training, the simulation planner is first used to generate successful experience. Output: The upper layer outputs the changes in body speed and arm joint targets; there are already low-level strategies to generate whole-body joint angles. Spot experiments require no additional adjustments for body height and pitch.", "improvement": "Compared with pure imitation planners, subsequent learning can find faster actions and surpass the teacher; compared with learning from scratch, it reduces the difficulty of finding the first success.", "experiment": "Spot pushing boxes, tire centering/rolling, and G1 pushing boxes are all demonstrated on real robots; completion time, data volume/quality, and multi-modal demonstration ablation are mainly quantified in simulations. Spot inference is off-machine, and G1 inference is on-board; both use external motion capture to assist state estimation.", "limit": "Requires mission simulation, success data, and state estimation. The frozen low-level controller cannot continue to adapt to new tasks; the improvements in demonstration guidance are mainly around data coverage. The failure of multi-modal data training for a certain tire task only indicates the compatibility issue between the data and the TD3 settings, and cannot be generalized to the general ineffectiveness of multi-modal demonstrations.", "url": "https://arxiv.org/abs/2608.12063", "pdf": "papers/2608.12063_Learning_Loco-Manipulation_From_SMPC_Demonstrations_With_Sparse_Offline-to-Online_RL.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K18", "title": "Demonstration tracking, progress adaptation, and task optimization"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2608.28140", "title": "Contact-Guided Exploration for Non-Prehensile Locomanipulation with Multi-Critic RL", "label": "Contact-Guided Exploration f", "year": "2026", "date": "2026-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When pushing a chair, if you never reach the right position, you will receive almost no useful rewards for learning; always being rewarded close to a certain point will prevent you from actually moving the chair.", "method": "Use three value estimation heads to evaluate task completion, proximity to contact points, and action standardization, and then combine the advantages of each group according to weight to update the action strategy. The contact exploration weight decreases from 0.1 to 0.01 per training iteration, and the action specification weight increases from 0.15 to 0.24; it is not an online switch triggered every time an object is encountered.", "interface": "Input: joint status of the body and arms, gravity direction, body speed, as well as object position, orientation and error to the target. Contact candidate points and object velocity are additional information for training the evaluation network. Output: The upper layer outputs the arm joint angle, body height and body speed; the fixed walking strategy outputs the leg joint angle.", "improvement": "Compared with the fixed sum of all rewards, it can transition from \"finding contact first\" to \"doing the task well\"; compared with Guided RL, it does not require a complete action demonstration, but requires contact prompts.", "experiment": "Simulation of pushing boxes and moving chairs to compare single-value network/multi-value network with and without weight scheduling; the main comparison uses contact guidance rewards. The four unseen IKEA objects on the real robot totaled 40/58 successes (about 69%), two of which were a handful of edge cases. There is also a contact switching analysis of the dishwasher door.", "limit": "Real object poses are measured by an external motion capture system; training relies on object geometry and contact candidates. The simulation success rate of moving a chair is about 94%, which cannot be regarded as the result of a real robot; there is no clear real robot verification record for the contact switching part of the dishwasher.", "url": "https://arxiv.org/abs/2608.28140", "pdf": "papers/2608.28140_Contact-Guided_Exploration_for_Non-Prehensile_Locomanipulation_with_Multi-Critic_RL.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2210.10044", "title": "Deep Whole-Body Control: Learning a Unified Policy for Manipulation and Locomotion", "label": "Deep WBC", "year": "2022", "date": "2022-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When the legs and arms are controlled separately, the arms cannot reach the target on the ground, and the body does not know where to squat or lean to help.", "method": "Jointly train the legs and arms in the simulation; initially use the operational advantage mainly for arm movements, the movement advantage mainly for leg movements, and then gradually mix in cross effects. The history network fits the environment encoding, and the environment encoding is also constrained to a historically predictable representation, reducing the gap between privileged information during training and deployment observations.", "interface": "Input: body posture and angular velocity, joint status of legs and arms, foot contact information, previous movement, desired body speed and end position/orientation. Output: Joint angle targets for the legs and arms; the underlying controller for each joint then converts the angle error into a torque.", "improvement": "Compared with the non-communicative leg-arm strategy, the body will actively help expand the reachable range of the terminal; at the same time, the adaptation of high-dimensional joint training and simulation to real robots was studied.", "experiment": "Low-cost Go1+ arm, demonstrates whiteboard wiping, picking and placing, button pressing and throwing; targets can come from remote control, visual module or demonstration playback.", "limit": "The core solves the execution of a given command; demonstrating tasks does not mean that the same strategy can understand and plan these tasks on its own. The sampling reference system does not change with the height, roll and pitch of the body, but still changes with the horizontal position and orientation of the body, and cannot be equated to a completely fixed world coordinate target.", "url": "https://arxiv.org/abs/2210.10044", "pdf": "papers/2210.10044_Deep_Whole-Body_Control_Learning_a_Unified_Policy_for_Manipulation_and_Locomotion.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2403.17367", "title": "RoboDuet: Learning a Cooperative Policy for Whole-body Legged Loco-Manipulation", "label": "RoboDuet", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The precise end pose tracking of the joint strategy is still difficult; and we hope to retain the walking ability that we have already practiced.", "method": "First train stable walking, and then activate the arm and operation target to allow the two strategies to cooperate. The arms not only take care of their own joints, but also ask the body to change posture.", "interface": "Input: expected body speed, end position and orientation, body and joint status, recent actions; the two strategies share necessary status. Output: The arm strategy outputs the arm joint angle and the desired body pitch/roll; the leg strategy executes the body speed and posture and outputs the leg joint angle.", "improvement": "Compared with completely independent leg and arm control, a posture collaboration interface is clearly established; compared with Deep WBC, a division of labor structure is adopted to focus on expanding the six-dimensional end posture tracking range.", "experiment": "Compare tracking, workspace and task performance between simulation and real robot, and test migration between similar Go1/Go2 platforms.", "limit": "The main input is still the movement and terminal commands given externally; migration across similar hardware does not mean across any robot or task. The two-stage training in ablation mainly improves the anti-interference survival rate, and the cooperative division of labor mainly improves posture tracking. The benefits of the two components cannot be mixed into one.", "url": "https://arxiv.org/abs/2403.17367", "pdf": "papers/2403.17367_RoboDuet_Learning_a_Cooperative_Policy_for_Whole-body_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K46", "title": "One task, multiple locomotion behaviors"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2407.10353", "title": "UMI on Legs: Making Manipulation Policies Mobile with Manipulation-Centric Whole-body Controllers", "label": "UMI on Legs", "year": "2024", "date": "2024-07", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "Using a real robot dog to collect demonstrations is expensive and dangerous; it is also difficult to directly apply the operating actions learned on a fixed arm to a moving body.", "method": "A person holds a hand-held gripper collection demonstration to train the image-to-trajectory strategy; in addition, only the whole body tracking trajectory is practiced in the simulation. The trajectory is expressed in task coordinates that do not sway with the body, and the lower layer can see the subsequent actions in advance.", "interface": "Input: The upper layer looks at the wrist image; the lower layer looks at the body and joint status, as well as a short segment of the future end-effector trajectory predicted by the upper layer. Output: The upper layer outputs the future position, orientation, and opening and closing of the gripper; the lower layer outputs the joint angle targets of the legs and arms.", "improvement": "Compared with giving the end target in body coordinates moment by moment, the interference of body motion on the task trajectory is reduced; the operation demonstration does not need to include leg movements, nor does it need to be collected by the robot.", "experiment": "Real cup rearrangement, kettlebell press, and pitching, 20 times per main condition; pitching starts in pre-catch state with manually placed ball. The simulation removes the preview, task coordinates and real operation trajectory respectively; the Deep WBC style baseline in this article is constructed by removing these three components simultaneously. The cup-operating strategy of the original fixed arm is deployed directly onto the quadruped.", "limit": "The upper layer gives the trajectory without explicitly receiving the ability feedback from the lower layer; problems will still occur when the future goal exceeds the physical ability. The appendix reports approximately 140 ms of iPhone pose latency, the need to correct arm inertia, and joint overheating. Successful pushing does not equate to precise modulation of contact force; its low-level training does not involve object or force tracking tasks.", "url": "https://arxiv.org/abs/2407.10353", "pdf": "papers/2407.10353_UMI_on_Legs_Making_Manipulation_Policies_Mobile_with_Manipulation-Centric_Whole-body_Controllers.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2507.08656", "title": "Multi-critic Learning for Whole-body End-effector Twist Tracking", "label": "Multi-critic Learning for Wh", "year": "2025", "date": "2025-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Only a series of end positions are given, and the movement speed cannot be directly required. When walking, you want your body to be stable, and when you reach out, you may need to lean. The two training goals conflict.", "method": "An action network controls the whole body. Walking, operation and foot contact timings each have valuable estimation networks; the advantages of each group are normalized and then summed to update the same policy. The training mixes local and global reference trajectories, and the goal is not to only reach the end point at the last moment.", "interface": "Input: body movement command, terminal end pose and linear speed/rotation speed, foot lift height, and recent robot status. Output: The correction amount relative to the current leg and arm joint angles is truncated and handed over to the underlying joint controller for execution.", "improvement": "Compared with controllers that only track posture, clear speed requirements are added; compared with mixing rewards together, grouped evaluation makes target conflicts and parameter adjustment easier to handle.", "experiment": "ANYmal D＋Dynaarm real robot tracks multi-speed straight lines, circles and semicircles, records position and speed errors; simulates and compares different leg strategies and full body controllers. Portela [8] in the standing comparison is a terminal posture tracking paper in 2025, which is not the same as the force control paper in 2024; part of the comparison reuses the arm movements of this article and then replaces the leg strategy.", "limit": "Paper only covers moderately rough ground; extreme reach still sometimes triggers shoulder protection. Mission trajectories are provided externally.", "url": "https://arxiv.org/abs/2507.08656", "pdf": "papers/2507.08656_Multi-critic_Learning_for_Whole-body_End-effector_Twist_Tracking.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2508.10538", "title": "MLM: Learning Multi-task Loco-Manipulation Whole-Body Control for Quadruped Robot with Arm", "label": "MLM", "year": "2025", "date": "2025-08", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The controller is trained well on a certain type of trajectory, but the operation becomes worse when the space range is changed; the future trajectory cannot be obtained during remote control.", "method": "Establish a real trajectory library and adjust the sampling difficulty according to the learning situation of each task; use trajectory history to predict future targets, use own state history to estimate body speed, and then train whole-body tracking.", "interface": "Input: recent status of the body and arms, last action, end-effector trajectory history; future trajectories can also be directly input during automatic operation. Output: Angle corrections for twelve leg joints and six arm joints.", "improvement": "Compared with the trajectory interface of UMI on Legs, it further handles the training balance between multiple types of trajectories, as well as the remote control situation where future trajectories are lacking.", "experiment": "Go2＋AIRBOT real robot demonstrates the operation driven by remote control and image diffusion strategy; trajectory sampling, prediction network and error comparison are mainly completed in simulation. The DeepWBC-style baseline in this article simultaneously removes future trajectory prediction, trajectory input, and task coordinate systems. The difference cannot be attributed solely to the network structure.", "limit": "\"Multi-tasking\" here mainly refers to the same executor tracking multiple operation trajectories; it does not mean learning any language task.", "url": "https://arxiv.org/abs/2508.10538", "pdf": "papers/2508.10538_MLM_Learning_Multi-task_Loco-Manipulation_Whole-Body_Control_for_Quadruped_Robot_with_Arm.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2405.01402", "title": "Learning Force Control for Legged Manipulation", "label": "Force Control", "year": "2024", "date": "2024-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Reinforcement learning robots can push things, but they usually just happen to use enough force and cannot be explicitly asked to \"maintain a certain force.\"", "method": "Use virtual springs/dampers to generate contact forces in simulation, calculate force tracking rewards with real simulation forces, and supervise a network that estimates external forces from its own state history. Position and force modes are alternately trained; position error and speed feedback are used to generate force commands during deployment to achieve adjustable and compliant interaction.", "interface": "Input: recent body and joint status, action history, and desired movement/end target or force application command; do not enter measured wrist force. Output: joint angle targets of the legs and arms; at the same time, the external force of the clamping jaw and other states are estimated for control use.", "improvement": "Compared with training by position only, it clearly learns force tracking and supports the body to automatically cooperate when pushing and pulling the gripper; position mode and force mode can be switched during training.", "experiment": "B1＋Z1 The real robot measures the force at five end positions, with an error of about 5–10 N; demonstrating compliant teaching, pulling objects, and moving operations. The controller explicitly receives body speed commands, including walking ability, and is not just a force control to fix the chassis.", "limit": "The estimation error may be larger than the control error, and the authors point out that the strategy may not rely strongly on estimated force feedback. A position error of approximately 5 cm and a force error of approximately 5 N are not sufficient to demonstrate fine buttoning or docking capabilities. The separate position/force mode is also an area for improvement in subsequent Unified.", "url": "https://arxiv.org/abs/2405.01402", "pdf": "papers/2405.01402_Learning_Force_Control_for_Legged_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2505.20829", "title": "Learning a Unified Policy for Position and Force Control in Legged Loco-Manipulation", "label": "Position + Force RL", "year": "2025", "date": "2025-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Contact operations cannot only pursue position or force; the operation strategy also needs to know whether it has been touched, pushed or blocked.", "method": "In the simulation, the position, force command and external disturbance are changed simultaneously, and the net force is converted into target displacement compensation based on the quasi-static impedance relationship, and then the controller is rewarded for tracking the compensated target. The estimated force is recorded during teaching and used together with visual/motor information for subsequent operational learning.", "interface": "Input: body and joint history, movements, gait timing, and body speed, end position, end/body force commands; does not rely on measured wrist force. Output: Whole-body joint angle targets, and estimates of external forces, end positions, and body velocities. Another imitation learning module uses estimated force to generate manipulative actions.", "improvement": "Clarify the position/force separation control limits for Force Control; further allow force information to enter operational learning, not just for underlying response.", "experiment": "B2+Z1 Four tasks: erasing the whiteboard, opening/closing the push-type cabinet door, and blocking the pull-down drawer, each set up 50 times, and compared the operation learning with force information and the position baseline. The G1 humanoid experiment only verifies body force interaction and movement, and does not include these four arm operation tasks.", "limit": "Control derivation omits terminal inertia and damping, suitable for slower operations; fine force estimation remains limited. The operational baseline removes force observations and force actions at the same time, so the approximately 39.5% success rate improvement supports the entire force information scheme and cannot be attributed to the force estimator alone; the task contact plan is still given by the upper layer.", "url": "https://arxiv.org/abs/2505.20829", "pdf": "papers/2505.20829_Learning_a_Unified_Policy_for_Position_and_Force_Control_in_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2604.27224", "title": "Learning Tactile-Aware Quadrupedal Loco-Manipulation Policies", "label": "Learning Tactile-Aware Quadr", "year": "2026", "date": "2026-04", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "It is not clear visually whether the clamping is stable, whether it has been inserted or the clamping is too tight; simply copying the path of the clamping jaw is prone to damage or operation failure.", "method": "Collect demonstrations using a tactile hand-held gripper to train the upper layer to simultaneously predict movement and contact changes; the lower layer first practices stable walking, and then practices matching these goals in the contact task simulation.", "interface": "Input: The upper layer looks at the image, gripper posture/opening and tactile history; the lower layer looks at the robot status, tactile feedback and desired movement and tactile targets. Output: The upper layer predicts the end-effector trajectory, gripper opening, and contact area/direction/center of mass targets. The first stage arm tracking uses inverse kinematics; the deployed low-level strategy outputs leg and arm joint targets, downsampled to 50 Hz and 10 Hz execution respectively.", "improvement": "Compared with UMI on Legs, which only transmits the track, the \"expected contact\" is also transmitted to the execution layer; at the same time, it is different from the approach of only connecting the touch to the upper layer.", "experiment": "Reorientation and insertion of real objects, tightening valves, and gentle grasping, 20 times per task. The controls added tactile observation, tactile prediction and low-level tactile tracking respectively; the three tactile versions of the potato chip task were all 100% successful and cannot be relied upon to alone prove that low-level tactile targets are necessary.", "limit": "The forward/lateral body speed is set to zero during the fine contact phase, and the operation is supported by posture adjustment. Fine contact in continuous strides has not been verified. Most position curves take the arm base as the origin, regardless of the displacement caused by body tilt; fruit damage lacks quantitative measurement with instruments, and the quantitative gentle grasping results are for potato chips.", "url": "https://arxiv.org/abs/2604.27224", "pdf": "papers/2604.27224_Learning_Tactile-Aware_Quadrupedal_Loco-Manipulation_Policies.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}, {"id": "K39", "title": "Tactile feedback, grip force, and contact release"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2607.10132", "title": "TAC-LOCO: Unified Whole-Body Control for Quadrupedal TACtile-Informed LOCO-Manipulation", "label": "TAC-LOCO", "year": "2026", "date": "2026-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When an object in your hand is pulled by an external force, clamping it too tightly will damage the object; clamping it too loosely will cause it to slip. The sudden removal of external loads can also disrupt the body.", "method": "Compress each tactile point into a small number of contact features; randomly change the object load in the simulation, including sudden release, to reward stable grip and no excessive force.", "interface": "Inputs: body and joint states, motion history, body velocity and terminal trajectory commands, and two-finger tactile array measurements. Output: The same strategy outputs the joint angle targets of the legs, arms and grippers, and adjusts the clamping degree online.", "improvement": "Compared with estimating force indirectly from its own state and directly reading the internal contact of the gripper; compared with higher-level tactile systems, the focus is on the same controller to coordinate dynamic grasping and body movement.", "experiment": "Go2＋WidowX and tactile grippers, the real robot uses springs and magnets to create load changes/sudden releases, and the dynamic movement operation is successful 9/10 times. About 47% of the clamping force reduction comes from simulation reward ablation; the drop rate of less than 1% also comes from large-scale simulation and cannot be regarded as real robot statistics.", "limit": "Starts from a state where the object has been grasped, and does not involve autonomous object finding, initial grasping or task planning. Frame-by-frame normalized haptics preserve relative contact patterns, from which absolute grip force thresholds cannot be guaranteed. The real robot baseline also uses a fixed gripper and no haptics, so the difference in success rate cannot be attributed to tactile input alone.", "url": "https://arxiv.org/abs/2607.10132", "pdf": "papers/2607.10132_TAC-LOCO_Unified_Whole-Body_Control_for_Quadrupedal_TACtile-Informed_LOCO-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K39", "title": "Tactile feedback, grip force, and contact release"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2609.03889", "title": "FWBC-VLA: Force-Aware Whole-Body Compensation for Contact-Rich Loco-Manipulation (wheel-foot adjacency)", "label": "FWBC-VLA", "year": "2026", "date": "2026-09", "group": "VLA 动作模型", "platform": "轮足", "problem": "It is difficult for the visual language action model to know whether the hand is blocked; the bottom layer stabilizes the body, and it may not know what contact impact to offset.", "method": "Two free-motion torque predictors use history and current state respectively; history is less noisy but may absorb continuous contact, state branch is more preserving load change, and the residual is mixed by gate. The strength/change of the six-joint residuals is encoded into force tokens and input to the motion expert; the residuals are subjected to damped Jacobian inverse and moment arm transformation to form body load cues for limiting/low-pass speed compensation.", "interface": "M20S wheel base + CM1 arm. Input image, language, body state and 200 Hz measured arm joint torque; π0.5 motion expert generates operation/base instructions, and the faster small residual network also corrects the base speed. No wrist force sensor still requires actual joint torque measurement.", "improvement": "Connect force-related cues to slower VLA action generation and faster body feedback respectively; force estimation, action conditioning, and body compensation are three separable changes. Attention is feature conditioning, not Bayesian external force estimation.", "experiment": "More than 5,000 demonstrations; the real robot wiped the whiteboard and opened the door with a door closer 25 times each, with a final score of 64%/52% and a F/T comparison of 60%/48%, each missing only one success. It is known that the 0.36/0.72 kg load mainly verifies the magnitude of gravity and cannot replace any six-dimensional contact force calibration.", "limit": "The torque residual also contains friction, model and execution errors, and there is no proof of closed-loop passivity/stability. The task and ablation numbers in the main text are inconsistent with some tables, and references must indicate the table location; sensorless results cannot be generalized to be more accurate than F/T.", "url": "https://arxiv.org/abs/2609.03889", "pdf": "papers/2609.03889_FWBC-VLA_Force-Aware_Whole-Body_Compensation_for_Contact-Rich_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}], "group_en": "VLA action model", "platform_en": "Wheeled-legged"}, {"id": "2609.13779", "title": "Force-Aware Reinforcement Learning with Hybrid Sensorless Force Estimation for Wheeled-Legged Loco-Manipulation (wheel-foot adjacency)", "label": "Force-Aware Reinforcement Le", "year": "2026", "date": "2026-09", "group": "RL／全身执行", "platform": "轮足", "problem": "The torque changes caused by robot movement are mixed with ground support, hand contact and model errors. If it is directly regarded as an external force on the hand, the control will be wrong.", "method": "First use dynamics to estimate the total disturbance, and then use the support contact constraints to separate the end force. The network corrects the remaining time-varying errors; the learning strategy selects the tracking position or force according to the direction.", "interface": "Inputs: joint and body states, joint moment commands, model and support contact conditions; the controller also receives position/force targets and control selections for each direction. Output: estimate the end force; the strategy outputs the joint angles of the legs and arms, and the wheel speed.", "improvement": "Compared with guessing the force completely from the historical network, physical decomposition is added; compared with only force estimation, continue to verify how the estimation can improve the whole body contact control.", "experiment": "Simulations compare unconstrained decomposition, contact constrained decomposition, individual timing networks, and combined estimators on the same trajectory, and compare force errors and actual displacements for box dragging. The wheel's real robot turns the valve and wipes using the F/T sensor that is only used for evaluation as a quantitative reference. The door opening and human drag guidance provide behavioral verification of the entire system.", "limit": "Support forces, end forces, and model errors can be conflated; constraint decomposition provides physically consistent estimates and does not guarantee unique recovery. The ±20% inertia bias is also included in the training data of the estimation network and cannot be called unseen inertia generalization; controlling the endless force sensing input still relies on torque-related information.", "url": "https://arxiv.org/abs/2609.13779", "pdf": "papers/2609.13779_Force-Aware_Reinforcement_Learning_with_Hybrid_Sensorless_Force_Estimation_for_Wheeled-Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K07", "title": "Position accuracy, contact maintenance, and force accuracy"}, {"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}], "group_en": "RL / whole-body execution", "platform_en": "Wheeled-legged"}, {"id": "2403.16967", "title": "Visual Whole-Body Control for Legged Loco-Manipulation", "label": "Visual WBC", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The controller given an end target does not find the object on its own, nor does it decide whether to move closer or tilt to grab it.", "method": "First use the object shape/posture teacher to train the grasp, and then use Dagger to bring the double-segmented depth student to its actual access state for correction. The leg strategy looks at the arm status and end target, and the arm uses Jacobian inverse kinematics; the target reference system changes with the body's horizontal position and yaw, but the height and roll/pitch are fixed, so that the lifting and lowering of the body can expand the operable space.", "interface": "Input: The upper layer looks at the segmented depth map and its own status; the lower layer receives the body speed, end attitude target and robot status. Output: The upper layer gives the body speed and end target; the lower layer learning strategy outputs the leg joint angle, and the arm joint angle is obtained by geometric solution.", "improvement": "Compared with only executing remote control commands, autonomous visual action selection is added; compared with Deep WBC's full-joint joint learning, the arm uses geometric solution to improve accurate posture tracking.", "experiment": "real robot 14 objects × 3 height × 5 resets, each round allows five consecutive attempts, so it is not a one-shot success rate. Appendix E Walking position error 0.029 m versus Deep WBC 0.414 m comes from simulation, not real robot contact accuracy.", "limit": "The real robot manually clicks on the target at the beginning of each round, and at least one camera needs to see the target; the segmentation depth loses a lot of color semantics. The training requires the base to stop when the grasp is closed; the partially fixed reference system is not a complete world fixed contact control, nor does it provide a safety guarantee for the contact force during step changes.", "url": "https://arxiv.org/abs/2403.16967", "pdf": "papers/2403.16967_Visual_Whole-Body_Control_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2411.06782", "title": "QuadWBG: Generalizable Quadrupedal Whole-Body Grasping", "label": "QuadWBG", "year": "2024", "date": "2024-11", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The camera has seen the object and calculated the grabbing point, but the current position of the robot may not be accessible or the orientation may be inappropriate.", "method": "Calculate offline which body positions are reachable and which are better under different arm targets; train the upper layer to move towards a better position, and then use the existing grasp solution and underlying strategy execution.", "interface": "Input: Candidate grabbing poses obtained by the camera, self-state, and pre-computed reachability information; the lower layer receives body plane speed, height and pitch commands. Output: The upper layer selects the body movement/posture command, and the arm executes the grabbing posture; the walking strategy outputs the leg joint movements.", "improvement": "Compared with Visual WBC, it learns actions directly from images and explicitly adds the relationship between grasping posture and body reach, which reduces the learning burden and expands the grasping height range.", "experiment": "For capturing multiple types of objects such as real-machine transparency, the author reports a capture accuracy of 89%; compare the differences caused by the presence or absence of accessible information.", "limit": "System comparison also includes perception and execution differences. Reaching the grabber position does not mean that the entire cabinet door contact trajectory is feasible; no proof of contact force safety during continuous step changes is provided.", "url": "https://arxiv.org/abs/2411.06782", "pdf": "papers/2411.06782_QuadWBG_Generalizable_Quadrupedal_Whole-Body_Grasping.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}, {"id": "K23", "title": "Choose navigation goals that permit manipulation"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2411.15131", "title": "WildLMa: Long Horizon Loco-Manipulation in the Wild", "label": "WildLMa", "year": "2024", "date": "2024-11", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "A single capture cannot solve multi-step tasks such as cleaning corridors, operating cabinets, and placing items, and it is difficult to cover real environmental changes.", "method": "Explicitly reuse VBC whole-body low-level collection VR demonstration, and train ACT separately for each skill; add CLIP text/pixel cosine correlation map to provide target positioning. At the end of the demonstration, the supervision skill is terminated, and the deployment ends after ten consecutive termination predictions exceed 0.8; LLM calls the skill through manual navigation waypoint/connectivity relationship.", "interface": "Input: language tasks, head/wrist images, robot status; whole-body demonstrations collected by humans using VR remote-controlled robot dogs during training. Output: The task planner outputs the skill sequence; each skill strategy generates terminal and other control targets, and the lower layer generates joint commands for the body and arms.", "improvement": "Compared to only demonstrating a single action, it connects teaching, generalizable skills and long-range combinations; unlike UMI on Legs, the demonstration involves the whole body of the real robot and multi-camera observation.", "experiment": "Average skill value is 71.2%, ACT 40.8%, OpenTV 64.4%; junk long task 7/10, shelf 3/10. Dual camera with door opening 70%, head/wrist single viewing angle 30%/10%, button single wrist viewing 85% slightly higher than dual camera 80%, viewing angle benefit depends on the task.", "limit": "30–60 demonstrations per skill, independent weighting; long task comparison also changes skill decomposition, representation and termination, cannot be attributed to LLM alone. The termination label indicates the end of the skill by the expert, not the physical success confirmation of the button; the language selection skill is not the continuous action VLA.", "url": "https://arxiv.org/abs/2411.15131", "pdf": "papers/2411.15131_WildLMa_Long_Horizon_Loco-Manipulation_in_the_Wild.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K23", "title": "Choose navigation goals that permit manipulation"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K42", "title": "Separate observation goals from manipulation goals"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2501.09905", "title": "SLIM: Sim-to-Real Legged Instructive Manipulation via Long-Horizon Visuomotor Learning", "label": "SLIM", "year": "2025", "date": "2025-01", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Teaching long tasks with a real robot is time-consuming; practicing long tasks directly from camera images makes it difficult to find successful actions in learning.", "method": "Phased SAC teachers solve long task exploration, and the teacher’s object information is limited to the camera’s field of view; students do not observe the stage true values and learn a single strategy through distillation + RL. Students use RGB/language prediction task-related mask/depth as a visual bottleneck, and deployment does not require depth input; they also learn stationary bits to force the base speed to zero during grab/placement.", "interface": "Input: When deploying, input the wrist RGB image, task instructions, joints and other self-states; the simulation teacher additionally knows the object position and current sub-task. Output: The high-level output arm/claw movement and body speed; the fixed low-level walking strategy outputs the leg joint movement.", "improvement": "Compared with WildLMa’s real teaching route, the focus is changed to pure simulation training and low-cost hardware; compared with a single visual capture, it covers the continuous process from finding to placing.", "experiment": "Go1＋WidowX＋Single wrist RGB, camera viewing color square/basket. 360 main comparisons + 40 new scenes, complete 78.3% ±5.8%, only distilled 50% ±35.5%; the three most stable real-machine deployments were selected from the ten lower-level seeds. Simulated for MuJoCo, student training takes approximately two weeks on four GPUs.", "limit": "Explicitly stop movement to stabilize the catch and release, and change steps during contact without verification. Low-level walking does not look at the arm target, joint PID is not force/compliance control; color object command strategy is not equal to open task VLA. Simulation assets and task decomposition still need to be designed.", "url": "https://arxiv.org/abs/2501.09905", "pdf": "papers/2501.09905_SLIM_Sim-to-Real_Legged_Instructive_Manipulation_via_Long-Horizon_Visuomotor_Learning.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}, {"id": "K40", "title": "What a visual representation must retain"}, {"id": "K42", "title": "Separate observation goals from manipulation goals"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2508.08240", "title": "ODYSSEY: Open-World Quadrupeds Exploration and Manipulation for Long-Horizon Tasks", "label": "ODYSSEY", "year": "2025", "date": "2025-08", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "Long-range instructions need to find the target first, walk nearby, and then complete the operation; planning based on desktop images is difficult to handle the moving field of view and terrain.", "method": "GPT-4.1 uses semantic instance graphs to split atomic tasks, and Qwen2.5-VL uses wrist RGB-D to generate contact points/poses and add geometric constraints. Go2＋Arx5 unified strategy output 18 joint targets: first fix the arm to train walking, and then train the whole body; after the end sampling height is fixed in the world, it is transferred to the body coordinates and added to the terrain height map.", "interface": "Input: language, head RGB, lidar and map, wrist depth map; the lower layer receives body speed, end target, terrain height and own status. Output: The global planning outputs subtasks and navigation goals; the local module outputs the terminal posture; the whole-body strategy outputs the leg and arm joint angles.", "improvement": "Compared with the single-skill visual method, the task decomposition and local operations supported by the map are increased; compared with stringing skills only by language, the mobile perspective, spatial target and terrain execution are further processed.", "experiment": "41.0%–69.8% of the 8 types of long-term tasks are simulations, with 304 indoor and outdoor changes; the real robot has two tasks and five objects for qualitative display. Table 3 mainly improves the base speed, and the end position/attitude is roughly equivalent to RoboDuet; it cannot be written that the end accuracy is significantly ahead.", "limit": "Appendix C.1 The short task includes fixed observation, 10 cm pre-alignment, linear gripping, and task motion sequence, and cannot be generally referred to as no action rules. Collision-free map waypoints do not guarantee reachability of subsequent arms; small objects will still fail due to tracking/vision errors. VLM planning does not directly generate VLAs of continuous joints.", "url": "https://arxiv.org/abs/2508.08240", "pdf": "papers/2508.08240_ODYSSEY_Open-World_Quadrupeds_Exploration_and_Manipulation_for_Long-Horizon_Tasks.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K23", "title": "Choose navigation goals that permit manipulation"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2605.03846", "title": "SigLoMa: Learning Open-World Quadrupedal Loco-Manipulation from Ego-Centric Vision", "label": "SigLoMa", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋固定夹爪", "problem": "The camera is slow to recognize objects and will lose the target, but the body is always moving; if you directly use the old position, it is easy to move to the wrong position or miss the target.", "method": "The weighted PCA center + the positive and negative endpoints of the three axes represent a total of seven points to represent the target; the Kalman filter at each point is combined with the visual odometry to update the ego-motion, and occlusion historical training simulates drift outside the field of view. The sigma points here are geometric points, not statistical propagation points of UKF.", "interface": "The Go2 body directly fixes the low-cost gripper, without a robotic arm. The upstream VLM provides semantic pick/place anchor points; the strategy takes target geometry, ontology and history as input, outputs front and rear/lateral velocity, yaw and body pitch, and aligns the gripper through the entire body.", "improvement": "Compared to directly sending images to the control network, it explicitly solves the problems of slow visual updates, coordinates moving with the body and being temporarily invisible, and reduces dependence on external positioning.", "experiment": "real robot performs ten pick/place tests of three categories, detection time is about 5 Hz/200 ms; compares KF, occlusion noise training and manual testing. The main criterion for successful simulation is that the body reaches the ideal alignment posture and stops, which needs to be distinguished from physical clamping.", "limit": "Appendix A Remotely scan the global target coordinates first, then turn towards the target and enter the field of view to trigger local strategies; it does not have universal long-distance navigation and is mainly on flat ground. Quadrupeds with no arm adjacency should be listed and cannot be used as evidence of continuous contact compensation of the robotic arm or a complete quadruped + arm VLA.", "url": "https://arxiv.org/abs/2605.03846", "pdf": "papers/2605.03846_SigLoMa_Learning_Open-World_Quadrupedal_Loco-Manipulation_from_Ego-Centric_Vision.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs + fixed jaws"}, {"id": "2608.20114", "title": "DECOWAM: Decoupled Whole-Body World-Action Model for Legged Mobile Manipulation (wheel-foot adjacency)", "label": "DECOWAM", "year": "2026", "date": "2026-08", "group": "示范／视觉／VLM", "platform": "轮足", "problem": "Body movement will change the camera picture; treating picture changes as arm operation effects will confuse actions with future picture predictions.", "method": "Reuse the video/action model of FastWAM; in the future, the video teacher will supervise the causal students who only look at the current state. The base/arm two latents use their own prediction heads to retain actions and cross-gradient inversion to reduce confusion. The base velocity token helps the video branch account for camera motion, not explicit KF or SE(3) alignment.", "interface": "Input: current image, language and robot status, including body speed; real follow-up images are also used for supervision during training, and future images are not read during deployment. Output: a future action and future image; the effective parts of the action are the six arm targets, the gripper opening and the three body speeds, and the other four dimensions are just data interface fill-ins.", "improvement": "Explicitly separate the different roles of body, arm and camera movement compared to fixed-base models; focus on reducing adaptation parameters and improving prediction and whole-body fit.", "experiment": "In 23 episodes replay, the action MSE is improved by 21.7% compared to FastWAM, and the action error of X-VLA is still lower. The real robot achieved 79 times per method, this method 46/79, and FastWAM 45/79, which was only one success away; improvements in other coordination indicators cannot replace the statistical significance of the task rate.", "limit": "Wheel adjacency, 14 dimensions including four complementary dimensions; indicates that decoupling does not cancel physical coupling. No explicit online MPC search was implemented through future videos, and the data statistics contain different subset ranges; reduced prediction error does not automatically translate into safer contacts or significantly higher mission success.", "url": "https://arxiv.org/abs/2608.20114", "pdf": "papers/2608.20114_DECOWAM_Decoupled_Whole-Body_World-Action_Model_for_Legged_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Wheeled-legged"}, {"id": "2604.07457", "title": "CMP: Robust Whole-Body Tracking for Loco-Manipulation via Competence Manifold Projection", "label": "CMP", "year": "2026", "date": "2026-04", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When the sensor drifts or the user gives an extreme trajectory, the originally stable whole-body controller may make dangerous actions.", "method": "Use training experience to learn which targets are more reliable in the current state; compress complex trajectories into a small number of values, and when encountering high-risk targets, bring these values ​​back to more reliable areas, and then continue tracking.", "interface": "Input: robot state and desired end-effector trajectory. The task intention is first encoded, then the length of the encoding vector is limited, and finally the joint movements are output by the whole body strategy. The safety estimator is used to shape the encoding space during training, and the deployment of projection does not require calling the estimator.", "improvement": "Explicitly use the data and training settings of UMI on Legs to increase ability judgment and correction before goal execution; retain the behavior of pushing toward the original goal as much as possible.", "experiment": "Simulation and real-machine tracking under extreme target and positioning noise significantly improve the survival rate defined in the article while retaining most of the tracking performance.", "limit": "The corresponding relationship between safety probability and coding space relies on learning approximation; 45 real-machine tests still resulted in 3 failures, which cannot be regarded as an unconditional continuous safety guarantee. Projection may sacrifice the tracking accuracy of the original target, and \"not falling\" and \"completing object manipulation\" must also be evaluated separately.", "url": "https://arxiv.org/abs/2604.07457", "pdf": "papers/2604.07457_CMP_Robust_Whole-Body_Tracking_for_Loco-Manipulation_via_Competence_Manifold_Projection.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2605.31343", "title": "Learning Terrain-Aware Whole-Body Control for Perceptive Legged Loco-Manipulation", "label": "Terrain-Aware WBC", "year": "2026", "date": "2026-05", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The body will change height and pitch along with slopes and steps; if the target only samples the body coordinates, it is easy to mistransmit terrain changes to the hand task.", "method": "Extract information from the terrain around the feet and generate training targets based on the support surface of the feet; combine two training strategies that are good at large-scale body movements and good at terrain adaptation.", "interface": "Inputs: Body and joint history, body velocity/end target, and onboard sensed foot circumference and local terrain height. Output: The learning strategy only outputs the angle targets of the twelve leg joints; the six arm joint targets are solved by inverse kinematics from the end target.", "improvement": "Compared with whole-body tracking that does not sense terrain, the body can adapt to the landing environment in advance; compared with only sampling end targets based on body height, the coupling between terrain and operating targets is reduced.", "experiment": "Simulation compares terrain passage, workspace, tracking and module ablation; clearly reports that the reachable range when walking is smaller than when standing. The B2+Z1 real robot is controlled by VR. It climbs five steps of 17 cm each while operating its arms, and completes five consecutive combination tasks; this demonstration is not equivalent to an autonomous long-range mission, nor is it a real robot comparison of each baseline.", "limit": "The robotic arm is still controlled by the geometry solver and cannot be understood as RL jointly outputting all joints. The primary study is terrain execution for a given target rather than high-level contact mission selection.", "url": "https://arxiv.org/abs/2605.31343", "pdf": "papers/2605.31343_Learning_Terrain-Aware_Whole-Body_Control_for_Perceptive_Legged
