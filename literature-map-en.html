 部分schema/任务细节核对，剩余附录未逐字覆盖。": "Local PDF title check; main text is complete, appendix A part schema/task details are checked, remaining appendices are not covered verbatim.", "几何关系可观察的任务适合验证；短按后回弹的按钮可能没有持久视觉状态；对象身份保持不等于已按成功事件确认，需要额外结果证据；深度标定/分割失误、人工阈值、接触力不可见仍影响可靠性": "Tasks with observable geometric relationships are suitable for verification; buttons that rebound after a short press may not have a persistent visual state; object identity retention is not equal to confirmation of a successful press event, requiring additional result evidence; depth calibration/segmentation errors, artificial thresholds, and invisible contact forces still affect reliability", "方法运动生成和WBC接口；Table V与真机任务图表；已核对正文或完整扩展摘要中的方法和实验。": "Method motion generation and WBC interface; Table V and real robot task chart; methods and experiments in the main text or full extended abstract have been checked.", "§III-G明确不包含locomotion，切换到独立行走策略后再换楼梯朝向。不能用楼梯位姿跟踪证明边走边保持物体接触。地形图仅用于训练采样；没做楼梯MPC公平对照。关键点立方体尺寸仍隐含位置／朝向权重；不是完全没有权衡。": "§III-G clearly does not include locomotion. Switch to the independent walking strategy and then change the direction of the stairs. Stair pose tracking cannot be used to prove that objects are maintained in contact while walking. The topographic map is only used for training sampling; no fair comparison of the staircase MPC is done. Keypoint cube size still implies position/orientation weighting; not entirely without trade-offs.", "$\\mathcal D$ 是示范数据，$a^\\star$ 是专家动作，$\\widehat a_\\theta$ 是动作预测，$\\ell$ 是监督损失；第一式表示点预测行为克隆的基本目标。概率动作模型可采用相应分布学习目标，不应把所有扩散训练都写成该点预测损失。": "$\\mathcal D$ is the demonstration data, $a^\\star$ is the expert action, $\\widehat a_\\theta$ is the action prediction, $\\ell$ is the supervision loss; the first formula represents the basic goal of point prediction behavior cloning. The probabilistic action model can adopt the corresponding distribution learning target, and all diffusion training should not be written as this point prediction loss.", "改变肢体可操作区域／关节限位会产生不同接触计划；真机穿过弹簧闭门器门、操作高静摩擦洗碗机，接触力最高约 125 N。消融分别检验采样、逻辑规则、后处理、MPC 和接触力前馈。": "Changing the limb operable area/joint limit will produce different contact plans; when the real robot passes through the spring door closer door and operates a high static friction dishwasher, the maximum contact force is about 125 N. Ablation examines sampling, logic rules, post-processing, MPC and contact force feedforward respectively.", "§II；§III；Table I；§V；已核对正文或完整扩展摘要中的方法和实验。": "§II; §III; Table I; §V; Methods and experiments in the main text or full extended abstract have been checked.", "腿式操作综述": "Overview of Leg Operation", "将物体作用力规划、机器人姿态可行性和考虑操作力的行走 MPC 拆成层级子问题，以便在线执行。": "Split object force planning, robot posture feasibility and walking MPC considering operating forces into hierarchical sub-problems for online execution.", "分别表示世界、身体和末端坐标系；": "represents the world, body and end coordinate systems respectively;", "object tokens进入GR00T action expert": "object tokens enter GR00T action expert", "方法／实机语义泛化": "Method/real robot semantic generalization", "准静态目标构造与实验": "Quasi-static target construction and experiment", "执行反馈": "Execution feedback", "MoB接口、训练和人工选择的原始方法": "Original approach to MoB interface, training and manual selection", "SuperMimic反复用当前策略在普通刚体仿真器采集的状态转移，拟合一个可微动力学模型；这个模型预测下一状态，也提供策略优化所需的状态、奖励与终止。每轮从真实仿真记录的状态起步，在模型中展开短轨迹，通过状态转移对动作的导数反向传播回报；critic估计短窗口以后的价值。策略更新时冻结模型，但下一轮又用新数据更新模型。": "SuperMimic repeatedly fits a differentiable dynamics model to transitions collected by its current policy in a standard rigid-body simulator. The model predicts future states and supplies observations, rewards, and termination signals for policy optimization. Starting from replayed simulator states, the policy generates short imagined rollouts; gradients pass through the model to update the policy, while a critic estimates return beyond the rollout. The model is frozen during each policy update and refreshed with new simulator data in the next iteration.", "是实机状态转移数据，": "is the actual machine state transfer data.", "将动作轨迹看成条件扩散生成变量，用示范轨迹训练去噪网络；时间序列动作预测与滚动执行保持闭环。论文比较卷积和Transformer去噪结构。": "Treat action trajectories as conditional diffusion generated variables, and use demonstration trajectories to train denoising networks; time series action prediction and rolling execution remain closed-loop. The paper compares convolution and Transformer denoising structures.", "已阅读全文的能力定义／接触选择算法／实验；补充约束细节通过外部链接提供，不在本地 PDF 中，未读取。": "Full text of capability definition/contact selection algorithm/experiment read; supplementary constraint details provided via external link, not in local PDF, not read.", "结果验证": "Result Verification", "已阅读接触目标空间、采样、actor／critic、奖励、课程／对称性、全部结果和消融。": "Read Contact Target Space, Sampling, Actor/Critic, Reward, Course/Symmetry, Full Consequences, and Ablation.", "依赖预建几何／可操作区域及名义物体动力学；在线追踪器不重搜完整接触序列，丢失物体接触可能使离线计划失效。步态模板和接触建立／解除的简单时序结构仍预设。": "Rely on pre-built geometry/operable area and nominal object dynamics; the online tracker does not re-search the complete contact sequence, and missing object contacts may invalidate the offline plan. The simple timing structure of gait templates and contact establishment/release is still defaulted.", "明确扩展 MimicGen：移动／接近段按物体相对位姿变换，接触后改用接触时刻锚点，插值连接，由复用的 AMO 执行并过滤成功轨迹。它增加动态全身数据生成，不是原始 RGB／语言 VLA，也不是首次物体相对示范扩增。": "Explicitly extend MimicGen: the moving/approaching segment is transformed according to the relative pose of the object, the contact moment anchor point is used after contact, interpolation connection is executed by the reused AMO and the successful trajectory is filtered. It adds dynamic whole-body data generation, not native RGB/language VLA, nor the first object-relative demonstration augmentation.", "单纯位置指令难把远距离移动与可变场景中的腿部操作串起。方法从人示范和图像学习任务策略，下层用 RL 全身控制把目标足端动作落实到步态和身体。": "It is difficult to connect long-distance movement with leg operations in variable scenes using simple position commands. The method learns task strategies from human demonstrations and images, and uses RL whole-body control at the lower level to implement the target foot movements into gait and body.", "成立条件": "Assumptions", "§3；§4；OVMM表与真机任务表；已核对正文或完整扩展摘要中的方法和实验。": "§3; §4; OVMM table and real robot task table; methods and experiments in the main text or complete extended abstract have been checked.", "从同样初始位姿开始，测导航到达、首个接触成功、完整操作成功和重新站位次数；消融可操作性项。": "Starting from the same initial pose, measure navigation arrival, first contact success, complete operation success, and repositioning times; the operability item is ablated.", "学习姿态请求": "Learning posture request", "冻结同一世界目标，依次只改变身体高度、俯仰、yaw 和平移，检查各方法究竟保持了哪个参考。": "Freeze the same world target and change only the body height, pitch, yaw and translation in order to check which reference is maintained by each method.", "编码潜变量，": "Encoding latent variables,", "§III-A–D；§IV；§V-A；结论": "§III-A–D; §IV; §V-A; Conclusion", "无mountedarm；residual指swingtrajectory，不是additivetorquecorrection；87.5%是stonesavoided比率而非complete-task-success": "No mounted arm; residual refers to swingtrajectory, not additivetorquecorrection; 87.5% is stonesavoided ratio rather than complete-task-success", "机器人运动造成的力矩变化里，混有地面支撑、手部接触和模型误差，直接把它当手部外力会控制错。": "The torque changes caused by robot movement are mixed with ground support, hand contact and model errors. If it is directly regarded as an external force on the hand, the control will be wrong.", "是部署可得观测，": "is a deployable observation,", "是折扣，": "is a discount,", "高低层可能以不同频率更新，低层可在高层两次更新之间重复使用最近参考。接口的单位、维度、预览范围和可表达行为决定高层权限；冻结低层不等于低层不能根据已有条件产生不同动作。": "The upper and lower layers may update at different frequencies, and the lower layer may reuse the most recent reference between updates to the higher layer. The unit, dimension, preview range and expressible behavior of the interface determine the high-level permissions; freezing the lower layer does not mean that the lower layer cannot take different actions based on existing conditions.", "摘要称用统一策略及“潜在信念混合”机制，在行走和操作两种状态表征之间自适应融合，使身体、腿与臂在模式转换时共同调整。具体网络输入、动作输出与损失函数未见全文，不作推断。": "The abstract claims that a unified strategy and a \"latent belief mixing\" mechanism are used to adaptively fuse the two state representations of walking and operation, so that the body, legs and arms can adjust together during mode conversion. The specific network input, action output and loss function are not shown in the full text, and no inferences will be made.", "足端任务用标准策略优化": "Optimize foot-end tasks with standard strategies", "主要末端运动而非精细接触力；某些baseline混合本文arm action和其他leg action；难完全归因critic": "Mainly terminal movement rather than fine contact force; some baselines mix arm action and other leg action in this article; difficult to completely attribute to critic", "安全概率与编码空间的对应关系依赖学习近似；45 次真机试验仍有 3 次失败，不能视为无条件的持续安全保证。投影可能牺牲原目标的跟踪精度，“不摔倒”与“完成物体操作”也须分别评价。": "The corresponding relationship between safety probability and coding space relies on learning approximation; 45 real-machine tests still resulted in 3 failures, which cannot be regarded as an unconditional continuous safety guarantee. Projection may sacrifice the tracking accuracy of the original target, and \"not falling\" and \"completing object manipulation\" must also be evaluated separately.", "完整动态抓放与显式质量／接触估计，有正式RA-L和消融；借鉴位姿关键点不说明其自己的多阶段训练已成为后作默认方案。": "Complete dynamic grab and release with explicit mass/contact estimation, with formal RA-L and ablation; drawing on pose key points without explaining its own multi-stage training has become the default solution for later games.", "四足通常不能直接套用差速轮式底盘的‘不能横移’非完整约束。它能靠不同步态横移；在某一足接触阶段，其运动受足不滑移和支撑力约束。连续身体运动与离散抬落脚共同决定操作能力。对于轻操作，关键不是机器人重就必然不准，而是身体运动、接触切换和闭环误差怎样传到手端。": "Quadrupeds usually cannot directly apply the 'cannot move laterally' non-holonomic constraint of differential wheeled chassis. It can move laterally through different gaits; at a certain foot contact stage, its movement is constrained by foot non-slip and support. Continuous body movement and discrete foot lifting and landing jointly determine operational ability. For light operations, the key is not that the robot will be inaccurate if it is heavy, but how the body movement, contact switching and closed-loop errors are transmitted to the hand.", "一个目标有逆运动学解，却可能在迈步、斜坡、关节饱和或当前速度下跟踪失败。": "A target with an inverse kinematics solution may fail to track at steps, slopes, joint saturation, or current speed.", "邻接训练接口；力命令、训练力矩与部署反馈分离": "Adjacency training interface; force command, training torque and deployment feedback are separated", "示范动作生成与四足执行是分开的贡献": "Action generation and quadruped execution are separate contributions", "任务坐标轨迹": "Task coordinate trajectory", "无力传感器时，估计到的到底是什么": "What can be estimated without a force sensor?", "腕相机在接触附近清楚，却可能看不到导航方向；让身体或头部照搬人的观察姿态，还可能干扰手端任务。": "The wrist camera is clear near the contact, but the navigation direction may not be visible; allowing the body or head to copy the person's observation posture may also interfere with the handheld task.", "浮动基、足接触与手端运动的耦合": "Coupling between floating-base motion, foot contacts, and the end effector", "从观测到操作目标": "From observation to manipulation targets", "给定手的目标位置和移动速度，常有许多可行身体／臂姿态；直接 RL 在高维关节空间寻找精确解很难。输入手六维目标和底盘速度，输出连续关节控制。": "Given the target position and movement speed of the hand, there are often many feasible body/arm poses; it is difficult for direct RL to find an exact solution in high-dimensional joint space. Input the six-dimensional hand target and chassis speed, and output continuous joint control.", "运行时在仿真里尝试多组候选命令，每组都经过低层控制器执行预测；选评分好的方案，执行一小段后重算。": "During runtime, multiple sets of candidate commands are tried in the simulation, and each set is predicted by the low-level controller; select the plan with good scores, execute it for a short period and then recalculate.", "一次生成未来一段动作可减少推理负担并改善连续性；但新接触或失败发生后，继续执行旧动作会延迟反应。": "Generating future actions one segment at a time reduces reasoning load and improves continuity; however, continuing to execute old actions after a new contact or failure occurs delays reactions.", "附录 B-A/B-B：教师视场限制、stationary bit和动作分布处理": "Appendix B-A/B-B: Teacher’s field of view restrictions, stationary bit and action distribution processing", "输入：身体和臂的近期状态、上一动作、末端轨迹历史；自动操作时也可以直接输入未来轨迹。 输出：十二个腿关节和六个臂关节的角度修正量。": "Input: recent status of the body and arms, last action, end-effector trajectory history; future trajectories can also be directly input during automatic operation. Output: Angle corrections for twelve leg joints and six arm joints.", "两者都让高层给末端意图、执行层分配身体运动；MoManipVLA 是轮式 VLA＋轨迹优化，UMI on Legs 是四足视觉扩散策略＋RL 全身跟踪，并无已核实的算法继承。": "Both allow the higher level to allocate body movements to the end intention and execution layer; MoManipVLA is a wheeled VLA + trajectory optimization, and UMI on Legs is a quadruped visual diffusion strategy + RL whole-body tracking, and there is no verified algorithm inheritance.", "视觉语言条件下连续动作流匹配": "Continuous action flow matching under visual language conditions", "第二式示意步态周期项的谐波表示：": "The second formula shows the harmonic representation of the gait periodic term:", "$\\lambda_i$ 是第 $i$ 个接触处环境作用在机器人上的力。例如左前足的 $\\lambda_i$ 可以包含地面的向上支撑和两个切向摩擦分量，点接触时通常是一个三维向量，单位是牛顿；它不是算法的权重或超参数。手接触面板时，面板的反作用也属于接触力。": "$\\lambda_i$ is the force of the environment acting on the robot at the $i$th contact. For example, $\\lambda_i$ of the left forefoot can include the upward support of the ground and two tangential friction components. At point contact, it is usually a three-dimensional vector in Newtons; it is not a weight or hyperparameter of the algorithm. When the hand touches the panel, the reaction of the panel is also a contact force.", "VLM／语言规划器可根据图像和指令输出目标、步骤或技能编号，技能内部动作由其他模块产生。VLA 将视觉、语言等观测映射到动作表示，例如关节目标、末端轨迹或全身潜动作；潜动作仍需一个解码器或快速控制器执行。": "VLM/Language Planner can output goals, steps or skill numbers based on images and instructions, and the internal actions of the skills are generated by other modules. VLA maps visual, language, and other observations to action representations, such as joint targets, end trajectories, or whole-body latent movements; latent movements still require a decoder or fast controller to execute.", "关节残差影响VLA，另用快速身体补偿。": "Joint residuals affect VLA, and fast body compensation is used.", "部分不随身体姿态的参考": "Some references that do not follow body posture", "动作专家": "Action Expert", "仅初步真机定性展示；没有与末端接口同平台消融。": "Only a preliminary qualitative demonstration of the real robot; it is not integrated with the same platform as the terminal interface.", "综述，不是四足控制器的实机比较。": "A review, not a real-life comparison of four-legged controllers.", "学习给定足端与机身姿态下，到腿可达区域边界的距离及其梯度，作为 KOMO 的约束／成本；规划机身和臂轨迹后由完整动力学 WBC 跟踪。": "Learn the distance to the boundary of the leg reachable area and its gradient under a given foot and fuselage attitude, as constraints/costs of KOMO; the fuselage and arm trajectories are tracked by the complete dynamics WBC after planning.", "Force Control 2024先用力回报训练力执行策略，再由外层位置误差给力命令；Unified 2025则在准静态假设下由净力算补偿位置，主要以运动目标训练。两者共享柔顺需求，但“位置误差→力命令”和“力信息→位置目标”不是同一执行路径。": "Force Control 2024 first uses force to report the training force execution strategy, and then uses the outer position error to give force commands; Unified 2025 uses net force calculation to compensate the position under the quasi-static assumption, and mainly trains with moving targets. The two share compliance requirements, but \"position error → force command\" and \"force information → position target\" are not the same execution path.", "核心解决给定命令的执行；展示任务不等于同一个策略能自行理解和规划这些任务。采样参考系不随身体高度、侧倾和俯仰改变，但仍随身体水平位置和朝向变化，不能等同于完整固定的世界坐标目标。": "The core solves the execution of a given command; demonstrating tasks does not mean that the same strategy can understand and plan these tasks on its own. The sampling reference system does not change with the height, roll and pitch of the body, but still changes with the horizontal position and orientation of the body, and cannot be equated to a completely fixed world coordinate target.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；需要可随时查询的专家，机器人上可能需要昂贵的遥操作或仿真教师；不自动提供安全访问状态的机制。": "The actual undertaking and the background-only relationship are registered separately in literature/foundations.md; experts who can be queried at any time are required, and expensive teleoperation or simulation teachers may be required on the robot; there is no mechanism to automatically provide safe access status.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；仿真吞吐提升不保证动力学逼真或实机成功；具体仿真平台和接触模型仍需逐篇核查。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; the improvement of simulation throughput does not guarantee the realistic dynamics or the success of the actual machine; the specific simulation platform and contact model still need to be verified article by article.", "执行链残差": "Execution chain residual", "这里的“多任务”主要指同一个执行器跟踪多种操作轨迹；它不等于学会任意语言任务。": "\"Multi-tasking\" here mainly refers to the same executor tracking multiple operation trajectories; it does not mean learning any language task.", "相较不感知地形的全身跟踪，身体能提前适应落脚环境；相较只按身体高度采样末端目标，降低地形与操作目标的耦合。": "Compared with whole-body tracking that does not sense terrain, the body can adapt to the landing environment in advance; compared with only sampling end targets based on body height, the coupling between terrain and operating targets is reduced.", "方法／实机任务": "Method/real robot task", "是同一策略下该回报对应的真实优势。第一行的优势线性关系要求固定权重、相同策略、折扣、终止和时域。": "is the real advantage corresponding to this return under the same strategy. The dominant linear relationship in the first row requires fixed weights, identical policies, discounts, termination, and time domain.", "不能将比较 RMSE 写成控制器普适排名。动捕外任务误差由机载里程计重建，不能当作独立世界坐标真值；显式力反馈也不是其核心机制。": "Comparative RMSE cannot be written as controller universal ranking. The external mission error of motion capture is reconstructed by the airborne odometry and cannot be regarded as the true value of independent world coordinates; explicit force feedback is not its core mechanism.", "SUF、剩余力多面体和站立抗扰优化来自作者 2020／2021 年工作；逆动力学和直接离散轨迹优化是已有工具。": "SUF, residual force polyhedron and standing disturbance rejection optimization are from the author's 2020/2021 work; inverse dynamics and direct discrete trajectory optimization are existing tools.", "需要已知／记录的物体和机器人状态，估计器更新慢于控制器；没有独立证明质量与摩擦可辨识。无外挂臂，也没有轻型机构操作证据。": "Requires known/recorded object and robot states, estimator updates slower than controller; no independent proof that mass and friction are identifiable. There are no external suspension arms and no evidence of light mechanism operation.", "结果表：success、smoothness 与成功episode耗时": "Result table: success, smoothness and successful episode time consumption", "【九种机器人平台实机适配】比较少量新域数据微调与模型设计消融；RSS 2024。不是四足全身控制实验。": "[real robot adaptation of nine types of robot platforms] Compare a small amount of new domain data fine-tuning and model design ablation; RSS 2024. Not a quadruped whole-body control experiment.", "描述身体位置、朝向和各关节角度；": "Describe the body position, orientation and angles of each joint;", "是学生与教师的动作预测，": "is the action prediction of students and teachers,", "冻结CLIP编码多视角与文字，用可训练投影／浅Transformer融合为两策略共享上下文。ongoing/done阶段文字与图像相似度给出阶段概率及进度，作为动作条件。训练时以匹配示范臂／底盘动作作为正样本，打乱两子系统动作构造负样本，InfoNCE正则使共享表示包含协作关系；高层从同一批遥操作示范学习。": "Freeze CLIP encoding multi-view and text, and use trainable projection/shallow Transformer to fuse the two strategies to share context. The similarity between text and image in the ongoing/done stage gives the stage probability and progress as action conditions. During training, the matching demonstration arm/chassis movements are used as positive samples, and the movements of the two subsystems are disrupted to construct negative samples. InfoNCE regularizes the shared representation to include collaborative relationships; high-level learning learns from the same batch of teleoperation demonstrations.", "RLtracking、关键事件goalsampling": "RLtracking, key event goalsampling", "Open X-Embodiment的RT-X模型家族沿RT-1等架构跨机器人训练；RT-2将视觉语言预训练更直接接入动作token。": "Open X-Embodiment’s RT-X model family is trained across robots along RT-1 and other architectures; RT-2 connects visual language pre-training more directly to action tokens.", "依据任务剩余施力／可达／移动能力和接触获取成本，联合选择环境支撑与身体配置；用 LP 值敏感度、锚点分组、验证及候选缩减降低评估成本。": "Jointly select environmental support and body configuration based on task remaining force/reach/movement capabilities and contact acquisition costs; use LP value sensitivity, anchor point grouping, verification, and candidate reduction to reduce evaluation costs.", "视觉目标接口": "Vision Target Interface", "搜索对象接触序列，再优化全身／物体轨迹。": "Search for object contact sequences and then optimize the whole body/object trajectory.", "是默认关节配置，": "is the default joint configuration,", "§IV与Table III：FSM/各模式任务优先级及WBC": "§IV and Table III: FSM/task priority and WBC of each mode", "Go1前小腿安装两个3DoF操纵模块/夹爪；腿兼操作，非背部独立长臂": "Two 3DoF control modules/claws are installed on the front calf of Go1; the legs are also operated, and the non-back independent long arm", "阻抗控制设计位移、速度与作用力之间的关系，相当于让机械臂表现为虚拟质量、弹簧和阻尼。导纳控制通常把测得的外力输入这个虚拟动力学，再生成位置／速度参考交给位置执行器。二者都需考虑内层控制和实际接触稳定性。": "Impedance control designs the relationship between displacement, speed and force, which is equivalent to making the mechanical arm behave as a virtual mass, spring and damping. Admittance control usually inputs the measured external force into this virtual dynamics, and then generates a position/speed reference and gives it to the position actuator. Both require consideration of inner layer control and actual contact stability.", "明确复用 LocoMan 小腿操纵模块及 nullspace IK／动力学 QP。人 VR 示范先映射到共享头／腕任务空间，身体、末端与夹爪用独立 stems 编解码，共享 Transformer；换机器人时重建形态特定 stems 并 mask 缺失模态，迁移的是表征结构而非人关节控制。": "Explicitly reuse the LocoMan calf manipulation module and nullspace IK/dynamics QP. The human VR demonstration is first mapped to the shared head/wrist task space. The body, end and gripper are encoded and decoded with independent stems, and the Transformer is shared. When changing robots, form-specific stems are reconstructed and missing modes are masked. What is transferred is the representation structure rather than human joint control.", "需定义成功事件、可得信号、保持记忆多久，以及失败／重试何时清除或改变状态。": "Need to define success events, available signals, how long to keep the memory, and when failures/retries clear or change status.", "已知payload实验": "Known payload experiment", "Deep WBC及多篇四足操作论文引用其真实地形行走结果；目前库中未核到其完整控制器被操作论文复制。": "Deep WBC and many four-legged operation papers quote its real terrain walking results; currently, its complete controller has not been verified to be copied by the operation papers in the library.", "进度调整、任务奖励微调与离线到在线数据调度不能合成一个‘会恢复的模仿策略’。它们改变不同变量。": "Progress adjustment, task reward fine-tuning and offline-to-online data scheduling cannot be combined into a ‘recoverable imitation strategy’. They change different variables.", "相似方法与实质差别": "Similar mechanisms and differences", "评价分解": "Evaluation breakdown", "这条式子是全身的受力与运动关系：实际运动所需的总作用，由关节电机与环境接触共同提供。先按各项的物理含义阅读，不必先掌握矩阵推导。": "This formula is the relationship between force and movement of the whole body: the total action required for actual movement is provided by joint motors and environmental contact. Read the terms first according to their physical meaning, without having to master matrix derivation first.", "Visual WBC视觉学生训练节明确采用DAgger，学生访问状态后向特权教师请求纠正动作。": "The Visual WBC visual student training section explicitly uses DAgger, and students request corrective actions from privileged teachers after accessing the status.", "§III／实验": "§III／Experiment", "没有显式通过未来视频做在线 MPC/action search 的实验；数据统计在 abstract217/27tasks、stage214/26tasks、审计集合1487等之间有不同范围；不能忽略子集区分；轮足执行与步行四足接触动力学不同；所谓14维动作中包含padding": "There is no explicit experiment of online MPC/action search through future videos; data statistics have different ranges between abstract217/27tasks, stage214/26tasks, audit set 1487, etc.; subset distinction cannot be ignored; wheel-foot execution and walking quadruped contact dynamics are different; so-called 14-dimensional actions include padding", "摘要称点足、轮足四足平台都有仿真和真机，并相较传统 WBC 改善灵活性与精度；没有全文，暂不能核对具体任务、指标及是否边移动边接触物体。对“RL 底盘＋模型操作”接口很相关，待全文优先核实。": "The abstract states that point-foot and wheel-foot quadruped platforms have both simulated and real robots, and have improved flexibility and accuracy compared with traditional WBC. Without the full text, it is not possible to check the specific tasks, indicators, and whether it touches objects while moving. It is very relevant to the \"RL chassis + model operation\" interface, and the full text will be verified first.", "统一策略协调关节，参考部分不随身体姿态。": "Unified strategy to coordinate joints, the reference part does not follow the body posture.", "WildLMa方法节明确building upon ACT训练语言条件技能；新增CLIP对象查询与长时技能组合。": "WildLMa method section clarifies building upon ACT training language condition skills; adds CLIP object query and long-term skill combination.", "步态闭环响应建模与MPC联动，针对移动时末端误差提出可检验方法；很新，不能从问题相关性推断长期影响。": "Gait closed-loop response modeling is linked with MPC to propose a testable method for terminal errors during movement; it is very new and long-term effects cannot be inferred from problem correlation.", "使用导纳、卡尔曼滤波、神经网络残差模型、参考调节器／最大输出容许集（MOAS）理论和 PPO。": "Use admittance, Kalman filtering, neural network residual models, reference regulator/maximum output admissible set (MOAS) theory, and PPO.", "原文定位": "Locations in the paper", "预览描述未来计划，历史描述过去观测，二者不能互称记忆。轨迹替换、时间戳、参考坐标和错误预览都影响执行。": "Preview describes future plans, and history describes past observations. The two cannot be called memories of each other. Track replacement, timestamps, reference coordinates, and error previews all affect execution.", "这些信息可显式传给规划器／策略，也可作为模型内部特征或辅助监督。预测区域更准并不一定改善实际操作，必须验证动作模型是否真的用到这项信息。综述中的闭环更新与不确定性属于提出的研究方向，不能算已实现的四足能力。": "This information can be passed explicitly to the planner/strategy, or as internal features of the model or as auxiliary supervision. A more accurate prediction area does not necessarily improve actual operation. It must be verified whether the action model actually uses this information. The closed-loop updating and uncertainty in the review belong to the proposed research directions and cannot be counted as realized four-legged capabilities.", "QuadWBG 的整系统抓取对比包含感知和执行差异；PAKE 真机部署简化版；FT-WBC 故障消融叙述有冲突。应按实际版本记录。": "The whole system capture comparison of QuadWBG includes differences in perception and execution; PAKE real robot deployment simplified version; FT-WBC fault ablation description is conflicting. The actual version should be recorded.", "是摩擦系数；多个指间接触需分别满足对应条件或明确等效方式。": "is the friction coefficient; multiple inter-finger contacts need to meet the corresponding conditions or clarify the equivalent method.", "也必须匹配。": "must also match.", "视觉瓶颈先把观测映射为任务特征，再用该特征生成动作。VBC的分割深度保留目标形状；SLIM从RGB与语言预测mask／深度；SigLoMa的七个PCA点保留中心、尺度和主轴。它们都减少视觉细节，但保留的变量不同，不能仅按特征维数判断好坏。": "The visual bottleneck first maps observations into task features, and then uses these features to generate actions. VBC's segmentation depth retains the target shape; SLIM predicts mask/depth from RGB and language; SigLoMa's seven PCA points retain the center, scale and principal axis. They both reduce visual details, but retain different variables, and cannot be judged only by feature dimensions.", "先以臂正运动学采集10000个无自碰位姿，再加随机身体变换扩大目标范围，并利用粗地形图排除低于地面的目标。末端位姿用固定在工具上的三个不共线点表示，位置和转动统一成点距离。每4秒换目标，仅最后2秒启用到达奖励，并按超过历史最佳距离的进展补充稀疏奖励；以误差推动地形课程。复用行走策略产生的稳定初始配置，减少切换跳动。": "First collect 10,000 self-collision-free poses using arm forward kinematics, then add random body transformation to expand the target range, and use coarse terrain maps to exclude targets below the ground. The end pose is represented by three non-collinear points fixed on the tool, and the position and rotation are unified into point distances. Change targets every 4 seconds, enable reach bonuses only for the last 2 seconds, and replenish sparse bonuses as progress exceeds the all-time best distance; drive terrain courses with error. Reuse the stable initial configuration generated by the walking strategy to reduce switching jitter.", "bodyframeobs不意味bodyfixedtarget；SLAMfixedlocalframe；demo带gripper不改变controllerabstracttask，不能作为quadruped-armcorepaper": "bodyframeobs does not mean bodyfixedtarget; SLAMfixedlocalframe; demo with gripper does not change controllerabstracttask and cannot be used as quadruped-armcorepaper", "简化身体模型规划、再由WBC执行，可能在臂重、施力大或关节接近力矩上限时产生不一致。本文研究能否把关节级动力学与接触力直接放进同一个实时预测优化。": "Simplifying body model planning and then executing it by WBC may cause inconsistencies when the arm is heavy, the applied force is large, or the joints are close to the upper limit of torque. This paper investigates whether joint-level dynamics and contact forces can be directly put into the same real-time prediction optimization.", "给出对应水平落点。式子选下降到目标高度的飞行时间根，须满足可到达该高度。": "gives the corresponding horizontal landing point. The formula selects the root of the flight time to descend to the target altitude, which must be sufficient to reach the altitude.", "四足双手操作通常要立起身体或牺牲前腿支撑。每条前小腿嵌入滑动关节、旋转关节和夹爪，四足着地时即可双臂操作。": "Quadrupedal bimanual operation usually requires standing upright or sacrificing front leg support. Each front leg is embedded with sliding joints, rotating joints and clamping claws, and can be operated with both arms when on all fours.", "UMI on Legs研究手端轨迹怎样交给四足全身执行；SuperMimic研究人形全身跟踪策略怎样高效训练。后者只实测全动作与速度命令，未实测手端目标或物体接触；两者可组合但未有直接承接。": "UMI on Legs studies how hand-held trajectories can be transferred to the four-legged body for execution; SuperMimic studies how to efficiently train humanoid whole-body tracking strategies. The latter only measures full movements and speed commands, but does not measure hand target or object contact; the two can be combined but are not directly connected.", "已阅读动力学分解、刚性安装约束、分层控制器、设置／实现、真机任务和定量对比。": "Read Dynamic Decomposition, Rigid Mount Constraints, Hierarchical Controllers, Setup/Implementation, real robot Tasks, and Quantitative Comparisons.", "Deep WBC §2.2与实验把RMA两阶段教师—学生适应作为对照基线，再提出ROA；不能称原RMA方法被全身操作系统直接采用。": "Deep WBC §2.2 and experiments use the two-stage teacher-student adaptation of RMA as the control baseline, and then propose ROA; it cannot be said that the original RMA method was directly adopted by the whole body operating system.", "在实际机器人上逐任务遥操作采集数据昂贵，纯人类视频与机器人动作空间又不一致。": "It is expensive to collect data through task-by-task teleoperation on actual robots, and pure human videos are inconsistent with the robot action space.", "分类应为holonomic wheeled mobile manipulator，不是四足/人形行走；学3D look-at goal，不是硬逼机器人跟完整human6Dheadpose；其对齐/执行机制与一般VLA latent video pretraining不同；成功率属于各20trials小样本，不是任意长期任务普适率": "The classification should be holonomic wheeled mobile manipulator, not quadruped/humanoid walking; learning 3D look-at goal, not a forced robot and a complete human6D headpose; its alignment/execution mechanism is different from general VLA latent video pretraining; the success rate belongs to a small sample of 20trials each, not a universal rate for any long-term task", "打开带回弹力的门时，不能只规划手臂；还要决定站在哪里、用手还是脚顶住、何时松开。": "When opening a resilient door, you don’t just have to plan your arms; you also have to decide where to stand, whether to hold it with your hands or feet, and when to release.", "上层优化选择底盘路径点，为手端目标留出可操作空间；下层在连续末端路径点之间选择臂轨迹。目标函数检查逆运动学可达性、关节和底盘轨迹平滑性、碰撞；臂关节用 Pinocchio IK 求解。先有独立导航／注视模块把平台带到目标附近，再执行该移动操作规划。": "The upper layer optimizes the selection of chassis path points to leave maneuverable space for hand targets; the lower layer selects arm trajectories between consecutive end path points. The objective function checks inverse kinematics reachability, joint and chassis trajectory smoothness, and collisions; the arm joints are solved with Pinocchio IK. First, an independent navigation/gaze module brings the platform near the target, and then executes the mobile operation plan.", "CMP部署时没有显式解码一条修正末端轨迹；潜变量截断后直接影响低层策略。它仍应相对原始任务评估，不只看存活。": "When CMP is deployed, a modified end-effector trajectory is not explicitly decoded; the latent variable is truncated and directly affects the low-level strategy. It should still be evaluated relative to the original mission, not just survival.", "全阶逆动力学实时MPC是模型接口的近期代表；正式发表状态仍按作者标注记录，未核实多支采用，也未测量实际末 tly analogized to \"the fewer degrees of freedom, the better\".", "明确复用 VBC 全身低层收集 VR 示范，每技能单独训练 ACT；加入 CLIP 文本／像素余弦相关图提供目标定位。演示末尾监督技能终止，部署连续十次终止预测超过 0.8 后结束；LLM 通过人工导航 waypoint／连通关系调用技能。": "Explicitly reuse VBC whole-body low-level collection VR demonstration, and train ACT separately for each skill; add CLIP text/pixel cosine correlation map to provide target positioning. At the end of the demonstration, the supervision skill is terminated, and the deployment ends after ten consecutive termination predictions exceed 0.8; LLM calls the skill through manual navigation waypoint/connectivity relationship.", "部署默认已有可追踪手端目标的机器人；足支撑和身体补偿由后续UMI on Legs处理。": "By default, a robot that can track hand targets is deployed; foot support and body compensation are handled by subsequent UMI on Legs.", "是身体与关节的速度，": "is the speed of the body and joints,", "柔顺控制规定受力后怎样运动": "Compliance defines motion in response to force", "作者 arXiv 2502.10894 HTML 主文、方法、实验、App A/B/C 审读；原 RSS PDF 图像文本不可提取，全文依据为作者 HTML": "Author arXiv 2502.10894 HTML main text, methods, experiments, App A/B/C review; original RSS PDF image text cannot be extracted, the full text is based on the author HTML", "zero-shot背景2/10、对象4/10、空间2/10，通用鲁棒性有限；基线预训练量和RTC执行配置不同，不能只归因架构优越。结构化人位姿数据及机器人任务微调是必要条件，规模远超单个MSc项目。": "Zero-shot background 2/10, object 4/10, space 2/10, general robustness is limited; the baseline pre-training amount and RTC execution configuration are different, and the superior architecture cannot only be attributed. Structured human pose data and fine-tuning of robot tasks are necessary conditions, and the scale far exceeds a single MSc project.", "本地 PDF 标题核对；完整主文至结论，keyframelibrary、retargeting、multi-critic、planner和所有sim/real结果已读。": "Local PDF title check; complete main text to conclusion, keyframe library, retargeting, multi-critic, planner and all sim/real results have been read.", "臂够不到或推不稳时，有时应让一条前腿临时触物，其他腿维持走动；预先固定“腿只走、臂只操作”限制了能力。输入任务目标及各肢体当前分工，输出所有腿与臂关节动作。": "When the arms cannot reach or push is unstable, sometimes one front leg should be temporarily touched and the other legs should continue to move; pre-fixing \"legs only walk and arms only operate\" limits the ability. Input the task goal and the current division of labor of each limb, and output all leg and arm joint movements.", "8 类长任务总体 41.0%–69.8%，均为仿真 benchmark；304 个长任务变化，室内246/室外58；Table 3 基座速度跟踪改善，但末端位置/姿态误差大体与 RoboDuet 相当；站立 x/y 指标也非逐项胜出；Table 1 seen pickup 60.45% 低于 PerAct 94.03%，novel pickup 45.24% 高于25.70%；不能泛称所有指标超越；真机仅 navigate-to-pick 与 pick-and-place 两种任务、五个对象定性展示，未提供大样本长期 task success table；Appendix C.1 固定 Observe/Plan→Pre-alignment→linear grasp→task-specific motion，以隔离高层规划方差": "Overall 41.0%–69.8% of 8 types of long tasks, all are simulation benchmarks; 304 long task changes, indoor 246/outdoor 58; Table 3 base speed tracking improved, but end position/attitude error is roughly equivalent to RoboDuet; standing x/y indicators are not the winner one by one; Table 1 seen pickup 60.45% lower than PerAct 94.03%, novel pickup 45.24% is higher than 25.70%; it cannot be generally stated that all indicators are exceeded; the real robot only performs two tasks, navigate-to-pick and pick-and-place, and five objects for qualitative display, and does not provide a large sample long-term task success table; Appendix C.1 fixed Observe/Plan→Pre-alignment→linear grasp→task-specific motion to isolate high-level planning variance", "任务相关视角互补": "Complementary task-related perspectives", "RSS2026本地正式PDF标题核对；完整主文，包括UMI采集、坐标表示、look-at、IK控制、同步与全部实验/消融。": "RSS2026 local official PDF title check; complete main text, including UMI acquisition, coordinate representation, look-at, IK control, synchronization and all experiments/ablation.", "共同子问题 · 非继承": "Shared subproblem · not inheritance", "接触后对象会运动，通常需要另定或冻结阶段锚点，而不是持续套用正在变化的对象位姿。刚体几何重定向不保证机构一致、接触有效或全身动态可行。": "The object will move after contact, and it is usually necessary to set or freeze the phase anchor point instead of continuously applying the changing object pose. Rigid body geometry reorientation does not guarantee that mechanisms are consistent, contacts are effective, or whole-body dynamics are feasible.", "只有仿真；L4教师74.3%、学生41.0%。": "Only simulation; 74.3% of L4 teachers and 41.0% of students.", "不是 VLA，也不是未知环境自主操作。三项通用代价对应受控仿真分析，并非覆盖所有真机任务；实机物体上的站位／抓取点不是在线接触点优化得到的。": "Not a VLA, not an autonomous operation in an unknown environment. The three common costs correspond to controlled simulation analysis and do not cover all real robot tasks; the station/grasp points on real robot objects are not optimized by online contact points.", "部署时通过动捕等获取物体状态。恢复主要围绕给定示范；需要换一整套接触计划时仍需重规划。附录 D.1 把门把手视为固定物体链接，加入锁机构后的尝试成功率低，不能据此认定“转把手解锁再穿门”已完整解决。": "Obtain the object status through motion capture, etc. during deployment. Recovery mainly revolves around given demonstrations; replanning will still be required when a complete set of contact plans needs to be changed. Appendix D.1 regards the door handle as a fixed object link, and the success rate of attempts after adding the lock mechanism is low. Therefore, it cannot be concluded that the \"turn the handle to unlock and then penetrate the door\" has been completely solved.", "接触点与准静态补偿的限制": "Limitations of contact points and quasi-static compensation", "仿真单箱、绕一面墙、绕多面墙三类任务，在相同稀疏任务奖励下比较物体状态新颖度、整体状态新颖度、人工接近提示及不同动力学模型构造的探索奖励；Go2 真机推 5.5 kg 箱子，展示直推和绕障。真机物体位置来自外部动捕，论文未报告系统化的真机成功率，不能把仿真曲线当成现场鲁棒性证据。": "Simulate three types of tasks: single box, around a wall, and around multiple walls. Under the same sparse task reward, the object state novelty, overall state novelty, artificial approach prompts, and exploration rewards of different dynamic model structures are compared; the Go2 real robot pushes a 5.5 kg box, demonstrating direct push and obstacle avoidance. The position of the real robot object comes from external motion capture. The paper does not report the systematic success rate of the real robot. The simulation curve cannot be regarded as evidence of on-site robustness.", "一个动作网络控制全身，走路、  a design limitation, which does not mean that the humanoid body is equivalent to the non-holonomic constraint of a differential car.", "只在专家轨迹上模仿会遇到分布偏移：学生一次动作失误后进入训练集未覆盖的状态。": "If you only imitate on the expert trajectory, you will encounter a distribution shift: after the student makes a mistake in one action, he will enter a state that is not covered by the training set.", "经验控制能力": "Experience control ability", "将物体速度映射到接触速度，": "Map object velocity to contact velocity,", "两阶段主要改善survival；cooperation主要改善pose error；“0.87 m³”是performance workspace，不是理论几何容量": "The two stages mainly improve survival; cooperation mainly improves pose error; \"0.87 m³\" is the performance workspace, not the theoretical geometric capacity", "【真机＋仿真】低／中／高末端目标配23秒速度序列，跨模拟器报告vx／yaw RMSE。真机3种YCB物体、4高度，表4每物共10次，合计30次：WBC 26/30、默认15/30（从表计数），是遥操作取物，不是视觉自主成功。": "[real robot + simulation] Low/medium/high end target with 23 seconds speed sequence, vx/yaw RMSE reported across simulators. There are 3 types of YCB objects and 4 heights in the real robot. There are 10 times for each object in Table 4, a total of 30 times: WBC 26/30, default 15/30 (counted from the table), which is a remote operation to retrieve objects, not a visual independent success.", "同一任务的靠近、插入、拉出需要不同刚度；固定位置控制会碰撞，始终柔顺又拉不动。输入视觉和自身状态，策略同时给出运动与控制模式权重，控制器在力矩层连续混合位置、阻抗和力／位混合控制。": "Approaching, inserting, and pulling out for the same task require different stiffnesses; the fixed position control will collide, always being compliant but unable to pull. Inputting visual and self-state, the strategy simultaneously gives motion and control mode weights, and the controller continuously mixes position, impedance, and force/position mixed control at the moment layer.", "用于避免把 VLM 选技能等同于连续输出移动操作动作的 VLA。": "VLA used to avoid equating VLM skill selection with continuous output of movement operation actions.", "图像、点云与物体真值提供的信息不等价；视觉噪声和运行延迟应纳入比较。": "The information provided by images, point clouds and object ground truth is not equivalent; visual noise and runtime latency should be included in the comparison.", "Unified policy 的 command frame": "Command frame of Unified policy", "Visual WBC／Walk These Ways等低层接口、PPO、非对称critic、随机臂运动、LSTM历史物理参数估计、分阶段奖励与课程。": "Visual WBC/Walk These Ways and other low-level interfaces, PPO, asymmetric critic, random arm motion, LSTM historical physical parameter estimation, staged rewards and courses.", "仿真与真机抓取、身体位姿补偿；GORM／站位处理的消融；整系统与视觉基线比较。": "Simulation and real robot grasping, body posture compensation; ablation of GORM/position processing; comparison of the entire system and visual baseline.", "Go2＋六自由度臂和腕部六维力传感器，仿真与真机验证人与机器人共同搬运等受力交互。": "Go2＋ six-degree-of-freedom arm and six-dimensional force sensor on the wrist, simulation and real robot verify the force interaction such as joint transportation between humans and robots.", "方法／感知编码器": "Method/Perceptual Encoder", "§4.3：门类型分类与recurrence消融": "§4.3: Gate type classification and recurrence ablation", "实际承接与仅作背景的关系分开登记在literature/foundations.md；高频被四足操作论文引用作地形感知背景，但不等于它们复用了相同视觉融合器。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; high frequency is cited as terrain perception background in quadruped operation papers, but it does not mean that they reuse the same visual fusion device.", "$I_t,\\ell,s_t$ 分别是视觉、语言与状态条件；$\\widehat f_t$ 是力估计或接触代理，$a_t^{\\mathrm{gen}}$ 是生成动作。$C$ 是快速执行控制器，$y_t^{\\mathrm{contact}}$ 是其实际接触反馈。": "$I_t,\\ell,s_t$ are visual, verbal, and state conditions respectively; $\\widehat f_t$ is the force estimate or contact agent, and $a_t^{\\mathrm{gen}}$ is the generated action. $C$ is the fast execution controller, and $y_t^{\\mathrm{contact}}$ is its actual contact feedback.", "保持夹爪权限与训练一致，比较触觉输入／目标／低层使用；同时测握力、滑移、释放回弹与物体损伤。": "Keep the gripper authority consistent with training, compare tactile input/target/low-level use; simultaneously measure grip strength, slippage, release rebound and object damage.", "模型规划／显式控制": "Model-based planning / control", "PI/CQP/TCN/hybrid same rollout10trials eachinertiasetting；matched/unmatchedmass含train；drag10trials；realvalve和wipe定量F/T reference、door/guidance系统演示": "PI/CQP/TCN/hybrid same rollout10trials eachinertiasetting; matched/unmatchedmass including train; drag10trials; realvalve and wipe quantitative F/T reference, door/guidance system demonstration", "先对next task-space action训练VLM表征，再冻结backbone训练500M joint-spaceflow expert，最后任务微调；训练时加入已提交动作前缀，使异步RTC能连续执行。重点是异构数据分阶段目标和部署时间一致性。": "First train the VLM representation for the next task-space action, then freeze the backbone to train the 500M joint-spaceflow expert, and finally fine-tune the task; add the submitted action prefix during training to enable the asynchronous RTC to be executed continuously. The focus is on heterogeneous data staging goals and deployment time consistency.", "遮挡、深度噪声和目标抖动使学生难以复制物体真值教师；用双视角的有效帧与时间可靠性信息形成较稳定的抓取动作。": "Occlusion, depth noise and target jitter make it difficult for students to copy the true value of an object Teacher; Use effective frames from dual perspectives and temporal reliability information to form a more stable grabbing action.", "目前只报告导航模块的初步真机部署。": "Currently only reports on the preliminary real-device deployment of the navigation module.", "摘要4.2%据表是15.8%-11.6%=4.2个百分点；不应解读为相对百分比增长。": "Summary 4.2% is 15.8%-11.6%=4.2 percentage points according to the table; it should not be interpreted as a relative percentage increase.", "需有可控制的相机／头部自由度或允许重选身体姿态；外参、遮挡和视线恢复成本不可忽略。": "It is necessary to have controllable camera/head degrees of freedom or allow reselection of body poses; the cost of external parameters, occlusion and line of sight recovery cannot be ignored.", "Unitree G1＋双手；AMO低层，人形邻接": "Unitree G1＋Hands; AMO low level, humanoid adjacent", "视觉 Diffusion Policy 给未来手端轨迹；全身运动生成器利用手端目标和已有全身运动先验补足身体、足与关节参考；全身跟踪器执行。高层仍只输出手端轨迹，并未给底盘速度或把 VLA 接入。": "Vision Diffusion Policy gives the future hand trajectory; the whole body motion generator uses the hand target and the existing whole body motion prior to supplement the body, foot and joint references; the whole body tracker executes. The top management still only outputs the mobile trajectory, but does not give the chassis speed or connect the VLA.", "轨迹接口和任务示范给出较强先验；视觉与低层参考系不完全相同，不能仅写端到端视觉全身策略。": "The trajectory interface and task demonstration give strong priors; the vision and low-level reference systems are not exactly the same, and you cannot just write an end-to-end visual whole-body strategy.", "先在随机环境参数和地形中联合训练环境编码器与行走策略；再冻结它们，用仿真标签监督历史适应器模仿z。部署时适应器从过去动作和反馈实时更新潜表示，不再读取特权环境参数。": "First jointly train the environment encoder and walking policy in random environment parameters and terrain; then freeze them and use simulation labels to supervise the historical adapter to imitate z. When deployed, the adaptor updates the latent representation in real time from past actions and feedback, and no longer reads privileged environment parameters.", "上下身分别优化策略，共享全身观测；训练中施加大范围未知操作外力，以逆运动学转换手端目标为上身关节参考。": "Optimize strategies separately for the upper and lower bodies and share whole-body observations; apply a wide range of unknown operating external forces during training, and use inverse kinematics conversion hand targets as upper body joint references.", "。这里使用的只是力矩等于力乘垂直力臂的关系；一个残差不能恢复任意三维力。": ". All that is used here is that the moment equals the force times the vertical moment arm; a residual cannot recover any three-dimensional force.", "是模型预测的机器人状态，": "is the robot state predicted by the model,", "实际承接与仅作背景的关系分开登记在literature/foundations.md；网络知识有助于语义泛化，不直接约束动作可达性、接触力或足支撑安全。": "The relationship between actual undertaking and mere background is registered separately in literature/foundations.md; network knowledge contributes to semantic generalization and does not directly constrain action accessibility, contact force, or foot support safety.", "G1真机四任务每项10次：关抽屉9/10、架上取放8/10、投球3/10、移动取放4/10；另测有无末端预览和身体／足真值oracle。": "G1 real robot, ten trials per task: 9/10 drawer closing, 8/10 shelf pick-and-place, 3/10 ball toss, 4/10 locomotion pick-and-place. Additional motion-generation and oracle-reference comparisons.", "相对运动使末端对齐和接触时机困难，需要视觉或状态历史配合执行。": "Relative motion makes tip alignment and contact timing difficult, requiring visual or state history coordination to perform.", "用可调行为保留同一任务的多种运动解": "One task, multiple locomotion behaviors", "critic使用仿真真值、actor只读部署观察": "critic uses simulation true value and actor read-only deployment observation", "给定末端目标的控制器不会自己找物体，也不会决定应该走近还是倾斜身体来抓取。": "The controller given an end target does not find the object on its own, nor does it decide whether to move closer or tilt to grab it.", "Terrain-Aware WBC的Regularized Online Adaptation小节明确utilize ROA [6]；参考[6]为Deep WBC。地形编码是后作新增。": "The Regularized Online Adaptation section of Terrain-Aware WBC clearly utilizes ROA [6]; refer to [6] for Deep WBC. Terrain coding is a new addition in later games.", "Jacobian伪逆加阈值的粗足接触信号，非充分标定的末端力估计": "Jacobian pseudo-inverse thresholded thick foot contact signal, insufficiently calibrated end force estimation", "正文控制方法/仿真与真机实验审读；附录 B–E、部署/轨迹部分审读；未观看视频/运行代码": "Review of text control methods/simulation and real robot experiments; review of appendix B–E, deployment/trajectory part; not watched video/running code", "是估计优势，": "is the estimated advantage,", "策略、回报、评价网络与信用分配": "Policy, return, critic, and credit assignment", "RoboDuet 通过臂策略请求身体姿态；PAKE 建模多种部分配置；QuadWBG 选有利站位。它们不是同一输出接口，却处理了同一个目标下的配置选择。": "RoboDuet requests body posture through arm strategies; PAKE models multiple part configurations; QuadWBG selects favorable positions. They are not the same output interface, but they handle the configuration selection under the same target.", "正文 §3–7审读；附录 B/C reward/obs/hardware与tactile sim normalization读；未复算全部hyperparam": "Text §3–7 review; Appendix B/C reward/obs/hardware and tactile sim normalization reading; all hyperparams have not been recalculated", "VLA 能识别任务并输出轨迹，但图像可能看不出已顶住、滑动或阻力变化。加入力信号需要确定影响感知、动作还是快速执行。": "VLA can recognize the task and output the trajectory, but the image may not show that it has been pushed back, slid, or the resistance changes. Adding a force signal requires determining whether it affects perception, action, or rapid execution.", "作者全文核心方法、主要实验与限制核读；Proposed Method；Experiment；Table 1–3；Appendix A–F；未运行代码／观看视频，附录覆盖按定位记录": "The author's full text core method, main experiments and restrictions; Proposed Method; Experiment; Table 1–3; Appendix A–F; Code not run/watch video, appendix covers records by location", "都有历史，保存的状态不同": "Different histories store different hidden state", "相较只跟踪姿态的控制器，增加明确的速度要求；相较把奖励混在一起，分组评价使目标冲突和调参更容易处理。": "Compared with controllers that only track posture, clear speed requirements are added; compared with mixing rewards together, grouped evaluation makes target conflicts and parameter adjustment easier to handle.", "非四足，真机成功率低且样本小；没有同平台对照显式底盘动作接口。": "Wheeled platform; low real-robot success and small samples. No same-platform comparison against an explicit-base-command action head.", "采集当前策略的轨迹后，以新旧策略动作概率比构造替代目标，并把该比值裁剪在邻近1的区间；同一批数据做多轮小批量更新。裁剪是抑制过大的策略变化，并非严格的安全约束。": "After collecting the trajectory of the current strategy, construct an alternative target based on the action probability ratio of the old and new strategies, and clip the ratio to an interval close to 1; perform multiple rounds of small batch updates on the same batch of data. Pruning is to suppress excessive policy changes and is not a strict security constraint.", "机器人—物体接触产生等大反向作用。已知物体动力学时，可以先从物体目标计算操作力序列，再作为底盘预测的输入；也可联合优化机器人、物体与力。只把物体重量作为静态附加载荷会漏掉快速举升与回弹的时变反作用。": "Robot-object contact produces equal and large reverse effects. When the object dynamics are known, the operation force sequence can be calculated from the object target first, and then used as input for chassis prediction; the robot, object and force can also be jointly optimized. Only using the weight of the object as a static additional load will miss the time-varying reaction of rapid lifting and rebound.", "$T_{WE}$ 是手端到世界的位姿变换，$T_{WO}$ 是物体到世界的位姿变换；$\\mathrm{old},\\mathrm{new}$ 表示原示范与新场景。上式保持接近段的物体相对手端轨迹。": "$T_{WE}$ is the pose transformation from the hand to the world, $T_{WO}$ is the pose transformation from the object to the world; $\\mathrm{old},\\mathrm{new}$ represents the original demonstration and new scene. The above formula maintains the relative hand trajectory of the object approaching the segment.", "知识视图": "Knowledge View", "相较预先写好的动作步骤，接触顺序和全身运动可以共同求解。它扩大了可规划任务的种类；不是一个从图像自动理解任意任务的系统。": "Compared to pre-written action steps, contact sequences and whole-body movements can be solved together. It expands the variety of tasks that can be planned; it is not a system that automatically understands arbitrary tasks from images.", "延迟到达奖励与超过历史最佳距离的进展奖励": "Delayed arrival rewards and progress rewards that exceed the best distance in history", "同一操作者用领从臂和手持控制器同时示教底盘、姿态、机械臂与夹爪。采集和部署都经过同一机器人侧命令接口，使动作标签直接对应部署量。微调 MolmoAct2 家族的视觉语言骨干和动作头；采用十步动作块，臂作为连续轨迹执行，底盘以较高频线程维持命令。": "The same operator uses the leader-slave arm and handheld controller to simultaneously teach the chassis, attitude, robotic arm and gripper. Both collection and deployment go through the same robot-side command interface, so that the action tag directly corresponds to the deployment amount. Fine-tuned the visual language backbone and action heads of the MolmoAct2 family; using ten-step action blocks, the arms execute as continuous trajectories and the chassis maintains commands in a higher frequency thread.", "PFG以Deep WBC的ROA/advantage mixing作对照；新增IK可达姿态奖励，不是采用新策略优化器。": "PFG uses Deep WBC's ROA/advantage mixing for comparison; a new IK reachable posture reward is added, instead of using a new strategy optimizer.", "区分腿式机器人到底用身体、行走腿、专用臂还是多机器人协作来移动物体。": "Distinguish whether a legged robot uses its body, walking legs, dedicated arms or multi-robot collaboration to move objects.", "示范需能分段；物体几何／机构变化通常不能只靠刚体位姿变换解决。只保存成功轨迹还会改变训练分布。": "The demonstration needs to be segmented; changes in object geometry/mechanism usually cannot be solved by rigid body pose transformation alone. Saving only successful trajectories also changes the training distribution.", "仿真教师知道四种推拉／左右门真值，循环学生只从本体历史与门／把手位置推断响应，输出臂关节目标与基座速度，复用已有行走低层。去掉 recurrence 无法有效模仿，去掉辅助门类型分类损失影响很小，应把历史机制与显式分类分开评价。": "The simulation teacher knows the true values of the four push-pull/left and right doors, and the loop student only infers the response from the body history and door/handle position, outputs the arm joint target and base speed, and reuses the existing walking low-level. Removing recurrence cannot be effectively imitated. Removing the auxiliary gate type classification loss has little impact. The historical mechanism and explicit classification should be evaluated separately.", "先用参考传感器标定，再做信息输入×低层反馈消融，保持动作权限和数据一致。": "First use the reference sensor to calibrate, and then perform information input × low-level feedback ablation to keep the action permissions and data consistent.", "$H_t$汇集近期观测、动作和时钟；$c_t$指定移动速度，$b_t$指定足间相位、步频、身体姿态等行为；$\\theta$是固定网络权重。历史估计速度／摩擦是另外的适应模块，不是$b_t$。这里是简化接口，完整输入见原文§3.2。": "$H_t$ collects recent observations, actions and clocks; $c_t$ specifies movement speed, $b_t$ specifies behaviors such as interfoot phase, stride frequency, body posture, etc.; $\\theta$ is a fixed network weight. Historical estimated speed/friction is another adaptation module, not $b_t$. Here is a simplified interface. For complete input, see §3.2 of the original text.", "这是闭环预测的组成关系，不表示模型已准确，也不表示所有世界模型都用于在线搜索。Sumo 在仿真中运行低层，ReCo 使用低阶辨识近似；DECOWAM 生成未来视频与动作，没有据预测视频做显式在线 MPC 搜索。": "This is the composition relationship of closed-loop prediction. It does not mean that the model is accurate, nor does it mean that all world models are used for online search. Sumo runs low-level in simulation, ReCo uses low-order identification approximation; DECOWAM generates future videos and actions without explicit online MPC search based on predicted videos.", "两阶段、腿臂协作是统一策略之外的重要替代架构，有正式发表和对照；被引用、被当基线与后作实际沿用协作接口是不同证据，目前后者不足以称为默认范式。": "Two-stage, leg-arm collaboration is an important alternative architecture beyond the unified strategy. It has been officially published and compared; being cited and used as a baseline is different evidence from the collaboration interface actually used in subsequent works. At present, the latter is not enough to be called the default paradigm.", "给定角色的混合执行": "Mixed execution of given role", "同一世界／物体参考，比较站立、原地换足、缓慢移动和接触释放；同步测手端误差、力、滑移和耗时。": "The same world/object reference, compare standing, changing feet on the spot, slow movement and contact release; simultaneously measure hand-end error, force, slip and time consumption.", "图文对比学习的语义表示": "Semantic representation of image and text comparison learning", "从实机转移学执行器模型": "Transfer learned actuator model from real robot", "合并机制时核对输入信息、决策变量、约束或目标，以及反馈时序；不同名称不必是不同机制，共享机制也不表示整篇论文没有新贡献。": "When merging mechanisms, check the input information, decision variables, constraints or goals, and feedback timing; different names do not have to be different mechanisms, and sharing a mechanism does not mean that the entire paper has no new contributions.", "是由仿真转移训练出的可微模型，": "is a differentiable model trained by simulation transfer.", "先奖励身体使目标具有IK解，而不是只奖励末端到达": "Reward the body first to make the target have IK solution, instead of only rewarding the end arrival", "是动作与状态价值，": "is the action and status value,", "有真机长程任务，技能库＋语言规划提供完整系统参照；系统广度与学术质量值得读，但尚未核实多支后作沿用其技能接口／cross-attention模块。": "There are real-machine long-range missions, and the skill library + language planning provides a complete system reference; the system breadth and academic quality are worth reading, but it has not been verified that many subsequent games will use its skill interface/cross-attention module.", "多个四足推大物体绕障时，单个机器人局部推进会相互妨碍。输入地图、物体目标和各机器人状态；输出子目标与每台机器人的移动指令。": "When multiple quadrupeds push large objects around obstacles, the partial advancement of a single robot will hinder each other. Input the map, object targets and the status of each robot; output the sub-goals and movement instructions of each robot.", "汇总重力以及随运动产生的科氏、离心项。因此左边是模型根据当前运动计算出的所需广义力。": "Summarize gravity and the Coriolis and centrifugal terms produced with motion. So the left hand side is the required generalized force calculated by the model based on the current motion.", "为当前子任务保存固定语义角色的三维对象槽，跨动作块刷新几何/可见性/关系，再将tokens注入既有action expert；用稳定窗口几何谓词将任务区分为in-progress/done/blocked/failed/uncertain，遇不确定重新观察或重试。": "Save the three-dimensional object slot with a fixed semantic role for the current subtask, refresh the geometry/visibility/relationship across action blocks, and then inject tokens into the existing action expert; use stable window geometry predicates to distinguish tasks into in-progress/done/blocked/failed/uncertain, and re-observe or retry in case of uncertainty.", "输入估计的配置／速度、底盘速度、末端速度／力与固定步态接触时序。优化全身配置、速度、加速度、接触力及近端关节力矩，输出轨迹经500 Hz插值加PD执行；没有额外QP-WBC，不表示没有关节反馈。": "Enter estimated configuration/speed, chassis speed, terminal speed/force and fixed gait contact timing. The whole body configuration, speed, acceleration, contact force and proximal joint torque are optimized, and the output trajectory is performed by 500 Hz interpolation and PD; there is no additional QP-WBC, which does not mean there is no joint feedback.", "$\\rho_t$ 是新旧策略对采样动作的概率比，$\\widehat A_t$ 是优势估计，$\\epsilon>0$ 是裁剪参数；$\\widehat{\\mathbb E}_t$ 表示批次样本平均。PPO 最大化该裁剪代理目标，完整训练还可含价值与熵项。": "$\\rho_t$ is the probability ratio of the new and old strategies to the sampling action, $\\widehat A_t$ is the advantage estimate, $\\epsilon>0$ is the clipping parameter; $\\widehat{\\mathbb E}_t$ represents the batch sample average. PPO maximizes the clipping agent objective, and full training can also include value and entropy terms.", "VLA 条件与独立反馈": "VLA Conditions and Independent Feedback", "输入身体速度和末端位姿目标、本体与臂状态、上一动作；统一输出18关节位置目标。IK求解主要用于训练期可达性奖励及critic信息，不是在部署时替代臂动作头。": "Input body speed and end pose target, body and arm status, and previous action; output 18 joint position targets uniformly. IK solution is mainly used for accessibility rewards and critic information during the training period, and is not used to replace the arm action head during deployment.", "latent 与动作联合蒸馏": "latent and action joint distillation", "使用 K 阶马尔可夫路径优化（KOMO）、可达区域射线投射、神经网络近似和逆动力学 WBC。": "Use K-order Markov path optimization (KOMO), reachable region ray casting, neural network approximation, and inverse dynamics WBC.", "未覆盖条件与比较限制": "Untested conditions and comparison limits", "逐步给每个候选技能计算“语言上合理”和“当前可执行”的组合分数，由低层已训练技能执行；失败或状态改变后可重新评分。它是技能选择接口，不输出连续四足关节动作。": "Gradually calculate the combined score of \"linguistically reasonable\" and \"currently executable\" for each candidate skill, which is executed by the lower-level trained skills; it can be rescored after failure or status change. It is a skill selection interface and does not output continuous quadruped joint movements.", "无 force-torque sensor 作为控制输入，但真机评估有 dynamometer；有walking/locomotion command；不能说这篇仅固定底盘/没有locomotion": "There is no force-torque sensor as control input, but the real robot evaluation has dynamometer; there is walking/locomotion command; it cannot be said that this article only fixes the chassis/does not have locomotion", "ETH→Guided RL为明确直接承接；RoLoMa与ETH按接触决策范围比较。": "ETH→Guided RL is a clear direct undertaking; RoLoMa and ETH are compared according to the contact decision-making scope.", "轮足四足接触VLA的相关新接口：力代理进入动作模型与身体补偿；新预印本，尚无已核实的下游采用。": "New interface related to wheeled quadruped contact VLA: force agent entry into action model and body compensation; new preprint, no verified downstream adoption yet.", "相对于用身体推物，新增主动臂接触与适合推送的接触区域；相对于单一任务奖励，先指导找正确一侧，再奖励移物。导航、推物、重规划是模块系统，不是统一端到端导航RL。": "Compared with pushing objects with the body, new active arm contact and contact areas suitable for pushing are added; compared with single task rewards, first guide to find the correct side, and then reward moving objects. Navigation, push items, and re-planning are module systems, not unified end-to-end navigation RL.", "序列模型预测离散动作": "Sequence model predicts discrete actions", "是生成动作。": "is a generate action.", "另一种用途是让参考提供首次成功，然后用任务回报微调策略偏离参考。Athletic 用任务奖励微调 WBC；SMPC offline-to-online 混入成功经验再逐渐减少旧数据。‘基于示范’应进一步分清示范在运行时是约束、观测还是只用于初始化数据。": "Another use is to have a reference provide first success and then use task rewards to fine-tune the strategy away from the reference. Athletic uses task rewards to fine-tune WBC; SMPC offline-to-online mixes in successful experience and gradually reduces old data. ‘Based on demonstration’ should further clarify whether the demonstration is a constraint, an observation, or just used to initialize data at runtime.", "对相同目标列可控制自由度、共享状态、能否换角色、底层冻结情况。": "For the same target column, the degree of freedom, shared state, whether roles can be changed, and the underlying freezing status can be controlled.", "分割深度瓶颈": "Split depth bottleneck", "例如 UMI on Legs、ReCo、Portela Force Control 都包含全身操作，但分别偏重任务轨迹执行、步态闭环预测和期望力。可先比较同一世界轨迹下的末端跟踪；力控制则另设接触方向和力目标。不能拿其中一种指标代替三种能力。": "For example, UMI on Legs, ReCo, and Portela Force Control all include whole-body operations, but focus on task trajectory execution, gait closed-loop prediction, and expected force respectively. You can first compare the end tracking under the same world trajectory; for force control, set the contact direction and force target separately. One of the indicators cannot be used to replace the three abilities.", "非对称 actor–critic 让评价网络在训练时看额外状态，而动作策略只看可部署观测；教师—学生方法先训练具有更多信息的教师，再让学生从历史或视觉预测教师动作／潜变量。两者都利用仿真信息，但额外信息进入动作策略的方式不同。": "Asymmetric actor–critic allows the evaluation network to look at extra states during training, while the action policy only looks at deployable observations; the teacher-student method first trains teachers with more information, and then lets students predict teacher actions/latent variables from history or vision. Both utilize simulation information, but the way in which the additional information enters the action strategy differs.", "需核对模型训练与部署的状态、动作和低层是否一致；接触事件和对象变化容易产生分布外误差。": "It is necessary to check whether the status, actions and lower layers of model training and deployment are consistent; contact events and object changes can easily produce out-of-distribution errors.", "全部知识": "All concepts", "DQ-Net抓移动对象、目前仿真；Dynamic Pick-and-Place让机器人持续移动抓放，真机对象状态由动捕提供。目标动态与底盘动态要分开。": "DQ-Net captures moving objects and currently simulates them; Dynamic Pick-and-Place allows the robot to continuously move, pick and place, and the real robot object status is provided by motion capture. Target dynamics and chassis dynamics should be separated.", "固定对象轨迹、相机延迟与底盘速度，再评末端相对速度、实际接触与全任务成功；真实观测与特权状态单独消融。": "Fixed object trajectory, camera delay and chassis speed, and re-evaluated terminal relative speed, actual contact and full mission success; real observation and privileged status are ablated separately.", "简化成身体＋臂的轨迹优化可能忽略腿关节极限，使机身抬得过高或压得过低；显式纳入全部腿关节会增加求解开销。": "The trajectory optimization simplified to body + arm may ignore the limits of leg joints, causing the body to be raised too high or pressed too low; explicitly incorporating all leg joints will increase the solution cost.", "VLA显式预测目标力，TO力矩监督训练执行器。": "VLA explicitly predicts the target force and TO moment supervises the training actuator.", "先合并共同机制，再比较输入、输出、控制权限与假设。这里的共同机制不声明直接继承。": "Merge common mechanisms first, then compare inputs, outputs, control permissions, and assumptions. The common mechanism here does not declare direct inheritance.", "筛选结果按首次公开时间排列。": "Filter results are sorted by first public date.", "只取该作用点的平移速度 Jacobian；": "Take only the Jacobian of the translation speed of the action point;", "仿真比较故障下的跟踪与工作空间；真机从地面取物，放到 50、75、90 cm 高的桌面，每个高度、每种故障做 20 次。最难的 90 cm 锁止条件下存活 14/20 次、放置成功 9/20 次，表明维持稳定与完成原任务确有取舍。": "Simulation compares tracking and work space under faults; the real robot picks up objects from the ground and places them on the desktop at 50, 75, and 90 cm high, and does 20 times for each height and each fault. Under the most difficult 90 cm locking condition, it survived 14/20 times and was successfully placed 9/20 times, indicating that there is a trade-off between maintaining stability and completing the original task.", "视觉语言条件下动作token的机器人Transformer": "Robot Transformer with action token under visual language conditions", "RL 与 VLA 各自负责哪些变量？": "Which decisions belong to RL control and which to the VLA?", "估计误差可能大于控制误差，作者指出策略可能没有强依赖估计力反馈。约 5 cm 的位置误差和约 5 N 的力误差不足以证明精细按钮或插接能力。分开的位置／力模式也是后续 Unified 要改进的地方。": "The estimation error may be larger than the control error, and the authors point out that the strategy may not rely strongly on estimated force feedback. A position error of approximately 5 cm and a force error of approximately 5 N are not sufficient to demonstrate fine buttoning or docking capabilities. The separate position/force mode is also an area for improvement in subsequent Unified.", "投掷、举重、拖拽需要动作目标奖励，而只靠末端轨迹模仿限制爆发力；但任务奖励又可能让 RL 利用仿真器的电机误差取巧。": "Throwing, lifting, and dragging require action target rewards, and only relying on terminal trajectory simulation limits explosive power; but task rewards may allow RL to take advantage of the simulator's motor error.", "抽象任务步骤缺少动态控制目标；VLM 从人工关键帧库选标签，再按现场物体重定位，由 RL 控制器追踪，形成有限目标空间的高低层接口。": "The abstract task step lacks dynamic control targets; VLM selects tags from the artificial keyframe library, repositions them according to on-site objects, and is tracked by the RL controller to form a high- and low-level interface with a limited target space.", "不能把 SUF 写成 2023 年首次提出的方法，也不能把该规划器写成在线 MPC；抗扰力余量不构成任意碰撞安全保证。": "SUF cannot be written as a method first proposed in 2023, nor can the planner be written as online MPC; immunity margins do not constitute an arbitrary collision safety guarantee.", "四足＋腿部小臂": "Four legs + legs and forearms", "Table I 定性标签不替代前作全文；总体32/40不能归为独立奖励门控收益。": "Table I Qualitative labels do not replace the full text of the previous work; overall 32/40 cannot be classified as independent reward gating income.", "定义依据": "Basis of definition", "模型前馈加反馈": "Model feedforward plus feedback", "Visual WBC 使用特权教师和视觉高层，QuadWBG 使用现成抓取检测加可达站位，视觉足端示范让扩散策略输出参数化轨迹。应分清网络到底预测了物体状态、动作参考还是控制量，才能定位瓶颈。": "Visual WBC uses privileged teachers and visual high-level, QuadWBG uses ready-made grab detection to add reachable positions, and visual foot-end demonstration allows the diffusion strategy to output parameterized trajectories. It is necessary to distinguish whether the network predicts the object state, action reference or control volume in order to locate the bottleneck.", "单条手端轨迹通常对应多种身体姿态、落脚位置和步态，仅做末端跟踪可能达标却产生不自然或不稳的全身动作。UMI 人手示范没有机器人身体与足轨迹，不能直接监督这些变量。": "A single hand track usually corresponds to a variety of body postures, foot positions and gaits. Only end tracking may achieve the standard but produce unnatural or unstable whole-body movements. The UMI human hand demonstration does not have robot body and foot trajectories and cannot directly monitor these variables.", "则把这个接触力换算成对身体和关节的作用；对一个转动关节，这相当于根据力臂计算力矩。": "converts this contact force into an effect on the body and joints; for a rotating joint, this is equivalent to calculating the moment based on the moment arm.", "是位移。几何参数可以已知或待估计；摩擦、回弹与离散锁扣状态没有被这两式包含。": "is the displacement. The geometric parameters can be known or to be estimated; friction, rebound and discrete locking states are not included in these two equations.", "动态可行扩增": "Dynamic feasible expansion", "§IV：UMI三iPhone共享SE(3)示范采集": "§IV: UMI three iPhone sharing SE (3) demonstration collection", "按过按钮后，怎样知道该停下还是重试？": "After pressing a button, how does the robot decide whether to stop or retry?", "从静态抓取接口到动态任务：复用和差别": "From static grasping to dynamic tasks", "第二行表示一种实际的优势归一化后混合：$\\widehat A_k$ 是估计优势，$\\mu_k,\\sigma_k$ 是归一化统计量，$\\varepsilon>0$ 防止数值问题。归一化、动态权重与近似误差会改变实际更新，不能再直接等同于原始固定加权回报。": "The second line represents an actual mixture of advantages after normalization: $\\widehat A_k$ is the estimated advantage, $\\mu_k,\\sigma_k$ are normalized statistics, and $\\varepsilon>0$ prevents numerical problems. Normalization, dynamic weights, and approximation errors change the actual updates and are no longer directly equivalent to the original fixed weighted returns.", "是实际电机驱动的贡献。前者含惯性、重力和运动项，后者不是期望接触力。": "is the contribution of the actual motor drive. The former contains inertia, gravity and motion terms, while the latter is not the expected contact force.", "遥操作小样本；原文代码仍计划公开。": "Small sample of remote operation; the original code is still planned to be made public.", "三种物体长程障碍推送，多种分层／奖励消融，1–4机器人规模比较；两台真机推方箱和T块。": "Long-range obstacle pushing of three objects, multiple layering/reward ablation, 1–4 robot scale comparison; two real robots pushing square boxes and T blocks.", "是选定的潜空间半径；潜变量径向截断后直接输入低层策略输出关节动作。": "is the selected latent space radius; the latent variable is radially truncated and directly input into the low-level strategy to output joint actions.", "Unitree Go1，无外挂臂，以身体或单腿推物；真机与仿真。": "Unitree Go1, no external arm, push objects with the body or one leg; real robot and simulation.", "估计λcontact和we空间可能重叠；torque command≠true delivered torque；wheeled support/rollingresidual assumptions；hardware全系统验证不隔离每个组件": "It is estimated that λcontact and we spaces may overlap; torque command≠true delivered torque; wheeled support/rollingresidual assumptions; hardware-wide system verification does not isolate each component", "输入：有噪声的机器人和物体状态及任务目标；真机结合机载传感与外部运动捕捉获得状态。训练时先用仿真规划器生成成功经验。 输出：上层输出身体速度和臂关节目标的变化量；已有低层策略生成全身关节角度。Spot 实验不额外调整身体高度和俯仰。": "Input: Noisy robot and object states and mission goals; the real robot combines onboard sensing and external motion capture to obtain the state. During training, the simulation planner is first used to generate successful experience. Output: The upper layer outputs the changes in body speed and arm joint targets; there are already low-level strategies to generate whole-body joint angles. Spot experiments require no additional adjustments for body height and pitch.", "语言选择技能与视觉语言生成全身潜动作是不同接口。": "Language selection skills and visual language generation whole-body latent movements are different interfaces.", "仿真在相同轨迹上比较无约束分解、接触约束分解、单独时序网络与组合估计器，并比较箱子拖动的力误差和实际位移。轮足真机转阀门、擦拭使用仅用于评价的 F/T 传感器作定量参照，开门和人拖动引导提供整套系统的行为验证。": "Simulations compare unconstrained decomposition, contact constrained decomposition, individual timing networks, and combined estimators on the same trajectory, and compare force errors and actual displacements for box dragging. The wheel's real robot turns the valve and wipes using the F/T sensor that is only used for evaluation as a quantitative reference. The door opening and human drag guidance provide behavioral verification of the entire system.", "输入：机器人状态和期望的一段末端轨迹。先编码为任务意图，再限制编码向量的长度，最后由全身策略输出关节动作。安全估计器用于训练时塑造编码空间，部署投影不需要再调用估计器。": "Input: robot state and desired end-effector trajectory. The task intention is first encoded, then the length of the encoding vector is limited, and finally the joint movements are output by the whole body strategy. The safety estimator is used to shape the encoding space during training, and the deployment of projection does not require calling the estimator.", "相同门轨迹或举升轨迹在不同质量、弹簧与摩擦下需要不同力。身体规划若不考虑这个力，可能在操作阶段失衡。": "The same door trajectory or lifting trajectory requires different forces under different masses, springs and friction. If body planning does not take this force into account, it may become unbalanced during the operating phase.", "KL 数据处理不等式不保证任务信息保留或泛化必然提高；接触中不同机构参数可能不可辨识，使用人为统一 articulation vector 而非完整参数；系统不使用腕部力传感器，历史本体是接触相关信号而非实测外力": "KL data processing inequalities do not guarantee that task information will be retained or generalization will inevitably improve; different mechanism parameters in contact may not be identifiable, and artificial unified articulation vectors are used instead of complete parameters; the system does not use wrist force sensors, and the historical ontology is contact-related signals rather than actual measured external forces", "论文只覆盖中等粗糙地面；极限伸手有时仍触发肩关节保护。任务轨迹由外部提供。": "Paper only covers moderately rough ground; ext get and action rate. Report base placement, end-effector error, steps, peak contact force, task success, and recovery separately.", "已有末端跟踪方法或只跟踪位置，或主要覆盖身体前方、平地。本文研究如何站在不平地面上，利用身体与臂的冗余运动准确达到较大工作空间内的六维末端位姿。": "Existing end tracking methods either only track the position, or mainly cover the front of the body and the flat ground. This article studies how to stand on uneven ground and use the redundant movements of the body and arms to accurately achieve the six-dimensional end pose in a larger work space.", "Go2＋AIRBOT 真机演示遥控和图像扩散策略驱动的操作；轨迹抽样、预测网络及误差比较主要在仿真中完成。文中的 DeepWBC 式基线同时移除了未来轨迹预测、轨迹输入和任务坐标系，差异不能只归于网络结构。": "Go2＋AIRBOT real robot demonstrates the operation driven by remote control and image diffusion strategy; trajectory sampling, prediction network and error comparison are mainly completed in simulation. The DeepWBC-style baseline in this article simultaneously removes future trajectory prediction, trajectory input, and task coordinate systems. The difference cannot be attributed solely to the network structure.", "需要腕部 F/T。实际 MOAS 为各轴独立离散采样并通过 KD-tree 近邻查询，不能推出全身耦合混合系统安全；状态估计表未分别消融神经网络／滤波器／低通滤波。": "Requires wrist F/T. The actual MOAS is independently discretely sampled for each axis and queried through KD-tree nearest neighbors, which cannot deduce the safety of the whole-body coupled hybrid system; the state estimation table does not ablate the neural network/filter/low-pass filtering respectively.", "力信息从接触控制延伸到 VLA 动作生成与底盘补偿；平台和传感不同。": "Force information extends from contact control to VLA motion generation and chassis compensation; platform and sensing are different.", "搜索机制、问题或论文，例如力信息、memory": "Search for mechanisms, issues or papers, such as force information, memory", "图文／动作文本token统一预测": "Unified prediction of graphic/action text tokens", "相较直接把图像送给控制网络，显式解决视觉更新慢、坐标随身体移动和暂时看不见的问题，减少外部定位依赖。": "Compared to directly sending images to the control network, it explicitly solves the problems of slow visual updates, coordinates moving with the body and being temporarily invisible, and reduces dependence on external positioning.", "手足目标和力目标的邻接接口": "Adjacency interface for hand-and-foot targets and force targets", "FALCON四足版用文字“正在／已完成”与图像相似度估阶段；Dynamic Pick-and-Place读取显式阶段。两者都不等于在外观不变的按钮任务中检测电气结果或记录已触发事件。": "FALCON four-legged version uses text \"in progress/completed\" and image similarity estimation stage; Dynamic Pick-and-Place reads the explicit stage. Neither amounts to detecting electrical results or recording triggered events in the task of a button with an unchanged appearance.", "是轴上的点，": "is the point on the axis,", "训练行走策略，使速度命令的瞬态与步态相位响应较一致；辨识紧凑闭环滞后／谐波模型，再由 MPC 联合优化身体命令与臂速度。": "Train the walking strategy to make the transient and gait phase responses of the speed command more consistent; identify the compact closed-loop hysteresis/harmonic model, and then use MPC to jointly optimize the body command and arm speed.", "90.1%是最佳条件，不是全部堆物平均。真机姿态容差5°，仿真部分1°；Fig.2正文0.1m、摘要／其他部分0.05m，需按各实验区分。": "90.1% is the best condition, not the average of all piles. The attitude tolerance of the real robot is 5°, and the simulation part is 1°; the main text of Fig.2 is 0.1m, and the abstract/other parts are 0.05m, which need to be distinguished according to each experiment.", "PPO对物理仿真的动作后果用采样和优势估计；SuperMimic通过学习模型对动作后果求导。UMI on Legs给出手端目标到四足执行的接口，和这里的训练优化器可正交组合，但SuperMimic未做这种组合。": "PPO estimates policy updates from sampled actions and advantages in a physics simulator. SuperMimic differentiates predicted action consequences through a learned model. UMI on Legs concerns the interface from end-effector targets to quadruped execution; this training optimizer could in principle be combined with that interface, but the paper does not test the combination.", "主要贡献": "Primary contribution", "真机透明等多类物体抓取，作者报告一次抓取准确率 89%；比较可达信息有无带来的差别。": "For capturing multiple types of objects such as real-machine transparency, the author reports a capture accuracy of 89%; compare the differences caused by the presence or absence of accessible information.", "以大量图文对做对比学习，将匹配的图像文本向量拉近、非匹配样本分开；下游以文本查询视觉内容。": "Use a large number of image and text pairs for comparative learning to bring matching image and text vectors closer and separate non-matching samples; the downstream uses text to query visual content.", "导航 waypoint 与连通关系由人提供；不是从任意场景完全自主建立动作地图；终止标签为演示最后十帧，部署连续十个预测超过 0.8 才终止；不等于物理成功传感验证；30–60 条示范/技能，独立权重，跨技能扩展仍需采集与训练": "Navigation waypoints and connectivity relationships are provided by humans; it is not a completely autonomous action map from any scene; the termination label is the last ten frames of the demonstration, and the deployment is terminated when ten consecutive predictions exceed 0.8; it does not equal physical successful sensor verification; 30–60 demonstrations/skills, independent weights, cross-skill expansion still requires collection and training", "轨迹规划、MPC 与 WBC 的决策范围": "What trajectory planning, MPC, and WBC each decide", "可解析的飞行模型及速度／加速度界使该任务可快速求解，但模型误差、抓取滑移和剩余控制时间仍限制保证。它不是一般接触安全证明，也不意味着所有抓放任务都需要投掷模型。": "Analyzable flight model and velocity/acceleration bounds allow this task to be solved quickly, but model errors, grasping slippage and remaining control time are still limited and guaranteed. It is not certified for general contact safety, nor does it mean that a throwing model is required for all catch and release tasks.", "平台与执行": "Platform and Execution", "VLA 模型基础": "VLA model foundations", "控制器在某类轨迹上练得好，换空间范围不同的操作就变差；遥控时也拿不到未来轨迹。": "The controller is trained well on a certain type of trajectory, but the operation becomes worse when the space range is changed; the future trajectory cannot be obtained during remote control.", "DiPLO将强参考仅作为教师条件，在实际闭环上下文蒸馏到无参考学生，然后用任务奖励优化规划器。它与运行时调节示范phase不同：一个移除部署条件，一个保留示范并修改进度。": "DiPLO conditions the strong reference only as a teacher, distills it into a reference-free student in the actual closed-loop context, and then optimizes the planner with task rewards. It is different from the runtime adjustment demonstration phase: one removes deployment conditions, and one retains the demonstration and modifies the progress.", "§III-D、IV 的 reachability 消融": "§III-D, IV reachability ablation", "是仿真摩擦、校准偏差等条件，": "is the simulated friction, calibration deviation and other conditions,", "ETH多接触工作搜索接触过程并建模对象；ID-MPC固定步态时序、不建对象动力学，解决实时关节级受力一致性。": "ETH multi-contact work searches the contact process and models objects; ID-MPC fixes the gait timing and does not build object dynamics to solve the real-time joint-level force consistency.", "画首次成功时间、最终真实成功率与训练成本；消融提示并固定低层控制、观测和预算。": "Draw first success time, final true success rate, and training cost; ablate prompts and fix low-level controls, observations, and budgets.", "轮式平台没有抬腿接触切换；运动学QP结论不直接外推四足动态安全；几何对齐依赖深度/位姿准确性，双手taskspace仍需机器人模型；wrist视觉细节不是力/触觉反馈，未测接触力闭环": "The wheeled platform does not have leg-raising contact switching; the kinematics QP conclusion does not directly extrapolate the dynamic safety of the quadrupeds; the geometric alignment depends on the depth/pose accuracy, and the two-handed taskspace still requires a robot model; the written visual details are not force/tactile feedback, and the contact force closed loop is not measured", "ROA、GRU 历史估计、视觉模仿和力回归可以共享‘用观测预测隐变量’的思想，但输出、监督和可辨识性不同。": "ROA, GRU historical estimation, visual imitation and force regression can share the idea of ​​‘predicting latent variables with observations’, but the output, supervision and identifiability are different.", "正文完整方法、实验与结论；附录 A.1–A.6 的奖励、外力、硬件与补偿限制审读": "Full text of methods, experiments and conclusions; review of rewards, external forces, hardware and compensation restrictions in Appendices A.1–A.6", "把这些力矩放到全身变量对应的位置；身体没有直接驱动自身六个自由度的电机，所以不能给它直接填入一组独立电机力矩。": "Place these torques at positions corresponding to the whole body variables; the body does not directly drive its own six-degree-of-freedom motor, so it cannot directly fill in a set of independent motor torques.", "四种门／洗碗机任务，各 4096 个仿真测试，比较固定时钟、最近参考搜索、自适应进度及消融。拉门任务的固定时钟与完整方法成功率为 15.38%／96.33%，定义为完成示范进度超过 95%；主要增益来自自适应推进，进度残差的平
