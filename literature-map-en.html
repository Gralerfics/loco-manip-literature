ry prediction of fixed gripper", "知识节点与学习前置关系。方向键平移，加减键缩放，Home适合窗口。": "Knowledge nodes and learning pre-relationships. The arrow keys translate, the plus and minus keys zoom, and Home fits the window.", "随机采样足端目标区域、持续时间及步态组合，训练跟踪给定接触计划的策略；通过接触事件奖励和对称数据增强提高复用性。上层仍负责给出计划，策略本身不发现完整物体操作序列。": "Randomly sample foot-end target areas, durations, and gait combinations to train a strategy for tracking a given contact plan; improve reusability through contact event rewards and symmetric data augmentation. The upper layer is still responsible for giving the plan, and the strategy itself does not discover the complete object operation sequence.", "MoGe 深度将人眼图像重投影到机器人视高，再补缺失图像；以相对末端动作、离散移动和夹爪统一表示，人／机器人数据共同训练 π0.5。移除本体减少域差，但作者同时指出精细朝向变得模糊；补洞也可能产生错误几何。": "MoGe depth reprojects the human eye image to the robot's visual height, and then fills in the missing image; it is uniformly represented by relative end movements, discrete movements and grippers, and human/robot data are jointly trained π0.5. Removing the body reduces the domain difference, but the authors also point out that fine orientation becomes blurred; hole filling may also produce incorrect geometry.", "四足行走（无臂）": "Walking on four legs (without arms)", "桌面操作方法不能自动成为四足 loco-manipulation 证据。": "Desktop manipulation methods are not automatically evidence of quadrupedal loco-manipulation.", "确定动作模型负责什么，以及何时根据结果更新。": "Determine what the action model is responsible for and when it is updated based on the results.", "是策略自身执行产生的观测分布。二者通常不同，小误差会改变后续状态；更多离线数据不自动覆盖所有闭环偏离。": "is the observation distribution produced by the execution of the strategy itself. The two are usually different in that small errors will change subsequent states; more offline data does not automatically cover all closed-loop deviations.", "视觉技能加规划与身体／手臂分解的 world-action model 是不同的长程接口；DECOWAM 为轮足。": "The world-action model of visual skills plus planning and body/arm decomposition are different long-range interfaces; DECOWAM is the wheel foot.", "核读订正": "Corrections after reading", "固定任务frame末端轨迹和preview作为层间接口；UMI真实数据学任务DP、sim无需物体资产学WBC；异步频率实现": "Fixed task frame end-effector trajectory and preview as inter-layer interfaces; UMI real data learning tasks DP and SIM do not require object assets to learn WBC; asynchronous frequency implementation", "是根据上一步动作预测的状态信念；": "is the state belief predicted based on the previous action;", "机器人只有碰到正确位置并完成动作才收到成功奖励，从随机关节动作开始可能很久都找不到首次成功。": "The robot only receives success rewards when it touches the correct position and completes the action. It may take a long time to find the first success starting from random joint actions.", "平地动力学随机化＋执行器辨识，与行为选择分别作用": "Flat Earth Dynamics Randomization + Actuator Identification, which works separately from behavior selection", "分阶段数据使用": "Phased data usage", "可以先让步态策略不仅准确跟踪速度，还对变化条件产生相对一致的动态响应，再辨识增益、时常和周期摆动。规划器据此预测身体未来位置与姿态，联合安排机械臂速度，提前补偿可预测的部分。": "You can first allow the gait strategy to not only accurately track speed, but also produce a relatively consistent dynamic response to changing conditions, and then identify the gain, duration, and periodic swings. The planner predicts the future position and posture of the body based on this, jointly arranges the speed of the robotic arm, and compensates for the predictable parts in advance.", "IK有解率是近似可达性指标，不是工作空间体积": "IK solution rate is an approximate reachability index, not the workspace volume", "是裁剪参数；": "is the cropping parameter;", "模型误差、参数可辨识性和接触几何要明确；质量与摩擦在有限匀速推物数据中可能混淆。": "Model errors, parameter identifiability and contact geometry must be clear; mass and friction may be confused in finite constant speed push object data.", "【真机】两类抽屉任务：走近→开抽屉→取玩具→放入，以及携物→走近→放入→关抽屉。同50条示范，CDP／ACT／LatentToM及阶段／对比损失消融，每任务15次（3初始区域各5）。正文报告Task2完整15/15，并另有子系统人工接管试验。": "[real robot] Two types of drawer tasks: approaching → opening the drawer → taking toys → putting them in; and carrying objects → approaching → putting them in → closing the drawer. Same as the 50-item demonstration, CDP/ACT/LatentToM and stage/contrast loss ablation, 15 times per task (5 for each of the 3 initial areas). The main text reports that Task2 is complete 15/15, and there is also a subsystem manual takeover test.", "不加专用机械臂，能否让一条前腿既准确触物又在目标远离时主动迈步扩大工作空间？输入足端目标位置，RL 控制器输出全身运动；走步从追踪远端目标的策略中出现。": "Without adding a special robotic arm, can one front leg accurately touch an object and actively step forward to expand the working space when the target is far away? Inputting the foot target position, the RL controller outputs whole-body motion; walking emerges from a strategy for tracking the distal target.", "区域中心不等于把手接触点；VLM 不生成未定义技能；执行延迟与无真机验证限制结论。": "The center of the area is not equal to the handle contact point; VLM does not generate undefined skills; execution delay and no real robot verification limit the conclusion.", "固定／移动机械臂数据": "Fixed/mobile robot arm data", "把不同网络命名为 agent、expert 或 policy 不构成独立知识；若决策变量、信息和训练目标一致，应放进同一结构类别，再比较实现。": "Naming different networks agent, expert or policy does not constitute independent knowledge; if the decision variables, information and training goals are consistent, they should be put into the same structural category and then compared and implemented.", "§3：Sigma Points、EgoKF、遮挡训练、课程": "§3: Sigma Points, EgoKF, occlusion training, courses", "人形／低层行走策略不是四足证据，无明确力／触觉安全闭环。潜表示分开不取消物理耦合；印刷平滑公式存在恒定输入趋零的问题，复现须核对代码。": "Humanoid/low-level walking strategy is not quadrupedal evidence, no clear force/tactile safety closed loop. Separating the latent representation does not cancel the physical coupling; the printing smoothing formula has a problem of constant input tending to zero, and the code must be checked to reproduce.", "方法／实机评估": "Method/real robot evaluation", "降低 PD 增益也产生一定顺应，但没有统一的笛卡尔受力目标；平滑轨迹只是改变输入，不能替代接触响应设计。": "Reducing the PD gain will also produce a certain compliance, but there is no unified Cartesian force target; the smooth trajectory only changes the input and cannot replace the contact response design.", "第一式是潜在函数塑形，": "The first formula is potential function shaping,", "仿真核心是重放任务轨迹；七条轨迹不等于七任务自主语义；轨迹预测对突然改变上游存在假设": "The core of the simulation is to replay the task trajectory; seven trajectories do not equal seven task autonomous semantics; trajectory prediction has assumptions about sudden changes in the upstream", "非对称actor／critic的训练信息分配": "Asymmetric actor/critic training information distribution", "实际承接与仅作背景的关系分开登记在literature/foundations.md；跨平台动作适配与身体动力学稳定是不同问题；本库引用多数为背景，未核到四足＋臂论文直接使用Octo权重。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; cross-platform action adaptation and body dynamics stabilization are different issues; most of the references in this library are background, and the quadruped + arm papers are not reviewed and Octo weights are used directly.", "视觉高层给身体／末端命令，腿RL与臂IK执行。": "The high-level vision team gives commands to the body/end, and the legs RL and arm IK execute them.", "是专家动作，": "is an expert action,", "关系说明": "Relationship details", "实验与证据": "Experiments and evidence", "筛选结果": "Filter results", "§III-A–C；§IV-B–D；Tables I–III；Appendix VI-D 对应正文评价定义": "§III-A–C; §IV-B–D; Tables I–III; Appendix VI-D corresponding text evaluation definitions", "显示知识目录": "Show knowledge directory", "原任务主要静态物体；部署接口不等于所有新任务通用。": "The original task is mainly a static object; the deployment interface is not universal for all new tasks.", "机器人轨迹数据量有限，传统动作策略不易利用互联网视觉语言知识识别未见对象和指令。": "The amount of robot trajectory data is limited, and traditional action strategies cannot easily use Internet visual language knowledge to identify unseen objects and instructions.", "用实机状态转移监督仿真执行器残差模型；预训练 WBC 后对任务奖励微调，突破冻结低层的权限。对低质量球重复投掷加计时阶段变量。": "Use real robot state transfer to supervise the simulation actuator residual model; fine-tune task rewards after pre-training WBC to break through the freezing of low-level permissions. Added timing phase variable to repeated throws of low mass balls.", "Digit人形，20驱动关节；邻接全身接触操作": "Digit humanoid, 20 actuation joints; adjacent full body contact operation", "正文 §III–VI 方法和主要实验完整审读；附录D/E/G训练与评价定位核查，未全面逐式复算SO(3)推导与全部附录": "Text §III–VI Complete review of methods and main experiments; appendix D/E/G training and evaluation positioning verification, incomplete recalculation of SO(3) derivation and all appendices", "正文 §II–IV 方法、训练、全部主要实验与结论审读；未逐项审读参考文献／观看视频": "Text §II–IV Methods, training, review of all main experiments and conclusions; references/videos not reviewed one by one", "坐标变换到": "Coordinate transformation to", "Guided RL 明确使用前作多接触规划生成的示范训练反馈执行。": "Guided RL explicitly uses the demonstration training feedback execution generated by the previous multi-contact planning.", "DeepRobotics X20＋Unitree Z1；仿真另含Aliengo＋Z1": "DeepRobotics X20+Unitree Z1; simulation also includes Aliengo+Z1", "不同论文可共享PPO，却改变动作空间、观测、奖励、先验和状态分布。critic是训练期的价值估计器，不一定部署；多个critic、多个动作头与多个独立策略是不同结构。奖励中的力矩／动作平滑惩罚表达偏好，不保证每一步满足上限。": "Different papers can share PPO, but change the action space, observations, rewards, priors and state distributions. The critic is a value estimator during the training period and is not necessarily deployed; multiple critics, multiple action heads and multiple independent strategies are different structures. The torque/movement smoothing penalty in the reward expresses preference and does not guarantee that each step meets the upper limit.", "Sumo在仿真预测内执行低层；ReCo使用辨识闭环模型做MPC；DECOWAM联合视频与动作生成而非在线搜索；DiPLO生成全身及物体轨迹交给跟踪器。": "Sumo executes low-level layers within simulation predictions; ReCo uses a recognition closed-loop model for MPC; DECOWAM combines video and action generation instead of online search; DiPLO generates full body and object trajectories and sends them to the tracker.", "是比例和微分增益，": "is the proportional and differential gain,", "锁扣建模边界": "Lock modeling boundary", "步态历史适应物理变化；SOMA隐式编码推物响应；POT保留对象角色并验证几何结果；投球timer只标记阶段执行。历史长度相同也不是相同方法。": "Gait history adapts to physical changes; SOMA implicitly encodes object response; POT retains object roles and verifies geometric results; pitching timer only marks phases for execution. The same length of history is not the same method.", "动捕和已知可移动障碍；不是力安全评测。": "Motion capture and known movable obstacles; not a force safety review.", "正文核读 · ": " · full-text review · ", "相较 Visual WBC 直接从图像学动作，显式加入抓取姿态和身体可达关系，减少学习负担，扩大抓取高度范围。": "Compared with Visual WBC, it learns actions directly from images and explicitly adds the relationship between grasping posture and body reach, which reduces the learning burden and expands the grasping height range.", "Unitree Go1＋WidowX 250S，四足＋机械臂": "Unitree Go1＋WidowX 250S, four legs + robotic arm", "是含待校准参数或网络": "contains parameters or network to be calibrated", "· 首次公开": "· First public", "$H$ 是想象轨迹长度（论文默认32步），$\\hat r$ 是模型中的任务奖励，$\\hat c$ 是预测尚未终止的软权重，$V_\\psi$ 是窗口之后的价值估计。更新策略时经 $f_\\omega$ 反向传播；物理仿真器本身无需可微。": "$H$ is the imagined trajectory length (the paper defaults to 32 steps), $\\hat r$ is the task reward in the model, $\\hat c$ is the soft weight of the prediction that has not been terminated, and $V_\\psi$ is the value estimate after the window. The updated policy is backpropagated via $f_\\omega$; the physics simulator itself does not need to be differentiable.", "几何／机构改变、生成失败与代理任务定义限制覆盖。": "Geometry/mechanism changes, generation failure, and agent task definition limit overrides.", "站位可达图": "Site accessibility map", "为环境作用于机器人的力。某些论文使用反向差值": "is the force exerted by the environment on the robot. Some papers use reverse difference", "不覆盖四足移动稳定性与足端接触分配。": "Does not cover quadruped movement stability and foot contact distribution.", "MAPPO／PPO、RRT、WTW 步态；仿真底层拟合 Unitree 真机内置控制器响应。": "MAPPO/PPO, RRT, WTW gait; simulate the underlying fitting Unitree real robot built-in controller response.", "只给一连串末端位置，不能直接要求移动速度；走路希望身体平稳，伸手又可能需要倾斜，两者训练目标冲突。": "Only a series of end positions are given, and the movement speed cannot be directly required. When walking, you want your body to be stable, and when you reach out, you may need to lean. The two training goals conflict.", "DQ-Net正文以预训练Contact-GraspNet产生抓取姿态候选，再结合身体控制和视觉跟踪。": "The main text of DQ-Net uses pre-trained Contact-GraspNet to generate grasping gesture candidates, and then combines body control and visual tracking.", "动作块及时间集成处理模仿执行": "Action block and time integration processing imitation execution", "结构与说明": "Structure and explanation", "相同运动学，目标附着位置不同": "Same kinematics, different frames for the target", "抓取进入工作空间后速度设零。台阶1.6cm位置误差为身体坐标FK，不是固定世界接触误差；奖励门控是软优先级。": "Set the speed to zero after grabbing into the workspace. The 1.6cm position error of the step is the body coordinate FK, not the fixed world contact error; reward gating is a soft priority.", "本质相似与实质差别": "Essential similarities and substantial differences", "动作块衔接": "Action block connection", "VR 位姿示范不等于任意人视频；前腿和坐姿双手操作未验证全范围行走接触。作者也提醒 validation action L1 不总对应部署表现。": "VR posture demonstration is not equal to any person's video; the front leg and sitting position two-hand operation have not verified the full range of walking contact. The author also reminds that validation action L1 does not always correspond to deployment performance.", "从已经抓住物体的状态开始，不涉及自主找物、初始抓取或任务规划。逐帧归一化触觉保留相对接触图案，不能据此保证绝对握力阈值。真机基线同时采用固定夹爪且没有触觉，不能把成功率差单独归因于触觉输入。": "Starts from a state where the object has been grasped, and does not involve autonomous object finding, initial grasping or task planning. Frame-by-frame normalized haptics preserve relative contact patterns, from which absolute grip force thresholds cannot be guaranteed. The real robot baseline also uses a fixed gripper and no haptics, so the difference in success rate cannot be attributed to tactile input alone.", "GMO、QP、TCN、PPO、多critic、virtual spring力训练": "GMO, QP, TCN, PPO, multi-critic, virtual spring force training", "接受语言或目标图像条件及不同观察token，输出可适配目标机器人的动作序列。": "Accepts language or target image conditions and different observation tokens, and outputs action sequences that can be adapted to the target robot.", "WholeBodyVLA、FWBC-VLA等列为VLA背景；未登记直接模块继承。": "WholeBodyVLA, FWBC-VLA, etc. are listed as VLA backgrounds; direct module inheritance is not registered.", "门演示不是实机；0.25 秒起升 10 kg 是仿真结果，报告的真机最大载荷为 8 kg。": "The door demonstration is not a real robot; the 10 kg lift in 0.25 seconds is a simulation result, and the reported maximum load for the real robot is 8 kg.", "WholeBodyVLA将OpenVLA-OFT微调到同一高层离散移动指令和双臂动作，用作比较基线。": "WholeBodyVLA fine-tunes OpenVLA-OFT to the same high-level discrete movement instructions and double-arm movements, used as a baseline for comparison.", "将作者此前站立情况下的最小不可抵抗外力（SUF）优化扩展到预设接触切换的全身轨迹，同时优化落足位置，主动保留抗外力余量。": "The author’s optimization of the minimum irresistible external force (SUF) in the previous standing situation is extended to the whole body trajectory of the preset contact switching, while optimizing the footing position and actively retaining the margin of resistance to external forces.", "先以异步随机关节臂运动和负载训练抗扰步态，避免只覆盖平滑末端插值；再把抓取、搬运、放置与撤臂放在单个episode中训练任务策略。六阶段奖励给当前子目标，同时保留后续回报；同步各子任务成功率驱动距离／质量／放置容差课程。历史估计器以仿真质量和接触真值监督，其输出直接给任务actor。": "First use asynchronous random joint arm motion and load to train anti-disturbance gait to avoid covering only smooth end interpolation; then put grabbing, handling, placement and arm withdrawal in a single episode to train the task strategy. The six stages reward the current sub-goal while retaining subsequent rewards; synchronizing the success rate of each sub-task drives the distance/quality/placement tolerance course. The history estimator is supervised with simulation quality and exposure to ground truth, and its output is given directly to the task actor.", "响应 shaping × 模型辨识做 2×2 对照；测未见命令预测和真实跟踪，另错移步态相位检验相位作用。": "Respond to shaping × model identification and do 2×2 comparison; test command prediction and real tracking, and shift the gait phase to check the phase effect.", "相较固定底座模型，把身体、臂和相机移动的不同作用显式分开；着重减少适配参数并改善预测和全身配合。": "Explicitly separate the different roles of body, arm and camera movement compared to fixed-base models; focus on reducing adaptation parameters and improving prediction and whole-body fit.", "通用机械臂": "Universal robotic arm", "是示范数据，": "is demonstration data,", "都叫residual，修改的变量不同": "Residual methods change different variables", "相较仅输出关节角度的学习控制器，保留显式施力计算；相较纯模型控制，增加对扰动和模型误差的适应。不能简化成网络直接加一组力矩。": "Compared with the learning controller that only outputs joint angles, it retains explicit force calculation; compared with pure model control, it increases the adaptability to disturbances and model errors. It cannot be simplified to the network directly adding a set of moments.", "导航终点应满足后续操作条件": "Choose navigation goals that permit manipulation", "给低层未来若干末端目标可让它提前分配身体和臂动作。预览长度、轨迹采样频率与目标所在参考系共同构成接口。它不是无条件的‘记忆’：预览描述未来计划，历史描述过去观测。": "Giving the lower level a number of future end goals allows it to allocate body and arm movements in advance. The preview length, trajectory sampling frequency and reference system of the target together form the interface. It is not an unconditional 'memory': preview describes future plans, history describes past observations.", "位姿延迟与定时限制": "Posture delay and timing restrictions", "方法运动生成和WBC接口；Table V与真机任务图表": "Method motion generation and WBC interface; Table V and real robot task chart", "以一个行为条件策略保留多种速度跟踪解，部署时选择其泛化方式；RoboDuet、Visual WBC、Terrain-Aware WBC明确沿用步态／接触时序部分。原作是行走控制基础，不是四足＋臂操作控制器。": "Use a behavioral condition strategy to retain multiple speed tracking solutions, and select its generalization method when deploying; RoboDuet, Visual WBC, and Terrain-Aware WBC explicitly use the gait/contact timing part. The original work is based on walking control, not a four-legged + arm operating controller.", "ANYmal-D，无外挂臂，以足端操作。": "ANYmal-D, no external hanging arm, foot-end operation.", "T-Mech 综述参考文献 [83] 收录 RoLoMa。": "T-Mech review reference [83] included in RoLoMa.", "把它换算成全身作用；": "Convert this into a systemic effect;", "$\\mathcal C_{\\mathrm{kin}},\\mathcal C_{\\mathrm{dyn}},\\mathcal C_\\pi$ 分别表示当前状态 $s$ 下的运动学可达、动力学可行及现有策略能力。这里没有为三者指定统一的精确集合模型，也不能未经条件论证就将它们视为同一个集合。": "$\\mathcal C_{\\mathrm{kin}},\\mathcal C_{\\mathrm{dyn}},\\mathcal C_\\pi$ respectively represent the kinematic reachability, dynamic feasibility and existing strategy capability under the current state $s$. There is no unified precise set model specified for the three, nor can they be regarded as the same set without conditional argumentation.", "是物体的配置、速度、惯量和动力学项；": "is the configuration, velocity, inertia and dynamic terms of the object;", "按物体交互形式和机器人形态组织已有工作，并比较被操作物体与机器人的尺寸关系。": "Organize existing work according to object interaction form and robot form, and compare the size relationship between the manipulated object and the robot.", "参考轨迹在移动身体上怎样执行": "Executing a reference trajectory on a moving body", "。各力与 Jacobian 需使用相容坐标系。这条动力学关系本身不提供稳定性或安全保证。": ". Each force and Jacobian need to use compatible coordinate systems. This dynamic relationship by itself provides no guarantee of stability or security.", "第一式是潜在函数塑形，$\\Phi$ 是状态潜在函数，$\\gamma$ 是折扣。保持最优策略的结论需要相应的状态、折扣和终端处理条件。例如回合终止时令终止状态的势函数为零，可避免残余终端项改变目标；任意靠近目标奖励没有相同保证。": "The first formula is latent function shaping, $\\Phi$ is the state latent function, and $\\gamma$ is the discount. Maintaining the conclusion of the optimal policy requires corresponding status, discount, and terminal processing conditions. For example, when the round ends, setting the potential function of the terminal state to zero can prevent the residual terminal term from changing the target; there is no guarantee of the same reward for being arbitrarily close to the target.", "正文 §1–5 与完整附录 §7–10审读，cost misc浏览；未看视频和代码": "Main text §1–5 and complete appendices §7–10 for review, cost misc for viewing; no video or code viewed", "$I-J_E^\\dagger J_E$ 投影到 Jacobian 的零空间。期望速度在 $J_E$ 的值域内时，该表达能精确满足速度任务；否则伪逆只给最小二乘解。": "$I-J_E^\\dagger J_E$ projects into Jacobian null space. This expression accurately satisfies the speed task when the expected speed is within the range of $J_E$; otherwise the pseudo-inverse only gives a least squares solution.", "位置／阻抗／混合控制器、Transformer行为克隆、既有全身执行结构。": "Position/impedance/hybrid controller, Transformer behavior clone, existing whole-body execution structure.", "面向通用 TAMP，不给出四足足接触性能结论；预印本 2024 年公开，期刊卷期为 2025 年。": "For general TAMP, no conclusion on quadruped foot contact performance is given; the preprint will be released in 2024, and the journal issue will be in 2025.", "教师动作必须在对应状态仍有意义；强教师参考、物体真值或仿真模型是额外先验。": "Teacher actions must still be meaningful in the corresponding state; strong teacher reference, object true value or simulation model are additional priors.", "GR00T N1.7 action expert与SAM3为复用基础；任务schema/条件可人工设置或VLM计划；verifier thresholds需配置，不是由VLA自动发现全部逻辑": "GR00T N1.7 action expert and SAM3 are the basis for reuse; task schema/conditions can be set manually or planned by VLM; verifier thresholds need to be configured, not all logic is automatically discovered by VLA", "知识目录": "Concept index", "用滑动窗口内的物体／机器人轨迹匹配加先验正则，替代固定离线系统辨识；异步将更新的物体／地形参数送入采样 MPC。": "Use object/robot trajectory matching within the sliding window plus a priori regularization to replace fixed offline system identification; asynchronously send updated object/terrain parameters to the sampling MPC.", "末端接口需要一致的任务坐标、时间戳、目标预览和可行性检查；若只是换 VLA 动作头，固定臂动作标签、机器人视角与四足执行能力仍需对齐。": "An end-effector interface needs a consistent task frame, timestamps, trajectory preview, and feasibility checks. Replacing a fixed-arm policy with a VLA action head still requires alignment of action labels, camera viewpoint, and quadruped execution capability.", "把动作引起的感知质量变化纳入学习闭环；与直接鼓励目标留在视野内的奖励比较。相比仅规定末端轨迹，策略还要决定移动、时序和主动观察行为。": "Incorporate changes in perceptual quality caused by actions into the learning closed loop; compare with rewards that directly encourage the target to stay in the field of view. Rather than just specifying end trajectories, policies also determine movement, timing, and active observation behavior.", "新环境的行为选择主要由人完成；没有证明策略能自动识别并选择最优行为。MoB有效依赖“学到的行为中至少有一个适合目标环境”，不是任意OOD保证；行为约束可能降低平地最高速度／转弯组合性能。正文平台测试10 s、Appendix C图8为20 s设置，需分别保留。站宽／相位影响姿态稳定不等于保证手端轨迹或接触力安全；换上机械臂需要额外训练／验证。": "Behavior selection in new environments is mainly done by humans; there is no proven strategy that can automatically identify and select optimal behaviors. MoB effectively relies on \"at least one of the learned behaviors being suitable for the target environment\", which is not an arbitrary OOD guarantee; behavioral constraints may reduce the flat top speed/turn combination performance. The text platform test is 10 s, and Appendix C Figure 8 shows the 20 s setting, which needs to be kept separately. The impact of stance width/phase on posture stability does not mean ensuring the safety of the hand trajectory or contact force; switching to a robotic arm requires additional training/verification.", "末端欠约束表示存在多个可能的身体与足动作；它不推出高层必须控制这些自由度。验证两种接口应使用同一机器人、任务、观测与数据预算。": "End underconstraint means that there are multiple possible body and foot movements; it does not imply that higher levels must control these degrees of freedom. Verify that both interfaces use the same robot, task, observation, and data budget.", "已阅读腿可达区域／余量与神经网络近似、KOMO 目标／约束、控制器、两个实验和结论。": "Read Leg Reachable Area/Margin with Neural Network Approximation, KOMO Objectives/Constraints, Controller, Two Experiments and Conclusions.", "摘要称仿真训练和扩展实验，未明确说明真机与数量；全文 PDF 未取得，因此仅保留摘要层面的判断。": "The abstract refers to simulation training and extended experiments, but the actual machine and quantity are not clearly stated; the full text PDF is not available, so only the judgment at the abstract level is retained.", "DemoHLM承接MimicGen式分段重定向，用复用控制器在仿真执行并保留成功轨迹。DiPLO先用采样轨迹优化对重定向动作作动态修正，再扩增扰动初始条件与对称变换。二者都生成数据，但一个依靠执行过滤，一个在生成环节加入动态优化，先验和计算成本不同。": "DemoHLM undertakes MimicGen-style segmented redirection, uses a reuse controller to execute in simulation and retains the success track. DiPLO first uses sampling trajectory optimization to dynamically correct the redirection action, and then amplifies the perturbation initial conditions and symmetry transformation. Both generate data, but one relies on execution filtering, and the other adds dynamic optimization in the generation process, with different a priori and computational costs.", "残差RL、PPO、PD、域随机化、执行器网络、已有tube acceleration的释放鲁棒性模型。": "Residual RL, PPO, PD, domain randomization, actuator network, and release robustness model of existing tube acceleration.", "来源与用途": "Sources and use", "手端目标欠约束与人形运动生成": "Mobile target under-constraint and humanoid motion generation", "小样本、重复试验、不同起始条件与失败定义要记录；‘比 baseline 好’不是普遍机制证明。": "Small samples, repeated experiments, different starting conditions and failure definitions must be recorded; ‘better than baseline’ is not a universal mechanism proof.", "真机laundry200demos成功90%/20，delivery166demos85%/20，table115demos80%/20；只wrist20/15/0%，RGBonly0/45/0%，headonly0/5/0，no neck75/55/55；多任务消融支持局部/整体与主动视线互补；使用同款夹爪及ARKit测得的头/腕pose；robot/data的167/182cm高度迁移不等于任意人视频/机器人形态通用；policy10Hz、底层500Hz、IK100Hz；按timestamp对齐图像/本体并丢弃已过去动作": "real robot launchry200demos success 90%/20, delivery166demos85%/20, table115demos80%/20; only wrist20/15/0%, RGBonly0/45/0%, headonly0/5/0, no neck75/55/55; multi-task ablation supports local/whole and active line of sight complementation; head/wrist pose measured using the same gripper and ARKit; robot/data's 167/182cm height migration is not equal to any human video/robot form; policy10Hz, bottom layer 500Hz, IK100Hz; align image/body according to timestamp and discard past actions", "接触顺序预设；离线计划仍需真实反馈。": "Contact sequence preset; offline planning still requires real feedback.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；原作没有机械臂或物体操作；两阶段适应训练的目标与后续Deep WBC的联合ROA安排不同。": "The relationship between actual undertaking and background creation is separately registered in literature/foundations.md; the original work does not have robotic arms or object operations; the goals of the two-stage adaptation training are different from the subsequent joint ROA arrangement of Deep WBC.", "是环境作用在机器人接触处的物理力；": "is the physical force exerted by the environment on the contact point of the robot;", "多形态机械臂／移动机械臂": "Multi-shaped robotic arm/mobile robotic arm", "分别报告教师上限、学生下降、观测噪声与域变化；只比较学生最终成功率不能判断瓶颈来自控制还是感知。": "Report teacher upper limit, student decline, observation noise and domain change respectively; only comparing the final success rate of students cannot determine whether the bottleneck comes from control or perception.", "§V，Table IV：末端轨迹误差": "§V, Table IV: Terminal trajectory error", "保留已有模型或行为，再学习修正。": "Keep the existing model or behavior, and then learn and modify it.", "Athletic主要优化投掷距离／动态任务；Accurate Throwing量化给定目标落点与释放时刻误差。没有核实执行器网络直接继承。": "Athletic mainly optimizes throwing distance/dynamic tasks; Accurate Throwing quantifies the error between the landing point and release time of a given target. Direct inheritance of executor networks is not verified.", "要事先提供物体模型和可接触区域，步态模板及接触建立／释放的短时结构仍有预设。在线 MPC 主要调整已有计划的连续运动，并为计算速度去掉物体状态；接触大幅偏离后，整套接触顺序不会自动重算。": "The object model and contact area must be provided in advance. The gait template and the short-term structure of contact establishment/release are still preset. Online MPC mainly adjusts the planned continuous motion and removes the object state for calculating speed; after the contact deviates significantly, the entire contact sequence will not be automatically recalculated.", "$P,Q$ 是输入分布，$P_\\phi,Q_\\phi$ 是它们经同一映射得到的分布。第二式是 KL 散度的数据处理不等式；处理不增加该分布差异，但不保证任务信息被保留或成功率提高。": "$P,Q$ are the input distributions, and $P_\\phi,Q_\\phi$ are their distributions obtained by the same mapping. The second formula is the data processing inequality of KL divergence; processing does not increase the distribution difference, but does not guarantee that task information is retained or the success rate is improved.", "臂推物动作可经全身跟踪器执行，并接导航重规划。": "The arm pushing action can be executed through the whole body tracker and connected to navigation re-planning.", "§4说w/oFE用groundtruthlabels，却§4.2解释为cannotperceivedamage，消融因果叙述矛盾；AppendixC训练整腿3jointsweakening，§6single-actuator措辞需区分；不是完成walkingforce任务": "§4 says w/oFE uses groundtruthlabels, but §4.2 explains it as cannotperceivedamage, which dissolves the contradiction in causal narrative; AppendixC trains whole leg 3jointsweakening, and §6 single-actuator wording needs to be distinguished; it is not a walking force task.", "主要输入仍是外部给出的移动和末端命令；跨相似硬件迁移不等于跨任意机器人或任务。消融中两阶段训练主要改善抗扰存活率，合作分工主要改善姿态跟踪，不能将两个组件的收益混为一项。": "The main input is still the movement and terminal commands given externally; migration across similar hardware does not mean across any robot or task. The two-stage training in ablation mainly improves the anti-interference survival rate, and the cooperative division of labor mainly improves posture tracking. The benefits of the two components cannot be mixed into one.", "直接输出力矩、给 WBC 输出目标加速度、给阻抗控制器输出刚度，以及给已有步态输出身体速度，是不同层次。比较学习方法之前应先把输出单位、频率、饱和限制和低层增益列出来，否则可能把底层控制差异误归因于策略。": "Directly outputting torque, outputting target acceleration to WBC, outputting stiffness to impedance controller, and outputting body speed to existing gait are different levels. Output units, frequencies, saturation limits, and low-level gains should be listed before comparing learning methods, otherwise low-level control differences may be misattributed to the strategies.", "方法机制": "Method mechanism", "方法": "Method", "先确定哪些变量可以控制、身体运动怎样传到手端。": "First determine which variables can be controlled and how body movements are transmitted to the mobile terminal.", "联合预测": "Joint Forecast", "作出的调整。这里": ". here", "大量四足论文用PPO优化策略，但其全身协调、奖励和sim-to-real机制不是PPO自带。": "A large number of four-legged papers use PPO optimization strategy, but its whole-body coordination, reward and sim-to-real mechanisms are not native to PPO.", "条件扩散生成未来动作序列": "Conditional diffusion generates future action sequences", "行为条件、环境适应与腿臂协作分别改变什么": "Behavior conditioning, adaptation, and leg-arm coordination solve different problems", "上层先用物体形状/姿态训练 9 维抓取策略，再通过 DAgger 蒸馏为双视角分割深度策略；低层腿 RL 接收臂状态与末端目标，臂以 Jacobian IK 执行 SE(3) 指令。固定高度/roll/pitch、随水平位置/yaw 变化的目标系使身体姿态能够扩展臂可用空间。": "The upper layer first uses object shape/posture to train a 9-dimensional grasping strategy, and then distills it into a dual-view segmentation depth strategy through Dagger; the low-level leg RL receives the arm status and end target, and the arm executes SE(3) instructions with Jacobian IK. A target system with fixed height/roll/pitch and varying horizontal position/yaw allows the body posture to extend the available arm space.", "结论明确把真机部署列为未来工作，B1＋Z1是仿真形态。74.3%不是可部署视觉学生成功率。固定抓取候选与特权教师到学生的信息缺口明显；附录某些未见物体上去速度更好，不能宣称动态信息总有益。": "The conclusion clearly lists real robot deployment as future work, and B1+Z1 is a simulation form. 74.3% non-deployable vision student success rate. There is an obvious information gap between fixed grab candidates and privileged teachers to students; some unseen objects in the appendix go up faster, and it cannot be claimed that dynamic information is always beneficial.", "人形移动操作综述": "Summary of Humanoid Movement Operations", "Visual WBC基线、ROA、PPO、解析IK、ROS/ros_control、Unitree SDK、MuJoCo接口。": "Visual WBC baseline, ROA, PPO, analytical IK, ROS/ros_control, Unitree SDK, MuJoCo interface.", "明确针对 Force Control 的位置／力分开控制限制；进一步让力信息进入操作学习，而不只用于底层响应。": "Clarify the position/force separation control limits for Force Control; further allow force information to enter operational learning, not just for underlying response.", "信号与补偿分界": "Boundary between signal and compensation", "输入：身体和臂的关节状态、重力方向、身体速度，以及物体位置、朝向和到目标的误差。接触候选点和物体速度是训练评价网络的额外信息。 输出：上层输出臂关节角度、身体高度和身体速度；固定的行走策略输出腿部关节角度。": "Input: joint status of the body and arms, gravity direction, body speed, as well as object position, orientation and error to the target. Contact candidate points and object velocity are additional information for training the evaluation network. Output: The upper layer outputs the arm joint angle, body height and body speed; the fixed walking strategy outputs the leg joint angle.", "$H,L$ 分别表示高、低层，$g$ 是任务目标，$u^H$ 是通过分层接口传递的身体命令或操作参考，$a^L$ 是低层执行动作。": "$H,L$ represent high and low layers respectively, $g$ is the task goal, $u^H$ is the body command or operation reference passed through the hierarchical interface, and $a^L$ is the low-level execution action.", "Badminton将按距离和身体角速度拟合的视觉误差模型、真机同款EKF放进训练，使身体动作能改善击球预测；奖励直接依据预测误差，而非一味要求目标位于视野中心。这是动作与状态估计的耦合，不是新增一种Bayesian滤波算法。": "Badminton put the visual error model fitted according to distance and body angular velocity, and the same EKF of the real robot into the training, so that the body movements can improve the shot prediction; the reward is directly based on the prediction error, rather than blindly requiring the target to be in the center of the field of view. This is the coupling of action and state estimation, not a new Bayesian filtering algorithm.", "仍是关节力矩，单位是牛顿米，还不是末端力。": "It is still the joint torque, the unit is Newton meters, not the end force.", "Deep WBC、UMI on Legs、Visual WBC均引用该工作作并行腿式RL基础；具体软件复用要另核代码／设置。": "Deep WBC, UMI on Legs, and Visual WBC all refer to this work as the basis for parallel legged RL; specific software reuse requires separate code/settings.", "RoboDuet分工并交换姿态请求；Terrain-aware腿RL臂IK；PAKE用部分运动学多解；ReLIC接受上层指定肢体角色。不能仅凭WBC标题视为所有关节联合RL。": "RoboDuet divides labor and exchanges pose requests; Terrain-aware leg RL arm IK; PAKE uses partial kinematics multi-solution; ReLIC accepts limb roles specified by the upper layer. The WBC title alone cannot be considered the joint RL of all joints.", "任务回报微调": "Fine-tuning of mission rewards", "Unitree G1＋Dex3，RGB-D，人形邻接": "Unitree G1＋Dex3, RGB-D, humanoid adjacency", "本文在知识稿中的用途": "How this article is used in the knowledge draft", "正文问题、方法、实验、讨论完整审读；回查参考文献；未观看补充视频": "Read the text questions, methods, experiments, and discussions in full; review the references; have not watched the supplementary videos", "四足版FALCON正文明确冻结CLIP特征，协调分离的腿部与机械臂扩散策略。": "The text of the quadruped version of FALCON explicitly freezes CLIP features and coordinates the diffusion strategy of the separated legs and robotic arms.", "Go2 真机用前腿推购物车、保持托盘平衡、持软物体，包含三腿支撑行走和后两腿行走；仿真比较无前馈、不同残差通道等设置。力目标训练施加反向虚拟外力，主要量化末端位置误差，不能把该表直接当作腕部力传感器的力跟踪误差。": "The Go2 real robot uses its front legs to push the shopping cart, keep the pallet balanced, and hold soft objects, including three-legged support walking and rear two-legged walking; the simulation comparison has settings such as no feedforward and different residual channels. Force target training applies a reverse virtual external force and mainly quantifies the end position error. The table cannot be directly used as the force tracking error of the wrist force sensor.", "完整动作训练集 129514 条：单 H100 3 h 失败25条，双 H100 9.8 h 失败0条，SONIC公开权重失败179条；LAFAN1同条件PPO-Sim对照；G1真机跳跃、侧滚与翻转；速度接口只在仿真测672种阶跃响应。": "Complete action training set 129514 items: 25 failed for single H100 3 h, 0 failed for double H100 9.8 h, 179 failed for SONIC public weight; LAFAN1 was compared with PPO-Sim under the same conditions; G1 real robot jumped, rolled and flipped; the speed interface only measured 672 step responses in simulation.", "用临时参考力传感器做不同速度、载荷、姿态与接触点的标定；策略消融分别移除信号、打乱信号、替换真值，而不是同时移除力输入和力输出。": "Use temporary reference force sensors for calibration of different speeds, loads, postures and contact points; strategic ablation removes signals, scrambles signals, and replaces true values ​​respectively, instead of removing force input and force output at the same time.", "所谓工作空间扩大34%基于IK有解率，不是几何体积增加34%。参考坐标随水平身体移动，不能直接理解为固定世界接触。真机没有大样本接触力／任务成功率；IK数值失败也不严格等于目标不可达。": "The so-called 34% expansion of the work space is based on the IK solution rate, not a 34% increase in geometric volume. The reference coordinates move with the horizontal body and cannot be directly understood as fixed world contact. The real robot does not have a large sample of contact force/mission success rate; failure in the IK value does not strictly mean that the target is unreachable.", "task轨迹库、adaptive sampling/precision curriculum；past trajectory→future prediction NAE；proprioceptive history→velocity estimation": "task trajectory library, adaptive sampling/precision curriculum; past trajectory→future prediction NAE; proprioceptive history→velocity estimation", "导航遇到可移动障碍时，绕行可能很远；身体推物在狭窄空间里难以找到接触位置。本文让机械臂从身体进不去的位置推开障碍，并将推物成本计入路径选择。": "When navigation encounters movable obstacles, the detour may be very far; it is difficult to find the contact position in a narrow space when pushing objects with the body. This article allows the robotic arm to push away obstacles from a position where the body cannot enter, and the cost of pushing objects is included in the path selection.", "持续物体记录／结果检查的近期人形VLA方法；不是已经建立的四足全身操作范式。": "Recent humanoid VLA methods for continuous object recording/result inspection; not the established quadrupedal whole-body manipulation paradigm.", "正文 §III/IV/V/VI完整核心方法实验审读；relatedwork因果前提阅读；无另附录": "Text §III/IV/V/VI complete core method experimental review; related work causal premise reading; no additional appendices", "MimicGen是作者明确承接的数据生成机制；AMO低层和FoundationPose已知objectmesh位姿是直接复用基础；高层taskpolicy不是rawRGB语言VLA": "MimicGen is a data generation mechanism explicitly undertaken by the author; the low-level AMO and FoundationPose known objectmesh poses are the basis for direct reuse; the high-level taskpolicy is not the rawRGB language VLA", "位置／力精度边界": "Position/Force Accuracy Boundary\nAdjustments made by", "DQ-Net移动对象、仿真视觉学生；Dynamic Pick-and-Place机器人移动、真机动捕对象；Badminton高速飞行对象、机载视觉EKF且任务是击球。不能把它们的成功率并排排名。": "DQ-Net moving object, simulated vision student; Dynamic Pick-and-Place robot moving, real motor capture object; Badminton high-speed flying object, airborne vision EKF and the task is to hit the ball. Their success rates cannot be ranked side by side.", "提出与 UMI on Legs 不同的分工：高层明确决定底盘运动，低层主要保证行走执行。文章没有直接测试两种接口何者更准确或更省数据。": "Proposes a different division of labor from UMI on Legs: the high level clearly determines the chassis movement, and the low level mainly ensures the walking execution. The article does not directly test which of the two interfaces is more accurate or data-saving.", "$r^\\star$ 是目标水平位置，$\\varepsilon$ 是允许的落点偏差；$\\mathcal G$ 是有效释放状态集合，$\\xi_E$ 是末端实际状态；$[t_1,t_2]$ 是物体可能脱离夹爪的时间范围。这个集合写法是原文机制的简化说明，不是其优化问题的逐字复写。": "$r^\\star$ is the target horizontal position, $\\varepsilon$ is the allowable landing point deviation; $\\mathcal G$ is the effective release state set, $\\xi_E$ is the actual end state; $[t_1,t_2]$ is the time range in which the object may escape from the gripper. This set writing method is a simplified explanation of the original mechanism, not a word-for-word reproduction of its optimization problem.", "输入机器人／对象状态历史、抓取／放置位置、对象尺寸／类型与显式任务阶段。高层输出底盘vx/vy/yaw、height/pitch及6臂关节／二值夹爪；低层腿策略冻结。LSTM估对象质量及夹爪接触状态；真机对象／台面状态由Vicon取得。": "Enter robot/object state history, pick/place location, object size/type and explicit task phase. The high-level output chassis vx/vy/yaw, height/pitch and 6-arm joint/binary gripper; the low-level leg strategy is frozen. LSTM estimates the object quality and gripper contact status; the real robot object/table status is obtained by Vicon.", "闭环状态更新的研究方向": "Research direction of closed-loop status update", "特权教师读取对象位姿、速度、点云与抓取候选；部署目标学生只读腕／身体两视角各3帧mask＋depth、本体状态。高层输出末端位置／朝向增量与底盘速度命令；腿低层RL，臂由IK执行。": "The privileged teacher reads the object pose, speed, point cloud and grabbing candidates; the target student is deployed to read only 3 frames of mask+depth and body status from both wrist/body perspectives. The high-level outputs the end position/orientation increment and chassis speed commands; the legs are low-level RL, and the arms are executed by IK.", "固定底座 VLA 预测的手端路径点移到移动平台后可能不可达、碰撞或使机械臂靠近关节极限；希望沿用预训练模型的视觉语言能力，而由执行层处理底盘站位。": "The hand path points predicted by the fixed base VLA may be unreachable, collide, or bring the manipulator close to the joint limit after moving to the mobile platform; it is hoped that the visual language capabilities of the pre-trained model will be used, and the execution layer will handle the chassis position.", "运动学 nullspace 优先级与动力学 QP 按单手、双手、行走和移动操作切换；切换含停稳、移开机身等规则。贡献首先是形态、可达性及模式执行，控制不是从零训练的全身 RL。": "Kinematics nullspace priority and dynamics QP switches according to one-handed, two-handed, walking and moving operations; switching includes rules such as stopping and moving the body. Contributions are first to form, accessibility, and pattern execution, controlling whole-body RL that is not trained from scratch.", "域随机化让策略在一组模型变化下训练，以提高鲁棒性；real-to-sim 校准把仿真逼近实机；在线补偿根据当前误差修正执行。随机范围、模型表达能力和运行时信息不同，三者可以组合。": "Domain randomization allows the policy to be trained under a set of model changes to improve robustness; real-to-sim calibration brings the simulation closer to the real robot; online compensation is performed based on the current error correction. The random range, model expressiveness and runtime information are different, and the three can be combined.", "是观测与执行时间，": "is the observation and execution time,", "22种机器人轨迹格式整合": "Integration of 22 robot trajectory formats", "有限离散速度指令及任务集合，不是任意连续全身运动；潜动作视觉歧义、机器人精细接触误差及停止精度仍在；印刷Eq2的tanh差分滤波对恒定指令趋零，不能未经代码核对直接当可靠实现公式": "Finite discrete speed instructions and task sets are not arbitrary continuous whole-body movements; latent motion visual ambiguity, robot fine contact error and stopping accuracy are still there; the tanh differential filtering of printed Eq2 tends to zero for constant instructions, and cannot be directly used as a reliable implementation formula without code verification", "仿真中相对最优基线成功率高 36 个百分点、时间少 24.5%；真机展示不同形状物体的协同推送。无机械臂，纳入是为覆盖非抓取式四足操作，不是用户当前设备的主路线。": "In simulation, the success rate is 36 percentage points higher and the time is 24.5% shorter than the optimal baseline; the real robot demonstrates the collaborative push of objects of different shapes. There is no robotic arm, and it is included to cover non-grabbing quadruped operations and is not the main route of the user's current device.", "先判断信号可辨识什么，再确定它应该进入控制还是动作模型。": "First determine what the signal can identify, and then determine whether it should enter the control or action model.", "是折扣。保持最优策略的结论需要相应的状态、折扣和终端处理条件。例如回合终止时令终止状态的势函数为零，可避免残余终端项改变目标；任意靠近目标奖励没有相同保证。": "is a discount. Maintaining the conclusion of the optimal policy requires corresponding status, discount, and terminal processing conditions. For example, when the round ends, setting the potential function of the terminal state to zero can prevent the residual terminal term from changing the target; there is no guarantee of the same reward for being arbitrarily close to the target.", "与Deep WBC的ROA／advantage mixing对照，主要改动是运动学可达性塑形，不是新的RL优化器。相对于只用最终误差，它把“身体已使目标可达”与“末端已到达”分开。": "Compared with Deep WBC's ROA/advantage mixing, the main change is kinematic accessibility shaping, not a new RL optimizer. Instead of just using the final error, it separates \"the body has made the target reachable\" from \"the end has been reached\".", "sensorless指FT不作policyinput，评估装有FT；±20%inertiamismatch在train pooleddataset，不能说unseen OODmass泛化；控制比较还改变训练objective和估计器，别全归TCN": "Sensorless means that FT does not make policy input, and the evaluation is equipped with FT; ±20% inertiamismatch is in the train pooled dataset, which cannot be said to be unseen OODmass generalization; the control comparison also changes the training objective and estimator, and does not all belong to TCN", "学生自身状态上DAgger，仍有特权信息差": "When the student’s own status is displayed on DAgger, there is still a gap in privilege information.", "式子采用二维投掷平面和忽略空气阻力的抛体模型。对一般物体飞行要换模型；控制器必须在实际可用时间内实现修正。": "The formula adopts a two-dimensional throwing plane and a projectile model neglecting air resistance. For general object flight, the model needs to be changed; the controller must implement corrections within the actual available time.", "可达站位": "Reachable station", "第二种接口让高层同时给身体或底盘动作。From Tabletop to Walking Bot 的 Go2＋Piper VLA 直接输出底盘速度、身体俯仰、臂关节与夹爪；低层负责行走稳定与执行。Opt2VLA 的人形高层输出手足目标和期望力。更显式的动作标签可能便于高层做任务相关站位，也需要覆盖这些自由度的示教和部署时正确对齐。": "A second interface gives the high-level policy explicit body commands. From Tabletop to Walking Bot has a Go2–Piper VLA output base velocity, body pitch, arm joint targets, and gripper state; an RL gait controller executes the base commands. Humanoid Opt2VLA outputs hand and foot targets plus desired contact force. Explicit commands can help the high level choose task-relevant body placement, but require corresponding demonstration labels and a consistent deployment interface.", "全身接触行为样本少，直接从头 RL 难学。先用人类动作重定向训练扩散规划器，RL 训练低层追踪；再用自蒸馏与策略优化减少规划器对强任务条件的依赖。": "There are few samples of whole-body contact behavior, and it is difficult to learn RL directly from scratch. First, human action redirection is used to train the diffusion planner, and RL is used to train low-level tracking; then self-distillation and policy optimization are used to reduce the planner's dependence on strong task conditions.", "Go1 Edu，无臂；50 Hz关节位置目标＋PD；机载Jetson TX2 NX": "Go1 Edu, no arms; 50 Hz joint position targets + PD; onboard Jetson TX2 NX", "机器人技能数据分散，单任务小模型难同时保持多任务覆盖和训练规模效益。": "Robot skill data is scattered, and it is difficult for small single-task models to maintain multi-task coverage and training scale efficiency at the same time.", "100 Hz名义全身策略＋400 Hz臂残差": "100 Hz nominal whole body strategy + 400 Hz arm residual", "的值域内时，该表达能精确满足速度任务；否则伪逆只给最小二乘解。": "is within the value range, this expression can accurately meet the speed task; otherwise, the pseudo-inverse only gives a least squares solution.", "例如静止时模型需要 $2~\\mathrm{N\\,m}$，实际电机只提供 $1.5~\\mathrm{N\\,m}$，则该关节的残差是 $0.5~\\mathrm{N\\,m}$。在模型准确、没有其他未知作用时，可以解释为环境沿该关节正方向提供了助力；若环境阻碍，则残差可为负。未建模的摩擦也可能造成同样的差值。": "For example, the model requires $2~\\mathrm{N\\,m}$ when stationary, but the actual motor only provides $1.5~\\mathrm{N\\,m}$, then the residual of this joint is $0.5~\\mathrm{N\\,m}$. When the model is accurate and there are no other unknown effects, it can be explained that the environment provides assistance in the positive direction of the joint; if the environment hinders, the residual can be negative. Unmodeled friction can also cause the same difference.", "$x_t$ 是预测所需状态，$u_t^H$ 是高层命令，$\\pi_L$ 是实际低层执行映射，$\\eta_{\\mathrm{obj}}$ 是物体参数或相关状态。该式把低层响应包含在一步转移中。": "$x_t$ is the predicted required state, $u_t^H$ is the high-level command, $\\pi_L$ is the actual low-level execution mapping, $\\eta_{\\mathrm{obj}}$ is the object parameter or related state. This formula includes the low-level response in one step transfer.", "ACT用条件潜变量模型预测动作块而非单步动作，并使用时间集成平滑当前动作；论文同时提供可遥操作的低成本双臂ALOHA硬件。": "ACT uses a conditional latent variable model to predict action blocks instead of single-step actions, and uses time integration to smooth the current action; the paper also provides low-cost, teleoperated dual-arm ALOHA hardware.", "是相对参考的位移误差，": "is the displacement error relative to the reference,", "Pose Tracking引用UMI的位姿表示与跟踪结果，但重点转向大工作空间／不平地形；其操作策略不执行行走。": "Pose Tracking refers to UMI's pose representation and tracking results, but the focus turns to large workspaces/uneven terrain; its operation strategy does not perform walking.", "点击聚焦本章：": "Click to focus on this chapter:", "这是单个接触的库仑静摩擦近似，$F_t$ 是切向载荷，$F_n$ 是法向压缩力，$\\mu$ 是摩擦系数；多个指间接触需分别满足对应条件或明确等效方式。": "This is the Coulomb static friction approximation of a single contact. $F_t$ is the tangential load, $F_n$ is the normal compression force, and $\\mu$ is the friction coefficient; multiple inter-finger contacts need to meet the corresponding conditions or clarify the equivalent method.", "§4.2：真机40trials；§5.2：失败分析": "§4.2: 40trials of real robot; §5.2: Failure analysis", "86／28 是行走稳定通过率，不是操作成功率。质心基线保留全身运动学，不能等同于完全没有臂影响；数值实现也不是毫无简化的完整臂动力学。": "86/28 is the pass rate of stable walking, not the success rate of operation. The center-of-mass baseline preserves whole-body kinematics and cannot be equated to the complete absence of arm influence; the numerical implementation is not complete arm dynamics without simplification.", "是当前接触集合，求和把各处接触的作用加起来。": "is the current contact set, and the summation adds up the effects of contacts everywhere.", "不是视觉VLA，主要是具接触历史的taskRL；RNN必要性与aux分类必要性需分别描述；UMAP可分只是投影解释，非latent因果结构证明；到达/开门与真正unlock成功确认不能混为一项": "It is not a visual VLA, it is mainly taskRL with contact history; the necessity of RNN and the necessity of aux classification need to be described separately; UMAP can be divided only for projection explanation, non-latent causal structure proof; arrival/door opening and true unlock success confirmation cannot be confused as one", "把机器人动作表示成与语言token兼容的序列，将机器人轨迹和互联网视觉问答等任务共同微调预训练视觉语言模型；此处明确提出VLA范式。": "Represent robot actions as sequences compatible with language tokens, and fine-tune pre-trained visual language models for tasks such as robot trajectories and Internet visual question answering; the VLA paradigm is clearly proposed here.", "用于追踪接触顺序、重规划与执行控制的分工。": "Used to trace the division of labor in contact sequence, re-planning and execution control.", "RoLoMa 优化给定接触阶段的抗扰余量；Sleiman 等还搜索接触顺序。未核实算法继承。": "RoLoMa optimizes the immunity margin for a given contact phase; Sleiman et al. also search for the contact sequence. Algorithm inheritance is not verified.", "一次仿真示范分成移动、接近和接触段，变换对象相对接近动作，接触后改用接触时刻锚点，插值连接并在模拟由AMO执行过滤成功轨迹；以FoundationPose/本体训练MLP/ACT/DP上层。新增全身动态执行数据，不是首次几何示范生成。": "A simulation demonstration is divided into movement, approach and contact segments. The object is relatively close to the action. After contact, the contact moment anchor point is used. Interpolation is connected and the successful trajectory is filtered by AMO in the simulation; the upper layer of MLP/ACT/DP is trained with FoundationPose/Ontology. The new whole body dynamic execution data is added, which is not the first geometric demonstration generation.", "是初始接触点位置。": "is the initial contact point position.", "是转角，": "is the corner,", "近似解释它；否则它同时包含未知足力、手端作用和各种估计误差。": "Approximately explain it; otherwise it contains unknown foot forces, hand effects, and various estimation errors at the same time.", "，力方向也已知，则该方向的力可估为": ", the force direction is also known, then the force in this direction can be estimated as", "方法／真机抓取": "Method/real robot capture", "分别从机器人操作视频和人移动视频学习两套VQ-VAE潜动作，VLM预测两种codes再用robot decoder输出双臂动作与离散行走/高度；低层LMO先训练基本行走，再在结构化臂运动扰动及精准停止要求下适配操作。": "Learn two sets of VQ-VAE latent movements from robot operation videos and human movement videos respectively. VLM predicts the two codes and then uses the robot decoder to output both arm movements and discrete walking/height; the low-level LMO first trains basic walking, and then adapts operations under structured arm motion disturbance and precise stopping requirements.", "RoboDuet §III-B.1明确以Walk These Ways [16]为步态基础，沿用行为参数、足间相位时钟及大部分第一阶段奖励；固定trot/步频等、删除高度跟踪，第二阶段还替换足摆动奖励。不是保留完整MoB。": "RoboDuet §III-B.1 is clearly based on Walk These Ways [16], using behavioral parameters, interfoot phase clock and most first-stage rewards; fixing trot/step frequency, etc., deleting height tracking, and replacing foot swing rewards in the second stage. Not retaining the full MoB.", "§2–3／零样本实验": "§2–3／Zero sample experiment", "关闭详情": "Close details", "这里定义": "Define here", "轨迹供给条件": "Track supply conditions", "ANYmal-D＋DynaArm＋ZED X；18关节100 Hz策略": "ANYmal-D＋DynaArm＋ZED X; 18 joints 100 Hz strategy", "主文 §4，p.6–8": "Main text §4, p.6–8", "Accurate Throwing将100 Hz全身名义策略冻结，再用400 Hz臂关节残差补偿短释放窗口中的误差。高频有助于更及时使用反馈，但需匹配训练、状态估计和执行器；作者实机改善明显弱于仿真，并指出残差可能过拟合模型。": "Accurate Throwing freezes the 100 Hz whole-body nominal strategy, and then uses the 400 Hz arm joint residuals to compensate for errors in the short release window. High frequency helps to use feedback in a more timely manner, but it requires matching training, state estimation and actuators; the author's real robot improvement is significantly weaker than simulation, and points out that the residuals may overfit the model.", "Visual WBC的视觉学生训练明确使用DAgger，在线向状态教师查询纠正动作。": "Visual WBC’s visual student training explicitly uses DAgger to query corrective actions online from the state teacher.", "正文 §III/IV核心方法所有仿真/硬件/接触分支审读；无另附录": "Text §III/IV core method review of all simulation/hardware/contact branches; no additional appendices", "示范／视觉／VLM": "Demonstration / vision / VLM", "需要任务覆盖、准确空间与时间对齐。": "Requires task coverage and accurate spatial and temporal alignment.", "训练可预测的步态，再辨识闭环响应": "Train a predictable gait, then identify its closed-loop response", "是示范观测分布，": "is the demonstration observation distribution,", "注意力式循环融合本体与地形测量": "Attention-based loop fusion of ontology and terrain measurement", "Walk These Ways的b是外部指定的运动方式；Deep WBC的z由特权参数或部署历史产生；RoboDuet由臂产生pitch／roll请求。参数来源、训练目的和控制权限不同，不能统称为“加个latent”。": "The b of Walk These Ways is the externally specified movement method; the z of Deep WBC is generated by privileged parameters or deployment history; RoboDuet generates pitch/roll requests by the arm. The parameter sources, training purposes and control permissions are different and cannot be collectively referred to as \"adding a latent\".", "低阶闭环模型": "Low-order closed-loop model", "检测到好抓取不等于四足全身能在运动中稳定达到；底盘站位和身体姿态须另规划。": "Detecting good grasping does not mean that the four-legged body can be stably reached during movement; the chassis position and body posture must be planned separately.", "预定义接触模式和物体模型限制新场景；MPC实时性不等于未知机构、摩擦、抓取点均可自动估计。": "Predefined contact modes and object models limit new scenarios; MPC real-time performance does not mean that unknown mechanisms, friction, and grab points can be automatically estimated.", "方法／滚动执行": "Method/Rolling Execution", "Heavy Objects 的对象 MPC 把操作力传给 locomotion MPC；ETH 联合对象与机器人计划；RoLoMa 不知道精确物体力而预留抗扰余量。在线估计物体参数又是另一层，Adaptive-MHE 从近期交互更新模型，不等于估计某一瞬间的手端力。": "The object MPC of Heavy Objects passes the operating force to the locomotion MPC; ETH joint object and robot plan; RoLoMa does not know the precise object force and reserves an immunity margin. Online estimation of object parameters is another layer. Adaptive-MHE interactively updates the model from the recent past, which is not equivalent to estimating the hand force at a certain moment.", "关系": "Relationship", "PPO、history estimator、DP、PD、两阶段训练": "PPO, history estimator, DP, PD, two-stage training", "把结构、训练信号与部署信息分别讨论。": "Discuss the structure, training signals and deployment information separately.", "反向传播；物理仿真器本身无需可微。": "Backpropagation; the physics simulator itself does not need to be differentiable.", "组合已有线性行走 MPC、非线性姿态优化、步态／摆腿控制器与物体动力学。": "Combines existing linear walking MPC, nonlinear posture optimization, gait/leg swing controller and object dynamics.", "使用 ReLIC、TD3／FastTD3、采样 MPC 与向量化 MuJoCo Warp。": "Using ReLIC, TD3/FastTD3, sampled MPC and vectorized MuJoCo Warp.", "先把任务结果写成末端释放状态的映射。对抛体，位置和速度决定落点；将所有能落入目标区域的释放状态收集为有效集合。控制器应在整个可能释放窗口内尽量保持这些状态，而不是仅使某一时刻的姿态误差小。": "First write the task result as a mapping of the terminal release state. For projectiles, position and speed determine the impact point; all release states that can fall into the target area are collected as a valid set. The controller should try to maintain these states throughout the entire possible release window, rather than just making the attitude error at a certain moment small.", "原作重点是大规模真实机器人控制，并未直接学习四足足接触或底盘—手臂接触补偿。": "The original work focused on large-scale real robot control and did not directly learn quadruped foot contact or chassis-arm contact compensation.", "在相同机器人数据预算下，分别比较无预训练、视觉预训练、对齐混训和分阶段训练，测试新任务与新形态。": "Under the same robot data budget, compare no pre-training, visual pre-training, aligned mixed training and staged training to test new tasks and new forms.", "默认机器人能追踪末端目标；无足端运动。": "By default, the robot can track the end target; there is no toe movement.", "$\\tau_{\\mathrm{model}}$ 按当前实际姿态和运动计算，而不是只按期望运动计算；$\\tau_{\\mathrm{act}}$ 是标定后的实际驱动力矩。$r_\\tau$ 仍是关节力矩，单位是牛顿米，还不是末端力。": "$\\tau_{\\mathrm{model}}$ is calculated based on the current actual posture and motion, rather than only the expected motion; $\\tau_{\\mathrm{act}}$ is the actual driving torque after calibration. $r_\\tau$ is still the joint moment, the unit is Newton meters, not the end force.", "多层优化": "Multi-layer optimization", "ANYmal D＋Dynaarm 真机跟踪多速度直线、圆和半圆，记录位置与速度误差；仿真比较不同腿部策略和全身控制器。站立比较中的 Portela [8] 是 2025 年末端姿态跟踪论文，与 2024 年力控制论文不是同一篇；部分对照复用本文臂动作再替换腿策略。": "ANYmal D＋Dynaarm real robot tracks multi-speed straight lines, circles and semicircles, records position and speed errors; simulates and compares different leg strategies and full body controllers. Portela [8] in the standing comparison is a terminal posture tracking paper in 2025, which is not the same as the force control paper in 2024; part of the comparison reuses the arm movements of this article and then replaces the leg strategy.", "位置与力模式切换，精度有限。": "Switching between position and force modes, the accuracy is limited.", "14维动作＝臂6＋gripper1＋base velocity3＋padding4，不是14个全身关节；速度 token 是学习 ego-motion 条件，不是显式 KF/SE(3) 注册；不能将58.2%对57.0%描述为显著突破任务成功率；world-action joint model 不等于已实施视觉预测规划": "14-dimensional action = arm 6 + gripper1 + base velocity3 + padding4, not 14 whole body joints; the velocity token is a learning ego-motion condition, not an explicit KF/SE(3) registration; 58.2% vs. 57.0% cannot be described as a significant breakthrough task success rate; the world-action joint model is not equivalent to the implemented visual prediction planning", "背景引用": "Background citation", "是通过分层接口传递的身体命令或操作参考，": "is a body command or operation reference delivered through a layered interface,", "物体／手柄状态由动捕提供，初始状态仅覆盖参考附近，每任务一条示范。附录 D.1 将手柄建为固定连杆，加入锁止机构后成功率较低；不是完整在线任务与运动规划，也不是仅凭机载视觉完成任务。": "The object/handle state is provided by motion capture. The initial state only covers the reference vicinity, and there is one demonstration for each task. Appendix D.1 The handle is built as a fixed link and the success rate is low after adding a locking mechanism; it is not a complete online task and motion planning, nor is it possible to complete the task solely with on-board vision.", "摘要声称在复杂地形上有大量真机试验，但未给出任务种类、次数或量化对照。它是地形＋操作方向不可忽视的 2026 正式发表工作，验证强度须读全文后再判。": "The abstract claims that there are a large number of real-machine tests on complex terrain, but does not give the type, number of tasks or quantitative comparison. It is a terrain + operation direction that cannot be ignored. The work will be officially published in 2026. The verification strength must be read before judging the full text.", "UMI on Legs使用Isaac Gym仿真训练低层全身策略；这是工具复用。": "UMI on Legs uses Isaac Gym simulation to train low-level whole-body strategies; this is tool reuse.", "明确复用 VBC 全身控制以简化 VR 示范采集；用 CLIP 像素特征与任务文本的余弦相关图给独立 ACT 技能提供目标位置，再由 LLM、人工 waypoint 导航和学习终止信号组合长任务。": "Explicitly reuse VBC whole-body control to simplify VR demonstration acquisition; use cosine correlation plots of CLIP pixel features and task text to provide target locations for independent ACT skills, and then combine long tasks with LLM, manual waypoint navigation, and learning termination signals.", "模型基础": "Model ctrl.", "末两臂关节锁定；力矩限位仅约束前两个时间步，远端未同样约束。真机无设备测实际末端力，不能验证力目标精确跟踪。没有对象动力学或碰撞约束；离板计算、实机有20 ms求解尖峰及质量分布／执行器模型偏差。": "The joints of the last two arms are locked; the torque limit only constrains the first two time steps, and the far end is not similarly constrained. The real robot does not have the equipment to measure the actual end force and cannot verify the accurate tracking of the force target. No object dynamics or collision constraints; off-board calculations, real robot 20 ms solution spikes and mass distribution/actuator model deviations.", "大规模GPU模拟ANYmal环境，PPO学习本体观测和速度指令到关节动作的策略。": "Large-scale GPU simulation of ANYmal environment, PPO learning strategy from ontology observation and speed command to joint action.", "正文 §II–VI（核心§IV/V逐段）审读；无另附录；力与位置定量表和discussion核查": "Text §II–VI (core §IV/V paragraph by paragraph) review; no additional appendices; force and position quantification table and discussion review", "需知道实际模型和实时频率。硬件瞬时力矩上限也不能替代热持续能力限制。": "Need to know the actual model and real-time frequency. Hardware instantaneous torque upper limits also do not replace thermal sustainability limits.", "第一种接口让高层预测未来手端位姿或路径点；下层用优化、运动生成或 RL 全身跟踪决定身体和肢体动作。UMI on Legs 用任务坐标系的轨迹驱动四足 RL 全身控制；MoManipVLA 用 VLA 路径点驱动轮式底盘与臂的双层优化；Whole-Body UMI 则由手端轨迹和人形动作先验生成身体、落脚与关节参考。三者共享动作权限边界，但平台、上层模型、下层求解器不同。": "One interface has the high-level policy predict future end-effector poses or waypoints; an optimizer, motion generator, or RL whole-body tracker then chooses body and limb motion. UMI on Legs combines task-frame trajectories with quadruped RL whole-body tracking. MoManipVLA combines VLA waypoints with bilevel optimization for a wheeled base and arm. Whole-Body UMI combines end-effector trajectories with a humanoid motion prior to generate body, foot, and joint references. The authority boundary is similar, but the platforms, high-level models, and low-level solvers differ.", "奖励也需依行为条件变化，才能让策略学会使用这些输入。": "Rewards also need to change according to behavioral conditions in order for the strategy to learn to use these inputs.", "RMA原作把特权环境因素压缩为潜变量，再冻结教师并用本体历史拟合该潜变量；Deep WBC的ROA将特权表示也朝历史可预测的区域约束。Miki等的感知行走则融合外感地形和本体输入。三者都利用“部署时可观测的信息”，但教师目标和传感来源不同。": "The original RMA work compresses privileged environmental factors into latent variables, then freezes teachers and uses ontology history to fit the latent variables; Deep WBC's ROA also constrains the representation of privileges toward historically predictable areas. Miki et al.'s perceptual walking combines extrinsic terrain and proprioceptive input. All three utilize “information observable at the time of deployment,” but have different teacher goals and sensing sources.", "Go2 身体直接固定低成本夹爪，没有机械臂。上游 VLM 提供语义 pick/place 锚点；策略以目标几何、本体与历史输入，输出前后／侧向速度、yaw 和 body pitch，通过整个身体对准夹爪。": "The Go2 body directly fixes the low-cost gripper, without a robotic arm. The upstream VLM provides semantic pick/place anchor points; the strategy takes target geometry, ontology and history as input, outputs front and rear/lateral velocity, yaw and body pitch, and aligns the gripper through the entire body.", "高层仍可能请求超出低层能力的轨迹，闭环响应也存在误差。": "The upper layer may still request trajectories that exceed the capabilities of the lower layer, and there are also errors in the closed-loop response.", "RoboDuet §IV-C明确采用非对称actor-critic训练框架，actor只读部署观察，critic可读仿真完整状态。": "RoboDuet §IV-C explicitly adopts an asymmetric actor-critic training framework, where actors are read-only for deployment and observation, and critics can read the complete status of the simulation.", "MLM 在末端轨迹跟踪接口上处理多任务抽样和缺少未来轨迹的情形。": "MLM handles multi-task sampling and missing future trajectories on the terminal trajectory tracking interface.", "同时测试未见实机轨迹的短／长滚动预测和真实任务转移，比较随机化、参数拟合、学习模型及执行补偿。": "Simultaneously test the short/long rolling prediction and real task transfer of unseen real robot trajectories, and compare randomization, parameter fitting, learning model and execution compensation.", "视觉单次操作与示范技能加语言长程规划的任务范围对照；不表示直接继承。": "Comparison of the task scope of single visual operation and demonstration skills plus language long-term planning; does not mean direct inheritance.", "视野与停步阶段选择": "Vision and stop phase selection", "手工门角度30/70deg阶段与pull分区奖励；外部定位延迟影响实机；历史学生可适应门响应，但未得到未知任意机构/视觉建模能力；95%含mocap条件，不应外推纯视觉场景": "Manual door angle 30/70deg stage and pull partition reward; external positioning delay affects the real robot; history students can adapt to door response, but do not gain unknown arbitrary mechanism/visual modeling capabilities; 95% contains mocap conditions, pure visual scenes should not be extrapolated", "明确以Visual WBC为共享低层和高层基线，新增动态对象的候选融合与视觉时序学生；不是仅把静态抓取任务改名。GFM记忆是对象几何候选库，不是已完成任务事件的记忆。": "Clearly use Visual WBC as the shared low-level and high-level baseline, and add candidate fusion and visual timing students for dynamic objects; instead of just renaming the static grabbing task. GFM memory is a library of object geometry candidates, not a memory of completed task events.", "完整知识记录": "Complete concept notes", "$J_i$ 是第 $i$ 个接触处的 Jacobian，描述身体和关节运动怎样传到接触点。$J_i^\\top\\lambda_i$ 则把这个接触力换算成对身体和关节的作用；对一个转动关节，这相当于根据力臂计算力矩。$\\mathcal C$ 是当前接触集合，求和把各处接触的作用加起来。": "$J_i$ is the Jacobian at the $i$th contact, describing how body and joint motions are transmitted to the contact point. $J_i^\\top\\lambda_i$ converts this contact force into an effect on the body and joints; for a rotating joint, this is equivalent to calculating the moment based on the moment arm. $\\mathcal C$ is the current contact set, and the summation adds up the effects of contacts everywhere.", "ROA式中的": "ROA formula", "$\\Xi_t$ 是低层可读取的未来参考序列，$\\xi$ 是任务轨迹，$H$ 是预览步数，$\\Delta t$ 是参考采样间隔。": "$\\Xi_t$ is the future reference sequence readable by the lower layer, $\\xi$ is the task trajectory, $H$ is the number of preview steps, and $\\Delta t$ is the reference sampling interval.", "用规划单示范训练反馈；进度可暂停或倒退。": "Use planning sheets to demonstrate training feedback; progress can be paused or reversed.", "从力目标跟踪走向同一策略兼顾自由空间位置与接触力目标。": "From force target tracking to the same strategy taking into account both free space position and contact force targets.", "机器人可把身体靠住环境增加承受外力能力，但靠错地方会挡住手或妨碍走路。输入候选环境接触和任务所需末端位姿／力，输出支撑接触点及身体配置。": "The robot can lean its body against the environment to increase its ability to withstand external forces, but leaning in the wrong place will block its hands or hinder walking. Input the candidate environment contact and the end pose/force required for the task, and output the support contact point and body configuration.", "非四足；真机任务成功率较低，且先经单独导航。": "Not four-legged; the success rate of real-life missions is low, and it must be navigated alone first.", "平台不是Go1背部双臂，硬件来自calf-mounted LocoMan；head/hand representation迁移与robotmotorpolicy直接转移应区分；不能把对HPT改进全部归因modalitytokenization；relative improvement不能写成成功率提升相同percentagepoints": "The platform is not the Go1 back arms, the hardware comes from calf-mounted LocoMan; head/hand representation migration should be distinguished from the direct transfer of robotmotor policy; all improvements to HPT cannot be attributed to modularitytokenization; relative improvement cannot be written as the success rate increase with the same percentage points", "以采样式 MPC 自动生成经验，早期 TD3 训练约一半批数据来自规划器；达到成功率阈值后逐步去掉旧数据，用稀疏任务奖励继续学习。动作以命令增量表示，评价网络输出被限制在理论回报范围；数据规划器仍使用需调节的稠密成本。": "Automatically generates experience with sampling MPC. About half of the batch data for early TD3 training comes from the planner; after reaching the success rate threshold, the old data is gradually removed, and sparse task rewards are used to continue learning. Actions are expressed in command increments, and the evaluation network output is limited to the theoretical reward range; the data planner still uses dense costs that need to be adjusted.", "仿真吞吐提升不保证动力学逼真或实机成功；具体仿真平台和接触模型仍需逐篇核查。": "The improvement of simulation throughput does not guarantee realistic dynamics or success of the actual machine; the specific simulation platform and contact model still need to be verified article by article.", "B2＋Z1 上擦白板、开／关按压式柜门和遮挡下拉抽屉四任务，每个设置 50 次，比较带力信息的操作学习与位置基线。G1 人形实验只验证身体力交互和移动，不包含这四个臂操作任务。": "B2+Z1 Four tasks: erasing the whiteboard, opening/closing the push-type cabinet door, and blocking the pull-down drawer, each set up 50 times, and compared the operation learning with force information and the position baseline. The G1 humanoid experiment only verifies body force interaction and movement, and does not include these four arm operation tasks.", "附录 E，Table 4 的低层跟踪比较": "Appendix E, Low-level tracing comparison of Table 4", "Terrain-Aware WBC步态时序输入说明Inspired by [34], [19]；[19]为Walk These Ways。只登记时序设计启发，不声称完整控制器复制。": "Terrain-Aware WBC gait timing input instructions Inspired by [34], [19]; [19] is Walk These Ways. Only timing design heuristics are registered, no full controller replication is claimed.", "多地形仿真统计；真机演示步态、地形通过、足按按钮／翻箱／推桶。操作目标容差半径为 0.1 m，且其操作目标满足判据不要求实际物体接触；主要量化结果是地形通过率，不足以作为精确按钮或背载臂控制证据。": "Multi-terrain simulation statistics; real robot demonstrates gait, terrain passing, foot pressing buttons/turning over boxes/pushing buckets. The tolerance radius of the operating target is 0.1 m, and its operating target satisfaction criterion does not require actual object contact; the main quantitative result is the terrain pass rate, which is not sufficient as evidence of precise button or piggyback arm control.", "特权信息训练、历史适应、扩散模仿、参数化轨迹、PD 执行。": "Privileged information training, history adaptation, diffusion imitation, parameterized trajectory, PD execution.", "Table2平均78%为六个子目标的平均；最终 bag13/25、box17/25、cart22/25，与整体78%端到端有区别；离散动作/LMO整体比默认连续速度基线平均54%更好，但接口、课程和奖励同时改变；人移动视频减轻机器人移动示范需求；机器人操作数据仍必须存在；真机推50kgcart展示全身负载执行，但无F/T峰值力/安全指标": "Table 2 average 78% is the average of six sub-goals; final bag13/25, box17/25, cart22/25, are different from the overall 78% end-to-end; the discrete action/LMO overall is 54% better than the default continuous speed baseline on average, but the interface, courses and rewards are changed at the same time; human movement video alleviates the need for robot movement demonstration; robot operation data must still exist; the real robot pushes 50kgcart to demonstrate whole-body load execution, but there is no F/T peak force/safety indicator", "PPO、asymmetric actor critic、locomotion gait prior、Deep WBC式球坐标和 joint PD": "PPO, asymmetric actor critic, locomotion gait prior, Deep WBC-style spherical coordinates and joint PD", "明确扩展UMI，以ARKit共享头／腕SE(3)。头图像DINOv3＋深度位置特征转到左夹爪坐标，腕图像保留局部细节；双手由Mink差分IK/QP追踪，头look-at单独控制避免抢占手目标，timestamp对齐并丢弃已过期动作。不是UMI on Legs的直接后续算法。": "Explicitly extend UMI to share heads/wrists with ARKit (3). The head image DINOv3+ depth position feature is transferred to the left gripper coordinates, and the wrist image retains local details; the hands are tracked by Mink differential IK/QP, the head look-at is controlled separately to avoid preempting the hand target, and the timestamp is aligned and expired actions are discarded. It is not a direct successor algorithm to UMI on Legs.", "搜索论文或问题": "Search for papers or questions", "π0.5 action expert 为直接复用VLA基础；残差观测、阻尼Jacobian逆、wrench坐标变换和低通/限幅控制是基础组件；未给被动性/耦合稳定性证明": "π0.5 action expert is the basis of direct reuse of VLA; residual observation, damped Jacobian inverse, wrench coordinate transformation and low-pass/limiter control are basic components; no proof of passivity/coupling stability is given", "RoboDuet §IV-C明确采用该非对称actor-critic框架，另用PPO和Isaac Gym训练其腿臂策略。": "RoboDuet §IV-C explicitly adopts this asymmetric actor-critic framework, and uses PPO and Isaac Gym to train its leg and arm strategies.", "明确继承UMI on Legs，能力边界投影的针对性改进；研究问题清楚，但不是已被多支后作采用的基础层。": "Clear inheritance of UMI on Legs, targeted improvements in capability boundary projection; the research problem is clear, but it is not a base layer that has been adopted by many subsequent games.", "力目标控制": "Force target control", "两视角各三帧的时间模型": "Temporal model of three frames from two perspectives each", "给定姿态、接触和力矩限制，可以求机器人还能承受哪些外力。若规划只要求当前任务可行，它可能选择裕量很小的解；把最不利方向的可承受外力加入目标，能在规划阶段主动保留空间。": "Given the attitude, contact and torque constraints, you can find what other external forces the robot can withstand. If the planning only requires that the current task is feasible, it may choose a solution with a small margin; adding the tolerable external force in the most unfavorable direction to the target can proactively reserve space during the planning stage.", "个已知接触处作用于机器人的力或力旋量，例如某只足的地面支撑与摩擦。": "The force or force spin acting on the robot at a known contact, such as ground support and friction on a foot.", "机构约束与在线交互辨识": "Articulated-object constraints and online identification", "自由空间主要关心位姿；接触建立后，误差与环境刚度共同产生作用力。对于刚性环境，小幅过冲也可能带来大力。‘接触适应’还可能只是承受未知外力并保持姿态，和期望力跟踪是不同目标。": "Free space mainly cares about pose; after contact is established, error and environmental stiffness jointly produce force. For rigid environments, small overshoots can also lead to large forces. ‘Contact adaptation’ may also simply be to withstand unknown external forces and maintain posture, which is a different goal than expected force tracking.", "AGIBOT X2 人形；复用低层行走策略，非四足": "AGIBOT X2 humanoid; reuses low-level walking strategy, not four-legged", "目标必须满足机器人形态、当前站位和接触条件；可见的语义区域与可执行接触区域不同。": "The target must satisfy the robot shape, current position, and contact conditions; the visible semantic area is different from the executable contact area.", "T-Mech 综述参考文献 [86] 收录 Visual WBC。": "T-Mech review reference [86] includes Visual WBC.", "在不同环境刚度和摩擦下同时画位置误差与力误差，记录首次接触峰值、接触丢失、任务完成率。": "Simultaneously draw the position error and force error under different environmental stiffness and friction, and record the first contact peak value, contact loss, and task completion rate.", "先训练稳定行走，再启用臂与操作目标，让两策略协作。臂不只管自己的关节，还能请求身体改变姿态。": "First train stable walking, and then activate the arm and operation target to allow the two strategies to cooperate. The arms not only take care of their own joints, but also ask the body to change posture.", "开放通用策略的目标图像／语言条件": "Target image/language conditions for open universal strategy", "角度偏移与力矩具有不同单位。上式是典型 PD 执行关系，不意味着策略直接指定了接触力；实际实现还需标明期望速度、饱和、滤波与更新频率。": "Angular offset and moment have different units. The above formula is a typical PD execution relationship, which does not mean that the policy directly specifies the contact force; the actual implementation also needs to indicate the expected speed, saturation, filtering and update frequency.", "以采样 MPC 的分块示范经验初始化稀疏奖励 TD3，策略改善后逐渐退出专家样本；限制 critic 值范围并采用增量命令，提高训练／执行稳定性。": "Initialize the sparse reward TD3 based on the block demonstration experience of sampling MPC, and gradually withdraw from expert samples after the strategy is improved; limit the critic value range and use incremental commands to improve training/execution stability.", "是机器人对环境的压缩力大小；机器人受到反向作用。": "is the compression force of the robot on the environment; the robot is affected by the reverse effect.", "相较 UMI on Legs 的轨迹接口，进一步处理多类轨迹之间的训练平衡，以及缺少未来轨迹的遥控情形。": "Compared with the trajectory interface of UMI on Legs, it further handles the training balance between multiple types of trajectories, as well as the remote control situation where future trajectories are lacking.", "VLM从人工库选择稀疏关键帧标签，按场景重定位全身/物体参考并用IK修正；低层RL以关键帧历史追踪、分别处理goal/tracking/regularization o not change the model and low-level strategy at the same time for the same ablation.", "是观测模型，": "is the observation model,", "3 seeds ×1000 simulation episodes；独立/统一/无交叉优势等；RMA/DR/teacher 比较；真实抓取 easy 3 点/hard 5 点，每任务10次": "3 seeds ×1000 simulation episodes; independent/unified/no crossover advantages, etc.; RMA/DR/teacher comparison; real capture easy 3 points/hard 5 points, 10 times per task", "文字卡片": "Text card", "大规模并行训练及地形课程": "Large-scale parallel training and terrain courses", "Unitree Go2＋ViperX300 六自由度臂＋hook，四足＋臂": "Unitree Go2＋ViperX300 six degrees of freedom arm + hook, four legs + arm", "§2/§3.4：平台与四维动作接口": "§2/§3.4: Platform and four-dimensional action interface", "VLA、数据与闭环执行": "VLA, data, and closed-loop execution", "腕相机缺全局视野；人的六维头pose又不适合机器人两自由度neck。输入UMI头／腕图像与任务空间示范，输出双手轨迹和3D look-at point，而非要求机器人复制完整人头pose。": "The wrist camera lacks a global view; the human six-dimensional head pose is not suitable for the robot's two-degree-of-freedom neck. Input UMI head/wrist images and task space demonstrations, and output hand trajectories and 3D look-at points instead of requiring the robot to copy the complete human head pose.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；大量四足论文用PPO优化策略，但其全身协调、奖励和sim-to-real机制不是PPO自带。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; a large number of four-legged papers use PPO optimization strategy, but its whole-body coordination, reward and sim-to-real mechanisms are not included in PPO.", "机器人同时受反作用": "The robot is affected by the reaction at the same time", "投球从手工预抓球开始；操作policy zero-shot不等于WBC不训练；明确无人从sim force task训练；未collision/force feedback；140 ms odometry、抖动、URDF误差、overheat": "Pitching starts with manual pre-catch; operation policy zero-shot does not mean WBC does not train; it is clear that no one trains from sim force task; no collision/force feedback; 140 ms odometry, jitter, URDF error, overheat", "先用物体形状／姿态教师训练抓取，再通过 DAgger 把双分割深度学生带到其实际访 nt should retain the baseline and task caliber.", "【真实机器人】约6000次评价试验，检验未见物体与语义指令；CoRL 2023。实验不含四足边走边操作。": "[Real Robot] About 6,000 evaluation tests, testing unseen objects and semantic instructions; CoRL 2023. The experiment does not include walking on four legs.", "力信息进入 VLA 的位置决定它能改什么": "Where force enters a VLA determines what it can change", "在预训练视觉语言骨干上用Open X-Embodiment的大量机器人轨迹训练动作预测，公开模型权重／代码与适配流程。动作token化是其接口特点，未解决四足足接触调度。": "Use Open Action tokenization is a feature of its interface, which does not solve the problem of quadruped foot contact scheduling.", "行为参数能在当前任务和动力学下实现；训练行为空间中存在适合新环境的行为。外部选择者需提供适当b。": "Behavior parameters can be implemented under the current task and dynamics; there are behaviors suitable for the new environment in the training behavior space. External selectors are required to provide appropriate b.", "正文 §II/III/IV方法、仿真、硬件全文核心审读；§I摘要背景与§V结论核查；无另附录": "Text §II/III/IV method, simulation, hardware full text core review; §I abstract background and §V conclusion verification; no additional appendices", "特权critic不能直接部署；仿真真值若与现实偏差太大也未必帮得上忙。": "Privileged critic cannot be deployed directly; if the simulation true value deviates too much from reality, it may not be able to help.", "理解视觉、导航、机构模型怎样连接动作。": "Understand how vision, navigation, and mechanism models connect actions.", "只给策略额外输入不够：训练奖励也必须鼓励实际运动随b变化，否则策略可以忽略它。接触时序奖励、姿态／抬脚奖励及速度一致的Raibert足落点提供这类约束；在同一episode重采样行为，使策略学会切换。": "Giving the policy additional input is not enough: the training reward must also encourage the actual movement to vary with b, otherwise the policy can ignore it. Contact timing rewards, posture/foot-raising rewards, and Raibert foot landing points with consistent speed provide such constraints; resampling behaviors in the same episode allows the strategy to learn to switch.", "是在时刻": "is at the moment", "输入：语言任务、头部／腕部图像、机器人状态；训练时由人用 VR 遥控机器狗收集全身示范。 输出：任务规划器输出技能顺序；各技能策略产生末端等控制目标，下层生成身体和臂的关节命令。": "Input: language tasks, head/wrist images, robot status; whole-body demonstrations collected by humans using VR remote-controlled robot dogs during training. Output: The task planner outputs the skill sequence; each skill strategy generates terminal and other control targets, and the lower layer generates joint commands for the body and arms.", "WholeBodyVLA引用RT-2作为VLA先例；自己的全身潜动作模型另行训练。": "WholeBodyVLA cites RT-2 as a precedent for VLA; its own whole-body latent motion model is trained separately.", "论文关系图": "Paper map", "WildLMa明确使用CLIP文本—图像表示，计算目标物体概率图供技能网络使用。": "WildLMa explicitly uses CLIP text-image representation to calculate target object probability maps for use by the skill network.", "迁移末端轨迹、迁移视觉特征、联合训练机器人动作会提供不同信息；跨数据集和跨硬件不等于跨任意形态。": "Migrating end trajectories, migrating visual features, and jointly training robot actions will provide different information; cross-datasets and cross-hardware do not mean cross-arbitrary forms.", "并行环境在GPU上推进，直接向GPU策略／优化器提供状态、奖励和训练数据。": "The parallel environment advances on the GPU, providing status, rewards and training data directly to the GPU policy/optimizer.", "UMI on Legs用预训练CLIP视觉编码器；WildLMa用CLIP计算文本对象条件概率图；四足版FALCON用冻结CLIP特征协调策略。": "UMI on Legs uses a pre-trained CLIP visual encoder; WildLMa uses CLIP to calculate text object conditional probability maps; the four-legged version of FALCON uses frozen CLIP feature coordination strategies.", "铰链门的运动近似绕固定轴旋转，抽屉近似沿固定方向平移。已知模型可以生成合适轨迹；未知模型则要从手端／物体运动与受力中估计机构参数。交互既是在完成任务，也可能提供辨识信息，但必须保证尝试动作可承受。": "The motion of the hinged door approximates rotation around a fixed axis, and the drawer approximates translation along a fixed direction. The known model can generate a suitable trajectory; the unknown model needs to estimate the mechanism parameters from the movement and force of the hand/object. Interactions both complete tasks and may provide identifying information, but must ensure that the attempted actions are bearable.", "前者轮式 VLA 给末端路径点，再优化底盘和臂；后者四足 VLA 直接输出底盘速度、身体 pitch 与臂关节目标。两文没有同平台动作接口消融。": "The former wheeled VLA gives the end path poin
