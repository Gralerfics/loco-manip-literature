 "Local PDF title checked; main text methods, all core experiments and limitations have been read; most of the teacher/student, simulation, real robot, ablation and training scales of Appendices A–J have been checked. A small number of appendix hyperparameter consecutive sections have not been read item by item.", "系统／示范实验": "System/Demonstration Experiment", "附录 E：低层种子选择及实机配置；附录 C/D：训练规模与MuJoCo": "Appendix E: Low-level seed selection and actual machine configuration; Appendix C/D: Training scale and MuJoCo", "UMI on Legs 的末端轨迹接口、视觉足端示范的 Bézier 参数、Sumo 的身体速度／臂命令都是分层设计，但约束的行为集合不同。": "The end-effector trajectory interface of UMI on Legs, the Bézier parameters of the visual foot demonstration, and the body speed/arm commands of Sumo are all layered designs, but the set of constrained behaviors are different.", "位置＋速度监督改善局部轨迹一致性；未来目标预览改善提前决策；低通滤波改变输入频谱。应分别消融。": "Position + velocity supervision improves local trajectory consistency; future target preview improves early decision-making; low-pass filtering changes the input spectrum. should be ablated separately.", "持续走动时，能否利用摆动腿操作，而不为每个任务重新训练全部走路能力？底层输入身体移动指令和摆动足轨迹参数，输出关节角度目标；高层根据任务状态或视觉决定这些指令与参数。": "When walking continuously, is it possible to utilize swing leg maneuvers without retraining the entire walking ability for each task? The bottom layer inputs body movement instructions and swing foot trajectory parameters, and outputs joint angle targets; the upper layer determines these instructions and parameters based on task status or vision.", "盲走控制器在真实崎岖、松软地形上既要避免足滑移，也要跨仿真到真实的执行器误差。": "The blind walking controller must not only avoid foot slip on real rough and soft terrain, but also achieve real actuator errors across simulations.", "真机遥操作开门、按按钮、取样、推障碍，并用足端悬挂搬运 2.0 kg 背包；论文还测了可达空间、跟踪及扰动。它训练时施加交互扰动，但原文明确说没有显式建模或跟踪操作力；不能把抗扰能力写成受控施力能力。其工作空间与支撑也不同于背载 Piper 臂。": "The real robot remotely operated to open doors, press buttons, take samples, push obstacles, and carry a 2.0 kg backpack by hanging from the feet; the paper also measured the reachable space, tracking and disturbance. It applies interactive perturbations during training, but the original text clearly states that there is no explicit modeling or tracking of operating forces; the anti-disturbance capability cannot be written as a controlled force application capability. The workspace and support are also different from those of a piggyback Piper arm.", "是接触 Jacobian 中对应机械臂关节速度的列；它根据姿态和接触位置描述关节运动与接触点运动的关系，转置则将接触力换算成关节力矩。": "is the column corresponding to the robot arm joint speed in the contact Jacobian; it describes the relationship between joint motion and contact point motion based on attitude and contact position, and transposition converts the contact force into joint torque.", "复用 FastWAM 的视频／动作模型；未来视频教师监督只看当前状态的因果学生，base／arm 两个 latent 用自己的预测头保留动作、交叉梯度反转减少混杂。基座速度 token 帮视频分支解释镜头运动，不是显式 KF 或 SE(3) 对齐。": "Reuse the video/action model of FastWAM; in the future, the video teacher will supervise the causal students who only look at the current state. The base/arm two latents use their own prediction heads to retain actions and cross-gradient inversion to reduce confusion. The base velocity token helps the video branch account for camera motion, not explicit KF or SE(3) alignment.", "行走方法基础": "Locomotion foundations", "默认显示4篇四足＋臂核心，另单列Walk These Ways行走方法基础。展开全部论文可看22篇另列的技术基础；它们不计入loco-manipulation核心。实线标出核实的模块复用，背景引用另以浅色虚线表示。": "The default view shows four core quadruped-arm papers and Walk These Ways as a locomotion foundation. Expand the view to explore the full collection, including 22 other technical foundations. Solid links mark documented reuse; pale dashed links mark background citations.", "先用观测时的相机位姿表达目标，再用当前相机位姿表达预测后的目标。$\\widehat{\\bar p}^{W}(t_{\\mathrm{now}}\\mid t_{\\mathrm{obs}})$ 仍需适当的目标运动预测；静止目标是其特殊情况。": "First use the camera pose during observation to express the target, and then use the current camera pose to express the predicted target. $\\widehat{\\bar p}^{W}(t_{\\mathrm{now}}\\mid t_{\\mathrm{obs}})$ still requires proper target motion prediction; stationary targets are a special case.", "是为抵抗额外外力": "is to resist additional external forces", "身体朝向可用四元数等坐标表示，因此配置坐标与速度坐标不一定同维，不能一律写成": "The body orientation can be expressed by coordinates such as quaternion, so the configuration coordinates and velocity coordinates are not necessarily in the same dimension and cannot be written uniformly as", "§3.2 LMO：离散移动/高度、两阶段训练及smooth expression": "§3.2 LMO: discrete movement/height, two-stage training and smooth expression", "PDF摘要、方法接口、实验与结论相关段落的定向核读；未逐项复验所有数据表、附录、代码或视频。": "Directed reading of PDF abstracts, method interfaces, experiments and conclusion-related paragraphs; all data sheets, appendices, codes or videos were not re-examined item by item.", "原文称代码尚未公开、计划发布，不能仅据题名把它当现成可下载baseline。接触伪逆公式未完整区分重力／惯性偏差，不是精确外力估计证据。高impratio改善可能来自不现实的摩擦阻抗；每条件3次或地面1次，样本小。": "The original text states that the code has not yet been made public and is scheduled to be released. It cannot be regarded as a ready-to-download baseline based on the title alone. The contact pseudo-inverse formula does not completely differentiate between gravity/inertia deviations and is not evidence of accurate external force estimation. High impratio improvements may come from unrealistic frictional impedance; 3 times per condition or 1 on ground, small sample size.", "视觉语言动作模型不易知道手是否受阻；底层稳住身体，也未必知道该抵消什么接触影响。": "It is difficult for the visual language action model to know whether the hand is blocked; the bottom layer stabilizes the body, and it may not know what contact impact to offset.", "仿真训练能知道完整状态，但真实策略部署时只有图像等局部观测；让策略在训练时依赖完整状态会造成部署信息落差。": "Simulation training can know the complete state, but only partial observations such as images are available during real strategy deployment; allowing the strategy to rely on the complete state during training will cause a gap in deployment information.", "直接从图像学全部关节动作很难；复用一个会走路的底层可以减少学习负担，但也可能限制操作策略。": "It is difficult to learn all joint movements directly from images; reusing a walking bottom layer can reduce the learning burden, but it may also limit the operation strategy.", "Go2＋Piper 的 VLA 直接给底盘速度、身体俯仰与臂关节目标。": "Go2+Piper's VLA directly gives chassis speed, body pitch and arm joint targets.", "按动作组混合优势": "Mixing advantages by action group", "MimicGen直接lineage说明": "MimicGen direct lineage instructions", "RoboDuet 研究腿／臂协作指令；UMI on Legs 研究示范末端轨迹怎样由全身控制器跟踪。两者是并行接口，不是算法继承。": "RoboDuet studies leg/arm collaboration commands; UMI on Legs studies and demonstrates how end trajectories are tracked by whole-body controllers. The two are parallel interfaces, not algorithm inheritance.", "相较完全独立的腿臂控制，明确建立姿态协作接口；相较 Deep WBC，采用分工结构，着重扩大六维末端姿态跟踪范围。": "Compared with completely independent leg and arm control, a posture collaboration interface is clearly established; compared with Deep WBC, a division of labor structure is adopted to focus on expanding the six-dimensional end posture tracking range.", "是速度条件，": "is the speed condition,", "是加入当前观测后隐藏物理状态": "is to hide the physical state after adding the current observation", "VLA 全身动作": "VLA full body action", "Legged object manipulation 综述参考文献收录 Deep Whole-Body Control。": "Legged object manipulation Review reference collection Deep Whole-Body Control.", "是策略动作；": "is a strategic action;", "未接触时不能把负压入量直接解释成拉力。位置误差、稳态力误差、峰值力与接触丢失是不同指标；该近似未包含摩擦、碰撞冲击或迟滞。": "When there is no contact, the negative pressure input cannot be directly interpreted as tensile force. Position error, steady-state force error, peak force, and loss of contact are different metrics; this approximation does not include friction, impact shock, or hysteresis.", "全图导航。点击移动视窗。": "Full map navigation. Click to move the window.", "行走训练速度突破不等于本文设计了loco-manipulation的奖励、接触安排或手端控制。": "A breakthrough in walking training speed does not mean that this article designed loco-manipulation rewards, contact arrangements or hand-held controls.", "$t_{\\mathrm{obs}},t_{\\mathrm{now}}$ 是观测与执行时间，$C$ 是相机坐标系，$\\bar p$ 是带齐次坐标的位置，$T_{WC}$ 将相机坐标变换到世界坐标。": "$t_{\\mathrm{obs}},t_{\\mathrm{now}}$ is the observation and execution time, $C$ is the camera coordinate system, $\\bar p$ is the position with homogeneous coordinates, $T_{WC}$ transforms the camera coordinates to world coordinates.", "输入：上层看图像、夹爪姿态／开口和触觉历史；下层看机器人状态、触觉反馈以及期望运动与触觉目标。 输出：上层预测末端轨迹、夹爪开口和接触面积／方向／质心目标。第一阶段臂跟踪采用逆运动学；部署的低层策略输出腿和臂关节目标，分别降采样到 50 Hz 和 10 Hz 执行。": "Input: The upper layer looks at the image, gripper posture/opening and tactile history; the lower layer looks at the robot status, tactile feedback and desired movement and tactile targets. Output: The upper layer predicts the end-effector trajectory, gripper opening, and contact area/direction/center of mass targets. The first stage arm tracking uses inverse kinematics; the deployed low-level strategy outputs leg and arm joint targets, downsampled to 50 Hz and 10 Hz execution respectively.", "测试训练内、边界附近及训练外的同一目标，报告请求误差、投影距离、原任务成功率和失稳率。": "Test the same target within training, near the boundary and outside training, and report the request error, projection distance, original task success rate and instability rate.", "上式描述同步块执行的基本接口。异步推理还需对齐已承诺前缀与时间戳；平滑、插值和速度监督是另外的改动，不能从动作块记号推出。": "The above formula describes the basic interface of synchronized block execution. Asynchronous inference also requires alignment of committed prefixes and timestamps; smoothing, interpolation, and speed supervision are additional changes that cannot be deduced from action block notation.\nKinematic reachability, dynamic feasibility and existing strategy capabilities under", "输入：机器人和物体的当前状态、与示范的偏差、抓取端的位置和速度、当前动作进度。训练另需每个任务的一条规划示范。 输出：全身关节角度目标，以及示范进度的调整量；可以放慢、加快或倒退到前面的阶段。": "Input: the current status of the robot and the object, the deviation from the demonstration, the position and speed of the grasping end, and the current action progress. The training also requires a planning demonstration for each task. Output: Full body joint angle targets, and adjustments to the demonstration progress; this can be slowed down, sped up, or regressed to previous stages.", "逐项查后作正文中的训练数据来源、输入输出、复用的代码／权重、重新训练的模块，以及各自单独的消融实验。": "Check the source of training data, input and output, reused code/weights, retrained modules, and separate ablation experiments in the text one by one.", "Deployment Framework §3.1以Visual WBC部分开源实现为baseline，补MuJoCo与真机ROS接口；算法创新不是主贡献。": "Deployment Framework §3.1 uses part of the open source implementation of Visual WBC as the baseline to supplement the interface between MuJoCo and real robot ROS; algorithm innovation is not the main contribution.", "人类视频和机器人关节动作差异较大，直接共同训练一个动作模型可能学不好精细控制。与 EgoHumanoid 的对齐后共同训练形成两种并行数据路线；它们同届发表，不能画成前后继承。": "The joint movements of human videos and robots are quite different, and it may not be possible to learn fine control by directly training an action model together. After alignment with EgoHumanoid, they are jointly trained to form two parallel data routes; they are published in the same session and cannot be drawn as inheritance.", "问题比较": "Problem comparison", "本地 PDF 标题核对；主文完整，教师抓取聚合、双视角时间记忆、训练和全部定量实验已读。未观看补充视频，因此不登记未核实的真机定量结果。": "Local PDF title check; the main text is complete, and the teacher’s capture and aggregation, dual-perspective time memory, training, and all quantitative experiments have been read. The supplementary video was not watched, so unverified real-machine quantitative results were not registered.", "表示批次样本平均。PPO 最大化该裁剪代理目标，完整训练还可含价值与熵项。": "represents the batch sample average. PPO maximizes the clipping agent objective, and full training can also include value and entropy terms.", "这是单个接触的库仑静摩擦近似，": "This is the Coulomb static friction approximation for a single contact,", "多接触指臂在推箱过程中多次换接触区域，不等于同时优化四足／臂所有接触模式。": "The multi-contact finger arm changes contact areas multiple times during the box pushing process, which does not mean optimizing all contact modes of the four legs/arms at the same time.", "广义力向量的平移分量是力，转动分量是力矩，单位并不全相同。有些接触模型还允许接触处传递力矩，这时": "The translational component of the generalized force vector is force, and the rotational component is moment. The units are not all the same. Some contact models also allow torque to be transmitted at the contact point, in which case", "使用 ReLIC、CEM／MPPI 系列、MuJoCo 与样条参数化搜索；没有提出新的低层控制策略。": "Parametric search using ReLIC, CEM/MPPI family, MuJoCo and splines; no new low-level control strategies proposed.", "共享可微模型、短时回传、效率对照与对象接触边界": "Shared differentiable models, short-term callbacks, efficiency comparison and object contact boundaries", "实际承接与仅作背景的关系分开登记在literature/foundations.md；原作重点是大规模真实机器人控制，并未直接学习四足足接触或底盘—手臂接触补偿。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; the original work focuses on large-scale real robot control and does not directly learn quadruped foot contact or chassis-arm contact compensation.", "腿需要稳定、手需要精确、动作需要平滑。固定相加的奖励可能让某一目标支配更新，也可能使量纲和梯度不均衡。": "The legs need to be stable, the hands need to be precise, and the movements need to be smooth. The fixed sum of rewards may allow a certain goal to dominate the update, or it may make the dimensions and gradients unbalanced.", "§VIII-B/D/E：真机消融、结果与场景泛化": "§VIII-B/D/E: real robot ablation, results and scene generalization", "用人体动作捕捉学习自回归的条件全身生成器，并在生成时看手端轨迹的未来窗口；生成的全身参考交由 WBC 跟踪。与直接从手端目标求一个局部逆运动学解相比，增加了数据驱动的身体和足运动先验。": "Use human motion capture to learn an autoregressive conditional whole-body generator, and look at the future window of the hand trajectory during generation; the generated whole-body reference is tracked by WBC. Compared with finding a local inverse kinematics solution directly from the hand target, data-driven body and foot motion priors are added.", "Octo正文明确在Open X-Embodiment约800k轨迹预训练，并测试跨平台微调。": "The text of Octo clearly pre-trains about 800k trajectories in Open X-Embodiment and tests cross-platform fine-tuning.", "还应区分单刚体、质心动量与完整关节动力学：质心模型可以通过全身动量映射反映姿态分布，未必完全忽略臂；上层的简化模型和低层逆动力学所保留的项也可能不同。": "You should also distinguish between single rigid body, center-of-mass momentum and complete joint dynamics: the center-of-mass model can reflect the posture distribution through whole-body momentum mapping and may not completely ignore the arms; the terms retained by the upper-level simplified model and the lower-level inverse dynamics may also be different.", "PPO、非对称/本体训练接口、PD、域随机化、腿式地形课程；参考UMI on Legs的位姿跟踪评测。": "PPO, asymmetric/ontology training interface, PD, domain randomization, leg terrain course; refer to UMI on Legs' pose tracking evaluation.", "与多策略技能库不同，原作使用一个条件策略；与无监督技能发现不同，行为参数及辅助奖励由人设计。": "Unlike the multi-strategy skill library, the original game uses a conditional strategy; unlike unsupervised skill discovery, behavioral parameters and auxiliary rewards are designed by humans.", "是相机坐标系，": "is the camera coordinate system,", "Arm-dynamics NMPC引言以早期统一MPC为先例，研究臂动力学不可忽略的问题；具体模型与求解已改变。": "Arm-dynamics NMPC Introduction takes the early unified MPC as a precedent to study issues that cannot be ignored in arm dynamics; the specific model and solution have changed.", "明确以既有全身 RL 及 teacher–student 范式为基础；PPO、PointNet、IK、DAgger 和 TrackingSAM 各承担独立职责；下游 WildLMa 明确复用本工作低层；其 ACT 与任务规划不是本篇贡献": "It is clearly based on the existing whole-body RL and teacher-student paradigms; PPO, PointNet, IK, DAgger and TrackingSAM each bear independent responsibilities; the downstream WildLMa clearly reuses the lower layer of this work; its ACT and task planning are not contributions to this article", "是 Go2-W 轮足＋Piper，不是普通步行四足；把导航60%与操作80%分开，不能将后者写为端到端，也不能把二者相乘当实测；position-velocity consistency loss 不是已证明柔顺/力控制；近场对齐不是完整可操作 base pose optimization": "is Go2-W wheel + Piper, not an ordinary walking quadruped; 60% of navigation is separated from 80% of operation, the latter cannot be written as end-to-end, nor can the two be multiplied as actual measurement; position-velocity consistency loss is not proven compliance/force control; near-field alignment is not fully operational base pose optimization", "非对称 PPO、关节 PD、粗细跟踪奖励、地形课程与域随机化；现成 VLM／检测导航链。": "Asymmetric PPO, joint PD, thick and thin tracking bonus, terrain courses and domain randomization; ready-made VLM/detection navigation chain.", "必须明确传感器、力的方向与符号，以及接触状态。稳态力误差、峰值力和滑脱是不同评价量。": "The sensor, the direction and sign of the force, and the contact status must be specified. Steady-state force error, peak force and slippage are different evaluation quantities.", "。这里是简化接口，完整输入见原文§3.2。": ". Here is a simplified interface. For complete input, see §3.2 of the original text.", "TAMP 综述": "TAMP Overview", "操作可用站位需要同时满足目标距离／朝向、臂可达、视野、碰撞和后续机构轨迹。可达图可以预先筛选，在线规划可以随对象状态重算，也可以训练站位策略。终点是一个可操作区域或姿态集合，而不是唯一距离阈值。": "The available stations for operation need to meet the target distance/orientation, arm reach, field of view, collision and subsequent mechanism trajectory at the same time. The reachability graph can be pre-screened, the online planning can be recalculated according to the object status, and the positioning strategy can also be trained. The end point is an operable region or a collection of poses, not a unique distance threshold.", "篇研究论文核心方法／实验。附录范围逐篇登记。": " research papers reviewed for core methods and experiments. Scope is recorded per paper.", "从动力学、关节力矩和摩擦等约束计算轨迹在最不利方向上还能承受多大外力，用这个抗扰裕量作为轨迹优化目标；允许足接触位置在给定阶段内调整。接触何时建立或断开仍需预先指定。": "Calculate how much external force the trajectory can withstand in the most unfavorable direction from constraints such as dynamics, joint moments and friction, and use this interference margin as the trajectory optimization target; allow the foot contact position to be adjusted within a given stage. When contact is established or broken still needs to be specified in advance.", "预设接触时序的统一机器人—物体MPC": "Unified robot with preset contact timing—Object MPC", "学习力目标，外层位置反馈构造柔顺行为。": "Learning force target, outer position feedback constructs compliant behavior.", "奖励速度跟踪；固定辅助项": "Bonus speed tracking; fixed auxiliary items", "相较把所有奖励固定相加，能从“先找到接触”过渡到“把任务做好”；相较 Guided RL，不需要一条完整动作示范，但需要接触提示。": "Compared with the fixed sum of all rewards, it can transition from \"finding contact first\" to \"doing the task well\"; compared with Guided RL, it does not require a complete action demonstration, but requires contact prompts.", "第二式描述理想直线滑动，": "The second formula describes ideal linear sliding,", "先到物体背侧推送区，再启用移物回报": "Go to the push area on the back of the object first, and then enable the object moving report", "三视角为不同子策略和共享语义分别服务": "Three perspectives serve different sub-policies and shared semantics respectively", "比较论文复用了什么、真正修改了什么，以及实验在哪些条件下支持它。点击卡片展开全文定位与对应知识。": "Compare what was reused in the paper, what was actually modified, and under what conditions the experiments supported it. Click on the card to expand the full text positioning and corresponding knowledge.", "RoLoMa 优化抗外力轨迹；Contact as a Decision Variable 还选择支撑点并计算能力损失；FALCON 则在训练中暴露外力扰动。": "RoLoMa optimizes the trajectory against external forces; Contact as a Decision Variable also selects support points and calculates capacity losses; FALCON exposes external force perturbations during training.", "§IV-A–D，尤其IV-D.1/2；§V-B–E；Table II/III；§VI": "§IV-A–D, especially IV-D.1/2; §V-B–E; Table II/III; §VI", "臂希望身体倾斜以够到目标，但某条腿已无力，继续执行同样姿态会让机器人倒下。": "The arm wants to tilt the body to reach the target, but one of the legs is weak and continuing to perform the same posture will cause the robot to fall.", "输入：期望身体速度、操作足端的位置和施力，机器人自身状态、步态信息及近期历史。 输出：最终关节力矩。其中模型计算基础力矩，学习模块修正身体加速度和关节角度目标，再形成反馈力矩。": "Input: expected body speed, position and force of the operating foot, robot's own status, gait information and recent history. Output: Final joint moment. The model calculates the basic torque, the learning module corrects the body acceleration and joint angle targets, and then forms the feedback torque.", "指定移动速度，": "Specify movement speed,", "不能把62.3%写成真机结果；补充视频不能替代定量hardware证据；TMA是感知历史，不是已操作/失败事件记忆；attention聚合抓取特征不是平均6D抓取姿态；可靠性descriptor融合不是Bayesian几何sensor fusion": "62.3% cannot be written as real robot results; supplementary video cannot replace quantitative hardware evidence; TMA is perception history, not operation/failure event memory; attention aggregation grabbing features are not average 6D grabbing posture; reliability descriptor fusion is not Bayesian geometry sensor fusion", "表示接触和摩擦限制。": "Indicates contact and friction limits.", "仅以平地速度跟踪定义任务，存在很多同样有效的行走方式。RL常收敛到其中一种；这种方式在新环境不合适时，往往要修改环境／奖励再训练。本文保留多种受控行为，使部署者能在不更新网络权重的情况下选择更合适的行走方式。": "Define the task at flat ground speed tracking only, there are many equally valid ways of walking. RL often converges to one of them; when this method is not suitable in the new environment, it is often necessary to modify the environment/reward and retrain. This paper retains a variety of controlled behaviors, allowing the deployer to choose a more appropriate walking method without updating network weights.", "问题与接口": "Problem and interface", "PPO、非对称actor–critic、POE运动学、阻尼最小二乘IK、三次参考插值、域随机化。": "PPO, asymmetric actor–critic, POE kinematics, damped least squares IK, cubic reference interpolation, domain randomization.", "阻抗／导纳定义": "Impedance/Admittance Definition", "仿真和真机比较跟踪、工作空间与任务表现，并测试相近 Go1／Go2 平台之间的迁移。": "Compare tracking, workspace and task performance between simulation and real robot, and test migration between similar Go1/Go2 platforms.", "MolmoAct2家族、BinWalker衍生arm-aware RL步态、Piper领从示教；未核实采用UMI on Legs全身控制器。": "MolmoAct2 family, an arm-aware BinWalker-derived RL gait policy, and Piper leader–follower teleoperation. Use of the UMI on Legs whole-body controller is not established.", "仿真比较真实参数、固定先验和在线估计；真机 Go1 无外挂臂，以身体推物，测试篮子从 3 kg 加到 4 kg 及从混凝土地面到草皮垫。它验证在线动力学适应，不验证机械臂接触操作；任务改善也不等于质量和摩擦分别被准确辨识。": "Simulation compares real parameters, fixed priors and online estimation; the real robot Go1 has no external arm and pushes objects with the body. The test basket is increased from 3 kg to 4 kg and from the concrete floor to the turf mat. It verifies online dynamic adaptation and does not verify manipulator contact operation; task improvement does not mean that mass and friction are accurately identified respectively.", "统一自由位置／接触力目标，接上力条件操作策略。": "Unify the free position/contact force target and connect the force condition operation strategy.", "手持示范训练手端轨迹策略，四足 RL 全身控制器自主协调腿臂。": "Handheld demonstration training hand trajectory strategy, quadruped RL full body controller autonomously coordinates legs and arms.", "B1＋Z1 真机在五个末端位置测量施力，误差约 5–10 N；展示柔顺示教、拉物体及移动中操作。控制器明确接收身体速度命令，包含行走能力，并非仅固定底盘的力控制。": "B1＋Z1 The real robot measures the force at five end positions, with an error of about 5–10 N; demonstrating compliant teaching, pulling objects, and moving operations. The controller explicitly receives body speed commands, including walking ability, and is not just a force control to fix the chassis.", "根据当前状态／追踪奖励推进示范相位，执行落后时放慢或暂停；学到的相位残差可在接触丢失后回退。按接触模式构造追踪，使单条规划示范成为反馈执行参考。": "Advance demonstration phases based on current status/tracking rewards, slowing down or pausing when execution falls behind; learned phase residuals can be rolled back after contact is lost. Structure traces by contact pattern so that a single planning demonstration becomes a feedback execution reference.", "反复让当前学生运行，把其实际访问的状态及专家纠正动作汇入训练集，再做监督学习。核心是训练状态分布逐步接近部署分布，而非只增加原始示范量。": "Let the current student run it repeatedly, import its actual access status and expert corrective actions into the training set, and then do supervised learning. The core is that the training status distribution gradually approaches the deployment distribution, rather than just increasing the original demonstration volume.", "额外接触选择": "Additional contact options", "同一举升距离改变起升时间、质量与阻力，固定低层比较无力前馈、静态重量和时变力预测。": "The same lifting distance changes the lifting time, mass and resistance, and the fixed low-level comparison is incapable of feedforward, static weight and time-varying force prediction.", "改变释放延迟、初始位置／速度误差与残差频率，比较窗口内最大落点误差和实际成功率。原论文用1500初态×5种子及100/200/400 Hz仿真检验；真机40次落点比较另列。": "Change the release delay, initial position/velocity error and residual frequency, and compare the maximum landing point error within the window with the actual success rate. The original paper uses 1500 initial states × 5 seeds and 100/200/400 Hz simulation testing; the comparison of 40 drop points on the real robot is listed separately.", "B1＋Z1；腿12维RL，臂解析IK；ROS控制500 Hz": "B1+Z1; leg 12-dimensional RL, arm analytical IK; ROS control 500 Hz", "VLA基础": "VLA basics", "先看一个保持静止的机械臂关节。模型可以根据当前姿态和负载算出：没有额外接触时，电机应提供多少力矩。如果实际电机力矩与这个值不同，两者的差就是关节力矩残差。‘残差’只是预测值与实际值的差；在模型和反馈可靠时，这个差可以反映环境额外施加的作用，实际中也可能混入摩擦或模型误差。": "Let’s first look at a robotic arm joint that remains stationary. The model can calculate based on the current attitude and load: how much torque the motor should provide without additional contact. If the actual motor torque is different from this value, the difference between the two is the joint torque residual. The 'residual' is simply the difference between the predicted value and the actual value; when the model and feedback are reliable, this difference can reflect the additional effects of the environment, but in practice it may also be mixed with friction or model errors.", "做信号输入×低层补偿的析因消融，必要时再比较真值与估计；同时记录任务、力、延迟和身体动作。": "Perform factorial ablation of signal input × low-level compensation, and compare the true value with the estimate if necessary; record tasks, forces, delays, and body movements at the same time.", "【真机＋仿真】仿真比较AAC、AAC＋PFG、ROA、ROA＋AM；5000位姿用第60百分位误差，1000速度指令测速度跟踪。PFG位置误差8.7 cm、转动0.18 rad，不能当平均误差。真机X20＋Z1展示移动时末端升降及身体俯仰补偿，另有拾取与拖车案例。": "[real robot + simulation] Simulation comparison of AAC, AAC + PFG, ROA, ROA + AM; 5000 poses using the 60th percentile error, 1000 speed commands to measure speed tracking. The PFG position error is 8.7 cm and the rotation error is 0.18 rad, which cannot be regarded as the average error. The real robot X20+Z1 shows the terminal lifting and body pitch compensation when moving, and there are also cases of picking up and towing.", "CoRL 2026 Oral 的高效全身跟踪训练路线；有控制变量的PPO对照和G1真机动作，但主动过滤物体交互。作为相邻训练方法观察，不列四足移动操作核心主线。": "CoRL 2026 Oral's efficient whole-body tracking training route; PPO control with controlled variables and G1 real-machine movements, but actively filtering object interactions. Observed as an adjacent training method, the core main line of quadrupedal movement operations is not listed.", "ANYmal-D＋DynaArm，18关节角度目标／PD；操作策略50 Hz": "ANYmal-D＋DynaArm, 18 joint angle targets/PD; operation strategy 50 Hz", "EgoHumanoid 与 Ψ₀ 分别采用人机对齐混训和分阶段骨干／动作专家训练，是数据使用策略的并行选择。HoMMI 扩展原始 UMI 的移动双臂采集；Human2LocoMan 依赖特定腿上轻臂形态。‘人类数据预训练’不是一个足够具体的知识点，必须写清预训练了哪部分、监督是什么。": "EgoHumanoid and Ψ₀ respectively adopt human-machine alignment mixed training and staged backbone/action expert training, which are parallel choices of data usage strategies. HoMMI extends the original UMI's mobile arm acquisition; Human2LocoMan relies on specific leg-light arm morphology. \"Human data pre-training\" is not a specific enough knowledge point. It is necessary to clearly describe which part of the pre-training is included and what the supervision is.", "历史网络可以推断影响动作的隐变量，例如载荷、接触、执行器变化；它不必输出有物理单位的辨识结果。视觉学生还要解决图像到任务状态的误差。应逐项列出训练教师、critic、部署 actor 的输入，不能统称网络‘只用本体’或‘端到端视觉’。": "The history network can infer hidden variables that affect actions, such as load, contact, and actuator changes; it does not have to output identification results in physical units. Vision students also have to deal with errors from images to task states. The inputs for training teachers, critics, and deployed actors should be listed one by one, and the network cannot be collectively referred to as 'ontology only' or 'end-to-end vision'.", "Multi-critic twist 主要分开目标评价；Contact-guided exploration 调节探索与任务的相对作用；FALCON 还把动作分给两个独立更新的策略。": "Multi-critic twist mainly separates target evaluation; Contact-guided exploration adjusts the relative role of exploration and tasks; FALCON also divides actions into two independently updated strategies.", "ANYmal＋Kinova 真机在工业平台模拟环境转手轮、拉杆、推门，并在后退迈步时拉绳提桶；比较不同轨迹承受外力的能力。论文报告其优化轨迹在所测方向上的最小不可抵抗外力约 60 N，比对照轨迹高约 33%。": "ANYmal＋Kinova The real robot turns the hand wheel, pulls the lever, pushes the door in the industrial platform simulation environment, and pulls the rope to lift the bucket when stepping backward; compare the ability of different trajectories to withstand external forces. The paper reports that the minimum irresistible external force of its optimized trajectory in the measured direction is about 60 N, which is about 33% higher than the control trajectory.", "综述，不提供新的四足真机实验。": "Overview, does not provide new quadruped real robot experiments.", "Unitree G1；真机objectpose使用MoCap，人形邻接": "Unitree G1; real robot objectpose uses MoCap, humanoid adjacency", "每task20rollouts；P1vision/P2tactileobs/P3tactileprediction但低层不用/P4 lowlevel tracking；insertion70→85%、whole60→80%；valve80→85%；chip100% tactile variants": "20 rollouts per task; P1vision/P2tactileobs/P3tactileprediction but not used at low level/P4 lowlevel tracking; insertion70→85%, whole60→80%; valve80→85%; chip100% tactile variants", "41 heterogeneous assets，仿真 train79.35%/test79.02%；no sampling test70.23%、pointcloud41.39%；全程方向误差完整0.1701对本体单支0.1827、视觉单支0.2482；contact-only本体0.0606优于完整0.0687；实机多柜门/抽屉及重新抓取主要定性，无大规模真机统计success table；初始 handle/panel world-frame包围盒由外部提供，LiDAR odometry更新robot-relative几何；未证明全自主视觉估计包围盒": "41 heterogeneous assets, simulation train79.35%/test79.02%; no sampling test70.23%, pointcloud41.39%; the whole direction error is complete 0.1701 for the ontology single branch 0.1827, the visual single branch 0.2482; the contact-only ontology 0.0606 is better than the complete 0.0687; the real robot multiple cabinet doors/drawers and re-grabbing are mainly qualitative, there is no large-scale real robot statistical success table; the initial handle/panel world-frame bounding box is provided externally, LiDAR Odometry updates robot-relative geometry; fully autonomous visual estimation of bounding boxes not proven", "Preprints.org 2026-10-07，尚未查到同行评审正式版；方法表主要是夹爪、灵巧手和双臂，不提供四足移动操作性能对照。": "Preprints.org 2026-10-07, the official peer-reviewed version has not yet been found; the method table mainly covers the gripper, dexterous hand and both arms, and does not provide a comparison of the four-legged mobile operation performance.", "真机物体姿态由外部运动捕捉系统测量；训练依赖物体几何和接触候选。移椅子的仿真成功率约 94%，不能当成真机结果；洗碗机接触切换部分没有明确的真机验证记录。": "Real object poses are measured by an external motion capture system; training relies on object geometry and contact candidates. The simulation success rate of moving a chair is about 94%, which cannot be regarded as the result of a real robot; there is no clear real robot verification record for the contact switching part of the dishwasher.", "作者全文核心方法、主要实验与限制核读；§III-A–C；§IV-A–C；Tables IV–VI；Fig.4/5；§V；未运行代码／观看视频，附录覆盖按定位记录": "The author's full text core methods, main experiments and restricted reading; §III-A–C; §IV-A–C; Tables IV–VI; Fig.4/5; §V; code not run/video watched, appendix covering records by positioning", "真机依赖外部动捕和离机计算；需对象模型、在线仿真及评分规则。物体坐标中的抓取／接近位置仍由任务设置给定；论文重点是上层规划，低层控制器不是其新贡献。": "The real robot relies on external motion capture and off-machine calculation; it requires object model, online simulation and scoring rules. The grasp/approach position in object coordinates is still given by the task setting; the focus of the paper is on upper-level planning, and the low-level controller is not its new contribution.", "§III；§IV；结论": "§III; §IV; Conclusion", "目标修正与实机对照": "Target correction compared with actual machine", "控制模式混合": "Control mode mixed", "G1人形；动捕身体及物体；状态输入而非视觉VLA": "G1 humanoid; motion capture of body and objects; status input instead of visual VLA", "机械臂仍由几何求解控制，不能理解为 RL 联合输出所有关节。主要研究给定目标的地形执行，而非高层接触任务选择。": "The robotic arm is still controlled by the geometry solver and cannot be understood as RL jointly outputting all joints. The primary study is terrain execution for a given target rather than high-level contact mission selection.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；技能库的覆盖范围决定可执行步骤；本库多数引用仅作语言规划背景，WildLMa未证实直接采用SayCan的评分公式。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; the coverage of the skills library determines the executable steps; most of the references in this library are only for language planning background, and WildLMa has not confirmed that it directly uses SayCan's scoring formula.", "都利用身体位姿与臂正运动学计算手端。": "Both use body posture and arm forward kinematics to calculate the hand end.", "手端目标怎样落到全身动作上": "Turning end-effector goals into whole-body actions", "Robot-Free指人示范采集过程，不是整个训练无robot示范；78/82不能写为端到端成功率；82对31差51percentage points，不是相对提升51%；新robot domain不能不加条件地称全部训练未见domain": "Robot-Free refers to the human demonstration collection process, not the entire training without robot demonstration; 78/82 cannot be written as the end-to-end success rate; the difference between 82 and 31 is 51percentage points, which is not a relative improvement of 51%; the new robot domain cannot be unconditionally called all training unseen domains", "HyQReal＋Kinova Gen3；仅 Gazebo 仿真，四足全程固定在地面。": "HyQReal＋Kinova Gen3; only Gazebo simulation, all four legs are fixed to the ground.", "人工库、已知动作和posegrounding；不能外推无库任意任务规划；路径arc/Dubins型限制是设计接口，不证明humanoid本体必有wheel式nonholonomicconstraint；关键帧筛选用加速度峰，不能视为一般语义压缩定理": "Artificial libraries, known actions and posegrounding; arbitrary task planning without libraries cannot be extrapolated; path arc/Dubins type restrictions are design interfaces, which do not prove that the humanoid ontology must have wheel-type nonholonomic constraints; key frame screening uses acceleration peaks, which cannot be regarded as general semantic compression theorem", "步态闭环辨识": "Gait closed-loop identification", "【真机＋仿真】平地约4分钟、复杂地形约20分钟训练ANYmal策略并迁移真机；训练时长是所述硬件和任务设置，不可外推到带臂任务。": "[real robot + Simulation] It takes about 4 minutes on flat ground and 20 minutes on complex terrain to train the ANYmal strategy and migrate it to the real robot; the training time is based on the hardware and task settings described and cannot be extrapolated to arm-mounted tasks.", "RTC训练/执行前缀": "RTC training/execution prefix", "多个 critic 可以分别估计不同回报，再组合各自优势用于策略更新。若权重固定且评价完全准确，线性组合在目标层面对应同一加权回报；实质变化常来自近似、归一化、动态权重、共享／独立优化和探索行为。不能仅因‘多个 critic’就认为解决了一个新的控制约束。": "Multiple critics can estimate different returns respectively, and then combine their respective advantages for strategy update. If the weights are fixed and the evaluation is completely accurate, the linear combination corresponds to the same weighted return at the target level; substantial changes often come from approximation, normalization, dynamic weighting, shared/independent optimization and exploration behavior. Just because there are ‘multiple critics’ does not mean that a new control constraint is solved.", "Dynamic Pick-and-Place把Visual WBC臂扰动生成作为低层对照：任务高层重训，不能把9/10对3/10解释为原论文整个系统排名。": "Dynamic Pick-and-Place uses Visual WBC arm perturbation generation as a low-level comparison: high-level retraining of the task, and 9/10 versus 3/10 cannot be interpreted as the entire system ranking of the original paper.", "挂载臂、用腿操作、固定夹爪、人形都可能有全身耦合，但自由度、足支撑和执行器能力不同。不能把一个形态的控制结果直接当成另一个形态的性能。": "Mounted arms, leg-operated, fixed grippers, and humanoids may all have whole-body coupling, but with different degrees of freedom, foot support, and actuator capabilities. The control results of one form cannot be directly regarded as the performance of another form.", "§III，p.3–4：遥操作、特征与 ACT": "§III, p.3–4: Teleoperation, Features and ACT", "表示方向无偏的最不利方向力余量。": "Indicates the most unfavorable directional force margin with no deviation in direction.", "T-Mech 综述参考文献 [84] 收录 ETH 多接触规划。": "T-Mech review reference [84] includes ETH multi-contact planning.", "方法将目标条件自主探索与全身操作策略分层；接口上导航给目标区域，操作层协调臂和腿。": "The method layers autonomous exploration of target conditions and whole-body operation strategies; the interface navigates to the target area, and the operation layer coordinates arms and legs.", "‘浮动基’指身体没有被固定在地面上：电机直接驱动腿和臂的关节，身体的位置和朝向则要靠这些关节以及地面接触来改变。例如机械臂向前顶住面板，面板会反过来推机器人；身体要靠足底与地面的作用力承受它。抬起一只脚后，能承担这部分作用力的接触也会改变。": "‘Floating base’ means that the body is not fixed to the ground: the motor directly drives the joints of the legs and arms, and the position and orientation of the body are changed by these joints and ground contact. For example, if the robotic arm pushes the panel forward, the panel will push the robot in turn; the body has to rely on the force between the soles of the feet and the ground to bear it. When you lift one foot, the contact that can absorb this force also changes.", "正文 §III–V 方法与结果审读；表格误差及架构核查；无完整参考文献推导审读": "Text §III–V Review of methods and results; check of table errors and structure; review of derivation without complete references", "四任务ID/新机器人场景实验": "Four mission ID/new robot scene experiment", "Aliengo＋自制一自由度臂真机举起／搬运最高 8 kg 载荷；门任务及 10 kg 物体快速起升测试为仿真。对照分别移除操作力预测或改变姿态优化，适合重载分支，不宜拿其结果推断轻触电气面板性能。": "The Aliengo+ self-made one-degree-of-freedom real robot can lift/carry a maximum load of 8 kg; the door task and the rapid lifting test of 10 kg objects are simulations. Compared with respectively removing the operating force prediction or changing the attitude optimization, it is suitable for heavy-duty branches, and it is not appropriate to use the results to infer the performance of light-touch electrical panels.", "Force Control 2024、统一位置／力 RL 2025、FALCON 的未知外力适应与触觉区域预测并非同一知识点；有时任务表现相似，控制目标仍不同。": "Force Control 2024, unified position/force RL 2025, FALCON's unknown external force adaptation and tactile area prediction are not the same knowledge points; sometimes the task performance is similar, but the control goals are still different.", "篇正文核心核读": " research papers reviewed in depth", "四足双手技能的机器人数据少，人类操作示范量大但动作结构不同。输入人类示范和少量全身机器人遥操作数据，输出视觉条件的四足操作策略。": "There is little data on robots with quadrupedal and bimanual skills, and a large amount of human operation demonstrations but different action structures. Input human demonstration and a small amount of whole-body robot teleoperation data, and output a vision-conditioned quadruped operation strategy.", "Force-Aware Reinforcement Learning with Hybrid Sensorless Force Estimation for Wheeled-Legged Loco-Manipulation（轮足邻接）": "Force-Aware Reinforcement Learning with Hybrid Sensorless Force Estimation for Wheeled-Legged Loco-Manipulation (wheel-foot adjacency)", "主要成功率收益来自自适应相位，相位残差的平均额外收益较小；不能认为已解决门锁解锁。示范进度判据与应用任务的完成判据不同。": "The main success rate gain comes from adaptive phase, and the average additional gain from phase residual is smaller; door lock unlocking cannot be considered solved. The demonstration progress criteria are different from the application task completion criteria.", "同一任务由一套网络以不同运动方式完成。": "The same task is completed by a set of networks in different motion modes.", "推椅子时，如果一直碰不到合适位置，学习几乎收不到有用奖励；一直奖励靠近某个点又会妨碍真正移动椅子。": "When pushing a chair, if you never reach the right position, you will receive almost no useful rewards for learning; always being rewarded close to a certain point will prevent you from actually moving the chair.", "执行进度与重复动作": "Execution progress and repeated actions", "Results；Materials and Methods；Figs.3–7；补充实验定位；未观看视频或完整核全部补充材料": "Results; Materials and Methods; Figs.3–7; Supplementary Experiment Positioning; Have not watched the video or fully checked all supplementary materials", "动作组优势和非对称训练": "Advantages of action sets and asymmetric training", "ETH同作者方法线：2021统一MPC预设接触时序，2023增加离散接触搜索；已核题目和问题扩展，未证明复用同一求解器代码。": "ETH is the same as the author's method line: Unify MPC preset contact timing in 2021, add discrete contact search in 2023; the questions and problem extensions have been verified, and the reuse of the same solver code has not been proven.", "已有视觉抓取主要针对静止对象。持续移动的目标使当前抓取位姿很快过期，逐帧运行大型抓取网络又有计算与时序代价；需要视觉历史与稳定抓取候选共同指导接近。": "Existing visual grasping mainly targets stationary objects. Continuously moving targets make the current capture pose expire quickly, and running a large capture network frame by frame has computational and timing costs; visual history and stable capture candidates are required to jointly guide the approach.", "
