_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2606.24466", "title": "FT-WBC: Learning Fault-Tolerant Whole-Body Control for Legged Loco-Manipulation", "label": "FT-WBC", "year": "2026", "date": "2026-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The arm wants to tilt the body to reach the target, but one of the legs is weak and continuing to perform the same posture will cause the robot to fall.", "method": "Reduce the available torque of the actuator in the simulation and learn fault identification; change the body posture raised by the arm to a posture more suitable for the current support capacity, and then perform joint execution. The appendix stipulates that the training mainly weakens three joints of the same leg, and single-joint weakening and locking are subsequent evaluation conditions.", "interface": "Input: The leg and arm’s own state history, expected speed/end attitude, and joint fault information estimated from the leg state. Output: arm joint target and desired body posture; the posture adjustment module corrects the body requirements according to the fault, and the leg strategy outputs the joint target to compensate for the gait.", "improvement": "Compared with the RoboDuet-style division of labor interface, fault-driven body request adjustment is added; compared with the fault-tolerant method that only guarantees walking, the reachable range of the arm is also considered.", "experiment": "Simulation compares tracking and work space under faults; the real robot picks up objects from the ground and places them on the desktop at 50, 75, and 90 cm high, and does 20 times for each height and each fault. Under the most difficult 90 cm locking condition, it survived 14/20 times and was successfully placed 9/20 times, indicating that there is a trade-off between maintaining stability and completing the original task.", "limit": "The real robot is mainly operated while standing or moved first and then operated. The fault tolerance of maintaining contact while walking has not been verified. The original text §4 states that w/o FE uses real fault labels, but the subsequent explanation of the results states that it lacks fault awareness, has inconsistent definitions, and cannot determine the gain of the estimator alone based on this. Being able to save your body and work space does not mean complete mission recovery or high-level re-planning.", "url": "https://arxiv.org/abs/2606.24466", "pdf": "papers/2606.24466_FT-WBC_Learning_Fault-Tolerant_Whole-Body_Control_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2610.23548", "title": "Reinforcement Learning Based Multi-Terrain Adaptive Whole-Body Control for a Quadruped Manipulator", "label": "Reinforcement Learning Based", "year": "2026", "date": "2026-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When the small robot dog walks on slopes, steps or soft ground, the pursuit of hand accuracy and maintaining body stability can easily conflict.", "method": "The position target is attached to the body, with the end facing the direction of maintaining gravity; body status/speed tracking performance gated low-priority operation rewards. There is no need for actors to read the terrain, the height map only trains the critic.", "interface": "Input: body and joint status, last movement, body speed, and end target. The local terrain height map is only used in the trained evaluation network and is not input to the deployment action network. Output: The same learning strategy outputs angle targets for twelve leg joints and six arm joints.", "improvement": "Compared with a fixed mix of various rewards, the operation weight is adjusted according to the current stability and walking performance; compared with TA-WBC, the deployment strategy does not require an explicit terrain map, and the arms are also output by the strategy.", "experiment": "Simulation per condition 1024, model/mass/speed/load comparison; real robot slope and step tracking, 32 successful captures of 40 complete rough terrain navigations. Separate 8 failure reasons.", "limit": "Set the speed to zero after grabbing into the workspace. The 1.6cm position error of the step is the body coordinate FK, not the fixed world contact error; reward gating is a soft priority.", "url": "https://arxiv.org/abs/2610.23548", "pdf": "papers/2610.23548_Reinforcement_Learning_Based_Multi-Terrain_Adaptive_Whole-Body_Control_for_a_Quadruped_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K16", "title": "Reward conflicts and multiple critics"}, {"id": "K02", "title": "What frame does the controller actually hold fixed?"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2311.00112", "title": "Hierarchical Optimization-based Control for Whole-body Loco-manipulation of Heavy Objects", "label": "Hierarchical Optimization-ba", "year": "2023", "date": "2023-11", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "When lifting heavy objects or opening doors, the reaction force exerted by the arm on the body can no longer be regarded as a small disturbance. The input is the object task, robot status and contact estimation; the output is the object movement, mechanical arm force and body movement reference, which are then handed over to low-level control.", "method": "Online operation planning first calculates the object trajectory and required force; posture optimization checks whether the robot can reach it; linear MPC writes the force exerted by the arm into the body prediction model. This considers the operational task earlier than just having the walking MPC resist unknown perturbations.", "interface": "", "improvement": "", "experiment": "The Aliengo+ self-made one-degree-of-freedom real robot can lift/carry a maximum load of 8 kg; the door task and the rapid lifting test of 10 kg objects are simulations. Compared with respectively removing the operating force prediction or changing the attitude optimization, it is suitable for heavy-duty branches, and it is not appropriate to use the results to infer the performance of light-touch electrical panels.", "limit": "", "url": "https://arxiv.org/abs/2311.00112", "pdf": "papers/2311.00112_Hierarchical_Optimization-based_Control_for_Whole-body_Loco-manipulation_of_Heavy_Objects.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "paper-32", "title": "Design and Control Co-Optimization for Dynamic Loco-Manipulation With a Robotic Arm on a Quadruped Robot", "label": "Design and Control Co-Optimi", "year": "2024", "date": "2024", "group": "形态／系统", "platform": "四足＋臂", "problem": "Carrying a six-degree-of-freedom arm increases weight and squeezes the load; if the body itself can move, some tasks may not necessarily require a complete six-degree-of-freedom arm.", "method": "Design the robot arm structure selection together with the whole body control, and study how the low-degree-of-freedom arm can use the four-legged chassis to move to supplement the work space, instead of just adjusting the control parameters on the fixed six-degree-of-freedom hardware.", "interface": "", "improvement": "", "experiment": "The publication abstract states that the Aliengo compares its one-degree-of-freedom arm to its six-degree-of-freedom arm, with a maximum load of 8 kg versus 2 kg; the specific tasks, number of repetitions, and controlled ablation have yet to be verified in the full text. The current Piper arm cannot be directly analogized to \"the fewer degrees of freedom, the better\".", "limit": "", "url": "https://doi.org/10.1115/1.4066852", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K01", "title": "Coupling between floating-base motion, foot contacts, and the end effector"}, {"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}], "group_en": "Robot / system", "platform_en": "Quadruped + arm"}, {"id": "2403.18197", "title": "LocoMan: Advancing Versatile Quadrupedal Dexterity with Lightweight Loco-Manipulators", "label": "LocoMan", "year": "2024", "date": "2024-03", "group": "形态／系统", "platform": "四足＋腿部小臂", "problem": "It is difficult to enter a narrow space with one arm carried on the back, and it loses support when operating directly with the legs. Go1 adds 3 degrees of freedom/147 g control modules to each of the two front calves, which are combined with the three joints of the legs to form a 6DoF operating limb; the body/hand target is input, and the joint/force commands are output by the patterned WBC.", "method": "Kinematics nullspace priority and dynamics QP switches according to one-handed, two-handed, walking and moving operations; switching includes rules such as stopping and moving the body. Contributions are first to form, accessibility, and pattern execution, controlling whole-body RL that is not trained from scratch.", "interface": "", "improvement": "", "experiment": "real robot remote operation for charger insertion, cabinet doors/drawers, pouring drinks, narrow access and two-hand carry. Single/double workspace 0.34→0.68, 0.38→0.83 m³ comes from kinematic sampling; the average 8-second end-effector trajectory of five groups of tasks in situ is 1.89 mm/0.047 rad, which is calculated by self-estimation and kinematics, without independent world measurement.", "limit": "The walking example is to maintain the orientation of the flashlight world while moving forward at 0.15 m/s and moving sideways at 0.05 m/s, which is not a complete six-dimensional contact position tracking. The kinematics workspace is not equal to the dynamic contact feasible region, and the millimeter in-situ error cannot be compared with the world coordinate walking error of other papers.", "url": "https://arxiv.org/abs/2403.18197", "pdf": "papers/2403.18197_LocoMan_Advancing_Versatile_Quadrupedal_Dexterity_with_Lightweight_Loco-Manipulators.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Robot / system", "platform_en": "Four legs + legs and forearms"}, {"id": "2403.20328", "title": "Learning Visual Quadrupedal Loco-Manipulation from Demonstrations", "label": "Learning Visual Quadrupedal ", "year": "2024", "date": "2024-03", "group": "示范／视觉／VLM", "platform": "四足足端／无臂", "problem": "It is difficult to connect long-distance movement with leg operations in variable scenes using simple position commands. The method learns task strategies from human demonstrations and images, and uses RL whole-body control at the lower level to implement the target foot movements into gait and body.", "method": "The visual diffusion strategy generates parameterized Bézier foot trajectories/body commands, and the lower layer receives current and future foot target execution; layering enables a small number of visual demonstrations without learning all joint feedback.", "interface": "", "improvement": "", "experiment": "Real device foot interaction and trajectory tracking; experiments on visual planning, future points and strategy interfaces.", "limit": "The trajectory interface and task demonstration give strong priors; the vision and low-level reference systems are not exactly the same, and you cannot just write an end-to-end visual whole-body strategy.", "url": "https://arxiv.org/abs/2403.20328", "pdf": "papers/2403.20328_Learning_Visual_Quadrupedal_Loco-Manipulation_from_Demonstrations.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Four legs/armless"}, {"id": "2402.10837", "title": "Pedipulate: Enabling Manipulation Skills using a Quadruped Robot’s Leg", "label": "Pedipulate", "year": "2024", "date": "2024-02", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "Without adding a special robotic arm, can one front leg accurately touch an object and actively step forward to expand the working space when the target is far away? Inputting the foot target position, the RL controller outputs whole-body motion; walking emerges from a strategy for tracking the distal target.", "method": "Training strategies for single-foot end position goals that require simultaneous resistance to end-foot interaction forces, body perturbations, and sliding contact. Compared with ordinary lifting of legs to touch objects, task space instructions can continuously drive the robot to move near the target.", "interface": "", "improvement": "", "experiment": "The real robot remotely operated to open doors, press buttons, take samples, push obstacles, and carry a 2.0 kg backpack by hanging from the feet; the paper also measured the reachable space, tracking and disturbance. It applies interactive perturbations during training, but the original text clearly states that there is no explicit modeling or tracking of operating forces; the anti-disturbance capability cannot be written as a controlled force application capability. The workspace and support are also different from those of a piggyback Piper arm.", "limit": "", "url": "https://arxiv.org/abs/2402.10837", "pdf": "papers/2402.10837_Pedipulate_Enabling_Manipulation_Skills_using_a_Quadruped_Robots_Leg.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K43", "title": "Policy, return, critic, and credit assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "2407.06584", "title": "HiLMa-Res: A General Hierarchical Framework via Residual RL for Combining Quadrupedal Locomotion and Manipulation", "label": "HiLMa-Res", "year": "2024", "date": "2024-07", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "When walking continuously, is it possible to utilize swing leg maneuvers without retraining the entire walking ability for each task? The bottom layer inputs body movement instructions and swing foot trajectory parameters, and outputs joint angle targets; the upper layer determines these instructions and parameters based on task status or vision.", "method": "Fixed using diagonal trot, first train the bottom layer to track the sum of the normal foot trajectory generated by the gait generator and the Bézier residual; the residual is only added to the swing foot, and the support foot reference remains unchanged. The high-level task strategy then selects the control points of the residual curve. The residual here is the foot trajectory correction, not the joint moment compensation, nor the foot control in any support mode.", "interface": "", "improvement": "", "experiment": "A real robot carries a load, kicks/drabs a ball and avoids scattered stones, covering simulation training and real robot learning, and comparing with single layer, trajectory tracking and other layered methods. The stone task mainly verifies walking to avoid obstacles; the paper does not have a dedicated robotic arm, which is suitable for understanding the layered trajectory interface and is not a direct baseline for light contact with cabinet doors.", "limit": "", "url": "https://arxiv.org/abs/2407.06584", "pdf": "papers/2407.06584_HiLMa-Res_A_General_Hierarchical_Framework_via_Residual_RL_for_Combining_Quadrupedal_Locomotion_and_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "2411.07104", "title": "Learning Multi-Agent Loco-Manipulation for Long-Horizon Quadrupedal Pushing", "label": "Learning Multi-Agent Loco-Ma", "year": "2024", "date": "2024-11", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "When multiple quadrupeds push large objects around obstacles, the partial advancement of a single robot will hinder each other. Input the map, object targets and the status of each robot; output the sub-goals and movement instructions of each robot.", "method": "RRT provides the object path, the central high-level adjusts the object sub-goal, the de-centered middle-level strategy outputs its own speed, and the bottom layer walks; rewards for the normal direction and sub-goal direction within the convex hull help find the side of the object.", "interface": "", "improvement": "", "experiment": "In simulation, the success rate is 36 percentage points higher and the time is 24.5% shorter than the optimal baseline; the real robot demonstrates the collaborative push of objects of different shapes. There is no robotic arm, and it is included to cover non-grabbing quadruped operations and is not the main route of the user's current device.", "limit": "The simulation ≥10m task end point tolerance is 1m, which is different from the accuracy of light operation; the state of the motion capture object; the real robot and the simulation bottom layer are different, but the author specifically fits its behavior.", "url": "https://arxiv.org/abs/2411.07104", "pdf": "papers/2411.07104_Learning_Multi-Agent_Loco-Manipulation_for_Long-Horizon_Quadrupedal_Pushing.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "paper-38", "title": "Env-Mani: Quadrupedal Robot Loco-Manipulation with Environment-in-the-Loop", "label": "Env-Mani", "year": "2025", "date": "2025", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "If the four legs are supported only by four points on the ground, they will not be able to reach higher targets. The method allows the robot to use the external environment such as the edge of the table to bear weight and expand the operating work space.", "method": "The unified strategy uses limited onboard sensing and self-state to generate whole-body movements, uses rewards to handle perception errors and center of gravity shifts, and uses courses to train teachers and students on strategies. The same physical opportunities are discussed with the multi-contact planning branch, but one cannot claim to have inherited the algorithm from ETH.", "interface": "", "improvement": "", "experiment": "The abstract refers to simulation training and extended experiments, but the actual machine and quantity are not clearly stated; the full text PDF is not available, so only the judgment at the abstract level is retained.", "limit": "", "url": "https://doi.org/10.1109/IROS60139.2025.11246108", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K11", "title": "Reserve disturbance margin before the disturbance"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2511.14756", "title": "HMC: Learning Heterogeneous Meta-Control for Contact-Rich Loco-Manipulation", "label": "HMC", "year": "2025", "date": "2025-11", "group": "示范／视觉／VLM", "platform": "人形", "problem": "Approaching, inserting, and pulling out for the same task require different stiffnesses; the fixed position control will collide, always being compliant but unable to pull. Inputting visual and self-state, the strategy simultaneously gives motion and control mode weights, and the controller continuously mixes position, impedance, and force/position mixed control at the moment layer.", "method": "First use a large amount of data with only position labels to train a common representation, and then use less force-sensing demonstrations to learn mode routing; soft mixing avoids force mutations caused by hard switching of modes. This is an example of a valuable interface for \"how learning policies invoke compliance control\", not a four-legged VLA.", "interface": "", "improvement": "", "experiment": "Unitree G1 real robot wipes, takes bottles, and opens drawers, 15 times for each setting; the wiping success rate in the table is 93% against the position baseline of 33%. The experiment was mainly a contact operation, and continuous walking contact was not considered as the core quantitative result, so the strict short list of quadrupedal core was not included.", "limit": "", "url": "https://arxiv.org/abs/2511.14756", "pdf": "papers/2511.14756_HMC_Learning_Heterogeneous_Meta-Control_for_Contact-Rich_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Humanoid"}, {"id": "2510.09221", "title": "HANDO: Hierarchical Autonomous Navigation and Dexterous Omni-loco-manipulation", "label": "HANDO", "year": "2025", "date": "2025-10", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "In an unknown environment, first find the target and then complete contact at the operating position. The method layers autonomous exploration of target conditions and whole-body operation strategies; the interface navigates to the target area, and the operation layer coordinates arms and legs.", "method": "The method layers autonomous exploration of target conditions and whole-body operation strategies; the interface navigates to the target area, and the operation layer coordinates arms and legs.", "interface": "", "improvement": "", "experiment": "The author only reports on the preliminary real-machine deployment of the navigation module; detailed real-machine operation is still follow-up work.", "limit": "The abstract clearly calls \"initial deployment of the navigation module\" and says that detailed real-machine operation deployment is still follow-up work; system diagrams or simulated operations cannot be regarded as complete real-machine loco-manipulation success rates. There is engineering reference for the current Go1/Piper equipment, but the verification strength of the paper is not enough to be used as a recommended main document.", "url": "https://arxiv.org/abs/2510.09221", "pdf": "papers/2510.09221_HANDO_Hierarchical_Autonomous_Navigation_and_Dexterous_Omni-loco-manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K23", "title": "Choose navigation goals that permit manipulation"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2607.06186", "title": "Calf-Integrated Arms for Bimanual Quadruped Loco-Manipulation", "label": "Calf-Integrated Arms for Bim", "year": "2026", "date": "2026-07", "group": "形态／系统", "platform": "四足＋腿部小臂", "problem": "Quadrupedal bimanual operation usually requires standing upright or sacrificing front leg support. Each front leg is embedded with sliding joints, rotating joints and clamping claws, and can be operated with both arms when on all fours.", "method": "The underlying whole-body control is performed by skill, and VLM only selects predefined skills at the skill boundary based on image/task status; it is not a VLA that continuously outputs whole-body movements.", "interface": "", "improvement": "", "experiment": "Simulation cabinet door task, raising both hands and handover. Lacking real robot verification, the value lies mainly in the form scheme and the hierarchical interface of \"language selection skills/controller execution\".", "limit": "The center of the area is not equal to the handle contact point; VLM does not generate undefined skills; execution delay and no real robot verification limit the conclusion.", "url": "https://arxiv.org/abs/2607.06186", "pdf": "papers/2607.06186_Calf-Integrated_Arms_for_Bimanual_Quadruped_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K22", "title": "Affordance regions, contact targets, and action parameters"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Robot / system", "platform_en": "Four legs + legs and forearms"}, {"id": "2607.11041", "title": "PAKE: Learning Whole-Body Loco-Manipulation with Partial Kinematic Embeddings", "label": "PAKE", "year": "2026", "date": "2026-07", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Given the target position and movement speed of the hand, there are often many feasible body/arm poses; it is difficult for direct RL to find an exact solution in high-dimensional joint space. Input the six-dimensional hand target and chassis speed, and output continuous joint control.", "method": "Sample body height, roll, pitch and six arm joints, and use forward kinematics to generate training data; the conditional flow model generates multiple body/arm references corresponding to the same end target based on this. The high-level strategy selects the latent variables of the flow model, the low-level RL controls the legs to achieve body reference, and the arms are controlled by PD to track the joint reference; complete PAKE also adds teacher-guided high-level optimization to reduce reference mutations. Kinematic sampling omits leg constraints, so generating references does not automatically guarantee dynamic feasibility.", "interface": "", "improvement": "", "experiment": "4000 targets are used in RaiSim to compare accuracy and work space; a simplified version of PAKE-S is actually deployed on a real robot, with a total of 24 tasks in 8 categories, including pulling a car, sweeping the floor, plugging in a charger, and hanging a clothes rack. The average end position error measured by motion capture is about 4.5 cm, and the attitude error is about 0.14 rad; the further gain of complete PAKE relative to PAKE-S comes from simulation. The UMI on Legs baseline uses random trajectories and body coordinate tracking instead, and cannot be regarded as a direct ranking of the complete interface of the original method. It is still a task space tracker and does not directly address semantic decision making or contact force safety.", "limit": "", "url": "https://arxiv.org/abs/2607.11041", "pdf": "papers/2607.11041_PAKE_Learning_Whole-Body_Loco-Manipulation_with_Partial_Kinematic_Embeddings.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2608.22296", "title": "TONAV: Task-Oriented Navigation and Action-Velocity Chunk Learning for Articulated Object Quadrupedal Mobile Manipulation", "label": "TONAV", "year": "2026", "date": "2026-08", "group": "示范／视觉／VLM", "platform": "轮足", "problem": "When navigating to the vicinity of an object, the orientation/distance needs to be adjusted to enter the starting distribution of the operation strategy; the demonstration will also cause errors due to master-slave servo delays and action block jumps. Input language, RGB-D, ontology and demonstration, and output navigation target, near field alignment and arm action block.", "method": "Use SAM2 mask/depth backprojection and ego-motion KF to update the target after the language splits the subtarget, and AAM to center the target and maintain the workspace stand-off. 220 Hz master-slave MIT controls and records the target trajectory/speed of the slave arm; ACT simultaneously predicts position and speed, adding finite difference consistency loss.", "interface": "", "improvement": "", "experiment": "Close the drawer, turn on the light, and put down the toilet seat, five navigations each, a total of 9/15 = 60%. The operation starts individually from the unified preparation posture, 12/15 = 80%; this is the conditional operation rate, not the end-to-end success of the operation after complete navigation. Under the same small sample, position+velocity ACT is 46.67%, complete 80%.", "limit": "The near-field distance/orientation rules are not full control or contact path optimization; navigation and operation are staged, and movement/step change during contact is not verified. Whether the velocity head deployment enters actual control is poorly described, without calibrated forces or safety experiments.", "url": "https://arxiv.org/abs/2608.22296", "pdf": "papers/2608.22296_TONAV_Task-Oriented_Navigation_and_Action-Velocity_Chunk_Learning_for_Articulated_Object_Quadrupedal_Mobile_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K23", "title": "Choose navigation goals that permit manipulation"}, {"id": "K24", "title": "Articulated-object constraints and online identification"}, {"id": "K27", "title": "Action chunks: accuracy, latency, and smoothness"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Wheeled-legged"}, {"id": "2609.22278", "title": "DeViGrasp: Robust Visual Mobile Grasping for Quadruped Manipulators under Degraded Perception", "label": "DeViGrasp", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "四足＋臂", "problem": "Occlusion, depth noise and target jitter make it difficult for students to copy the true value of an object Teacher; Use effective frames from dual perspectives and temporal reliability information to form a more stable grabbing action.", "method": "The teacher aggregates the candidate grabbing features, and the student saves the recent target with dual camera cache, time/source encoding, reliability and GRU; outputs the 9-dimensional end/base/gripper target, and the lower layer is leg RL + arm IK. It records recent perceptions and does not record task events such as \"button pressed successfully\".", "interface": "", "improvement": "", "experiment": "The quantification of the main text is B1+Z1 in Isaac Gym, 33 seen/6 unseen objects, four-level degradation, 500 episodes×3 seeds. Difficult 62.3% vs. VBC 46.2%, DQ 58%; DQ is faster in successful episodes. The Go2 supplementary demonstration cannot replace quantitative real robot evidence; descriptor fusion is not a physical average after registration of two cameras' three-dimensional measurements.", "limit": "", "url": "https://arxiv.org/abs/2609.22278", "pdf": "papers/2609.22278_DeViGrasp_Robust_Visual_Mobile_Grasping_for_Quadruped_Manipulators_under_Degraded_Perception.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K25", "title": "Slow observations, fast feedback, and timestamps"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Quadruped + arm"}, {"id": "2609.30140", "title": "Contact as a Decision Variable: Capability-Tradeoff Contact Selection for Legged Loco-Manipulation", "label": "Contact as a Decision Variab", "year": "2026", "date": "2026-09", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "The robot can lean its body against the environment to increase its ability to withstand external forces, but leaning in the wrong place will block its hands or hinder walking. Input the candidate environment contact and the end pose/force required for the task, and output the support contact point and body configuration.", "method": "Evaluate candidates based on residual affordability, terminal accessibility, chassis mobility and cost of establishing contact; first screen infeasible items, and then use close contact grouping and local sensitivity approximate reduction to iteratively optimize. It takes \"whether and where to lean\" as an explicit decision-making, which is different from the control method that presets additional contacts.", "interface": "", "improvement": "", "experiment": "Simulation large-scale candidate comparison; the Go2+NERO arm is equipped with a body side plane support frame, and the real robot continues to support contact and walking load. The end position RMSE of 5 walking tests is 14.97 mm. Candidate selection takes approximately 39/62 seconds with a 10 Hz execution controller; it cannot be called real-time complete contact sequence planning. Scene geometry and friction need to be pre-modeled, and specific constraints are also referenced from supplementary materials outside the PDF.", "limit": "", "url": "https://arxiv.org/abs/2609.30140", "pdf": "papers/2609.30140_Contact_as_a_Decision_Variable_Capability-Tradeoff_Contact_Selection_for_Legged_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}, {"id": "K11", "title": "Reserve disturbance margin before the disturbance"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2610.20968", "title": "SOMA: Stack-of-Objects Manipulation using a Quadruped Robot", "label": "SOMA", "year": "2026", "date": "2026-10", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "When pushing stacked boxes, the upper layer may slip; the chassis height is also a variable that affects the force application position. The high-level layer uses time history to predict object advancement goals, and the low-level walking strategy adjusts body height and gait according to the goal.", "method": "Add body height to the high-level speed interface and change the thrust action point; S5 history encoding, Beta bounded command, single box → double box course and stack slip/tipping penalty.", "interface": "", "improvement": "", "experiment": "125 shape/mass grid simulation; MLP/GRU/S5, single shape/multi-shape training comparison; double box nine conditions, optimal 90.1%; real robot five configurations, four trajectories in Figure 4.", "limit": "90.1% is the best condition, not the average of all piles. The attitude tolerance of the real robot is 5°, and the simulation part is 1°; the main text of Fig.2 is 0.1m, and the abstract/other parts are 0.05m, which need to be distinguished according to each experiment.", "url": "https://arxiv.org/abs/2610.20968", "pdf": "papers/2610.20968_SOMA_Stack-of-Objects_Manipulation_using_a_Quadruped_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}, {"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "2609.18869", "title": "KINO: A Keyframe Interface for VLM Planning and Whole-Body Control in Humanoid Loco-Manipulation", "label": "KINO", "year": "2026", "date": "2026-09", "group": "示范／视觉／VLM", "platform": "人形", "problem": "The abstract task step lacks dynamic control targets; VLM selects tags from the artificial keyframe library, repositions them according to on-site objects, and is tracked by the RL controller to form a high- and low-level interface with a limited target space.", "method": "Relative object repositioning and IK correction for whole-body posture, tracker training with keyframe history and multiple critics; improved goal sampling of sparse events such as grab/release, so that the training goal is more consistent with the planner deployment distribution. The planner receives target error and stopping feedback to reselect the target.", "interface": "", "improvement": "", "experiment": "The ablation of 100 trials of simulation is 44% → 92%; Unitree G1 real robot pick and place is mainly qualitative, and the object pose uses MoCap. Placement tolerance is approximately 0.3 m, no evidence of precision for fine panel operation.", "limit": "The keyframe library is provided by people, and VLM does not directly generate continuous joint movements. Some reference errors are larger in this method, and mission success and attitude error need to be measured separately; the arc/Dubins path is a design limitation, which does not mean that the humanoid body is equivalent to the non-holonomic constraint of a differential car.", "url": "https://arxiv.org/abs/2609.18869", "pdf": "papers/2609.18869_KINO_A_Keyframe_Interface_for_VLM_Planning_and_Whole-Body_Control_in_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Humanoid"}, {"id": "2609.23968", "title": "Opt2VLA: Force-Aware Vision-Language-Action for Contact-Rich Humanoid Whole-Body Manipulation", "label": "Opt2VLA", "year": "2026", "date": "2026-09", "group": "VLA 动作模型", "platform": "人形", "problem": "A VLA that only outputs pose cannot express the desired force of a \"gentle rub\" or a \"hard push\". The model jointly outputs motion and contact force targets, and the underlying force control is executed; language instructions can specify force levels.", "method": "GR00T-N1.7 outputs hand/foot geometric targets and independent normal force commands; TO provides a dedicated RL force controller for joint torque supervision training tasks, and then uses rollout to train VLA. Independent torque token and future torque auxiliary loss.", "interface": "", "improvement": "", "experiment": "MO/FC/FCT comparison; 9 types of VLA ablation, 30 simulations per task, 82.2% overall joint success; 30 times per task on the real robot low-level, 45 times end-to-end.", "limit": "82.2% is the joint standard of simulation completion + force command + measured force; the real robot reports trends and errors, and wipes MAE7N, which does not mean the force target is accurately achieved. Example does not demonstrate sustained walking contact; three tasks use their own FCT.", "url": "https://arxiv.org/abs/2609.23968", "pdf": "papers/2609.23968_Opt2VLA_Force-Aware_Vision-Language-Action_for_Contact-Rich_Humanoid_Whole-Body_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K08", "title": "Compliance defines motion in response to force"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K31", "title": "Where force enters a VLA determines what it can change"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}, {"id": "K47", "title": "Should the high-level policy command only the end effector, or the body too?"}], "group_en": "VLA action model", "platform_en": "Humanoid"}, {"id": "2610.24847", "title": "DiPLO: Self-distilled Diffusion Planning for Loco-manipulation", "label": "DiPLO", "year": "2026", "date": "2026-10", "group": "模型规划／显式控制", "platform": "人形", "problem": "There are few samples of whole-body contact behavior, and it is difficult to learn RL directly from scratch. First, human action redirection is used to train the diffusion planner, and RL is used to train low-level tracking; then self-distillation and policy optimization are used to reduce the planner's dependence on strong task conditions.", "method": "SBTO generates dynamically executable demonstrations; diffusion generates whole body + object trajectories, and the reference condition teacher guides students without reference in a closed-loop context; freezes the RL tracker and uses DA:PPO to optimize diffusion planning. Spin diffusion with SO(3) alone.", "interface": "", "improvement": "", "experiment": "Data amplification, SO(3), direct action diffusion, teacher condition removal, planning/tracker fine-tuning and ablation; pick/place, kick, push/pull simulation; real robot handling with the same target 10/10, different targets 5/5.", "limit": "Task success is calculated on the survival trajectory and must be viewed at the same time as survival. DPPO-style deletes some of the original algorithm techniques, which is not a complete and fair reproduction; the real robot only has 15 times and is motion captured; multi-skill training is mainly divided into tasks.", "url": "https://arxiv.org/abs/2610.24847", "pdf": "papers/2610.24847_DiPLO_Self-distilled_Diffusion_Planning_for_Loco-manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K18", "title": "Demonstration tracking, progress adaptation, and task optimization"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K41", "title": "Object-relative augmentation and contact-phase anchors"}, {"id": "K44", "title": "Imitation learning and closed-loop distribution shift"}], "group_en": "Model-based planning / control", "platform_en": "Humanoid"}, {"id": "2409.04882", "title": "Learning to Open and Traverse Doors with a Legged Manipulator", "label": "Learning to Open and Travers", "year": "2024", "date": "2024-09", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The door may be pushed or pulled open. The hinges, door closing force and opening direction are not fully known in advance. The robot still has to pass through the narrow doorway after the door is opened.", "method": "The simulation teacher knows the true values of the four push-pull/left and right doors, and the loop student only infers the response from the body history and door/handle position, outputs the arm joint target and base speed, and reuses the existing walking low-level. Removing recurrence cannot be effectively imitated. Removing the auxiliary gate type classification loss has little impact. The historical mechanism and explicit classification should be evaluated separately.", "interface": "", "improvement": "", "experiment": "40 real robot trials, sliding door 20/20, pushing door 18/20 = 95%; all doors are open, failure passes through the protruding door. MoCap or external camera AprilTag provides door/handle position, 95% does not represent pure onboard natural vision results.", "limit": "Joint PD target clipping only limits the nominal joint action, not the end contact force upper bound. When the handle is not unlocked, it can be pushed and pulled repeatedly and mistakenly turns itself as the operation is successful. This is a clear failure example that lacks observable evidence for completing the event; the artificial stage reward and door model is still needed.", "url": "https://arxiv.org/abs/2409.04882", "pdf": "papers/2409.04882_Learning_to_Open_and_Traverse_Doors_with_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K24", "title": "Articulated-object constraints and online identification"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2506.16475", "title": "Human2LocoMan: Learning Versatile Quadrupedal Manipulation with Human Pretraining", "label": "Human2LocoMan", "year": "2025", "date": "2025-06", "group": "示范／视觉／VLM", "platform": "四足＋腿部小臂", "problem": "There is little data on robots with quadrupedal and bimanual skills, and a large amount of human operation demonstrations but different action structures. Input human demonstration and a small amount of whole-body robot teleoperation data, and output a vision-conditioned quadruped operation strategy.", "method": "Explicitly reuse the LocoMan calf manipulation module and nullspace IK/dynamics QP. The human VR demonstration is first mapped to the shared head/wrist task space. The body, end and gripper are encoded and decoded with independent stems, and the Transformer is shared. When changing robots, form-specific stems are reconstructed and missing modes are masked. What is transferred is the representation structure rather than human joint control.", "interface": "", "improvement": "", "experiment": "One/two-handed toys, shoes, scoop and pour Six tasks, ID 24 times per condition, OOD 12 times; human pre-training improves 20-40 conditions for robot demonstration. 41.9%/79.7% is a relative gain, not a percentage point difference in success rate. For HPT which also simultaneously changes visual fine-tuning, MXT-Agg ablation is more capable of isolating modular gains.", "limit": "VR posture demonstration is not equal to any person's video; the front leg and sitting position two-hand operation have not verified the full range of walking contact. The author also reminds that validation action L1 does not always correspond to deployment performance.", "url": "https://arxiv.org/abs/2506.16475", "pdf": "papers/2506.16475_Human2LocoMan_Learning_Versatile_Quadrupedal_Manipulation_with_Human_Pretraining.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Four legs + legs and forearms"}, {"id": "2507.19652", "title": "RAKOMO: Reachability-Aware K-Order Markov Path Optimization for Quadrupedal Loco-Manipulation", "label": "RAKOMO", "year": "2025", "date": "2025-07", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "The trajectory optimization simplified to body + arm may ignore the limits of leg joints, causing the body to be raised too high or pressed too low; explicitly incorporating all leg joints will increase the solution cost.", "method": "Learn the distance to the boundary of the leg reachable area and its gradient under a given foot and fuselage attitude, as constraints/costs of KOMO; the fuselage and arm trajectories are tracked by the complete dynamics WBC after planning.", "interface": "", "improvement": "", "experiment": "The HyQReal＋Kinova arm was grasped low in Gazebo, placed elevated, and compared with ordinary KOMO; all four legs were in fixed contact, and dynamic gait and contact sequence optimization were left for follow-up. It verifies the feasibility of leg kinematics in posture, but does not verify the accuracy of arm operation during walking; it has no verified direct connection with CMP.", "limit": "", "url": "https://arxiv.org/abs/2507.19652", "pdf": "papers/2507.19652_RAKOMO_Reachability-Aware_K-Order_Markov_Path_Optimization_for_Quadrupedal_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K03", "title": "One end-effector target admits many whole-body configurations"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2509.17582", "title": "GeCCo: A Generalist Contact-Conditioned Policy for Loco-Manipulation Skills on Legged Robots", "label": "GeCCo", "year": "2025", "date": "2025-09", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "It is inefficient to redefine the reward training strategy every time you change the terrain or toe operation. Input the contact position specified by the planner and the robot's own state, and output the leg joint movements that track the contact plan.", "method": "Randomly sample foot-end target areas, durations, and gait combinations to train a strategy for tracking a given contact plan; improve reusability through contact event rewards and symmetric data augmentation. The upper layer is still responsible for giving the plan, and the strategy itself does not discover the complete object operation sequence.", "interface": "", "improvement": "", "experiment": "Multi-terrain simulation statistics; real robot demonstrates gait, terrain passing, foot pressing buttons/turning over boxes/pushing buckets. The tolerance radius of the operating target is 0.1 m, and its operating target satisfaction criterion does not require actual object contact; the main quantitative result is the terrain pass rate, which is not sufficient as evidence of precise button or piggyback arm control.", "limit": "", "url": "https://arxiv.org/abs/2509.17582", "pdf": "papers/2509.17582_GeCCo_--_a_Generalist_Contact-Conditioned_Policy_for_Loco-Manipulation_Skills_on_Legged_Robots.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K10", "title": "Plan discrete contact modes and continuous motion together"}, {"id": "K20", "title": "Future end-effector preview and temporal consistency"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "2512.11047", "title": "WholeBodyVLA: Towards Unified Latent VLA for Whole-Body Loco-Manipulation Control", "label": "WholeBodyVLA", "year": "2025", "date": "2025-12", "group": "VLA 动作模型", "platform": "人形", "problem": "The upper body operation strategy is separated from the lower body walking control, making it difficult to drive whole-body movement in language-visual tasks. Input images, text and robot status; the model uses whole-body latent motion representation to generate movement and operation instructions.", "method": "Two sets of VQ-VAE latent action models are trained on robot operation videos and human movement videos respectively. After VLM predicts the two codes, the robot decoder outputs the arms target, discrete movement and height. The low-level LMO first learns to walk, and then adapts to the requirements of arm movement disturbance, precise stopping and standing firm.", "interface": "", "improvement": "", "experiment": "Agibot X2 real robot moves bags/boxes and pushes 50 kg cart. The 78% in Table 2 is the average of the six sub-goals; the final bag 13/25, box 17/25, and car 22/25 cannot be mixed into the overall end-to-end success rate of 78%. Continuous speed contrast also changes the course/reward that cannot be attributed solely to discrete actions.", "limit": "Humanoid/low-level walking strategy is not quadrupedal evidence, no clear force/tactile safety closed loop. Separating the latent representation does not cancel the physical coupling; the printing smoothing formula has a problem of constant input tending to zero, and the code must be checked to reproduce.", "url": "https://arxiv.org/abs/2512.11047", "pdf": "papers/2512.11047_WholeBodyVLA_Towards_Unified_Latent_VLA_for_Whole-Body_Loco-Manipulation_Control.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}], "group_en": "VLA action model", "platform_en": "Humanoid"}, {"id": "2603.05830", "title": "OpenHEART: Opening Heterogeneous Articulated Objects with a Legged Manipulator", "label": "OpenHEART", "year": "2026", "date": "2026-03", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Doors, drawers and cabinets have different mechanisms, so it is difficult to make full use of small amounts of data by sending large images directly to RL. Input the simplified geometry, self-state and interaction history of the handle and panel; output the whole-body door opening/pull drawer action.", "method": "Go2＋ViperX300＋hook. SAFE samples inside the handle/panel bounding box to preserve size relationships; the ArtIEst visual geometry branch predicts the handle to hinge direction, the ontology history branch only supervises when the object has moved, and then merges according to the interaction history gate. The initial world bounding box is provided externally, LiDAR updates relative pose, and is not a verified autonomous visual recognition.", "interface": "", "improvement": "", "experiment": "41 heterogeneous asset simulation train79.35%, test79.02%; real cabinet doors/drawers are qualitative displays, and there is no 41 target real robot success statistics. The direction error of the whole process is well integrated, and the contact-only body single branch 0.0606 is actually lower than the complete 0.0687, which does not mean that all stages win uniformly.", "limit": "The KL data processing inequality only states that processing does not increase distribution discriminability, and cannot prove that task information retention or generalization will be improved. Geometry/ontology interaction history does not equal measured force, non-linguistic VLA, and button success event memory is not addressed.", "url": "https://arxiv.org/abs/2603.05830", "pdf": "papers/2603.05830_OpenHEART_Opening_Heterogeneous_Articulated_Objects_with_a_Legged_Manipulator.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K24", "title": "Articulated-object constraints and online identification"}, {"id": "K40", "title": "What a visual representation must retain"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2610.01612", "title": "ReCo: Response-Consistent Locomotion with Policy-Aware MPC for Legged Manipulation", "label": "ReCo", "year": "2026", "date": "2026-10", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "MPC assumes that the underlying walking strategy will move as instructed, but the true response varies with gait phase, foot contact, and load; even if the planner calculates the chassis and hand at the same time, the hand's world coordinates will still be biased.", "method": "During training, the walking strategy has a more consistent response to the same instructions; a closed-loop instruction response model is identified for the fixed strategy; MPC then uses this model to jointly plan movement instructions and arm trajectories. The key is not to add stronger tracking gain to the arms, but to make the chassis a predictable and controlled object for the planner.", "interface": "", "improvement": "", "experiment": "The simulated end position/attitude RMSE is 28.7%/27.4% lower than the corresponding best baseline, and there is also a prediction test of 2×2 ablation and leave-out commands in response to training/model identification. The position RMSE of the eight motion capture trajectories of the real robot is 7.60 cm and the attitude is 9.93°; the error of the non-motion capture mission is reconstructed by the airborne odometry, and the world coordinate drift is not independently measured. Some baselines are equipped with external chassis path trackers with different interfaces; the paper does not quantify contact forces or safety events.", "limit": "", "url": "https://arxiv.org/abs/2610.01612", "pdf": "papers/2610.01612_ReCo_Response-Consistent_Locomotion_with_Policy-Aware_MPC_for_Legged_Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K02", "title": "What frame does the controller actually hold fixed?"}, {"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K37", "title": "Train a predictable gait, then identify its closed-loop response"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2609.17832", "title": "Adaptive-MHE: A Sampling-Based Adaptive MPC for Legged Loco-Manipulation via Moving Horizon Estimation", "label": "Adaptive-MHE", "year": "2026", "date": "2026-09", "group": "模型规划／显式控制", "platform": "四足足端／无臂", "problem": "If the object mass or ground friction changes during the pushing process, the MPC prediction of the fixed model will be biased, and the push may continue with the original force and fail to reach the target.", "method": "Use recent execution trajectories and rolling comparisons with parallel simulations to estimate unknown physical parameters online, and then send the estimates back to sampling MPC; it starts from model uncertainty and is a different modeling object from ReCo's \"learning controller's command response\".", "interface": "", "improvement": "", "experiment": "Simulation compares real parameters, fixed priors and online estimation; the real robot Go1 has no external arm and pushes objects with the body. The test basket is increased from 3 kg to 4 kg and from the concrete floor to the turf mat. It verifies online dynamic adaptation and does not verify manipulator contact operation; task improvement does not mean that mass and friction are accurately identified respectively.", "limit": "", "url": "https://arxiv.org/abs/2609.17832", "pdf": "papers/2609.17832_Adaptive-MHE_A_Sampling-Based_Adaptive_MPC_for_Legged_Loco-Manipulation_via_Moving_Horizon_Estimation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K09", "title": "What can be estimated without a force sensor?"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}, {"id": "K36", "title": "Predicting and responding to object reaction forces"}], "group_en": "Model-based planning / control", "platform_en": "Four legs/armless"}, {"id": "paper-58", "title": "QLIMB: End-to-End Whole-Body Control for Quadruped Loco-Manipulation and Balance on Complex Terrains", "label": "QLIMB", "year": "2026", "date": "2026", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "The small platform has little torque margin, and the shaking of complex terrain constantly disturbs the state seen by the operation strategy; you can only practice on flat ground and cannot reach the task point.", "method": "The abstract claims that a unified strategy and a \"latent belief mixing\" mechanism are used to adaptively fuse the two state representations of walking and operation, so that the body, legs and arms can adjust together during mode conversion. The specific network input, action output and loss function are not shown in the full text, and no inferences will be made.", "interface": "", "improvement": "", "experiment": "The abstract claims that there are a large number of real-machine tests on complex terrain, but does not give the type, number of tasks or quantitative comparison. It is a terrain + operation direction that cannot be ignored. The work will be officially published in 2026. The verification strength must be read before judging the full text.", "limit": "", "url": "https://doi.org/10.1109/LRA.2026.3712638", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K12", "title": "Kinematic reachability, dynamic feasibility, and controller competence"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "paper-59", "title": "From Policy Actions to Whole-Body Dynamics: A Unified Projection-Based Framework for Versatile Legged Loco-Manipulation", "label": "From Policy Actions to Whole", "year": "2026", "date": "2026", "group": "模型规划／显式控制", "platform": "四足＋臂", "problem": "The existing RL walking strategy gives joint instructions, while WBC requires acceleration, ground force and moment that meet dynamics and contact constraints; it is difficult to directly combine the two.", "method": "PADP uses optimization to map the joint movements of the pre-trained gait strategy to whole-body variables that meet the dynamics/contact conditions, and then adds the operation task through a unified QP; the goal is to retain the explicit constraints of model control without retraining the underlying strategy.", "interface": "", "improvement": "", "experiment": "The abstract states that point-foot and wheel-foot quadruped platforms have both simulated and real robots, and have improved flexibility and accuracy compared with traditional WBC. Without the full text, it is not possible to check the specific tasks, indicators, and whether it touches objects while moving. It is very relevant to the \"RL chassis + model operation\" interface, and the full text will be verified first.", "limit": "", "url": "https://doi.org/10.1109/LRA.2026.3734869", "pdf": "", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K05", "title": "What trajectory planning, MPC, and WBC each decide"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}], "group_en": "Model-based planning / control", "platform_en": "Quadruped + arm"}, {"id": "2403.16535", "title": "Arm-Constrained Curriculum Learning for Loco-Manipulation of a Wheel-Legged Robot", "label": "Arm-Constrained Curriculum L", "year": "2024", "date": "2024-03", "group": "RL／全身执行", "platform": "轮足", "problem": "The wheel base moves faster, and the movement of the arms will affect the balance; simply combining the rewards of the legs/wheels and arms makes it easy to only focus on one end during training. It inputs its own status and task goals, and outputs six chassis joint torques and six arm joint position targets, which are then converted into torques by the low-level controller.", "method": "First clone the model-type whole-body controller to initialize the strategy, and then use P3O training with a constrained evaluation network to punish arm joint out-of-bounds, distance between the center of mass of the arm and chassis, and collisions. The course starts from the initial state close to the target, and expands the initial distance as the tracking reward improves; instead of training walking and grabbing skills separately one after another.", "interface": "", "improvement": "", "experiment": "Comparative courses and constraint modules in Isaac Gym, real robot demonstrations of opening doors, touching fans, picking up moving objects, etc. Constraints reduce the number of out-of-bounds violations for most arm joints, but increase them for J6, so they are not a hard constraint safety guarantee. As a result, the wheel-footed chassis cannot be directly moved to a quadruped that raises its legs for walking.", "limit": "", "url": "https://arxiv.org/abs/2403.16535", "pdf": "papers/2403.16535_Arm-Constrained_Curriculum_Learning_for_Loco-Manipulation_of_a_Wheel-Legged_Robot.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K04", "title": "Joint position, velocity, and torque are distinct command interfaces"}, {"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}], "group_en": "RL / whole-body execution", "platform_en": "Wheeled-legged"}, {"id": "2502.00835", "title": "CAIMAN: Causal Action Influence Detection for Sample-Efficient Loco-Manipulation", "label": "CAIMAN", "year": "2025", "date": "2025-02", "group": "RL／全身执行", "platform": "四足足端／无臂", "problem": "Only sparse rewards for \"pushing the box to the target\" are given, making it difficult for the robot to explore effective actions for touching the box first. The upper layer strategy outputs the chassis speed target, and the lower layer trained walking strategy is responsible for execution.", "method": "Train an object dynamics model with simplified kinematics priors, and then form an intrinsic exploration reward based on \"whether the robot's actions can significantly change the subsequent state of the object\"; the learned data continues to modify this model. In contrast to artificial approach/box pushing rewards, the reward comes from the degree to which the object is affected by the action.", "interface": "", "improvement": "", "experiment": "Simulate three types of tasks: single box, around a wall, and around multiple walls. Under the same sparse task reward, the object state novelty, overall state novelty, artificial approach prompts, and exploration rewards of different dynamic model structures are compared; the Go2 real robot pushes a 5.5 kg box, demonstrating direct push and obstacle avoidance. The position of the real robot object comes from external motion capture. The paper does not report the systematic success rate of the real robot. The simulation curve cannot be regarded as evidence of on-site robustness.", "limit": "", "url": "https://arxiv.org/abs/2502.00835", "pdf": "papers/2502.00835_CAIMAN_Causal_Action_Influence_Detection_for_Sample-Efficient_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K29", "title": "Planning models must predict the closed-loop robot"}], "group_en": "RL / whole-body execution", "platform_en": "Four legs/armless"}, {"id": "2506.07876", "title": "ReLIC: Versatile Loco-Manipulation through Flexible Interlimb Coordination", "label": "ReLIC", "year": "2025", "date": "2025-06", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "When the arms cannot reach or push is unstable, sometimes one front leg should be temporarily touched and the other legs should continue to move; pre-fixing \"legs only walk and arms only operate\" limits the ability. Input the task goal and the current division of labor of each limb, and output all leg and arm joint movements.", "method": "The task layer specifies the operation/walking mask of each limb. The model control module tracks the target of operating the limbs. RL controls the remaining limbs to keep moving and stable, and then synthesizes actions according to the mask. The thesis framework allows inverse kinematics or impedance control, but the actual real-machine implementation uses inverse kinematics. For the contact interface, the user specifies the contact point, direction and division of labor; for the language interface, GPT-4o+SAM2 is used to select the contact point, and the direction is still preset according to the task. The division of limb labor was not discovered autonomously by underlying strategies.", "interface": "", "improvement": "", "experiment": "Spot+Spot Arm conducts 10 randomized trials in each of 12 categories of real robot tasks. The paper reports an average success rate of 78.9% and compares direct targets, touch points, language interfaces and MPC/end-to-end RL baselines. Tasks include using legs to assist drawer/box operations, continuous pushing, etc.; an external PC participates in the calculation. The MPC baseline does not originally support three-legged walking and limb manipulation, and its failure cannot be generalized to the fact that model controls adapted to these contact patterns are ineffective. This work provides an interface to specify limb roles, but does not equate to the same feasible foot contact points for the Piper carrier arm system.", "limit": "", "url": "https://arxiv.org/abs/2506.07876", "pdf": "papers/2506.07876_ReLIC_Versatile_Loco-Manipulation_through_Flexible_Interlimb_Coordination.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K13", "title": "Unified, cooperative, and model-based controller architectures"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "paper-63", "title": "Bridging the Sim-to-Real Gap for Athletic Loco-Manipulation", "label": "Athletic Loco-Manipulation", "year": "2025", "date": "2025", "group": "RL／全身执行", "platform": "四足＋臂", "problem": "Throwing, lifting, and dragging require action target rewards, and only relying on terminal trajectory simulation limits explosive power; but task rewards may allow RL to take advantage of the simulator's motor error.", "method": "Use real robot state transfer to supervise the simulation actuator residual model; fine-tune task rewards after pre-training WBC to break through the freezing of low-level permissions. Added timing phase variable to repeated throws of low mass balls.", "interface": "", "improvement": "", "experiment": "The real robot can throw about 20m, lift 10lb, and pull 113N for 10m; 230N can only pull 0.5m. Actuator network, freezing versus fine-tuning low-level comparison.", "limit": "The actuator ablates the fixed arm to avoid leg instability and cannot be used as ablation of all modules of the complete body; the reference and object tasks are manually designed; the timing only indicates execution and does not verify the success of the pitch.", "url": "https://arxiv.org/abs/2502.10894", "pdf": "papers/RSS_2025_Bridging_the_Sim-to-Real_Gap_for_Athletic_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K06", "title": "Trade-offs among model fidelity, computation, and execution error"}, {"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K18", "title": "Demonstration tracking, progress adaptation, and task optimization"}, {"id": "K19", "title": "Domain randomization, model calibration, and online compensation"}, {"id": "K30", "title": "Attempted, completed, and observed: what memory can tell us"}, {"id": "K38", "title": "Assigning limb roles and executing a given assignment"}], "group_en": "RL / whole-body execution", "platform_en": "Quadruped + arm"}, {"id": "2510.11258", "title": "DemoHLM: From One Demonstration to Generalizable Humanoid Loco-Manipulation", "label": "DemoHLM", "year": "2025", "date": "2025-10", "group": "示范／视觉／VLM", "platform": "人形", "problem": "It is difficult to cover new starting points and object poses in one whole-body simulation demonstration. Input the initial scene of demonstration, known object model/pose and change, generate simulation action data, and then train the task strategy that relies on FoundationPose pose and ontology.", "method": "Explicitly extend MimicGen: the moving/approaching segment is transformed according to the relative pose of the object, the contact moment anchor point is used after contact, interpolation connection is executed by the reused AMO and the successful trajectory is filtered. It adds dynamic whole-body data generation, not native RGB/language VLA, nor the first object-relative demonstration augmentation.", "interface": "", "improvement": "", "experiment": "The 10 categories of simulation tasks have been expanded to 5000 trajectories; the real robot Table 4 is actually 5 times for each of 7 categories, and the successes are lift5, press5, push4, handover4, grape3, cabinet2, and erase2. The number of main text/conclusion tasks is inconsistent, and 10 simulation tasks cannot be written as 10 real robot tasks.", "limit": "Appendix PressCube is successful only when the hand distance from the cube is <5 cm, EraseBoard means grabbing the rubber and moving it to the left >0.2 m, PushCart mainly detects grabbing the beam; respectively, it is not the activation of the electrical button, wiping the area or pushing the cart to the destination. Proxy metrics are valid for measured sub-skills, but cannot replace practical task completion rates; unknown object mesh and mechanism generalization are not proven.", "url": "https://arxiv.org/abs/2510.11258", "pdf": "papers/2510.11258_DemoHLM_From_One_Demonstration_to_Generalizable_Humanoid_Loco-Manipulation.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K15", "title": "Privileged training, history estimation, and visual students"}, {"id": "K17", "title": "First success, contact exploration, and reward shaping"}, {"id": "K21", "title": "Vision can predict controls or task-space targets"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}, {"id": "K41", "title": "Object-relative augmentation and contact-phase anchors"}], "group_en": "Demonstration / vision / VLM", "platform_en": "Humanoid"}, {"id": "2602.10106", "title": "EgoHumanoid: Unlocking In-the-Wild Loco-Manipulation with Robot-Free Egocentric Demonstration", "label": "EgoHumanoid", "year": "2026", "date": "2026-02", "group": "VLA 动作模型", "platform": "人形", "problem": "Robot teleoperation data is concentrated in the laboratory; human first-person video covers multiple scenes, but is inconsistent with the humanoid robot in terms of viewpoint and action scale. Input human first-person video and a small number of robot demonstrations, and output visual language-conditioned whole-body action blocks.", "method": "MoGe depth reprojects the human eye image to the robot's visual height, and then fills in the missing image; it is uniformly represented by relative end movements, discrete movements and grippers, and human/robot data are jointly trained π0.5. Removing the body reduces the domain difference, but the authors also point out that fine orientation becomes blurred; hole filling may also produce incorrect geometry.", "interface": "", "improvement": "", "experiment": "Four types of real-machine tasks, each with 100 robots and 300 people demonstrating, moving about 1–5 m. 78 vs. 59, 82 vs. 31 are subtask normalized scores, not end-to-end success rates; the so-called new robot scenes are covered in some human training data, reflecting cross-data source scene migration.", "limit": "Robot-Free refers to human demonstration collection, not robot-free data for the entire training. Human data is easier to migrate and navigate than fine-grained contact; human-only cart grasp is only 5, for robot 15, and joint training is 60. It cannot be generally said that completely unseen scenes or arbitrary forms have been solved.", "url": "https://doi.org/10.15607/RSS.2026.XXII.204", "pdf": "papers/2602.10106_EgoHumanoid_Unlocking_In-the-Wild_Loco-Manipulation_with_Robot-Free_Egocentric_Demonstration.pdf", "notes": "literature/papers.md", "knowledge": [{"id": "K14", "title": "The high-level action interface defines what can be learned"}, {"id": "K26", "title": "Language planning, skill selection, and VLA action generation"}, {"id": "K28", "title": "Transfer demonstrations across frames, embodiments, and action spaces"}], "group_en": "VLA action model", "platform_en": "Humanoid"}, {"id": "paper-66", "title": "Ψ₀: An Open Foundation Model Towards Universal Humanoid Loco-Manipulation", "label": "Ψ₀", "year": "2026", "date": "2026", "group": "VLA 动作模型", "platform": "人形", "problem": "The joint movements of human videos and robots are quite different, and it may not be possible to learn fine control by directly training an action model together. After alignment with EgoHumanoid, they are jointly trained to form two parallel data routes; they are published in the same session and cannot be drawn as inheritance.", "method": "First train the VLM representation of the next task-space action, then freeze the backbone, train the joint-space flow action expert with robot data, and finally fine-tune the task. Phase 1 actually uses both EgoDex and Humanoid Everyday, not just human data. Reusing the AMO low-level, VLA outputs arm/hand/torso/height/move 36-dimensional commands; RTC uses submitted action prefixes to align asy
