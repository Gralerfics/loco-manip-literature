ore–Penrose pseudoinverse;", "未来力矩头只作训练辅助，不是部署力矩输出；力输入、期望力输出、TO力矩监督应分别归类。": "In the future, the torque head will only be used as a training aid, not to deploy torque output; force input, desired force output, and TO torque supervision should be classified separately.", "Unitree Go2-W 轮足底盘＋Piper 主从臂遥操作，轮足邻接": "Unitree Go2-W wheel base chassis + Piper master-slave arm remote operation, wheel base adjacent", "这种方法给高层留下可调权限；原作主要由人使用这些权限。若用于轻接触操作，仍要验证哪些步频、站姿和相位能降低手端误差／力峰值，不能从单纯行走成功直接推导。": "This approach leaves adjustable permissions to higher-ups; the original was primarily used by humans. If it is used for light contact operation, it still needs to be verified which cadence, stance and phase can reduce hand error/force peak, which cannot be directly derived from simple walking success.", "预设阶段的轨迹优化": "Trajectory optimization in the preset stage", "真机约20m投球、10lb举升、113N拉车10m；230N只拉0.5m。执行器网络、冻结与微调低层比较。": "The real robot can throw about 20m, lift 10lb, and pull 113N for 10m; 230N can only pull 0.5m. Actuator network, freezing versus fine-tuning low-level comparison.", "腿和臂的动作互相影响，但未必必须由一个网络直接输出全部关节。策略结构要解决的是信息与控制权限怎样分配。": "The movements of legs and arms affect each other, but it is not necessarily necessary for one network to directly output all joints. What the policy structure needs to solve is how to allocate information and control permissions.", "按接触任务、执行控制、接触表示以及学习／规划组织。": "Organized by exposure to tasks, executive control, exposure to representation, and learning/planning.", "夹爪接触和握力决定物体是否滑脱；机械臂施给物体的任务力与指间握力不同。门锁或磁铁突然释放还会让全身负载瞬间改变。": "The gripper contact and grip force determine whether the object slips; the task force exerted by the robot arm on the object is different from the grip force between the fingers. The sudden release of a door lock or magnet can also cause an instantaneous change in the load on the entire body.", "【真机＋仿真；重要边界】15节点0.56 s时域，编译后平均12.5 ms；前向模型34.2 ms，具体求解器与表达匹配不能泛称所有全阶MPC更快。B2＋Z1真机边走边拉10 kg、行走推箱、站立擦白板及低增益人机柔顺。仿真检验0.8 m/s扰动与力矩饱和，非均匀网格漂移0.4对1.2 cm/s。": "[real robot + simulation; important boundary] 15-node 0.56 s time domain, average 12.5 ms after compilation; forward model 34.2 ms, specific solver and expression matching cannot generally be said to be faster for all full-order MPC. The B2+Z1 real robot can pull 10 kg while walking, push boxes while walking, wipe whiteboards while standing, and has low-gain human-machine suppleness. The simulation checks the 0.8 m/s disturbance and moment saturation, and the non-uniform grid drift is 0.4 vs. 1.2 cm/s.", "输入：关节和身体状态、关节力矩命令、模型及支撑接触条件；控制器还接收位置／力目标和每个方向的控制选择。 输出：估计末端作用力；策略输出腿和臂的关节角度、轮子速度。": "Inputs: joint and body states, joint moment commands, model and support contact conditions; the controller also receives position/force targets and control selections for each direction. Output: estimate the end force; the strategy outputs the joint angles of the legs and arms, and the wheel speed.", "不能将sensorless解释成不需要任何力相关测量；cross-attention不是Bayesian力融合，残差范数不是calibrated6Dwrench；64/52对60/48不能证明估计比F/T更准确；论文正文/表数值有内部冲突，应避免挑较好数字合成新结果": "Sensorless cannot be interpreted as not requiring any force-related measurements; cross-attention is not Bayesian force fusion, and the residual norm is not calibrated6Dwrench; 64/52 versus 60/48 cannot prove that the estimate is more accurate than F/T; there are internal conflicts in the paper text/table values, and you should avoid choosing better numbers to synthesize new results", "导纳与约束参考": "Admittance and Constraints Reference", "延续单关节例子：若作用线到关节轴的垂直力臂已知为 $\\ell=0.1~\\mathrm m$，力方向也已知，则该方向的力可估为 $\\widehat F_\\perp=r_\\tau/\\ell=5~\\mathrm N$。这里使用的只是力矩等于力乘垂直力臂的关系；一个残差不能恢复任意三维力。": "Continuation of the single joint example: If the vertical moment arm from the action line to the joint axis is known to be $\\ell=0.1~\\mathrm m$, and the force direction is also known, then the force in this direction can be estimated as $\\widehat F_\\perp=r_\\tau/\\ell=5~\\mathrm N$. All that is used here is that the moment equals the force times the vertical moment arm; a residual cannot recover any three-dimensional force.", "动态权重可以让训练早期重视接触探索，后期重视任务完成；但训练时权重变化和执行时调节控制增益是不同机制。判断多目标方法要看权重由什么决定，以及是否改善了各项真实指标而非只提高合成 reward。": "Dynamic weights can make training focus on contact exploration in the early stage and task completion in the later stage; however, weight changes during training and adjustment of control gains during execution are different mechanisms. Judging a multi-objective method depends on how the weights are determined and whether it improves various real indicators rather than just improving the synthetic reward.", "训练一个行为条件PPO策略，同一速度命令下按行为参数跟踪不同接触节律、姿态和抬脚轨迹。奖励分为速度任务、固定稳定／平滑项及依行为参数变化的辅助项；接触时序决定摆动时应少受力、支撑时应少滑动，Raibert启发式让足落点随速度和站宽变化，避免站宽奖励妨碍转弯。训练中途重采样命令和行为以学习切换；用四类对称步态为采样基础和速度网格课程。地形始终平坦，但随机质量、摩擦、执行器等；另用执行器网络和约20 ms动作延迟缩小sim-to-real差距。": "Train a behavioral conditional PPO strategy to track different contact rhythms, postures and foot-lifting trajectories according to behavioral parameters under the same speed command. The rewards are divided into speed tasks, fixed stability/smooth items, and auxiliary items that change according to behavioral parameters; the contact timing determines that there should be less force when swinging and less sliding when supporting. The Raibert heuristic allows the foot landing point to change with speed and stance width to avoid stance width rewards from hindering turns. Resample commands and behaviors mid-training to learn switching; use four categories of symmetrical gaits as sampling base and speed grid courses. The terrain is always flat, but with random mass, friction, actuators, etc.; additional actuator networks and ~20 ms action delays close the sim-to-real gap.", "按力信息／力命令接口比较；Opt2VLA明确引用FWBC-VLA并区分目标力，其他箭头不表示已核实直接继承。": "Press force information/force command interface comparison; Opt2VLA clearly references FWBC-VLA and distinguishes the target force. Other arrows do not indicate that direct inheritance has been verified.", "相机看到了物体，也算出了抓取点，但机器人当前站位可能够不到或朝向不合适。": taining gravity; body status/speed tracking performance gated low-priority operation rewards. There is no need for actors to read the terrain, the height map only trains the critic.", "是参考轨迹，": "is the reference trajectory,", "IK可达姿态奖励是清楚、可检验的探索改动；尚无已核实的多支采用，属于方法专题。": "The IK Reachable Stance reward is a clear, testable exploration change; there are no verified multiple adoptions, and it is a method topic.", "unified wholebody标题不等于alljointRL；real5consecutive成功不等于largebenchmark success probability；orientationIK精度非learnedarm策略": "unified wholebody title is not equal to alljointRL; real5consecutive success is not equal to largebenchmark success probability; orientationIK accuracy is not learnedarm strategy", "高层轨迹仍可能超出足支撑与手端能力范围。": "High-level trajectories may still exceed the capabilities of the foot support and hand end.", "作者全文核心方法、主要实验与限制核读；§IV-A–C；§V-A/B；§VI-A–D；Table I；§VII；未运行代码／观看视频，附录覆盖按定位记录": "The author's full text core methods, main experiments and restricted reading; §IV-A–C; §V-A/B; §VI-A–D; Table I; §VII; code not run/video viewed, appendix covering records by positioning", "WholeBodyVLA把π0列为一般VLA先例；没有证据显示使用原动作专家权重。": "WholeBodyVLA lists π0 as a general VLA precedent; there is no evidence of using original motion expert weights.", "教师、学生与闭环RL": "Teachers, students and closed-loop RL", "把各触觉点压缩成少量接触特征；仿真中随机改变物体负载，包含突然释放，奖励稳定抓持和不过度用力。": "Compress each tactile point into a small number of contact features; randomly change the object load in the simulation, including sudden release, to reward stable grip and no excessive force.", "输入：近期身体和关节状态、动作历史，以及期望移动／末端目标或施力命令；不输入实测腕部力。 输出：腿和臂的关节角度目标；同时估计夹爪外力等状态供控制使用。": "Input: recent body and joint status, action history, and desired movement/end target or force application command; do not enter measured wrist force. Output: joint angle targets of the legs and arms; at the same time, the external force of the clamping jaw and other states are estimated for control use.", "问题定义应记录平台与接口、部署观测、任务目标与物体条件、决策变量、训练先验及评价协议。": "The problem definition should document the platform and interfaces, deployment observations, mission objectives and object conditions, decision variables, training priors, and evaluation protocols.", "是实际执行输入，仅执行前": "is the actual execution input, only before execution", "本地 PDF 标题核对；主文完整方法、四任务实验及讨论；参考文献后的长附录未全部读完。": "Local PDF title check; complete method of the main text, four-task experiment and discussion; not all long appendices after the references have been read.", "residual torque 与 contact tokens": "residual torque and contact tokens", "示范学习基础": "Imitation-learning foundations", "DeepWBC baseline由该架构删目标frame/preview/NAE构造；低层multi-task是轨迹tracking，不是直接7任务RL策略": "DeepWBC baseline is constructed by deleting the target frame/preview/NAE from this architecture; the low-level multi-task is trajectory tracking, not a direct 7-task RL strategy", "研究记录应包含条件、可重复失败、机制解释、已有答案及未覆盖条件、拟议改动、可证伪预测和对照实验。": "Research records should include conditions, reproducible failures, mechanistic explanations, existing answers and uncovered conditions, proposed changes, falsifiable predictions, and controlled experiments.", "本地 PDF 标题核对；主文完整，附录 A 感知/地图、B 训练、C 任务与 D 核心协议已读；prompt 图未独立逐字转录，图中无法解析的内容不作实现结论。": "Local PDF title check; the main text is complete, Appendix A Perception/Map, B Training, C Task and D Core Protocol have been read; the prompt diagram has not been independently transcribed verbatim, and the content that cannot be parsed in the diagram will not be concluded.", "完整任务回报减少分段抓取对后续放置的短视": "Complete mission rewards reduce the short-sightedness of segmented capture and subsequent placement", "对请求作经验能力投影。": "Project experience capabilities on requests.", "使用 MPOPI、SPI、CMA-ES 式参数采样与 MPPI。": "Use MPOPI, SPI, CMA-ES style parameter sampling with MPPI.", "应另外记录各模块的观测、奖励、训练是否联合，以及冻结低层后仍可调用的条件接口。": "It should be additionally recorded whether the observation, reward and training of each module are combined, as well as the conditional interface that can still be called after freezing the lower layer.", "作者arXiv v1正文全部章节、Tables 1–8、Appendices A–D；PMLR正文／出版记录及作者项目／README已对照。未逐帧观看视频，未运行训练或完成全部代码审计。": "All chapters of the author's arXiv v1 text, Tables 1–8, Appendices A–D; PMLR text/publication record and author's project/README have been compared. Videos were not viewed frame by frame, training was run, or full code audits were completed.", "先看它改变了什么变量：参考、状态估计、动作、目标函数、训练数据或执行调度；再看信息来自哪里、反馈在何时起作用。同一物理关系用不同坐标／符号表达时可以合并；若目标随不同框架移动、反馈权限或可用信息改变，就应保留区别。": "First look at what variables it changes: reference, state estimation, action, objective function, training data or execution schedule; then look at where the information comes from and when the feedback takes effect. The same physical relationship can be combined when expressed by different coordinates/symbols; if the target moves with different frames, feedback permissions or available information change, the distinction should be preserved.", "是名义关节力矩与接触力；": "is the nominal joint moment and contact force;", "SayCan在离散技能层选择可执行步骤；RT-1以真实机器人多任务数据训练动作token模型，RT-2把互联网视觉语言任务和机器人动作token联合微调；Open X-Embodiment整合跨机器人轨迹，Octo和OpenVLA从这些数据训练不同通用策略；π0用流匹配产生连续动作块。数据来源、动作格式和底层执行权限不同，原始模型的实机实验不能直接当作四足足接触证据。": "SayCan selects executable steps at the discrete skill layer; RT-1 trains action token models with real robot multi-task data, RT-2 jointly fine-tunes Internet visual language tasks and robot action tokens; Open X-Embodiment integrates cross-robot trajectories, and Octo and OpenVLA train different general strategies from these data; π0 uses flow matching to generate continuous action blocks. Due to different data sources, action formats, and underlying execution permissions, real-machine experiments on the original model cannot be directly used as evidence of quadruped contact.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；检测到好抓取不等于四足全身能在运动中稳定达到；底盘站位和身体姿态须另规划。": "The relationship between the actual undertaking and the background only is registered separately in literature/foundations.md; detecting good grasping does not mean that the four-legged body can be reached stably in motion; the chassis position and body posture must be planned separately.", "速度层的雅可比把身体和关节速度映射到手端速度。若可用自由度多于手端约束，就有多种解。零空间项可以调整姿态而保持当前手端速度；实际四足还要加足接触和身体稳定约束，不能任意使用所有数学自由度。": "The speed layer's Jacobi maps body and joint speed to hand speed. If there are more available degrees of freedom than hand constraints, there are multiple solutions. The zero-space term can adjust the posture while maintaining the current hand speed; the actual quadruped must also add foot contact and body stability constraints, and all mathematical degrees of freedom cannot be used arbitrarily.", "同叫动态抓取，运动主体和观测条件不同": "Dynamic grasping differs by what moves and what is observed", "§IV实机设置与cabinet/drawer示例": "§IV real robot settings and cabinet/drawer examples", "轮足": "Wheeled-legged", "一条接近轨迹可以随新物体位置变换，接触后若仍跟随正在移动的物体更新锚点，轨迹却可能失去原意。几何重定向也不保证全身动态可行。": "An approaching trajectory can change with the position of the new object. If the anchor point is still updated after contact with the moving object, the trajectory may lose its original meaning. Geometric retargeting also does not guarantee whole-body dynamics are possible.", "无腕传感器但有实际关节力矩测量；没有该接口的廉价伺服臂不可直接复用；残差含摩擦/模型误差，force tokens是load proxy而非精确标定外力；轮足执行与步行换步不同；峰值力与稳定性结论仍受接口/延迟限制": "No wrist sensor but actual joint torque measurement; cheap servo arms without this interface cannot be directly reused; residuals contain friction/model errors, force tokens are load proxies rather than precise calibration of external forces; wheel-foot execution is different from walking step change; peak force and stability conclusions are still limited by interface/delay", "依赖单自由度专用臂、任务模型／约束、分层参数与近似腿约束。只与忽略物体操作力的简单基线比较，不能建立相对所有统一 MPC 的优势。": "Relies on single-degree-of-freedom dedicated arms, task models/constraints, hierarchical parameters, and approximate leg constraints. Comparison only with a simple baseline that ignores object manipulation forces does not establish superiority over all unified MPCs.", "明确使用 UMI on Legs 的数据和训练设置，增加目标执行前的能力判断与修正；保留尽量向原目标推进的行为。": "Explicitly use the data and training settings of UMI on Legs to increase ability judgment and correction before goal execution; retain the behavior of pushing toward the original goal as much as possible.", "HANDO：Unitree 四足＋Piper 系列臂，导航系统原型": "HANDO: Unitree quadruped + Piper series arm, navigation system prototype", "没有符合筛选条件的论文。": "There are no papers that meet the filter criteria.", "Deep WBC引用其地形行走结果；未核到操作控制器直接沿用具体算法。": "Deep WBC refers to its terrain walking results; the specific algorithm is directly used without verifying the operation controller.", "typed subtask/role slots与SAM3几何": "typed subtask/role slots and SAM3 geometry", "四类真机任务每类100机器人＋300人示范，移动约1–5 m。78 对59、82 对31为子任务归一化分数，不是端到端成功率；所谓新机器人场景在部分人训练数据中覆盖，体现跨数据来源场景迁移。": "Four types of real-machine tasks, each with 100 robots and 300 people demonstrating, moving about 1–5 m. 78 vs. 59, 82 vs. 31 are subtask normalized scores, not end-to-end success rates; the so-called new robot scenes are covered in some human training data, reflecting cross-data source scene migration.", "固定接口、任务与预算，再比较训练改动；分别报告回报和实际成功、跟踪、力、效率指标，并保留多种子。": "Fixed interfaces, tasks and budgets, and then compared training changes; reported returns and actual success, tracking, force, and efficiency indicators separately, and retained multiple seeds.", "PFG Unified Policy用臂IK给身体姿态塑形：即使末端尚未到达，只要身体已使目标可达也能获得回报。它与直接增大末端误差权重不同；但数值IK的有解率不是严格几何工作空间体积。": "PFG Unified Policy uses arm IK to shape the body posture: even if the end has not yet been reached, you can get rewards as long as the body has made the target reachable. It is different from directly increasing the terminal error weight; but the solution rate of numerical IK is not strictly geometric workspace volume.", "先做小型复现：固定世界参考＋固定增益；加入可重复身体运动／释放；比较位置、柔顺和力反馈；再看是否存在持续缺口。": "Do a small reproduction first: fixed world reference + fixed gain; add repeatable body movement/release; compare position, compliance and force feedback; then see if there are persistent gaps.", "固定前腿操作": "Fixed front leg operation", "让价值函数利用仿真真值降低强化学习的价值估计难度，同时限制actor仅用真实可获得的观察；再配域随机化缩小视觉和动力学差距。它改变训练信息分配，不决定任务奖励或全身动作接口。": "Let the value function use the true value of the simulation to reduce the difficulty of value estimation in reinforcement learning, while limiting the actor to only use real available observations; then use domain randomization to narrow the gap between vision and dynamics. It changes training information distribution and does not determine task rewards or full body motion interfaces.", "用多难度地形课程、执行器模型及动力学随机化训练本体感知策略；课程逐步暴露台阶、斜坡和不规则足支撑。": "Use multi-difficulty terrain courses, actuator models, and dynamic randomization to train proprioception strategies; the course gradually exposes steps, slopes, and irregular foot supports.", "后两式说明 CAIMAN 的动作影响量：$S'_{\\mathrm{obj}}$ 是下一物体状态，$p(\\cdot\\mid s,a)$ 是给定当前状态与动作的物体转移分布，$p_\\pi$ 是按动作策略边缘化后的分布。离散动作时积分改为求和。": "The last two equations illustrate CAIMAN's action influence: $S'_{\\mathrm{obj}}$ is the next object state, $p(\\cdot\\mid s,a)$ is the object transfer distribution given the current state and action, $p_\\pi$ is the distribution after marginalization according to the action strategy. For discrete actions, the integral is changed to a summation.", "把目标点云压成加权 PCA 中心＋三轴正负端点七个点，用 ego-motion Kalman filter 保持短期目标；上游 VLM 选择 pick/place 语义锚点，RL 以基座平移/yaw/body pitch 对准身体夹爪，遮挡噪声训练模拟脱离视野后的估计漂移。": "Press the target point cloud into seven points of weighted PCA center + three-axis positive and negative endpoints, and use ego-motion Kalman filter to maintain short-term goals; the upstream VLM selects pick/place semantic anchor points, RL uses base translation/yaw/body pitch to align the body gripper, and occlusion noise training simulates the estimated drift after leaving the field of view.", "Visual WBC低层／奖励、Contact-GraspNet、PointNet、PPO、DAgger、Transformer。": "Visual WBC low-level/reward, Contact-GraspNet, PointNet, PPO, Dagger, Transformer.", "task名称比终止代理条件更宽；实用任务目标不能由这些success直接推定；已知mesh/pose与小样本5次硬件实验；未知对象/机构泛化未证明；印刷变换矩阵顺序存在不一致，不能未经code核对直接复制公式": "The task name is wider than the termination agent condition; practical task goals cannot be directly deduced from these successes; known mesh/pose and 5 hardware experiments with small samples; generalization of unknown objects/organizations has not been proven; there are inconsistencies in the order of the printing transformation matrix, and the formula cannot be copied directly without code verification", "条机制": " mechanisms", "释放窗口状态集合与闭环加速度修正": "Release window status set and closed-loop acceleration correction", "站位选择和移动中保持接触是两个决策：前者决定怎样开始，后者还要协调身体速度和臂轨迹。WildLMa 的技能组合、QuadWBG 的 GORM 和 TONAV 的操作导向导航处理的任务层级并不相同。TONAV主要做目标居中与保持距离，未联合求解上面列出的完整接触路径条件。": "Position selection and maintaining contact during movement are two decisions: the former determines how to start, and the latter also requires coordinating body speed and arm trajectory. WildLMa's skill set, QuadWBG's GORM, and TONAV's operations-oriented navigation do not address the same task hierarchy. TONAV mainly does target centering and maintaining distance, and does not jointly solve the complete contact path conditions listed above.", "精确对象速度教师和有限视觉学生的可实现性缺口": "Achievability Gap for Precise Object Speed ​​Teachers and Limited Vision Students", "主要承接作者此前 BeyondMimic 的动作跟踪问题和奖励形式，比较 SONIC 的大规模 PPO；此前 ControlVAE、SuperTrack、SuperDyno 等已用过学习的可微动力学，故创新不能概括为“首次用世界模型训练全身控制”。本文把单模型训练扩大到大规模人形动作集，展示模型梯度的算力收益与 G1 真机迁移，并初测任务专用速度接口。与 UMI on Legs 的区别是**训练优化器 vs. 高层手端轨迹—全身执行接口**，二者可组合，但本文没有这样做。": "The paper adopts BeyondMimic’s tracking setup and most of its reward, comparing against SONIC’s large-scale PPO tracker. Learned differentiable dynamics had already been explored in SuperTrack, ControlVAE, and SuperDyno. The contribution here is efficient training at large motion-library scale and transfer of the resulting tracker to a physical G1. UMI on Legs studies a different question: how end-effector trajectories drive a quadruped whole-body controller. A combination is plausible but untested.", "机构特征与交互估计": "Institutional Characteristics and Interaction Estimation", "NMPC framework 的模型推导": "Model derivation of NMPC framework", "VLM 选择姿态": "VLM Select Attitude", "在类似 UMI 的轨迹接口上修正低层能力外的请求。": "Fix requests outside of low-level capabilities on UMI-like trajectory interfaces.", "正文分层方法、奖励、仿真与真机设置／结果审读；主要表格核对；未观看视频": "Text layering method, rewards, simulation and real robot settings/result review; main table verification; video not watched", "正刚度／阻尼的静态选择不自动保证延迟系统或任意切换系统稳定。估计噪声、采样频率、参数变化和力饱和都需要验证。": "Static selection of positive stiffness/damping does not automatically guarantee stability for delayed systems or arbitrary switching systems. Estimation noise, sampling frequency, parameter variations, and force saturation all require validation.", "不是以末端显著更精准为主要定量增量：控制收益主要在基座跟踪；不能把8类41%–70%写为真机结果；'no scripted policies' 泛称与 Appendix C.1 固定执行序列不一致，应按具体阶段描述；统一网络输出 18 个关节目标是真实接口，不能混成仅腿 RL＋臂 IK": "The main quantitative increment is not that the end is significantly more accurate: the control gain is mainly tracked at the base; 41%–70% of the 8 categories cannot be written as real robot results; the general name of 'no scripted policies' is inconsistent with the fixed execution sequence of Appendix C.1 and should be described by specific stages; the unified network output 18 joint targets are real interfaces and cannot be mixed into leg-only RL + arm IK", "真机三类 pick/place 各十次，检测约 5 Hz／200 ms；比较 KF、遮挡噪声训练和人工。仿真成功判据主要是身体到理想对准姿态并停下，与物理夹取需区分。": "real robot performs ten pick/place tests of three categories, detection time is about 5 Hz/200 ms; compares KF, occlusion noise training and manual testing. The main criterion for successful simulation is that the body reaches the ideal alignment posture and stops, which needs to be distinguished from physical clamping.", "输入：相机得到的候选抓取姿态、自身状态，以及预计算的可达信息；低层接收身体平面速度、高度和俯仰命令。 输出：上层选择身体移动／姿态命令，臂执行抓取姿态；行走策略输出腿部关节动作。": "Input: Candidate grabbing poses obtained by the camera, self-state, and pre-computed reachability information; the lower layer receives body plane speed, height and pitch commands. Output: The upper layer selects the body movement/posture command, and the arm executes the grabbing posture; the walking strategy outputs the leg joint movements.", "先把任务写成可比较的问题定义": "Define a comparable task before comparing methods", "是末端实际状态；": "is the actual status of the terminal;", "学习得到的 C 是经验边界，未必是带证明的安全集合；地形、速度、载荷、故障会改变它。": "The learned C is an empirical boundary, not necessarily a safe set with proof; terrain, speed, load, and faults will change it.", "这是已经建立接触的一维线性弹性近似。": "This is a one-dimensional linear elastic approximation of established contact.", "基于Visual WBC的部分开源实现扩展Isaac Gym训练→MuJoCo验证→实机ROS接口。脚接触用关节力矩经Jacobian伪逆转成粗力估计再阈值化；实机与仿真共用FSM、目标管理与PD。显式比较MuJoCo默认与高impratio接触设置，区分画面更平滑与真实抓地鲁棒性。": "Based on the partial open source implementation of Visual WBC, the Isaac Gym training→MuJoCo verification→real robot ROS interface is extended. The joint torque used for foot contact is transformed into a rough force estimate through Jacobian pseudo-inversion and then thresholded; the real robot and simulation share FSM, target management and PD. Explicitly compare MuJoCo default and high impratio contact settings to differentiate between smoother graphics and true grip robustness.", "直接采用 ETH 2023 年多接触规划器，结合 PPO、参考状态初始化（RSI）、关节残差追踪与域随机化。": "Directly adopts the ETH 2023 multi-contact planner, combining PPO, Reference State Initialization (RSI), joint residual tracking and domain randomization.", "第一式示意单个速度通道的一阶闭环响应：": "The first equation shows the first-order closed-loop response of a single velocity channel:", "原文": "Original paper", "真机版本边界": "Real device version boundaries", "保留手端轨迹，在人形下层加入身体／落脚运动先验。": "Keep the hand trajectory and add body/feet motion prior to the lower layer of the humanoid.", "§3.1：two LAMs、统一latent VLA与机器人decoder": "§3.1: two LAMs, unified latent VLA and robot decoder", "闭环模型": "Closed loop model", "方法：分阶段object-relative/contact-time锚点": "Method: Staged object-relative/contact-time anchors", "这些是不同输出接口；流程之间不存在一个未经假设就成立的数学等价式。应核对网络预测的是状态、参考还是控制量。": "These are different output interfaces; there is no mathematical equivalent between processes that holds without assumptions. It should be checked whether the network predicts state, reference or control quantities.", "论文贡献": "Paper contributions", "手里物体被外力拉扯时，一直夹得很紧会损伤物体；夹得太松又会滑落。外部负载突然消失也会扰乱身体。": "When an object in your hand is pulled by an external force, clamping it too tightly will damage the object; clamping it too loosely will cause it to slip. The sudden removal of external loads can also disrupt the body.", "Appendix C.1：固定短技能序列": "Appendix C.1: Fixed short skill sequence", "是可选前馈力矩。": "is optional feedforward torque.", "第二式示意步态周期项的谐波表示：$\\varphi\\in[0,2\\pi)$ 是以弧度表达的相位，$\\nu$ 是速度条件，$N$ 是所保留谐波项数，系数可随速度改变。若使用归一化相位 $\\bar\\varphi\\in[0,1)$，应代入 $\\varphi=2\\pi\\bar\\varphi$。这里没有指定 ReCo 训练参考与部署模型使用相同阶次或相同系数。": "The second formula shows the harmonic representation of the gait periodic terms: $\\varphi\\in[0,2\\pi)$ is the phase expressed in radians, $\\nu$ is the speed condition, $N$ is the number of harmonic terms retained, and the coefficient can change with the speed. If the normalized phase $\\bar\\varphi\\in[0,1)$ is used, $\\varphi=2\\pi\\bar\\varphi$ should be substituted. There is no specification here that the ReCo training reference uses the same order or the same coefficients as the deployed model.", "是预测所需状态，": "is the predicted required state,", "实际承接与仅作背景的关系分开登记在literature/foundations.md；预定义接触模式和物体模型限制新场景；MPC实时性不等于未知机构、摩擦、抓取点均可自动估计。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; predefined contact modes and object models limit new scenarios; MPC real-time does not mean that unknown mechanisms, friction, and grab points can be automatically estimated.", "人形 Opt2VLA 高层含手足目标与期望接触力；Go2＋Piper 初步工作输出底盘速度、身体姿态和关节目标，未专门输出力。": "Humanoid Opt2VLA high-level contains hand and foot targets and expected contact forces; Go2＋Piper preliminary work outputs chassis speed, body posture and joint targets, but does not specifically output forces.", "IEEE Access 四足综述的参考文献元数据收录 RoLoMa。": "Reference metadata inclusion of IEEE Access Tetrapod Review RoLoMa.", "物体相对与接触段重定向": "Object relative to contact segment redirection", "给定名义状态、加速度和接触时，$\\tau_0,\\lambda_0$ 是名义关节力矩与接触力；$\\Delta\\tau,\\Delta\\lambda$ 是为抵抗额外外力 $f$ 作出的调整。这里 $f\\in\\mathbb R^3$，$J_E$ 只取该作用点的平移速度 Jacobian；$\\mathcal T$ 表示力矩限制，$\\mathcal K$ 表示接触和摩擦限制。": "Given nominal state, acceleration, and contact, $\\tau_0,\\lambda_0$ are the nominal joint moments and contact forces; $\\Delta\\tau,\\Delta\\lambda$ are the adjustments made to resist the additional external force $f$. Here $f\\in\\mathbb R^3$, $J_E$ only takes the Jacobian translation speed of the action point; $\\mathcal T$ represents the torque limit, and $\\mathcal K$ represents the contact and friction limit.", "未取得全文": "Full text unavailable", "是固定表示映射，": "is a fixed representation mapping,", "是目标水平位置，": "is the target horizontal position,", "的正方向应与误差坐标相容。": "should be compatible with the error coordinate.", "【真机＋仿真；强实验】仿真5种子各10000任务：86.05%对无估计81.88%、分段78.40%、潜变量85.82%；完成时间2.071 s对分段2.572 s。真机6条件各10次，总44/60=73.3%，平均4.06 s；质量最高1.3 kg，地面到1.1 m台面条件6/10。真机名义任务换VBC低层为3/10，完整9/10。": "[real robot + simulation; strong experiment] Simulation of 5 sub-classes with 10,000 tasks each: 86.05% versus 81.88% for no estimate, 78.40% for segmentation, and 85.82% for latent variables; completion time 2.071 s versus 2.572 s for segmentation. real robot 6 conditions were tested 10 times each, total 44/60=73.3%, average 4.06 s; maximum mass 1.3 kg, ground to 1.1 m table condition 6/10. The nominal task of replacing the lower level of VBC with the real robot is 3/10, and the overall score is 9/10.", "手端误差很小，仍可能向刚性面板施加过大力；受到未知外力时还能走稳，也不表示能按给定数值施力。": "The hand-end error is very small, and it is still possible to apply too much force to the rigid panel; it can still walk stably when subjected to an unknown external force, which does not mean that the force can be applied according to the given value.", "Go2＋ViperX300＋hook。SAFE 在把手／面板包围盒内部采样保留尺寸关系；ArtIEst 视觉几何分支预测把手到铰链方向，本体历史分支仅在对象已运动时监督，再按交互历史 gate 融合。初始世界包围盒由外部提供、LiDAR 更新相对位姿，不是已验证的自主视觉识别。": "Go2＋ViperX300＋hook. SAFE samples inside the handle/panel bounding box to preserve size relationships; the ArtIEst visual geometry branch predicts the handle to hinge direction, the ontology history branch only supervises when the object has moved, and then merges according to the interaction history gate. The initial world bounding box is provided externally, LiDAR updates relative pose, and is not a verified autonomous visual recognition.", "多关节时需要求解上面的映射，并检查接触位置、方向和矩阵秩。若允许传递力矩，则": "When using multiple joints, you need to solve the above mapping and check the contact position, direction and matrix rank. If the moment is allowed to be transmitted, then", "传统CPU串行训练四足RL过慢，地形难度课程与大量并行机器人训练不易配合。": "The traditional CPU serial training of quadruped RL is too slow, and it is difficult to coordinate terrain difficulty courses with a large number of parallel robot training.", "先用动力学估计总扰动，再利用支撑接触约束分出末端力，网络纠正剩余时变误差；学习策略按方向选择跟踪位置或力。": "First use dynamics to estimate the total disturbance, and then use the support contact constraints to separate the end force. The network corrects the remaining time-varying errors; the learning strategy selects the tracking position or force according to the direction.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；本库WholeBodyVLA主要把OpenVLA-OFT作为改造后的基线；背景引用不表示采用原OpenVLA架构。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; WholeBodyVLA in this library mainly uses OpenVLA-OFT as the modified baseline; background references do not mean the use of the original OpenVLA architecture.", "六实机任务：单/双手玩具、鞋、scoop、pour，ID每条件24次/OOD12次；20–40 robot示范＋200–340 human可改善较少robotdat nstrations, but it leaves whole-body configuration and target feasibility to the execution layer.", "训练并辨识可预测步态，MPC补偿身体响应。": "Train and identify predictable gait, MPC compensates for body response.", "UMI on Legs §3.1明确按Chi等配置使用U-Net diffusion policy与DDIM，并延长未来轨迹窗口。": "UMI on Legs §3.1 Explicitly use U-Net diffusion policy and DDIM according to Chi and other configurations, and extend the future trajectory window.", "Robot-Free 指人示范采集，不是整个训练无机器人数据。人数据更易迁移导航而非精细接触；human-only cart grasp仅5，对robot15、共同训练60。不能泛称完全未见场景或任意形态已解决。": "Robot-Free refers to human demonstration collection, not robot-free data for the entire training. Human data is easier to migrate and navigate than fine-grained contact; human-only cart grasp is only 5, for robot 15, and joint training is 60. It cannot be generally said that completely unseen scenes or arbitrary forms have been solved.", "作者全文核心方法、主要实验与限制核读；§III-A–D；§IV-A–G；Tables I–V；§V；未运行代码／观看视频，附录覆盖按定位记录": "The author’s full text core methods, main experiments and restrictions; §III-A–D; §IV-A–G; Tables I–V; §V; code not run/video viewed, appendix covering records by location", "基准参考不同于模仿基线训练轨迹；RoboDuet／Visual WBC 的身体路径由外部 pure-pursuit 给定。2×2 中模型辨识改善位置误差，但姿态 RMSE 增加；未量化任意接触力安全，动捕外的里程计误差没有独立测量。": "The baseline reference is different from mimicking the baseline training trajectory; the RoboDuet/Visual WBC's body path is given by an external pure-pursuit. Model identification in 2×2 improves position error, but attitude RMSE increases; arbitrary contact force safety is not quantified, and odometry error outside of motion capture is not independently measured.", "视觉策略蒸馏": "Visual Strategy Distillation", "真机遥操作充电器插入、柜门／抽屉、倒饮料、狭窄取物和双手提物。单／双 workspace 0.34→0.68、0.38→0.83 m³ 来自运动学采样；原地五组任务的8秒末端轨迹平均 1.89 mm／0.047 rad 由自身估计与运动学计算，没有独立世界测量。": "real robot remote operation for charger insertion, cabinet doors/drawers, pouring drinks, narrow access and two-hand carry. Single/double workspace 0.34→0.68, 0.38→0.83 m³ comes from kinematic sampling; the average 8-second end-effector trajectory of five groups of tasks in situ is 1.89 mm/0.047 rad, which is calculated by self-estimation and kinematics, without independent world measurement.", "闭环蒸馏与任务优化": "Closed-loop distillation and task optimization", "仅要求跟踪身体速度并不能唯一决定步态、姿态和足轨迹。一种训练解能走平地，不代表它适合低障碍、台阶或外力；怎样在部署时换行为而不是反复训练？": "The mere requirement to track body speed does not uniquely determine gait, posture, and foot trajectory. Just because a training solution can walk on flat ground does not mean that it is suitable for low obstacles, steps or external forces; how to change behaviors during deployment instead of repeated training?", "ETH同作者2023多接触工作将接触顺序搜索加入这一路线；2025臂动力学NMPC正文明确以本工作为先例。": "ETH's 2023 multi-contact work with the same author adds contact sequence search to this route; the 2025 Arm Dynamics NMPC text clearly takes this work as a precedent.", "人视角MoGe深度重投影/补洞": "Human perspective MoGe depth reprojection/hole filling", "先写残差单位、加入位置和是否经过约束，再判断能否替换或组合。": "First write the residual unit, adding position and whether it is constrained, and then determine whether it can be replaced or combined.", "相较同类方法": "Compared with related methods", "把高层末端轨迹交给带未来预览的四足全身策略。": "Leave high-level terminal trajectories to a quadruped whole-body strategy with future previews.", "是模型根据实际运动推算的所需广义力；": "is the required generalized force calculated by the model based on the actual motion;", "CMP 没有在部署时先求任务空间距离最小的目标投影，再解码一条修正末端轨迹。潜空间能力几何依赖学习和估计条件；应相对原始请求报告任务误差与存活，而不是只评价截断后的意图。": "CMP does not first obtain the target projection with the smallest distance in the task space during deployment, and then decode a modified end-effector trajectory. Latent space capabilities depend geometrically on learning and estimation conditions; task error and survival should be reported relative to the original request, rather than just evaluating the truncated intent.", "语言规划器或 VLM 可以选择技能、关键姿态或步骤，连续动作由已有模块产生；VLA 则根据视觉、语言等条件生成动作表示，再由执行器或低层控制器执行。": "Language planner or VLM can select skills, key postures o ed, $w_{R\\to O}$ is the contact force spin of the robot acting on the object.", "上层选择底盘路径点，下层选择末端及臂轨迹，联合考虑逆运动学可达、平滑和碰撞；先独立导航到操作区。": "Bilevel optimization selects base waypoints and end-effector/arm trajectories under IK reachability, smoothness, and collision costs; a separate navigation system first approaches the manipulation area.", "球坐标、笛卡尔坐标和位姿矩阵可表示同一目标；‘目标附着在哪里’和‘有哪些信息被控制器观测到’才是应比较的区别。": "Spherical coordinates, Cartesian coordinates and pose matrix can represent the same target; 'where the target is attached' and 'what information is observed by the controller' are the differences that should be compared.", "OpenVLA等以RT-2为VLA先例和比较对象；本库四足VLA大多只作背景引用，未核到使用RT-2权重。": "OpenVLA and others use RT-2 as the precedent and comparison object of VLA; most of the four-legged VLA in this library are only used as background references, and the use of RT-2 weights has not been verified.", "IK、PPO/DR、CMAES、SAM2/GPT4o；interface directions人工定义": "IK, PPO/DR, CMAES, SAM2/GPT4o; interface directions are manually defined", "OpenVLA、Pinocchio IK、独立导航与注视模块；文中未核实复用UMI on Legs控制器。": "OpenVLA, Pinocchio IK, and a separate navigation/gaze module. No verified reuse of the UMI on Legs controller.", "腿上小臂形态，仅仿真": "Leg and forearm form, simulation only", "是权重，": "is the weight,", "离散模式规定当前由哪些肢体与物体或环境接触、抓取和支撑；每个模式内还有连续的身体、关节、物体轨迹及接触力。": "The discrete mode specifies which limbs are currently in contact with, grasping and supporting the object or environment; there are also continuous body, joint, object trajectories and contact forces within each mode.", "高低层频率、参考表示、预测时域和冻结状态要明确。层数越多不自动更好。": "The high and low layer frequencies, reference representation, prediction time domain and frozen state should be clear. More layers are not automatically better.", "分段抓取和搬运会产生停顿，并可能在抓取时选择不利于后续放置的身体／臂配置。本文研究移动不中断时的抓取、搬运、直立放置与撤离，并适应不同对象质量。": "Segmented grasping and handling creates pauses and may select a body/arm configuration during grasping that is not conducive to subsequent placement. This paper studies rent information.", "Go1＋自制1.5kg Lite Arm；18关节统一 RL": "Go1＋Homemade 1.5kg Lite Arm; 18-joint unified RL", "额外环境支撑也会改变可承受力集合，但同时限制手或身体的运动。这是力能力与可达／移动能力之间的权衡，不是支撑越多越好。规划裕量和反馈恢复可以组合，不能认为前者代替后者。": "Additional environmental support also changes the tolerable force set but at the same time limits hand or body movement. This is a trade-off between force capabilities and reach/movement capabilities, not more support is better. Planning margin and feedback recovery can be combined, and the former cannot be considered to replace the latter.", "轮式移动机械臂": "Wheeled mobile robotic arm", "【多平台真机操作】包括单臂、双臂和移动机械臂任务，原作报告折衣等跨任务操作；RSS 2025。需按任务查看每个成功率，不能把泛化概括成四足能力。": "[Multi-platform real robot operation] Including single-arm, double-arm and mobile robot arm tasks, the original report folds clothes and other cross-task operations; RSS 2025. Each success rate needs to be viewed by task, and generalizations cannot be made to four-legged abilities.", "运动学nullspace任务优先级与动力学QP基于Kim whole-body impulse control等既有控制思想；Human2LocoMan直接承接硬件/控制；学习人示范是后者的新上层，不是本篇": "Kinematics nullspace task priority and dynamics QP are based on existing control ideas such as Kim whole-body impulse control; Human2LocoMan directly takes over the hardware/control; learning human demonstration is the new upper layer of the latter, not this article", "用持续更新的可微动力学模型代替大量仿真 PPO 样本估计，在短时想象轨迹中反向传播训练统一动作跟踪器；部署只运行策略。": "Replace large numbers of simulated PPO sample estimates with a continuously updated differentiable dynamics model, backpropagate training of a unified action tracker on short-term imagined trajectories; deploy a run-only strategy.", "第一式示意单个速度通道的一阶闭环响应：$c$ 是命令，$v$ 是实际响应，$k_v$ 是增益，$\\tau_v>0$ 是时间常数。": "The first equation shows the first-order closed-loop response of a single velocity channel: $c$ is the command, $v$ is the actual response, $k_v$ is the gain, and $\\tau_v>0$ is the time constant.", "知识搜索": "Knowledge Search", "41 异构资产仿真 train79.35%、test79.02%；真机柜门／抽屉为定性展示，无41对象真机成功统计。全程方向误差融合较好，contact-only 本体单支 y 50 trials; wipe/push-to-open 3mm cabinet/drawer occlusion; G1baseforce behavior", "是允许的落点偏差；": "is the allowable landing point deviation;", "用于防止把足端、无臂推物和背载臂实验直接并列。": "Used to prevent the hand-to-foot, armless pushing and carrying arm experiments from being directly paralleled.", "在线在命令空间做采样 MPC，将冻结的预训练 ReLIC 放进完整接触物理仿真展开，用较低维命令搜索稳定动作，同时允许测试时更换物体／目标。": "Do sampling MPC online in the command space, put the frozen pre-trained ReLIC into the complete contact physics simulation, use lower-dimensional commands to search for stable actions, and allow the object/target to be changed during testing.", "平台无外挂臂。QP 是 SRB 接触力分配，不是完整逆动力学分层 QP；低增益柔顺演示不构成任意安全证明。": "The platform has no external hanging arm. The QP is an SRB contact force distribution, not a full inverse dynamics layered QP; the low-gain compliance demonstration does not constitute arbitrary safety proof.", "CoRL2022会议与2023论文集日期分别标明。参考论文／附录的8维行为向量；HTML转换表号有错位，定位采用归档PDF的Table 3（功率）、4（平台）、5（平地）、6–8（训练设置）；开源配置可能扩展字段，不把当前代码配置等同于原版论文。": "CoRL2022 conference and 2023 proceedings dates are marked respectively. Refer to the 8-dimensional behavior vector of the paper/appendix; the HTML conversion table number is misplaced, and the positioning uses Table 3 (power), 4 (platform), 5 (flat ground), 6–8 (training settings) of the archived PDF; the open source configuration may expand the fields and do not equate the current code configuration with the original paper.", "综述": "Survey", "检测到柜门或按钮，只说明它在哪里；操作还要决定接触哪个部位、从哪个方向接近以及接触后怎样运动。": "When a cabinet door or button is detected, it only indicates where it is; the operation also requires deciding which part to touch, which direction to approach from, and how to move after contact.", "两个自由运动力矩预测器分别使用历史和当前状态；历史较低噪但可能吸收持续接触，状态分支较保留负载变化，由 gate 混合残差。六关节残差的强度／变化编码成 force tokens 输入动作专家；残差经阻尼 Jacobian 逆和力臂变换形成机身负载线索，供限幅／低通的速度补偿。": "Two free-motion torque predictors use history and current state respectively; history is less noisy but may absorb continuous contact, state branch is more preserving load change, and the residual is mixed by gate. The strength/change of the six-joint residuals is encoded into force tokens and input to the motion expert; the residuals are subjected to damped Jacobian inverse and moment arm transformation to form body load cues for limiting/low-pass speed compensation.", "原论文没有四足运动、足接触和手端跟踪控制；动作生成质量与低层执行能力须分别衡量。": "The original paper does not include quadruped movement, foot contact and hand tracking control; the quality of motion generation and low-level execution capabilities must be measured separately.", "是期望速度，": "is the desired speed,", "制造视觉一致的成功／失败、动作中断和对象状态复位，测重复、漏操作与误报完成。": "Create visual consistency of success/failure, action interruption and object status reset, and detect repeated, missing operations and false alarm completion.", "用于明确接触力与末端位置误差不是同一指标。": "Used to clarify that contact force and end position error are not the same index.", "机器人走近、拿起、搬运、放下物体后，短动作块的模型可能忘记“同一个物体现在在哪里”；另一个独立监控器也可能用与动作模型不同的状态判断成功。": "After the robot approaches, picks up, carries, and puts down an object, the model of the short action block may forget \"where the same object is now\"; another independent monitor may also use a different state from the action model to successfully judge.", "用多层感知机近似各腿耦合的运动学可达余量，在只显式优化身体＋臂的 KOMO 中使用其值／梯度，不加入腿变量也能保留腿运动学限制。": "Use a multilayer perceptron to approximate the kinematic reachability margin of each leg coupling, and use its value/gradient in KOMO that only explicitly optimizes the body + arms. The kinematic constraints of the legs can be preserved without adding leg variables.", "VLA 输出 11 维命令：机体坐标底盘速度 vx、vy、yaw 速度、身体 pitch、六个臂关节绝对角目标及夹爪开合。臂感知的 BinWalker 衍生 RL 行走控制器执行底盘命令，关节轨迹控制器执行臂命令；不是 VLA 只给末端轨迹的接口。": "VLA outputs 11-dimensional commands: body coordinates, chassis speed vx, vy, yaw speed, body pitch, six arm joint absolute angle targets and gripper opening and closing. The arm-aware BinWalker-derived RL walking controller executes chassis commands, and the joint trajectory controller executes arm commands; instead of VLA, it only gives an interface to the end-effector trajectory.", "综述，不提供新的四足真机算法实验。": "Overview, does not provide new quadruped real robot algorithm experiments.", "每个机器人单独采集、训练策略限制了跨形态知识迁移；异构轨迹格式也妨碍合并训练。": "Each robot’s separate collection and training strategy limits cross-modal knowledge transfer; heterogeneous trajectory formats also hinder combined training.", "CLIP目标相关图": "CLIP target related diagram", "跨平台仿真工具": "Cross-platform simulation tool", "真实执行器热限制": "Real actuator thermal limit", "23 episodes replay 中动作 MSE 较 FastWAM 改善 21.7%，X-VLA 的动作误差仍更低。真机每方法 79 次，本方法 46/79、FastWAM 45/79，仅差一次成功；其他协调指标改善不能代替任务率的统计显著性。": "In 23 episodes replay, the action MSE is improved by 21.7% compared to FastWAM, and the action error of X-VLA is still lower. The real robot achieved 79 times per method, this method 46/79, and FastWAM 45/79, which was only one success away; improvements in other coordination indicators cannot replace the statistical significance of the task rate.", "本地 PDF 标题核对；完整主文与附录 reward/观测主要段已读，附录参数表未全部逐字覆盖。": "Local PDF title check; the complete main text and appendix reward/observation main paragraphs have been read, and the appendix parameter table has not been fully covered verbatim.", "【视觉基准】零样本图像识别等；原作不做四足操作实机。ICML 2021。": "[Visual benchmark] Zero-sample image recognition, etc.; the original work does not have four-legged operation. ICML 2021.", "短篇初步结果，任务和示教范围有限；无法据此认定显式速度输出优于末端轨迹输出，也不能证明持续接触时的精度与安全性。": "Short preliminary results, limited task and teaching scope; it cannot be concluded that explicit speed output is better than terminal trajectory output, nor can it prove the accuracy and safety during continuous contact.", "统一策略共同接收目标并输出所有动作；协作策略分别输出腿和臂动作，同时交换身体姿态请求或共享全身观测；模型分工则可让腿由 RL 控制、臂由逆运动学或模型控制。一个网络与两个网络的区别本身并不确定协调效果，关键是每一方能看到什么、请求什么、改变什么。": "The unified strategy jointly receives the target and outputs all movements; the collaborative strategy outputs leg and arm movements separately, while exchanging body pose requests or sharing whole-body observations; the model division of labor allows the legs to be controlled by RL and the arms to be controlled by inverse kinematics or the model. The difference between one network and two networks does not itself determine the coordination effect. The key is what each party can see, request, and change.", "§III-B.1与Table I": "§III-B.1 and Table I", "不是在背部安装两个六轴臂，而是两个小腿3DoF模块＋腿关节；1.89mm不是walkingcontactworldgroundtruthaccuracy；loco-manipulation主要维持gripperorientation，不要写任意完整EEposition在行走中精确控制；FSMmotionmode不是自主任务成功事件记忆": "Instead of installing two six-axis arms on the back, there are two calf 3DoF modules + leg joints; 1.89mm is not walkingcontactworldgroundtruthaccuracy; loco-manipulation mainly maintains gripper orientation, do not write any complete EEposition for precise control during walking; FSMmotionmode is not an autonomous task success event memory", "动作块、蒸馏、示范重定向和RL微调处理不同变量；任务回报微调不一定保留所有示范技能。": "Action blocks, distillation, demonstration redirection, and RL fine-tuning handle different variables; task reward fine-tuning does not necessarily preserve all demonstration skills.", "关节力矩的单位是牛顿米，末端力的单位是牛顿。要从前者得到后者，必须知道接触位置与机器人几何关系。例如已知方向的力通过一段力臂产生关节力矩；多关节时用接触 Jacobian 描述这一关系。未知作用点、同时多处接触或缺少可辨识方向时，不能仅由残差唯一恢复末端力。": "The unit of joint torque is Newton meters, and the unit of end force is Newton. To obtain the latter from the former, the relationship between the contact position and the robot geometry must be known. For example, a force in a known direction produces a joint moment through a moment arm; in the case of multiple joints, the contact Jacobian is used to describe this relationship. When the point of action is unknown, there are multiple contacts at the same time, or there is no identifiable direction, the end force cannot be uniquely recovered from the residuals alone.", "仿真大规模候选比较；Go2＋NERO 臂另装身体侧面平面支撑架，真机持续支持接触并行走承载，5 次行走试验的末端位置 RMSE 为 14.97 mm。候选选择约需 39／62 秒，执行控制器为 10 Hz；不能称为实时完整接触序列规划。场景几何及摩擦需预建模，具体约束还引用 PDF 外的补充材料。": "Simulation large-scale candidate comparison; the Go2+NERO arm is equipped with a body side plane support frame, and the real robot continues to support contact and walking load. The end position RMSE of 5 walking tests is 14.97 mm. Candidate selection takes approximately 39/62 seconds with a 10 Hz execution controller; it cannot be called real-time complete contact sequence planning. Scene geometry and friction need to be pre-modeled, and specific constraints are also referenced from supplementary materials outside the PDF.", "不能把末端欠约束解释为必须扩大VLA动作维度；本文上层并非语言VLA。": "The terminal under-constraint cannot be interpreted as the necessity to expand the VLA action dimension; the upper layer of this article is not the language VLA.", "位置/力mode alternation；virtual spring contact/force reward；history estimator；forcepolicy外包位置误差反馈构成impedance": "Position/force mode alternation; virtual spring contact/force reward; history estimator; forcepolicy outsourcing position error feedback constitutes impedance", "全身遥操作采相机、双臂状态、底盘运动；模仿策略联合输出双臂关节与底盘线／角速度。": "whole-body remote control adopts camera, arm status, and chassis motion; the imitation strategy jointly outputs the arm joints and chassis line/angular velocity.", "异步动作前缀对齐；承诺前缀与异步块对齐": "Asynchronous action prefix alignment; promise prefix alignment with async block", "模型精度、算力与执行偏差的取舍": "Trade-offs among model fidelity, computation, and execution error", "并非完整固定 world/task frame；共享网络含 separate action heads，不能用“一个网络”排除分工；任务演示非全面自主任务判断": "The world/task frame is not completely fixed; the shared network contains separate action heads, and \"one network\" cannot be used to exclude division of labor; the task demonstration is not comprehensive and autonomous task judgment", "高层参考超出低层能力时，可以先投影到较可行的目标，或重新选站位／姿态。投影会改变原任务参考，应同时记录跟踪误差和原始目标的偏离，避免用改简单的目标得到更好的数字。": "When the high-level reference exceeds the capabilities of the low-level, you can project to a more feasible target first, or reselect the position/attitude. Projection will change the original task reference, and tracking errors and deviations from the original target should be recorded at the same time to avoid changing simple targets to get better numbers.", "对象与底盘的力序列接口": "Force sequence interface between object and chassis", "人形先验与四足不同；移动取放和投球仍低成功；跨平台数字不能证明接口优劣。": "Humanoid rather than quadruped; dynamic and moving tasks remain difficult. Cross-platform outcomes cannot rank the action interfaces."};
  const exact = new Map(Object.entries(lexicon));
  const trie = {next: Object.create(null), value: null};
  for (const [source, target] of exact) {
    if (!source || source === target) continue;
    let cursor = trie;
    for (const character of source)
      cursor = cursor.next[character] ||= {next: Object.create(null), value: null};
    cursor.value = target;
  }
  function translate(value) {
    if (!/[\u3400-\u9fff]/u.test(value)) return value;
    const direct = exact.get(value.trim());
    if (direct) return value.slice(0, value.length - value.trimStart().length) + direct +
      value.slice(value.trimEnd().length);
    let output = '';
    for (let i = 0; i < value.length;) {
      let cursor = trie, best = null, end = i;
      for (let j = i; j < value.length && cursor.next[value[j]]; j++) {
        cursor = cursor.next[value[j]];
        if (cursor.value) { best = cursor.value; end = j + 1; }
      }
      if (best !== null) { output += best; i = end; }
      else { output += value[i]; i++; }
    }
    return output;
  }
  function rewriteLink(element) {
    if (element.tagName !== 'A' || !element.hasAttribute('href')) return;
    const href = element.getAttribute('href');
    if (href.startsWith('literature-map.html'))
      element.setAttribute('href', href.replace('literature-map.html', 'literature-map-en.html'));
    else if (href.startsWith('knowledge-network.html'))
      element.setAttribute('href', href.replace('knowledge-network.html', 'knowledge-network-en.html'));
  }
  function translateElement(element) {
    if (element.nodeType !== Node.ELEMENT_NODE || element.closest('[data-no-translate]')) return;
    rewriteLink(element);
    for (const attribute of ['title', 'aria-label', 'placeholder']) {
      const value = element.getAttribute(attribute);
      if (value) {
        const result = translate(value);
        if (result !== value) element.setAttribute(attribute, result);
      }
    }
  }
  function visit(root) {
    if (root.nodeType === Node.TEXT_NODE) {
      if (root.parentElement?.closest('script,style,noscript,[data-no-translate]')) return;
      const result = translate(root.nodeValue);
      if (result !== root.nodeValue) root.nodeValue = result;
      return;
    }
    if (root.nodeType !== Node.ELEMENT_NODE) return;
    if (root.matches('script,style,noscript,[data-no-translate]')) return;
    translateElement(root);
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.nodeType === Node.TEXT_NODE) {
        if (!node.parentElement?.closest('script,style,noscript,[data-no-translate]')) {
          const result = translate(node.nodeValue);
          if (result !== node.nodeValue) node.nodeValue = result;
        }
      } else translateElement(node);
    }
  }
  const observer = new MutationObserver(changes => {

  visit(document.body);
  observer.observe(document.body, {subtree:true, childList:true, characterData:true,
    attributes:true, attributeFilter:['title','aria-label','placeholder','href']});
  document.getElementById('i18n-hide')?.remove();
})();
