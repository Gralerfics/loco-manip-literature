ressions change the model and time interface and do not automatically solve the distribution problem of deployment status deviating from the demonstration.", "是所保留谐波项数，系数可随速度改变。若使用归一化相位": "is the number of harmonic terms retained, and the coefficient can change with the speed. If normalized phase is used", "一个速度跟踪任务对应可调的多种行为：用8维行为输入及相应奖励训练单一PPO策略，部署时修改行为参数而不是重新训练。": "A speed tracking task corresponds to a variety of adjustable behaviors: train a single PPO strategy with 8-dimensional behavioral inputs and corresponding rewards, and modify the behavioral parameters during deployment instead of retraining.", "$q$ 描述身体位置、朝向和各关节角度；$v$ 是身体与关节的速度，$\\dot v$ 是相应加速度。$M(q)$ 是把加速度换算成所需作用的惯量矩阵；$h(q,v)$ 汇总重力以及随运动产生的科氏、离心项。因此左边是模型根据当前运动计算出的所需广义力。": "$q$ describes the body position, orientation and angles of each joint; $v$ is the speed of the body and joints, $\\dot v$ is the corresponding acceleration. $M(q)$ is the inertia matrix that converts acceleration into the required action; $h(q,v)$ summarizes gravity and the Coriolis and centrifugal terms generated with motion. So the left hand side is the required generalized force calculated by the model based on the current motion.", "明确承接 Multi-Contact 的示范生成方法，增加受扰动后的反馈执行；学到示范中没有的重新抓住把手、滑移恢复。": "Clearly inherit the demonstration generation method of Multi-Contact, and add feedback execution after being disturbed; learn to re-grasp the handle and slip recovery that are not included in the demonstration.", "这些记号不表示每个引用系统同时实现所有通路，也不表示接触代理已经标定为物理力。": "These notations do not mean that each reference system implements all pathways simultaneously, nor does it mean that the contact agent has been calibrated to a physical force.", "运动学可达判断是否存在符合关节范围和碰撞条件的配置；动力学可行还要求某种控制在当前速度、接触、力矩限制下能实现；策略能力则问现有控制器能否可靠完成。机器人物理上能做，不表示当前策略会做。几何图、动态优化和经验控制能力估计分别回答这些层次。": "Kinematic reachability determines whether there is a configuration that meets the joint range and collision conditions; kinematic feasibility also requires that a certain control can be reali and G1 pushing boxes are all demonstrated on real robots; completion time, data volume/quality, and multi-modal demonstration ablation are mainly quantified in simulations. Spot inference is off-machine, and G1 inference is on-board; both use external motion capture to assist state estimation.", "IEEE Access 四足综述的参考文献元数据收录 RAMBO。": "Reference metadata collection of IEEE Access Quadruped Review RAMBO.", "参考进度反馈": "Reference progress feedback", "搬重物、开门时臂给身体的反作用力不能再当小扰动。输入是物体任务、机器人状态及接触估计；输出是物体运动、机械臂力与身体运动参考，再交给低层控制。": "When lifting heavy objects or opening doors, the reaction force exerted by the arm on the body can no longer be regarded as a small disturbance. The input is the object task, robot status and contact estimation; the output is the object movement, mechanical arm force and body movement reference, which are then handed over to low-level control.", "Go2＋AgileX NERO 七自由度臂＋专用平面侧向支撑架。": "Go2＋AgileX NERO seven-degree-of-freedom arm + special plane lateral support frame.", "五种仿真任务比较真实参数／固定先验／自适应估计；摩擦变化实验使用 15 对种子，实机推篮子从 3 增至 4 kg，地面从混凝土变为草坪。": "Five simulation tasks compare real parameters/fixed prior/adaptive estimation; the friction change experiment uses 15 pairs of seeds, the actual machine pushes the basket from 3 to 4 kg, and the ground changes from concrete to grass.", "阻抗规定受力与运动的关系；导纳通常以测得的外力生成运动参考。具体论文不一定同时保留虚拟质量、阻尼与刚度三项，正参数也不自动保证含延迟或切换的实机系统稳定。": "Impedance specifies the relationship between force and motion; admittance usually generates a motion reference based on measured external forces. Specific papers do not necessarily retain virtual mass, damping, and stiffness at the same time, and positive parameters do not automatically guarantee the stability of real-machine systems with delays or switching.", "教师聚合候选抓取特征，学生以双相机缓存、时间／来源编码、可靠性与 GRU 保存近期目标；输出 9 维末端／基座／夹爪目标，低层为腿 RL＋臂 IK。它记近期感知，不记录“按钮已按成功”等任务事件。": "The teacher aggregates the candidate grabbing features, and the student saves the recent target with dual camera cache, time/source encoding, reliability and GRU; outputs the 9-dimensional end/base/gripper target, and the lower layer is leg RL + arm IK. It records recent perceptions and does not record task events such as \"button pressed successfully\".", "位姿关键点与目标采样是可独立理解的方法，Dynamic Pick-and-Place明确借鉴关键点；目前核实的是一条局部表示继承，不是多支全身控制范式继承。": "Pose key points and target sampling are methods that can be understood independently, and Dynamic Pick-and-Place clearly draws on key points; what is currently verified is a local representation inheritance, not a multi-branch whole-body control paradigm inheritance.", "用单刚体模型解接触力分配 QP，再通过足端 Jacobian 得到前馈力矩；强化学习分别纠正身体加速度参考和关节位置参考。它的 QP 不等同于完整关节逆动力学的全身控制器。": "Use a single rigid body model to solve the contact force distribution QP, and then obtain the feedforward moment through the Jacobian of the foot; reinforcement learning corrects the body acceleration reference and joint position reference respectively. Its QP is not equivalent to that of a whole-body controller with complete joint inverse dynamics.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；轮式底盘没有四足起步抬腿与足接触切换；多数本库后作将其作系统／数据背景引用，未核到直接沿用其整套训练。": "The relationship between the actual undertaking and the background only is registered separately in literature/foundations.md; the wheeled chassis does not have four-legged starting, leg lifting and foot contact switching; most subsequent works of this library refer to it as a system/data background, and have not directly used its entire set of training.", "需要记录是否联合训练、共享奖励／观测、冻结哪些模块，以及部署动作维度。": "It is necessary to record whether joint training is performed, shared rewards/observations, which modules are frozen, and the deployment action dimensions.", "foottracking/teleop，operator视线到robot；onefixedlimb，不autonomousmask；noarm": "foottracking/teleop, operator sight to robot; onefixedlimb, not autonomousmask; noarm", "三个训练种子，每个 1000 个仿真回合；消融仅前馈、仅身体残差、仅关节残差以及去掉 QP。实机包括推车、托盘／柔软物体、地形与推扰、低增益握手。": "Three training seeds, 1000 simulation epochs each; ablate feedforward only, body residuals only, joint residuals only, and remove QP. The actual machine includes carts, pallets/soft objects, terrain and push interference, and low-gain handshakes.", "例子包括：多个系统把示范末端轨迹交给快速 RL，是共享分层机制；期望力经准静态刚度转换成位移与直接力奖励不能完全合并；多 critic 与多个执行 policy 也不能合并。判断‘本质一样’要达到接口和假设层，通常不需要证明两套系统所有参数完全等价。": "Examples include: multiple systems hand over the demonstration end-effector trajectory to fast RL, which is a shared hierarchical mechanism; the desired force is converted into displacement through quasi-static stiffness and the direct force reward cannot be completely merged; multiple critics and multiple execution policies cannot be merged. The judgment of \"essentially the same\" requires reaching the interface and hypothesis level. It is usually not necessary to prove that all parameters of the two systems are completely equivalent.", "Interactive Navigation §III-B.6明确following Visual WBC训练全身末端执行器；高层仍是学到的臂推物策略。": "Interactive Navigation §III-B.6 clearly follows Visual WBC to train the whole body end effector; the upper level still uses the arm pushing strategy learned.", "步动作；": "Step action;", "RRT提供物体路径，中央高层调物体子目标，去中心中层策略各自输出速度，底层走路；凸包内法向与子目标方向的奖励帮助找推物侧。": "RRT provides the object path, the central high-level adjusts the object sub-goal, the de-centered middle-level strategy outputs its own speed, and the bottom layer walks; rewards for the normal direction and sub-goal direction within the convex hull help find the side of the object.", "OpenVLA正文明确以Open X-Embodiment约970k轨迹训练视觉语言到动作模型。": "The text of OpenVLA clearly uses about 970k trajectories of Open X-Embodiment to train the visual language to action model.", "MPC 假设下层走路策略会按指令移动，但真实响应随步态相位、足接触和载荷而变；即使规划器同时算底盘与手，手的世界坐标仍会偏。": "MPC assumes that the underlying walking strategy will move as instructed, but the true response varies with gait phase, foot contact, and load; even if the planner calculates the chassis and hand at the same time, the hand's world coordinates will still be biased.", "历史编码速度、持续对象 ID、阶段计时和任务事件记忆可以都叫 memory，但保存和验证的变量不同。": "History encoding speed, persistent object ID, stage timing and task event memory can all be called memory, but the variables saved and verified are different.", "是法向压缩力，": "is the normal compression force,", "检测＋站位＋规划": "Detection + Site + Planning", "训练时actor读取部署可得的RGB-D观察，critic读取仿真的完整状态；只有actor用于真机动作生成。": "During training, the actor reads the RGB-D observations available for deployment, and the critic reads the complete status of the simulation; only the actor is used for real robot action generation.", "$\\lambda$实际按预定线性方案由0增到1；原文先写乘子梯度上升，再报告该实际安排。不是依据表示误差自动更新权重，也不能由引用BADMM推得神经网络PPO训练的凸优化收敛保证。": "$\\lambda$ actually increases from 0 to 1 according to the predetermined linear plan; the original article first writes the multiplier gradient rise, and then reports the actual arrangement. The weights are not automatically updated based on the representation error, nor can the convex optimization convergence guarantee of neural network PPO training be derived by referring to BADMM.", "。在模型准确、没有其他未知作用时，可以解释为环境沿该关节正方向提供了助力；若环境阻碍，则残差可为负。未建模的摩擦也可能造成同样的差值。": ". When the model is accurate and there are no other unknown effects, it can be explained that the environment provides assistance in the positive direction of the joint; if the environment hinders, the residual can be negative. Unmodeled friction can also cause the same difference.", "G1人形；全身接触操作、关节力矩混合执行": "G1 humanoid; full body contact operation, joint torque mixed execution", "是半径为": "is the radius of", "是手端到世界的位姿变换，": "is the pose transformation from the hand to the world.", "真机示教长任务费时；直接从相机图像练习长任务，学习很难找到成功动作。": "Teaching long tasks with a real robot is time-consuming; practicing long tasks directly from camera images makes it difficult to find successful actions in learning.", "目标需在机器人运动范围内。局部逆运动学、关节限位和碰撞处理不能彼此替代。": "The target needs to be within the robot's motion range. Local inverse kinematics, joint limits, and collision handling are not substitutes for each other.", "四足＋臂": "Quadruped + arm", "按当前实际姿态和运动计算，而不是只按期望运动计算；": "Calculate based on the current actual posture and movement, instead of only calculating based on the expected movement;", "身体和操作端共同完成任务。": "The body and the operating end work together to complete the task.", "真机每轮开始人工点击目标，至少一相机需要看见目标；分割深度丢失很多颜色语义。抓取闭合时训练要求基座停止；部分固定的参考系并非完整世界固定接触控制，更未给出换步中接触力安全保证。": "The real robot manually clicks on the target at the beginning of each round, and at least one camera needs to see the target; the segmentation depth loses a lot of color semantics. The training requires the base to stop when the grasp is closed; the partially fixed reference system is not a complete world fixed contact control, nor does it provide a safety guarantee for the contact force during step changes.", "【模拟与结构化预测】原文比较两个模仿学习任务及序列标注；未做四足真机。": "[Simulation and Structured Prediction] The original text compares two imitation learning tasks and sequence annotation; no four-legged real robot is used.", "§III-A 腿／臂协作接口": "§III-A Leg/Arm Cooperation Interface", "示范动作分布与任务轨迹": "Demonstration action distribution and task trajectory", "须能在目标机器人仿真器中收集大量覆盖策略访问状态的转移，且模型短时多步预测误差足够小；策略不能靠模型系统性漏掉的接触或碰撞取得虚假高分。": "The target robot simulator must provide transitions covering states visited by the policy, and short-horizon model prediction must be accurate enough. A policy can exploit systematically missed collisions or contacts and obtain high predicted return without improving physical behavior.", "恢复总览": "Reset overview", "ETH Multi-Contact 在离散接触图上搜索，再联合优化连续片段；RoLoMa 主要在指定接触阶段中提高抗扰余量。预测接触区域、选择肢体角色和搜索完整接触顺序彼此有关，但不能互相代替。": "ETH Multi-Contact searches on the discrete contact graph and then jointly optimizes the continuous segments; RoLoMa mainly improves the anti-interference margin in the specified contact phase. Predicting contact areas, selecting body roles, and searching for complete contact sequences are related to each other, but are not substitutes for each other.", "正文 §III/IV/V method、CMDP前提、全部experimentablation审读；无另附录": "Text §III/IV/V method, CMDP prerequisites, all experimentalablation review; no additional appendices", "准静态补偿位置": "Quasi-static compensation position", "grasp detector 与 GORM": "grasp detector and GORM", "Guided RL 主要解决给定示范周围的反馈执行；不会因为能重新抓住就自动拥有任意接触顺序搜索。": "Guided RL primarily addresses feedback enforcement around a given demonstration; does not automatically have arbitrary contact order search just because it can be recaptured.", "比较冻结底层与联合微调，确保高层目标一致；测试低层误差积累、越界命令和恢复。": "Compare freezing the bottom layer with joint fine-tuning to ensure consistent high-level goals; test low-level error accumulation, out-of-bounds commands and recovery.", "例如静止时模型需要": "For example, when the model is stationary, it needs", "联合策略的精确末端姿态跟踪仍困难；又希望保留已经练好的走路能力。": "The precise end pose tracking of the joint strategy is still difficult; and we hope to retain the walking ability that we have already practiced.", "力跟踪与精度边界": "Force tracking and accuracy boundaries", "视觉模型可以直接生成关节动作，也可以生成手端参考交给快速控制器，或选择技能／目标交给已有规划器和技能。": "The visual model can directly generate joint movements, or it can generate hand-side references and pass them to the fast controller, or select skills/goals and pass them to existing planners and skills.", "全部技术路线": "All technical routes", "轨迹跟踪把状态拉向给定参考；自适应进度允许放慢、暂停或倒退参考时间，使当前动作与实际物体状态重新对齐。Guided RL 在规划示范周围学习全身反馈和进度调整，这与另算一条全新接触计划不同。": "Trajectory tracking pulls state toward a given reference; adaptive progress allows slowing down, pausing, or reversing reference time to realign current actions with actual object states. Guided RL learns whole-body feedback and progress adjustments around planning demonstrations, unlike calculating a completely new contact plan.", "分别测规划耗时、在线求解频率、执行误差和扰动后重规划成功率；不要把离线可行轨迹等同于真机稳定执行。": "Measure the planning time, online solution frequency, execution error and re-planning success rate after disturbance respectively; do not equate the offline feasible trajectory with the stable execution of the real robot.", "82.2%为仿真完成＋力指令＋测得力联合标准；真机报告趋势与误差，擦拭MAE7N，不是力目标精确实现。示例不能证明持续行走接触；三任务使用各自FCT。": "82.2% is the joint standard of simulation completion + force command + measured force; the real robot reports trends and errors, and wipes MAE7N, which does not mean the force target is accurately achieved. Example does not demonstrate sustained walking contact; three tasks use their own FCT.", "【多真实机器人数据和评估】论文报告527种技能及跨机器人测试；ICRA 2024。具体机器人与任务分布不等同于四足移动操作覆盖。": "[Multi-real robot data and evaluation] The paper reports 527 skills and cross-robot testing; ICRA 2024. Specific robot and task distribution are not equivalent to quadrupedal mobile operation coverage.", "正文 §III/IV/V方法结果完整审读；没有arm，无另附录": "Text §III/IV/V method results complete review; no arm, no additional appendix", "多台 Go1，无臂；机身共同推物，外部动捕": "Multiple Go1s, no arms; the body pushes objects together, external motion capture", "机器人同时受反作用 $w_{O\\to R}$。第二式要求二者在同一坐标系、同一参考点表达；更换坐标系或力矩原点必须进行相应力旋量变换。": "The robot is simultaneously affected by the reaction $w_{O\\to R}$. The second formula requires that the two be expressed in the same coordinate system and the same reference point; when changing the coordinate system or the origin of the moment, the corresponding force-spin transformation must be performed.", "是选定任务坐标下的末端速度，": "is the terminal speed under the selected task coordinates,", "131、233、258示教的离线抓取动作预测末端误差68.7、48.2、47.8mm；Go2＋Piper实机仅定性片段，没有成功率统计。": "Held-out offline grasp-action end-effector errors for 131/233/258 demonstration sets: 68.7/48.2/47.8 mm. Go2–Piper hardware is shown qualitatively; no real-robot success-rate statistics.", "已核实的直接下游": "Verified downstream use", "以设定的刚度、阻尼把测得外力转换为末端速度，并扣除身体运动来计算臂速度；参考管理器调整可能违反位置、速度、力及运动学边界的目标，另用状态估计改善身体速度反馈。": "Use the set stiffness and damping to convert the measured external force into terminal velocity, and deduct the body motion to calculate the arm speed; refer to the manager to adjust targets that may violate the boundaries of position, velocity, force, and kinematics, and use state estimation to improve body velocity feedback.", "所谓比旧方法快10倍跨论文任务／观测／平台不同，不能作严格同条件排名。真机依赖Vicon，物体形态主要盒／圆柱；2.3 kg为训练范围，实机因夹爪安全限制只测到1.3 kg。主要失败是抓取滑落／弹出，二值夹爪不能连续调力，棱角接触仿真差异明显。": "It is said to be 10 times faster than the old method. The tasks/observations/platforms of different papers are different and cannot be ranked strictly under the same conditions. The real robot relies on Vicon, and the object shape is mainly box/cylinder; 2.3 kg is the training range, and the real robot only measures 1.3 kg due to the safety limit of the gripper. The main failure is that the gripper slips/pops out, the binary gripper cannot adjust the force continuously, and the simulation of edge and corner contact is obviously different.", "综述收录": "Covered by survey", "§3／实验": "§3／Experiment", "学生需要在自身行为产生的观测分布上训练／纠偏；只在理想教师轨迹上拟合可能遭遇分布漂移。": "Students need to train/correct on the observation distribution generated by their own behavior; fitting only on the ideal teacher trajectory may encounter distribution drift.", "先写同一子任务对照表，再决定可复现哪些基线。不可直接对比的条目保留其条件，不给统一排行榜。": "First write a comparison table for the same subtask, and then decide which baselines can be reproduced. Entries that are not directly comparable will retain their conditions and will not be given a unified ranking.", "21机构汇集22种机器人数据，统一格式并用RT-X模型测试跨机器人训练的正迁移；贡献同时在数据整理和跨本体预训练，不是一个单一的底盘控制器。": "21 organizations collect 22 types of robot data, unify the format and use the RT-X model to test the positive transfer of cross-robot training; the contribution is both in data sorting and cross-ontology pre-training, not a single chassis controller.", "Tactile-aware 的低层训练沿用 UMI on Legs 的部分设置。": "The low-level training of Tactile-aware follows some settings of UMI on Legs.", "这是信息内容的分类，不能只写一个元组就当作统一模型。语义 mask、区域中心、真实接触点和隐式 token 的精度及用途不同。": "This is a classification of information content. You cannot just write a tuple and treat it as a unified model. Semantic masks, area centers, real contact points, and implicit tokens have different precisions and uses.", "使用完全相同的手端任务，比较关节裕量、身体移动量、后续轨迹完成率，而不只比较当前点的误差。": "Use the exact same hand-held task to compare joint margin, body movement, and subsequent trajectory completion rate, instead of just comparing the error at the current point.", "复用Visual WBC的部署工程整理，不以新控制／学习机制为主要贡献；保留作实现资料。": "Reuse the deployment project of Visual WBC and do not use the new control/learning mechanism as the main contribution; it is reserved for implementation data.", "移动操作知识网络": "Mobile Manipulation Knowledge Network", "示范策略→任务坐标系末端轨迹→全身跟踪": "Demonstration strategy→Task coordinate system end-effector trajectory→Full body tracking", "RaiSim 中用 4000 个目标比较精度与工作空间；真机实际部署简化版 PAKE-S，8 类任务共 24 次，含拉车、扫地、插充电器、挂衣架。动捕测得平均末端位置误差约 4.5 cm、姿态误差约 0.14 rad；完整 PAKE 相对 PAKE-S 的进一步增益来自仿真。UMI on Legs 基线改用随机轨迹和身体坐标跟踪，不能当作原方法完整接口的直接排名。它仍是任务空间跟踪器，不直接解决语义决策或接触力安全。": "4000 targets are used in RaiSim to compare accuracy and work space; a simplified version of PAKE-S is actually deployed on a real robot, with a total of 24 tasks in 8 categories, including pulling a car, sweeping the floor, plugging in a charger, and hanging a clothes rack. The average end position error measured by motion capture is about 4.5 cm, and the attitude error is about 0.14 rad; the further gain of complete PAKE relative to PAKE-S comes from simulation. The UMI on Legs baseline uses random trajectories and body coordinate tracking instead, and cannot be regarded as a direct ranking of the complete interface of the original method. It is still a task space tracker and does not directly address semantic decision making or contact force safety.", "WildLMa、UMI on Legs等引用作语言／技能背景；不登记直接承接。": "WildLMa, UMI on Legs, etc. are cited as language/skill background; directly accepted without registration.", "所有集合都应在同一候选站位或配置空间内定义。各项分别表示导航可达、臂可操作、视野、碰撞与后续任务条件；$\\mathcal C_{\\mathrm{start}}$ 是满足这些条件的操作起始集合。": "All sets should be defined within the same candidate site or configuration space. Each item represents navigation reachability, arm operability, field of view, collision and subsequent task conditions respectively; $\\mathcal C_{\\mathrm{start}}$ is the start set of operations that meet these conditions.", "多机器人数据集有明显平台与任务偏差；把新四足平台加入后仍需接口适配和实机验证。": "The multi-robot data set has obvious platform and task deviations; after adding the new quadruped platform, interface adaptation and actual machine verification are still required.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；行走训练速度突破不等于本文设计了loco-manipulation的奖励、接触安排或手端控制。": "The relationship between actual undertaking and background only is registered separately in literature/foundations.md; walking training speed breakthrough does not mean that this article designed loco-manipulation rewards, contact arrangements or mobile control.", "【真机＋仿真；强实验】机载系统在实验室、室内大厅及户外与人对打，记录10拍连续回合；真机速度最高12.06 m/s。仿真分开到点、含感知误差的截击、能耗、critic信息和电流约束消融；部分击球成功区域在真机验证。Fig.7主要约束与学习曲线来自仿真，不能全部当真机统计。": "[real robot + simulation; strong experiment] The airborne system fights with people in the laboratory, indoor halls and outdoors, recording 10 consecutive rounds; the maximum speed of the real robot is 12.06 m/s. The simulation is separated to point, volley with perception error, energy consumption, critic information and current constraint ablation; some successful hitting areas are verified on the real robot. The main constraints and learning curves in Fig.7 come from simulation and cannot all be taken as real robot statistics.", "语言相关性与技能可行性联合选择": "Joint selection of language relevance and skill feasibility", "PPO/teacher distillation 与 RL腿＋IK臂接口属 VBC 同族；共享结构不独立推断作者直接继承关系；主要增量是退化观测处理及教师抓取特征，而非发现新的机械臂动力学": "PPO/teacher distillation and RL leg + IK arm interface belong to the same family as VBC; the shared structure does not independently infer the author's direct inheritance relationship; the main increment is the degradation observation processing and teacher grabbing features, rather than the discovery of new robot arm dynamics", "视觉或位置不足以描述物理接触。": "Visual or location is insufficient to describe physical contact.", "实际承接与仅作背景的关系分开登记在literature/foundations.md；经常被后作当作腿式地形背景引用，不能据此画成它们的具体策略、奖励或地形编码直接继承。": "The relationship between the actual inheritance and the background only is registered separately in literature/foundations.md; it is often referenced as a legged terrain background in subsequent works, and their specific strategies, rewards or terrain codes cannot be directly inherited based on this.", "regularizationweight实际增加0.15→0.24，不是decay；overviewword与正文不一致；noexplorationrewardextra0%不是主要baseline设定；dishwashercontactswitch不要无证写真机": "The regularization weight actually increases by 0.15→0.24, which is not a decay; the overview word is inconsistent with the text; noexplorationrewardextra0% is not the main baseline setting; dishwashercontactswitch does not require unlicensed photo machines", "图像历史与语言任务进入Transformer，输出离散化的低层动作token。": "Image history and language tasks enter the Transformer and output discretized low-level action tokens.", "臂动力学近似的实例": "Example of arm dynamics approximation", "将身体、末端、夹爪等可对应模态独立tokenize，共享策略主干，用人VR示范预训练，换机器人时重建形态特定stems并mask缺失模态；model-based LocoMan负责执行，使结构知识迁移与motor执行分开。": "Tokenize the corresponding modes of the body, end, gripper, etc. independently, share the backbone of the strategy, use human VR demonstration for pre-training, reconstruct the form-specific stems and mask the missing modes when changing robots; model-based LocoMan is responsible for execution, separating structural knowledge transfer from motor execution.", "方法／真实地形实验": "Method/Real Terrain Experiment", "$\\hat s_t$ 是模型预测的机器人状态，$a_t$ 是策略动作；$f_\\omega$ 是由仿真转移训练出的可微模型，$\\xi$ 是仿真摩擦、校准偏差等条件，$g_t$ 是目标动作，$o_t$ 是策略可用观测。": "$\\hat s_t$ is the robot state predicted by the model, $a_t$ is the strategic action; $f_\\omega$ is the differentiable model trained by simulation transfer, $\\xi$ is the simulation friction, calibration deviation and other conditions, $g_t$ is the target action, $o_t$ is the available observation of the strategy.", "身体移动时，怎样保持手端操作？": "How can manipulation continue while the body moves?", "全图": "Full picture", "训练面向单足末端位置目标的策略，要求同时抵抗足端相互作用力、身体扰动和滑动接触。与普通抬腿触物相比，任务空间指令可持续驱动机器人移动到目标附近。": "Training strategies for single-foot end position goals that require simultaneous resistance to end-foot interaction forces, body perturbations, and sliding contact. Compared with ordinary lifting of legs to touch objects, task space instructions can continuously drive the robot to move near the target.", "是低层可读取的未来参考序列，": "is a future reference sequence readable by the lower layer,", "靠近对象、选可抓取站位、选全段机构动作可执行站位不能用同一个导航成功指标比较。": "Approaching the object, selecting the grabbing position, and selecting the entire mechanism action executable position cannot be compared with the same navigation success indicator.", "固定原始示范数量，分开消融锚点、优化和过滤，测生成成功率、姿态覆盖、计算量与真机表现。": "Fixed the number of original demonstrations, separately ablated anchor points, optimized and filtered, and measured the generation success rate, posture coverage, calculation amount and real robot performance.", "PADP 用优化将预训练步态策略的关节动作映射到满足动力学／接触条件的全身变量，再通过一个统一 QP 加入操作任务；目标是不重训底层策略也能保留模型控制的显式约束。": "PADP uses optimization to map the joint movements of the pre-trained gait strategy to whole-body variables that meet the dynamics/contact conditions, and then adds the operation task through a unified QP; the goal is to retain the explicit constraints of model control without retraining the underlying strategy.", "三者是数据与部署条件的并行选择，不是统一实验中的逐年替代；DemoHLM明确复用MimicGen，DiPLO明确复用DynaRetarget。": "The three are parallel selections of data and deployment conditions, not year-by-year replacements in unified experiments; DemoHLM explicitly reuses MimicGen, and DiPLO explicitly reuses DynaRetarget.", "多目标奖励与多评价网络不等于多个物理机制": "Reward conflicts and multiple critics", "视觉动作选择之后，QuadWBG 进一步显式利用抓取姿态与站位可达关系。": "After visual action selection, QuadWBG further explicitly utilizes the relationship between grasping posture and station reachability.", "轮足邻接，14 维含四个补位维度；表示解耦不取消物理耦合。未通过未来视频实施显式在线 MPC 搜索，数据统计又含不同子集范围；预测误差降低不能自动推成接触更安全或任务成功显著更高。": "Wheel adjacency, 14 dimensions including four complementary dimensions; indicates that decoupling does not cancel physical coupling. No explicit online MPC search was implemented through future videos, and the data statistics contain different subset ranges; reduced prediction error does not automatically translate into safer contacts or significantly higher mission success.", "投掷时夹爪开始张开和物体真正脱离之间有延迟，而且摩擦、变形使每次延迟不同。只在预定某一瞬间达到正确速度，不能保证物体在稍早或稍晚脱离时仍到达目标。": "When throwing, there is a delay between the claws starting to open and the object actually breaking away, and friction and deformation make each delay different. Only reaching the correct speed at a predetermined moment does not guarantee that the object will still reach the target if it escapes earlier or later.", "只看到当前目标，控制器要等误差出现才调整身体。手端即将离开当前工作范围时，可能已经来不及迈步或改变姿态。": "Only sees the current target, and the controller has to wait for errors to appear before adjusting the body. When the mobile device is about to leave the current working range, it may be too late to take steps or change posture.", "把预计推物时间加入导航路径成本": "Add the estimated push time to the navigation path cost", "身体移动会改变相机画面；把画面变化都当成臂操作效果，会使动作和未来画面预测混淆。": "Body movement will change the camera picture; treating picture changes as arm operation effects will confuse actions with future picture predictions.", "附录 E 仿真 standing/walking 位置误差分别为 0.047/0.029 m，对 Deep WBC 对照 0.236/0.414 m；支持该低层参数化与配方的目标跟踪收益，非真机接触精度测量；真机 14 个对象×3 高度×5 resets；每轮允许连续五次尝试，指标不是单次动作 one-shot 成功率；不分层的文内配置成功为零，支持该配置训练困难，不证明所有端到端系统不可能；视觉 6–8 Hz、腿 50 Hz、臂 IK 800 Hz；任务低/高频分工在部署中实际存在": "Appendix E The simulated standing/walking position errors are 0.047/0.029 m respectively, compared with 0.236/0.414 m for Deep WBC; target tracking gains that support this low-level parameterization and recipe, non-real robot contact accuracy measurement; real robot 14 objects × 3 height × 5 resets; each round allows five consecutive attempts, the indicator is not a single action one-shot Success rate; zero success for non-layered in-text configuration, training to support this configuration is difficult, not proven impossible for all end-to-end systems; vision 6–8 Hz, legs 50 Hz, arm IK 800 Hz; low/high frequency division of tasks actually exists in deployment", "在同一机器人、目标和训练预算下比较联合、协作与分工；报告学习速度、腿／臂各自误差和受扰动后的行为。": "Compare jointness, collaboration, and division of labor under the same robot, goal, and training budget; report learning speed, individual leg/arm errors, and perturbed behavior.", "§4.2 cart pushing真机实验及§4.4 LMO消融": "§4.2 cart pushing real robot experiment and §4.4 LMO ablation", "需要可随时查询的专家，机器人上可能需要昂贵的遥操作或仿真教师；不自动提供安全访问状态的机制。": "Requires experts who can be consulted at any time, may require expensive teleoperation or simulation teachers on the robot; does not automatically provide a mechanism for secure access to status.", "语言拆子目标后用 SAM2 mask／深度反投影和 ego-motion KF 更新目标，AAM 使目标居中并维持工作空间 stand-off。220 Hz 主从 MIT 控制记录从臂目标轨迹／速度；ACT 同时预测位置、速度，加入有限差分一致性损失。": "Use SAM2 mask/depth backprojection and ego-motion KF to update the target after the language splits the subtarget, and AAM to center the target and maintain the workspace stand-off. 220 Hz master-slave MIT controls and records the target trajectory/speed of the slave arm; ACT simultaneously predicts position and speed, adding finite difference consistency loss.", "导航输入预建地图、已知可移动障碍及目标位置；推物策略读取物体／目标／末端状态和历史，原始输出6个臂关节增量。扩展全身执行时，由该动作产生末端参考，再交给按Visual WBC训练的低层跟踪器。": "Navigation inputs pre-built maps, known movable obstacles and target positions; push-object strategy reads object/target/end state and history, and original outputs 6 arm joint increments. When extending the whole body execution, the end reference is generated from the action and then handed over to the low-level tracker trained according to Visual WBC.", "ETH Multi-Contact 用离散接触搜索和连续优化；RAMBO 的 QP 计算当前前馈；Sumo 在预测内运行已有策略。三者所决定的变量不同。": "ETH Multi-Contact uses discrete contact search and continuous optimization; RAMBO’s QP calculates current feedforward; Sumo runs existing strategies within predictions. The variables determined by the three are different.", "贡献是可解释的行为空间及“不重新训练、改行为输入”的迁移路线，不是首次提出步态参数、PPO、课程、系统辨识或域随机化；也不是无监督自动发现技能。论文明确借鉴双足接触奖励、Raibert和既有执行器／适应方法。它保留了一个任务的多种解，可将高层任务接到已有行为接口上。": "The contribution is the interpretable behavior space and the migration route of \"no retraining, changing behavioral input\". It is not the first time to propose gait parameters, PPO, courses, system identification or domain randomization; nor is it the unsupervised automatic discovery of skills. The paper explicitly draws on bipedal contact rewards, Raibert, and existing actuator/adaptation methods. It retains multiple solutions for a task and can connect high-level tasks to existing behavioral interfaces.", "移动操作 · 知识网络": "Mobile Operation · Knowledge Network", "个知识条目": " concepts", "$v_E$ 是选定任务坐标下的末端速度，$v_E^d$ 是期望速度，$J_E$ 是任务 Jacobian，$\\dagger$ 表示 Moore–Penrose 伪逆；$z$ 是次级姿态调整。": "$v_E$ is the terminal velocity at the selected mission coordinates, $v_E^d$ is the desired velocity, $J_E$ is the mission Jacobian, $\\dagger$ represents the Moore–Penrose pseudo-inverse; $z$ is the secondary attitude adjustment.", "给定步态／手接触时序及操作目标，MPC滚动优化身体、足、手和物体运动；低层全身控制跟踪优化结果。": "Given the gait/hand contact timing and operation target, MPC rolling optimizes body, foot, hand and object movements; low-level whole-body control tracks the optimization results.", "将高层操作与机器人本体动作解耦，用带未来预览的末端轨迹连接示范和全身控制。CMP实际沿用数据／训练设置并研究能力边界；Tactile-aware沿用部分低层设置。这是可以更换高层任务而继续使用的接口。": "Decouple high-level operations from robot body movements, and use end trajectories with future preview to connect demonstration and whole-body control. CMP actually uses data/training settings and studies capability boundaries; Tactile-aware uses some low-level settings. This is an interface that can be used while replacing high-level tasks.", "已阅读单刚体（SRB）和步态预备知识、全部方法小节、定量／真机对比、柔顺实验、结论和表格。": "Have read the preliminaries of single rigid body (SRB) and gait, all method sections, quantitative/real
